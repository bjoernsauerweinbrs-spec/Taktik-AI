<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni 2.0 – Taktikboard</title>

    <style>
        :root {
            --green: #2ecc71;
            --green-dark: #27ae60;
            --bg-dark: #050608;
            --bg-panel: #111319;
            --bg-panel-light: #191b23;
            --line: rgba(255,255,255,0.12);
            --text-light: rgba(255,255,255,0.9);
            --shadow-strong: 0 18px 40px rgba(0,0,0,0.65);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #1b2333 0, #050608 55%);
            color: var(--text-light);
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: 100vh;
            gap: 12px;
            padding: 12px;
        }

        /* --- SIDEBAR & CHAT FIX --- */
        #chat-sidebar {
            background: linear-gradient(145deg, #10121a, #151824);
            border-radius: 18px;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-strong);
            height: 100%; /* Wichtig, damit es nicht wächst */
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 18px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--green);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: radial-gradient(circle at top left, #1f2937 0, #050608 70%);
            border-radius: 18px 18px 0 0;
            flex-shrink: 0;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto; /* Chat scrollt intern */
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg { padding: 10px 12px; border-radius: 14px; font-size: 0.9rem; line-height: 1.45; max-width: 92%; }
        .msg.user { align-self: flex-end; background: linear-gradient(135deg, #2563eb, #38bdf8); color: white; border-bottom-right-radius: 4px; }
        .msg.toni { align-self: flex-start; background: #1f2937; border: 1px solid rgba(148,163,184,0.4); border-bottom-left-radius: 4px; }

        #status { font-size: 0.7rem; text-align: center; color: #9ca3af; padding: 4px 0; }

        .chat-input-row {
            padding: 12px;
            background: #050712;
            border-radius: 0 0 18px 18px;
            border-top: 1px solid rgba(148,163,184,0.25);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input-row input { flex: 1; background: #020617; color: white; border: 1px solid #374151; padding: 9px 10px; border-radius: 8px; }
        .chat-input-row button { border: none; cursor: pointer; border-radius: 8px; padding: 9px 11px; background: var(--green); font-weight: 600; }

        /* --- SPIELFELD FIX --- */
        #pitch-area {
            background: linear-gradient(145deg, #0b1120, #020617);
            border-radius: 18px;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-shadow: var(--shadow-strong);
            height: 100%;
        }

        #pitch {
            flex: 1;
            background: repeating-linear-gradient(90deg, #166534 0, #166534 8%, #15803d 8%, #15803d 16%);
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .m-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.5); }
        .m-circle { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); }

        .player, #ball { position: absolute; cursor: grab; z-index: 100; transition: all 0.8s cubic-bezier(0.2, 0.7, 0.3, 1); }
        .player { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: white; box-shadow: 0 10px 18px rgba(0,0,0,0.8); }
        .home { background: radial-gradient(circle at 30% 20%, #f87171, #b91c1c); border: 2px solid white; }
        .away { background: radial-gradient(circle at 30% 20%, #60a5fa, #1d4ed8); border: 2px solid white; }
        #ball { width: 18px; height: 18px; background: white; border-radius: 50%; border: 2px solid black; }

        /* --- WHITEBOARD PANEL --- */
        #whiteboard-panel {
            position: fixed; top: 0; right: -380px; width: 360px; height: 100vh;
            background: #fff; color: #020617; border-left: 2px solid #d1d5db;
            transition: right 0.35s ease; z-index: 3000; display: flex; flex-direction: column; padding: 15px;
            box-shadow: -12px 0 30px rgba(0,0,0,0.6);
        }
        #whiteboard-panel.open { right: 0; }
        #player-list { flex: 1; padding: 10px; font-family: monospace; font-size: 1.1rem; border-radius: 8px; border: 1px solid #ccc; }

        /* --- LOGIN --- */
        #login-overlay { position: fixed; inset: 0; background: #050608; display: flex; align-items: center; justify-content: center; z-index: 4000; }
        .login-card { background: #111827; padding: 32px; border-radius: 20px; border: 1px solid var(--green); text-align: center; width: 320px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="color:var(--green)">⚽ COACH TONI 2.0</h2>
        <input type="password" id="password" placeholder="Passwort (Trainer2026)" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px;">
        <input type="text" id="user-key" placeholder="Groq API-Key" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px;">
        <button id="login-btn" style="width:100%; padding:12px; background:var(--green); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">SYSTEM STARTEN</button>
    </div>
</div>

<div id="layout">
    <aside id="chat-sidebar">
        <header class="chat-header">TRAINER-KOMMANDO</header>
        <div id="chat-history"></div>
        <div id="status">Ready</div>
        <div class="chat-input-row">
            <button id="mic-btn">🎤</button>
            <input type="text" id="user-input" placeholder="Befehl...">
            <button id="send-btn">OK</button>
        </div>
    </aside>

    <main id="pitch-area">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <button onclick="resetFormation()" class="toolbar-btn" style="background:var(--green); border:none; padding:8px 15px; border-radius:20px; font-weight:bold; cursor:pointer;">♻ Grundordnung</button>
            <div>
                <button id="voice-btn" class="toolbar-btn" style="background:#111827; color:white; border:1px solid #333; padding:8px 15px; border-radius:20px; cursor:pointer;">🔊 Stimme</button>
                <button id="whiteboard-open" class="toolbar-btn" style="background:#111827; color:white; border:1px solid #333; padding:8px 15px; border-radius:20px; cursor:pointer;">📋 Kader</button>
            </div>
        </div>
        <div id="pitch">
            <div class="m-line"></div><div class="m-circle"></div>
            <div id="ball" style="left:50%; top:50%;"></div>
            <div id="players-layer"></div>
        </div>
    </main>

    <section id="whiteboard-panel">
        <h3>📋 Kaderliste</h3>
        <textarea id="player-list" oninput="syncNames()" placeholder="Beispiel: 1 Mike"></textarea>
        <button id="whiteboard-close" style="margin-top:10px; padding:10px; cursor:pointer;">✖ Schließen</button>
    </section>
</div>

<script>
    let GROQ_KEY = "";
    let voiceEnabled = true;

    /* LOGIN */
    document.getElementById("login-btn").onclick = () => {
        const pw = document.getElementById("password").value.trim();
        const key = document.getElementById("user-key").value.trim();
        if (pw === "Trainer2026" && key !== "") {
            GROQ_KEY = key;
            document.getElementById("login-overlay").style.display = "none";
            resetFormation();
        } else { alert("Passwort oder Key prüfen!"); }
    };

    /* KADER SYNC (1Mike Logik) */
    function syncNames() {
        const list = document.getElementById("player-list").value;
        document.querySelectorAll(".player.home").forEach(p => p.innerText = p.id.replace('home',''));
        list.split('\n').forEach(line => {
            const m = line.match(/^(\d+)\s*(.*)$/);
            if (m) {
                const el = document.getElementById("home" + m[1]);
                const name = m[2].trim().split(' ')[0];
                if (el && name) el.innerText = name;
            }
        });
    }

    /* DRAG LOGIK */
    let dragged = null;
    function makeDraggable(el) {
        el.onmousedown = (e) => { dragged = el; el.style.transition = "none"; };
    }
    document.onmousemove = (e) => {
        if (!dragged) return;
        const r = document.getElementById("pitch").getBoundingClientRect();
        dragged.style.left = Math.max(0, Math.min(96, ((e.clientX - r.left) / r.width) * 100)) + "%";
        dragged.style.top = Math.max(0, Math.min(95, ((e.clientY - r.top) / r.height) * 100)) + "%";
    };
    document.onmouseup = () => { if(dragged) dragged.style.transition = "all 0.8s ease"; dragged = null; };

    /* SPIELER ERZEUGEN */
    function createPlayer(num, team, x, y) {
        const p = document.createElement("div");
        p.className = "player " + team; p.id = team + num;
        p.textContent = num; p.style.left = x + "%"; p.style.top = y + "%";
        makeDraggable(p);
        document.getElementById("players-layer").appendChild(p);
    }

    function resetFormation() {
        document.getElementById("players-layer").innerHTML = "";
        const home = [[1,5,50],[2,22,20],[4,22,40],[5,22,60],[3,22,80],[6,45,30],[8,45,70],[10,65,50],[7,80,20],[11,80,80],[9,85,50]];
        const away = [[1,93,50],[4,78,40],[5,78,60],[2,70,15],[3,70,85],[6,55,50],[8,40,30],[10,40,70],[7,30,20],[11,30,80],[9,25,50]];
        home.forEach(p => createPlayer(p[0], "home", p[1], p[2]));
        away.forEach(p => createPlayer(p[0], "away", p[1], p[2]));
        makeDraggable(document.getElementById("ball"));
    }

    /* VOICE OUTPUT */
    function speak(text) {
        if (!voiceEnabled) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "de-DE"; u.pitch = 0.8; u.rate = 1.0;
        window.speechSynthesis.speak(u);
    }

    /* CHAT LOGIK */
    async function askToni() {
        const input = document.getElementById("user-input");
        const text = input.value.trim(); if (!text) return;
        addMessage(text, "user"); input.value = "";
        document.getElementById("status").textContent = "Toni analysiert...";

        const system = "Du bist Toni, Co-Trainer von Björn (BVB). Antworte als Mix aus Klopp & Nagelsmann. Nutze MOVE[ID,X,Y] für Taktik.";
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST", headers: { "Authorization": "Bearer " + GROQ_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role:"system", content:system}, {role:"user", content:text}] })
            });
            const data = await res.json();
            const answer = data.choices[0].message.content;
            addMessage(answer.replace(/MOVE\[.*?\]/g, ""), "toni");
            speak(answer.replace(/MOVE\[.*?\]/g, ""));
            
            const moves = [...answer.matchAll(/MOVE\[(\w+),(\d+),(\d+)\]/g)];
            moves.forEach(m => {
                const el = document.getElementById(m[1].replace('H','home').replace('A','away'));
                if (el) { el.style.left = m[2] + "%"; el.style.top = m[3] + "%"; }
            });
        } catch(e) { addMessage("Technik-Foul!", "toni"); }
        document.getElementById("status").textContent = "Ready";
    }

    function addMessage(text, sender) {
        const div = document.createElement("div"); div.className = "msg " + sender; div.textContent = text;
        const hist = document.getElementById("chat-history"); hist.appendChild(div);
        hist.scrollTop = hist.scrollHeight;
    }

    /* UI CONTROLS */
    document.getElementById("send-btn").onclick = askToni;
    document.getElementById("user-input").onkeypress = (e) => { if(e.key === "Enter") askToni(); };
    document.getElementById("whiteboard-open").onclick = () => document.getElementById("whiteboard-panel").classList.add("open");
    document.getElementById("whiteboard-close").onclick = () => document.getElementById("whiteboard-panel").classList.remove("open");
    document.getElementById("voice-btn").onclick = () => { 
        voiceEnabled = !voiceEnabled; 
        document.getElementById("voice-btn").textContent = voiceEnabled ? "🔊 Stimme" : "🔇 Aus";
    };
    
    // Mikrofon Platzhalter
    document.getElementById("mic-btn").onclick = () => {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = "de-DE"; rec.onresult = (e) => { document.getElementById("user-input").value = e.results[0][0].transcript; askToni(); };
        rec.start();
    };
</script>
</body>
</html>
