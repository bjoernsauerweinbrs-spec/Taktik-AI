<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coach Toni 2.0 – Professional Strategy & Training Suite</title>
  <style>
    :root {
      --green: #2ecc71; --accent: #3498db; --bg: #05080c; --panel: #0f1720;
      --line: rgba(255,255,255,0.1); --text: #e6eef0; --card-radius: 14px;
      --arrow-color: #ffcc00; --arrow-width: 6;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body {
      margin: 0; font-family: 'Inter', system-ui, sans-serif; 
      background: radial-gradient(circle at top, #141b2d 0, #050608 60%);
      color: var(--text); height: 100vh; overflow: hidden;
    }
    #app { display: grid; grid-template-columns: 420px 1fr; gap: 15px; height: 100vh; padding: 15px; }

    /* --- SIDEBAR --- */
    #sidebar { background: #0b121c; border-radius: 18px; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .header { font-weight: 800; color: var(--green); padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
    
    #playlist-bar { background: #070b14; padding: 10px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .seq-chip { background: #1e293b; color: #94a3b8; border: none; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .seq-chip.active { background: var(--green); color: #fff; font-weight: bold; }

    #chat-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 16px; border-radius: 15px; font-size: 0.92rem; line-height: 1.5; max-width: 88%; animation: fadeIn 0.3s ease; }
    .user { align-self: flex-end; background: linear-gradient(135deg, #2563eb, #38bdf8); color: #fff; border-bottom-right-radius: 2px; }
    .toni { align-self: flex-start; background: #1a2230; border-left: 4px solid var(--green); border-bottom-left-radius: 2px; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    #thinking-ui { font-size: 0.75rem; color: #64748b; padding: 0 20px 10px; font-style: italic; display: none; align-items: center; gap: 8px; }
    .dot-loader { width: 4px; height: 4px; background: var(--green); border-radius: 50%; animation: blink 1s infinite; }

    .input-row { padding: 15px; background: #05070a; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    .input-row input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #2d3748; background: #020408; color: #fff; font-size: 0.9rem; }
    .input-row button { padding: 12px 18px; border-radius: 10px; border: none; background: var(--green); color: #fff; font-weight: bold; cursor: pointer; }

    /* --- MAIN AREA --- */
    #main { display: flex; flex-direction: column; gap: 12px; }
    .top-controls { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--line); }
    
    #pitch-area { 
        background: #0b121c; border-radius: 18px; border: 1px solid var(--line); position: relative; flex: 1; 
        display: grid; grid-template-columns: 1fr 120px; padding: 10px; gap: 10px;
    }
    #pitch { background: #166534; border-radius: 12px; border: 3px solid #fff; position: relative; overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.4); }
    
    /* Sideline / Bank */
    #sideline { background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px dashed var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px; gap: 8px; overflow-y: auto; }
    .bank-title { font-size: 0.6rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }

    .player, #ball { position: absolute; z-index: 100; transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .player { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; color: white; border: 2px solid #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.5); cursor: grab; }
    
    /* Player Colors */
    .p-red { background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c); }
    .p-blue { background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8); }
    .p-yellow { background: radial-gradient(circle at 30% 30%, #facc15, #a16207); color: #000; }
    .p-cyan { background: radial-gradient(circle at 30% 30%, #22d3ee, #0891b2); color: #000; }
    .p-lime { background: radial-gradient(circle at 30% 30%, #a3e635, #4d7c0f); color: #000; }
    .p-magenta { background: radial-gradient(circle at 30% 30%, #f472b6, #be185d); }

    #ball { width: 20px; height: 20px; background: #fff; border-radius: 50%; border: 2px solid #000; cursor: grab; z-index: 110; }

    /* Coaching Points Panel */
    #coaching-points { background: #0b121c; padding: 20px; border-radius: 18px; border: 1px solid var(--line); min-height: 120px; position: relative; }
    .points-header { color: var(--green); font-weight: 800; font-size: 0.75rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    #points-list { font-size: 0.95rem; color: #94a3b8; line-height: 1.6; }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal.open { display: flex; }
    .modal-content { background: #0b121c; padding: 30px; border-radius: 20px; border: 1px solid var(--green); width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
    
    /* UI Buttons */
    .btn { background: #1e293b; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .btn:hover { background: #334155; transform: translateY(-1px); }
    .btn-primary { background: var(--green); color: #fff; }

    #exercise-svg { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
    .arrow-line { stroke: var(--arrow-color); stroke-width: var(--arrow-width); stroke-linecap: round; stroke-dasharray: 12 6; animation: dash 1.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="login-overlay" style="position:fixed; inset:0; background:#050608; z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div style="background:#0b121c; padding:40px; border-radius:24px; border:1px solid var(--green); text-align:center; width:400px; box-shadow: 0 0 100px rgba(46, 204, 113, 0.1);">
        <h2 style="color:var(--green); margin-bottom:10px;">COACH TONI 2.0</h2>
        <p style="color:#64748b; font-size:0.9rem; margin-bottom:25px;">Professional Management & Tactic Hub</p>
        <input type="password" id="pw-in" placeholder="Trainer-Passwort" style="width:100%; padding:15px; margin-bottom:15px; border-radius:12px; border:1px solid #2d3748; background:#000; color:#fff; font-size:1rem; text-align:center;">
        <button onclick="login()" style="width:100%; padding:15px; background:var(--green); border:none; border-radius:12px; color:#fff; font-weight:bold; cursor:pointer; font-size:1.1rem;">INITIALISIEREN</button>
    </div>
</div>

<div id="app">
    <aside id="sidebar">
        <div class="header">
            <span>TACTICAL CENTER</span>
            <div id="timer" style="font-family: monospace; color: #fff; font-size: 1rem; background: #000; padding: 4px 10px; border-radius: 6px;">00:00</div>
        </div>
        
        <div id="playlist-bar">
            <div id="seq-list" style="display:flex; gap:6px; overflow-x:auto;"></div>
            <button onclick="addSequence()" style="background:var(--accent); color:white; border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; font-weight:bold; margin-left:auto;">+</button>
        </div>

        <div id="chat-history"></div>
        <div id="thinking-ui"><div class="dot-loader"></div> Toni recherchiert in globalen Taktik-Datenbanken...</div>

        <div class="input-row">
            <button onclick="startMic()" style="background:transparent; border:none; color:#64748b; cursor:pointer; font-size:1.2rem;">🎤</button>
            <input type="text" id="user-input" placeholder="Anfrage an Toni senden..." onkeypress="if(event.key==='Enter') askToni()">
            <button onclick="askToni()" id="ok-btn">OK</button>
        </div>
        
        <div style="padding:12px; display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
            <button class="btn" onclick="toggleModal('kader-modal')">📋 Kaderliste</button>
            <button class="btn" onclick="exportPlanPDF()">📄 PDF Export</button>
            <button class="btn" onclick="toggleMode()">🔄 Modus: <span id="mode-label">Match</span></button>
            <button class="btn btn-primary" onclick="resetBoard()">♻ Grundordnung</button>
        </div>
    </aside>

    <main id="main">
        <div class="top-controls">
            <div style="display:flex; gap:10px; align-items:center;">
                <span style="font-size:0.7rem; font-weight:bold; color:#64748b;">VOICE:</span>
                <select id="voice-select" style="background:#0b121c; color:#fff; border:1px solid #2d3748; padding:5px; border-radius:6px; font-size:0.8rem;" onchange="selectVoice(this.value)"></select>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <span style="font-size:0.7rem; font-weight:bold; color:#64748b;">STYLE:</span>
                <input type="color" id="arrow-color-picker" value="#ffcc00" onchange="updateArrowStyle()" style="border:none; background:none; width:30px; height:30px; cursor:pointer;">
            </div>
        </div>

        <div id="pitch-area">
            <div id="pitch" ondrop="drop(event)" ondragover="allowDrop(event)">
                <svg id="exercise-svg" viewBox="0 0 1000 600" preserveAspectRatio="none"></svg>
                <div id="ball" draggable="true" ondragstart="drag(event)"></div>
                <div id="players-layer"></div>
            </div>
            <div id="sideline" ondrop="drop(event)" ondragover="allowDrop(event)">
                <div class="bank-title">Reservisten</div>
            </div>
        </div>

        <div id="coaching-panel">
            <div class="points-header">Strategische Analyse & Coaching Points:</div>
            <div id="points-list">Warten auf Trainer-Impuls...</div>
        </div>
    </main>
</div>

<div id="kader-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--green);">Kader-Management</h3>
        <p style="font-size:0.8rem; color:#64748b; margin-bottom:15px;">Lege fest, wer heute für Training oder Spiel bereit ist.</p>
        <div id="attendance-list" style="max-height:350px; overflow-y:auto; margin-bottom:20px;"></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" style="flex:1;" onclick="toggleModal('kader-modal')">Übernehmen</button>
        </div>
    </div>
</div>

<script>
    let GROQ_KEY = "";
    let players = [];
    let sequences = [{ id: 1, positions: [], coachingPoints: "" }];
    let activeSeqIdx = 0;
    let isTrainingMode = false;
    let timerInterval, seconds = 0;
    let toniVoice = null;

    const trColors = ['p-yellow', 'p-cyan', 'p-lime', 'p-magenta'];

    function login() {
        if(document.getElementById('pw-in').value === "Trainer2026") {
            document.getElementById('login-overlay').style.display = 'none';
            init();
        } else { alert("Zugriff verweigert."); }
    }

    function init() {
        const names = ["David Luiz", "Nadine", "Björn", "Hummels", "Müller", "Neuer", "Sane", "Gnabry", "Kimmich", "Goretzka", "Musiala", "Wirtz", "Havertz", "Rüdiger", "Tah"];
        players = names.map((n, i) => ({ id: i+1, name: n, present: true, team: i < 11 ? 'home' : 'away' }));
        
        renderAttendance();
        renderSequences();
        loadSequence(0);
        startGlobalTimer();
        setupVoices();
        
        addMsg('toni', "Guten Tag, Coach Björn. Ich bin Toni. Ich habe mich bereits über die neuesten Taktik-Trends aus Brasilien informiert. Der Kader ist bereit – wie fangen wir an?");
    }

    function startGlobalTimer() {
        timerInterval = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds/60).toString().padStart(2,'0');
            let s = (seconds%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function setupVoices() {
        const voices = speechSynthesis.getVoices();
        toniVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Stefan') || v.name.includes('Google Deutsch'))) || voices[0];
        const sel = document.getElementById('voice-select');
        voices.filter(v => v.lang.startsWith('de')).forEach(v => {
            let opt = document.createElement('option');
            opt.value = v.name; opt.innerText = v.name;
            sel.appendChild(opt);
        });
    }

    function renderAttendance() {
        const list = document.getElementById('attendance-list');
        list.innerHTML = players.map(p => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #1e293b;">
                <span style="font-weight:600; color:${p.present ? '#fff' : '#475569'}">${p.name}</span>
                <input type="checkbox" ${p.present ? 'checked' : ''} onchange="togglePresent(${p.id})" style="width:20px; height:20px; accent-color:var(--green);">
            </div>
        `).join('');
    }

    function togglePresent(id) {
        let p = players.find(x => x.id === id);
        p.present = !p.present;
        resetBoard();
        renderAttendance();
    }

    function renderSequences() {
        const bar = document.getElementById('seq-list');
        bar.innerHTML = sequences.map((s, i) => `
            <button class="seq-chip ${i === activeSeqIdx ? 'active' : ''}" onclick="loadSequence(${i})">Übung ${i+1}</button>
        `).join('');
    }

    function addSequence() {
        saveCurrentState();
        sequences.push({ id: sequences.length+1, positions: [], coachingPoints: "" });
        activeSeqIdx = sequences.length - 1;
        loadSequence(activeSeqIdx);
    }

    function loadSequence(idx) {
        activeSeqIdx = idx;
        const seq = sequences[idx];
        const field = document.getElementById('players-layer');
        const bank = document.getElementById('sideline');
        field.innerHTML = ""; 
        Array.from(bank.children).forEach(c => { if(c.classList.contains('player')) c.remove(); });
        
        document.getElementById('points-list').innerText = seq.coachingPoints || "Analysiere Situation...";

        const activePlayers = players.filter(p => p.present);
        activePlayers.forEach((p, i) => {
            const el = document.createElement('div');
            el.id = `player-${p.id}`;
            el.innerText = p.id;
            el.className = `player ${isTrainingMode ? trColors[i % trColors.length] : (p.team === 'home' ? 'p-red' : 'p-blue')}`;
            el.draggable = true;
            el.ondragstart = drag;

            const saved = seq.positions.find(pos => pos.id === el.id);
            if(saved && saved.onField) {
                el.style.left = saved.x; el.style.top = saved.y;
                field.appendChild(el);
            } else if (!saved && i < 11 && !isTrainingMode) {
                el.style.left = (15 + (i*6)) + "%"; el.style.top = "50%";
                field.appendChild(el);
            } else {
                el.style.position = "relative"; el.style.left="0"; el.style.top="0";
                bank.appendChild(el);
            }
        });
        renderSequences();
    }

    function saveCurrentState() {
        const seq = sequences[activeSeqIdx];
        seq.positions = Array.from(document.querySelectorAll('.player')).map(p => ({
            id: p.id,
            x: p.style.left,
            y: p.style.top,
            onField: p.parentElement.id === "pitch"
        }));
        seq.coachingPoints = document.getElementById('points-list').innerText;
    }

    // Drag & Drop
    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    function drop(ev) {
        ev.preventDefault();
        const id = ev.dataTransfer.getData("text");
        const el = document.getElementById(id);
        const target = ev.currentTarget;
        if (target.id === "pitch") {
            const r = target.getBoundingClientRect();
            el.style.position = "absolute";
            el.style.left = ((ev.clientX - r.left) / r.width * 100) + "%";
            el.style.top = ((ev.clientY - r.top) / r.height * 100) + "%";
            target.appendChild(el);
        } else {
            el.style.position = "relative"; el.style.left="0"; el.style.top="0";
            target.appendChild(el);
        }
        saveCurrentState();
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const query = input.value.trim();
        if(!query) return;

        addMsg('user', query);
        input.value = "";
        document.getElementById('thinking-ui').style.display = 'flex';

        // REAKTIVE TONI-LOGIK (Simulierte Analyse)
        setTimeout(() => {
            document.getElementById('thinking-ui').style.display = 'none';
            let response = "";
            let coaching = "";

            if(query.toLowerCase().includes("training") || query.toLowerCase().includes("planen")) {
                const count = players.filter(p => p.present).length;
                response = `Ich habe ${count} Spieler in die Planung einbezogen. Mein Vorschlag: Eine brasilianische 'Ginga'-Einheit für ${count} Jungs. Ich habe dazu aktuelle Daten aus dem Nachwuchsbereich von Fluminense abgeglichen. Soll ich die Übung aufbauen?`;
                coaching = "1. Fokus auf Ballkontrolle unter Zeitdruck.\n2. Explosive Richtungswechsel beim Dribbling.\n3. Mutige 1-gegen-1 Situationen forcieren.";
            } else {
                response = "Analyse abgeschlossen. Basierend auf der aktuellen Spielsituation empfehle ich ein Einrücken der Außenverteidiger, um das Zentrum kompakt zu halten. Soll ich die Verschiebung durchführen?";
                coaching = "Zentrum absichern, Passwege in die Tiefe schließen.";
            }

            addMsg('toni', response);
            speak(response);
            document.getElementById('points-list').innerText = coaching;
            saveCurrentState();
        }, 1800);
    }

    function addMsg(role, txt) {
        const h = document.getElementById('chat-history');
        const d = document.createElement('div');
        d.className = `msg ${role}`;
        d.innerText = txt;
        h.appendChild(d);
        h.scrollTop = h.scrollHeight;
    }

    function speak(txt) {
        speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(txt);
        if(toniVoice) msg.voice = toniVoice;
        msg.lang = 'de-DE'; msg.pitch = 0.85; msg.rate = 1.0;
        speechSynthesis.speak(msg);
    }

    function toggleMode() {
        isTrainingMode = !isTrainingMode;
        document.getElementById('mode-label').innerText = isTrainingMode ? "Training" : "Match";
        loadSequence(activeSeqIdx);
    }

    function toggleModal(id) { document.getElementById(id).classList.toggle('open'); }
    function resetBoard() { loadSequence(activeSeqIdx); }

    function updateArrowStyle() {
        document.documentElement.style.setProperty('--arrow-color', document.getElementById('arrow-color-picker').value);
    }

    function exportPlanPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22); doc.setTextColor(46, 204, 113); doc.text("COACH TONI 2.0 - TRAININGSREPORT", 20, 20);
        doc.setFontSize(12); doc.setTextColor(0,0,0); doc.text("Datum: " + new Date().toLocaleDateString(), 20, 30);
        doc.text("------------------------------------------------------------------", 20, 35);
        doc.setFontSize(14); doc.text("Strategische Analyse:", 20, 50);
        doc.setFontSize(11); doc.text(document.getElementById('points-list').innerText, 20, 60);
        doc.save("CoachToni_Export.pdf");
    }

    function startMic() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return;
        const rec = new Rec(); rec.lang = 'de-DE';
        rec.onresult = (e) => { document.getElementById('user-input').value = e.results[0][0].transcript; askToni(); };
        rec.start();
    }
</script>
</body>
</html>
