<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni – GROQ EDITION</title>

    <style>
        :root {
            --green: #2ecc71;
            --green-dark: #27ae60;
            --bg-dark: #050608;
            --bg-panel: #111319;
            --bg-panel-light: #191b23;
            --line: rgba(255,255,255,0.12);
            --text-light: rgba(255,255,255,0.9);
            --red: #e74c3c;
            --blue: #3498db;
            --shadow-strong: 0 18px 40px rgba(0,0,0,0.65);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #1b2333 0, #050608 55%);
            color: var(--text-light);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr) 320px;
            gap: 14px;
            padding: 14px;
            width: 100%;
        }

        /* SIDEBAR / CHAT */
        #chat-sidebar {
            background: linear-gradient(145deg, #10121a, #151824);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-strong);
        }

        .header {
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1rem;
            color: var(--green);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: radial-gradient(circle at top left, #1f2937 0, #050608 70%);
            border-radius: 18px 18px 0 0;
        }

        .header span {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.55);
            font-weight: 400;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.45;
            max-width: 92%;
            position: relative;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.toni {
            align-self: flex-start;
            background: radial-gradient(circle at top left, #1f2937, #020617);
            border: 1px solid rgba(148,163,184,0.4);
            border-bottom-left-radius: 4px;
        }

        .msg.toni::before {
            content: "T";
            position: absolute;
            left: -22px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--green-dark);
            color: #020617;
            font-size: 0.7rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(34,197,94,0.7);
        }

        #status {
            font-size: 0.7rem;
            text-align: center;
            color: #9ca3af;
            padding: 4px 0 2px;
        }

        .chat-input-row {
            padding: 12px;
            background: #050712;
            border-radius: 0 0 18px 18px;
            border-top: 1px solid rgba(148,163,184,0.25);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input-row input {
            flex: 1;
            background: #020617;
            color: white;
            border: 1px solid #374151;
            padding: 9px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .chat-input-row button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 9px 11px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        #mic-btn {
            background: #111827;
            color: #e5e7eb;
        }

        #send-btn {
            background: var(--green);
            color: #020617;
        }

        .mic-active {
            background: #b91c1c !important;
            box-shadow: 0 0 15px rgba(248,113,113,0.9);
        }

        /* PITCH AREA */
        #pitch-area {
            background: linear-gradient(145deg, #0b1120, #020617);
            border-radius: 18px;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 10px 14px;
            box-shadow: var(--shadow-strong);
        }

        .pitch-toolbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 4px 4px 10px;
        }

        .pitch-toolbar-left,
        .pitch-toolbar-right {
            display: flex;
            gap: 8px;
        }

        .toolbar-btn {
            background: #020617;
            color: #e5e7eb;
            border-radius: 999px;
            border: 1px solid #1f2937;
            padding: 6px 11px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn span {
            font-size: 0.9rem;
        }

        .toolbar-btn.primary {
            background: #16a34a;
            border-color: #22c55e;
            color: #020617;
        }

        #pitch {
            width: 96%;
            height: calc(100% - 40px);
            background:
                repeating-linear-gradient(
                    90deg,
                    #166534 0,
                    #166534 8%,
                    #15803d 8%,
                    #15803d 16%
                );
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 0 40px rgba(0,0,0,0.7),
                0 18px 40px rgba(0,0,0,0.8);
        }

        .pitch-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at center, transparent 0, transparent 55%, rgba(0,0,0,0.55) 100%);
            z-index: 1;
        }

        .m-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(249,250,251,0.95);
            opacity: 0.9;
            z-index: 0;
        }

        .m-circle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(249,250,251,0.95);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.9;
            z-index: 0;
        }

        .m-box-16 {
            position: absolute;
            width: 18%;
            height: 46%;
            border: 2px solid rgba(249,250,251,0.95);
            top: 27%;
            opacity: 0.9;
            z-index: 0;
        }

        .l { left: 0; border-left: none; }
        .r { right: 0; border-right: none; }

        /* Torraum / 5er */
        .m-box-5 {
            position: absolute;
            width: 8%;
            height: 26%;
            border: 2px solid rgba(249,250,251,0.95);
            top: 37%;
            opacity: 0.9;
            z-index: 0;
        }
        .l5 { left: 0; border-left: none; }
        .r5 { right: 0; border-right: none; }

        /* Elfmeterpunkt */
        .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(249,250,251,0.95);
            z-index: 0;
        }
        .dot.l {
            left: 11%;
            top: 50%;
            transform: translateY(-50%);
        }
        .dot.r {
            right: 11%;
            top: 50%;
            transform: translateY(-50%);
        }

        #players-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        /* BALL & PLAYERS */
        .player, #ball {
            position: absolute;
            cursor: grab;
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.2, 0.7, 0.3, 1);
        }

        .player {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(15,23,42,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            color: #f9fafb;
            box-shadow:
                0 0 0 2px rgba(15,23,42,0.9),
                0 10px 18px rgba(0,0,0,0.8);
            position: absolute;
        }

        .player::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 6px;
            background: radial-gradient(circle at center, rgba(0,0,0,0.7) 0, transparent 70%);
            opacity: 0.9;
            z-index: -1;
        }

        .home {
            background: radial-gradient(circle at 30% 20%, #fecaca 0, #b91c1c 40%, #7f1d1d 100%);
            box-shadow:
                0 0 0 2px rgba(248,113,113,0.9),
                0 0 18px rgba(248,113,113,0.9),
                0 10px 18px rgba(0,0,0,0.8);
        }

        .away {
            background: radial-gradient(circle at 30% 20%, #bfdbfe 0, #1d4ed8 40%, #1e3a8a 100%);
            box-shadow:
                0 0 0 2px rgba(96,165,250,0.9),
                0 0 18px rgba(96,165,250,0.9),
                0 10px 18px rgba(0,0,0,0.8);
        }

        #ball {
            width: 18px;
            height: 18px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0, #e5e7eb 40%, #9ca3af 100%);
            border-radius: 50%;
            border: 2px solid #020617;
            box-shadow:
                0 0 0 1px rgba(15,23,42,0.9),
                0 8px 14px rgba(0,0,0,0.85);
        }

        /* WHITEBOARD */
        #whiteboard {
            background: linear-gradient(145deg, #f9fafb, #e5e7eb);
            color: #020617;
            border-radius: 18px;
            padding: 16px 16px 14px;
            border: 1px solid #d1d5db;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-strong);
        }

        #whiteboard h3 {
            margin: 0 0 6px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #whiteboard h3 span {
            font-size: 0.7rem;
            color: #6b7280;
            font-weight: 500;
        }

        #player-list {
            flex: 1;
            border: none;
            font-size: 0.9rem;
            outline: none;
            line-height: 1.5;
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-weight: 600;
            color: #111827;
            background: #f3f4f6;
            border-radius: 10px;
            padding: 10px;
            resize: none;
        }

        /* LOGIN OVERLAY */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top, rgba(15,23,42,0.95) 0, rgba(3,7,18,0.98) 55%);
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: radial-gradient(circle at top left, #111827 0, #020617 70%);
            padding: 32px 26px 24px;
            border-radius: 20px;
            border: 1px solid rgba(148,163,184,0.6);
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 22px 45px rgba(0,0,0,0.9);
        }

        .login-card h2 {
            color: var(--green);
            margin: 0 0 4px;
            font-size: 1.1rem;
        }

        .login-card p {
            font-size: 0.8rem;
            color: #9ca3af;
            margin: 0 0 16px;
        }

        .login-card input {
            display: block;
            width: 100%;
            margin: 10px auto;
            padding: 10px 11px;
            border-radius: 9px;
            border: 1px solid #374151;
            background: #020617;
            color: #e5e7eb;
            font-size: 0.85rem;
        }

        .login-card button {
            background: var(--green);
            color: #020617;
            width: 100%;
            padding: 11px;
            font-weight: 700;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .login-hint {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #9ca3af;
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 360px minmax(0, 1fr) 260px;
                height: 100vh;
            }
            #chat-sidebar {
                order: 1;
            }
            #pitch-area {
                order: 2;
            }
            #whiteboard {
                order: 3;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="login-overlay">
    <div class="login-card">
        <h2>⚽ COACH TONI – GROQ EDITION</h2>
        <p>Passwort & GROQ‑API‑Key eintragen, dann übernimmt Toni.</p>
        <input type="password" id="password" placeholder="Passwort (Trainer2026)">
        <input type="text" id="user-key" placeholder="Groq API-Key (gsk_...)">
        <button onclick="startToni()">SYSTEM STARTEN</button>
        <div class="login-hint">Dein Key bleibt nur lokal im Browser gespeichert.</div>
    </div>
</div>

<!-- MAIN LAYOUT -->
<div class="container">

    <!-- CHAT -->
    <div id="chat-sidebar">
        <div class="header">
            <div>TRAINER-KOMMANDO</div>
            <span>Toni: Klopp × Nagelsmann</span>
        </div>
        <div id="chat-history"></div>
        <div id="status">Ready</div>

        <div class="chat-input-row">
            <button id="mic-btn" onclick="toggleMic()">🎤</button>
            <input type="text" id="user-input" placeholder="Befehl an Toni...">
            <button id="send-btn" onclick="askToni()">OK</button>
        </div>
    </div>

    <!-- PITCH -->
    <div id="pitch-area">
        <div class="pitch-toolbar">
            <div class="pitch-toolbar-left">
                <button class="toolbar-btn primary" onclick="setFormation()">
                    <span>♻</span> Reset & Grundordnung
                </button>
            </div>
            <div class="pitch-toolbar-right">
                <button class="toolbar-btn" onclick="loadVoice()">
                    <span>🔊</span> Stimme laden
                </button>
            </div>
        </div>

        <div id="pitch">
            <div class="m-line"></div>
            <div class="m-circle"></div>
            <div class="m-box-16 l"></div>
            <div class="m-box-16 r"></div>
            <div class="m-box-5 l5"></div>
            <div class="m-box-5 r5"></div>
            <div class="dot l"></div>
            <div class="dot r"></div>

            <div id="ball" style="left:50%; top:50%;"></div>
            <div id="players-layer"></div>
            <div class="pitch-vignette"></div>
        </div>
    </div>

    <!-- WHITEBOARD -->
    <div id="whiteboard">
        <h3>
            📋 Kaderliste
            <span>Format: 6 Kimmich, 10 Reus, ...</span>
        </h3>
        <textarea id="player-list" oninput="saveAndSync()"></textarea>
    </div>
</div>

<script>
    let GROQ_KEY = "";
    let coachVoice = null;
    let recognition = null;
    let isLocked = false;

    // Sprachaufnahme
    function toggleMic() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;

        if (!recognition) {
            recognition = new Speech();
            recognition.lang = 'de-DE';
            recognition.onstart = () => document.getElementById('mic-btn').classList.add('mic-active');
            recognition.onend = () => document.getElementById('mic-btn').classList.remove('mic-active');
            recognition.onresult = (e) => {
                document.getElementById('user-input').value = e.results[0][0].transcript;
                askToni();
            };
        }
        recognition.start();
    }

    // Männerstimme laden
    function loadVoice() {
        const v = window.speechSynthesis.getVoices();
        coachVoice = v.find(s =>
            s.lang.startsWith('de') &&
            (s.name.includes('Martin') || s.name.includes('Stefan') || s.name.includes('Hans') || s.name.includes('Male'))
        );
        if (!coachVoice) coachVoice = v.find(s => s.lang.startsWith('de'));
    }
    window.speechSynthesis.onvoiceschanged = loadVoice;

    function speak(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        if (coachVoice) m.voice = coachVoice;
        m.pitch = 0.8;
        m.rate = 1.0;
        window.speechSynthesis.speak(m);
    }

    // Kaderliste speichern & Namen auf Trikots
    function saveAndSync() {
        const list = document.getElementById('player-list').value;
        localStorage.setItem('toni_kader_GROQ', list);

        const lines = list.split('\n');

        for (let i = 1; i <= 15; i++) {
            const el = document.getElementById('home' + i);
            if (el) el.innerText = i;
        }

        lines.forEach(l => {
            const m = l.match(/^(\d+)\s*(.*)$/);
            if (m) {
                const nr = m[1];
                const name = m[2].trim().split(' ')[0];
                const el = document.getElementById('home' + nr);
                if (el && name) el.innerText = name;
            }
        });
    }

    // Grundformation
    function setFormation() {
        const layer = document.getElementById('players-layer');
        layer.innerHTML = "";

        const h = [[5,50], [22,20], [22,40], [22,60], [22,80], [45,20], [45,40], [45,60], [45,80], [70,40], [70,60]];
        const a = [[93,50], [78,25], [78,50], [78,75], [58,15], [58,38], [58,62], [58,85], [35,20], [35,50], [35,80]];

        h.forEach((p, i) => createP('home', i+1, p[0], p[1], layer));
        a.forEach((p, i) => createP('away', i+1, p[0], p[1], layer));

        let initialList = "";
        for (let i = 1; i <= 15; i++) initialList += i + " \n";

        const saved = localStorage.getItem('toni_kader_GROQ');
        document.getElementById('player-list').value = saved ? saved : initialList;

        saveAndSync();
    }

    function createP(t, n, x, y, l) {
        const p = document.createElement('div');
        p.className = `player ${t}`;
        p.id = t + n;
        p.innerText = n;
        p.style.left = x + "%";
        p.style.top = y + "%";
        l.appendChild(p);
    }

    // Drag & Drop
    let activeItem = null;

    document.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('player') || e.target.id === 'ball') {
            activeItem = e.target;
            activeItem.style.transition = "none";
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (!activeItem) return;

        const r = document.getElementById('pitch').getBoundingClientRect();
        activeItem.style.left = Math.max(0, Math.min(96, ((e.clientX - r.left) / r.width) * 100)) + "%";
        activeItem.style.top = Math.max(0, Math.min(95, ((e.clientY - r.top) / r.height) * 100)) + "%";
    });

    document.addEventListener('mouseup', () => {
        if (activeItem) activeItem.style.transition = "all 1.2s ease-in-out";
        activeItem = null;
    });

    // Login / Start
    function startToni() {
        if (document.getElementById('password').value === "Trainer2026") {
            GROQ_KEY = document.getElementById('user-key').value.trim();
            localStorage.setItem('toni_groq_key', GROQ_KEY);
            document.getElementById('login-overlay').style.display = 'none';
            setFormation();
            loadVoice();
        }
    }

    window.onload = () => {
        const k = localStorage.getItem('toni_groq_key');
        if (k) document.getElementById('user-key').value = k;
    };

    // Toni fragen (GROQ)
    async function askToni() {
        if (isLocked) return;

        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        if (!GROQ_KEY) {
            addMsg("toni", "Chef, ohne Groq‑Key bin ich nur Deko. Trag oben einen gültigen gsk_‑Key ein.");
            return;
        }

        isLocked = true;
        document.getElementById('send-btn').disabled = true;
        addMsg("user", text);
        input.value = "";
        document.getElementById('status').innerText = "Analyse läuft...";

        const state =
            "Kader: " +
            document.getElementById('player-list').value.replace(/\n/g, ', ') +
            ". Positionen: " +
            [...document.querySelectorAll('.player, #ball')]
                .map(el => `${el.id}:[${Math.round(parseFloat(el.style.left))},${Math.round(parseFloat(el.style.top))}]`)
                .join(', ');

        const systemPrompt =
            "Du bist 'Toni', der Co‑Trainer von Manager Björn. " +
            "Dein Charakter: Mix aus Jürgen Klopp (emotional, direkt, humorvoll, eine gesunde Arroganz) " +
            "und Julian Nagelsmann (modern, analytisch, präzise). " +
            "Du bist loyal zum Chef, aber sagst klar, was Sache ist. " +
            "Du denkst in Räumen, Pressinghöhen, Halbräumen, Überladungen und Dynamiken. " +
            "ROT = home (Björn), BLAU = away (Gegner). " +
            "Aktueller Zustand des Spielfelds: " + state + ". " +
            "WICHTIG: Wenn es um Verschieben, Pressing, Laufwege oder Positionswechsel geht, " +
            "nutzt du das Format MOVE[ID,X,Y], z.B. MOVE[home6,45,62] oder MOVE[ball,60,48]. " +
            "Du darfst mehrere MOVE‑Befehle in einer Antwort nutzen. " +
            "Schreibe maximal 3–4 Sätze, direkt, bildhaft, gerne mit einem kleinen Spruch. " +
            "Kein Englisch, nur Deutsch.";

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                signal: controller.signal,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + GROQ_KEY
                },
                body: JSON.stringify({
                    model: "llama-3.1-70b-versatile",
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: text }
                    ]
                })
            });

            clearTimeout(timeoutId);

            if (!resp.ok) {
                const errText = await resp.text();
                addMsg("toni", "Chef, Groq meckert: " + errText);
                isLocked = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('status').innerText = "Fehler";
                return;
            }

            const data = await resp.json();

            isLocked = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('status').innerText = "Ready";

            const answer = data.choices?.[0]?.message?.content || "Ich hab gerade einen Hänger, Chef.";
            const moves = [...answer.matchAll(/MOVE\[(\w+),(\d+),(\d+)\]/g)];
            const clean = answer.replace(/MOVE\[.*?\]/g, "").trim();

            addMsg("toni", clean);
            speak(clean);

            moves.forEach(m => {
                const id = m[1];
                const el = document.getElementById(id);
                if (el) {
                    el.style.left = m[2] + "%";
                    el.style.top = m[3] + "%";
                }
            });

        } catch (e) {
            isLocked = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('status').innerText = "Fehler";
            addMsg("toni", "Chef, die Leitung zu Groq ist gerade tot. Netzwerk, Key oder Limit – eins von den dreien.");
        }
    }

    function addMsg(role, text) {
        const h = document.getElementById('chat-history');
        const d = document.createElement('div');
        d.className = `msg ${role}`;
        d.innerText = text;
        h.appendChild(d);
        h.scrollTop = h.scrollHeight;
    }
</script>

</body>
</html>
