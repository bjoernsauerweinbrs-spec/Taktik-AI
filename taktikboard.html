<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coach Toni 2.0 – Professional Tactical Board</title>
  <style>
    :root{
      --green:#2ecc71;
      --green-dark:#27ae60;
      --bg-dark:#050608;
      --line:rgba(255,255,255,0.18);
      --text-light:rgba(255,255,255,0.9);
      --shadow-strong:0 18px 40px rgba(0,0,0,0.7);
      --max-width:1200px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#1b2333 0,#050608 55%);color:var(--text-light);-webkit-font-smoothing:antialiased}
    #layout{display:grid;grid-template-columns:360px 1fr;gap:12px;height:100vh;padding:12px;max-width:var(--max-width);margin:0 auto}
    /* Sidebar */
    #chat-sidebar{background:linear-gradient(145deg,#10121a,#151824);border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-strong)}
    .chat-header{padding:18px;font-weight:800;color:var(--green);border-bottom:1px solid var(--line);background:rgba(0,0,0,0.25);letter-spacing:1px}
    #chat-history{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
    .msg{padding:12px 14px;border-radius:16px;font-size:0.92rem;line-height:1.5;max-width:88%;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
    .user{align-self:flex-end;background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff;border-bottom-right-radius:4px}
    .toni{align-self:flex-start;background:#1f2937;border-left:4px solid var(--green);border-bottom-left-radius:4px;color:#e6eef0}
    .chat-input-row{padding:14px;background:#050712;border-top:1px solid var(--line);display:flex;gap:10px}
    .chat-input-row input{flex:1;background:#010204;color:#fff;border:1px solid #374151;padding:12px;border-radius:10px;outline:none}
    .chat-input-row button{background:var(--green);border:none;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}
    /* Pitch area */
    #pitch-area{background:#0b1120;border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;padding:12px;height:100%;position:relative;box-shadow:var(--shadow-strong)}
    #pitch-controls{display:flex;justify-content:space-between;margin-bottom:12px}
    #pitch{flex:1;background:#166534;border:3px solid #fff;border-radius:18px;position:relative;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,0.4)}
    .goal{position:absolute;width:3%;height:20%;border:3px solid #fff;top:40%;z-index:5;background:rgba(255,255,255,0.05)}
    .l-goal{left:0;border-left:none}.r-goal{right:0;border-right:none}
    .m-line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,0.6)}
    .m-circle{position:absolute;left:50%;top:50%;width:140px;height:140px;border:2px solid rgba(255,255,255,0.6);border-radius:50%;transform:translate(-50%,-50%)}
    .player,#ball{position:absolute;z-index:100;transition:all 1.0s cubic-bezier(0.2,0.8,0.2,1)}
    .player{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff;text-shadow:1px 1px 3px #000;box-shadow:0 12px 24px rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.8)}
    .home{background:radial-gradient(circle at 30% 30%,#f87171,#b91c1c)} /* Toni (rot) */
    .away{background:radial-gradient(circle at 30% 30%,#60a5fa,#1d4ed8);cursor:grab} /* Björn (blau) */
    #ball{width:20px;height:20px;background:#fff;border-radius:50%;border:2px solid #000;cursor:grab;transition:all 0.6s ease-out}
    /* Whiteboard */
    #whiteboard-panel{position:absolute;top:70px;right:-420px;width:400px;height:calc(100% - 90px);background:#f8fafc;color:#0f172a;transition:0.4s cubic-bezier(0.4,0,0.2,1);z-index:2000;display:flex;flex-direction:column;padding:20px;border-radius:20px 0 0 20px;box-shadow:-15px 0 40px rgba(0,0,0,0.6)}
    #whiteboard-panel.open{right:0}
    #player-list{flex:1;padding:12px;font-family:'JetBrains Mono',monospace;font-size:1.05rem;border-radius:10px;border:2px solid #e2e8f0;background:#fff;resize:none}
    /* Debug */
    #status{font-size:0.78rem;text-align:center;padding:8px;color:#94a3b8;font-weight:700}
    #debug-panel{display:none;background:#071018;color:#9fd3ff;padding:12px;border-radius:10px;margin-top:12px;max-height:160px;overflow:auto}
    .btn{padding:10px 18px;border-radius:30px;border:none;cursor:pointer}
    .btn.primary{background:var(--green);color:#fff}
  </style>
</head>
<body>
  <!-- Login Overlay -->
  <div id="login-overlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:3000">
    <div style="background:#0b1220;padding:28px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.7);">
      <h2 style="color:var(--green);margin:0 0 12px 0">⚽ COACH TONI 2.0</h2>
      <input id="password" type="password" placeholder="Passwort (Trainer2026)" style="width:100%;padding:12px;border-radius:8px;border:1px solid #26303a;margin-bottom:8px;background:#07101a;color:#fff" />
      <input id="user-key" type="text" placeholder="Groq API-Key" style="width:100%;padding:12px;border-radius:8px;border:1px solid #26303a;margin-bottom:12px;background:#07101a;color:#fff" />
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button onclick="startToni()" class="btn primary">SYSTEM INITIALISIEREN</button>
      </div>
    </div>
  </div>

  <div id="layout">
    <aside id="chat-sidebar">
      <div class="chat-header">STRATEGIE CENTER</div>
      <div id="chat-history"></div>
      <div id="status">SYSTEM READY</div>
      <div class="chat-input-row">
        <button onclick="startMic()">🎤</button>
        <input id="user-input" placeholder="Analyse anfordern..." onkeypress="if(event.key==='Enter') askToni()" />
        <button onclick="askToni()">OK</button>
      </div>
    </aside>

    <main id="pitch-area">
      <div id="pitch-controls" style="margin-bottom:12px">
        <button onclick="resetBoard()" class="btn primary">♻ GRUNDORDNUNG</button>
        <div>
          <button id="voice-btn" onclick="toggleVoice()" class="btn" style="margin-right:8px">🔊 TON</button>
          <button onclick="toggleKader()" class="btn">📋 KADER</button>
          <button onclick="document.getElementById('debug-panel').style.display = document.getElementById('debug-panel').style.display === 'block' ? 'none' : 'block'" class="btn">🐞 DEBUG</button>
        </div>
      </div>

      <div id="pitch">
        <div class="goal l-goal"></div><div class="goal r-goal"></div>
        <div class="m-line"></div><div class="m-circle"></div>
        <div id="ball" style="left:50%;top:50%"></div>
        <div id="players-layer"></div>
      </div>

      <div id="whiteboard-panel">
        <h3 style="margin-top:0">📋 Kader Team Rot</h3>
        <textarea id="player-list" oninput="syncNames()" placeholder="1 Neuer&#10;5 Hummels"></textarea>
        <button onclick="toggleKader()" style="margin-top:12px;padding:12px;background:#0f172a;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:800">SCHLIESSEN</button>
        <div id="debug-panel" style="margin-top:12px;display:none"></div>
      </div>
    </main>
  </div>

  <script>
  /* -------------------------
     Globale Variablen
     ------------------------- */
  let GROQ_KEY = "";
  let isLocked = false;
  let voiceEnabled = true;
  let toniVoice = null;
  let draggedElement = null;
  const MOVE_DELAY_MS = 700; // Verzögerung zwischen aufeinanderfolgenden Bewegungen (anpassbar)

  /* -------------------------
     UI Helfer
     ------------------------- */
  function toggleKader(){ document.getElementById('whiteboard-panel').classList.toggle('open'); }
  function toggleVoice(){ voiceEnabled = !voiceEnabled; document.getElementById('voice-btn').innerText = voiceEnabled ? "🔊 TON" : "🔇 AUS"; }

  function logDebug(msg){
    const dbg = document.getElementById('debug-panel');
    if(dbg){
      const time = new Date().toLocaleTimeString();
      dbg.textContent = time + '  ' + msg + '\n' + dbg.textContent;
      dbg.style.display = 'block';
    }
    console.log(msg);
  }

  /* -------------------------
     Voice Auswahl und Sprechen
     ------------------------- */
  function listVoices(){
    const voices = speechSynthesis.getVoices() || [];
    logDebug('Voices: ' + voices.map(v => v.name + ' (' + v.lang + ')').join('; '));
    return voices;
  }

  function setupVoice(){
    const voices = listVoices();
    if(!voices || voices.length === 0) return;
    // Heuristiken für männliche deutsche Stimmen
    const malePatterns = [/Stefan/i,/Markus/i,/Michael/i,/Peter/i,/David/i,/Thomas/i,/Male/i,/Mann/i,/Männlich/i,/Google Deutsch/i];
    for(const re of malePatterns){
      const found = voices.find(v => re.test(v.name) || re.test(v.voiceURI));
      if(found && found.lang && found.lang.startsWith('de')) { toniVoice = found; logDebug('Toni voice chosen: ' + found.name); return; }
    }
    // Fallback: deutsche Stimme ohne "female" im Namen
    let fallback = voices.find(v => v.lang && v.lang.startsWith('de') && !/frau|female/i.test(v.name));
    if(fallback){ toniVoice = fallback; logDebug('Toni voice fallback: ' + fallback.name); return; }
    // letzter Fallback: erste verfügbare Stimme
    toniVoice = voices[0] || null;
    logDebug('Toni voice final fallback: ' + (toniVoice ? toniVoice.name : 'none'));
  }
  speechSynthesis.onvoiceschanged = setupVoice;

  // Prosodische Anpassung um "markante Männerstimme" zu simulieren
  function speakStyled(text){
    if(!voiceEnabled || !text) return;
    try{
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if(toniVoice) utter.voice = toniVoice;
      utter.lang = 'de-DE';
      // leichte Variation: tiefere Pitch, langsameres Tempo, kurze Pausen für "Nachdenken"
      utter.pitch = 0.78;
      utter.rate = 0.98;
      // Insert short pauses where Toni "denkt" (heuristisch: nach Satzzeichen)
      const processed = text.replace(/([.,;:!?])\s*/g, '$1 <break> ');
      // Web Speech API unterstützt keine <break>, wir splitten und sprechen sequenziell
      const parts = processed.split('<break>');
      (async function speakParts(){
        for(const part of parts){
          const p = part.trim();
          if(!p) continue;
          const u = new SpeechSynthesisUtterance(p);
          if(toniVoice) u.voice = toniVoice;
          u.lang = 'de-DE';
          u.pitch = utter.pitch;
          u.rate = utter.rate;
          speechSynthesis.speak(u);
          // Warte bis gesprochen oder eine kleine Pause
          await new Promise(res => setTimeout(res, Math.max(350, p.length * 20)));
        }
      })();
      logDebug('TTS gestartet mit Stimme: ' + (toniVoice ? toniVoice.name : 'default'));
    }catch(err){
      console.warn('TTS Fehler', err);
    }
  }

  /* -------------------------
     Spieler Initialisierung, Dragging, Snapshot
     ------------------------- */
  function resetBoard(){
    const layer = document.getElementById('players-layer');
    layer.innerHTML = '';
    // Standardpositionen in Prozent (x,y)
    const h = [[10,50],[25,20],[25,40],[25,60],[25,80],[45,30],[45,50],[45,70],[75,25],[85,50],[75,75]];
    const a = [[90,50],[75,20],[75,40],[75,60],[75,80],[55,30],[55,50],[55,70],[25,25],[15,50],[25,75]];
    h.forEach((p,i)=> createPlayer('home', i+1, p[0], p[1], layer, false));
    a.forEach((p,i)=> createPlayer('away', i+1, p[0], p[1], layer, true));
    syncNames();
    ensurePlayersHaveTeam();
    takeSnapshot();
    logDebug('Board zurückgesetzt');
  }

  function createPlayer(side, nr, x, y, layer, canDrag){
    const p = document.createElement('div');
    p.className = `player ${side}`;
    p.id = side + nr;
    p.innerText = nr;
    p.style.left = x + '%';
    p.style.top = y + '%';
    p.setAttribute('data-team', side === 'home' ? 'home' : 'away');
    // Home nicht interaktiv per Pointer
    if(side === 'home'){ p.style.pointerEvents = 'none'; }
    else { p.style.pointerEvents = 'auto'; }
    layer.appendChild(p);
    if(canDrag) makeDraggableSafe(p);
  }

  function ensurePlayersHaveTeam(){
    document.querySelectorAll('.player').forEach(p=>{
      if(!p.dataset.team){
        if(p.classList.contains('home')) p.dataset.team='home';
        else if(p.classList.contains('away')) p.dataset.team='away';
      }
      if(!p.id) p.id = 'player-' + Math.random().toString(36).slice(2,9);
      if(p.dataset.team === 'away' && !p._draggableInitialized){ makeDraggableSafe(p); p._draggableInitialized = true; }
      if(p.dataset.team === 'home'){ p.style.pointerEvents = 'none'; }
    });
  }

  // moderner Pointer-basiertes Dragging nur für away und ball
  function makeDraggableSafe(el){
    if(!el) return;
    el.style.cursor = 'grab';
    let dragging=false, offsetX=0, offsetY=0;
    function down(e){
      if(el.dataset.team !== 'away' && el.id !== 'ball') return;
      dragging = true;
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
      const rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      el.style.transition = 'none';
      el.style.zIndex = 1000;
      el.style.cursor = 'grabbing';
    }
    function move(e){
      if(!dragging) return;
      const field = document.getElementById('pitch');
      const fRect = field.getBoundingClientRect();
      const left = Math.min(Math.max(0, e.clientX - fRect.left - offsetX), fRect.width - el.offsetWidth);
      const top = Math.min(Math.max(0, e.clientY - fRect.top - offsetY), fRect.height - el.offsetHeight);
      el.style.position = 'absolute';
      el.style.left = left + 'px';
      el.style.top = top + 'px';
      el.setAttribute('data-left', el.style.left);
      el.setAttribute('data-top', el.style.top);
    }
    function up(e){
      if(!dragging) return;
      dragging = false;
      el.releasePointerCapture && el.releasePointerCapture(e.pointerId);
      el.style.transition = '';
      el.style.zIndex = '';
      el.style.cursor = 'grab';
    }
    el.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  const _snapshot = [];
  function takeSnapshot(){
    _snapshot.length = 0;
    document.querySelectorAll('.player').forEach(p=>{
      _snapshot.push({id:p.id,left:p.style.left||p.getAttribute('data-left')||'',top:p.style.top||p.getAttribute('data-top')||''});
    });
    logDebug('Snapshot gespeichert');
  }
  function restoreSnapshot(){
    _snapshot.forEach(s=>{
      const el = document.getElementById(s.id);
      if(el){
        if(s.left) el.style.left = s.left;
        if(s.top) el.style.top = s.top;
      }
    });
    logDebug('Snapshot wiederhergestellt');
  }

  /* -------------------------
     Sichere, sequentielle Bewegungsausführung
     ------------------------- */
  // Hilfsfunktion: animiert ein einzelnes Element und wartet bis Bewegung abgeschlossen
  function animateMoveTo(el, leftPx, topPx, durationMs){
    return new Promise(resolve=>{
      if(!el) return resolve();
      // Übergangszeit anpassen
      el.style.transition = `all ${Math.max(300, durationMs)}ms cubic-bezier(0.2,0.8,0.2,1)`;
      el.style.position = 'absolute';
      el.style.left = leftPx + 'px';
      el.style.top = topPx + 'px';
      // Warte duration + kleine Puffer
      setTimeout(()=>{ resolve(); }, durationMs + 80);
    });
  }

  // moves: [{id:'home1', x:0..1, y:0..1}, ...]
  async function moveHomePlayersSequential(fieldId, moves){
    const field = document.getElementById(fieldId);
    if(!field){ logDebug('Spielfeld nicht gefunden: ' + fieldId); return; }
    const rect = field.getBoundingClientRect();
    for(const mv of moves){
      const el = document.getElementById(mv.id);
      if(!el){ logDebug('Move Ziel nicht gefunden: ' + mv.id); continue; }
      if(el.dataset && el.dataset.team && el.dataset.team !== 'home'){ logDebug('Skip non-home: ' + mv.id); continue; }
      const left = Math.round(mv.x * (rect.width - el.offsetWidth));
      const top = Math.round(mv.y * (rect.height - el.offsetHeight));
      logDebug('Bewege ' + mv.id + ' -> ' + left + ',' + top);
      // spreche kurze Bestätigung bevor Bewegung (Toni "denkt" nach)
      speakStyled(`${mv.id} läuft jetzt auf Position ${Math.round(mv.x*100)} Prozent, ${Math.round(mv.y*100)} Prozent.`);
      await animateMoveTo(el, left, top, 600);
      // Warte zwischen Bewegungen, damit sie nacheinander sichtbar sind
      await new Promise(res => setTimeout(res, MOVE_DELAY_MS));
    }
    logDebug('Alle Moves ausgeführt');
  }

  /* -------------------------
     Namen synchronisieren
     ------------------------- */
  function syncNames(){
    const list = document.getElementById('player-list').value || '';
    // setze default nummern
    document.querySelectorAll('.player.home').forEach(p => p.innerText = p.id.replace('home',''));
    list.split('\n').forEach(line=>{
      const m = line.match(/^(\d+)\s*(.*)$/);
      if(m){
        const el = document.getElementById('home' + m[1]);
        if(el && m[2].trim()) el.innerText = m[2].trim().split(' ')[0];
      }
    });
  }

  /* -------------------------
     askToni mit sicherer MOVE-Verarbeitung
     ------------------------- */
  async function askToni(){
    if(isLocked) return;
    const input = document.getElementById('user-input');
    const text = (input.value || '').trim();
    if(!text) return;
    addMsg('user', text);
    input.value = '';
    isLocked = true;
    document.getElementById('status').innerText = 'TONI ANALYSIERT DATENBANK...';

    const system = "Du bist Toni, Co-Trainer von Björn. Mentalität: Jürgen Klopp & Julian Nagelsmann. Taktik-Experte für brasilianisches Stellungsspiel. Du steuerst das ROTE Team (home1-11). Björn steuert Blau (away1-11). Björn darf Deine Spieler NICHT anfassen. Wenn Du Taktik änderst, nutze MOVE[homeX,YY,ZZ] für jeden Laufweg. Analysiere erst die Räume im Netz, dann antworte präzise, kurz und fachlich brillant. Keine Begrüßungen.";

    try{
      const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method:'POST',
        headers:{ "Authorization":"Bearer " + GROQ_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ model:"llama-3.3-70b-versatile", messages:[{role:"system",content:system},{role:"user",content:text}] })
      });
      const data = await resp.json();
      isLocked = false;
      document.getElementById('status').innerText = 'SYSTEM READY';
      if(data && data.choices && data.choices[0] && data.choices[0].message){
        let answer = data.choices[0].message.content || '';
        // Zeige Antwort ohne MOVE-Tags
        addMsg('toni', answer.replace(/MOVE\[.*?\]/g,''));
        // Toni überdenkt seine Antwort: wir sprechen die Antwort mit kleinen Pausen
        speakStyled(answer.replace(/MOVE\[.*?\]/g,''));
        // Parse MOVE Befehle sicher: MOVE[homeX,YY,ZZ]
        const raw = [...answer.matchAll(/MOVE\[\s*(home[1-9]|home1[0-1])\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\]/gi)];
        if(raw.length === 0) return;
        // Limit und Sanitization
        const MAX = 11;
        const moves = [];
        for(let i=0;i<Math.min(raw.length,MAX);i++){
          const m = raw[i];
          const id = m[1].toLowerCase();
          const xRaw = parseInt(m[2],10);
          const yRaw = parseInt(m[3],10);
          if(!/^home([1-9]|1[0-1])$/.test(id)) { logDebug('Ungültige ID übersprungen: ' + id); continue; }
          const x = Math.max(0,Math.min(100,isNaN(xRaw)?50:xRaw))/100;
          const y = Math.max(0,Math.min(100,isNaN(yRaw)?50:yRaw))/100;
          const el = document.getElementById(id);
          if(!el){ logDebug('Element nicht gefunden: ' + id); continue; }
          if(el.dataset && el.dataset.team && el.dataset.team !== 'home'){ logDebug('Nicht home, skip: ' + id); continue; }
          moves.push({id,x,y});
        }
        if(moves.length>0){
          // Führe sequentiell aus
          await moveHomePlayersSequential('pitch', moves);
          addMsg('toni', `Bewege ${moves.length} Spieler wie beschrieben.`);
        }
      }
    }catch(err){
      isLocked = false;
      addMsg('toni','Verbindungsfehler!');
      console.error('askToni error', err);
    }
  }

  function addMsg(role, txt){
    const h = document.getElementById('chat-history');
    const d = document.createElement('div');
    d.className = `msg ${role==='toni'?'toni':'user'}`;
    d.innerText = txt;
    h.appendChild(d);
    h.scrollTop = h.scrollHeight;
  }

  /* -------------------------
     Speech Recognition Shortcut
     ------------------------- */
  function startMic(){
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Rec){ alert('SpeechRecognition nicht verfügbar'); return; }
    const rec = new Rec();
    rec.lang = 'de-DE';
    rec.onresult = (e)=>{ document.getElementById('user-input').value = e.results[0][0].transcript; askToni(); };
    rec.start();
  }

  /* -------------------------
     Initialisierung
     ------------------------- */
  function startToni(){
    if(document.getElementById('password').value === 'Trainer2026'){
      GROQ_KEY = document.getElementById('user-key').value.trim();
      document.getElementById('login-overlay').style.display = 'none';
      resetBoard();
      setupVoice();
      logDebug('Toni initialisiert');
    } else {
      alert('Zutritt verweigert.');
    }
  }

  // Stimmen laden und initialisieren
  window.addEventListener('load', function(){
    // make ball draggable
    ensurePlayersHaveTeam();
    makeDraggableSafe(document.getElementById('ball'));
    // Stimmen
    if(speechSynthesis.getVoices().length === 0){
      speechSynthesis.onvoiceschanged = setupVoice;
    } else {
      setupVoice();
    }
    logDebug('UI geladen');
  });

  // Expose nützliche Funktionen für Konsole/Tests
  window.moveHomePlayersSequential = moveHomePlayersSequential;
  window.takeSnapshot = takeSnapshot;
  window.restoreSnapshot = restoreSnapshot;
  window.speakStyled = speakStyled;
  window.resetBoard = resetBoard;
  </script>
</body>
</html>
