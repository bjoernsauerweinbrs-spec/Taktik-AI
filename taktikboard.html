<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni 2.0 – Taktikboard</title>
    <style>
        :root {
            --green: #2ecc71;
            --bg-dark: #050608;
            --line: rgba(255,255,255,0.12);
            --text-light: rgba(255,255,255,0.9);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #050608;
            color: var(--text-light);
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        /* Sidebar bleibt starr */
        #chat-sidebar {
            background: #111319;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--line);
        }

        #chat-history {
            flex: 1;
            overflow-y: auto; /* Hier wird gescrollt, damit das Board nicht wegrutscht */
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg { padding: 10px; border-radius: 10px; font-size: 0.9rem; max-width: 90%; }
        .user { align-self: flex-end; background: #2563eb; }
        .toni { align-self: flex-start; background: #1f2937; border-left: 3px solid var(--green); }

        /* Spielfeld Bereich */
        #pitch-area {
            display: flex;
            flex-direction: column;
            background: #0b1120;
            border-radius: 15px;
            padding: 10px;
            position: relative;
        }

        #pitch {
            flex: 1;
            background: #166534;
            border: 2px solid white;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        /* Kader Panel (Slide-In) */
        #kader-panel {
            position: absolute;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: white;
            color: black;
            transition: 0.3s ease;
            z-index: 1000;
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        #kader-panel.open { right: 0; }

        textarea { flex: 1; width: 100%; font-family: monospace; font-size: 1rem; padding: 10px; }

        /* Spieler */
        .player {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 10px; color: white; cursor: grab;
            transition: transform 0.1s; z-index: 10;
        }
        .home { background: radial-gradient(circle, #f87171, #b91c1c); border: 2px solid white; }
        .away { background: radial-gradient(circle, #60a5fa, #1d4ed8); border: 2px solid white; }
    </style>
</head>
<body>

<div id="layout">
    <aside id="chat-sidebar">
        <div style="padding:15px; border-bottom:1px solid var(--line); color:var(--green); font-weight:bold;">TRAINER-KOMMANDO</div>
        <div id="chat-history"></div>
        <div style="padding:10px; display:flex; gap:5px;">
            <input type="text" id="user-input" style="flex:1; background:#000; color:white; border:1px solid #333; padding:8px;" placeholder="Befehl...">
            <button onclick="askToni()" style="background:var(--green); border:none; padding:8px; cursor:pointer;">OK</button>
        </div>
    </aside>

    <main id="pitch-area">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <button onclick="resetBoard()" style="cursor:pointer;">♻ Grundordnung</button>
            <button onclick="toggleKader()" style="background:var(--green); border:none; color:white; padding:5px 15px; border-radius:5px; cursor:pointer;">📋 Kader</button>
        </div>
        <div id="pitch">
            <div id="players-layer"></div>
        </div>

        <div id="kader-panel">
            <h3>Kaderliste</h3>
            <p style="font-size: 0.8rem;">Beispiel: 1 Neuer</p>
            <textarea id="player-list" oninput="syncNames()" placeholder="1 Neuer"></textarea>
            <button onclick="toggleKader()" style="margin-top:10px;">Schließen</button>
        </div>
    </main>
</div>

<script>
    let GROQ_KEY = "DEIN_KEY"; // Hier den gsk_ Key eintragen

    function toggleKader() { document.getElementById('kader-panel').classList.toggle('open'); }

    function resetBoard() {
        const layer = document.getElementById('players-layer'); layer.innerHTML = "";
        const h = [[10,50],[25,25],[25,75],[45,50],[70,30],[70,70]]; // Einfache Startpos
        h.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'player home'; div.id = 'home' + (i+1);
            div.innerText = i+1; div.style.left = p[0]+"%"; div.style.top = p[1]+"%";
            layer.appendChild(div);
            makeDraggable(div);
        });
        syncNames();
    }

    function syncNames() {
        const text = document.getElementById('player-list').value;
        const lines = text.split('\n');
        lines.forEach(line => {
            const m = line.match(/^(\d+)\s*(.*)$/);
            if (m) {
                const el = document.getElementById('home' + m[1]);
                if (el && m[2].trim()) el.innerText = m[2].trim();
            }
        });
    }

    function makeDraggable(el) {
        let drag = false;
        el.onmousedown = () => drag = true;
        document.onmousemove = (e) => {
            if (!drag) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            el.style.left = ((e.clientX - r.left) / r.width * 100) + "%";
            el.style.top = ((e.clientY - r.top) / r.height * 100) + "%";
        };
        document.onmouseup = () => drag = false;
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value; if(!text) return;
        addMsg('user', text); input.value = "";

        const prompt = "Du bist Toni, BVB-Co-Trainer. Antworte kurz. Nutze MOVE[home1,20,30] für Bewegungen. Frage: " + text;
        
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST", headers: { "Authorization": "Bearer " + GROQ_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role:"system", content:prompt}] })
            });
            const data = await res.json();
            const answer = data.choices[0].message.content;
            addMsg('toni', answer.replace(/MOVE\[.*?\]/g, ""));
            
            // Stimme
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(answer.replace(/MOVE\[.*?\]/g, ""));
            utter.lang = 'de-DE'; synth.speak(utter);

            // Moves
            const moves = [...answer.matchAll(/MOVE\[(\w+),(\d+),(\d+)\]/g)];
            moves.forEach(m => {
                const el = document.getElementById(m[1]);
                if(el) { el.style.left = m[2]+"%"; el.style.top = m[3]+"%"; }
            });
        } catch(e) { console.error(e); }
    }

    function addMsg(s, t) {
        const h = document.getElementById('chat-history');
        const d = document.createElement('div'); d.className = 'msg ' + s; d.innerText = t;
        h.appendChild(d); h.scrollTop = h.scrollHeight;
    }

    window.onload = resetBoard;
</script>

</body>
</html>
