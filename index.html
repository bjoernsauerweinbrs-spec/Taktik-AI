<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni 2.0 - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #111; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .login-box { background: #222; padding: 30px; border-radius: 10px; border: 1px solid #444; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #555; background: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0044cc; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0055ff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Coach Toni 2.0</h2>
        <input type="text" id="name" placeholder="Name">
        <input type="password" id="pass" placeholder="Passwort">
        <input type="text" id="key" placeholder="Key">
        <button onclick="handleLogin()">Einloggen</button>
    </div>

    <script>
        function handleLogin() {
            const name = document.getElementById('name').value;
            const pass = document.getElementById('pass').value;
            const key = document.getElementById('key').value;

            // HIER DEINE DATEN PRÜFEN (Anpassen falls nötig)
            if (name.toLowerCase() === "björn" || name.toLowerCase() === "bjoern") {
                
                // Wir setzen den "Ausweis"
                localStorage.clear(); // Einmal aufräumen
                localStorage.setItem('isAuthorized', 'true');
                localStorage.setItem('userName', 'Björn');
                
                console.log("Login erfolgreich, leite weiter...");
                window.location.href = 'app.html';
            } else {
                alert("Zugriff verweigert! Name oder Key falsch.");
            }
        }
    </script>
</body>
</html>
