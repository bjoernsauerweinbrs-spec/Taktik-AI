<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Professional Tactical Hub</title>
<style>
  :root {
    --bg: #000;
    --neon: #39FF14;
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05);
  }
  body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  
  .app-container { display: grid; grid-template-columns: 80px 1fr 350px; height: 100vh; padding: 10px; gap: 10px; }

  @media (max-width: 850px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 300px; height: auto; overflow-y: auto; }
    .left-nav { flex-direction: row !important; width: 100%; height: 60px; padding: 0 !important; justify-content: space-around; }
    .overlay { inset: 5px !important; width: 98% !important; height: 95% !important; }
  }

  .left-nav { background: var(--glass); border-radius: 12px; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; border: 1px solid rgba(255,255,255,0.1); }
  .nav-item { width: 45px; height: 45px; border-radius: 10px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }

  .center-arena { background: #051205; border-radius: 12px; display: flex; flex-direction: column; padding: 10px; border: 1px solid rgba(57,255,20,0.1); }
  canvas { background: #010a01; border-radius: 6px; width: 100%; height: auto; box-shadow: 0 0 20px #000; }

  .right-toni { background: var(--glass); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-box { flex: 1; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 12px; border-radius: 8px; max-width: 85%; }
  .msg.ai { background: rgba(57, 255, 20, 0.1); align-self: flex-start; border-left: 2px solid var(--neon); }

  /* Overlay & FIFA Card Edit */
  .overlay { position: fixed; inset: 20px 380px 20px 100px; background: #070f07; border: 1px solid var(--neon); border-radius: 15px; z-index: 100; display: none; flex-direction: column; padding: 20px; }
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; overflow-y: auto; }
  
  .fifa-card { 
    width: 130px; height: 180px; background: var(--gold); border-radius: 8px; color: #000; 
    position: relative; padding: 10px; cursor: pointer; transition: 0.3s; 
  }
  .fifa-card:hover { transform: scale(1.05) rotateY(10deg); }
  
  /* Editor UI */
  .editor-pane { display: none; background: rgba(0,0,0,0.9); border: 1px solid var(--neon); padding: 20px; border-radius: 12px; position: absolute; inset: 10px; z-index: 10; overflow-y: auto; }
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 11px; color: var(--neon); margin-bottom: 4px; text-transform: uppercase; }
  .input-group input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 4px; }
</style>
</head>
<body>

<div class="app-container">
  <div class="left-nav">
    <div class="nav-item" onclick="openSektor('kabine')">💼</div>
    <div class="nav-item" onclick="openSektor('analyse')">❤️</div>
    <div class="nav-item">🎙️</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="generateReport()">📰</div>
  </div>

  <div class="center-arena">
    <div style="color:var(--neon); font-size:12px; margin-bottom:5px;">MATCH-CENTER: LIVE</div>
    <canvas id="board" width="800" height="500"></canvas>
  </div>

  <div class="right-toni">
    <div style="font-weight:bold; color:var(--neon)">TONI 2.0 AI</div>
    <div class="chat-box" id="chat">
      <div class="msg ai">Toni: System bereit. Klicke auf die Kabine, um Spielerdaten zu pflegen oder die Analyse zu starten.</div>
    </div>
    <input id="command" type="text" placeholder="Befehl..." style="background:#111; border:1px solid #333; color:#fff; padding:10px; border-radius:6px;">
  </div>
</div>

<div id="ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h3 id="ov-title" style="margin:0; color:var(--neon)">AKTENTASCHE</h3>
    <span onclick="closeOverlay()" style="cursor:pointer; font-size:24px;">✕</span>
  </div>
  
  <div id="grid-main" class="fifa-grid"></div>

  <div id="editor" class="editor-pane">
    <h4 id="edit-name" style="margin-top:0; color:var(--neon)">Spieler bearbeiten</h4>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="input-group"><label>Name</label><input type="text" id="in-name"></div>
      <div class="input-group"><label>Rating</label><input type="number" id="in-rating"></div>
      <div class="input-group"><label>Puls (BPM)</label><input type="number" id="in-bpm"></div>
      <div class="input-group"><label>SpO2 (%)</label><input type="number" id="in-spo2"></div>
      <div class="input-group"><label>Gewicht (kg)</label><input type="number" id="in-weight"></div>
      <div class="input-group"><label>Körperfett (%)</label><input type="number" id="in-fat"></div>
      <div class="input-group"><label>Bild URL</label><input type="text" id="in-img" placeholder="https://..."></div>
    </div>
    <button onclick="savePlayer()" style="width:100%; padding:12px; background:var(--neon); border:none; border-radius:6px; font-weight:bold; margin-top:10px;">SPEICHERN & SYNCHRONISIEREN</button>
  </div>
</div>

<script>
  // ZENTRALES DATEN-OBJEKT
  let players = [
    {id: 0, name: 'Müller', rating: 92, bpm: 60, spo2: 98, weight: 82, fat: 10, pos: 'ST', img: ''},
    {id: 1, name: 'Silva', rating: 88, bpm: 64, spo2: 99, weight: 78, fat: 11, pos: 'CM', img: ''},
    {id: 2, name: 'Neuer', rating: 90, bpm: 58, spo2: 98, weight: 92, fat: 12, pos: 'GK', img: ''}
  ];
  
  let currentPlayerId = null;

  function openSektor(s) {
    document.getElementById('ov').style.display = 'flex';
    const grid = document.getElementById('grid-main');
    grid.innerHTML = '';
    
    if(s === 'kabine') {
      players.forEach(p => {
        grid.innerHTML += `
          <div class="fifa-card" onclick="editPlayer(${p.id})">
            <div style="font-size:24px; font-weight:bold;">${p.rating}</div>
            <div style="font-size:10px;">${p.pos}</div>
            <div style="height:70px; background:rgba(0,0,0,0.1); margin:10px 0; border-radius:4px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
               ${p.img ? `<img src="${p.img}" style="width:100%">` : '👤'}
            </div>
            <div style="text-align:center; font-weight:bold; text-transform:uppercase; font-size:14px; border-bottom:1px solid rgba(0,0,0,0.2);">${p.name}</div>
            <div style="font-size:9px; margin-top:5px; display:grid; grid-template-columns:1fr 1fr;">
              <span>❤️ ${p.bpm}</span><span>💨 ${p.spo2}%</span>
              <span>⚖️ ${p.weight}kg</span><span>🔥 ${p.fat}%</span>
            </div>
          </div>`;
      });
    } else if(s === 'analyse') {
      grid.innerHTML = '<div style="grid-column:1/-1;"><h3>LIVE-ANALYSE DASHBOARD</h3></div>';
      players.forEach(p => {
        const warn = p.bpm > 100 ? 'color:red; font-weight:bold;' : 'color:var(--neon);';
        grid.innerHTML += `
          <div style="background:var(--glass); padding:15px; border-radius:8px; border:1px solid #333;">
            <div style="font-weight:bold;">${p.name}</div>
            <div style="font-size:20px; ${warn}">Puls: ${p.bpm} BPM</div>
            <div style="font-size:12px; opacity:0.7;">Fettanteil: ${p.fat}% | SpO2: ${p.spo2}%</div>
          </div>`;
      });
    }
  }

  function editPlayer(id) {
    currentPlayerId = id;
    const p = players.find(x => x.id === id);
    document.getElementById('editor').style.display = 'block';
    document.getElementById('edit-name').innerText = p.name + ' bearbeiten';
    document.getElementById('in-name').value = p.name;
    document.getElementById('in-rating').value = p.rating;
    document.getElementById('in-bpm').value = p.bpm;
    document.getElementById('in-spo2').value = p.spo2;
    document.getElementById('in-weight').value = p.weight;
    document.getElementById('in-fat').value = p.fat;
    document.getElementById('in-img').value = p.img;
  }

  function savePlayer() {
    const p = players.find(x => x.id === currentPlayerId);
    p.name = document.getElementById('in-name').value;
    p.rating = document.getElementById('in-rating').value;
    p.bpm = document.getElementById('in-bpm').value;
    p.spo2 = document.getElementById('in-spo2').value;
    p.weight = document.getElementById('in-weight').value;
    p.fat = document.getElementById('in-fat').value;
    p.img = document.getElementById('in-img').value;
    
    document.getElementById('editor').style.display = 'none';
    openSektor('kabine'); // Refresh Kabine
    
    // TONI FEEDBACK
    if(p.bpm > 160) {
      addChat(`WARNUNG: ${p.name} hat einen kritischen Puls von ${p.bpm}! Sofortige Belastungsreduktion empfohlen.`);
    } else {
      addChat(`Daten von ${p.name} wurden synchronisiert.`);
    }
  }

  function addChat(txt) {
    const chat = document.getElementById('chat');
    chat.innerHTML += `<div class="msg ai">Toni: ${txt}</div>`;
    chat.scrollTop = chat.scrollHeight;
  }

  function closeOverlay() { document.getElementById('ov').style.display = 'none'; document.getElementById('editor').style.display = 'none'; }
  
  // Arena Init
  const ctx = document.getElementById('board').getContext('2d');
  function draw() { ctx.fillStyle='#051205'; ctx.fillRect(0,0,800,500); ctx.strokeStyle='rgba(57,255,20,0.2)'; ctx.strokeRect(20,20,760,460); }
  draw();
</script>
</body>
</html>
