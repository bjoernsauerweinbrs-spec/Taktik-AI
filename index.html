<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni AI - Taktik & Training</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #app { background: white; width: 95%; max-width: 500px; height: 90vh; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #1a1a1a; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 4px solid #28a745; }
        #login-screen, #chat-screen { flex: 1; display: flex; flex-direction: column; padding: 25px; }
        input { padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        input:focus { border-color: #28a745; }
        button { background: #28a745; color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #218838; }
        #chat-history { flex: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; position: relative; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .toni { align-self: flex-start; background: #e9e9eb; color: #333; border-bottom-left-radius: 2px; }
        .error-msg { color: #dc3545; font-size: 0.8rem; margin-top: 5px; text-align: center; font-style: italic; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">⚽ COACH TONI</div>
    
    <div id="login-screen">
        <h3 style="text-align:center; margin-bottom: 20px;">Trainer-Anmeldung</h3>
        <input type="text" id="username" placeholder="Dein Name">
        <input type="password" id="password" placeholder="Passwort (Trainer2026)">
        <input type="text" id="user-key" placeholder="Google API-Key (AIza...)">
        <button onclick="startToni()">Toni aktivieren</button>
        <p style="font-size: 0.75rem; color: #666; text-align: center; margin-top: 20px;">
            Noch kein Key? <a href="https://aistudio.google.com/" target="_blank" style="color: #007bff;">Hier kostenlos erstellen</a>.
        </p>
    </div>

    <div id="chat-screen" style="display:none">
        <div id="chat-history"></div>
        <div id="toni-status" class="error-msg" style="display:none"></div>
        <div style="display:flex; gap:8px">
            <input type="text" id="user-input" style="flex:1" placeholder="Frag Toni nach einer Übung...">
            <button onclick="askToni()">FRAGEN</button>
        </div>
        <button onclick="location.reload()" style="background:#6c757d; margin-top:10px; padding:6px; font-size:0.7rem;">Abmelden / Key ändern</button>
    </div>
</div>

<script>
    let USER_KEY = "";
    let USER_NAME = "";

    // Login-Funktion
    function startToni() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const key = document.getElementById('user-key').value.trim();

        if (user && pass === "Trainer2026" && key.startsWith("AIza")) {
            USER_KEY = key;
            USER_NAME = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            addMsg("toni", `Servus ${user}! Ich bin Toni. Dein Key ist geladen. Was trainieren wir heute? Funino, Taktik oder Technik?`);
        } else {
            alert("Fehler: Bitte Name, das richtige Passwort (Trainer2026) und einen gültigen Key (AIza...) eingeben!");
        }
    }

    // KI-Anfrage an Google
    async function askToni() {
        const input = document.getElementById('user-input');
        const statusDiv = document.getElementById('toni-status');
        const text = input.value.trim();
        
        if (!text) return;

        addMsg("user", text);
        input.value = "";
        statusDiv.style.display = "none";

        // Schnittstelle zu Google Gemini 1.5 Flash
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${USER_KEY}`;
        
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Du bist Toni, ein erfahrener Fußballtrainer für Kinder und Jugendliche. Du bist motivierend, kompetent und antwortest präzise. Frage: ${text}` }] }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                // Diagnose: Was sagt Google?
                statusDiv.innerText = "Google-Fehler: " + data.error.message;
                statusDiv.style.display = "block";
                addMsg("toni", "Hoppla, da stimmt was mit dem Key nicht. Schau mal auf die rote Meldung unten.");
            } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                const answer = data.candidates[0].content.parts[0].text;
                addMsg("toni", answer);
            }
        } catch (e) {
            addMsg("toni", "Technischer Fehler: Keine Verbindung zu Google möglich.");
        }
    }

    // Nachricht im Chat anzeigen
    function addMsg(role, text) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
