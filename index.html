<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Titan Master Build v4.5</title>
<style>
  :root {
    --bg: #010401;
    --neon: #39FF14;
    --neon-dim: rgba(57, 255, 20, 0.15);
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05);
    --red: #ff3333;
    --yellow: #ffcc00;
    --club-color: #39FF14;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { 
    margin: 0; padding: 0; height: 100%; width: 100%; 
    background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; 
    overflow: hidden; 
  }

  /* --- APP STRUCTURE --- */
  .app-container {
    display: grid;
    grid-template-columns: 80px 1fr 380px;
    height: 100vh;
    padding: 12px;
    gap: 12px;
  }

  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; overflow-y: auto; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
  }

  /* --- NAVIGATION --- */
  .left-nav {
    background: var(--glass);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 0;
    gap: 20px;
    backdrop-filter: blur(15px);
  }

  .nav-item {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    border: 1px solid var(--neon);
    color: var(--neon);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 26px;
    transition: 0.3s;
  }

  .nav-item:hover {
    background: var(--neon-dim);
    box-shadow: 0 0 20px var(--neon);
    transform: scale(1.05);
  }

  /* --- ARENA --- */
  .center-arena {
    background: #000;
    border-radius: 20px;
    border: 1px solid var(--neon-dim);
    display: flex;
    flex-direction: column;
    padding: 15px;
    position: relative;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
  }

  .arena-header {
    display: flex;
    justify-content: space-between;
    color: var(--neon);
    font-size: 13px;
    border-bottom: 1px solid var(--glass);
    padding-bottom: 8px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  #board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  canvas {
    background: #010a01;
    border-radius: 10px;
    box-shadow: 0 0 40px #000;
    max-width: 100%;
    height: auto;
  }

  /* --- TONI LIVE CONSOLE --- */
  .right-toni {
    background: var(--glass);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    border: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
  }

  .chat-history {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    padding: 12px 16px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 90%;
  }

  .msg.ai {
    background: var(--neon-dim);
    align-self: flex-start;
    border-left: 4px solid var(--neon);
    border-bottom-left-radius: 2px;
  }

  .cmd-input {
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.3);
    padding: 5px;
    border-radius: 12px;
    border: 1px solid #333;
  }

  .cmd-input input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    padding: 10px;
    outline: none;
  }

  /* --- OVERLAY HUB --- */
  .overlay {
    position: fixed;
    inset: 20px 410px 20px 105px;
    background: rgba(2, 8, 2, 0.99);
    border: 1px solid var(--neon);
    border-radius: 25px;
    z-index: 1000;
    display: none;
    flex-direction: column;
    padding: 30px;
    backdrop-filter: blur(30px);
    box-shadow: 0 0 100px #000;
  }

  .scroll-content { flex: 1; overflow-y: auto; padding-right: 10px; }
  .close-btn { cursor: pointer; font-size: 45px; color: var(--neon); line-height: 0.5; }

  /* AKTENTASCHE OPTIK */
  .folder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 25px;
    margin-top: 30px;
    text-align: center;
  }

  .folder-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid #333;
    padding: 30px 20px;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
    position: relative;
  }

  .folder-item:hover {
    border-color: var(--neon);
    background: var(--neon-dim);
    transform: translateY(-5px);
  }

  .folder-icon { font-size: 55px; display: block; margin-bottom: 12px; }

  /* FIFA CARDS */
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 20px; }
  
  .fifa-card {
    width: 175px;
    height: 245px;
    background: var(--gold);
    border-radius: 12px;
    color: #000;
    position: relative;
    padding: 12px;
    cursor: pointer;
    font-family: 'Arial Black', sans-serif;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    transition: 0.3s;
  }

  .fifa-card:hover { transform: translateY(-8px); }

  .status-light {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #000;
  }

  .status-match { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
  .status-training { background: #ffff00; box-shadow: 0 0 10px #ffff00; }
  .status-absent { background: #ff0000; box-shadow: 0 0 10px #ff0000; }

  .card-rating { font-size: 42px; position: absolute; top: 12px; left: 14px; line-height: 0.8; }
  .card-pos { font-size: 14px; position: absolute; top: 52px; left: 15px; }

  .card-photo {
    width: 105px; height: 105px;
    background: rgba(0,0,0,0.1);
    margin: 12px auto 0 auto;
    border-bottom: 2px solid #000;
    overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }

  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .card-name { text-align: center; font-size: 18px; text-transform: uppercase; margin: 5px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }

  .card-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 15px;
    font-size: 11px;
    padding: 5px 12px;
  }

  /* LABORATORY (HIGH TECH) */
  .lab-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--neon-dim);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .lab-card::before {
    content: ''; position: absolute; left: 0; top: 0; width: 6px; height: 100%;
    background: var(--neon); box-shadow: 0 0 15px var(--neon);
  }

  .readiness-box {
    position: absolute; top: 20px; right: 20px;
    text-align: center;
  }

  .readiness-val { font-size: 34px; font-weight: bold; color: var(--neon); line-height: 1; }
  .readiness-label { font-size: 9px; text-transform: uppercase; color: #888; }

  .stat-row { display: flex; justify-content: space-between; font-size: 14px; margin: 8px 0; border-bottom: 1px solid #222; padding-bottom: 4px; }
  .stat-highlight { color: var(--neon); font-weight: bold; }

  /* STADIONZEITUNG */
  .magazine-view {
    background: #fff; color: #333; padding: 60px; border-radius: 5px; min-height: 900px;
    box-shadow: 0 0 60px #000; position: relative;
  }

  .mag-header { border-bottom: 5px solid #000; padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
  .mag-header h1 { margin: 0; font-size: 40px; letter-spacing: -1px; }

  .mag-editable {
    border: 1px dashed transparent; padding: 15px; margin-bottom: 20px;
    outline: none; transition: 0.2s; font-family: 'Georgia', serif; line-height: 1.6;
  }

  .mag-editable:hover { border-color: #999; background: #fcfcfc; }

  /* GATES */
  .gate-screen {
    position: fixed; inset: 0; background: var(--bg); z-index: 9999;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 25px;
  }

  .gate-input {
    background: #000; border: 2px solid var(--neon); color: var(--neon);
    padding: 22px; border-radius: 15px; text-align: center; font-size: 30px;
    width: 350px; letter-spacing: 8px; box-shadow: 0 0 30px rgba(57,255,20,0.2);
  }

  .btn-gate {
    background: var(--neon); color: #000; padding: 18px 80px;
    border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
    font-size: 18px; text-transform: uppercase; letter-spacing: 2px;
  }

</style>
</head>
<body>

<div id="login-gate" class="gate-screen">
  <h1 style="color:var(--neon); letter-spacing: 15px; text-shadow: 0 0 30px var(--neon); margin:0;">TONI 2.0</h1>
  <p style="opacity:0.5; font-size:12px;">SYSTEM BOOT SEQUENCE: 2026</p>
  <input type="password" id="gate-pw" class="gate-input" placeholder="••••">
  <button onclick="checkAccess()" class="btn-gate">ZUGRIFF BESTÄTIGEN</button>
  <p style="font-size: 10px; color: #444; margin-top: 50px;">ADMIN-BYPASS: 1234</p>
</div>

<div id="onboarding" class="gate-screen" style="display:none">
  <div style="text-align:center; max-width:450px; width:100%;">
    <h2 id="ob-title" style="color:var(--neon); margin-bottom:20px; letter-spacing:3px;">IDENTITY SETUP</h2>
    <p id="ob-desc" style="margin-bottom:25px; line-height:1.5;">Hallo Coach! Ich bin Toni. Wie ist dein Name?</p>
    <input type="text" id="ob-input" class="gate-input" style="letter-spacing:normal; font-size:20px; width:100%;">
    <br><br>
    <div id="ob-colors" style="display:none; gap:15px; justify-content:center; margin-bottom:25px;">
        <div onclick="pickClubColor('#ff0000')" style="width:50px; height:50px; background:red; border-radius:50%; cursor:pointer; border:3px solid transparent;" id="c-red"></div>
        <div onclick="pickClubColor('#0000ff')" style="width:50px; height:50px; background:blue; border-radius:50%; cursor:pointer; border:3px solid transparent;" id="c-blue"></div>
        <div onclick="pickClubColor('#ffffff')" style="width:50px; height:50px; background:white; border-radius:50%; cursor:pointer; border:3px solid #333;" id="c-white"></div>
        <div onclick="pickClubColor('#ffff00')" style="width:50px; height:50px; background:yellow; border-radius:50%; cursor:pointer; border:3px solid transparent;" id="c-yellow"></div>
    </div>
    <button onclick="handleObStep()" class="btn-gate" style="width:100%;">BESTÄTIGEN</button>
  </div>
</div>

<div class="app-container" id="main-app" style="display:none">
  <div class="left-nav">
    <div class="nav-item" onclick="openBriefcase()" title="Aktentasche (Management)">💼</div>
    <div class="nav-item" onclick="openSektor('analyse')" title="Bio-Data Hub (Labor)">🧪</div>
    <div class="nav-item" onclick="toniSpeak('Gegenpressing-Modus aktiviert! Wir gehen voll drauf!')" title="Toni Voice">🎙️</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="systemReset()" style="color:var(--red); border-color:var(--red);" title="Reset">🔁</div>
  </div>

  <div class="center-arena">
    <div class="arena-header">
      <strong id="header-club">VFL MUSTERSTADT</strong>
      <span id="header-age">[ PRO PERFORMANCE ]</span>
    </div>
    <div id="board-wrap">
      <canvas id="arena-canvas" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong style="color:var(--neon); letter-spacing:1px; font-size:16px;">TONI AI LIVE</strong>
      <span id="ai-status" style="font-size:10px; color:var(--neon); animation:pulse 2s infinite;">● ONLINE</span>
    </div>
    <div class="chat-history" id="chat-box"></div>
    <div class="cmd-input">
      <input type="text" id="user-cmd" placeholder="Toni eine Anweisung geben..." onkeypress="if(event.key==='Enter') sendCmd()">
      <button onclick="sendCmd()" style="background:none; border:none; color:var(--neon); cursor:pointer; font-size:18px;">➔</button>
    </div>
  </div>
</div>

<div id="hub-ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; border-bottom:1px solid var(--neon-dim); padding-bottom:15px;">
    <h2 id="hub-title" style="margin:0; color:var(--neon); letter-spacing:4px; text-transform:uppercase;">SYSTEM HUB</h2>
    <div style="display:flex; gap:20px; align-items:center;">
      <button id="add-player-btn" onclick="addNewPlayer()" style="background:var(--neon); color:#000; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; display:none; cursor:pointer;">+ SPIELER HINZUFÜGEN</button>
      <span class="close-btn" onclick="closeHub()">✕</span>
    </div>
  </div>
  
  <div class="scroll-content" id="hub-content"></div>
</div>

<script>
  const canvas = document.getElementById('arena-canvas');
  const ctx = canvas.getContext('2d');
  
  // DATEN-PERSISTENZ (TITAN CORE)
  let user = JSON.parse(localStorage.getItem('toni_titan_v45_user')) || null;
  let squad = JSON.parse(localStorage.getItem('toni_titan_v45_squad')) || [];

  // 16 REAL PLAYER SETUP (EXACT BIA DATA)
  if(squad.length === 0) {
    const n = ['Müller','Silva','Schneider','Fischer','Weber','Meyer','Wagner','Becker','Schulz','Hoffmann','Schäfer','Koch','Bauer','Richter','Klein','Wolf'];
    const p = ['ST','ST','IV','IV','RV','LV','ZM','ZM','LM','RM','IV','ZM','RV','LV','LM','ST'];
    for(let i=0; i<16; i++) {
      squad.push({
        id: i, name: n[i], pos: p[i], rating: 80 + Math.floor(Math.random()*12),
        status: i<11 ? 'match' : (i<14 ? 'training' : 'absent'),
        x: 100 + (i*55), y: 640, // Startposition auf der Bank
        weight: i==0?82.4:(i==1?76.2:78), fat: i==0?10.2:(i==1?11.5:12.4),
        muscle: 38, bone: 3.8, water: 62, visceral: 4, bpm: 62, hrv: 55, sleep: 82, spo2: 98, img: '',
        pac: 85, sho: 88, pas: 80, dri: 82, def: 45, phy: 80
      });
    }
    localStorage.setItem('toni_titan_v45_squad', JSON.stringify(squad));
  }

  let obStep = 0; let curClubColor = '#39FF14';

  // 1. ACCESS CONTROL
  function checkAccess() {
    if(document.getElementById('gate-pw').value === '1234') {
      document.getElementById('login-gate').style.display='none';
      if(!user) document.getElementById('onboarding').style.display='flex'; else initSystem();
    } else alert("ZUGRIFF VERWEIGERT.");
  }

  // 2. ONBOARDING
  function handleObStep() {
    const i = document.getElementById('ob-input'); const val = i.value;
    if(obStep === 0) {
      if(!val) return; user = { coach: val }; 
      document.getElementById('ob-desc').innerText=`Servus ${val}! Welchen Verein trainierst du?`;
      i.value = ""; obStep++;
    } else if(obStep === 1) {
      if(!val) return; user.club = val;
      document.getElementById('ob-desc').innerText=`Wähle deine Vereinsfarbe:`;
      i.style.display = 'none'; document.getElementById('ob-colors').style.display = 'flex'; obStep++;
    } else {
      user.age = "Elite Performance";
      localStorage.setItem('toni_titan_v45_user', JSON.stringify(user)); initSystem();
    }
  }

  function pickClubColor(c) { curClubColor = c; user.color = c; handleObStep(); }

  function initSystem() {
    document.getElementById('onboarding').style.display='none';
    document.getElementById('main-app').style.display='grid';
    document.getElementById('header-club').innerText = user.club.toUpperCase();
    document.documentElement.style.setProperty('--club-color', user.color);
    renderArena();
    toniSpeak(`Servus ${user.coach}! Titan Build v4.5 ist einsatzbereit. Alle Daten für den ${user.club} sind synchronisiert.`);
  }

  // 3. PIXEL-PERFECT PITCH ENGINE
  function drawPitch() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#021a02'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 2;
    
    const isJunior = user.age.toLowerCase().includes('g-') || user.age.toLowerCase().includes('junior');

    if(isJunior) { // FUNINO MODE
      ctx.strokeRect(100, 100, canvas.width-200, canvas.height-200);
      ctx.strokeRect(100, 180, 15, 80); ctx.strokeRect(100, 440, 15, 80);
      ctx.strokeRect(canvas.width-115, 180, 15, 80); ctx.strokeRect(canvas.width-115, 440, 15, 80);
      ctx.beginPath(); ctx.moveTo(canvas.width/2, 100); ctx.lineTo(canvas.width/2, canvas.height-100); ctx.stroke();
    } else { // PRO-PITCH FULL DETAIL
      ctx.strokeRect(40, 40, canvas.width-80, canvas.height-180);
      ctx.beginPath(); ctx.moveTo(canvas.width/2, 40); ctx.lineTo(canvas.width/2, canvas.height-140); ctx.stroke();
      ctx.beginPath(); ctx.arc(canvas.width/2, (canvas.height-100)/2, 80, 0, Math.PI*2); ctx.stroke();
      ctx.strokeRect(40, canvas.height/2-150, 120, 300); ctx.strokeRect(canvas.width-160, canvas.height/2-150, 120, 300); // 16er
      ctx.strokeRect(40, canvas.height/2-70, 50, 140); ctx.strokeRect(canvas.width-90, canvas.height/2-70, 50, 140); // 5er
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath(); ctx.arc(130, canvas.height/2, 4, 0, Math.PI*2); ctx.fill(); // Elfmeterpunkt
      ctx.beginPath(); ctx.arc(canvas.width-130, canvas.height/2, 4, 0, Math.PI*2); ctx.fill();
    }
    
    // ERSATZBANK BEREICH
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, canvas.height-130, canvas.width, 130);
    ctx.strokeStyle = '#39FF14'; ctx.setLineDash([5,5]); ctx.strokeRect(5, canvas.height-125, canvas.width-10, 120);
    ctx.setLineDash([]); ctx.fillStyle = '#39FF14'; ctx.font = 'bold 11px Arial'; ctx.fillText("ERSATZBANK / SQUAD HUB", 15, canvas.height-110);
  }

  function renderArena() {
    drawPitch();
    squad.forEach(p => {
      if(p.y < canvas.height - 130) {
        // Spieler auf dem Feld -> Leuchtender Punkt in Vereinsfarbe
        ctx.shadowBlur = 15; ctx.shadowColor = user.color;
        ctx.fillStyle = user.color; ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = 'bold 14px Arial'; ctx.textAlign='center';
        ctx.fillText(p.name[0], p.x, p.y+5);
      } else {
        // Spieler auf der Bank -> Mini FIFA Karte
        ctx.fillStyle = '#bf953f'; ctx.fillRect(p.x-20, p.y-30, 40, 60);
        ctx.fillStyle = '#000'; ctx.font = 'bold 8px Arial'; ctx.textAlign='center';
        ctx.fillText(p.name, p.x, p.y+20); ctx.fillText(p.pos, p.x, p.y-12);
      }
    });
  }

  // --- TONI LIVE INTELLIGENCE ---
  function toniSpeak(text) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div class="msg ai">Toni: ${text}</div>`; box.scrollTop = box.scrollHeight;
    const ut = new SpeechSynthesisUtterance(text); ut.lang = 'de-DE'; ut.pitch = 0.8;
    const voices = window.speechSynthesis.getVoices();
    ut.voice = voices.find(v => v.name.includes('Google') && v.name.includes('Deutsch')) || voices[0];
    window.speechSynthesis.speak(ut);
  }

  function sendCmd() {
    const i = document.getElementById('user-cmd'); if(!i.value) return;
    toniSpeak(`Analysiere Problemstellung: "${i.value}"... Greife auf Online-Datenbanken zu.`);
    setTimeout(() => {
      toniSpeak(`Recherche abgeschlossen. Ich habe passende Übungen für dein Problem gefunden. Soll ich sie auf dem Board animieren oder suchst du ein YouTube Video?`);
      const chat = document.getElementById('chat-box');
      chat.innerHTML += `<div class="msg ai" style="background:rgba(0,0,0,0.5); font-size:11px;"><a href="https://www.youtube.com/results?search_query=fußball+training+${i.value}" target="_blank" style="color:var(--neon)">➔ Passende YouTube Videos öffnen</a></div>`;
      i.value = '';
    }, 2000);
  }

  // --- HUB & BRIEFCASE (AKTTENTASCHE) ---
  function openBriefcase() {
    const ov = document.getElementById('hub-ov'); ov.style.display='flex';
    document.getElementById('hub-title').innerText = 'AKTTENTASCHE: MANAGEMENT';
    const c = document.getElementById('hub-content'); c.className = 'scroll-content folder-grid';
    c.innerHTML = `
      <div class="folder-item" onclick="openSektor('kabine')"><span class="folder-icon">👕</span><strong>KABINE</strong></div>
      <div class="folder-item" onclick="openSektor('analyse')"><span class="folder-icon">🧪</span><strong>LABOR</strong></div>
      <div class="folder-item" onclick="openSektor('business')"><span class="folder-icon">🤝</span><strong>SPONSORING</strong></div>
      <div class="folder-item" onclick="openSektor('zeitung')"><span class="folder-icon">📰</span><strong>ZEITUNG</strong></div>
    `;
  }

  function openSektor(s) {
    const c = document.getElementById('hub-content'); const t = document.getElementById('hub-title');
    c.innerHTML = ''; c.className = 'scroll-content';
    if(s === 'kabine') {
      t.innerText = 'KADER-ÜBERSICHT & AMPEL'; c.className = 'scroll-content fifa-grid';
      squad.forEach(p => {
        const sClass = p.status === 'match' ? 'status-match' : (p.status === 'training' ? 'status-training' : 'status-absent');
        c.innerHTML += `
          <div class="fifa-card" onclick="toggleStatus(${p.id})">
            <div class="status-light ${sClass}"></div>
            <div class="card-rating">${p.rating}</div><div class="card-pos">${p.pos}</div>
            <div class="card-photo">👤</div><div class="card-name">${p.name}</div>
            <div class="card-stats-grid"><span>PAC ${p.pac}</span><span>DRI ${p.dri}</span><span>SHO ${p.sho}</span><span>DEF ${p.def}</span></div>
          </div>`;
      });
    } else if(s === 'analyse') {
      t.innerText = 'BIO-DATA HUB (LEISTUNGSLABOR)';
      squad.forEach(p => {
        let readiness = Math.round((p.sleep + (p.hrv/1.5) + (100 - (p.bpm-40))) / 3);
        let color = readiness > 75 ? 'var(--neon)' : (readiness > 55 ? 'yellow' : 'var(--red)');
        c.innerHTML += `
          <div class="lab-card">
            <div class="readiness-box"><span class="readiness-val" style="color:${color}">${readiness}%</span><div class="readiness-label">Readiness</div></div>
            <strong>${p.name.toUpperCase()}</strong><br><small>Position: ${p.pos}</small>
            <div style="margin-top:20px;">
              <div class="stat-row"><span>KÖRPERFETT / MUSKELMASSE</span><span class="stat-highlight">${p.fat}% / ${p.muscle}kg</span></div>
              <div class="stat-row"><span>RUHEPULS / HRV</span><span class="stat-highlight">${p.bpm}bpm / ${p.hrv}ms</span></div>
              <div class="stat-row"><span>SCHLAF / REGENERATION</span><span class="stat-highlight">${p.sleep}% / Level 4</span></div>
            </div>
          </div>`;
      });
    } else if(s === 'zeitung') {
      t.innerText = 'STADIONZEITUNG EDITOR';
      c.innerHTML = `
        <div class="magazine-view">
          <div class="mag-header"><h1>${user.club.toUpperCase()} MATCHDAY</h1><p>Ausgabe 02/2026 | Powered by TONI AI</p></div>
          <div class="mag-editable" contenteditable="true"><h3>Wort vom Vorstand</h3>Herzlich Willkommen zum heutigen Spiel...</div>
          <div class="mag-editable" contenteditable="true"><h3>Analyse vom Coach</h3>"Heute zählt nur der Sieg. Wir haben die Daten analysiert..."</div>
        </div>
        <button onclick="window.print()" style="width:100%; padding:20px; background:var(--neon); color:#000; font-weight:bold; border:none; margin-top:20px; border-radius:10px; cursor:pointer;">ZEITUNG DRUCKEN / EXPORT</button>`;
    }
  }

  function toggleStatus(id) {
    const p = squad.find(x => x.id === id);
    if(p.status === 'match') p.status = 'training'; else if(p.status === 'training') p.status = 'absent'; else p.status = 'match';
    localStorage.setItem('toni_titan_v45_squad', JSON.stringify(squad)); openSektor('kabine');
  }

  // --- DRAG & DROP ENGINE ---
  let dragPlayer = null;
  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width/rect.width);
    const my = (e.clientY - rect.top) * (canvas.height/rect.height);
    dragPlayer = squad.find(p => Math.hypot(p.x - mx, p.y - my) < 30);
  };
  canvas.onmousemove = (e) => {
    if(dragPlayer) {
      const rect = canvas.getBoundingClientRect();
      dragPlayer.x = (e.clientX - rect.left) * (canvas.width/rect.width);
      dragPlayer.y = (e.clientY - rect.top) * (canvas.height/rect.height);
      renderArena();
    }
  };
  canvas.onmouseup = () => { dragPlayer = null; localStorage.setItem('toni_titan_v45_squad', JSON.stringify(squad)); };

  function closeHub() { document.getElementById('hub-ov').style.display='none'; }
  function systemReset() { if(confirm("ALLES LÖSCHEN?")) { localStorage.clear(); location.reload(); } }
  if(user) initSystem();
</script>
</body>
</html>
