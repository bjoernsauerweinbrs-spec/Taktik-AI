<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coach Toni 2.0 – Initialisierung</title>
    <style>
        :root {
            --green: #2ecc71;
            --accent: #0a74da;
            --bg: #07101a;
            --panel: #0f1720;
            --text: #e6eef0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1b2333 0, #050608 55%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .login-card {
            background: #0b1220;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        h2 { color: var(--green); margin-bottom: 10px; font-weight: 800; }
        p { color: #9aa3ad; margin-bottom: 25px; font-size: 0.95rem; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--green); }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #26303a;
            background: #07101a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            border: none;
            background: var(--green);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { background: #27ae60; transform: translateY(-2px); }
        .footer-note { margin-top: 20px; font-size: 0.75rem; color: #4b5563; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>⚽ COACH TONI 2.0</h2>
        <p>Willkommen zurück, Coach. Bitte identifizieren Sie sich für den Zugriff auf das Taktikboard.</p>
        
        <div class="input-group">
            <label for="trainer-name">Name des Trainers</label>
            <input id="trainer-name" type="text" placeholder="z.B. Coach Björn" required />
        </div>

        <div class="input-group">
            <label for="password">System-Passwort</label>
            <input id="password" type="password" placeholder="Passwort eingeben" />
        </div>

        <div class="input-group">
            <label for="user-key">Ihr persönlicher Groq API-Key</label>
            <input id="user-key" type="password" placeholder="gsk_..." />
        </div>

        <button onclick="performLogin()">SYSTEM STARTEN</button>
        
        <div class="footer-note">
            Toni 2.0 – Hochpräzise KI-Taktikanalyse & Trainingssteuerung
        </div>
    </div>

    <script>
        function performLogin() {
            const name = document.getElementById('trainer-name').value.trim();
            const pw = document.getElementById('password').value;
            const key = document.getElementById('user-key').value.trim();

            if (!name || !key) {
                alert("Bitte geben Sie Ihren Namen und den API-Key ein.");
                return;
            }

            // Validierung gegen dein festes Passwort
            if (pw === 'Trainer2026') {
                // Speicherung in localStorage für Persistenz in der Aktentasche
                localStorage.setItem('toni_trainer_name', name);
                localStorage.setItem('toni_api_key', key);
                
                // Weiterleitung zur Haupt-App
                window.location.href = 'app.html';
            } else {
                alert("Zutritt verweigert. Passwort inkorrekt.");
            }
        }

        // Check ob bereits eingeloggt
        window.onload = function() {
            if (localStorage.getItem('toni_api_key') && localStorage.getItem('toni_trainer_name')) {
                // Optional: Automatische Weiterleitung falls gewünscht
                // window.location.href = 'app.html';
            }
        };
    </script>
</body>
</html>
