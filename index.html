<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | MOBILE COMMAND</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="portal-body">
    <div id="portal-background"></div>

    <main id="auth-layer" class="portal-panel">
        <header class="portal-header">
            <div class="status-led green"></div>
            <h1>TONI 2.0</h1>
        </header>
        <div class="input-wrapper">
            <input type="password" id="passkey" placeholder="PASSKEY">
        </div>
        <button onclick="systemBootSequence()">BOOT SYSTEM</button>
    </main>

    <div id="main-interface" class="hidden">
        <header id="top-bar">
            <div class="top-info"><i class="fa-solid fa-user-tie"></i> KADER</div>
            <div id="clock-display">00:00</div>
            <div class="top-info"><i class="fa-solid fa-wallet"></i> <span id="kpi-budget">0 €</span></div>
        </header>

        <nav id="mobile-nav">
            <button onclick="switchModule('kader')"><i class="fa-solid fa-users"></i></button>
            <button onclick="switchModule('tactics')"><i class="fa-solid fa-strategy"></i></button>
            <button onclick="switchModule('office')"><i class="fa-solid fa-briefcase"></i></button>
            <button onclick="switchModule('media')"><i class="fa-solid fa-newspaper"></i></button>
            <button onclick="toggleMic()" id="mic-nav-btn"><i class="fa-solid fa-microphone"></i></button>
        </nav>

        <main id="stage-center">
            <div id="module-content"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
