<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — Tactical Command</title>
    <link rel="stylesheet" href="css/toni-style.css">
</head>
<body>

    <aside class="sidebar-minimal">
        <div class="main-briefcase-btn" onclick="toggleBriefcase()">
            <div style="font-size:32px;">💼</div>
            <span style="font-size:10px; font-weight:bold;">ZENTRALE</span>
        </div>
    </aside>

    <main id="stage">
        <div class="tools-overlay">
            <button class="tool-btn" onclick="arena.setMode('standard')">Standard</button>
            <button class="tool-btn" onclick="arena.setMode('funinho')">Funinho</button>
        </div>
        <canvas id="main-canvas"></canvas>
    </main>

    <aside class="analysis-panel">
        <h2 style="color: var(--data-cyan); font-size: 16px; letter-spacing: 2px;">ANALYSEZENTRUM</h2>
        <div id="setcard-content" style="margin-top: 30px;">
            <p style="color: #667085; font-style: italic;">Wähle einen Spieler auf dem Feld aus...</p>
        </div>
    </aside>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <button onclick="toggleBriefcase()" style="position:absolute; top:40px; right:40px; background:none; border:none; color:white; font-size:30px; cursor:pointer;">✕</button>
        <h1 style="color: var(--accent-orange); letter-spacing: 5px;">ZENTRALE AKTENTASCHE</h1>
        
        <div class="folder-grid" id="main-folders">
            <div class="folder-item" onclick="openFolder('sporttasche')">
                <div style="font-size:50px;">👟</div>
                <h3>Sporttasche</h3>
                <p style="font-size:11px; color:#667085;">Kader & Training</p>
            </div>
            <div class="folder-item">
                <div style="font-size:50px;">📊</div>
                <h3>Analysezentrum</h3>
                <p style="font-size:11px; color:#667085;">Leistungsdaten</p>
            </div>
            <div class="folder-item">
                <div style="font-size:50px;">🏢</div>
                <h3>Geschäftszimmer</h3>
                <p style="font-size:11px; color:#667085;">Management</p>
            </div>
        </div>

        <div id="subfolder-view" class="hidden" style="width:100%; max-width:800px; margin-top:40px;">
            <button onclick="closeFolder()" style="color: var(--data-cyan); cursor:pointer; background:none; border:none; margin-bottom:20px;">← ZURÜCK</button>
            <div id="subfolder-content"></div>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/aktentasche-ui.js"></script>
    <script>
        function toggleBriefcase() {
            document.getElementById('briefcase-overlay').classList.toggle('hidden');
        }

        function openFolder(type) {
            document.getElementById('main-folders').classList.add('hidden');
            document.getElementById('subfolder-view').classList.remove('hidden');
            if (type === 'sporttasche') window.Aktentasche.showSporttasche();
        }

        function closeFolder() {
            document.getElementById('main-folders').classList.remove('hidden');
            document.getElementById('subfolder-view').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            arena.init('main-canvas');
        });
    </script>
</body>
</html>
