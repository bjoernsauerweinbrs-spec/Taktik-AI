<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TONI 2.0 — Mobile & Desktop High-Tech Board</title>
<style>
  :root {
    --bg: #000;
    --neon: #39FF14;
    --gold: #FFD700;
    --glass: rgba(255, 255, 255, 0.05);
    --font-sans: "Segoe UI", Roboto, sans-serif;
  }
  
  html, body { height: 100%; margin: 0; background: var(--bg); color: #fff; font-family: var(--font-sans); overflow-x: hidden; }

  /* Responsive Grid System */
  .app { 
    display: grid; 
    grid-template-columns: 80px 1fr 380px; 
    gap: 10px; 
    height: 100vh; 
    padding: 10px; 
    box-sizing: border-box; 
  }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 70px 1fr 300px; }
  }

  @media (max-width: 850px) {
    .app { 
      grid-template-columns: 1fr; 
      grid-template-rows: 60px 1fr auto; 
      height: auto;
      overflow-y: auto;
    }
    .left-col { flex-direction: row !important; width: 100%; height: 60px; justify-content: space-around; padding: 0 !important; }
    .right-col { height: 400px; }
    .overlay { inset: 10px !important; width: auto !important; }
  }

  /* Navigation */
  .left-col { background: var(--glass); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 15px; }
  .icon-btn { width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border: 1px solid rgba(57, 255, 20, 0.2); color: var(--neon); transition: 0.2s; }
  .icon-btn:active { transform: scale(0.9); background: var(--neon); color: #000; }

  /* Arena */
  .center-col { background: #051205; border-radius: 12px; display: flex; flex-direction: column; padding: 10px; border: 1px solid rgba(57, 255, 20, 0.1); position: relative; }
  .arena-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  canvas { background: #010a01; border-radius: 6px; max-width: 100%; height: auto; }

  /* Toni-Box */
  .right-col { background: var(--glass); border-radius: 12px; display: flex; flex-direction: column; padding: 15px; gap: 10px; border: 1px solid rgba(255,255,255,0.05); }
  .video-pane { height: 180px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; border: 1px solid #222; margin-bottom: 5px; text-align: center; }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 85%; }
  .msg.ai { background: rgba(57, 255, 20, 0.1); border-left: 2px solid var(--neon); align-self: flex-start; }
  .msg.user { background: rgba(255, 255, 255, 0.1); align-self: flex-end; }

  /* Overlays & Content */
  .overlay { position: fixed; inset: 20px 400px 20px 100px; background: #0a110a; border: 1px solid var(--neon); border-radius: 15px; z-index: 100; display: none; flex-direction: column; padding: 20px; box-shadow: 0 0 50px #000; }
  .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kachel { background: rgba(255,255,255,0.03); border: 1px solid rgba(57, 255, 20, 0.1); padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 12px; }
  .kachel:hover { background: var(--neon); color: #000; }

  /* Cards & Sections */
  .fifa-card { width: 100px; height: 140px; background: var(--gold); border-radius: 5px; color: #000; padding: 5px; font-size: 10px; display: inline-block; margin: 5px; position: relative; font-family: sans-serif; }
  .skill-badge { background: #222; color: var(--neon); padding: 4px; border-radius: 4px; display: inline-block; margin: 2px; font-size: 10px; border: 1px solid var(--neon); }
</style>
</head>
<body>

<div class="app">
  <div class="left-col">
    <div class="icon-btn" onclick="openBriefcase()">💼</div>
    <div class="icon-btn" onclick="toggleMic()" id="mic">🎙️</div>
    <div class="icon-btn" onclick="clearAll()">🔁</div>
    <div class="icon-btn" onclick="printMag()">📰</div>
  </div>

  <div class="center-col">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px; color:var(--neon)">
      <span>Taktik: 4-4-2 vs 3-4-3</span>
      <span onclick="setDrawMode()">✏️ Zeichnen</span>
    </div>
    <div class="arena-wrap">
      <canvas id="arenaCanvas" width="800" height="500"></canvas>
    </div>
  </div>

  <div class="right-col">
    <div class="video-pane" id="vid1">YouTube Analysis:<br>Zidane Roulette</div>
    <div class="video-pane" style="border-color:var(--neon)" id="vid2">Cam-Stream:<br>Live Player Check</div>
    <div class="chat-history" id="chat">
      <div class="msg ai">Toni: Hi Björn. Das System ist bereit. Alle Sektoren sind geladen. Frag mich was!</div>
    </div>
    <div style="display:flex; gap:5px">
      <input type="text" id="cin" style="flex:1; background:#111; border:1px solid #333; color:#fff; padding:8px; border-radius:5px;" placeholder="Befehl...">
      <button onclick="talk()" style="background:var(--neon); border:none; border-radius:5px; padding:0 10px;">➔</button>
    </div>
  </div>
</div>

<div id="ov" class="overlay">
  <div style="display:flex; justify-content:space-between; border-bottom:1px solid #222; padding-bottom:10px;">
    <h3 id="ov-title" style="margin:0; color:var(--neon)">AKTENTASCHE</h3>
    <span onclick="closeOverlay()" style="cursor:pointer">✕</span>
  </div>
  <div id="ov-main" class="grid-3x3" style="margin-top:20px;">
    <div class="kachel" onclick="showSec('kabine')">KABINE</div>
    <div class="kachel" onclick="showSec('analyse')">ANALYSE</div>
    <div class="kachel" onclick="showSec('kids')">KIDS-CLUB</div>
    <div class="kachel">MATCH-DAY</div>
    <div class="kachel">TRAINING</div>
    <div class="kachel" onclick="showSec('business')">BUSINESS</div>
    <div class="kachel" onclick="printMag()">ZEITUNG</div>
    <div class="kachel">SCOUTING</div>
    <div class="kachel">SETTINGS</div>
  </div>
  <div id="ov-content" style="display:none; margin-top:15px; overflow-y:auto; flex:1;"></div>
</div>

<script>
  const canvas = document.getElementById('arenaCanvas');
  const ctx = canvas.getContext('2d');
  let players = [];

  function init() {
    players = [];
    // Red Team 4-4-2
    for(let i=0; i<11; i++) players.push({x: 100 + Math.random()*200, y: 50 + Math.random()*400, c: '#ff3333', n: i+1});
    // Blue Team 3-4-3
    for(let i=0; i<11; i++) players.push({x: 500 + Math.random()*200, y: 50 + Math.random()*400, c: '#3366ff', n: i+1});
    render();
  }

  function render() {
    ctx.fillStyle = '#051205'; ctx.fillRect(0,0,800,500);
    ctx.strokeStyle = 'rgba(57,255,20,0.3)'; ctx.lineWidth=2;
    ctx.strokeRect(20,20,760,460);
    ctx.beginPath(); ctx.moveTo(400,20); ctx.lineTo(400,480); ctx.stroke();
    players.forEach(p => {
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='10px Arial'; ctx.fillText(p.n, p.x-4, p.y+4);
    });
  }

  function openBriefcase() { document.getElementById('ov').style.display='flex'; }
  function closeOverlay() { document.getElementById('ov').style.display='none'; document.getElementById('ov-main').style.display='grid'; document.getElementById('ov-content').style.display='none'; }

  function showSec(s) {
    document.getElementById('ov-main').style.display='none';
    const c = document.getElementById('ov-content');
    c.style.display='block';
    if(s==='kabine') {
      c.innerHTML = '<h4>Kader Pro-Team</h4>';
      for(let i=1; i<=6; i++) c.innerHTML += `<div class="fifa-card"><b>RATING ${80+i}</b><br><br>Spieler ${i}<br>ST | #9</div>`;
    } else if(s==='analyse') {
      c.innerHTML = `<h4>Vital-Daten Live</h4>
        <div style="background:#000; border:1px solid var(--neon); padding:10px; border-radius:8px;">
          <p>❤️ Puls: <span style="color:var(--neon)">142 BPM</span> (Schnitt)</p>
          <p>💨 SpO2: <span style="color:var(--neon)">98%</span></p>
          <p>⚠️ Belastung: <span style="color:orange">Hoch</span></p>
        </div><br><small>Toni: "Spieler 4 zeigt Anzeichen von Ermüdung."</small>`;
    } else if(s==='kids') {
      c.innerHTML = `<h4>Mini-Helden-Schmiede</h4>
        <div class="skill-badge">⭐ Dribbling: Gold</div><div class="skill-badge">⭐ Pass: Silber</div>
        <p><b>Nächste Übung:</b> Der Zidan-Trick</p>
        <div style="background:#111; height:80px; border-radius:5px; padding:10px; font-size:11px;">
          Toni erklärt: "Stell dir vor, du tanzt auf dem Ball!" (Kindgerechte Taktik aktiv)
        </div>`;
    } else if(s==='business') {
      c.innerHTML = `<h4>Business-Center</h4>
        <p>Sponsoren: <b>12 aktive Partner</b></p>
        <div style="background:var(--glass); padding:8px; border-radius:5px; margin-bottom:5px;">⚡ Neon Energy - 50.000€</div>
        <div style="background:var(--glass); padding:8px; border-radius:5px;">👟 KickZ AG - 20.000€</div>
        <p>Budget Rest: <span style="color:var(--neon)">14.200 €</span></p>`;
    }
  }

  function talk() {
    const i = document.getElementById('cin');
    const h = document.getElementById('chat');
    if(!i.value) return;
    h.innerHTML += `<div class="msg user">${i.value}</div>`;
    setTimeout(() => {
      h.innerHTML += `<div class="msg ai">Toni: Ich analysiere das... Befehl ausgeführt.</div>`;
      h.scrollTop = h.scrollHeight;
    }, 600);
    i.value='';
  }

  function toggleMic() {
    const m = document.getElementById('mic');
    m.style.background = m.style.background === 'red' ? '' : 'red';
  }

  function printMag() {
    const w = window.open('', '_blank');
    w.document.write('<html><body><h1>STADIONZEITUNG</h1><p>Taktik & Sponsoren für heute...</p></body></html>');
    w.print();
  }

  init();
</script>
</body>
</html>
