<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni AI - V7</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #app { background: white; width: 95%; max-width: 500px; height: 90vh; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #1a1a1a; color: white; padding: 15px; text-align: center; font-weight: bold; border-bottom: 4px solid #28a745; }
        #login-screen, #chat-screen { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        input { padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { background: #28a745; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #chat-history { flex: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; line-height: 1.4; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .toni { align-self: flex-start; background: #eee; color: #333; }
        .debug-box { font-size: 0.7rem; color: #555; background: #fdf6e3; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #eee; white-space: pre-wrap; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">⚽ COACH TONI - V7 (STABLE v1)</div>
    
    <div id="login-screen">
        <h2 style="text-align:center">Trainer Login</h2>
        <input type="text" id="username" placeholder="Dein Name">
        <input type="password" id="password" placeholder="Passwort (Trainer2026)">
        <input type="text" id="user-key" placeholder="Google API-Key (AIza...)">
        <button onclick="startToni()">Toni aktivieren</button>
    </div>

    <div id="chat-screen" style="display:none">
        <div id="chat-history"></div>
        <div style="display:flex; gap:5px">
            <input type="text" id="user-input" style="flex:1" placeholder="Frag Toni...">
            <button onclick="askToni()">Senden</button>
        </div>
    </div>
</div>

<script>
    let USER_KEY = "";

    function startToni() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const key = document.getElementById('user-key').value.trim();

        if (user && pass === "Trainer2026" && key.startsWith("AIza")) {
            USER_KEY = key;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            addMsg("toni", `Servus ${user}! V7 ist am Start. Ich nutze jetzt die stabile Google-Leitung (v1). Was trainieren wir?`);
        } else {
            alert("Passwort oder Key falsch!");
        }
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMsg("user", text);
        input.value = "";
        
        // WICHTIG: Wechsel auf /v1/ statt /v1beta/
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${USER_KEY}`;
        
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            
            if (data.error) {
                addMsg("toni", "Fehler-Analyse:");
                showDebug(JSON.stringify(data.error, null, 2));
            } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                addMsg("toni", data.candidates[0].content.parts[0].text);
            } else {
                addMsg("toni", "Google hat geantwortet, aber keinen Text geliefert.");
            }
        } catch (e) {
            addMsg("toni", "Technischer Fehler: Verbindung zu Google unterbrochen.");
        }
    }

    function addMsg(role, text) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }

    function showDebug(info) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = "debug-box";
        div.innerText = info;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
