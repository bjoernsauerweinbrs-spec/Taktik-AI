<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - Authentifizierung</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: transform 2s ease, filter 2s ease; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #video-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2; opacity: 0; transition: opacity 2s ease; }
        .login-container { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%; }
        .login-box { background: rgba(10, 10, 10, 0.9); padding: 40px; border-radius: 15px; border: 2px solid #ff9500; text-align: center; width: 320px; opacity: 0; transform: translateY(30px); transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 50px rgba(0,0,0,1); }
        .video-finished #video-container { transform: scale(1.1); filter: blur(12px) brightness(0.5); }
        .video-finished #video-overlay { opacity: 1; }
        .video-finished .login-box { opacity: 1; transform: translateY(0); }
        .login-input { width: 100%; background: #000; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 20px; border-radius: 5px; outline: none; text-align: center; font-size: 1.1rem; letter-spacing: 5px; }
        .login-btn { width: 100%; background: #ff9500; color: #000; border: none; padding: 15px; font-weight: 900; cursor: pointer; border-radius: 5px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        .login-btn:hover { background: #fff; transform: scale(1.02); }
        .skip-intro { position: fixed; bottom: 20px; right: 20px; z-index: 20; color: #fff; font-size: 0.7rem; cursor: pointer; opacity: 0.3; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="intro-video" autoplay muted playsinline>
            <source src="intro.mp4" type="video/mp4">
        </video>
    </div>
    
    <div id="video-overlay"></div>

    <div class="login-container">
        <div class="login-box">
            <h2 style="color:#ff9500; letter-spacing: 4px; margin:0 0 5px 0;">TONI 2.0</h2>
            <p style="color:#666; font-size: 0.65rem; margin-bottom: 30px; text-transform: uppercase;">Performance Center Login</p>
            <input type="password" id="pass-input" placeholder="••••" class="login-input">
            <button onclick="checkPass()" class="login-btn">Initialisieren</button>
            <p id="error-msg" style="color: #ff3030; font-size: 0.6rem; margin-top: 15px; display: none; font-weight: bold;"></p>
        </div>
    </div>

    <div class="skip-intro" onclick="finishIntro()">SKIP INTRO</div>

    <script>
        const video = document.getElementById('intro-video');
        const passInput = document.getElementById('pass-input');
        
        // Intro-Steuerung
        video.onended = finishIntro;
        setTimeout(finishIntro, 9000); 

        function finishIntro() {
            if(document.body.classList.contains('video-finished')) return;
            document.body.classList.add('video-finished');
            video.pause(); 
            document.querySelector('.skip-intro').style.display = 'none';
            passInput.focus(); // Fokus direkt auf das Passwortfeld für schnelles Tippen
        }

        // Enter-Taste Support
        passInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPass();
            }
        });

        function checkPass() {
            const enteredPass = passInput.value;
            const errorMsg = document.getElementById('error-msg');
            
            // Abruf der Passwörter aus der System-Zentrale (ToniDB/LocalStorage)
            const passBjorn = localStorage.getItem('toni_pass_bjorn');
            const passNadine = localStorage.getItem('toni_pass_nadine');
            
            // Validierung gegen neue Passwörter ODER Fallback 1234
            if (
                (passBjorn && enteredPass === passBjorn) || 
                (passNadine && enteredPass === passNadine) || 
                (enteredPass === "1234") // Erlaubt Zugriff, falls noch nichts im System gesetzt wurde
            ) { 
                window.location.href = "app.html";
            } else {
                errorMsg.innerText = "ZUGRIFF VERWEIGERT: SCHLÜSSEL UNGÜLTIG";
                errorMsg.style.display = "block";
                passInput.value = "";
                // Kleiner Shaking-Effekt für die Box bei Fehlern
                const box = document.querySelector('.login-box');
                box.style.borderColor = "#ff3030";
                setTimeout(() => { box.style.borderColor = "#ff9500"; }, 1000);
            }
        }
    </script>
</body>
</html>
