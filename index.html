<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni Elite - Login</title>
    <style>
        body { background: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { background: #161b22; padding: 40px; border-radius: 12px; border: 1px solid #30363d; text-align: center; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #2ecc71; margin-bottom: 10px; font-weight: 900; }
        input { background: #0d1117; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 6px; width: 100%; margin-bottom: 15px; text-align: center; font-size: 16px; }
        button { background: #238636; border: none; color: white; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
        button:hover { background: #2ea043; }
        .info { color: #8b949e; font-size: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ELITE CONTROL</h2>
        <p class="info">Bitte Zugangsdaten eingeben</p>
        
        <input type="password" id="pw" placeholder="Passwort (Trainer2026)">
        <input type="text" id="api-key" placeholder="Groq API Key (gsk_...)">
        
        <button onclick="login()">ZUGRIFF BESTÄTIGEN</button>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('pw').value;
            const key = document.getElementById('api-key').value;

            if(pass === 'Trainer2026') {
                if(key.startsWith('gsk_')) {
                    sessionStorage.setItem('toni_auth', 'true');
                    sessionStorage.setItem('toni_key', key);
                    window.location.href = 'app.html';
                } else {
                    alert('Bitte einen gültigen Groq API-Key eingeben.');
                }
            } else {
                alert('Falsches Passwort. Nutze: Trainer2026');
            }
        }
    </script>
</body>
</html>
