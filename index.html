<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Coach - Taktikboard</title>
    <style>
        :root {
            --bg-black: #000000;
            --neon-green: #39FF14;
            --panel-gray: #0a0a0a;
            --text-white: #ffffff;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Verhindert Scrollen der ganzen Seite */
        }

        /* Haupt-Container: Vertikale Aufteilung (Oben: Arbeitsbereich, Unten: Bank) */
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Der Bereich mit den 3 Spalten */
        .main-content {
            display: flex;
            flex: 1; 
            overflow: hidden;
        }

        /* Linke Spalte: Aktentasche */
        .column-left {
            width: 100px;
            background: var(--panel-gray);
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            flex-shrink: 0;
        }

        /* Mittlere Spalte: Das Herzstück (Spielfeld) */
        .column-middle {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background-color: var(--bg-black);
        }

        /* Rechte Spalte: Toni */
        .column-right {
            width: 250px;
            background: var(--panel-gray);
            border-left: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            flex-shrink: 0;
        }

        /* Die Auswechselbank unten */
        .bench-area {
            height: 120px;
            background: #050505;
            border-top: 2px solid #1a1a1a;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        /* --- SPIELFELD DESIGN --- */
        #soccer-field {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 1.5; /* 3:2 Format bleibt stabil */
            border: 3px solid var(--neon-green);
            position: relative;
            background-color: transparent;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.05);
            transition: transform 0.4s ease;
        }

        .field-line { position: absolute; background-color: var(--neon-green); }
        .center-line { left: 50%; top: 0; bottom: 0; width: 2px; }
        .center-circle { 
            left: 50%; top: 50%; width: 16%; height: 24%; 
            border: 2px solid var(--neon-green); border-radius: 50%; 
            transform: translate(-50%, -50%); 
        }
        .box-16 { border: 2px solid var(--neon-green); width: 16%; height: 44%; position: absolute; top: 28%; }
        .left-16 { left: 0; border-left: none; }
        .right-16 { right: 0; border-right: none; }
        .box-5 { border: 2px solid var(--neon-green); width: 6%; height: 20%; position: absolute; top: 40%; }
        .left-5 { left: 0; border-left: none; }
        .right-5 { right: 0; border-right: none; }

        /* Tore */
        .goal { position: absolute; width: 6px; height: 16%; background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .g-senior-l { left: -8px; top: 42%; }
        .g-senior-r { right: -8px; top: 42%; }
        .g-funino { display: none; }
        .f-l-1 { left: -8px; top: 15%; }
        .f-l-2 { left: -8px; bottom: 15%; }
        .f-r-1 { right: -8px; top: 15%; }
        .f-r-2 { right: -8px; bottom: 15%; }

        /* --- UI ELEMENTE --- */
        .briefcase { 
            font-size: 50px; cursor: pointer; 
            filter: drop-shadow(0 0 8px var(--neon-green));
            transition: transform 0.2s;
        }
        .briefcase:hover { transform: scale(1.1); }

        .toni-img { 
            width: 100px; height: 100px; 
            border: 2px solid var(--neon-green); 
            border-radius: 50%; background: #1a1a1a; 
            margin-bottom: 15px; 
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }
        
        .mode-buttons {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .btn { 
            background: #111; color: var(--neon-green); border: 1px solid var(--neon-green); 
            padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: bold;
            border-radius: 3px;
        }
        .btn:hover { background: var(--neon-green); color: #000; }

        /* --- MOBILE ANPASSUNG (ROCK-SOLID) --- */
        @media (max-width: 900px) {
            .main-content { flex-direction: column; overflow-y: auto; }
            .column-left, .column-right { 
                width: 100%; height: auto; padding: 15px; 
                flex-direction: row; justify-content: space-around; 
                border: none; border-bottom: 1px solid #1a1a1a;
            }
            .column-middle { min-height: 400px; padding: 40px 15px; order: 2; }
            .column-left { order: 1; }
            .column-right { order: 3; border-top: 1px solid #1a1a1a; }
            .bench-area { height: 100px; position: sticky; bottom: 0; z-index: 100; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="main-content">
            <div class="column-left">
                <div class="briefcase">💼</div>
                <div style="font-size: 12px; color: #444; margin-top: 8px; font-weight: bold;">TOOLS</div>
            </div>

            <div class="column-middle">
                <div class="mode-buttons">
                    <button class="btn" onclick="updateField('senior')">Senioren</button>
                    <button class="btn" onclick="updateField('funino')">Funino</button>
                    <button class="btn" onclick="updateField('f-jugend')">F-Jugend</button>
                </div>

                <div id="soccer-field">
                    <div class="field-line center-line"></div>
                    <div class="center-circle"></div>
                    <div class="box-16 left-16"></div>
                    <div class="box-16 right-16"></div>
                    <div class="box-5 left-5"></div>
                    <div class="box-5 right-5"></div>
                    
                    <div id="gs-l" class="goal g-senior-l"></div>
                    <div id="gs-r" class="goal g-senior-r"></div>
                    
                    <div class="goal g-funino f-l-1"></div>
                    <div class="goal g-funino f-l-2"></div>
                    <div class="goal g-funino f-r-1"></div>
                    <div class="goal g-funino f-r-2"></div>
                </div>
            </div>

            <div class="column-right">
                <div class="toni-img"></div>
                <span style="color: var(--neon-green); font-weight: bold; letter-spacing: 1px;">TONI</span>
                <p style="font-size: 12px; color: #666; text-align: center; margin-top: 5px;">KI-Co-Trainer</p>
                <div id="mic-status" style="margin-top: 10px; font-size: 10px; color: #333;">🎤 MIKROFON INAKTIV</div>
            </div>
        </div>

        <div class="bench-area">
            <span style="color: #222; font-weight: bold; font-size: 12px; border-right: 1px solid #222; padding-right: 15px;">BANK</span>
            <div id="bench-content">
                </div>
        </div>
    </div>

    <script>
        function updateField(mode) {
            const field = document.getElementById('soccer-field');
            const sGoals = [document.getElementById('gs-l'), document.getElementById('gs-r')];
            const fGoals = document.querySelectorAll('.g-funino');

            // Reset
            field.style.transform = "scale(1)";
            sGoals.forEach(g => g.style.display = 'none');
            fGoals.forEach(g => g.style.display = 'none');

            if (mode === 'senior') {
                sGoals.forEach(g => g.style.display = 'block');
            } else if (mode === 'funino') {
                fGoals.forEach(g => g.style.display = 'block');
            } else if (mode === 'f-jugend') {
                sGoals.forEach(g => g.style.display = 'block');
                field.style.transform = "scale(0.85)"; // Verkleinert das Feld für Jugend
            }
        }
        // Initialer Start im Senioren-Modus
        updateField('senior');
    </script>
</body>
</html>
