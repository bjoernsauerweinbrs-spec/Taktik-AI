<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 | CLUB ENGINE ULTIMATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-layer">
        <div class="login-box">
            <h1>TONI 2.0</h1>
            <p>CLUB MANAGEMENT SUITE</p>
            <button onclick="bootSystem()">SYSTEM STARTEN</button>
        </div>
    </div>

    <div id="main-interface" class="hidden">
        <header>
            <div class="brand">TONI 2.0 // <span id="active-mod">DASHBOARD</span></div>
            <div class="status"><span id="clock">00:00</span></div>
        </header>

        <div class="app-grid">
            <nav>
                <button onclick="loadModule('kader')"><i class="fa-solid fa-users"></i> PROFIS</button>
                <button onclick="loadModule('tactics')"><i class="fa-solid fa-chess-board"></i> TAKTIK ZENTRALE</button>
                <button onclick="loadModule('office')"><i class="fa-solid fa-building"></i> OFFICE</button>
                <button onclick="loadModule('youth')"><i class="fa-solid fa-graduation-cap"></i> AKADEMIE (U19-U9)</button>
                <button onclick="loadModule('media')"><i class="fa-solid fa-newspaper"></i> PRESSE & ZEITUNG</button>
            </nav>

            <main id="stage"></main>

            <aside>
                <div class="ai-header">TONI AI</div>
                <div id="ai-msg">Bereit zur Analyse.</div>
                <button id="mic-btn" onclick="toggleMic()">🎤 REC</button>
            </aside>
        </div>
    </div>

    <div id="modal-overlay" class="hidden">
        <div id="modal-content"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
