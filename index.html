<style>
  :root {
    --bg-dark: #010409; --bg-medium: #0d1117; --bg-light: #161b22;
    --border-color: #30363d; --neon: #39FF14; --neon-dim: rgba(57, 255, 20, 0.12);
    --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%, #fbf5b7 100%);
    --accent-blue: #58a6ff; --accent-red: #f85149;
    --text-primary: #e6edf3; --text-secondary: #848d97;
    --radius-lg: 18px; --radius-md: 12px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg-dark); color: var(--text-primary); font-family: -apple-system, sans-serif; overflow: hidden; }

  /* FIFA PRO KARTEN DESIGN */
  .fifa-card {
    width: 155px; height: 220px; background: var(--gold-gradient);
    border-radius: 10px 10px 45px 10px; position: relative; padding: 12px;
    color: #2c2401; box-shadow: 0 12px 25px rgba(0,0,0,0.7);
    cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.4);
  }
  .card-rating { font-size: 34px; font-weight: 900; line-height: 0.9; }
  .card-name { text-align: center; font-weight: 900; font-size: 14px; text-transform: uppercase; margin: 8px 0; border-bottom: 1.5px solid rgba(0,0,0,0.12); }
  .card-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 11px; font-weight: 800; }

  /* LABOR & SCOUTING ANIMATIONEN */
  .pulse-heart { color: var(--accent-red); animation: heartbeat 0.8s infinite; display: inline-block; }
  @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  
  .scouting-card { background: var(--bg-medium); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--accent-blue); }

  /* APP LAYOUT FRAMEWORK */
  .app-container { display: grid; grid-template-rows: 65px 1fr; grid-template-columns: 280px 1fr 380px; height: 100vh; padding: 10px; gap: 10px; }
  @media (max-width: 1100px) { .app-container { grid-template-columns: 80px 1fr; grid-template-rows: 65px 1fr 280px; } }

  .panel { background: var(--bg-medium); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 15px; display: flex; flex-direction: column; }
  .overlay { position: fixed; inset: 20px 400px 20px 100px; background: rgba(13, 17, 23, 0.98); border: 1px solid var(--border-color); border-radius: 20px; z-index: 5000; display: none; flex-direction: column; padding: 25px; backdrop-filter: blur(15px); }
  @media (max-width: 1100px) { .overlay { inset: 10px; } }
</style>
</head>
</head>

// MODULE: ArenaEngine - Taktikboard & Physik [cite: 2026-02-07]
// -----------------------------------------------------------------------------
const ArenaEngine = {
  canvas: null, ctx: null, dpr: 1, isDragging: false, dragTarget: null,

  init() {
    this.canvas = document.getElementById('main-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.dpr = window.devicePixelRatio || 1;
    this.setupCanvas();
    this.bindEvents();
    this.render();
    console.log("ArenaEngine v8.5 aktiv.");
  },

  setupCanvas() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * this.dpr;
    this.canvas.height = rect.height * this.dpr;
    this.ctx.scale(this.dpr, this.dpr);
  },

  drawPitch() {
    const { ctx, canvas } = this;
    const w = canvas.width / this.dpr, h = canvas.height / this.dpr;
    ctx.fillStyle = '#011a01'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.2)'; ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, w - 40, h - 160); // Spielfeld
    ctx.beginPath(); ctx.moveTo(w / 2, 20); ctx.lineTo(w / 2, h - 140); ctx.stroke();
    ctx.beginPath(); ctx.arc(w / 2, (h - 120) / 2, 60, 0, Math.PI * 2); ctx.stroke();
  },

  render() {
    this.drawPitch();
    Object.values(AppState.team.squad).forEach(p => {
      const { x, y } = p.canvas;
      this.ctx.fillStyle = p.personal.position === 'GK' ? '#ffae00' : 'var(--accent-blue)';
      this.ctx.beginPath(); this.ctx.arc(x, y, 20, 0, Math.PI * 2); this.ctx.fill();
      this.ctx.fillStyle = '#fff'; this.ctx.font = 'bold 12px Arial'; this.ctx.textAlign = 'center';
      this.ctx.fillText(p.personal.num, x, y + 5);
      this.ctx.font = '9px Arial'; this.ctx.fillText(p.personal.name.toUpperCase(), x, y + 35);
      if (p.medical.readiness < 75) { this.ctx.fillStyle = 'var(--accent-red)'; this.ctx.fillText('⚠️', x + 22, y - 10); }
    });
  },

  setFormation(mode) {
    const actives = Object.values(AppState.team.squad).filter(p => p.medical.status === 'fit');
    ToniAI.speak(mode === 'match' ? "Stelle 3-4-3 System für Bad Hersfeld auf." : "Spieler rücken auf die Bank.");
    if (mode === 'match') {
      const f343 = [{x:80,y:250},{x:220,y:100},{x:220,y:250},{x:220,y:400},{x:400,y:50},{x:400,y:180},{x:400,y:320},{x:400,y:450},{x:650,y:100},{x:650,y:250},{x:650,y:400}];
      actives.forEach((p, i) => { if(f343[i]) { p.canvas.x = f343[i].x; p.canvas.y = f343[i].y; } });
    } else {
      Object.values(AppState.team.squad).forEach((p, i) => { p.canvas.x = 50 + (i * 45); p.canvas.y = 440; });
    }
    this.render();
  },

  bindEvents() {
    const getPos = (e) => {
      const r = this.canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
      return { x, y };
    };
    this.canvas.onmousedown = this.canvas.ontouchstart = (e) => {
      const p = getPos(e);
      this.dragTarget = Object.values(AppState.team.squad).find(s => Math.hypot(s.canvas.x - p.x, s.canvas.y - p.y) < 25);
      if (this.dragTarget) this.isDragging = true;
    };
    this.canvas.onmousemove = this.canvas.ontouchmove = (e) => {
      if (this.isDragging && this.dragTarget) {
        const p = getPos(e); this.dragTarget.canvas.x = p.x; this.dragTarget.canvas.y = p.y;
        this.render(); e.preventDefault();
      }
    };
    window.onmouseup = window.ontouchend = () => { this.isDragging = false; this.dragTarget = null; };
  }
};

const ToniAI = {
  init() { this.updateStatus('online', 'var(--neon)'); this.speak("System online. Coach " + AppState.user.name + ", ich bin bereit."); },

  updateStatus(text, color) {
    const s = document.getElementById('ai-status');
    s.textContent = `● OLLAMA: ${text.toUpperCase()}`; s.style.color = color;
  },

  speak(msg, isUser = false) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.style = isUser ? "text-align:right; margin-bottom:10px;" : "margin-bottom:15px; border-left:2px solid var(--neon); padding-left:10px;";
    div.innerHTML = isUser ? `<div style="display:inline-block; background:var(--bg-light); padding:8px; border-radius:10px;">${msg}</div>` : `<small style="color:var(--neon)">TONI:</small><div>${msg}</div>`;
    box.appendChild(div); box.scrollTop = box.scrollHeight;
    if (!isUser && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(msg); u.lang = 'de-DE'; window.speechSynthesis.speak(u);
    }
  },

  async processCommand() {
    const input = document.getElementById('user-cmd');
    const cmd = input.value.trim(); if (!cmd) return;
    this.speak(cmd, true); input.value = '';

    if (cmd.toLowerCase().includes("suche") || cmd.toLowerCase().includes("scoute")) {
      this.speak("Starte Internet-Recherche für Bad Hersfeld...");
      const results = await ApiService.searchWeb(cmd);
      results.forEach(res => {
        this.speak(`<b>${res.source}:</b> ${res.content}`);
      });
    } else {
      this.updateStatus('thinking', 'var(--accent-blue)');
      const aiRes = await ApiService.fetchOllama(cmd);
      this.speak(aiRes.response);
      this.updateStatus('online', 'var(--neon)');
    }
  },

  toggleLiveSession() {
    AppState.ui.isLiveSession = !AppState.ui.isLiveSession;
    const btn = document.getElementById('live-session-btn');
    btn.classList.toggle('active', AppState.ui.isLiveSession);
    this.speak(AppState.ui.isLiveSession ? "Live-Modus aktiv. Ich höre zu." : "Live-Modus beendet.");
  }
};

// Startschuss
UIManager.showApp = function() {
  document.getElementById('main-app').style.display = 'grid';
  this.renderLeftPanel();
  ArenaEngine.init();
  ToniAI.init();
};
</script>
