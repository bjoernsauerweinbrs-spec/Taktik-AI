<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Intelligence Engine - Pro Coach</title>
    <style>
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #080808; color: #fff; overflow: hidden; }
        
        #nav { background: #111; padding: 12px; display: flex; justify-content: center; gap: 15px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #1a1a1a; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 2px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        .btn:hover { border-color: #00ff88; color: #00ff88; }

        #pitch-container { flex: 2; position: relative; padding: 10px; display: flex; justify-content: center; background: #000; }
        #pitch { 
            width: 100%; height: 100%; background: #2d5a27; border: 3px solid #fff; position: relative;
            background-image: repeating-linear-gradient(0deg, #2d5a27, #2d5a27 10%, #285123 10%, #285123 20%);
        }
        
        .line { position: absolute; background: rgba(255,255,255,0.5); pointer-events: none; }
        .center-circle { width: 100px; height: 100px; border: 2px solid #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.4; }
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.05); }
        .goal-std { width: 90px; height: 30px; left: 50%; transform: translateX(-50%); }
        .goal-fun { width: 50px; height: 20px; }

        .player { 
            width: 34px; height: 34px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 13px; cursor: grab; z-index: 50;
            border: 2px solid #fff; transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1); touch-action: none;
        }
        .red { background: #b71c1c; color: white; }
        .blue { background: #0d47a1; color: white; }
        .ball { width: 22px; height: 22px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; transition: all 1s ease-in-out; box-shadow: 0 0 10px white; }

        #chat { height: 35%; background: #ffffff; color: #000; display: flex; flex-direction: column; border-top: 5px solid #1a1a1a; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 15px; background: #fdfdfd; }
        .msg { margin-bottom: 10px; padding: 10px 15px; border-radius: 5px; line-height: 1.5; border-left: 5px solid transparent; }
        .ai { background: #f8f8f8; border-left-color: #2e7d32; font-style: italic; }
        .user { background: #e3f2fd; border-right: 5px solid #1565c0; text-align: right; border-left: none; }

        #input-area { padding: 15px; background: #f0f0f0; display: flex; gap: 15px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        button.action { background: none; border: none; font-size: 28px; cursor: pointer; color: #333; }
    </style>
</head>
<body>

<div id="nav">
    <button class="btn" onclick="setMode('funino')">Funino (3v3)</button>
    <button class="btn" onclick="setMode('11v11')">Pro Taktik (11v11)</button>
    <button class="btn" onclick="runDrill('pass')">DFB: G-Jugend Pass</button>
</div>

<div id="pitch-container">
    <div id="pitch">
        <div class="line" style="width: 100%; height: 2px; top: 50%;"></div>
        <div class="center-circle"></div>
        <div id="ball" class="player ball" style="top: 48%; left: 49%;"></div>
        <div id="team-layer"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Taktische Analyse einleiten...">
        <button class="action" onclick="startMic()">🎤</button>
        <button class="action" onclick="execute()">➤</button>
    </div>
</div>

<script>
    const layer = document.getElementById('team-layer');
    const log = document.getElementById('log');
    const input = document.getElementById('user-input');
    const ball = document.getElementById('ball');

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Stefan') || v.name.includes('Markus'))) || voices.find(v => v.lang.startsWith('de'));
            if (maleVoice) utterance.voice = maleVoice;
            utterance.pitch = 0.82; utterance.rate = 0.92;
            window.speechSynthesis.speak(utterance);
        }
    }

    function addLog(who, text, isAi) {
        const div = document.createElement('div');
        div.className = 'msg ' + (isAi ? 'ai' : 'user');
        div.innerHTML = `<b>${who}:</b> ${text}`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        if (isAi) speak(text);
    }

    // --- TAKTISCHE VERSCHIEBE-ENGINE ---
    function shiftFormation(ballX) {
        const redPlayers = document.querySelectorAll('.red');
        const bluePlayers = document.querySelectorAll('.blue');
        
        // Rot (Abwehr) schiebt ballorientiert ein
        redPlayers.forEach(p => {
            let baseL = parseFloat(p.getAttribute('data-base-l'));
            let shiftStrength = 0.35; // 35% Verschiebung zum Ball
            let newL = baseL + (ballX - 50) * shiftStrength;
            p.style.left = newL + "%";
        });

        // Blau (Angriff) zieht das Feld breit
        bluePlayers.forEach(p => {
            let baseL = parseFloat(p.getAttribute('data-base-l'));
            let spreadStrength = 0.15; // Zieht sich leicht auf
            let newL = baseL + (ballX - 50) * spreadStrength;
            p.style.left = newL + "%";
        });
    }
