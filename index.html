<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Deep Data Performance Lab</title>
<style>
  :root {
    --bg: #010401;
    --neon: #39FF14;
    --neon-glow: rgba(57, 255, 20, 0.3);
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05);
  }
  
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

  /* --- ARCHITEKTUR --- */
  .app-container { display: grid; grid-template-columns: 80px 1fr 380px; height: 100vh; padding: 12px; gap: 12px; }

  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; overflow-y: auto; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
    .overlay { inset: 5px !important; width: 98% !important; }
  }

  /* --- NAVIGATION --- */
  .left-nav { background: var(--glass); border-radius: 15px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; backdrop-filter: blur(10px); }
  .nav-item { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; transition: 0.3s; }
  .nav-item:hover { background: var(--neon-glow); box-shadow: 0 0 15px var(--neon); }

  /* --- ARENA --- */
  .center-arena { background: #000; border-radius: 15px; border: 1px solid rgba(57,255,20,0.1); display: flex; flex-direction: column; padding: 10px; position: relative; }
  canvas { background: #010a01; border-radius: 8px; box-shadow: 0 0 40px #000; max-width: 100%; height: auto; }

  /* --- TONI-BOX --- */
  .right-toni { background: var(--glass); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
  .msg { padding: 10px 14px; border-radius: 12px; font-size: 13px; max-width: 85%; line-height: 1.4; }
  .msg.ai { background: rgba(57, 255, 20, 0.08); align-self: flex-start; border-left: 3px solid var(--neon); }

  /* --- LABORATORY UI --- */
  .overlay { position: fixed; inset: 20px 400px 20px 100px; background: rgba(4, 10, 4, 0.99); border: 1px solid var(--neon); border-radius: 20px; z-index: 1000; display: none; flex-direction: column; padding: 25px; overflow: hidden; backdrop-filter: blur(25px); }
  .lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; overflow-y: auto; padding-top: 10px; }
  
  .lab-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(57,255,20,0.1); border-radius: 15px; padding: 15px; position: relative; }
  .lab-header { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 10px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 11px; margin: 4px 0; }
  .stat-val { color: var(--neon); font-weight: bold; }

  /* Progress Bars */
  .bar-bg { width: 100%; height: 4px; background: #111; border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar-fill { height: 100%; transition: 0.5s; box-shadow: 0 0 10px var(--neon); }

  /* Editor */
  .editor-pane { display: none; background: #000; border: 1px solid var(--neon); padding: 25px; border-radius: 20px; position: absolute; inset: 10px; z-index: 1100; overflow-y: auto; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr 1fr; } }
  .input-group label { display: block; font-size: 9px; color: var(--neon); margin-bottom: 4px; text-transform: uppercase; }
  .input-group input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; }
  
  .section-title { grid-column: 1 / -1; font-size: 10px; color: #666; border-bottom: 1px solid #222; margin: 10px 0 5px 0; padding-bottom: 3px; }

</style>
</head>
<body>

<div class="app-container">
  <div class="left-nav">
    <div class="nav-item" onclick="openSektor('kabine')">💼</div>
    <div class="nav-item" onclick="openSektor('analyse')">🧪</div>
    <div class="nav-item">🎙️</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="window.print()">📰</div>
  </div>

  <div class="center-arena">
    <div style="display:flex; justify-content:space-between; padding:5px 15px; color:var(--neon); font-size:12px;">
        <strong>PERFORMANCE CORE v2.6</strong>
        <span>[ 4-4-2 ACTIVE ]</span>
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <canvas id="board" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="font-weight:bold; color:var(--neon); display:flex; justify-content:space-between;">TONI AI <span>READY</span></div>
    <div class="chat-history" id="chat">
      <div class="msg ai">Toni: Labor-Update geladen. Ich analysiere jetzt HRV, Muskelmasse und Schlaf-Zyklen für deinen Readiness-Score.</div>
    </div>
    <input type="text" id="cmd" placeholder="Befehl..." style="background:#111; border:1px solid #333; color:#fff; padding:12px; border-radius:10px;">
  </div>
</div>

<div id="ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 id="ov-title" style="margin:0; color:var(--neon); letter-spacing:2px;">BIO-DATA HUB</h2>
    <span onclick="closeOverlay()" style="cursor:pointer; font-size:30px;">✕</span>
  </div>
  <div id="grid-content" class="lab-grid"></div>

  <div id="editor" class="editor-pane">
    <h3 style="margin-top:0; color:var(--neon)">ATHLETEN-PROFIL BEARBEITEN</h3>
    <div class="input-grid" id="edit-fields">
      </div>
    <button onclick="saveData()" style="width:100%; background:var(--neon); color:#000; border:none; padding:15px; border-radius:10px; font-weight:bold; margin-top:20px; cursor:pointer;">DATEN SYNCHRONISIEREN</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  
  // ERWEITERTER DATENSATZ (Uhr & Waage)
  let team = [
    { 
      id:0, name:'Müller', rating:91, x:180, y:350, 
      // Waage
      weight:82.4, muscle:38.5, fat:10.2, water:62.1, bone:3.8, visceral:4, 
      // Uhr
      bpm:62, hrV:55, spo2:98, sleep:82, vo2:52, stress:22, recovery:12
    },
    { 
      id:1, name:'Silva', rating:89, x:420, y:350, 
      weight:76.2, muscle:35.1, fat:11.5, water:60.5, bone:3.4, visceral:5, 
      bpm:68, hrV:42, spo2:99, sleep:65, vo2:48, stress:45, recovery:24
    }
  ];

  let currentId = null;

  function renderArena() {
    ctx.fillStyle = '#021202'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.4)'; ctx.lineWidth = 3;
    ctx.strokeRect(40, 40, canvas.width-80, canvas.height-80);
    team.forEach(p => {
      ctx.fillStyle = '#ff4444'; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText(p.name[0], p.x, p.y+5);
    });
  }

  function openSektor(s) {
    document.getElementById('ov').style.display = 'flex';
    const grid = document.getElementById('grid-content');
    grid.innerHTML = '';
    
    if(s === 'analyse') {
      team.forEach(p => {
        let readiness = Math.round((p.sleep + p.hrV + (100 - p.stress)) / 3);
        grid.innerHTML += `
          <div class="lab-card">
            <div class="lab-header"><strong>${p.name.toUpperCase()}</strong> <span style="color:var(--neon)">READINESS: ${readiness}%</span></div>
            
            <div class="section-title">BODY COMPOSITION (BIA)</div>
            <div class="stat-row"><span>Gewicht / Fett</span><span class="stat-val">${p.weight}kg / ${p.fat}%</span></div>
            <div class="stat-row"><span>Muskelmasse</span><span class="stat-val">${p.muscle}kg</span></div>
            <div class="stat-row"><span>Wasser / Knochen</span><span class="stat-val">${p.water}% / ${p.bone}kg</span></div>
            <div class="stat-row"><span>Viszeralfett</span><span class="stat-val">Level ${p.visceral}</span></div>

            <div class="section-title">PERFORMANCE & RECOVERY (WATCH)</div>
            <div class="stat-row"><span>HRV / Puls</span><span class="stat-val">${p.hrV}ms / ${p.bpm}bpm</span></div>
            <div class="stat-row"><span>VO2 Max</span><span class="stat-val">${p.vo2} ml/kg</span></div>
            <div class="bar-bg"><div class="bar-fill" style="width:${(p.vo2/60)*100}%; background:cyan;"></div></div>
            <div class="stat-row"><span>Schlaf / Stress</span><span class="stat-val">${p.sleep}pts / ${p.stress}%</span></div>
            <div class="stat-row"><span>Recovery Time</span><span class="stat-val">${p.recovery}h</span></div>
            
            <div style="background:rgba(57,255,20,0.05); padding:8px; border-radius:8px; margin-top:10px; font-size:10px; border-left:2px solid var(--neon);">
              <strong>TONI AI:</strong> ${readiness > 70 ? 'Optimaler Zustand für Startelf.' : 'Erhöhtes Verletzungsrisiko. Belastung steuern.'}
            </div>
          </div>`;
      });
    } else if(s === 'kabine') {
       team.forEach(p => {
         grid.innerHTML += `<div style="background:var(--gold); color:#000; padding:15px; border-radius:10px; cursor:pointer;" onclick="editPlayer(${p.id})">
           <h3 style="margin:0">${p.name}</h3><p>RATING: ${p.rating}</p><small>Klick zum Editieren aller Bio-Werte</small>
         </div>`;
       });
    }
  }

  function editPlayer(id) {
    currentId = id;
    const p = team.find(x => x.id === id);
    const fields = document.getElementById('edit-fields');
    document.getElementById('editor').style.display = 'block';
    
    fields.innerHTML = `
      <div class="section-title">BASICS</div>
      <div class="input-group"><label>Name</label><input type="text" id="e-name" value="${p.name}"></div>
      <div class="input-group"><label>Rating</label><input type="number" id="e-rating" value="${p.rating}"></div>
      <div class="section-title">WAAGE (BIA)</div>
      <div class="input-group"><label>Gewicht</label><input type="number" step="0.1" id="e-weight" value="${p.weight}"></div>
      <div class="input-group"><label>Muskel (kg)</label><input type="number" step="0.1" id="e-muscle" value="${p.muscle}"></div>
      <div class="input-group"><label>Fett (%)</label><input type="number" step="0.1" id="e-fat" value="${p.fat}"></div>
      <div class="input-group"><label>Wasser (%)</label><input type="number" step="0.1" id="e-water" value="${p.water}"></div>
      <div class="input-group"><label>Knochen (kg)</label><input type="number" step="0.1" id="e-bone" value="${p.bone}"></div>
      <div class="input-group"><label>Viszeral</label><input type="number" id="e-visc" value="${p.visceral}"></div>
      <div class="section-title">UHR (TRACKER)</div>
      <div class="input-group"><label>Puls</label><input type="number" id="e-bpm" value="${p.bpm}"></div>
      <div class="input-group"><label>HRV (ms)</label><input type="number" id="e-hrv" value="${p.hrV}"></div>
      <div class="input-group"><label>SpO2 (%)</label><input type="number" id="e-spo2" value="${p.spo2}"></div>
      <div class="input-group"><label>Schlaf (Score)</label><input type="number" id="e-sleep" value="${p.sleep}"></div>
      <div class="input-group"><label>VO2 Max</label><input type="number" id="e-vo2" value="${p.vo2}"></div>
      <div class="input-group"><label>Stress (%)</label><input type="number" id="e-stress" value="${p.stress}"></div>
      <div class="input-group"><label>Recovery (h)</label><input type="number" id="e-recovery" value="${p.recovery}"></div>
    `;
  }

  function saveData() {
    const p = team.find(x => x.id === currentId);
    p.name = document.getElementById('e-name').value;
    p.rating = document.getElementById('e-rating').value;
    p.weight = parseFloat(document.getElementById('e-weight').value);
    p.muscle = parseFloat(document.getElementById('e-muscle').value);
    p.fat = parseFloat(document.getElementById('e-fat').value);
    p.water = parseFloat(document.getElementById('e-water').value);
    p.bone = parseFloat(document.getElementById('e-bone').value);
    p.visceral = parseInt(document.getElementById('e-visc').value);
    p.bpm = parseInt(document.getElementById('e-bpm').value);
    p.hrV = parseInt(document.getElementById('e-hrv').value);
    p.spo2 = parseInt(document.getElementById('e-spo2').value);
    p.sleep = parseInt(document.getElementById('e-sleep').value);
    p.vo2 = parseInt(document.getElementById('e-vo2').value);
    p.stress = parseInt(document.getElementById('e-stress').value);
    p.recovery = parseInt(document.getElementById('e-recovery').value);

    document.getElementById('editor').style.display = 'none';
    openSektor('analyse');
    renderArena();
  }

  function closeOverlay() { document.getElementById('ov').style.display = 'none'; document.getElementById('editor').style.display = 'none'; }
  renderArena();
</script>
</body>
</html>
