<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni AI - V12</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #app { background: white; width: 95%; max-width: 500px; height: 90vh; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #1a1a1a; color: white; padding: 20px; text-align: center; font-weight: bold; border-bottom: 4px solid #28a745; font-size: 1.2rem; }
        #login-screen, #chat-screen { flex: 1; display: flex; flex-direction: column; padding: 25px; }
        input { padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        button { background: #28a745; color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #218838; }
        #chat-history { flex: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .toni { align-self: flex-start; background: #e9e9eb; color: #333; border-bottom-left-radius: 2px; }
        .info-box { font-size: 0.7rem; color: #666; text-align: center; padding: 5px; background: #fff3cd; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">⚽ COACH TONI - V12 (STABLE-MODE)</div>
    
    <div id="login-screen">
        <h3 style="text-align:center">Trainer Anmeldung</h3>
        <input type="text" id="username" placeholder="Dein Name">
        <input type="password" id="password" placeholder="Passwort (Trainer2026)">
        <input type="text" id="user-key" placeholder="Google API-Key">
        <button onclick="startToni()">Toni aktivieren</button>
    </div>

    <div id="chat-screen" style="display:none">
        <div id="chat-history"></div>
        <div class="info-box">Modus: Gemini 1.5 Flash (Free Tier)</div>
        <div style="display:flex; gap:8px">
            <input type="text" id="user-input" style="flex:1" placeholder="Frag Toni...">
            <button onclick="askToni()">FRAGEN</button>
        </div>
    </div>
</div>

<script>
    let USER_KEY = "";

    function startToni() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const key = document.getElementById('user-key').value.trim();

        if (user && pass === "Trainer2026" && key.startsWith("AIza")) {
            USER_KEY = key;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            addMsg("toni", `Servus ${user}! Wir nutzen jetzt 1.5 Flash. Das sollte keine Limit-Probleme machen. Was trainieren wir?`);
        } else {
            alert("Check Passwort (Trainer2026) und Key!");
        }
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMsg("user", text);
        input.value = "";
        
        // Wir nutzen v1beta, aber das stabilere 1.5er Modell
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${USER_KEY}`;
        
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Du bist Toni, ein erfahrener Fußballtrainer. Antworte motivierend: ${text}` }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                addMsg("toni", data.candidates[0].content.parts[0].text);
            } else if (data.error) {
                addMsg("toni", "Google-Info: " + data.error.message);
            }
        } catch (e) {
            addMsg("toni", "Technischer Fehler bei der Verbindung.");
        }
    }

    function addMsg(role, text) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
