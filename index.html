<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TONI 2.0 | Ultimate Titan Edition</title>
<meta name="description" content="TONI 2.0 - Hybrides Hochleistungstool für professionelle Taktikanalyse, Spieler-Management und Vereinsstrategie.">

<!-- Professionelles CSS Design System -->
<style>
  :root {
    --bg-dark: #0d1117; --bg-medium: #161b22; --bg-light: #21262d;
    --border-color: #30363d; --text-primary: #e6edf3; --text-secondary: #848d97;
    --accent-blue: #58a6ff; --accent-green: #3fb950; --accent-red: #f85149; --accent-yellow: #e3b341;
    --gold-gradient: linear-gradient(145deg, #d4af37, #b48c2c);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius-md: 10px; --radius-lg: 16px;
  }
    * { box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%; margin: 0; padding: 0;
    background-color: var(--bg-dark); color: var(--text-primary);
    font-family: var(--font-sans); font-size: 14px; overflow: hidden;
  }
.scroll-content { overflow-y: auto; padding-right: 8px; }
.scroll-content::-webkit-scrollbar { width: 6px; }
.scroll-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
.btn {
    padding: 10px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color);
    background-color: var(--bg-medium); color: var(--text-primary);
    font-weight: 600; cursor: pointer; transition: background-color.2s, border-color.2s;
  }
.btn:hover { background-color: var(--bg-light); }
.btn-primary { background-color: var(--accent-green); border-color: var(--accent-green); color: #fff; }
.system-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10000; background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); }
.system-overlay[hidden] { display: none; }
.spinner { width: 50px; height: 50px; border: 5px solid var(--border-color); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#login-screen { flex-direction: column; gap: 20px; }
.login-box { width: 90%; max-width: 380px; padding: 40px; background: var(--bg-medium); border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
.app-container { display: grid; grid-template-rows: 60px 1fr; grid-template-columns: 280px 1fr 350px; height: 100vh; padding: 12px; gap: 12px; }
.app-header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
.panel { background: var(--bg-medium); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 16px; display:flex; flex-direction:column; overflow: hidden; }
#board-wrap { flex: 1; position: relative; border-radius: var(--radius-md); overflow: hidden; background-color: #011a01; }
#main-canvas { position: absolute; top: 0; left: 0; touch-action: none; }
#arena-controls { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 8px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: var(--radius-md); }
.tool-btn.active { background-color: var(--accent-blue); border-color: var(--accent-blue); }
.dialog-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5000; background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(8px); }
.dialog-overlay.is-active { display: flex; }
.dialog-box { width: 90vw; max-width: 1400px; height: 90vh; background: var(--bg-medium); border: 1px solid var(--border-color); border-radius: var(--radius-lg); display: flex; flex-direction: column; }
.dialog-header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
.dialog-title { font-size: 18px; font-weight: 600; }
.dialog-content { flex: 1; padding: 24px; overflow: auto; }
.fifa-card { background: var(--gold-gradient); color: #1a1a1a; border-radius: var(--radius-md); padding: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
.live-session-btn { border: 2px solid var(--accent-red); color: var(--accent-red); }
.live-session-btn.active { background-color: var(--accent-red); color: #fff; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(248, 81, 73, 0); } 100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); } }
.mobile-nav-btn { display: none; }

/* --- RESPONSIVE DESIGN --- */
@media (max-width: 992px) {
  .app-container { grid-template-columns: 1fr 300px; }
    #left-panel { position: fixed; top: 0; left: 0; height: 100%; width: 280px; z-index: 8000; transition: transform.3s ease; transform: translateX(-100%); border-radius: 0; }
    #left-panel.is-visible { transform: translateX(0); }
  .mobile-nav-btn.menu { display: block; }
}
@media (max-width: 768px) {
 .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr; padding: 8px; gap: 8px; }
 .user-details { display: none; }
 .desktop-controls { display: none; }
    #left-panel, #right-panel { position: fixed; top: 0; height: 100%; width: 85%; max-width: 320px; z-index: 8000; transition: transform.3s ease; border-radius: 0; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    #left-panel { left: 0; transform: translateX(-100%); }
    #right-panel { right: 0; transform: translateX(100%); }
    #left-panel.is-visible, #right-panel.is-visible { transform: translateX(0); }
 .dialog-box { width: 100vw; height: 100vh; border-radius: 0; border: none; }
}
</style>
</head>
<body>

<div id="system-loader" class="system-overlay"><div class="spinner"></div></div>
<div id="login-screen" class="system-overlay">
  <div class="login-box">
    <h1 style="text-align: center; font-weight: 300; letter-spacing: 2px;">TONI 2.0</h1>
    <form id="login-form">
      <div style="margin-bottom: 16px;">
        <label for="username" style="display:block; margin-bottom:6px; color:var(--text-secondary);">Benutzerprofil</label>
        <select id="username" class="input-field"></select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">SYSTEM LADEN</button>
    </form>
  </div>
</div>

<div id="main-app" class="app-container" style="display:none;">
  <header class="app-header panel">
    <div style="display: flex; align-items: center; gap: 16px;">
        <button id="toggle-left-panel-btn" class="btn mobile-nav-btn menu">☰</button>
        <div class="user-profile" style="display: flex; align-items: center; gap: 12px;">
            <div id="user-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-light); display:flex; align-items:center; justify-content:center; font-weight:bold;"></div>
            <div class="user-details">
                <div id="user-name" style="font-weight: 600;"></div>
                <div id="user-role" style="color:var(--text-secondary); font-size:0.9em;"></div>
            </div>
        </div>
    </div>
    <div class="desktop-controls" style="display:flex; align-items:center; gap: 20px;">
        <button id="live-session-btn" class="btn live-session-btn" title="Live-Session starten/stoppen">🎙️</button>
        <button id="admin-panel-btn" class="btn" style="display:none;">👑 Admin Panel</button>
    </div>
    <button id="toggle-right-panel-btn" class="btn mobile-nav-btn">💬</button>
  </header>
  <aside id="left-panel" class="left-panel panel"></aside>
  <main id="main-arena" class="main-arena panel" style="padding: 8px;">
    <div id="board-wrap"><canvas id="main-canvas"></canvas><div id="arena-controls"></div></div>
  </main>
  <aside id="right-panel" class="right-panel panel">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:12px; margin-bottom:12px;">
      <h3 style="margin:0; font-size:16px;">TONI <span id="ai-status">●</span></h3>
      <button id="close-panel-btn" class="btn mobile-nav-btn" style="padding: 4px 8px;">✕</button>
    </div>
    <div id="chat-box" class="scroll-content" style="flex:1;"></div>
    <form id="chat-form" style="display:flex; gap:8px; margin-top:12px;">
      <input type="text" id="user-cmd" class="input-field" placeholder="Befehl..."><button type="submit" class="btn">➤</button>
    </form>
  </aside>
</div>

<div id="player-dashboard" class="dialog-overlay"></div>
<!-- Other dialog overlays would go here -->
<div id="management-hub" class="dialog-overlay"><div class="dialog-box"><header class="dialog-header"><h2 class="dialog-title">🏢 Management Cockpit</h2><button class="btn" onclick="UIManager.closeDialog('management-hub')">✕</button></header><div id="management-content" class="dialog-content"></div></div></div>
<div id="admin-panel-dialog" class="dialog-overlay"><div class="dialog-box" style="max-width: 900px;"><header class="dialog-header"><h2 class="dialog-title">👑 Admin Panel</h2><button class="btn" onclick="UIManager.closeDialog('admin-panel-dialog')">✕</button></header><div id="admin-content" class="dialog-content"></div></div></div>
<div id="mobile-backdrop" class="system-overlay" style="z-index: 7999; background: rgba(0,0,0,0.5); backdrop-filter: none;" hidden></div>

<script>
'use strict';
// --- MOCK DATA ---
const MockData = {
    users: {
        "ralf-meier": { id: "ralf-meier", name: "Ralf Meier", role: "Cheftrainer (3-4-3)", avatar: "RM", permissions: ["view_team", "edit_tactic", "view_analytics", "edit_magazine"] },
        "jens-schmidt": { id: "jens-schmidt", name: "Jens Schmidt", role: "Manager", avatar: "JS", permissions: ["view_team", "view_finances", "edit_contracts"] },
        "admin": { id: "admin", name: "Admin", role: "System-Administrator", avatar: "👑", permissions: ["*"] }
    },
    team: {
        squad: {
            "p1":{id:"p1",pos:"ST",name:"Müller",num:13,att:{pac:90,sho:88,pas:80,dri:85,def:40,phy:78},ovr:88,bio:{hr:75,readiness:95,muscle:42.5,fat:11.2,water:60.1}},
            "p2":{id:"p2",pos:"ZDM",name:"Kimmich",num:6,att:{pac:75,sho:78,pas:91,dri:84,def:82,phy:79},ovr:89,bio:{hr:68,readiness:92,muscle:41.8,fat:12.1,water:59.5}},
            "p3":{id:"p3",pos:"IV",name:"Hummels",num:5,att:{pac:65,sho:60,pas:78,dri:72,def:90,phy:84},ovr:86,bio:{hr:71,readiness:88,muscle:44.1,fat:13.5,water:58.2}}
        }
    },
    finances: { budget: 2500000, salaries: 1700000, infrastructure: 450000, sponsors: [{name:"ToniTech Labs", val:500000}, {name:"Zweipunktnull Med", val:350000}] }
};

// --- APPLICATION STATE & API ---
const AppState = { user: null, team: null, drawings: [], ui: { activeTool: 'select' } };
const ApiService = {
    _s(ms=200){return new Promise(r=>setTimeout(r,ms));},
    async getProfiles(){await this._s(100);return Object.values(MockData.users).map(u=>({id:u.id,name:u.name,role:u.role}));},
    async login(id){await this._s();const u=MockData.users[id];if(u)return u;throw new Error("User not found");},
    async getData(type){await this._s();return JSON.parse(JSON.stringify(MockData[type]));},
    async searchWeb(q){await this._s(1000);console.log(`WEB SEARCH: ${q}`);return `Die Rondo-Übung '4 gegen 2' ist ideal. Feld: 10x10 Meter. Material: 6 Hütchen, Bälle. Ablauf: 4 Angreifer an den Seiten, 2 Verteidiger jagen den Ball. Ziel: 10 Pässe schaffen.`;}
};

// --- UI MANAGER ---
const UIManager = {
    init() {
        this.el = {};
        ['system-loader','login-screen','login-form','username','main-app','user-avatar','user-name','user-role','live-session-btn','admin-panel-btn','toggle-left-panel-btn','toggle-right-panel-btn','left-panel','right-panel','close-panel-btn','main-arena','board-wrap','main-canvas','arena-controls','ai-status','chat-box','chat-form','user-cmd','player-dashboard','management-hub','management-content','admin-panel-dialog','admin-content','mobile-backdrop']
       .forEach(id => this.el[id] = document.getElementById(id));
        this.bindEvents();
    },
    bindEvents() {
        this.el['login-form'].onsubmit = e => {e.preventDefault(); App.login(this.el['username'].value);};
        this.el['left-panel'].onclick = e => {
            const t=e.target.closest('[data-action]'); if(!t)return; this.togglePanel('left-panel',false);
            switch(t.dataset.action){
                case 'squad': this.renderSquadList(); break;
                case 'management': this.openDialog('management-hub'); this.renderManagementHub(); break;
                case 'admin': this.openDialog('admin-panel-dialog'); this.renderAdminPanel(); break;
                case 'logout': App.logout(); break;
            }
        };
        this.el['toggle-left-panel-btn'].onclick=()=>this.togglePanel('left-panel');
        this.el['toggle-right-panel-btn'].onclick=()=>this.togglePanel('right-panel');
        this.el['close-panel-btn'].onclick=()=>this.togglePanel('right-panel',false);
        this.el['mobile-backdrop'].onclick=()=>{this.togglePanel('left-panel',false);this.togglePanel('right-panel',false);};
        this.el['chat-form'].onsubmit=e=>{e.preventDefault();ToniAI.processCommand();};
        this.el['live-session-btn'].onclick=()=>ToniAI.toggleLiveSession();
    },
    togglePanel(id,force){const p=this.el[id],v=force===undefined?!p.classList.contains('is-visible'):force;p.classList.toggle('is-visible',v);const a=this.el['left-panel'].classList.contains('is-visible')||this.el['right-panel'].classList.contains('is-visible');this.el['mobile-backdrop'].hidden=!a;},
    openDialog(id){document.querySelectorAll('.dialog-overlay').forEach(d=>d.classList.remove('is-active'));this.el[id].classList.add('is-active');},
    closeDialog(id){this.el[id].classList.remove('is-active');},
    showApp(){this.el['main-app'].style.display='grid';this.updateHeader();this.renderLeftPanel();this.renderSquadList();},
    updateHeader(){this.el['user-name'].textContent=AppState.user.name;this.el['user-role'].textContent=AppState.user.role;this.el['user-avatar'].textContent=AppState.user.avatar;this.el['admin-panel-btn'].style.display=AppState.user.permissions.includes('*')?'block':'none';},
    renderLeftPanel() {
        let c=`<div id="squad-list" class="scroll-content" style="flex:1;"></div><div style="border-top:1px solid var(--border-color); padding-top:12px; margin-top:12px;">`;
        if(AppState.user.permissions.includes('view_finances') || AppState.user.permissions.includes('*')) c+=`<button class="btn" data-action="management" style="width:100%; margin-bottom:8px;">🏢 Management</button>`;
        if(AppState.user.permissions.includes('*')) c+=`<button class="btn" data-action="admin" style="width:100%; margin-bottom:8px;">👑 Admin Panel</button>`;
        c+=`<button class="btn" data-action="logout" style="width:100%; border-color:var(--accent-red); color:var(--accent-red);">Logout</button></div>`;
        this.el['left-panel'].innerHTML=c;
    },
    renderSquadList() {
        const listEl=document.getElementById('squad-list');
        listEl.innerHTML = `<h2>Kader</h2>` + Object.values(AppState.team.squad).map(p =>
            `<button class="btn" onclick="UIManager.renderPlayerDashboard('${p.id}')" style="width:100%;display:flex;align-items:center;gap:12px;margin-bottom:8px;text-align:left;">
                <span style="background:var(--bg-dark);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:bold;">${p.num}</span>
                <div><div>${p.name}</div><small style="color:var(--text-secondary);">${p.pos}</small></div>
                <span style="margin-left:auto;font-size:16px;font-weight:bold;">${p.ovr}</span>
            </button>`
        ).join('');
    },
    renderPlayerDashboard(id){
        const p=AppState.team.squad[id]; if(!p)return;
        this.el['player-dashboard'].innerHTML =
        `<div class="dialog-box"><header class="dialog-header"><h2 class="dialog-title">Akte: ${p.name}</h2><button class="btn" onclick="UIManager.closeDialog('player-dashboard')">✕</button></header>
        <div class="dialog-content scroll-content" style="display:grid; grid-template-columns: 300px 1fr; gap:24px;">
            <div class="fifa-card">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <strong style="font-size:24px;">${p.ovr}</strong>
                    <span style="font-size:20px;font-weight:bold;">${p.pos}</span>
                </div>
                <div style="text-align:center; margin:12px 0; font-size:20px; font-weight:bold;">${p.name} #${p.num}</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-weight:600;">
                    <span>${p.att.pac} PAC</span><span>${p.att.dri} DRI</span>
                    <span>${p.att.sho} SHO</span><span>${p.att.def} DEF</span>
                    <span>${p.att.pas} PAS</span><span>${p.att.phy} PHY</span>
                </div>
            </div>
            <div>
                <h3>Bio-Monitoring</h3>
                <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">
                    <div id="hr-display" style="font-size:24px;color:var(--accent-red);">❤️ ${p.bio.hr}</div>
                    <div>Readiness: <strong style="font-size:18px;">${p.bio.readiness}%</strong></div>
                </div>
                <h3>BIA-Diagnostik</h3>
                <p>Muskelmasse: ${p.bio.muscle}kg | Körperfett: ${p.bio.fat}% | Wasser: ${p.bio.water}%</p>
            </div>
        </div></div>`;
        this.openDialog('player-dashboard');
    },
    renderManagementHub(){
        const f=AppState.finances;const c=f.salaries+f.infrastructure;const l=f.budget-c;
        this.el['management-content'].innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
            <div><h3>Finanzstatus (p.a.)</h3>
                <p>Budget: <strong style="color:var(--accent-green);">${f.budget.toLocaleString('de-DE')} €</strong></p>
                <p>Kosten: <strong style="color:var(--accent-red);">${c.toLocaleString('de-DE')} €</strong></p>
                <p>Liquidität: <strong style="color:${l>0?'var(--accent-green)':'var(--accent-red)'};">${l.toLocaleString('de-DE')} €</strong></p>
            </div>
            <div><h3>Sponsoring</h3>${f.sponsors.map(s=>`<p>${s.name}: <strong>${s.val.toLocaleString('de-DE')} €</strong></p>`).join('')}</div>
        </div>
        <h3>Analysezentrum Ausbau</h3><div style="background:var(--bg-dark);border-radius:var(--radius-md);padding:4px;"><div style="width:45%; background:var(--accent-blue);height:20px;border-radius:var(--radius-md);"></div></div>`;
    }
};

// --- TONI AI CORE ---
const ToniAI = {
    init(){this.el=UIManager.el;this.updateStatus('online','var(--accent-green)');this.speak(`System für ${AppState.user.name} online. Liga: Regionalliga. Formation: ${AppState.user.role.match(/\((.*?)\)/)?.[1]||'Standard'}`);this.setupSpeech();},
    updateStatus(t,c){this.el['ai-status'].style.color=c;},
    speak(m,u=false){const d=document.createElement('div');d.style.marginBottom='12px';if(u){d.style.textAlign='right';d.innerHTML=`<div style="display:inline-block;background:var(--accent-blue);color:#fff;padding:8px 12px;border-radius:12px 12px 0 12px;">${m}</div>`;}else{d.innerHTML=`<small style="color:var(--text-secondary);font-weight:bold;">TONI:</small><div style="padding:4px 0;">${m.replace(/\n/g,"<br>")}</div>`;}this.el['chat-box'].append(d);this.el['chat-box'].scrollTop=this.el['chat-box'].scrollHeight;},
    async processCommand(cmd){
        const txt=cmd||this.el['user-cmd'].value.trim();if(!txt)return;this.speak(txt,true);if(!cmd)this.el['user-cmd'].value='';
        if(txt.match(/suche|finde/i) && txt.match(/übung|rondo/i)){
            this.speak("Suche Übung im Web und visualisiere sie...");
            const res = await ApiService.searchWeb(txt);
            this.speak(res);
            ArenaEngine.Tactic.visualizeFromText(res);
        } else if (txt.match(/system-duell|formationen/i)) {
            this.speak("Stelle System-Duell auf: Dein 3-4-3 gegen ein 4-4-2.");
            ArenaEngine.Tactic.setupSystemDuel();
        } else {
            this.speak("Verstanden. Führe Websuche durch...");
            const res = await ApiService.searchWeb(txt); this.speak(res);
        }
    },
    setupSpeech(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;this.rec=new S();this.rec.continuous=false;this.rec.lang='de-DE';this.rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim();this.processCommand(t);};this.rec.onend=()=>{if(this.el['live-session-btn'].classList.contains('active'))this.rec.start();};},
    toggleLiveSession(){if(!this.rec)return this.speak("Spracherkennung nicht unterstützt.");const btn=this.el['live-session-btn'];btn.classList.toggle('active');if(btn.classList.contains('active')){this.rec.start();this.speak("Live-Session gestartet. Ich höre zu.");}else{this.rec.stop();this.speak("Live-Session beendet.");}}
};

// --- ARENA ENGINE ---
const ArenaEngine = {
    init(){this.c=UIManager.el['main-canvas'];this.ctx=this.c.getContext('2d');this.dpr=window.devicePixelRatio||1;this.setupCanvas();this.bindEvents();this.render();},
    setupCanvas(){const r=this.c.parentElement.getBoundingClientRect();this.c.width=r.width*this.dpr;this.c.height=r.height*this.dpr;this.c.style.width=`${r.width}px`;this.c.style.height=`${r.height}px`;this.ctx.scale(this.dpr,this.dpr);},
    bindEvents(){const getPos=e=>{const r=this.c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};const pDown=e=>{const pos=getPos(e);const p=this.getPlayerAt(pos);if(AppState.ui.activeTool==='select'&&p){this.isDragging=true;this.dragTarget=p;this.c.style.cursor='grabbing';}else{this.Drawing.start(pos);}};const pMove=e=>{e.preventDefault();const pos=getPos(e);if(this.isDragging&&this.dragTarget){this.dragTarget.canvas.x=pos.x;this.dragTarget.canvas.y=pos.y;this.render();}else{if(this.Drawing.update(pos))this.render();}};const pUp=()=>{if(this.isDragging){this.isDragging=false;this.dragTarget=null;this.c.style.cursor='grab';}else{this.Drawing.finish();}};this.c.onpointerdown=pDown;this.c.onpointermove=pMove;this.c.onpointerup=pUp;this.c.onpointercancel=pUp;window.onresize=()=>{this.setupCanvas();this.render();};UIManager.el['arena-controls'].onclick=e=>{const t=e.target.closest('[data-tool]');if(t)this.setTool(t.dataset.tool);};},
    render(){requestAnimationFrame(()=>{const w=this.c.clientWidth,h=this.c.clientHeight;this.ctx.clearRect(0,0,w,h);this.drawPitch(w,h);this.Drawing.renderAll();Object.values(AppState.team.squad).forEach(p=>this.drawPlayer(p));if(AppState.opponents)Object.values(AppState.opponents).forEach(p=>this.drawPlayer(p,true));});},
    drawPitch(w,h){this.ctx.fillStyle='#011a01';this.ctx.fillRect(0,0,w,h);this.ctx.strokeStyle='rgba(255,255,255,0.2)';this.ctx.lineWidth=2;this.ctx.strokeRect(25,25,w-50,h-50);this.ctx.beginPath();this.ctx.moveTo(w/2,25);this.ctx.lineTo(w/2,h-50);this.ctx.stroke();this.ctx.beginPath();this.ctx.arc(w/2,h/2,Math.min(w,h)/10,0,2*Math.PI);this.ctx.stroke();this.ctx.strokeRect(25,h/2-Math.min(w,h)/4,Math.min(w,h)/6,Math.min(w,h)/2);this.ctx.strokeRect(w-25-Math.min(w,h)/6,h/2-Math.min(w,h)/4,Math.min(w,h)/6,Math.min(w,h)/2);},
    drawPlayer(p,isOpp=false){const{x,y}=p.canvas;this.ctx.beginPath();this.ctx.arc(x,y,20,0,2*Math.PI);this.ctx.fillStyle=isOpp?'#c00':'var(--accent-blue)';this.ctx.fill();this.ctx.fillStyle='#fff';this.ctx.font='bold 18px var(--font-sans)';this.ctx.textAlign='center';this.ctx.textBaseline='middle';this.ctx.fillText(p.num,x,y);},
    getPlayerAt(pos){return Object.values(AppState.team.squad).reverse().find(p=>Math.hypot(p.canvas.x-pos.x,p.canvas.y-pos.y)<25);},
    setTool(id){if(id==='clear'){AppState.drawings=[];this.render();return;}AppState.ui.activeTool=id;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===id));this.c.style.cursor=id==='select'?'grab':'crosshair';},
    Tactic:{
        visualizeFromText(txt){
            AppState.drawings=[];
            const fieldMatch=txt.match(/(\d+)x(\d+)\s*Meter/);
            if(fieldMatch){
                const w=parseInt(fieldMatch[1])*20,h=parseInt(fieldMatch[2])*20;
                AppState.drawings.push({type:'zone',color:'rgba(255,174,0,0.3)',sx:ArenaEngine.c.clientWidth/2-w/2,sy:ArenaEngine.c.clientHeight/2-h/2,ex:ArenaEngine.c.clientWidth/2+w/2,ey:ArenaEngine.c.clientHeight/2+h/2});
            }
            const players=Object.values(AppState.team.squad);
            const numAttackers=txt.match(/(\d+)\s*Angreifer/)?.[1]||4;
            const numDefenders=txt.match(/(\d+)\s*Verteidiger/)?.[1]||2;
            // Simple placement logic for demo
            for(let i=0;i<numAttackers&&i<players.length;i++){
                const angle=i*(2*Math.PI/numAttackers);
                players[i].canvas.x = ArenaEngine.c.clientWidth/2 + 150 * Math.cos(angle);
                players[i].canvas.y = ArenaEngine.c.clientHeight/2 + 150 * Math.sin(angle);
            }
            ArenaEngine.render();
        },
        setupSystemDuel(){
            const {clientWidth:w,clientHeight:h}=ArenaEngine.c;
            const P=Object.values(AppState.team.squad);
            // 3-4-3
            if(P[0])P[0].canvas={x:w*0.15,y:h*0.5};if(P[1])P[1].canvas={x:w*0.15,y:h*0.25};if(P[2])P[2].canvas={x:w*0.15,y:h*0.75};
            // Opponents 4-4-2
            AppState.opponents = {};
            for(let i=1;i<=11;i++) AppState.opponents[`o${i}`]={id:`o${i}`,num:i,canvas:{}};
            const O=Object.values(AppState.opponents);
            O[0].canvas={x:w*0.85,y:h*0.5}; O[1].canvas={x:w*0.8,y:h*0.2}; O[2].canvas={x:w*0.8,y:h*0.8};
            ArenaEngine.render();
        }
    },
    Drawing:{
        start(p){if(AppState.ui.activeTool==='select')return;this.curr={type:AppState.ui.activeTool,color:'rgba(255,51,51,0.9)',sx:p.x,sy:p.y,ex:p.x,ey:p.y};},
        update(p){if(!this.curr)return false;this.curr.ex=p.x;this.curr.ey=p.y;return true;},
        finish(){if(!this.curr)return;if(Math.hypot(this.curr.ex-this.curr.sx,this.curr.ey-this.curr.sy)>10)AppState.drawings.push(this.curr);this.curr=null;ArenaEngine.render();},
        renderAll(){AppState.drawings.forEach(d=>this.draw(d));if(this.curr)this.draw(this.curr);},
        draw(d){const{ctx}=ArenaEngine;ctx.strokeStyle=d.color;ctx.fillStyle=d.color;ctx.lineWidth=4;if(d.type==='zone'){ctx.globalAlpha=0.3;ctx.fillRect(d.sx,d.sy,d.ex-d.sx,d.ey-d.sy);ctx.globalAlpha=1;}else{ctx.beginPath();ctx.moveTo(d.sx,d.sy);ctx.lineTo(d.ex,d.ey);ctx.stroke();if(d.type==='arrow'){const a=Math.atan2(d.ey-d.sy,d.ex-d.sx);ctx.beginPath();ctx.moveTo(d.ex,d.ey);ctx.lineTo(d.ex-15*Math.cos(a-Math.PI/6),d.ey-15*Math.sin(a-Math.PI/6));ctx.moveTo(d.ex,d.ey);ctx.lineTo(d.ex-15*Math.cos(a+Math.PI/6),d.ey-15*Math.sin(a+Math.PI/6));ctx.stroke();}}}
    }
};

// --- APP LIFECYCLE ---
const App = {
    async init() {
        UIManager.init();
        const uid = sessionStorage.getItem('toni2_uid');
        if(uid) await this.login(uid);
        else {
            const profiles = await ApiService.getProfiles();
            UIManager.el['username'].innerHTML=profiles.map(p=>`<option value="${p.id}">${p.name} - ${p.role}</option>`).join('');
            UIManager.el['login-screen'].style.opacity=1;
        }
    },
    async login(id) {
        UIManager.el['system-loader'].hidden=false;
        UIManager.el['login-screen'].hidden=true;
        try {
            const [user, team, finances] = await Promise.all([ApiService.login(id), ApiService.getData('team'), ApiService.getData('finances')]);
            AppState.user=user; AppState.team=team; AppState.finances=finances;
            sessionStorage.setItem('toni2_uid',id);
            UIManager.el['system-loader'].hidden=true;
            UIManager.showApp(); ToniAI.init(); ArenaEngine.init();
        } catch(e){ console.error(e); UIManager.el['system-loader'].hidden=true; UIManager.el['login-screen'].hidden=false; }
    },
    logout() { sessionStorage.removeItem('toni2_uid'); window.location.reload(); }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
