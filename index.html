<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - Intro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #intro-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 100; transition: opacity 1s ease; }
        .login-container { opacity: 0; z-index: 10; transition: opacity 1s ease; text-align: center; }
        .login-active .login-container { opacity: 1; }
        .login-active #intro-video { opacity: 0; pointer-events: none; }
        .login-box { border: 1px solid #39FF14; padding: 40px; background: rgba(0,0,0,0.8); }
        input { background: #111; border: 1px solid #333; color: #39FF14; padding: 10px; text-align: center; margin-bottom: 10px; width: 200px; }
        button { background: #39FF14; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <video id="intro-video" autoplay muted playsinline>
        <source src="dein-video.mp4" type="video/mp4"> </video>

    <div class="login-container">
        <div class="login-box">
            <h2 style="color:#fff">TONI 2.0 ACCESS</h2>
            <input type="password" id="pass-input" placeholder="PASSWORT">
            <button onclick="checkAuth()">ENTRANCE</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('intro-video');
        video.onended = () => { document.body.classList.add('login-active'); };
        // Notfall-Timeout nach 8 Sekunden, falls das Video nicht lädt
        setTimeout(() => { document.body.classList.add('login-active'); }, 8000);

        function checkAuth() {
            if (document.getElementById('pass-input').value === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                window.location.href = 'app.html';
            }
        }
    </script>
</body>
</html>
