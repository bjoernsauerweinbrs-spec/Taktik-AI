<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TONI 2.0 | Professional Coaching & Management Suite</title>
<meta name="description" content="TONI 2.0 - Eine KI-gestützte, hybride Coaching-Plattform für professionelle Taktikanalyse, Spieler-Management und Vereinsstrategie.">

<!-- Professionelles CSS Design System -->
<style>
  :root {
    --bg-dark: #0d1117;
    --bg-medium: #161b22;
    --bg-light: #21262d;
    --border-color: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #848d97;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-red: #f85149;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }

  /* Globale Resets & Basis-Stile */
    * { box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 14px;
    overflow: hidden;
  }

  /* Utility-Klassen */
 .scroll-content { overflow-y: auto; padding-right: 8px; }
 .scroll-content::-webkit-scrollbar { width: 6px; }
 .scroll-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
 .text-muted { color: var(--text-secondary); font-size: 0.9em; }
 .text-accent { color: var(--accent-blue); }
 .text-green { color: var(--accent-green); }
 .text-red { color: var(--accent-red); }

  /* Buttons & Inputs */
 .btn {
    padding: 10px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background-color: var(--bg-medium);
    color: var(--text-primary);
    font-weight: 600;
    cursor: pointer;
    transition: background-color.2s, border-color.2s;
  }
 .btn:hover { background-color: var(--bg-light); border-color: var(--text-secondary); }
 .btn-primary { background-color: var(--accent-green); border-color: var(--accent-green); color: #fff; }
 .btn-primary:hover { background-color: #4acb5f; }
 .input-field {
    width: 100%;
    background: var(--bg-dark);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 1em;
  }

  /* System-Overlays (Loader, Login) */
 .system-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    background: rgba(13, 17, 23, 0.85);
    backdrop-filter: blur(10px);
    transition: opacity.3s ease;
  }
 .system-overlay[hidden] { display: none; }
 .spinner { /*... (wie gehabt)... */ }
  #login-screen { flex-direction: column; gap: 20px; }
 .login-box { width: 380px; padding: 40px; background: var(--bg-medium); border-radius: var(--radius-lg); border: 1px solid var(--border-color); }
 .login-title { text-align: center; margin-bottom: 24px; font-size: 24px; font-weight: 300; letter-spacing: 2px; }

  /* Haupt-App-Layout */
 .app-container {
    display: grid;
    grid-template-rows: 60px 1fr;
    grid-template-columns: 280px 1fr 350px;
    height: 100vh;
    padding: 12px;
    gap: 12px;
  }
 .app-header { grid-column: 1 / -1; }
 .left-panel { /* Spielerliste / Taktik-Varianten */ }
 .main-arena { /* Taktikboard */ }
 .right-panel { /* Toni AI Chat */ }
 .panel { background: var(--bg-medium); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 16px; display:flex; flex-direction:column; }

  /* Header */
 .app-header { display: flex; align-items: center; justify-content: space-between; }
 .user-profile { display: flex; align-items: center; gap: 12px; }
 .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-light); display:flex; align-items:center; justify-content:center; font-weight:bold; }
 .live-session-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid var(--accent-red); color: var(--accent-red); }
 .live-session-btn.active { background-color: var(--accent-red); color: #fff; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(248, 81, 73, 0); } 100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); } }
  
  /* Arena */
  #board-wrap { flex: 1; position: relative; border-radius: var(--radius-md); overflow: hidden; background-color: #011a01; }
  #main-canvas { position: absolute; top: 0; left: 0; }
  #arena-controls { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: var(--radius-md); }

  /* Dialog / Modal Overlays */
 .dialog-overlay {
    position: fixed;
    inset: 0;
    display: none; /* wird zu 'flex' bei Aktivierung */
    align-items: center;
    justify-content: center;
    z-index: 5000;
    background: rgba(13, 17, 23, 0.7);
    backdrop-filter: blur(8px);
  }
 .dialog-overlay.is-active { display: flex; }
 .dialog-box {
    width: 90vw;
    max-width: 1400px;
    height: 90vh;
    background: var(--bg-medium);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }
 .dialog-header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
 .dialog-title { font-size: 18px; font-weight: 600; }
 .dialog-content { flex: 1; padding: 24px; overflow: auto; }

  /* Stadionzeitung Editor Stile */
 .magazine-editor { display: grid; grid-template-columns: 300px 1fr; gap: 24px; height: 100%; }
 .magazine-pages-overview { display: flex; flex-direction: column; gap: 12px; }
 .page-thumbnail { aspect-ratio: 210 / 297; border: 2px dashed var(--border-color); background: var(--bg-dark); cursor: pointer; }
 .page-thumbnail.active { border-color: var(--accent-blue); }
 .magazine-page-view { background: #fff; color: #000; aspect-ratio: 210 / 297; max-height: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
 .editable-region { border: 1px dashed #cccccc; min-height: 50px; padding: 10px; transition: background-color.2s; }
 .editable-region:hover { background-color: #e0f0ff; }
</style>
</head>
<body>

<!-- System-Overlay für Ladezustände -->
<div id="system-loader" class="system-overlay">
  <div class="spinner"></div>
  <div id="system-message" class="message" style="margin-top:20px; color:var(--text-secondary);">SYSTEM WIRD GESTARTET...</div>
</div>

<!-- Login-Screen -->
<div id="login-screen" class="system-overlay">
  <div class="login-box">
    <h1 class="login-title">TONI 2.0</h1>
    <form id="login-form">
      <div style="margin-bottom: 16px;">
        <label for="username" class="text-muted" style="display:block; margin-bottom:6px;">Benutzerprofil</label>
        <select id="username" class="input-field">
          <!-- Profile werden dynamisch geladen -->
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">SYSTEM LADEN</button>
      <div id="login-error" class="text-red" style="margin-top:12px; text-align:center;"></div>
    </form>
  </div>
</div>

<!-- Haupt-App-Container (anfangs versteckt) -->
<div id="main-app" class="app-container" style="display:none;">
  
  <!-- 1. Header-Leiste -->
  <header class="app-header panel">
    <div class="user-profile">
      <div id="user-avatar" class="user-avatar"></div>
      <div>
        <div id="user-name" style="font-weight: 600;"></div>
        <div id="user-role" class="text-muted"></div>
      </div>
    </div>
    <div class="main-controls" style="display:flex; align-items:center; gap: 20px;">
        <button id="live-session-btn" class="live-session-btn" title="Live-Session starten/stoppen">🎙️</button>
        <button id="admin-panel-btn" class="btn" style="display:none;">👑 Admin Panel</button>
    </div>
  </header>

  <!-- 2. Linkes Panel -->
  <aside class="left-panel panel">
    <!-- Wird dynamisch mit Spielerliste oder Taktik-Optionen gefüllt -->
  </aside>

  <!-- 3. Haupt-Arena -->
  <main class="main-arena panel" style="padding: 8px;">
    <div id="board-wrap">
      <canvas id="main-canvas"></canvas>
      <div id="arena-controls">
        <!-- Werkzeuge werden hier dynamisch eingefügt -->
      </div>
    </div>
  </main>

  <!-- 4. Rechtes Panel -->
  <aside class="right-panel panel">
    <div id="toni-chat-header" style="border-bottom:1px solid var(--border-color); padding-bottom:12px; margin-bottom:12px;">
      <h3 style="margin:0; font-size:16px;">TONI <span id="ai-status" class="text-red">●</span></h3>
    </div>
    <div id="chat-box" class="scroll-content" style="flex:1;"></div>
    <form id="chat-form" onsubmit="return false;" style="display:flex; gap:8px; margin-top:12px;">
      <input type="text" id="user-cmd" class="input-field" placeholder="Befehl eingeben...">
      <button type="submit" class="btn">➤</button>
    </form>
  </aside>
</div>

<!-- Dialog Overlays (anfangs versteckt) -->
<div id="management-hub" class="dialog-overlay">
  <div class="dialog-box">
    <header class="dialog-header">
      <h2 class="dialog-title">🏢 Management Cockpit</h2>
      <button class="btn" onclick="UIManager.closeDialog('management-hub')">✕</button>
    </header>
    <div id="management-content" class="dialog-content">
      <!-- Inhalt des Management-Bereichs wird hier geladen -->
    </div>
  </div>
</div>

<div id="magazine-studio" class="dialog-overlay">
  <div class="dialog-box">
    <header class="dialog-header">
      <h2 class="dialog-title">📰 Stadionzeitung Studio</h2>
      <button class="btn" onclick="UIManager.closeDialog('magazine-studio')">✕</button>
    </header>
    <div class="dialog-content">
        <div id="magazine-editor" class="magazine-editor">
            <!-- Layout für den Editor wird hier dynamisch erstellt -->
        </div>
    </div>
  </div>
</div>

<div id="player-dashboard" class="dialog-overlay">
    <!-- Vollbild-Dashboard für den einzelnen Spieler -->
</div>

<div id="admin-panel-dialog" class="dialog-overlay">
    <!-- Das geheime Admin-Panel -->
</div>

</body>
</html>
<script>
/*

TONI 2.0 | A-License Edition | Core Logic Part 1

Modul-Struktur:
- MockData: Die "Datenbank" für die Simulation mit tiefen, realistischen Daten.
- AppState: Der zentrale State-Manager (Single Source of Truth).
- ApiService: Simulierte Backend-Kommunikation.
- App: Der Haupt-Controller, der alles initialisiert und steuert.

*/

// -----------------------------------------------------------------------------
// MODULE: MockData - Die simulierte Datenbank der App
// -----------------------------------------------------------------------------
const MockData = {
  // Benutzerprofile für den Login
  users: {
    "ralf-meier": {
      id: "ralf-meier",
      name: "Ralf Meier",
      role: "Cheftrainer",
      avatar: "RM",
      permissions: ["view_team", "edit_tactic", "view_analytics", "view_magazine"],
    },
    "sabine-keller": {
      id: "sabine-keller",
      name: "Sabine Keller",
      role: "Daten-Analystin",
      avatar: "SK",
      permissions: ["view_team", "view_analytics", "edit_magazine"],
    },
    "jens-schmidt": {
      id: "jens-schmidt",
      name: "Jens Schmidt",
      role: "Manager",
      avatar: "JS",
      permissions: ["view_team", "view_finances", "edit_contracts", "view_magazine"],
    },
    "admin": {
      id: "admin",
      name: "Admin",
      role: "System-Administrator",
      avatar: "👑",
      permissions: ["*"], // Wildcard für alle Berechtigungen
    },
  },
  
  // Detaillierte Vereins- und Spielerdaten
  team: {
    id: "fc-hersfeld",
    name: "FC Hersfeld",
    league: "Regionalliga",
    squad: {
      "p-1": {
        id: "p-1",
        personal: { name: "Müller", num: 13, position: "ST" },
        attributes: { pac: 90, sho: 88, pas: 80, dri: 85, def: 40, phy: 78, overall: 88 },
        canvas: { x: 800, y: 250 },
        medical: { status: "fit", readiness: 95, history: [{date: "2025-10-15", injury: "Muskelfaserriss", duration_days: 21}] },
        contract: { salary_monthly: 15000, valid_until: "2028-06-30", clause: "Keine" }
      },
      "p-2": {
        id: "p-2",
        personal: { name: "Kimmich", num: 6, position: "ZDM" },
        attributes: { pac: 75, sho: 78, pas: 91, dri: 84, def: 82, phy: 79, overall: 89 },
        canvas: { x: 500, y: 350 },
        medical: { status: "aufbautraining", readiness: 60, history: [{date: "2026-01-20", injury: "Bänderdehnung", duration_days: 14}] },
        contract: { salary_monthly: 18000, valid_until: "2029-06-30", clause: "Ausstiegsklausel 25 Mio €" }
      },
      "p-3": {
        id: "p-3",
        personal: { name: "Hummels", num: 5, position: "IV" },
        attributes: { pac: 65, sho: 60, pas: 78, dri: 72, def: 90, phy: 84, overall: 86 },
        canvas: { x: 250, y: 350 },
        medical: { status: "fit", readiness: 92, history: [] },
        contract: { salary_monthly: 12000, valid_until: "2027-06-30", clause: "Keine" }
      }
      //... weitere Spieler hier
    }
  },

  // Management- und Finanzdaten
  finances: {
    budget_total: 2500000,
    costs: {
      salaries_players: 1250000,
      salaries_staff: 450000,
      infrastructure: 300000,
      travel: 150000,
      nlz: 200000,
    },
    sponsors: [
      { name: "ToniTech Labs", contribution: 500000, status: "aktiv" },
      { name: "Zweipunktnull Med", contribution: 350000, status: "aktiv" }
    ]
  },
};

// -----------------------------------------------------------------------------
// MODULE: AppState - Der zentrale Zustand der Anwendung
// -----------------------------------------------------------------------------
const AppState = {
  user: null, // Das eingeloggte Benutzerprofil
  team: null, // Die geladenen Team-Daten
  finances: null, // Die geladenen Finanz-Daten
  ui: {
    activeTool: 'select',
    activeOverlay: null,
    isLiveSession: false,
  },
  settings: {
    // Hier können Benutzereinstellungen gespeichert werden
  },
};

// -----------------------------------------------------------------------------
// MODULE: ApiService - Simuliert die Server-Kommunikation
// -----------------------------------------------------------------------------
const ApiService = {
  // Simuliert eine Netzwerklatenz
  _simulateLatency(ms = 300) {
    return new Promise(resolve => setTimeout(resolve, ms));
  },

  async getAvailableProfiles() {
    await this._simulateLatency(100);
    // Gibt eine Liste von Profilen für den Login-Screen zurück
    return Object.values(MockData.users).map(u => ({ id: u.id, name: `${u.name} (${u.role})` }));
  },

  async login(userId) {
    await this._simulateLatency();
    const user = MockData.users[userId];
    if (user) {
      return user;
    } else {
      throw new Error("Benutzerprofil nicht gefunden.");
    }
  },

  async getTeamData() {
    await this._simulateLatency();
    return MockData.team;
  },

  async getFinanceData() {
    await this._simulateLatency();
    return MockData.finances;
  },
  
  async searchWeb(query) {
    await this._simulateLatency(1500); // Websuche dauert länger
    console.log(`WEB SEARCH (SIMULATED) FOR: "${query}"`);
    // Gibt einen Dummy-Text zurück, als hätte man eine Webseite gescannt
    return `
      Simuliertes Suchergebnis für "${query}":
      Die Rondo-Übung '6 gegen 2' ist eine klassische und hocheffektive Methode zur Verbesserung des Passspiels auf engem Raum.
      - **Organisation:** Ein Feld von ca. 15x15 Metern wird mit Hütchen markiert.
      - **Ablauf:** Sechs Spieler positionieren sich an den Außenseiten, zwei Verteidiger versuchen in der Mitte, den Ball zu erobern. Ziel der Außenspieler ist es, mindestens 10 Pässe am Stück zu schaffen.
      - **Coaching-Punkte:** Schnelle Ballverarbeitung, Blickkontakt, 'offener Stand' zum Spielfeld.
    `;
  }
};

// -----------------------------------------------------------------------------
// App - Haupt-Controller
// -----------------------------------------------------------------------------
const App = {
  init() {
    console.log("TONI 2.0 | A-License Edition | Initializing...");
    // Später: UIManager.init(), ArenaEngine.init(), etc.
    
    // Versuchen, eine bestehende Session zu laden
    const sessionUserId = sessionStorage.getItem('toni2_userid');
    if (sessionUserId) {
      this.login(sessionUserId);
    } else {
      this.showLoginScreen();
    }
  },

  async showLoginScreen() {
    const profiles = await ApiService.getAvailableProfiles();
    const select = document.getElementById('username');
    select.innerHTML = profiles.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    
    document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const selectedUserId = document.getElementById('username').value;
        this.login(selectedUserId);
    });

    document.getElementById('system-loader').hidden = true;
    document.getElementById('login-screen').hidden = false;
  },

  async login(userId) {
    const loader = document.getElementById('system-loader');
    const loginScreen = document.getElementById('login-screen');
    const loginError = document.getElementById('login-error');

    loader.hidden = false;
    loginScreen.hidden = true;
    loginError.textContent = '';

    try {
      const user = await ApiService.login(userId);
      AppState.user = user;
      sessionStorage.setItem('toni2_userid', userId); // Session für Reloads speichern
      
      console.log(`User logged in: ${user.name} (${user.role})`);
      this.bootstrap();

    } catch (error) {
      loginError.textContent = error.message;
      loader.hidden = true;
      loginScreen.hidden = false;
    }
  },

  async bootstrap() {
    console.log("Bootstrapping application...");
    // Lade alle notwendigen Daten parallel
    const [teamData, financeData] = await Promise.all([
      ApiService.getTeamData(),
      // Lade Finanzen nur, wenn der Benutzer die Berechtigung hat
      AppState.user.permissions.includes("view_finances") || AppState.user.permissions.includes("*")
       ? ApiService.getFinanceData()
        : Promise.resolve(null)
    ]);

    AppState.team = teamData;
    AppState.finances = financeData;
    
    console.log("Data loaded. Starting UI...");

    // Platzhalter für die nächsten Schritte:
    // UIManager.init();
    // UIManager.showApp();
    // ArenaEngine.init();
    
    // Vorerst zeigen wir nur die geladenen Daten in der Konsole an
    // und verstecken den Loader
    console.log("AppState after bootstrap:", AppState);
    document.getElementById('system-loader').hidden = true;
    document.getElementById('main-app').style.display = 'grid'; // Zeige die App-Struktur
    
    // UI mit Benutzerdaten füllen (Beispiel)
    document.getElementById('user-name').textContent = AppState.user.name;
    document.getElementById('user-role').textContent = AppState.user.role;
    document.getElementById('user-avatar').textContent = AppState.user.avatar;
    if (AppState.user.permissions.includes('*')) {
      document.getElementById('admin-panel-btn').style.display = 'block';
    }
  }
};

// Startet die App, sobald das DOM vollständig geladen ist.
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
<script>
// Fortsetzung von Teil 2

// -----------------------------------------------------------------------------
// MODULE: UIManager - Verwaltet alle DOM-Manipulationen und UI-Events
// -----------------------------------------------------------------------------
const UIManager = {
  elements: {}, // Cache für DOM-Elemente

  init() {
    const ids = [
      'system-loader', 'system-message', 'login-screen', 'login-form', 'login-error', 'username',
      'main-app', 'app-header', 'left-panel', 'main-arena', 'right-panel',
      'user-avatar', 'user-name', 'user-role', 'live-session-btn', 'admin-panel-btn',
      'board-wrap', 'main-canvas', 'arena-controls',
      'toni-chat-header', 'ai-status', 'chat-box', 'chat-form', 'user-cmd',
      'management-hub', 'management-content',
      'magazine-studio', 'magazine-editor',
      'player-dashboard', 'admin-panel-dialog'
    ];
    ids.forEach(id => this.elements[id] = document.getElementById(id));
    
    this.bindEvents();
    console.log("UIManager initialized.");
  },

  bindEvents() {
    // Header-Buttons
    this.elements['live-session-btn'].addEventListener('click', () => ToniAI.toggleLiveSession());
    // Wichtige Navigations-Buttons (werden im linken Panel gerendert)
    // Wir verwenden Event-Delegation auf dem Parent-Panel
    this.elements['left-panel'].addEventListener('click', (e) => {
        const target = e.target.closest('button[data-action]');
        if (!target) return;

        const action = target.dataset.action;
        switch(action) {
            case 'open-management-hub':
                this.openDialog('management-hub');
                this.renderManagementHub();
                break;
            case 'open-magazine-studio':
                this.openDialog('magazine-studio');
                this.renderMagazineStudio();
                break;
            case 'open-player-dashboard':
                const playerId = target.dataset.playerId;
                this.renderPlayerDashboard(playerId);
                break;
        }
    });

    // Admin Panel
    this.elements['admin-panel-btn'].addEventListener('click', () => this.openDialog('admin-panel-dialog'));
    
    // AI Chat
    this.elements['chat-form'].addEventListener('submit', () => ToniAI.processCommand());
  },
  
  // ----- Generelle UI-Updates -----
  showApp() {
    this.elements['main-app'].style.display = 'grid';
    this.updateHeader();
    this.renderLeftPanel();
    // ArenaEngine.setupCanvas(); // wird später hinzugefügt
    // ArenaEngine.render(); // wird später hinzugefügt
    ToniAI.init();
  },

  updateHeader() {
    this.elements['user-name'].textContent = AppState.user.name;
    this.elements['user-role'].textContent = AppState.user.role;
    this.elements['user-avatar'].textContent = AppState.user.avatar;
    if (AppState.user.permissions.includes('*')) {
      this.elements['admin-panel-btn'].style.display = 'block';
    }
  },

  // ----- Dialog / Overlay Management -----
  openDialog(id) {
    this.closeAllDialogs(); // Sicherstellen, dass nur ein Dialog offen ist
    const dialog = this.elements[id];
    if (dialog) {
      dialog.classList.add('is-active');
      AppState.ui.activeOverlay = id;
    }
  },
  
  closeDialog(id) {
    const dialog = this.elements[id];
    if (dialog) {
      dialog.classList.remove('is-active');
      if(AppState.ui.activeOverlay === id) {
          AppState.ui.activeOverlay = null;
      }
    }
  },

  closeAllDialogs() {
    document.querySelectorAll('.dialog-overlay').forEach(d => d.classList.remove('is-active'));
    AppState.ui.activeOverlay = null;
  },

  // ----- Dynamisches Rendering der Inhalte -----
  renderLeftPanel() {

// -----------------------------------------------------------------------------
// MODULE: ToniAI - Steuert den KI-Assistenten und die Live-Session
// -----------------------------------------------------------------------------
const ToniAI = {
  isInitialized: false,
  recognition: null, // Für die Web Speech API

  init() {
    this.elements = UIManager.elements; // Shortcut
    this.updateStatus('online', 'var(--accent-green)');
    this.speak(`System-Status für ${AppState.user.name}: Alle Module geladen. Bereit für Anweisungen.`);
    this.setupSpeechRecognition();
  },

  updateStatus(text, color) {
    this.elements['ai-status'].textContent = `● ${text.toUpperCase()}`;
    this.elements['ai-status'].style.color = color;
  },

  speak(message, isUser = false) {
    const chatBox = this.elements['chat-box'];
    const msgDiv = document.createElement('div');
    msgDiv.style.marginBottom = '12px';
    
    if (isUser) {
        msgDiv.style.textAlign = 'right';
        msgDiv.innerHTML = `<div style="display:inline-block; background:var(--accent-blue); color: #fff; padding:8px 12px; border-radius:12px 12px 0 12px;">${message}</div>`;
    } else {
        msgDiv.innerHTML = `<small style="color:var(--text-secondary); font-weight:bold;">TONI:</small><div style="padding: 4px 0;">${message}</div>`;
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.lang = 'de-DE';
            window.speechSynthesis.speak(utterance);
        }
    }
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  },

  async processCommand(commandOverride = null) {
      const input = this.elements['user-cmd'];
      const command = commandOverride || input.value.trim();
      if (!command) return;
      
      this.speak(command, true);
      if(!commandOverride) input.value = '';

      // *** HIER IST DIE ZENTRALE BEFEHLS-LOGIK ***
      if (command.toLowerCase().includes("suche") || command.toLowerCase().includes("finde")) {
          this.speak("Ich starte eine simulierte Websuche...");
          const result = await ApiService.searchWeb(command);
          this.speak(result);
      } else if (command.toLowerCase().includes("zeichne") || command.toLowerCase().includes("zeige übung")) {
          this.speak("Okay, ich analysiere die Übung und visualisiere sie auf dem Board. (Funktion in ArenaEngine)");
          // ArenaEngine.visualizeExercise(command); // Platzhalter
      } else {
          this.speak("Das habe ich noch nicht gelernt, aber ich leite es an Ollama weiter. (Funktion in Entwicklung)");
      }
  },

  // ----- Live-Session Management -----
  setupSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      console.warn("Web Speech API wird von diesem Browser nicht unterstützt.");
      this.elements['live-session-btn'].disabled = true;
      return;
    }
    this.recognition = new SpeechRecognition();
    this.recognition.continuous = true;
    this.recognition.interimResults = false;
    this.recognition.lang = 'de-DE';

    this.recognition.onresult = (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript.trim();
      this.speak(`Befehl erkannt: "${transcript}"`, true);
      this.processCommand(transcript);
    };
    this.recognition.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        this.updateStatus('error', 'var(--accent-red)');
    };
    this.recognition.onend = () => {
        // Starte die Erkennung neu, wenn sie aktiv sein soll (z.B. bei kurzen Pausen)
        if (AppState.ui.isLiveSession) {
            this.recognition.start();
        }
    };
  },

  toggleLiveSession() {
    if (!this.recognition) return;
    AppState.ui.isLiveSession =!AppState.ui.isLiveSession;
    const btn = this.elements['live-session-btn'];

    if (AppState.ui.isLiveSession) {
      btn.classList.add('active');
      this.recognition.start();
      this.speak("Live-Session gestartet. Ich höre jetzt zu.");
      this.updateStatus('listening', 'var(--accent-red)');
    } else {
      btn.classList.remove('active');
      this.recognition.stop();
      this.speak("Live-Session beendet.");
      this.updateStatus('online', 'var(--accent-green)');
    }
  }
};

<script>

// -----------------------------------------------------------------------------
// MODULE: ArenaEngine - Verwaltet Canvas, Spieler, Zeichnungen, Interaktionen
// -----------------------------------------------------------------------------
const ArenaEngine = {
  canvas: null,
  ctx: null,
  dpr: 1, // Device Pixel Ratio für scharfe Darstellung
  
  isDragging: false,
  dragTarget: null,
  
  // ----- Initialisierung -----
  init() {
    this.canvas = UIManager.elements['main-canvas'];
    this.ctx = this.canvas.getContext('2d');
    this.dpr = window.devicePixelRatio || 1;
    
    this.setupCanvas();
    this.bindCanvasEvents();
    this.renderControls();

    this.Tactic.setFormation('trainer_343'); // Standard-Formation laden
    this.History.saveState(); // Initialen Zustand speichern

    window.addEventListener('resize', () => { this.setupCanvas(); this.render(); });
    console.log("ArenaEngine initialized.");
  },

  setupCanvas() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * this.dpr;
    this.canvas.height = rect.height * this.dpr;
    this.canvas.style.width = `${rect.width}px`;
    this.canvas.style.height = `${rect.height}px`;
    this.ctx.scale(this.dpr, this.dpr);
  },

  renderControls() {
    const tools = [
        { id: 'select', icon: '🖐️', title: 'Auswählen & Verschieben' },
        { id: 'arrow', icon: '→', title: 'Pfeil zeichnen' },
        { id: 'line', icon: '—', title: 'Linie zeichnen' },
        { id: 'zone', icon: '■', title: 'Zone markieren' },
        { id: 'clear', icon: '🗑️', title: 'Alle Zeichnungen löschen' },
    ];
    let html = tools.map(t => `<button class="btn tool-btn" data-tool="${t.id}" title="${t.title}">${t.icon}</button>`).join('');
    html += `<button class="btn tool-btn" id="btn-undo" title="Rückgängig">↩️</button>`;
    html += `<button class="btn tool-btn" id="btn-redo" title="Wiederholen">↪️</button>`;
    UIManager.elements['arena-controls'].innerHTML = html;
    
    // Event Listeners für die neuen Buttons
    UIManager.elements['arena-controls'].addEventListener('click', (e) => {
        const toolBtn = e.target.closest('[data-tool]');
        if (toolBtn) this.setTool(toolBtn.dataset.tool);
        if (e.target.closest('#btn-undo')) this.History.undo();
        if (e.target.closest('#btn-redo')) this.History.redo();
    });
    this.setTool('select'); // Standardwerkzeug
  },

  // ----- Event Handling -----
  bindCanvasEvents() {
    this.canvas.addEventListener('pointerdown', (e) => {
        const pos = this.getCanvasPos(e);
        const player = this.getPlayerAtPos(pos);
        
        if (AppState.ui.activeTool === 'select' && player) {
            this.isDragging = true;
            this.dragTarget = player;
            this.canvas.style.cursor = 'grabbing';
        } else {
            this.Drawing.start(pos);
        }
    });

    this.canvas.addEventListener('pointermove', (e) => {
        const pos = this.getCanvasPos(e);
        if (this.isDragging && this.dragTarget) {
            this.dragTarget.canvas.x = pos.x;
            this.dragTarget.canvas.y = pos.y;
            this.render();
        } else {
            this.Drawing.update(pos);
            if (this.Drawing.current) this.render();
        }
    });

    this.canvas.addEventListener('pointerup', () => {
        if (this.isDragging) {
            this.isDragging = false;
            this.dragTarget = null;
            this.canvas.style.cursor = 'grab';
            this.History.saveState();
        } else {
            this.Drawing.finish();
        }
    });
  },

  getCanvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  },

  getPlayerAtPos(pos) {
    // Finde den obersten Spieler an der Klick-Position
    return Object.values(AppState.team.squad)
     .reverse() // Um von oben nach unten im DOM zu prüfen
     .find(p => Math.hypot(p.canvas.x - pos.x, p.canvas.y - pos.y) < 25);
  },

  // ----- Haupt-Render-Loop -----
  render() {
    requestAnimationFrame(() => {
      const w = this.canvas.clientWidth;
      const h = this.canvas.clientHeight;
      this.ctx.clearRect(0, 0, w, h);
      
      this.drawPitch(w, h);
      this.Drawing.renderAll();
      Object.values(AppState.team.squad).forEach(p => this.drawPlayer(p));
    });
  },

  drawPitch(w, h) {
    //... (komplette Spielfeld-Zeichnungslogik, hier gekürzt)
    this.ctx.fillStyle = '#011a01';
    this.ctx.fillRect(0, 0, w, h);
    this.ctx.strokeStyle = 'rgba(57, 255, 20, 0.2)';
    this.ctx.lineWidth = 2;
    this.ctx.strokeRect(25, 25, w - 50, h - 50); // Außenlinie
    this.ctx.beginPath(); this.ctx.moveTo(w / 2, 25); this.ctx.lineTo(w / 2, h - 25); this.ctx.stroke(); // Mittellinie
    this.ctx.beginPath(); this.ctx.arc(w / 2, h / 2, 70, 0, 2 * Math.PI); this.ctx.stroke(); // Mittelkreis
  },

  drawPlayer(p) {
    const { x, y } = p.canvas;
    const isGk = p.personal.position === 'GK';

    // Puck-Schatten
    this.ctx.beginPath();
    this.ctx.arc(x, y + 2, 20, 0, 2 * Math.PI);
    this.ctx.fillStyle = 'rgba(0,0,0,0.3)';
    this.ctx.fill();

    // Puck
    this.ctx.beginPath();
    this.ctx.arc(x, y, 20, 0, 2 * Math.PI);
    this.ctx.fillStyle = isGk? '#ffae00' : '#006eff';
    this.ctx.fill();
    this.ctx.strokeStyle = '#fff';
    this.ctx.lineWidth = 2;
    this.ctx.stroke();

    // Nummer
    this.ctx.fillStyle = '#fff';
    this.ctx.font = 'bold 18px var(--font-sans)';
    this.ctx.textAlign = 'center';
    this.ctx.textBaseline = 'middle';
    this.ctx.fillText(p.personal.num, x, y);

    // Name
    this.ctx.fillStyle = 'rgba(0,0,0,0.7)';
    this.ctx.roundRect(x - 35, y + 25, 70, 20, 5);
    this.ctx.fill();
    this.ctx.fillStyle = '#fff';
    this.ctx.font = '600 11px var(--font-sans)';
    this.ctx.fillText(p.personal.name, x, y + 35);
  },

  setTool(toolId) {
    if (toolId === 'clear') {
        AppState.drawings = [];
        this.History.saveState();
        this.render();
        ToniAI.speak('Alle Zeichnungen entfernt.');
        return;
    }
    AppState.ui.activeTool = toolId;
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === toolId);
    });
    this.canvas.style.cursor = toolId === 'select'? 'grab' : 'crosshair';
  },

  //... weitere Sub-Module folgen
};

// -----------------------------------------------------------------------------
// SUB-MODULE: ArenaEngine.Drawing - Management der Zeichen-Werkzeuge
// -----------------------------------------------------------------------------
ArenaEngine.Drawing = {
  current: null, // Das Objekt, das gerade gezeichnet wird

  start(pos) {
    if (AppState.ui.activeTool === 'select') return;
    this.current = {
      id: `draw_${Date.now()}`,
      type: AppState.ui.activeTool,
      color: AppState.ui.activeTool === 'zone'? 'rgba(51, 153, 255, 0.2)' : 'rgba(255, 51, 51, 0.9)',
      startX: pos.x, startY: pos.y, endX: pos.x, endY: pos.y
    };
  },
  
  update(pos) {
    if (!this.current) return;
    this.current.endX = pos.x; this.current.endY = pos.y;
  },

  finish() {
    if (!this.current) return;
    if (Math.hypot(this.current.endX - this.current.startX, this.current.endY - this.current.startY) > 10) {
      if (!AppState.drawings) AppState.drawings = [];
      AppState.drawings.push(this.current);
      ArenaEngine.History.saveState();
    }
    this.current = null;
    ArenaEngine.render();
  },

  renderAll() {
    const drawings = AppState.drawings || [];
    drawings.forEach(d => this.drawHelper(d));
    if (this.current) this.drawHelper(this.current); // Zeichne das aktuelle Objekt live
  },

  drawHelper(drawing) {
    const { ctx } = ArenaEngine;
    const { type, color, startX, startY, endX, endY } = drawing;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 4;

    if (type === 'zone') {
        ctx.fillRect(startX, startY, endX - startX, endY - startY);
    } else { // 'arrow' oder 'line'
         ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(endX, endY); ctx.stroke();
        if (type === 'arrow') {
            const angle = Math.atan2(endY - startY, endX - startX);
            ctx.beginPath(); ctx.moveTo(endX, endY);
            ctx.lineTo(endX - 15 * Math.cos(angle - Math.PI / 6), endY - 15 * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - 15 * Math.cos(angle + Math.PI / 6), endY - 15 * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }
    }
  }
};

// -----------------------------------------------------------------------------
// SUB-MODULE: ArenaEngine.History - Undo/Redo Funktionalität
// -----------------------------------------------------------------------------
ArenaEngine.History = {
    past: [], future: [],
    
    saveState() {
        const state = JSON.stringify({
            positions: Object.values(AppState.team.squad).map(p => ({ id: p.id, x: p.canvas.x, y: p.canvas.y })),
            drawings: AppState.drawings || [],
        });
        if (this.past.length > 0 && this.past[this.past.length - 1] === state) return;
        this.past.push(state);
        this.future = [];
        if (this.past.length > 50) this.past.shift();
    },
    
    loadState(stateString) {
        const state = JSON.parse(stateString);
        state.positions.forEach(pos => {
            if (AppState.team.squad[pos.id]) {
                AppState.team.squad[pos.id].canvas.x = pos.x;
                AppState.team.squad[pos.id].canvas.y = pos.y;
            }
        });
        AppState.drawings = state.drawings;
        ArenaEngine.render();
    },

    undo() {
        if (this.past.length <= 1) return;
        this.future.unshift(this.past.pop());
        this.loadState(this.past[this.past.length - 1]);
    },
    redo() {
        if (this.future.length === 0) return;
        const nextState = this.future.shift();
        this.past.push(nextState);
        this.loadState(nextState);
    }
};

    // Logout Button
    content += `<button class="btn" data-action="logout" style="width:100%; margin-top:20px; border-color:var(--accent-red); color:var(--accent-red);">LOGOUT</button>`;

    content += `<h2 style="font-size: 16px; margin: 24px 0 16px 0; border-bottom:1px solid var(--border-color); padding-bottom:12px;">Kader</h2>`;
    content += '<div class="scroll-content" style="max-height: calc(100vh - 350px);">'; // Begrenze Höhe für Scroll
    for (const player of Object.values(AppState.team.squad)) {
        content += `
        <button data-action="open-player-dashboard" data-player-id="${player.id}" style="width:100%; display:flex; align-items:center; gap:12px; margin-bottom:8px; text-align:left;" class="btn">
          <span style="background:var(--bg-dark); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-weight:bold;">${player.personal.num}</span>
          <div>
            <div>${player.personal.name}</div>
            <small class="text-muted">${player.personal.position}</small>
          </div>
          <span style="margin-left:auto; font-size:16px; font-weight:bold;">${player.attributes.overall}</span>
        </button>
      `;
    }
    content += '</div>';
    this.elements['left-panel'].innerHTML = content;
};

UIManager.renderManagementHub = function() { // Überschreibt die alte Funktion
    const { finances } = AppState;
    if (!finances) {
        this.elements['management-content'].innerHTML = `<p class="text-muted">Keine Zugriffsberechtigung auf Finanzdaten.</p>`;
        return;
    }
    const totalCosts = Object.values(finances.costs).reduce((a, b) => a + b, 0);
    const remaining = finances.budget_total - totalCosts;

    this.elements['management-content'].innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <div>
                <h3>Finanzstatus (p.a.)</h3>
                <div style="background: var(--bg-dark); padding: 16px; border-radius: var(--radius-md);">
                    <p>Gesamtbudget: <strong class="text-green">${finances.budget_total.toLocaleString('de-DE')} €</strong></p>
                    <p>Gesamtkosten: <strong class="text-red">${totalCosts.toLocaleString('de-DE')} €</strong></p>
                    <hr style="border-color: var(--border-color);">
                    <p>Liquidität: <strong class="${remaining > 0? 'text-green' : 'text-red'}">${remaining.toLocaleString('de-DE')} €</strong></p>
                </div>
                <h3 style="margin-top:24px;">Sponsoren</h3>
                <div style="background: var(--bg-dark); padding: 16px; border-radius: var(--radius-md);">
                    ${finances.sponsors.map(s => `<p>${s.name}: <strong>${s.contribution.toLocaleString('de-DE')} €</strong> <span class="text-green">(${s.status})</span></p>`).join('')}
                </div>
            </div>
            <div>
                <h3>Kostenstellen</h3>
                <div style="background: var(--bg-dark); padding: 16px; border-radius: var(--radius-md);">
                    <p>Gehälter (Profis): <strong>${finances.costs.salaries_players.toLocaleString('de-DE')} €</strong></p>
                    <p>Gehälter (Stab): <strong>${finances.costs.salaries_staff.toLocaleString('de-DE')} €</strong></p>
                    <p>Infrastruktur: <strong>${finances.costs.infrastructure.toLocaleString('de-DE')} €</strong></p>
                    <p>Nachwuchs (NLZ): <strong>${finances.costs.nlz.toLocaleString('de-DE')} €</strong></p>
                    <p>Reisekosten: <strong>${finances.costs.travel.toLocaleString('de-DE')} €</strong></p>
                </div>
            </div>
        </div>
    `;
};

UIManager.renderPlayerDashboard = function(playerId) { // Überschreibt die alte Funktion
    const player = AppState.team.squad[playerId];
    if (!player) return;

    const dialog = this.elements['player-dashboard'];
    dialog.innerHTML = `
     <div class="dialog-box" style="max-width: 800px;">
        <header class="dialog-header">
            <h2 class="dialog-title">Spieler-Akte: ${player.personal.name} (#${player.personal.num})</h2>
            <button class="btn" onclick="UIManager.closeDialog('player-dashboard')">✕</button>
        </header>
        <div class="dialog-content">
            <div style="display:grid; grid-template-columns: 250px 1fr; gap: 24px;">
                <div>
                    <!-- Hier käme die FIFA-Karte hin -->
                    <div style="background:var(--bg-dark); padding:16px; border-radius:var(--radius-md);">
                        <p><strong>Gesamt: ${player.attributes.overall}</strong></p>
                        <p>PAC: ${player.attributes.pac} | SHO: ${player.attributes.sho}</p>
                        <p>PAS: ${player.attributes.pas} | DRI: ${player.attributes.dri}</p>
                        <p>DEF: ${player.attributes.def} | PHY: ${player.attributes.phy}</p>
                    </div>
                </div>
                <div>
                    <h3>Medizinische Akte</h3>
                    <p>Status: <span class="${player.medical.status === 'fit'? 'text-green' : 'text-red'}">${player.medical.status.toUpperCase()}</span> | Readiness: <strong>${player.medical.readiness}%</strong></p>
                    <h4>Verletzungshistorie:</h4>
                    ${player.medical.history.length > 0? player.medical.history.map(h => `<p>${h.date}: ${h.injury} (${h.duration_days} Tage)</p>`).join('') : '<p class="text-muted">Keine Einträge.</p>'}

                    <h3 style="margin-top:24px;">Vertragsdetails</h3>
                    <p>Gehalt: <strong>${player.contract.salary_monthly.toLocaleString('de-DE')} €</strong> / Monat</p>
                    <p>Gültig bis: <strong>${player.contract.valid_until}</strong></p>
                    <p>Klausel: <span class="text-muted">${player.contract.clause}</span></p>
                </div>
            </div>
        </div>
    </div>`;
    this.openDialog('player-dashboard');
};

UIManager.bindEvents = function() { // Überschreibt die alte Funktion
    this.elements['live-session-btn'].addEventListener('click', () => ToniAI.toggleLiveSession());
    this.elements['left-panel'].addEventListener('click', (e) => {
        const target = e.target.closest('button[data-action]');
        if (!target) return;
        const action = target.dataset.action;
        switch(action) {
            case 'open-management-hub': this.openDialog('management-hub'); this.renderManagementHub(); break;
            case 'open-magazine-studio': this.openDialog('magazine-studio'); this.renderMagazineStudio(); break;
            case 'open-player-dashboard': this.renderPlayerDashboard(target.dataset.playerId); break;
            case 'logout': App.logout(); break;
        }
    });
    this.elements['admin-panel-btn'].addEventListener('click', () => this.openDialog('admin-panel-dialog'));
    this.elements['chat-form'].addEventListener('submit', () => ToniAI.processCommand());
};

// -----------------------------------------------------------------------------
// ERWEITERUNG: ToniAI - Vollständiger Befehls-Dispatcher
// -----------------------------------------------------------------------------
ToniAI.processCommand = async function(commandOverride = null) { // Überschreibt die alte Funktion
    const input = this.elements['user-cmd'];
    const command = (commandOverride || input.value.trim()).toLowerCase();
    if (!command) return;
    
    this.speak(commandOverride || input.value.trim(), true);
    if (!commandOverride) input.value = '';

    // *** ZENTRALER BEFEHLS-DISPATCHER ***
    if (command.includes("suche") || command.includes("finde")) {
        this.speak("Ich starte eine simulierte Websuche...");
        const result = await ApiService.searchWeb(command);
        this.speak(result);
        if (result.toLowerCase().includes("rondo")) {
            ArenaEngine.Tactic.visualizeExercise(result);
        }
    } else if (command.includes("zeige übung") || command.includes("visualisiere")) {
        ArenaEngine.Tactic.visualizeExercise(command);
    } else if (command.includes("management") || command.includes("finanzen")) {
        this.speak("Öffne das Management Cockpit.");
        UIManager.openDialog('management-hub');
        UIManager.renderManagementHub();
    } else if (command.includes("zeitung") || command.includes("magazin")) {
        this.speak("Öffne das Stadionzeitung Studio.");
        UIManager.openDialog('magazine-studio');
        UIManager.renderMagazineStudio();
    } else if (command.includes("rückgängig")) {
        this.speak("Aktion wird zurückgenommen.");
        ArenaEngine.History.undo();
    } else if (command.includes("wiederholen")) {
        this.speak("Aktion wird wiederholt.");
        ArenaEngine.History.redo();
    } else if (command.includes("lösche alles") || command.includes("alles löschen")) {
        this.setTool('clear');
    } else {
        this.speak("Das habe ich nicht verstanden. Mögliche Befehle: 'suche', 'zeige Übung', 'management', 'zeitung', 'rückgängig', 'wiederholen'.");
    }
};

// -----------------------------------------------------------------------------
// ERWEITERUNG: App - Finale Implementierung mit Logout
// -----------------------------------------------------------------------------
App.logout = function() {
    console.log("User logging out...");
    sessionStorage.removeItem('toni2_userid');
    AppState.user = null;
    AppState.team = null;
    AppState.finances = null;
    
    // Verstecke die App, zeige den Login-Screen
    document.getElementById('main-app').style.display = 'none';
    this.showLoginScreen();

    // Stoppe eventuelle Live-Sessions
    if (AppState.ui.isLiveSession) {
        ToniAI.toggleLiveSession();
    }
    UIManager.closeAllDialogs();
};

// Start der App (bleibt unverändert)
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
