<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Titan Ultra v5.7</title>
<style>
  :root {
    --bg: #010401; --neon: #39FF14; --neon-dim: rgba(57, 255, 20, 0.15);
    --glass: rgba(255, 255, 255, 0.08); --red: #ff3333; 
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; }

  .app-container { display: grid; grid-template-columns: 80px 1fr 380px; height: 100vh; padding: 10px; gap: 10px; }
  @media (max-width: 950px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 280px; height: auto; min-height: 100vh; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; padding: 0 10px !important; justify-content: space-around !important; order: 1; border-radius: 12px !important; }
    .center-arena { order: 2; min-height: 480px !important; }
    .right-toni { order: 3; min-height: 320px; }
    .overlay { inset: 8px !important; width: auto !important; padding: 15px !important; border-radius: 15px !important; }
  }

  .left-nav { background: var(--glass); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; }
  .nav-item { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; }

  .center-arena { background: #000; border-radius: 20px; border: 1px solid var(--neon-dim); display: flex; flex-direction: column; padding: 10px; position: relative; overflow: hidden; }
  .arena-header { display: flex; justify-content: space-between; align-items: center; color: var(--neon); font-size: 10px; margin-bottom: 5px; }
  .mode-switch { display: flex; background: #111; border-radius: 8px; padding: 2px; }
  .mode-btn { background: transparent; border: none; color: #555; padding: 5px 12px; cursor: pointer; border-radius: 6px; font-size: 10px; font-weight: bold; }
  .mode-btn.active { background: var(--neon); color: #000; }
  
  canvas { background: #011201; border-radius: 10px; max-width: 100%; height: auto; display: block; box-shadow: 0 0 20px #000; }

  .right-toni { background: var(--glass); border-radius: 20px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .msg { padding: 10px; border-radius: 12px; background: var(--neon-dim); border-left: 3px solid var(--neon); }

  .overlay { position: fixed; top: 20px; left: 100px; right: 410px; bottom: 20px; background: rgba(0, 0, 0, 0.99); border: 2.5px solid var(--neon); border-radius: 20px; z-index: 2000; display: none; flex-direction: column; padding: 20px; backdrop-filter: blur(35px); }
  .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .folder-item { cursor: pointer; padding: 20px; border-radius: 15px; background: rgba(255,255,255,0.03); border: 1.5px solid #333; text-align: center; }
  
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .fifa-card { width: 140px; height: 190px; background: var(--gold); border-radius: 10px; color: #000; position: relative; padding: 8px; font-family: 'Arial Black', sans-serif; cursor: pointer; }
  .status-light { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #000; }

  .gate-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
  .gate-input { background: #000; border: 2px solid var(--neon); color: var(--neon); padding: 15px; border-radius: 10px; text-align: center; font-size: 24px; width: 280px; }
</style>
</head>
<body>

<div id="gate" class="gate-screen">
  <h1 style="color:var(--neon); letter-spacing: 12px; text-shadow: 0 0 25px var(--neon); margin:0;">TONI 2.0</h1>
  <p style="font-size: 10px; opacity: 0.5; letter-spacing: 2px;">ULTRA BUILD v5.7 | FULL FUNCTIONAL</p>
  <input type="password" id="pw" class="gate-input" placeholder="••••">
  <button id="login-trigger" style="background:var(--neon); color:#000; padding:18px 70px; border:none; border-radius:12px; font-weight:bold; cursor:pointer; font-size:16px; margin-top:10px; box-shadow: 0 0 20px var(--neon-dim);">SYSTEM STARTEN</button>
  <p style="font-size: 9px; color: #333; margin-top: 40px;">BYPASS: 1234</p>
</div>

<div class="app-container" id="main-app" style="display:none">
  
  <div class="left-nav">
    <div class="nav-item" id="nav-briefcase" title="Aktentasche">💼</div>
    <div class="nav-item" id="nav-mic" title="Live-Talk">🎙️</div>
    <div style="flex:1"></div>
    <div class="nav-item" id="nav-reset" style="color:var(--red); border-color:var(--red);">🔁</div>
  </div>

  <div class="center-arena">
    <div class="arena-header">
      <div style="display:flex; flex-direction:column;">
        <strong id="club-display">ARENA</strong> 
        <span style="opacity: 0.4; font-size: 9px;">[ ELITE PERFORMANCE ]</span>
      </div>
      <div class="mode-switch">
        <button id="mode-match" class="mode-btn active">MATCH</button>
        <button id="mode-training" class="mode-btn">TRAINING</button>
      </div>
    </div>
    <div id="board-wrap">
      <canvas id="main-canvas" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="font-weight:bold; color:var(--neon); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--glass); padding-bottom: 8px;">
      <span style="font-size: 12px;">TONI AI COMMAND</span>
      <span id="ai-status" style="font-size: 9px; color: var(--neon);">● LIVE</span>
    </div>
    <div class="chat-history" id="chat-box"></div>
    <div style="display:flex; gap:8px; background:rgba(0,0,0,0.3); padding:6px; border-radius:15px; border: 1px solid #333;">
      <input type="text" id="user-cmd" placeholder="Taktik-Problem..." style="flex:1; background:transparent; border:none; color:#fff; padding:8px; outline:none; font-size: 14px;">
      <button id="send-cmd" style="background:none; border:none; color:var(--neon); cursor:pointer; font-size:18px;">➔</button>
    </div>
  </div>
</div>

<div id="hub-ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--neon-dim); padding-bottom:12px;">
    <h2 id="hub-title" style="margin:0; color:var(--neon); font-size: 18px; text-transform:uppercase;">SYSTEM HUB</h2>
    <span id="close-hub-btn" style="cursor:pointer; font-size: 35px; line-height:0.5;">✕</span>
  </div>
  <div class="scroll-content" id="hub-content"></div>

  <div id="p-editor" class="editor-pane">
    <div style="display:flex; gap:10px; margin-bottom:20px; border-bottom: 1px solid #222; padding-bottom: 12px;">
        <button class="mode-btn active" id="tab-sq">IDENTITÄT</button>
        <button class="mode-btn" id="tab-lab">LABOR</button>
        <button class="mode-btn" id="tab-watch">VITAL</button>
    </div>
    <div id="editor-fields" style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;"></div>
    <div style="display:flex; gap:12px; margin-top:25px;">
      <button id="save-player-btn" style="flex:2; background:var(--neon); color:#000; font-weight:bold; padding:15px; border:none; border-radius:12px; cursor:pointer;">DATEN SYNC</button>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d');
  
  let user = JSON.parse(localStorage.getItem('toni57_user')) || null;
  let squad = JSON.parse(localStorage.getItem('toni57_squad')) || [];
  let magPage = 1;
  let activePId = null;

  // --- KADER-INITIALISIERUNG MIT INDIVIDUELLEN BIA-DATEN [cite: 2026-02-07] ---
  if (squad.length === 0) {
    const names = ['Müller','Silva','Schmidt','Schneider','Fischer','Weber','Meyer','Wagner','Becker','Schulz','Hoffmann','Schäfer','Koch','Bauer','Richter','Wolf'];
    const pos = ['ST','ST','IV','IV','RV','LV','ZM','ZM','LM','RM','IV','ZM','RV','LV','LM','ST'];
    
    for (let i = 0; i < 16; i++) {
      squad.push({
        id: Date.now() + i,
        name: names[i],
        rating: 84 + Math.floor(Math.random() * 8),
        pos: pos[i],
        status: i < 11 ? 'match' : (i < 14 ? 'training' : 'absent'),
        x: 75 + (i * 60), y: 635,
        // INDIVIDUELLE DIAGNOSTIK [cite: 2026-02-07]
        weight: names[i] === 'Müller' ? 82.4 : (names[i] === 'Silva' ? 76.2 : 79.5),
        fat: names[i] === 'Müller' ? 10.2 : (names[i] === 'Silva' ? 11.5 : 12.8),
        muscle: names[i] === 'Müller' ? 39.5 : (names[i] === 'Silva' ? 37.1 : 38.0),
        hrv: names[i] === 'Müller' ? 55 : (names[i] === 'Silva' ? 64 : 58),
        bpm: 60, water: 62.1, visceral: 4, sleep: 85
      });
    }
    localStorage.setItem('toni57_squad', JSON.stringify(squad));
  }
  // --- EVENT BINDING (Sicherheits-Layer) ---
  document.getElementById('login-trigger').onclick = unlock;
  document.getElementById('nav-briefcase').onclick = openBriefcase;
  document.getElementById('close-hub-btn').onclick = closeHub;
  document.getElementById('send-cmd').onclick = sendCmd;
  document.getElementById('mode-match').onclick = () => setMode('match');
  document.getElementById('mode-training').onclick = () => setMode('training');
  document.getElementById('nav-reset').onclick = systemReset;

  function unlock() {
    const pw = document.getElementById('pw').value;
    if (pw === '1234') {
      document.getElementById('gate').style.display = 'none';
      if (!user) startOnboarding(); else initApp();
    } else {
      alert("ZUGRIFF VERWEIGERT: Biometrie-Check fehlgeschlagen.");
    }
  }

  function startOnboarding() {
    const name = prompt("Name des Coaches?");
    const club = prompt("Vereinsname?");
    const color = prompt("Vereinsfarbe (z.B. #39FF14)?");
    user = { coach: name || "Coach", club: club || "Elite Senioren", color: color || "#39FF14" };
    localStorage.setItem('toni57_user', JSON.stringify(user));
    initApp();
  }

  function initApp() {
    document.getElementById('main-app').style.display = 'grid';
    document.getElementById('club-display').innerText = user.club.toUpperCase();
    document.documentElement.style.setProperty('--club-color', user.color);
    renderArena();
    toniSpeak(`System v5.7 stabil. Willkommen zurück, Coach ${user.coach}.`);
  }

  // --- AKTENTASCHE: ROUTING & SEKTOREN [cite: 2026-02-07] ---
  function openBriefcase() {
    const content = document.getElementById('hub-content');
    document.getElementById('hub-ov').style.display = 'flex';
    document.getElementById('hub-title').innerText = "MANAGEMENT HUB";
    content.className = "scroll-content folder-grid";
    content.innerHTML = `
      <div class="folder-item" onclick="openSektor('kabine')">👕 <strong>KABINE</strong><br><small>Status & Ampel</small></div>
      <div class="folder-item" onclick="openSektor('analyse')">🧪 <strong>ANALYSE</strong><br><small>BIA-Zentrum</small></div>
      <div class="folder-item" onclick="openSektor('zeitung')">📰 <strong>ZEITUNG</strong><br><small>Stadionmagazin</small></div>
      <div class="folder-item" onclick="openSektor('business')">🤝 <strong>BUSINESS</strong><br><small>Sponsoring</small></div>
    `;
  }

  window.openSektor = function(s) {
    const c = document.getElementById('hub-content');
    c.innerHTML = "";
    if (s === 'kabine') {
      c.className = "scroll-content fifa-grid";
      squad.forEach(p => {
        const light = p.status === 'match' ? 'status-match' : (p.status === 'training' ? 'status-training' : 'status-absent');
        c.innerHTML += `
          <div class="fifa-card" onclick="openEditor(${p.id})">
            <div class="status-light ${light}" onclick="event.stopPropagation(); toggleStatus(${p.id})"></div>
            <div style="font-size:32px; font-weight:bold;">${p.rating}</div>
            <div style="text-align:center; font-size:45px; margin-top:15px;">👤</div>
            <div style="text-align:center; font-weight:bold; margin-top:10px; font-size:14px;">${p.name.toUpperCase()}</div>
            <div style="font-size:10px; text-align:center; opacity:0.7;">POS: ${p.pos}</div>
          </div>`;
      });
    } else if (s === 'analyse') {
      c.innerHTML = "<h3>BIA-DIAGNOSTIK: AKTUELLER KADER [cite: 2026-02-07]</h3>";
      squad.forEach(p => {
        c.innerHTML += `
          <div class="lab-card" style="background:#111; padding:15px; border-radius:12px; border-left:4px solid var(--neon); margin-bottom:12px;">
            <div style="float:right; text-align:right;"><span style="color:var(--neon); font-size:22px; font-weight:bold;">${Math.round(p.sleep/1.2)}%</span><br><small>READINESS</small></div>
            <h4 style="margin:0;">${p.name}</h4>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:12px; margin-top:10px;">
              <span>Fett: <b>${p.fat}%</b></span><span>Muskel: <b>${p.muscle}kg</b></span>
              <span>HRV: <b>${p.hrv}ms</b></span><span>Puls: <b>${p.bpm}bpm</b></span>
            </div>
          </div>`;
      });
    } else if (s === 'zeitung') {
      renderMag();
    } else if (s === 'business') {
      c.innerHTML = `<h3>SPONSORING & PARTNER [cite: 2026-02-07]</h3>
        <p>Aktuelle Akquise für das Stadionumfeld Bad Hersfeld läuft.</p>
        <div class="lab-card"><b>Lokal-Sponsor A</b>: Status - Verhandlung</div>`;
    }
  };

  function renderMag() {
    const c = document.getElementById('hub-content');
    const pgs = [
      "<h1>SENIOR PRO NEWS</h1><p>Analyse des letzten Spieltags: Die 4-4-2 Kette stand stabil.</p>",
      "<h1>TRAINER-ECKE</h1><p>Warum wir heute auf das 3-4-3 setzen. Fokus auf Umschaltspiel.</p>",
      "<h1>BIO-REPORT</h1><p>Durchschnittliche Team-Fitness: 88%. Silva führt die HRV-Liste an.</p>",
      "<h1>PARTNER</h1><p>Dank an unsere Sponsoren für die Erweiterung des Analysezentrums.</p>"
    ];
    c.innerHTML = `
      <div style="background:#fff; color:#000; padding:30px; border-radius:10px; min-height:450px;">
        ${pgs[magPage-1]}
        <div style="margin-top:50px; display:flex; justify-content:space-between; align-items:center;">
          <button class="mode-btn active" style="background:#000; color:#fff;" onclick="if(magPage>1){magPage--; renderMag();}">ZURÜCK</button>
          <span style="font-weight:bold; color:#000;">Seite ${magPage} / 4</span>
          <button class="mode-btn active" style="background:#000; color:#fff;" onclick="if(magPage<4){magPage++; renderMag();}">WEITER</button>
        </div>
      </div>`;
  }
  // --- ARENA ENGINE: PITCH DRAWING [cite: 2026-02-09] ---
  function drawPitch() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#011801'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.4)';
    ctx.lineWidth = 3;

    // Spielfeld-Linien (Pro-Maßstab)
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 180);
    ctx.beginPath(); 
    ctx.moveTo(canvas.width / 2, 40); 
    ctx.lineTo(canvas.width / 2, canvas.height - 140); 
    ctx.stroke();
    
    // Mittelkreis & Anstoßpunkt
    ctx.beginPath(); 
    ctx.arc(canvas.width / 2, (canvas.height - 100) / 2, 85, 0, Math.PI * 2); 
    ctx.stroke();

    // Strafräume (Senioren-Standard)
    ctx.strokeRect(40, canvas.height / 2 - 160, 130, 320); 
    ctx.strokeRect(canvas.width - 170, canvas.height / 2 - 160, 130, 320);
    
    // Ersatzbank-Bereich [cite: 2026-02-09]
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, canvas.height - 135, canvas.width, 135);
    ctx.strokeStyle = '#39FF14';
    ctx.setLineDash([8, 5]);
    ctx.strokeRect(10, canvas.height - 128, canvas.width - 20, 120);
    ctx.setLineDash([]);
  }

  function renderArena() {
    drawPitch();
    squad.forEach(p => {
      if (p.status === 'absent') return;
      if (p.y < canvas.height - 135) {
        // Spieler auf dem Feld (Taktik-Punkt)
        ctx.shadowBlur = 15; ctx.shadowColor = user.color;
        ctx.fillStyle = user.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 23, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
        ctx.fillText(p.name[0], p.x, p.y + 5);
        ctx.fillStyle = '#fff'; ctx.font = '10px Arial';
        ctx.fillText(p.name, p.x, p.y + 42);
      } else {
        // Spieler auf der Bank (FIFA-Karten Optik) [cite: 2026-02-09]
        ctx.fillStyle = '#bf953f'; 
        ctx.fillRect(p.x - 24, p.y - 32, 48, 64);
        ctx.fillStyle = '#000'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y + 24);
        ctx.font = 'bold 12px Arial'; ctx.fillText(p.rating, p.x - 14, p.y - 18);
      }
    });
  }

  // --- TAKTIK-LOGIK: 4-4-2 (TONI) vs 3-4-3 (TRAINER) [cite: 2026-02-07] ---
  function setMode(m) {
    document.getElementById('mode-match').classList.toggle('active', m === 'match');
    document.getElementById('mode-training').classList.toggle('active', m === 'training');
    
    if (m === 'match') {
      toniSpeak("Taktik-Check: Toni stellt 4-4-2, Coach stellt 3-4-3.");
      const activePlayers = squad.filter(p => p.status === 'match');
      activePlayers.forEach((p, i) => {
        // Beispiel-Verteilung für die 3-4-3 Trainer-Mannschaft
        const trainerCoords = [
          {x:100,y:350}, // TW
          {x:250,y:150}, {x:250,y:350}, {x:250,y:550}, // 3er Abwehr
          {x:450,y:100}, {x:450,y:260}, {x:450,y:440}, {x:450,y:600}, // 4er Mittelfeld
          {x:700,y:150}, {x:700,y:350}, {x:700,y:550} // 3er Sturm
        ];
        if (trainerCoords[i]) {
          p.x = trainerCoords[i].x; p.y = trainerCoords[i].y;
        }
      });
    } else {
      toniSpeak("Alle Spieler rücken zur Analyse auf die Bank aus.");
      squad.forEach((p, i) => { p.x = 75 + (i * 60); p.y = 635; });
    }
    renderArena();
  }

  // --- EDITOR-FUNKTIONEN ---
  window.openEditor = function(id) {
    activePId = id;
    const p = squad.find(x => x.id === id);
    document.getElementById('p-editor').style.display = 'block';
    setEditTab('sq');
  };

  window.setEditTab = function(tab) {
    const f = document.getElementById('editor-fields');
    const p = squad.find(x => x.id === activePId);
    f.innerHTML = tab === 'sq' ? 
      `<div style="grid-column: span 2;">Name: <input id="en" value="${p.name}" style="width:100%; padding:8px;"></div>` :
      `<div>Fett%: <input id="ef" type="number" value="${p.fat}"></div><div>HRV: <input id="eh" type="number" value="${p.hrv}"></div>`;
  };

  document.getElementById('save-player-btn').onclick = function() {
    const p = squad.find(x => x.id === activePId);
    if(document.getElementById('en')) p.name = document.getElementById('en').value;
    if(document.getElementById('ef')) p.fat = document.getElementById('ef').value;
    saveSquad();
    document.getElementById('p-editor').style.display = 'none';
    openSektor('kabine'); renderArena();
    toniSpeak("Daten für " + p.name + " aktualisiert.");
  };

  window.toggleStatus = function(id) {
    const p = squad.find(x => x.id === id);
    if (p.status === 'match') p.status = 'training';
    else if (p.status === 'training') p.status = 'absent';
    else p.status = 'match';
    saveSquad(); openSektor('kabine'); renderArena();
  };

  // --- TOUCH & DRAG LOGIK (MOBILE OPTIMIZED) [cite: 2026-02-09] ---
  let isDragging = false; let dragTarget = null;
  const getPos = (e) => {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
  };

  canvas.onmousedown = canvas.ontouchstart = (e) => {
    const p = getPos(e);
    dragTarget = squad.find(s => Math.hypot(s.x - p.x, s.y - p.y) < 35);
    if (dragTarget) isDragging = true;
  };

  canvas.onmousemove = canvas.ontouchmove = (e) => {
    if (isDragging && dragTarget) {
      const p = getPos(e);
      dragTarget.x = p.x; dragTarget.y = p.y;
      renderArena();
      e.preventDefault();
    }
  };

  window.onmouseup = window.ontouchend = () => { isDragging = false; dragTarget = null; saveSquad(); };

  // --- AI INTERACTION ---
  window.toniSpeak = function(t) {
    const b = document.getElementById('chat-box');
    b.innerHTML += `<div class="msg ai">Toni: ${t}</div>`;
    b.scrollTop = b.scrollHeight;
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
  };

  function sendCmd() {
    const i = document.getElementById('user-cmd');
    if (!i.value) return;
    toniSpeak("Analysiere: " + i.value);
    i.value = "";
  }

  function saveSquad() { localStorage.setItem('toni57_squad', JSON.stringify(squad)); }
  function closeHub() { document.getElementById('hub-ov').style.display = 'none'; }
  window.systemReset = function() { if(confirm("Daten löschen?")) { localStorage.clear(); location.reload(); } };

})();
</script>
</body>
</html>
