<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Intelligence Pro - Björn</title>
    <style>
        :root { --pitch: #2d5a27; --stripe: #254d21; --line: rgba(255,255,255,0.7); }
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; color: #fff; }
        
        #api-bar { background: #111; padding: 10px; text-align: center; border-bottom: 1px solid #333; font-size: 13px; }
        #nav { background: #1a1a1a; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 2px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        #pitch-wrapper { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; padding: 10px; }
        #pitch { 
            width: 100%; height: 100%; max-width: 1100px; background: var(--pitch); border: 3px solid #fff; position: relative;
            background-image: repeating-linear-gradient(0deg, var(--pitch), var(--pitch) 10%, var(--stripe) 10%, var(--stripe) 20%);
        }
        .mid-line { position: absolute; width: 100%; height: 2px; background: var(--line); top: 50%; left: 0; }
        .center-circle { width: 100px; height: 100px; border: 2px solid var(--line); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.1); z-index: 5; }
        .goal-std { width: 90px; height: 25px; left: 50%; transform: translateX(-50%); }
        .goal-fun { width: 50px; height: 18px; }

        .player { 
            width: 32px; height: 32px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px; cursor: grab; z-index: 50;
            border: 2px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.5); touch-action: none;
        }
        .red { background: #b71c1c; }
        .blue { background: #0d47a1; }
        .ball { width: 18px; height: 18px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; transition: all 0.8s ease; }

        #chat { height: 300px; background: #fff; color: #000; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; background: #f9f9f9; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 6px; }
        .msg-ai { background: #e8f5e9; border-left: 5px solid #2e7d32; }
        .msg-user { background: #e3f2fd; border-right: 5px solid #1565c0; text-align: right; }

        #input-row { padding: 15px; background: #eee; display: flex; gap: 10px; border-top: 1px solid #ccc; }
        #user-in { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; color: #000; }
        #send-btn { background: #2e7d32; color: white; border: none; padding: 0 25px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body onclick="startVoice()">

<div id="api-bar">
    <span id="api-status" style="color:red">KI-Status: Inaktiv</span> | 
    <span onclick="setKey()" style="color:#00ff88; cursor:pointer; text-decoration:underline">[ Hier klicken: API-Key eingeben ]</span>
</div>

<div id="nav">
    <button class="btn" onclick="setMode('funino')">Funino (4 Tore)</button>
    <button class="btn" onclick="setMode('11v11')">11 gegen 11</button>
    <button class="btn" onclick="resetBall()">Ball Mitte</button>
</div>

<div id="pitch-wrapper">
    <div id="pitch">
        <div class="mid-line"></div>
        <div class="center-circle"></div>
        <div id="ball" class="player ball" style="top: 48%; left: 49%;"></div>
        <div id="p-layer"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="user-in" placeholder="Anweisung an Coach Björn...">
        <button id="send-btn" onclick="send()">Senden</button>
    </div>
</div>

<script>
    const layer = document.getElementById('p-layer'), log = document.getElementById('log'), input = document.getElementById('user-in'), ball = document.getElementById('ball');
    let myKey = localStorage.getItem('tactics_key_bjorn')?.trim() || "";

    if(myKey) {
        document.getElementById('api-status').innerText = "KI-Status: Bereit";
        document.getElementById('api-status').style.color = "#00ff88";
    }

    function setKey() {
        const k = prompt("Bitte Google API-Key einfügen:");
        if(k) { localStorage.setItem('tactics_key_bjorn', k.trim()); location.reload(); }
    }

    function addLog(who, txt, isAi) {
        const d = document.createElement('div');
        d.className = 'msg ' + (isAi ? 'msg-ai' : 'msg-user');
        d.innerHTML = `<strong>${who}:</strong> ${txt}`;
        log.appendChild(d); log.scrollTop = log.scrollHeight;
        if(isAi && window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(txt.replace(/\[.*?\]/g, ''));
            m.lang = 'de-DE'; window.speechSynthesis.speak(m);
        }
    }

    function createP(t, l, c, n) {
        const p = document.createElement('div');
        p.className = 'player ' + c; p.style.top = t + "%"; p.style.left = l + "%";
        p.innerText = n; layer.appendChild(p);
    }

    function setMode(m) {
        layer.innerHTML = ""; document.querySelectorAll('.goal').forEach(g => g.remove());
        if(m === 'funino') {
            const goals = [{t:0,l:20},{t:0,l:75},{t:97,l:20},{t:97,l:75}];
            goals.forEach(pos => {
                const g = document.createElement('div'); g.className = 'goal goal-fun';
                g.style.top = pos.t + "%"; g.style.left = pos.l + "%"; document.getElementById('pitch').appendChild(g);
            });
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
            addLog("Co-Trainer", "Funino-Modus aktiv. 4 Tore, 3 gegen 3.", true);
        } else {
            const g1 = document.createElement('div'); g1.className = 'goal goal-std'; g1.style.top = "0"; g1.style.left = "50%"; document.getElementById('pitch').appendChild(g1);
            const g2 = document.createElement('div'); g2.className = 'goal goal-std'; g2.style.top = "97.5%"; g2.style.left = "50%"; document.getElementById('pitch').appendChild(g2);
            const r = [{t:88,l:48},{t:75,l:15},{t:78,l:35},{t:78,l:62},{t:75,l:82},{t:58,l:20},{t:62,l:40},{t:62,l:58},{t:58,l:78},{t:42,l:42},{t:42,l:54}];
            const b = [{t:10,l:48},{t:22,l:20},{t:18,l:48},{t:22,l:78},{t:38,l:15},{t:42,l:38},{t:42,l:58},{t:38,l:82},{t:55,l:30},{t:55,l:68}];
            r.forEach((p, i) => createP(p.t, p.l, 'red', i+1)); b.forEach((p, i) => createP(p.t, p.l, 'blue', i+1));
            addLog("Co-Trainer", "11 gegen 11 Match-Modus bereit.", true);
        }
        initDrag();
    }

    async function send() {
        const val = input.value; if(!val) return;
        addLog("Björn", val, false); input.value = "";
        if(!myKey) { addLog("Co-Trainer", "Bitte API-Key eingeben!", true); return; }

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${myKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist ein Fußball-Co-Trainer. Antworte kurz. Bewege den Ball mit [BALL:X:Y]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            if(d.error) { addLog("Co-Trainer", "Fehler: " + d.error.message, true); }
            else {
                let txt = d.candidates[0].content.parts[0].text;
                const bM = txt.match(/\[BALL:(\d+):(\d+)\]/);
                if(bM) { ball.style.left = bM[1] + "%"; ball.style.top = bM[2] + "%"; }
                addLog("Co-Trainer", txt, true);
            }
        } catch(e) { addLog("Co-Trainer", "Verbindungsfehler zur KI.", true); }
    }

    function resetBall() { ball.style.top = "48%"; ball.style.left = "49.2%"; }
    function startVoice() {}
    function initDrag() {
        document.querySelectorAll('.player').forEach(p => {
            let drg = false;
            p.onmousedown = p.ontouchstart = (e) => { drg = true; p.style.transition = "none"; e.preventDefault(); };
            window.onmousemove = window.ontouchmove = (e) => {
                if(!drg) return;
                const r = document.getElementById('pitch').getBoundingClientRect();
                const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
                const y = (e.
