<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktikboard Pro - Coach Björn</title>
    <style>
        :root { --pitch: #2d5a27; --stripe: #254d21; --line: rgba(255,255,255,0.8); }
        * { box-sizing: border-box; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; color: #fff; }
        
        #top-nav { background: #1a1a1a; padding: 12px; display: flex; justify-content: center; gap: 15px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        .btn:hover { background: #444; border-color: #00ff88; }
        .key-btn { border-color: #00ff88; color: #00ff88; }

        #pitch-area { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; padding: 15px; }
        #pitch { 
            width: 100%; height: 100%; max-width: 1100px; background: var(--pitch); border: 4px solid #fff; position: relative;
            background-image: repeating-linear-gradient(0deg, var(--pitch), var(--pitch) 10%, var(--stripe) 10%, var(--stripe) 20%);
        }
        .mid-line { position: absolute; width: 100%; height: 2px; background: var(--line); top: 50%; left: 0; }
        .center-circle { width: 100px; height: 100px; border: 2px solid var(--line); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        /* Tore */
        .goal { position: absolute; border: 3px solid white; background: rgba(255,255,255,0.2); z-index: 5; }
        .goal-std { width: 100px; height: 30px; left: 50%; transform: translateX(-50%); }
        .goal-fun { width: 50px; height: 20px; }

        .player { 
            width: 32px; height: 32px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 13px; cursor: move; z-index: 50;
            border: 2px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.4); touch-action: none;
        }
        .red { background: #b71c1c; color: white; }
        .blue { background: #0d47a1; color: white; }
        .ball { width: 20px; height: 20px; background: #fff; border: 2px solid #000; z-index: 100; border-radius: 50%; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        #chat-section { height: 250px; background: #fff; color: #000; display: flex; flex-direction: column; border-top: 4px solid #333; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 15px; background: #f4f4f4; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; line-height: 1.4; }
        .msg-ai { background: #e8f5e9; border-left: 5px solid #2e7d32; }
        .msg-user { background: #e3f2fd; border-right: 5px solid #1565c0; text-align: right; }

        #input-box { padding: 12px; background: #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 2px solid #ccc; font-size: 16px; outline: none; }
        input:focus { border-color: #2e7d32; }
        .send-btn { background: #2e7d32; color: white; border: none; padding: 0 25px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="top-nav">
    <button class="btn" onclick="initField('11v11')">11 gegen 11</button>
    <button class="btn" onclick="initField('funino')">Funino (3v3)</button>
    <button class="btn key-btn" onclick="promptKey()">🔑 API Key</button>
</div>

<div id="pitch-area">
    <div id="pitch" id="pitch-canvas">
        <div class="mid-line"></div>
        <div class="center-circle"></div>
        <div id="goal-layer"></div>
        <div id="ball" class="player ball" style="top: 48%; left: 49%;"></div>
        <div id="player-layer"></div>
    </div>
</div>

<div id="chat-section">
    <div id="log"></div>
    <div id="input-box">
        <input type="text" id="user-input" placeholder="Anweisung an den Co-Trainer...">
        <button class="send-btn" onclick="sendMessage()">SENDEN</button>
    </div>
</div>

<script>
    const pLayer = document.getElementById('player-layer'), gLayer = document.getElementById('goal-layer'), log = document.getElementById('log'), input = document.getElementById('user-input'), ball = document.getElementById('ball');
    let apiKey = localStorage.getItem('bjorn_pro_key') || "";

    function promptKey() {
        const k = prompt("Bitte Google API-Key einfügen:");
        if(k) { localStorage.setItem('bjorn_pro_key', k.trim()); location.reload(); }
    }

    function addLog(who, text, isAi) {
        const div = document.createElement('div');
        div.className = 'msg ' + (isAi ? 'msg-ai' : 'msg-user');
        div.innerHTML = `<strong>${who}:</strong> ${text}`;
        log.appendChild(div); log.scrollTop = log.scrollHeight;
    }

    function createPlayer(t, l, team, num) {
        const p = document.createElement('div');
        p.className = `player ${team}`; p.style.top = t + "%"; p.style.left = l + "%";
        p.innerText = num; pLayer.appendChild(p);
        setupDraggable(p);
    }

    function addGoal(t, l, type) {
        const g = document.createElement('div');
        g.className = `goal ${type}`; g.style.top = t + "%"; g.style.left = l + "%";
        gLayer.appendChild(g);
    }

    function initField(mode) {
        pLayer.innerHTML = ""; gLayer.innerHTML = "";
        if(mode === '11v11') {
            // Standard Tore
            addGoal(0, 50, 'goal-std'); addGoal(97, 50, 'goal-std');
            // 22 Spieler
            const reds = [{t:88,l:48},{t:78,l:15},{t:78,l:35},{t:78,l:62},{t:78,l:82},{t:62,l:20},{t:62,l:40},{t:62,l:58},{t:62,l:78},{t:45,l:42},{t:45,l:54}];
            const blues = [{t:10,l:48},{t:20,l:15},{t:20,l:35},{t:20,l:62},{t:20,l:82},{t:35,l:20},{t:35,l:40},{t:35,l:58},{t:35,l:78},{t:52,l:42},{t:52,l:54}];
            reds.forEach((p, i) => createPlayer(p.t, p.l, 'red', i+1));
            blues.forEach((p, i) => createPlayer(p.t, p.l, 'blue', i+1));
        } else {
            // Funino: 4 Tore
            addGoal(0, 20, 'goal-fun'); addGoal(0, 75, 'goal-fun');
            addGoal(97.5, 20, 'goal-fun'); addGoal(97.5, 75, 'goal-fun');
            // 3 gegen 3
            for(let i=0; i<3; i++) {
                createPlayer(75, 25 + i*25, 'red', i+1);
                createPlayer(20, 25 + i*25, 'blue', i+1);
            }
        }
    }

    async function sendMessage() {
        const val = input.value; if(!val) return;
        addLog("Trainer Björn", val, false); input.value = "";
        if(!apiKey) { addLog("System", "Fehler: Kein API-Key hinterlegt!", true); return; }

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist Co-Trainer. Antworte kurz. Steuerung: [BALL:X:Y]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            const txt = d.candidates[0].content.parts[0].text;
            addLog("Co-Trainer", txt, true);
            const bM = txt.match(/\[BALL:(\d+):(\d+)\]/);
            if(bM) { ball.style.left = bM[1]+"%"; ball.style.top = bM[2]+"%"; }
        } catch(e) { addLog("System", "Verbindung zur KI fehlgeschlagen. Key prüfen!", true); }
    }

    function setupDraggable(el) {
        let dragging = false;
        el.onmousedown = el.ontouchstart = (e) => { dragging = true; el.style.transition = "none"; };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!dragging) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
            el.style.left = (x/r.width*100)-1.5 + "%"; el.style.top = (y/r.height*100)-1.5 + "%";
        };
        window.onmouseup = window.ontouchend = () => { dragging = false; el.style.transition = "all 0.5s ease"; };
    }

    setupDraggable(ball);
    input.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    window.onload = () => initField('11v11');
</script>
</body>
</html>
