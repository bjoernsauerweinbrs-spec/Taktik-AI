<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Intelligence Pro - Björn</title>
    <style>
        :root { --pitch: #2d5a27; --stripe: #254d21; }
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; color: #fff; }
        
        #api-bar { background: #111; padding: 6px; text-align: center; font-size: 11px; border-bottom: 1px solid #333; }
        #nav { background: #1a1a1a; padding: 12px; display: flex; justify-content: center; gap: 10px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .btn:hover { background: #00ff88; color: #000; }

        #pitch-container { flex: 2; position: relative; display: flex; justify-content: center; align-items: center; padding: 10px; background: #000; }
        #pitch { 
            width: 100%; height: 100%; max-width: 1100px; background: var(--pitch); border: 3px solid #fff; position: relative;
            background-image: repeating-linear-gradient(0deg, var(--pitch), var(--pitch) 10%, var(--stripe) 10%, var(--stripe) 20%);
        }
        .center-circle { width: 100px; height: 100px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .player { 
            width: 30px; height: 30px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 11px; cursor: grab; z-index: 50;
            border: 2px solid #fff; transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); touch-action: none;
        }
        .red { background: #b71c1c; }
        .blue { background: #0d47a1; }
        .ball { width: 18px; height: 18px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; transition: all 0.8s ease-in-out; }

        #chat { height: 35%; background: #fff; color: #000; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 15px; background: #f9f9f9; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 6px; border-left: 5px solid transparent; }
        .ai { background: #f0f0f0; border-left-color: #2e7d32; }
        .user { background: #e3f2fd; border-right: 5px solid #1565c0; text-align: right; border-left: none; }

        #input-row { padding: 12px; background: #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; outline: none; }
    </style>
</head>
<body onclick="startAudio()">

<div id="api-bar">
    <span id="api-status">Simulation lokal</span> | 
    <a href="#" style="color: #00ff88; text-decoration: none;" onclick="setKey()">[ API-Key neu eingeben ]</a>
</div>

<div id="nav">
    <button class="btn" onclick="setMode('funino')">Funino (3v3)</button>
    <button class="btn" onclick="setMode('11v11')">Match (11v11)</button>
    <button class="btn" onclick="resetBall()">Ball Mitte</button>
</div>

<div id="pitch-container">
    <div id="pitch">
        <div class="center-circle"></div>
        <div id="ball" class="player ball" style="top: 48%; left: 49%;"></div>
        <div id="player-layer"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="user-input" placeholder="Anfrage an Co-Trainer Björn...">
        <button style="padding:10px" onclick="process()">➤</button>
    </div>
</div>

<script>
    const layer = document.getElementById('player-layer');
    const log = document.getElementById('log');
    const input = document.getElementById('user-input');
    const ball = document.getElementById('ball');

    let voice = null;
    let apiKey = localStorage.getItem('tactical_key')?.trim() || "";

    function setKey() {
        const k = prompt("Gemini API Key einfügen:");
        if(k) { localStorage.setItem('tactical_key', k.trim()); location.reload(); }
    }
    if(apiKey) document.getElementById('api-status').innerText = "KI-Power aktiv (Key gespeichert)";

    function startAudio() {
        if(voice) return;
        const vs = window.speechSynthesis.getVoices();
        voice = vs.find(v => v.lang.startsWith('de') && (v.name.includes('Stefan') || v.name.includes('Markus'))) || vs[0];
    }

    function addLog(who, t, isAi) {
        const d = document.createElement('div');
        d.className = 'msg ' + (isAi ? 'ai' : 'user');
        d.innerHTML = `<b>${who}:</b> ${t}`;
        log.appendChild(d); log.scrollTop = log.scrollHeight;
        if(isAi && window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(t.replace(/\[.*?\]/g, ''));
            if(voice) m.voice = voice;
            m.pitch = 0.8; m.rate = 0.95;
            window.speechSynthesis.speak(m);
        }
    }

    function createP(t, l, c, n) {
        const p = document.createElement('div');
        p.className = `player ${c}`;
        p.style.top = t + "%"; p.style.left = l + "%";
        p.setAttribute('data-base-l', l);
        p.innerText = n;
        layer.appendChild(p);
    }

    function shift(ballX) {
        document.querySelectorAll('.red').forEach(p => {
            let bL = parseFloat(p.getAttribute('data-base-l'));
            p.style.left = (bL + (ballX - 49) * 0.35) + "%";
        });
    }

    function setMode(m) {
        layer.innerHTML = "";
        if(m === 'funino') {
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
            addLog("Co-Trainer", "Funino-Formation steht.", true);
        } else {
            const h = [{t:90,l:47},{t:78,l:15},{t:80,l:35},{t:80,l:60},{t:78,l:80},{t:62,l:15},{t:65,l:35},{t:65,l:60},{t:62,l:80},{t:42,l:40},{t:42,l:55}];
            const a = [{t:10,l:47},{t:25,l:20},{t:25,l:75},{t:45,l:15},{t:45,l:40},{t:45,l:60},{t:45,l:85},{t:60,l:30},{t:60,l:50},{t:60,l:70}];
            h.forEach((p, i) => createP(p.t, p.l, 'red', i+1));
            a.forEach((p, i) => createP(p.t, p.l, 'blue', i+1));
            addLog("Co-Trainer", "11 gegen 11 Match-Modus aktiv.", true);
        }
        initDrag();
    }

    function resetBall() { ball.style.left = "49%"; ball.style.top = "48%"; shift(49); }

    async function process() {
        const val = input.value; if(!val) return;
        addLog("Björn", val, false);
        input.value = "";
        
        if(!apiKey) {
            addLog("Co-Trainer", "Kein API-Key gefunden. Bitte oben eingeben.", true);
            return;
        }

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist ein Fußball-Co-Trainer. Björn ist der Chef. Antworte kurz und fachlich. Codes: [BALL:RECHTS], [BALL:LINKS]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            
            if (d.error) {
                addLog("Co-Trainer", "Fehler von Google: " + d.error.message, true);
            } else {
                let resp = d.candidates[0].content.parts[0].text;
                if(resp.includes("[BALL:RECHTS]")) { ball.style.left = "85%"; shift(85); }
                if(resp.includes("[BALL:LINKS]")) { ball.style.left = "15%"; shift(15); }
                addLog("Co-Trainer", resp, true);
            }
        } catch(e) { 
            addLog("Co-Trainer", "Verbindung fehlgeschlagen. Internet ok?", true);
        }
    }

    function initDrag() {
        document.querySelectorAll('.player').forEach(p => {
            let d = false;
            p.onmousedown = p.ontouchstart = (e) => { d = true; p.style.transition = "none"; e.preventDefault(); };
            window.onmousemove = window.ontouchmove = (e) => {
                if(!d) return;
                const r = document.getElementById('pitch').getBoundingClientRect();
                const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
                const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
                p.style.left = (x/r.width*100)-3 + "%"; p.style.top = (y/r.height*100)-3 + "%";
            };
            window.onmouseup = window.ontouchend = () => { d = false; p.style.transition = "all 1.2s ease"; };
        });
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') process(); };
    window.onload = () => { setMode('11v11'); };
</script>
</body>
</html>
