<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | NEURAL CLUB ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div id="auth-layer">
        <div class="login-terminal">
            <div class="luxury-logo" style="font-size: 40px; margin-bottom: 20px;">TONI 2.0</div>
            <p style="font-family: var(--font-ui); color: #444;">AGENCY ACCESS</p>
            <input type="password" id="passkey" class="auth-input" placeholder="ACCESS CODE" autocomplete="off">
            <button class="btn-main" onclick="bootSystem()" style="margin-top:20px;">INITIALISIEREN</button>
        </div>
    </div>

    <div id="app-interface" class="hidden">
        <header id="top-bar">
            <div class="app-brand"><span class="luxury-logo">TONI 2.0</span></div>
            <div id="clock-display">00:00:00</div>
            <div style="display:flex; gap:25px; align-items:center;">
                <div style="font-family: var(--font-ui); color: var(--neon-gold); font-size: 14px;"><i class="fa-solid fa-vault"></i> <span id="budget-display">0 €</span></div>
                <button onclick="toggleSettings()" style="color:#444;"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <div style="display:flex; height: calc(100vh - 60px);">
            <nav class="nav-sidebar">
                <div class="nav-group-title">COMMAND</div>
                <button class="nav-item active" onclick="loadModule('tactics')"><i class="fa-solid fa-compass-drafting"></i> TACTICAL CO-PILOT</button>
                <button class="nav-item" onclick="loadModule('manager')"><i class="fa-solid fa-chart-line"></i> FINANCIAL ENGINE</button>
                <div class="nav-group-title">INFRASTRUCTURE</div>
                <button class="nav-item" onclick="loadModule('nlz')"><i class="fa-solid fa-address-card"></i> ACADEMY HUB (NLZ)</button>
                <button class="nav-item" onclick="loadModule('press')"><i class="fa-solid fa-newspaper"></i> PRESS BUREAU</button>
            </nav>

            <main id="stage-content" style="flex:1; overflow:hidden;"></main>

            <aside id="tools-sidebar">
                <div class="nav-group-title">AI REPORTER // LIVE-DESK</div>
                <div id="ai-log" style="flex:1; padding:20px; font-size:13px; color:#aaa; overflow-y:auto; line-height: 1.6;">
                    <div class="ai-message">System online. <br><br>Klicken Sie unten auf "Briefing starten", um die Recherche für die neue Stadionzeitung zu beginnen.</div>
                </div>
                <div style="padding:20px; border-top:1px solid #222; background:#080808;">
                    <div id="interview-controls" class="hidden">
                        <input type="text" id="ai-chat-input" class="auth-input" style="text-align:left; font-size:12px; margin-bottom:10px; padding:10px;" placeholder="Antwort eingeben...">
                        <button class="btn-main" onclick="processInterviewStep()" style="font-size:10px; padding:10px;">SENDEN</button>
                    </div>
                    <button id="btn-start-briefing" class="btn-main" onclick="startAIBriefing()"><i class="fa-solid fa-play"></i> BRIEFING STARTEN</button>
                </div>
            </aside>
        </div>
    </div>

    <div id="modal-bio" class="modal-overlay hidden"><div class="modal-window" style="width: 900px; max-height: 90vh;"><div id="bio-content-inner"></div></div></div>
    <div id="modal-settings" class="modal-overlay hidden"><div class="modal-window" style="width: 400px; padding:30px;"><button class="btn-main" onclick="toggleModal('modal-settings', false)">SCHLIESSEN</button></div></div>

    <script src="script.js"></script>
</body>
</html>
