<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - ELITE ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #39FF14; font-family: 'Orbitron', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .login-box { text-align: center; border: 1px solid #39FF14; padding: 50px; background: rgba(0,0,0,0.9); box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); z-index: 10; }
        input { background: #000; border: 1px solid #39FF14; color: #39FF14; padding: 15px; width: 100%; text-align: center; font-size: 1.2rem; margin-bottom: 20px; outline: none; }
        button { background: #39FF14; color: #000; border: none; padding: 15px 40px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; }
        #intro-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <video id="toni-video" playsinline>
            <source src="media/intro.mp4" type="video/mp4">
        </video>
    </div>

    <div class="login-box" id="login-ui">
        <h2>IDENTIFICATION</h2>
        <input type="password" id="pass" placeholder="PASSWORD" autofocus>
        <button onclick="unlock()">ENTRANCE</button>
    </div>

    <script>
        function unlock() {
            const val = document.getElementById('pass').value;
            if(val === 'toni2026') {
                document.getElementById('login-ui').style.display = 'none';
                const overlay = document.getElementById('intro-overlay');
                const video = document.getElementById('toni-video');
                overlay.style.display = 'flex';
                
                video.play();
                video.onended = () => {
                    // TONI Begrüßung vorbereiten
                    sessionStorage.setItem('toni_greet', 'true');
                    window.location.href = 'app.html';
                };
            } else {
                alert("ACCESS DENIED");
            }
        }
    </script>
</body>
</html>
