<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Intelligence Board</title>
    <style>
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #0a0a0a; color: #fff; overflow: hidden; }
        
        /* Navigation */
        #nav { background: #151515; padding: 15px; display: flex; justify-content: center; gap: 20px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 25px; border-radius: 2px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { background: #2e7d32; border-color: #fff; }

        /* Spielfeld - Fokus auf Realismus */
        #pitch-container { flex: 2; position: relative; padding: 10px; display: flex; justify-content: center; background: #111; }
        #pitch { 
            width: 100%; height: 100%; background: #2d5a27; border: 3px solid #fff; position: relative;
            background-image: repeating-linear-gradient(0deg, #2d5a27, #2d5a27 10%, #285123 10%, #285123 20%);
        }
        
        .line { position: absolute; background: rgba(255,255,255,0.6); pointer-events: none; }
        .center-circle { width: 100px; height: 100px; border: 2px solid #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.4; }
        
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.05); z-index: 5; }
        .goal-std { width: 90px; height: 30px; left: 50%; transform: translateX(-50%); }
        .goal-fun { width: 50px; height: 20px; }

        /* Spieler & Ball - Ohne Glow/Blitz */
        .player { 
            width: 36px; height: 36px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; cursor: grab; z-index: 50;
            border: 2px solid #fff; transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); touch-action: none;
        }
        .red { background: #b71c1c; color: white; }
        .blue { background: #0d47a1; color: white; }
        .ball { width: 20px; height: 20px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; transition: all 0.8s ease; }

        /* Chat Bereich */
        #chat { height: 35%; background: #ffffff; color: #000; display: flex; flex-direction: column; border-top: 5px solid #1a1a1a; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 15px; background: #fdfdfd; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; line-height: 1.5; border-left: 4px solid transparent; }
        .ai { background: #f1f1f1; border-left-color: #2e7d32; }
        .user { background: #e3f2fd; border-right: 4px solid #1565c0; text-align: right; border-left: none; }

        #input-area { padding: 15px; background: #f0f0f0; display: flex; gap: 15px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        button.action { background: none; border: none; font-size: 28px; cursor: pointer; color: #333; }
    </style>
</head>
<body>

<div id="nav">
    <button class="btn" onclick="setMode('funino')">Funino (3v3)</button>
    <button class="btn" onclick="setMode('11v11')">Pro Match (11v11)</button>
</div>

<div id="pitch-container">
    <div id="pitch">
        <div class="line" style="width: 100%; height: 2px; top: 50%;"></div>
        <div class="center-circle"></div>
        <div id="ball" class="player ball" style="top: 48%; left: 49%;"></div>
        <div id="team-layer"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Taktische Analyse anfordern...">
        <button class="action" onclick="startRecognition()">🎤</button>
        <button class="action" onclick="execute()">➤</button>
    </div>
</div>

<script>
    const layer = document.getElementById('team-layer');
    const log = document.getElementById('log');
    const input = document.getElementById('user-input');
    const ball = document.getElementById('ball');

    // --- PROFESSIONELLE SPRACHAUSGABE (TIEF & MÄNNLICH) ---
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            // Sucht gezielt nach einer autoritären männlichen Stimme
            utterance.voice = voices.find(v => v.lang === 'de-DE' && (v.name.includes('Male') || v.name.includes('Stefan'))) || voices.find(v => v.lang === 'de-DE');
            utterance.pitch = 0.8; // Tiefere Tonlage für mehr Autorität
            utterance.rate = 0.9;  // Besonneneres Sprechtempo
            window.speechSynthesis.speak(utterance);
        }
    }

    function addLog(who, text, isAi) {
        const div = document.createElement('div');
        div.className = 'msg ' + (isAi ? 'ai' : 'user');
        div.innerHTML = `<b>${who}:</b> ${text}`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        if (isAi) speak(text);
    }

    function setMode(mode) {
        layer.innerHTML = "";
        document.querySelectorAll('.goal').forEach(g => g.remove());
        if (mode === 'funino') {
            [[0,18],[0,72],[96,18],[96,72]].forEach(p => addGoal(p[0], p[1], 'goal-fun'));
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
            addLog("Co-Trainer", "Funino-Modus aktiviert. Fokus auf Raumwahrnehmung und schnelle Entscheidungsfindung.", true);
        } else {
            addGoal(0, 43, 'goal-std'); addGoal(96, 43, 'goal-std');
            applyFormation('442');
            addLog("Co-Trainer", "Formation 11 gegen 11 hergestellt. Wir analysieren nun die defensive Kompaktphase.", true);
        }
    }

    function addGoal(t, l, c) {
        const g = document.createElement('div'); g.className = 'goal ' + c;
        g.style.top = t + "%"; g.style.left = l + "%";
        document.getElementById('pitch').appendChild(g);
    }

    function createP(t, l, c, n) {
        const p = document.createElement('div'); p.className = `player ${c}`;
        p.style.top = t + "%"; p.style.left = l + "%"; p.innerText = n;
        layer.appendChild(p);
    }

    function applyFormation(type) {
        layer.innerHTML = "";
        let rPos = [], bPos = [{t:5,l:47},{t:18,l:20},{t:15,l:47},{t:18,l:75},{t:35,l:10},{t:40,l:35},{t:40,l:60},{t:35,l:85},{t:55,l:20},{t:58,l:47},{t:55,l:75}];
        
        if(type === '442') {
            rPos = [{t:90,l:47},{t:78,l:15},{t:80,l:38},{t:80,l:58},{t:78,l:80},{t:62,l:15},{t:64,l:38},{t:64,l:58},{t:62,l:80},{t:45,l:40},{t:45,l:55}];
        } else if(type === '343') {
            rPos = [{t:90,l:47},{t:82,l:25},{t:84,l:47},{t:82,l:70},{t:68,l:10},{t:68,l:38},{t:68,l:58},{t:68,l:85},{t:48,l:25},{t:45,l:47},{t:48,l:70}];
        }
        
        rPos.forEach((p, i) => createP(p.t, p.l, 'red', i+1));
        bPos.forEach((p, i) => createP(p.t, p.l, 'blue', i+1));
        initDrag();
    }

    function execute() {
        const val = input.value.toLowerCase();
        if(!val) return;
        addLog("Björn", input.value, false);
        let r = "Wir müssen die taktische Grundordnung beibehalten. Präzisiere deine Anweisung.";

        if(val.includes("442") || val.includes("4-4-2")) {
            applyFormation('442');
            r = "Wir stellen um auf 4-4-2. Die vertikale Kompaktheit ist nun entscheidend, um die Halbräume zu kontrollieren.";
        } else if(val.includes("343") || val.includes("3-4-3")) {
            applyFormation('343');
            r = "Wechsel auf 3-4-3. Wir erhöhen die Präsenz im letzten Drittel und forcieren das Flügelspiel.";
        } else if(val.includes("ball") && val.includes("rechts")) {
            ball.style.left = "85%"; ball.style.top = "50%";
            r = "Horizontale Spielverlagerung auf den rechten Flügel. Wir ziehen den Gegner auseinander.";
        } else if(val.includes("vor")) {
            const players = document.querySelectorAll('.red');
            players[players.length-1].style.top = "20%";
            r = "Wir schieben die letzte Kette höher, um das Pressing zu intensivieren.";
        }

        setTimeout(() => addLog("Co-Trainer", r, true), 600);
        input.value = "";
    }

    function initDrag() {
        document.querySelectorAll('.player').forEach(p => {
            let drag = false;
            p.onmousedown = p.ontouchstart = (e) => { drag = true; p.style.transition = "none"; e.preventDefault(); };
            window.onmousemove = window.ontouchmove = (e) => {
                if (!drag) return;
                const r = document.getElementById('pitch').getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - r.left;
                const y = (e.clientY || e.touches[0].clientY) - r.top;
                p.style.left = (x/r.width*100)-3 + "%"; p.style.top = (y/r.height*100)-3 + "%";
            };
            window.onmouseup = window.ontouchend = () => { drag = false; p.style.transition = "all 1.2s cubic-bezier(0.19, 1, 0.22, 1)"; };
        });
    }

    function startRecognition() {
        if ('webkitSpeechRecognition' in window) {
            const rec = new webkitSpeechRecognition(); rec.lang = 'de-DE';
            rec.onresult = (e) => { input.value = e.results[0][0].transcript; execute(); };
            rec.start();
        }
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') execute(); };
    window.onload = () => { window.speechSynthesis.getVoices(); setMode('11v11'); };
</script>
</body>
</html>
