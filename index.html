<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 — World-Class Tactical AI</title>
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/hologram.css">

    <style>
        :root {
            --bg-deep: #0B1220;
            --panel-warm: #1A2233;
            --accent-orange: #FF6A00;
            --data-cyan: #00D1FF;
        }
        body {
            background: var(--bg-deep);
            color: #fff;
            margin: 0;
            height: 100vh;
            display: grid;
            grid-template-columns: 80px 1fr 340px;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .module-container { display: none; width: 100%; height: 100%; }
        .module-container.active { display: block; }
        #stage { position: relative; overflow: hidden; }
        #main-canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="nav-icon active" id="nav-board" onclick="switchMainView('board')">📊</div>
        <div class="nav-icon" id="nav-training" onclick="switchMainView('training')">📅</div>
        <div class="nav-icon" id="nav-briefcase" onclick="switchMainView('briefcase')">💼</div>
        <div class="nav-icon" id="nav-global" onclick="switchMainView('global')" title="Global Knowledge">🌐</div>
    </aside>

    <main id="stage">
        <div class="tools-overlay" id="board-tools">
            <button class="tool-btn" onclick="triggerToniAnalysis()" style="border-color: var(--data-cyan); color: var(--data-cyan);">WELTWEITER TREND-SCAN</button>
            <button class="tool-btn" onclick="AnalysisAI.fixDefenseLine()" style="border-color: #28C76F; color: #28C76F;">TONI, KORRIGIERE!</button>
            <button class="tool-btn" onclick="arena.setMode('funinho')">Funinho Mode</button>
            <button class="tool-btn danger" onclick="arena.clear()">Löschen</button>
        </div>

        <div id="module-board" class="module-container active">
            <canvas id="main-canvas"></canvas>
        </div>
        
        <div id="module-training" class="module-container"></div>
        <div id="module-briefcase" class="module-container"></div>
        <div id="module-global" class="module-container" style="padding:40px; background:radial-gradient(circle, #162033, #0B1220);">
            <h2 style="color: var(--data-cyan);">GLOBAL TACTICAL DATABASE</h2>
            <div id="global-trends-feed"></div>
        </div>
    </main>

    <aside class="analysis-panel" id="analysis-sidebar">
        <h2>Analysezentrum</h2>
        <div id="setcard-content">
            <p class="empty-state">Scan läuft... Toni analysiert globale Trends.</p>
        </div>
    </aside>

    <div id="hologram-container">
        <div class="holo-ring"></div>
        <div class="holo-core"></div>
        <div id="hologram-status">Toni Standby</div>
    </div>

    <script src="js/storage.js"></script>
    <script src="engine/arena.js"></script>
    <script src="engine/players.js"></script>
    <script src="engine/tools.js"></script>
    <script src="engine/dragdrop.js"></script>
    <script src="engine/analysis-ai.js"></script>
    <script src="voice/voice-output.js"></script>
    <script src="voice/hologram-effects.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (arena.init('main-canvas')) {
                initDragDrop();
                arena.players = [
                    { id: 1, name: "David Luiz", number: 4, x: 200, y: 450, team: 'home' },
                    { id: 2, name: "Gegner", number: 9, x: 400, y: 250, team: 'away' }
                ];
            }
            if (window.Hologram) window.Hologram.init();
            
            setTimeout(() => {
                if (window.toniSpeak) toniSpeak("Systeme online. Ich habe Zugriff auf die UEFA- und FIFA-Datenbanken von 2026. Was wollen wir trainieren, Björn?");
            }, 1500);
        });

        function triggerToniAnalysis() {
            if (window.Hologram) window.Hologram.setScanning(true);
            setTimeout(() => {
                const report = AnalysisAI.scanBoard();
                if (window.toniSpeak) window.toniSpeak(report);
                if (window.Hologram) window.Hologram.setScanning(false);
            }, 2000);
        }

        function switchMainView(module) {
            document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
            if(document.getElementById('nav-' + module)) document.getElementById('nav-' + module).classList.add('active');
            
            document.querySelectorAll('.module-container').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('module-' + module);
            if (target) target.classList.add('active');

            const tools = document.getElementById('board-tools');
            if (module === 'board') { 
                tools.style.display = 'flex'; 
                arena.resize(); 
            } else { 
                tools.style.display = 'none'; 
            }
        }
    </script>
</body>
</html>
