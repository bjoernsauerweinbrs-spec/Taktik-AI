<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toni 2.0 - Zugang</title>
    <style>
        :root { --gold: #ffd700; --dark: #0a0a0a; }
        body { 
            background: var(--dark); color: white; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .login-card { 
            background: #111; padding: 40px; border-radius: 15px; 
            border: 1px solid #222; width: 90%; max-width: 350px; 
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }
        h1 { color: var(--gold); margin-bottom: 5px; font-size: 28px; letter-spacing: 3px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        input { 
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; 
            border: 1px solid #333; background: #1a1a1a; color: white; 
            font-size: 16px; outline: none; transition: border 0.3s;
        }
        input:focus { border-color: var(--gold); }
        button { 
            width: 100%; padding: 15px; background: var(--gold); color: black; 
            border: none; border-radius: 8px; cursor: pointer; 
            font-weight: bold; font-size: 18px; margin-top: 20px;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover { background: #e6c200; transform: translateY(-2px); }
        .error { color: #ff4444; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card" id="login-box">
        <h1>TONI 2.0</h1>
        <p>GINGA TACTICAL SYSTEM</p>
        
        <input type="text" id="username" placeholder="Trainer-Name" autocomplete="off">
        <input type="password" id="password" placeholder="Passwort">
        <input type="text" id="key" placeholder="Sicherheits-Key">
        
        <button onclick="handleLogin()">Stadion betreten</button>
        <div id="error-msg" class="error">Zugriff verweigert.</div>
    </div>

    <script>
        // Checkt sofort, ob man schon angemeldet ist
        if (localStorage.getItem('isAuthorized') === 'true') {
            window.location.href = 'app.html';
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const key = document.getElementById('key').value.trim();
            const error = document.getElementById('error-msg');

            const validUsers = ["björn", "bjoern", "nadine"];
            
            // Logik: Name muss valide sein und der Key darf nicht leer sein
            if (validUsers.includes(user) && key !== "") {
                localStorage.setItem('isAuthorized', 'true');
                localStorage.setItem('userName', user.charAt(0).toUpperCase() + user.slice(1));
                
                document.getElementById('login-box').style.transform = 'scale(0.9)';
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 200);
            } else {
                error.textContent = "Prüfe Name und Sicherheits-Key.";
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
