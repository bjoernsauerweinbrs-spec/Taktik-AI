<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taktikboard Björn</title>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #top-bar { background: #222; padding: 10px; text-align: center; border-bottom: 2px solid #444; }
        #pitch-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
        #pitch { 
            width: 90%; height: 90%; background: #2d5a27; border: 3px solid white; position: relative;
            background-image: linear-gradient(rgba(255,255,255,0.1) 2px, transparent 2px); background-size: 100% 10%;
        }
        .mid-line { position: absolute; width: 100%; height: 2px; background: white; top: 50%; }
        .player { 
            width: 30px; height: 30px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            border: 2px solid white; cursor: move; z-index: 10; touch-action: none;
        }
        .red { background: red; } .blue { background: blue; }
        #ball { width: 18px; height: 18px; background: white; border-radius: 50%; border: 2px solid black; z-index: 20; }
        
        #chat-area { height: 250px; background: white; color: black; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; background: #eee; }
        #input-row { padding: 10px; display: flex; gap: 5px; background: #ccc; }
        #user-in { flex: 1; padding: 10px; font-size: 16px; }
        #send-btn { padding: 10px; background: green; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="top-bar">
    <button onclick="setMode('11v11')">11 vs 11</button>
    <button onclick="setMode('funino')">Funino (4 Tore)</button>
    <button onclick="askKey()" id="key-btn">Key eingeben</button>
</div>

<div id="pitch-container">
    <div id="pitch">
        <div class="mid-line"></div>
        <div id="ball" class="player" style="top:48%; left:49%;"></div>
        <div id="player-layer"></div>
    </div>
</div>

<div id="chat-area">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="user-in" placeholder="Schreibe hier...">
        <button id="send-btn" onclick="send()">Senden</button>
    </div>
</div>

<script>
    const layer = document.getElementById('player-layer');
    const ball = document.getElementById('ball');
    const log = document.getElementById('log');
    const input = document.getElementById('user-in');
    let apiKey = localStorage.getItem('bjorn_key_final') || "";

    function askKey() {
        const k = prompt("Bitte Google API-Key einfügen:");
        if(k) { localStorage.setItem('bjorn_key_final', k.trim()); location.reload(); }
    }

    function addLog(who, msg) {
        log.innerHTML += `<div><b>${who}:</b> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    function createP(t, l, c, n) {
        const p = document.createElement('div');
        p.className = 'player ' + c;
        p.style.top = t + "%"; p.style.left = l + "%";
        p.innerText = n;
        layer.appendChild(p);
        makeDraggable(p);
    }

    function setMode(m) {
        layer.innerHTML = "";
        if(m === '11v11') {
            for(let i=0; i<11; i++) { createP(80, 10+i*8, 'red', i+1); createP(15, 10+i*8, 'blue', i+1); }
        } else {
            for(let i=0; i<3; i++) { createP(70, 20+i*30, 'red', i+1); createP(25, 20+i*30, 'blue', i+1); }
        }
    }

    async function send() {
        const val = input.value;
        if(!val) return;
        addLog("Ich", val);
        input.value = "";

        if(!apiKey) {
            addLog("KI", "Bitte erst den Key oben eingeben!");
            return;
        }

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist Fußball-Trainer. Antworte kurz. Befehl: [BALL:X:Y]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            const txt = d.candidates[0].content.parts[0].text;
            addLog("KI", txt);
            const bM = txt.match(/\[BALL:(\d+):(\d+)\]/);
            if(bM) { ball.style.left = bM[1]+"%"; ball.style.top = bM[2]+"%"; }
        } catch(e) {
            addLog("KI", "Fehler bei der Verbindung. Key prüfen!");
        }
    }

    function makeDraggable(el) {
        let drg = false;
        el.onmousedown = el.ontouchstart = () => { drg = true; };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!drg) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            el.style.left = (x/r.width*100)-2 + "%"; el.style.top = (y/r.height*100)-2 + "%";
        };
        window.onmouseup = window.ontouchend = () => { drg = false; };
    }

    makeDraggable(ball);
    input.onkeypress = (e) => { if(e.key === 'Enter') send(); };
    setMode('11v11');
</script>
</body>
</html>
