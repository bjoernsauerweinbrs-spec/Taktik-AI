<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | LOGIN & SETUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="setup-container">
        <div class="luxury-logo" style="font-size: 38px; display: block; text-align: center; margin-bottom: 30px;">TONI 2.0</div>
        
        <div class="config-section">
            <div class="config-header">LIVE-DATA & AI SETUP</div>
            <input type="password" id="api-key" class="auth-input" placeholder="FOOTBALL-DATA API KEY">
            <input type="text" id="ollama-url" class="auth-input" value="http://localhost:11434" placeholder="OLLAMA URL">
        </div>

        <div class="login-section">
            <input type="password" id="passcode" class="auth-input" style="text-align:center; letter-spacing:5px;" placeholder="PASSCODE">
            <button class="btn-main" onclick="saveAndBoot()">SYSTEM STARTEN</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
