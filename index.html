<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | NEURAL CLUB ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-layer">
        <div class="login-terminal" style="width:400px; padding:50px; text-align:center; background:#050505; border:1px solid #222;">
            <div style="font-family:var(--font-ui); font-weight:900; background:linear-gradient(to right, #bf953f, #fcf6ba); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:40px; margin-bottom:20px;">TONI 2.0</div>
            <button class="btn-main" onclick="bootSystem()">SYSTEM INITIALISIEREN</button>
        </div>
    </div>

    <div id="app-interface" class="hidden">
        <header id="top-bar">
            <div style="font-family:var(--font-ui); font-weight:900; background:linear-gradient(to right, #bf953f, #fcf6ba); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:20px;">TONI 2.0</div>
            <div id="clock-display" style="font-family: var(--font-ui); color:#444; font-size:12px;">00:00:00</div>
            <div id="budget-display" style="font-family: var(--font-ui); color: var(--neon-gold); font-size: 13px;">4.500.000 €</div>
        </header>

        <div style="display:flex; height: calc(100vh - 60px);">
            <nav class="nav-sidebar">
                <div class="nav-group-title">COMMAND</div>
                <button class="nav-item" onclick="loadModule('tactics')"><i class="fa-solid fa-compass-drafting"></i> TACTICAL CO-PILOT</button>
                <button class="nav-item" onclick="loadModule('kader')"><i class="fa-solid fa-shirt"></i> MANNSCHAFTSKABINE</button>
                <button class="nav-item" onclick="loadModule('office')"><i class="fa-solid fa-chart-line"></i> OFFICE PRIME</button>
                <div class="nav-group-title">INFRASTRUCTURE</div>
                <button class="nav-item" onclick="loadModule('nlz')"><i class="fa-solid fa-address-card"></i> ACADEMY HUB (NLZ)</button>
                <button class="nav-item active" onclick="loadModule('press')"><i class="fa-solid fa-newspaper"></i> PRESS BUREAU</button>
                <button class="nav-item" onclick="loadModule('video')"><i class="fa-solid fa-clapperboard"></i> BROADCAST LAB</button>
            </nav>

            <main id="stage-content" style="flex:1; overflow:hidden;"></main>

            <aside id="tools-sidebar">
                <div id="ai-log">
                    <div class="ai-bubble toni">
                        <small>TONI REPORTER</small><br>
                        Guten Tag, Coach. Ich bin bereit für die Pressekonferenz. Starten wir?
                    </div>
                </div>
                <div style="padding:20px; border-top:1px solid #1a1a1d; background:#080808;">
                    <button id="live-voice-btn" class="live-btn" onclick="toggleVoiceAI()">
                        <i class="fa-solid fa-microphone"></i> VOICE REPORTER MODE
                    </button>
                    <div id="interview-controls" class="hidden" style="margin-top:10px;">
                        <input type="text" id="ai-chat-input" class="auth-input" style="background:#000; color:#fff; border:1px solid #333; width:100%; padding:10px; margin-bottom:10px;" placeholder="Antwort..." onkeypress="if(event.key==='Enter') processInterviewStep()">
                        <button class="btn-main" onclick="processInterviewStep()">ANTWORT SENDEN</button>
                    </div>
                    <button id="btn-start-briefing" class="btn-main" onclick="startAIBriefing()" style="margin-top:10px; border-color:var(--neon-gold); color:var(--neon-gold);">GESPRÄCH BEGINNEN</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>                <button class="nav-item" onclick="loadModule('video')"><i class="fa-solid fa-clapperboard"></i> BROADCAST LAB</button>
            </nav>

            <main id="stage-content" style="flex:1; overflow:hidden;"></main>

            <aside id="tools-sidebar">
                <div class="nav-group-title">NEURAL REPORTER // LIVE-DESK</div>
                <div id="ai-log">
                    <div class="ai-bubble toni">
                        <small>TONI REPORTER</small><br>
                        Guten Morgen, Coach. Das Bureau ist bereit. Starten wir das Briefing für die neue Ausgabe?
                    </div>
                </div>
                <div style="padding:20px; border-top:1px solid #1a1a1d; background:#080808;">
                    <button id="live-voice-btn" class="live-btn" onclick="toggleVoiceAI()">
                        <i class="fa-solid fa-microphone"></i> VOICE REPORTER MODE
                    </button>
                    <div id="interview-controls" class="hidden" style="margin-top:10px;">
                        <input type="text" id="ai-chat-input" class="auth-input" style="background:#000; margin-bottom:10px;" placeholder="Antwort..." onkeypress="if(event.key==='Enter') processInterviewStep()">
                        <button class="btn-main" onclick="processInterviewStep()">SENDEN</button>
                    </div>
                    <button id="btn-start-briefing" class="btn-main" onclick="startAIBriefing()" style="margin-top:10px; border-color:var(--neon-gold); color:var(--neon-gold);">
                        INTERVIEW STARTEN
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
