<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | Tactical Operating Network</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>TONI 2.0 ACCESS</h2>
            <input type="password" id="sys-pass" placeholder="Enter Credentials...">
            <button onclick="checkAuth()">LOGIN</button>
        </div>
    </div>

    <div id="main-board" class="hidden">
        
        <aside class="sidebar-left">
            <div class="column-header">AKTENTASCHE</div>
            
            <div class="accordion">
                <details open>
                    <summary>MANNSCHAFTSVERWALTUNG</summary>
                    <div class="sub-nav">
                        <button onclick="loadModule('kader')">Kader-Analyse</button>
                        <button onclick="loadModule('medical')">Medical & Reha</button>
                    </div>
                </details>
                <details>
                    <summary>TRAININGSBETRIEB</summary>
                    <div class="sub-nav">
                        <button onclick="loadModule('drills')">Übungskatalog</button>
                        <button onclick="loadModule('quest-sync')">Quest Telemetrie</button>
                    </div>
                </details>
                <details>
                    <summary>SPIELBETRIEB</summary>
                    <div class="sub-nav">
                        <button onclick="loadModule('match-analysis')">Match Day Analyse</button>
                        <button onclick="loadModule('scouting')">Scouting Report</button>
                    </div>
                </details>
                <details>
                    <summary>MANAGEMENT-LABOR</summary>
                    <div class="sub-nav">
                        <button onclick="loadModule('finance')">Finanz-Labor (GuV)</button>
                        <button onclick="loadModule('sponsoring')">Sponsoring ROI</button>
                        <button onclick="loadModule('stadionzeitung')">Stadion-Zeitung</button>
                    </div>
                </details>
            </div>
        </aside>

        <section class="center-pitch">
            <div id="tactical-canvas">
                <div id="pitch-3d-container"></div>
            </div>
            <div class="pitch-controls">
                <button>Formation: 4-4-2</button>
                <button>Pitch Control: ON</button>
                <button>Passing Lanes: Active</button>
            </div>
        </section>

        <aside class="sidebar-right">
            <div class="column-header">TONI AI</div>
            <div id="toni-chat-history"></div>
            <div class="toni-input-area">
                <textarea id="toni-msg" placeholder="Frag Toni..."></textarea>
                <button onclick="askToni()">ANALYSE ANFORDERN</button>
            </div>
            <div class="ai-metrics">
                <p>Decision Latency: <span id="m-latency">-- ms</span></p>
                <p>Scan Rate: <span id="m-scan">-- %</span></p>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
