<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-green: #39FF14; }
        body { background: #000; color: var(--neon-green); font-family: 'Orbitron', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .login-container { text-align: center; border: 1px solid var(--neon-green); padding: 40px; background: rgba(0,0,0,0.9); box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); z-index: 10; width: 350px; }
        input { background: #000; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 15px; width: 100%; box-sizing: border-box; text-align: center; font-size: 1.2rem; margin-bottom: 20px; outline: none; }
        button { background: var(--neon-green); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px var(--neon-green); }
        
        /* Video Overlay */
        #video-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: #000; 
            z-index: 100; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Skip Button falls Video nicht lädt */
        #skip-btn {
            position: absolute; bottom: 30px; right: 30px;
            background: transparent; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 10px 20px; cursor: pointer;
            font-family: 'Orbitron'; font-size: 0.7rem; z-index: 110;
        }
    </style>
</head>
<body>

    <div id="video-overlay">
        <button id="skip-btn" onclick="goToCockpit()">SKIP INTRO</button>
        <video id="intro-video" playsinline muted>
            <source src="media/intro.mp4" type="video/mp4">
            Dein Browser unterstützt keine Videos.
        </video>
    </div>

    <div class="login-container" id="login-box">
        <h2 style="margin-top:0; font-size: 1rem; letter-spacing: 2px;">TONI 2.0 SYSTEM</h2>
        <input type="password" id="pass" placeholder="PASSWORD" autofocus onkeydown="if(event.key==='Enter') unlock()">
        <button onclick="unlock()">ENTER COCKPIT</button>
        <p style="font-size: 0.5rem; margin-top: 15px; opacity: 0.5;">DECRYPTING ACCESS...</p>
    </div>

    <script>
        function unlock() {
            const pass = document.getElementById('pass').value;
            // Das Passwort ist: toni2026
            if(pass === 'toni2026') {
                const loginBox = document.getElementById('login-box');
                const overlay = document.getElementById('video-overlay');
                const video = document.getElementById('intro-video');

                loginBox.style.display = 'none';
                overlay.style.display = 'block';

                // Video-Start-Logik
                video.play().then(() => {
                    console.log("Video gestartet");
                    // Nach 1 Sekunde Sound aktivieren (Browser-Trick)
                    video.muted = false; 
                }).catch(error => {
                    console.error("Video-Fehler:", error);
                    // Falls Video komplett blockiert, direkt weiter
                    setTimeout(goToCockpit, 1000);
                });

                video.onended = goToCockpit;
            } else {
                alert("ACCESS DENIED - WRONG KEY");
            }
        }

        function goToCockpit() {
            sessionStorage.setItem('toni_auth', 'true');
            window.location.href = 'app.html';
        }
    </script>
</body>
</html>
