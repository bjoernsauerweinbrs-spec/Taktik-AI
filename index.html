<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"><title>TONI 2.0 — Login</title>
    <link rel="stylesheet" href="css/toni-style.css">
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>TONI 2.0</h1>
            <p>TACTICAL INTELLIGENCE // LOGIN</p>
            <input id="password-input" type="password" class="login-input" placeholder="Passwort">
            <input id="api-key-input" type="password" class="login-input" placeholder="Dein API-Key (OpenAI/Gemini)">
            <button class="login-btn" onclick="ToniAI.handleLogin()">SYSTEM STARTEN</button>
        </div>
    </div>

    <aside class="sidebar-minimal"><div class="main-briefcase-btn" onclick="BriefcaseUI.toggle()">💼</div></aside>
    <main id="stage">
        <canvas id="main-canvas"></canvas>
        <div id="hologram-ui"></div>
    </main>
    <aside class="analysis-panel" id="side-analysis"><div id="setcard-content"></div></aside>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div style="display:flex; justify-content:space-between; width:100%; max-width:1000px;">
            <h1 style="color:var(--accent-orange);">ZENTRALE AKTENTASCHE</h1>
            <button onclick="BriefcaseUI.toggle()" style="background:none; border:none; color:white; font-size:30px; cursor:pointer;">✕</button>
        </div>
        </div>

    <script src="engine/arena.js"></script>
    <script src="engine/toni-brain.js"></script>
    <script src="engine/toni-ai.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { 
            arena.init('main-canvas'); 
            ToniAI.init();
        });
    </script>
</body>
</html>
