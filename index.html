<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktikboard & Co-Trainer</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; background: #111; color: white; overflow: hidden; }
        
        /* Das Spielfeld */
        #pitch { 
            flex: 2; background: #2e7d32; position: relative; 
            border: 3px solid white; margin: 10px; overflow: hidden;
            background-image: linear-gradient(to bottom, #2e7d32 50%, #29722d 50%);
            background-size: 100% 10%;
        }
        
        /* Tore und Linien */
        .line { position: absolute; border: 2px solid rgba(255,255,255,0.7); }
        .goal { width: 60px; height: 30px; border: 3px solid white; position: absolute; left: 50%; transform: translateX(-50%); }
        .goal-top { top: 0; border-top: none; }
        .goal-bottom { bottom: 0; border-bottom: none; }
        .center-circle { width: 100px; height: 100px; border-radius: 50%; border: 2px solid white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* Spieler & Ball */
        .player { 
            width: 32px; height: 32px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px; cursor: move; z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); border: 2px solid white;
            touch-action: none; transition: transform 0.1s;
        }
        .team-red { background: #d32f2f; color: white; }
        .team-blue { background: #1976d2; color: white; }
        .ball { width: 18px; height: 18px; background: white; border: 2px solid black; z-index: 20; }

        /* Chat Bereich */
        #chat { flex: 1; background: white; color: black; display: flex; flex-direction: column; border-top: 4px solid #444; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; }
        .msg { margin-bottom: 10px; padding: 5px; border-bottom: 1px solid #eee; }
        
        #input-area { padding: 10px; display: flex; gap: 10px; background: #f0f0f0; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        button { background: none; border: none; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>

<div id="pitch">
    <div class="goal goal-top"></div>
    <div class="line" style="width: 100%; top: 50%;"></div>
    <div class="center-circle"></div>
    <div class="goal goal-bottom"></div>

    <div id="ball" class="player ball" style="top: 48%; left: 48%;"></div>

    <div class="player team-red" style="top: 85%; left: 45%;">1</div>
    <div class="player team-red" style="top: 70%; left: 15%;">2</div>
    <div class="player team-red" style="top: 75%; left: 35%;">4</div>
    <div class="player team-red" style="top: 75%; left: 55%;">5</div>
    <div class="player team-red" style="top: 70%; left: 75%;">3</div>
    <div class="player team-red" style="top: 55%; left: 20%;">7</div>
    <div class="player team-red" style="top: 60%; left: 40%;">6</div>
    <div class="player team-red" style="top: 60%; left: 55%;">8</div>
    <div class="player team-red" style="top: 55%; left: 75%;">11</div>
    <div class="player team-red" style="top: 40%; left: 35%;">9</div>
    <div class="player team-red" style="top: 40%; left: 55%;">10</div>

    <div class="player team-blue" style="top: 5%; left: 45%;">1</div>
    <div class="player team-blue" style="top: 20%; left: 15%;">2</div>
    <div class="player team-blue" style="top: 15%; left: 35%;">4</div>
    <div class="player team-blue" style="top: 15%; left: 55%;">5</div>
    <div class="player team-blue" style="top: 20%; left: 75%;">3</div>
    <div class="player team-blue" style="top: 35%; left: 20%;">7</div>
    <div class="player team-blue" style="top: 30%; left: 40%;">6</div>
    <div class="player team-blue" style="top: 30%; left: 55%;">8</div>
    <div class="player team-blue" style="top: 35%; left: 75%;">11</div>
    <div class="player team-blue" style="top: 45%; left: 35%;">9</div>
    <div class="player team-blue" style="top: 45%; left: 55%;">10</div>
</div>

<div id="chat">
    <div id="log">
        <div class="msg"><b>Co-Trainer:</b> Ich bin bereit! Das Board hat jetzt Tore, 22 Spieler und einen Ball. Schreib mir was!</div>
    </div>
    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Taktik fragen...">
        <button id="mic-btn">🎤</button>
        <button id="send-btn">➤</button>
    </div>
</div>

<script>
    // --- BEWEGUNG (DRAG & DROP) ---
    const players = document.querySelectorAll('.player');
    const pitch = document.getElementById('pitch');

    players.forEach(p => {
        let dragging = false;
        const start = (e) => { dragging = true; p.style.zIndex = 1000; e.preventDefault(); };
        const end = () => { dragging = false; p.style.zIndex = 10; };
        const move = (e) => {
            if (!dragging) return;
            const rect = pitch.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            p.style.left = (x / rect.width * 100) - 3 + "%";
            p.style.top = (y / rect.height * 100) - 3 + "%";
        };
        p.onmousedown = p.ontouchstart = start;
        window.onmousemove = window.ontouchmove = move;
        window.onmouseup = window.ontouchend = end;
    });

    // --- CHAT & ANTWORT ---
    const input = document.getElementById('msg-input');
    const log = document.getElementById('log');

    function addMessage(who, text) {
        const d = document.createElement('div');
        d.className = 'msg';
        d.innerHTML = `<b>${who}:</b> ${text}`;
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
    }

    function send() {
        const text = input.value.trim();
        if(!text) return;
        addMessage("Du", text);
        input.value = "";

        // Simulation der Antwort
        setTimeout(() => {
            addMessage("Co-Trainer", "Gute Idee! Ich schaue mir die Positionen an. Was sagst du zur Abwehr?");
        }, 1000);
    }

    document.getElementById('send-btn').onclick = send;
    input.onkeypress = (e) => { if(e.key === 'Enter') send(); };

    // --- MIKROFON FIX ---
    const mic = document.getElementById('mic-btn');
    if ('webkitSpeechRecognition' in window) {
        const rec = new webkitSpeechRecognition();
        rec.lang = 'de-DE';
        mic.onclick = () => { 
            try { rec.start(); mic.style.color = 'red'; } catch(e) { console.log(e); }
        };
        rec.onresult = (e) => {
            input.value = e.results[0][0].transcript;
            mic.style.color = 'black';
            send();
        };
        rec.onerror = () => { mic.style.color = 'black'; };
        rec.onend = () => { mic.style.color = 'black'; };
    } else {
        mic.style.opacity = "0.2";
    }
</script>

</body>
</html>
