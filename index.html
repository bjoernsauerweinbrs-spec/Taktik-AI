<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Coach - Taktikboard v2</title>
    <style>
        :root {
            --bg-black: #000000;
            --neon-green: #39FF14;
            --panel-gray: #0a0a0a;
            --text-white: #ffffff;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: var(--bg-black); color: var(--text-white); font-family: sans-serif; overflow: hidden; }

        .wrapper { display: flex; flex-direction: column; height: 100vh; }
        .main-content { display: flex; flex: 1; overflow: hidden; }

        /* Seiten-Panels */
        .column-left { width: 100px; background: var(--panel-gray); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        .column-right { width: 250px; background: var(--panel-gray); border-left: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .column-middle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }

        /* Spielfeld */
        #soccer-field {
            width: 100%; max-width: 850px; aspect-ratio: 1.5;
            border: 3px solid var(--neon-green); position: relative;
            background-color: transparent; transition: all 0.4s ease-in-out;
        }

        .field-line { position: absolute; background-color: var(--neon-green); }
        .center-line { left: 50%; top: 0; bottom: 0; width: 2px; }
        
        /* Standard Markierungen */
        .standard-mark { transition: opacity 0.3s; }
        .center-circle { left: 50%; top: 50%; width: 16%; height: 24%; border: 2px solid var(--neon-green); border-radius: 50%; transform: translate(-50%, -50%); position: absolute; }
        .box-16 { border: 2px solid var(--neon-green); width: 16%; height: 44%; position: absolute; top: 28%; }
        .left-16 { left: 0; border-left: none; } .right-16 { right: 0; border-right: none; }

        /* Funino Schusszonen (6m) */
        .funino-zone { display: none; width: 18%; height: 100%; border: 1px dashed var(--neon-green); top: 0; opacity: 0.6; position: absolute; }
        .zone-left { left: 0; border-left: none; }
        .zone-right { right: 0; border-right: none; }

        /* Tore */
        .goal { position: absolute; width: 6px; height: 14%; background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
        .g-senior { top: 43%; }
        .g-funino { display: none; }

        /* Buttons & UI */
        .mode-buttons { position: absolute; top: 15px; left: 20px; display: flex; gap: 8px; z-index: 100; }
        .btn { background: #111; color: var(--neon-green); border: 1px solid var(--neon-green); padding: 8px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; }
        .btn:hover { background: var(--neon-green); color: #000; }
        .briefcase { font-size: 45px; filter: drop-shadow(0 0 5px var(--neon-green)); cursor: pointer; }
        .toni-img { width: 80px; height: 80px; border: 2px solid var(--neon-green); border-radius: 50%; background: #111; margin-bottom: 10px; }

        .bench-area { height: 100px; background: #050505; border-top: 1px solid #1a1a1a; display: flex; align-items: center; padding: 0 20px; }

        /* Mobile */
        @media (max-width: 900px) {
            .main-content { flex-direction: column; overflow-y: auto; }
            .column-left, .column-right { width: 100%; height: auto; flex-direction: row; padding: 10px; }
            .column-middle { min-height: 350px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="main-content">
            <div class="column-left">
                <div class="briefcase">💼</div>
                <small style="color: #444; margin-top: 5px;">TOOLS</small>
            </div>

            <div class="column-middle">
                <div class="mode-buttons">
                    <button class="btn" onclick="setField('senior')">SENIOREN</button>
                    <button class="btn" onclick="setField('funino')">FUNINO</button>
                    <button class="btn" onclick="setField('f-jugend')">F-JUGEND</button>
                </div>

                <div id="soccer-field">
                    <div class="field-line center-line"></div>
                    
                    <div class="standard-mark center-circle"></div>
                    <div class="standard-mark box-16 left-16"></div>
                    <div class="standard-mark box-16 right-16"></div>
                    
                    <div class="funino-zone zone-left" id="zone-l"></div>
                    <div class="funino-zone zone-right" id="zone-r"></div>

                    <div id="gs-l" class="goal g-senior" style="left: -7px;"></div>
                    <div id="gs-r" class="goal g-senior" style="right: -7px;"></div>
                    
                    <div class="goal g-funino" style="left: -7px; top: 15%;"></div>
                    <div class="goal g-funino" style="left: -7px; bottom: 15%;"></div>
                    <div class="goal g-funino" style="right: -7px; top: 15%;"></div>
                    <div class="goal g-funino" style="right: -7px; bottom: 15%;"></div>
                </div>
            </div>

            <div class="column-right">
                <div class="toni-img"></div>
                <span style="color: var(--neon-green); font-weight: bold;">TONI</span>
                <p style="font-size: 11px; color: #555; text-align: center;">Taktik-Analyse aktiv</p>
            </div>
        </div>
        <div class="bench-area">
            <div style="color: #222; font-size: 12px; font-weight: bold; margin-right: 20px;">BANK</div>
            <div id="player-dock"></div>
        </div>
    </div>

    <script>
        function setField(mode) {
            const field = document.getElementById('soccer-field');
            const standards = document.querySelectorAll('.standard-mark');
            const funinoZones = document.querySelectorAll('.funino-zone');
            const sGoals = document.querySelectorAll('.g-senior');
            const fGoals = document.querySelectorAll('.g-funino');

            // Standardmäßig alles zurücksetzen
            standards.forEach(el => el.style.opacity = "1");
            funinoZones.forEach(el => el.style.display = "none");
            sGoals.forEach(el => el.style.display = "block");
            fGoals.forEach(el => el.style.display = "none");
            field.style.transform = "scale(1)";

            if (mode === 'funino') {
                // Funiño Spezial-Layout
                standards.forEach(el => el.style.opacity = "0"); // Strafraum etc. ausblenden
                funinoZones.forEach(el => el.style.display = "block"); // 6m Zonen einblenden
                sGoals.forEach(el => el.style.display = "none");
                fGoals.forEach(el => el.style.display = "block");
            } else if (mode === 'f-jugend') {
                field.style.transform = "scale(0.85)";
            }
        }
        setField('senior'); // Startzustand
    </script>
</body>
</html>
