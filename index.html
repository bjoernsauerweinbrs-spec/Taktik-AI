<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - ACCESS CONTROL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        body { 
            background: #050505; 
            color: #39FF14; 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        .login-box { 
            border: 1px solid #39FF14; 
            padding: 50px; 
            background: rgba(0,0,0,0.9); 
            text-align: center; 
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); 
            border-radius: 5px; 
            transition: 0.5s;
            max-width: 400px;
            width: 90%;
        }
        .login-box:hover {
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.4);
        }
        h2 { letter-spacing: 5px; margin-bottom: 30px; font-size: 1.5rem; }
        input { 
            background: #000; 
            border: 1px solid #39FF14; 
            color: #39FF14; 
            padding: 15px; 
            margin-bottom: 20px; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center; 
            font-size: 1.1rem; 
            outline: none; 
            font-family: 'Orbitron', sans-serif;
            border-radius: 3px;
        }
        button { 
            background: #39FF14; 
            color: #000; 
            border: none; 
            padding: 15px 30px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            letter-spacing: 2px; 
            transition: 0.3s; 
            font-family: 'Orbitron', sans-serif;
            border-radius: 3px;
        }
        button:hover { 
            background: #fff; 
            box-shadow: 0 0 20px #39FF14; 
        }
        .system-status {
            margin-top: 25px;
            font-size: 0.6rem;
            color: rgba(57, 255, 20, 0.4);
            letter-spacing: 1px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>IDENTIFICATION</h2>
        <input type="password" id="pass" placeholder="PASSWORD" autofocus>
        <br>
        <button onclick="check()">ENTRANCE</button>
        <div class="system-status">
            TONI 2.0 BIOMETRIC INTERFACE READY<br>
            <span style="font-size: 0.5rem; opacity: 0.5;">SENSORS ONLINE | VISION ENGINE ARMED</span>
        </div>
    </div>

    <script>
        function check() {
            // Master-Key für alle Trainer
            if(document.getElementById('pass').value === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                window.location.href = 'app.html';
            } else {
                alert("ACCESS DENIED - AUTHORIZED PERSONNEL ONLY");
                document.getElementById('pass').value = '';
            }
        }

        // Support für die Enter-Taste
        document.getElementById('pass').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') check();
        });
    </script>
</body>
</html>
