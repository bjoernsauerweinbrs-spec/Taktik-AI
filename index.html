<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | NEURAL PRESS AGENCY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-layer">
        <div class="login-terminal">
            <div class="luxury-logo" style="font-size: 40px; margin-bottom: 20px;">TONI 2.0</div>
            <button class="btn-main" onclick="bootSystem()">SYSTEM START</button>
        </div>
    </div>

    <div id="app-interface" class="hidden">
        <header id="top-bar">
            <div class="luxury-logo">TONI 2.0</div>
            <div id="clock-display" style="font-family: var(--font-ui); color:#444;">17:10:00</div>
            <div style="font-family: var(--font-ui); color: var(--neon-gold); font-size: 14px;">
                <i class="fa-solid fa-vault"></i> <span id="budget-display">4.500.000 €</span>
            </div>
        </header>

        <div style="display:flex; height: calc(100vh - 60px);">
            <nav class="nav-sidebar">
                <button class="nav-item active" onclick="loadModule('press')"><i class="fa-solid fa-newspaper"></i> PRESS BUREAU</button>
                <button class="nav-item" onclick="loadModule('nlz')"><i class="fa-solid fa-id-card"></i> ACADEMY HUB</button>
            </nav>

            <main id="stage-content" style="flex:1; overflow:hidden;"></main>

            <aside id="tools-sidebar">
                <div style="padding: 20px; font-size: 10px; color: #444; letter-spacing: 2px;">NEURAL REPORTER // LIVE-DESK</div>
                <div id="ai-log">
                    <div class="ai-bubble toni">
                        <small>TONI REPORTER</small>
                        Willkommen in der Redaktion. Drücken Sie den Live-Button, um das Interview per Sprache zu führen, oder nutzen Sie das Textfeld.
                    </div>
                </div>
                
                <div style="padding:20px; border-top:1px solid #1a1a1d; background:#080808;">
                    <button id="live-voice-btn" class="live-btn" onclick="toggleVoiceAI()">
                        <i class="fa-solid fa-microphone"></i> VOICE REPORTER MODE
                    </button>
                    
                    <div id="interview-controls" style="margin-top:15px;">
                        <input type="text" id="ai-chat-input" style="width:100%; padding:12px; background:#111; border:1px solid #333; color:#fff; margin-bottom:10px;" placeholder="Antworten..." onkeypress="if(event.key==='Enter') processInterviewStep()">
                        <button class="btn-main" onclick="processInterviewStep()">ANTWORT SENDEN</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
