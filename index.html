<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Intelligence & Club HQ</title>
<style>
  :root {
    --bg: #010401;
    --neon: #39FF14;
    --neon-glow: rgba(57, 255, 20, 0.3);
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05);
  }
  
  * { box-sizing: border-box; }
  body, html { 
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* --- APP WRAPPER --- */
  .app-container {
    display: grid;
    grid-template-columns: 80px 1fr 380px;
    height: 100vh; padding: 12px; gap: 12px;
  }

  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
    .overlay { inset: 5px !important; width: 98% !important; }
  }

  /* --- NAV --- */
  .left-nav { background: var(--glass); border-radius: 15px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; backdrop-filter: blur(10px); }
  .nav-item { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; transition: 0.3s; }
  .nav-item:hover { background: var(--neon-glow); box-shadow: 0 0 15px var(--neon); }

  /* --- ARENA --- */
  .center-arena { background: #000; border-radius: 15px; border: 1px solid rgba(57,255,20,0.1); display: flex; flex-direction: column; padding: 10px; position: relative; }
  canvas { background: #010a01; border-radius: 8px; box-shadow: 0 0 40px #000; max-width: 100%; height: auto; }

  /* --- TONI BOX --- */
  .right-toni { background: var(--glass); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px; border-radius: 12px; font-size: 13px; max-width: 85%; line-height: 1.4; }
  .msg.ai { background: rgba(57, 255, 20, 0.08); align-self: flex-start; border-left: 3px solid var(--neon); }

  /* --- OVERLAYS --- */
  .overlay { position: fixed; inset: 20px 400px 20px 100px; background: rgba(3, 8, 3, 0.99); border: 1px solid var(--neon); border-radius: 20px; z-index: 1000; display: none; flex-direction: column; padding: 25px; backdrop-filter: blur(25px); overflow: hidden; }
  .scroll-box { flex: 1; overflow-y: auto; padding-top: 10px; }

  /* --- FIFA CARDS --- */
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  .fifa-card { width: 160px; height: 230px; background: var(--gold); border-radius: 10px; color: #000; position: relative; padding: 10px; cursor: pointer; font-family: 'Arial Black', sans-serif; }
  .card-rating { font-size: 38px; position: absolute; top: 10px; left: 10px; }
  .card-photo { width: 95px; height: 95px; background: rgba(0,0,0,0.1); margin: 5px auto 0 auto; border-bottom: 2px solid #000; overflow: hidden; display: flex; align-items: flex-end; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; font-size: 11px; padding: 5px 10px 0 10px; }

  /* --- ONBOARDING & SCREENS --- */
  .screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; padding: 20px; text-align: center; }
  .input-field { background: #111; border: 1px solid var(--neon); color: #fff; padding: 15px; border-radius: 8px; width: 100%; max-width: 300px; text-align: center; }
  .btn-primary { background: var(--neon); border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div id="onboarding" class="screen">
  <h1 style="color:var(--neon); letter-spacing: 5px;">TONI 2.0</h1>
  <div id="ob-step1">
    <p>Hallo Coach! Ich bin Toni, dein KI-Co-Trainer.<br>Wie darf ich dich nennen?</p>
    <input type="text" id="coachName" class="input-field" placeholder="Dein Name">
    <br><br>
    <button class="btn-primary" onclick="obStep(2)">WEITER</button>
  </div>
  <div id="ob-step2" style="display:none">
    <p>Sehr schön. Welchen Verein führen wir zum Erfolg?</p>
    <input type="text" id="clubName" class="input-field" placeholder="z.B. FC Bad Hersfeld">
    <br><br>
    <button class="btn-primary" onclick="obStep(3)">WEITER</button>
  </div>
  <div id="ob-step3" style="display:none">
    <p>Und für welche Altersklasse bist du zuständig?</p>
    <input type="text" id="ageGroup" class="input-field" placeholder="z.B. U19 oder 1. Herren">
    <br><br>
    <button class="btn-primary" onclick="completeOnboarding()">SYSTEM STARTEN</button>
  </div>
</div>

<div class="app-container" id="mainApp" style="display:none;">
  <div class="left-nav">
    <div class="nav-item" onclick="openSektor('kabine')">💼</div>
    <div class="nav-item" onclick="openSektor('business')">🤝</div>
    <div class="nav-item" onclick="openSektor('kids')">👶</div>
    <div class="nav-item" onclick="openSektor('analyse')">🧪</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="openSektor('zeitung')">📰</div>
  </div>

  <div class="center-arena">
    <div style="display:flex; justify-content:space-between; padding:5px 15px; color:var(--neon); font-size:12px;">
        <strong id="displayClub">CLUB HQ</strong>
        <span id="displayAge">[ LADE... ]</span>
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <canvas id="mainBoard" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="font-weight:bold; color:var(--neon); display:flex; justify-content:space-between;">TONI AI <span>ONLINE</span></div>
    <div class="chat-history" id="chat"></div>
    <div style="display:flex; gap:10px;">
      <input type="text" id="cmd" placeholder="Befehl..." style="flex:1; background:#111; border:1px solid #333; color:#fff; padding:12px; border-radius:10px;">
      <button onclick="sendBefehl()" style="background:var(--neon); border:none; border-radius:10px; padding:0 15px; cursor:pointer;">➔</button>
    </div>
  </div>
</div>

<div id="ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h2 id="ov-title" style="margin:0; color:var(--neon); letter-spacing:2px;">HUB</h2>
    <span onclick="closeOverlay()" style="cursor:pointer; font-size:30px;">✕</span>
  </div>
  <div class="scroll-box" id="ov-content"></div>
</div>

<script>
  const canvas = document.getElementById('mainBoard');
  const ctx = canvas.getContext('2d');
  
  let userData = JSON.parse(localStorage.getItem('toni_user')) || null;
  let team = JSON.parse(localStorage.getItem('toni_team_v31')) || [
    {id:0, name:'Müller', rating:91, pos:'ST', x:200, y:350, img:'', pac:88, sho:92, pas:80, dri:85, def:40, phy:85}
  ];

  // ONBOARDING LOGIC
  function obStep(step) {
    document.getElementById('ob-step1').style.display = 'none';
    document.getElementById('ob-step2').style.display = 'none';
    document.getElementById('ob-step3').style.display = 'none';
    document.getElementById('ob-step'+step).style.display = 'block';
  }

  function completeOnboarding() {
    userData = {
      coach: document.getElementById('coachName').value || 'Coach',
      club: document.getElementById('clubName').value || 'Mein Verein',
      age: document.getElementById('ageGroup').value || 'Senioren'
    };
    localStorage.setItem('toni_user', JSON.stringify(userData));
    startApp();
  }

  function startApp() {
    if(!userData) return;
    document.getElementById('onboarding').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('displayClub').innerText = userData.club.toUpperCase();
    document.getElementById('displayAge').innerText = `[ ${userData.age.toUpperCase()} ]`;
    
    renderArena();
    greetCoach();
  }

  function greetCoach() {
    const text = `Hallo ${userData.coach}! Ich bin bereit. Wir starten für den ${userData.club} in der Altersklasse ${userData.age}. Wie kann ich heute helfen?`;
    addChat(text);
    // Voice output (optional)
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'de-DE';
    window.speechSynthesis.speak(msg);
  }

  // BUSINESS LOGIC
  function openSektor(s) {
    document.getElementById('ov').style.display = 'flex';
    const c = document.getElementById('ov-content');
    const t = document.getElementById('ov-title');
    c.innerHTML = '';

    if(s === 'business') {
      t.innerText = 'MANAGEMENT & SPONSORING';
      c.innerHTML = `
        <div style="background:var(--glass); padding:15px; border-radius:10px; border-left:4px solid var(--neon); margin-bottom:20px;">
            <strong>Toni Sponsor-Radar:</strong> Ich habe lokale Partner im Umkreis von ${userData.club} analysiert.
        </div>
        <div style="display:grid; gap:10px;">
            <div style="padding:15px; background:rgba(255,255,255,0.02); border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <span>Autohaus Region Süd</span>
                <button onclick="generateMail('Autohaus Region Süd')" class="btn-primary" style="padding:5px 10px; font-size:10px;">MAIL ENTWERFEN</button>
            </div>
            <div style="padding:15px; background:rgba(255,255,255,0.02); border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                <span>Bauunternehmen Müller</span>
                <button onclick="generateMail('Bauunternehmen Müller')" class="btn-primary" style="padding:5px 10px; font-size:10px;">MAIL ENTWERFEN</button>
            </div>
        </div>
        <div id="mailPreview" style="margin-top:20px; font-size:12px; white-space:pre-wrap; background:#000; padding:15px; border-radius:5px; display:none; border:1px solid #333;"></div>
      `;
    } else if(s === 'kabine') {
      t.innerText = 'SQUAD REPOSITORY';
      c.className = 'scroll-box fifa-grid';
      team.forEach(p => {
        c.innerHTML += `<div class="fifa-card"><div class="card-rating">${p.rating}</div><div class="card-photo">${p.img?`<img src="${p.img}">`:'👤'}</div><div class="card-name">${p.name}</div><div class="attr-grid"><span>PAC ${p.pac}</span><span>DRI ${p.dri}</span><span>SHO ${p.sho}</span><span>DEF ${p.def}</span></div></div>`;
      });
    }
  }

  function generateMail(firma) {
    const preview = document.getElementById('mailPreview');
    const text = `Betreff: Sponsoring-Anfrage - ${userData.club}

Sehr geehrte Damen und Herren des ${firma},

mein Name ist ${userData.coach} vom ${userData.club}. Wir suchen starke regionale Partner für unsere ${userData.age}. 

Wir bieten Ihnen attraktive Logoplatzierungen in unserer neuen Stadionzeitung und auf unseren Social Media Kanälen. Hätten Sie Zeit für ein kurzes Gespräch?

Beste Grüße,
${userData.coach}
${userData.club}`;
    preview.innerText = text;
    preview.style.display = 'block';
    addChat(`Toni: Ich habe den Entwurf für ${firma} erstellt. Du kannst ihn oben kopieren.`);
  }

  // ARENA LOGIC (Restored Build 2.7+)
  function drawPitch() {
    ctx.fillStyle = '#021202'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.4)'; ctx.lineWidth = 3;
    ctx.strokeRect(40, 40, canvas.width-80, canvas.height-80);
    ctx.beginPath(); ctx.moveTo(canvas.width/2, 40); ctx.lineTo(canvas.width/2, canvas.height-40); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 80, 0, Math.PI*2); ctx.stroke();
  }

  function renderArena() { drawPitch(); team.forEach(p => { ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill(); }); }
  function addChat(t) { const c = document.getElementById('chat'); c.innerHTML += `<div class="msg ai">${t}</div>`; c.scrollTop = c.scrollHeight; }
  function closeOverlay() { document.getElementById('ov').style.display = 'none'; }

  // START CHECK
  if(userData) startApp(); else document.getElementById('onboarding').style.display = 'flex';
</script>
</body>
</html>
