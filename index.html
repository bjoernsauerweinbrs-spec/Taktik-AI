<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — High Professional AI</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/hologram.css">
</head>
<body>
    <aside class="sidebar">
        <div class="nav-icon active" onclick="switchMainView('board')">📊</div>
        <div class="nav-icon" onclick="switchMainView('training')">📅</div>
        <div class="nav-icon" onclick="switchMainView('briefcase')">💼</div>
    </aside>

    <main id="stage">
        <div class="tools-overlay">
            <button class="tool-btn" onclick="arena.setMode('standard')">Standard</button>
            <button class="tool-btn" onclick="arena.setMode('funinho')">Funinho</button>
            <button class="tool-btn" onclick="triggerToniAnalysis()" style="color: #00D1FF;">KI-Scan</button>
            <button class="tool-btn danger" onclick="arena.clear()">Löschen</button>
        </div>
        <canvas id="main-canvas"></canvas>
    </main>

    <aside class="analysis-panel">
        <h2>Analysezentrum</h2>
        <div id="setcard-content">
            <p>Wähle ein Modul...</p>
        </div>
    </aside>

    <div id="hologram-container">
        <div class="holo-ring"></div>
        <div id="hologram-status">Toni Standby</div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="engine/players.js"></script>
    <script src="engine/analysis-ai.js"></script>
    <script src="voice/voice-output.js"></script>
    <script src="voice/hologram-effects.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            arena.init('main-canvas');
            arena.players = [
                { id: 1, name: "Luiz", number: 4, x: 200, y: 400, team: 'home' },
                { id: 2, name: "Silva", number: 3, x: 350, y: 400, team: 'home' },
                { id: 3, name: "Dani", number: 2, x: 500, y: 400, team: 'home' }
            ];
            if (window.Hologram) window.Hologram.init();
        });

        function triggerToniAnalysis() {
            const report = AnalysisAI.scanBoard();
            if (window.toniSpeak) toniSpeak(report);
        }
    </script>
</body>
</html>
