<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - ACCESS CONTROL</title>
    <style>
        body { background: #050505; color: #39FF14; font-family: 'Orbitron', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .login-box { border: 1px solid #39FF14; padding: 50px; background: rgba(0,0,0,0.9); text-align: center; box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); border-radius: 5px; }
        h2 { letter-spacing: 5px; margin-bottom: 30px; font-size: 1.5rem; }
        input { background: #000; border: 1px solid #39FF14; color: #39FF14; padding: 15px; margin-bottom: 20px; width: 250px; text-align: center; font-size: 1.1rem; outline: none; }
        button { background: #39FF14; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 2px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #39FF14; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>IDENTIFICATION</h2>
        <input type="password" id="pass" placeholder="••••••••" autofocus>
        <br>
        <button onclick="check()">ENTRANCE</button>
    </div>
    <script>
        function check() {
            if(document.getElementById('pass').value === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                window.location.href = 'app.html';
            } else {
                alert("ACCESS DENIED");
            }
        }
        // Enter-Taste Support
        document.getElementById('pass').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') check();
        });
    </script>
</body>
</html>
