<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Coach - Taktikboard & Kabine</title>
    <style>
        :root {
            --bg-black: #000000;
            --neon-green: #39FF14;
            --panel-gray: #0a0a0a;
            --text-white: #ffffff;
            --ui-border: #1a1a1a;
            --card-gold: linear-gradient(135deg, #39FF14 0%, #006400 100%);
            --card-silver: linear-gradient(135deg, #a1a1a1 0%, #4b4b4b 100%);
            --card-bronze: linear-gradient(135deg, #804a00 0%, #3d2300 100%);
        }

        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background-color: var(--bg-black); color: var(--text-white); 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
        }

        .wrapper { display: flex; flex-direction: column; height: 100vh; }
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* LINKES PANEL */
        .column-left { 
            width: 120px; background: var(--panel-gray); border-right: 1px solid var(--ui-border); 
            display: flex; flex-direction: column; align-items: center; padding-top: 30px; z-index: 200;
        }
        .briefcase-container { text-align: center; cursor: pointer; }
        .briefcase-icon { font-size: 50px; filter: drop-shadow(0 0 8px rgba(57, 255, 20, 0.3)); }

        /* BRIEFCASE MENU */
        .briefcase-menu {
            display: none; position: absolute; left: 130px; top: 20px; 
            background: rgba(10, 10, 10, 0.95); border: 1px solid var(--neon-green);
            border-radius: 12px; width: 220px; padding: 15px; z-index: 300;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }
        .briefcase-menu.active { display: block; }
        .tile {
            background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px;
            margin-bottom: 10px; cursor: pointer; text-align: center; transition: 0.3s;
        }
        .tile:hover { border-color: var(--neon-green); background: #1a1a1a; }
        .tile-icon { font-size: 24px; display: block; margin-bottom: 5px; }

        /* KABINE OVERLAY */
        #locker-room {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 40px;
        }
        .locker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--neon-green); padding-bottom: 10px; }
        .close-btn { color: var(--neon-green); font-size: 30px; cursor: pointer; }

        /* FIFA KARTEN GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* FIFA KARTE DESIGN */
        .fifa-card {
            width: 200px; height: 280px; background: #111; border-radius: 10px;
            position: relative; padding: 10px; border: 2px solid #333;
            transition: transform 0.3s, border-color 0.3s;
        }
        .fifa-card.gold { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }
        .fifa-card.silver { border-color: #a1a1a1; }
        .fifa-card.bronze { border-color: #804a00; }

        .card-ovr { position: absolute; top: 15px; left: 15px; font-size: 28px; font-weight: 900; color: var(--text-white); }
        .card-pos { position: absolute; top: 45px; left: 15px; font-size: 14px; opacity: 0.8; }
        
        .card-img-placeholder {
            width: 100px; height: 100px; margin: 10px auto; 
            background: linear-gradient(45deg, #111, #222); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-name { text-align: center; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        .card-stats { display: grid; grid-template-columns: 1fr 1fr; font-size: 11px; gap: 5px; }
        .stat-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 2px 5px; border-radius: 3px; }
        .stat-item input { width: 30px; background: transparent; border: none; color: var(--neon-green); text-align: right; font-weight: bold; font-family: inherit; }

        /* SPIELFELD */
        .column-middle { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
        #soccer-field { width: 100%; max-width: 800px; aspect-ratio: 1.5; border: 3px solid var(--neon-green); position: relative; }
        .field-line { position: absolute; background-color: var(--neon-green); }
        .center-line { left: 50%; top: 0; bottom: 0; width: 2px; }

        /* RECHTS: Toni */
        .column-right { width: 250px; background: var(--panel-gray); border-left: 1px solid var(--ui-border); display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .toni-img { width: 80px; height: 80px; border: 2px solid var(--neon-green); border-radius: 50%; background: #111; margin-bottom: 10px; }

        /* UNTEN: Bank */
        .bench-area { height: 100px; background: #050505; border-top: 1px solid var(--ui-border); display: flex; align-items: center; padding: 0 20px; }

        @media (max-width: 900px) {
            .main-content { flex-direction: column; overflow-y: auto; }
            .column-left, .column-right { width: 100%; height: auto; flex-direction: row; padding: 10px; }
            .briefcase-menu { left: 10px; top: 80px; width: 95%; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="main-content">
            <aside class="column-left">
                <div class="briefcase-container" onclick="toggleBriefcase()">
                    <div class="briefcase-icon">💼</div>
                    <div style="font-size: 10px; font-weight: bold; color: #444; margin-top: 5px;">MENÜ</div>
                </div>

                <div id="briefcase-menu" class="briefcase-menu">
                    <div class="tile" onclick="openLockerRoom()">
                        <span class="tile-icon">🏟️</span>
                        <strong style="font-size: 12px; color: var(--neon-green);">1. MANNSCHAFT</strong>
                        <p style="font-size: 9px; color: #666; margin: 0;">Spielerkabine & Werte</p>
                    </div>
                    <div class="tile">
                        <span class="tile-icon">📈</span>
                        <strong style="font-size: 12px;">ANALYSE</strong>
                    </div>
                </div>
            </aside>

            <main class="column-middle">
                <div id="soccer-field">
                    <div class="field-line center-line"></div>
                </div>
            </main>

            <aside class="column-right">
                <div class="toni-img"></div>
                <span style="color: var(--neon-green); font-weight: bold;">TONI</span>
                <p style="font-size: 11px; color: #555;">Co-Trainer bereit</p>
            </aside>
        </div>
        <footer class="bench-area">
            <div style="color: #222; font-size: 12px; font-weight: bold; margin-right: 20px;">BANK</div>
        </footer>
    </div>

    <div id="locker-room">
        <div class="locker-header">
            <h2 style="color: var(--neon-green); margin: 0;">KABINE: 1. MANNSCHAFT</h2>
            <div class="close-btn" onclick="closeLockerRoom()">×</div>
        </div>
        <div class="cards-grid" id="player-cards-container">
            </div>
    </div>

    <script>
        function toggleBriefcase() {
            document.getElementById('briefcase-menu').classList.toggle('active');
        }

        function openLockerRoom() {
            document.getElementById('locker-room').style.display = 'block';
            toggleBriefcase();
            generateCards();
        }

        function closeLockerRoom() {
            document.getElementById('locker-room').style.display = 'none';
        }

        // Spieler-Daten & Karten-Generierung
        const statsKeys = ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'];
        
        function generateCards() {
            const container = document.getElementById('player-cards-container');
            if(container.innerHTML !== "") return; // Nur einmal generieren

            for(let i = 1; i <= 16; i++) {
                const card = document.createElement('div');
                card.className = 'fifa-card gold';
                card.id = `card-${i}`;
                
                // Fantasy Werte initial
                let html = `
                    <div class="card-ovr" id="ovr-${i}">80</div>
                    <div class="card-pos">ST</div>
                    <div class="card-img-placeholder">👤</div>
                    <div class="card-name" contenteditable="true">SPIELER ${i}</div>
                    <div class="card-stats">
                `;

                statsKeys.forEach(stat => {
                    html += `
                        <div class="stat-item">
                            <span>${stat}</span>
                            <input type="number" value="80" min="1" max="99" 
                                onchange="calculateOVR(${i})" id="stat-${stat}-${i}">
                        </div>
                    `;
                });

                html += `</div>`;
                card.innerHTML = html;
                container.appendChild(card);
                calculateOVR(i); // Initialfarbe setzen
            }
        }

        function calculateOVR(id) {
            let total = 0;
            statsKeys.forEach(stat => {
                total += parseInt(document.getElementById(`stat-${stat}-${id}`).value) || 0;
            });
            
            const ovr = Math.round(total / 6);
            const ovrDisplay = document.getElementById(`ovr-${id}`);
            const cardElement = document.getElementById(`card-${id}`);
            
            ovrDisplay.innerText = ovr;

            // Farbe basierend auf OVR ändern
            cardElement.classList.remove('gold', 'silver', 'bronze');
            if(ovr >= 75) {
                cardElement.classList.add('gold');
                cardElement.style.background = "linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%)";
            } else if(ovr >= 65) {
                cardElement.classList.add('silver');
                cardElement.style.background = "linear-gradient(135deg, #0f0f0f 0%, #222 100%)";
            } else {
                cardElement.classList.add('bronze');
                cardElement.style.background = "linear-gradient(135deg, #050505 0%, #111 100%)";
            }
        }
    </script>
</body>
</html>
