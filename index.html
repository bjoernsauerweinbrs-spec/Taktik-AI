<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | AUTHENTICATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@500&display=swap" rel="stylesheet">
    <style>
        /* AUTH CSS - KOMPLETT ISOLIERT */
        body { margin: 0; background: #030305; color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .login-box { width: 400px; padding: 60px; text-align: center; border: 1px solid #1a1a1d; background: #000; box-shadow: 0 0 50px rgba(0, 243, 255, 0.05); }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; background: linear-gradient(to right, #bf953f, #fcf6ba, #bf953f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 44px; margin-bottom: 30px; }
        .input-field { width: 100%; padding: 15px; background: #0a0a0c; border: 1px solid #222; color: #fff; font-family: 'Orbitron'; text-align: center; margin-bottom: 20px; letter-spacing: 3px; }
        .btn-enter { width: 100%; padding: 15px; background: transparent; border: 1px solid #00f3ff; color: #00f3ff; font-family: 'Orbitron'; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.4s; }
        .btn-enter:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">TONI 2.0</div>
        <input type="password" id="access-code" class="input-field" placeholder="PASSCODE">
        <button class="btn-enter" onclick="validate()">INITIALISIEREN</button>
    </div>

    <script>
        function validate() {
            // Einfacher Redirect - hier kommt später dein echtes Passwort-Check-System rein
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
