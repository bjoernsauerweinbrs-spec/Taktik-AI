<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Tactical Masterclass</title>
    <style>
        * { box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #000; color: #fff; overflow: hidden; }
        
        #header { background: #111; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 2px solid #00ff88; }
        .btn { background: #222; color: #00ff88; border: 1px solid #00ff88; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #00ff88; color: #000; }

        #pitch-area { flex: 2; position: relative; padding: 10px; display: flex; justify-content: center; }
        #pitch { 
            width: 100%; height: 100%; background: #2e7d32; border: 3px solid #fff; position: relative; border-radius: 4px;
            background-image: repeating-linear-gradient(0deg, #2e7d32, #2e7d32 10%, #2a722d 10%, #2a722d 20%);
        }
        
        /* Markierungen */
        .line { position: absolute; background: rgba(255,255,255,0.6); pointer-events: none; }
        .center-circle { width: 100px; height: 100px; border: 2px solid #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.5; }
        
        /* Tore */
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.1); z-index: 5; }
        .std-goal { width: 80px; height: 25px; left: 50%; transform: translateX(-50%); }
        .fun-goal { width: 45px; height: 15px; }

        /* Akteure */
        .player { 
            width: 34px; height: 34px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px; cursor: move; z-index: 50;
            border: 2px solid #fff; transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); touch-action: none;
        }
        .red { background: radial-gradient(circle, #f00, #900); }
        .blue { background: radial-gradient(circle, #007bff, #003d7a); }
        .ball { width: 20px; height: 20px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; box-shadow: 0 0 10px #fff; }

        /* Chat */
        #chat { height: 35%; background: #fff; color: #000; display: flex; flex-direction: column; border-top: 4px solid #00ff88; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 8px; }
        .ai { background: #f0f0f0; border-left: 5px solid #2e7d32; font-style: italic; }
        .user { background: #e3f2fd; border-right: 5px solid #007bff; text-align: right; }

        #input-row { padding: 10px; background: #ddd; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        button.icon { background: none; border: none; font-size: 26px; cursor: pointer; }
    </style>
</head>
<body>

<div id="header">
    <button class="btn" onclick="setBoard('funino')">Funino (3v3)</button>
    <button class="btn" onclick="setBoard('11v11')">Pro (11v11)</button>
</div>

<div id="pitch-area">
    <div id="pitch">
        <div class="line" style="width: 100%; height: 2px; top: 50%;"></div>
        <div class="center-circle"></div>
        <div id="ball" class="player ball" style="top: 48%; left: 48%;"></div>
        <div id="players-layer"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="user-input" placeholder="Frag den Master...">
        <button class="icon" onclick="startMic()">🎤</button>
        <button class="icon" onclick="sendMsg()">➤</button>
    </div>
</div>

<script>
    const layer = document.getElementById('players-layer');
    const log = document.getElementById('log');
    const input = document.getElementById('user-input');
    const ball = document.getElementById('ball');

    function speak(txt) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(txt); m.lang = 'de-DE'; m.rate = 1.0;
            window.speechSynthesis.speak(m);
        }
    }

    function addLog(who, txt, isAi) {
        const d = document.createElement('div');
        d.className = 'msg ' + (isAi ? 'ai' : 'user');
        d.innerHTML = `<b>${who}:</b> ${txt}`;
        log.appendChild(d); log.scrollTop = log.scrollHeight;
        if(isAi) speak(txt);
    }

    function setBoard(mode) {
        layer.innerHTML = "";
        document.querySelectorAll('.goal').forEach(g => g.remove());
        
        if(mode === 'funino') {
            [[0,15],[0,75],[96,15],[96,75]].forEach(p => drawGoal(p[0], p[1], 'fun-goal'));
            for(let i=0; i<3; i++) { createP(75, 20+i*30, 'red', i+1); createP(20, 20+i*30, 'blue', i+1); }
            addLog("Gemini", "Funino-Modus. Vier Tore. Wer hier nicht trifft, sollte über Hallenhalma nachdenken.", true);
        } else {
            drawGoal(0, 42, 'std-goal'); drawGoal(96, 42, 'std-goal');
            // Home 4-4-2
            const h = [{t:90,l:47},{t:75,l:15},{t:78,l:35},{t:78,l:58},{t:75,l:80},{t:55,l:15},{t:58,l:35},{t:58,l:58},{t:55,l:80},{t:35,l:40},{t:35,l:55}];
            // Away 3-4-3
            const a = [{t:5,l:47},{t:20,l:25},{t:18,l:47},{t:20,l:70},{t:35,l:10},{t:38,l:35},{t:38,l:58},{t:35,l:85},{t:50,l:25},{t:53,l:47},{t:50,l:70}];
            h.forEach((p, i) => createP(p.t, p.l, 'red', i+1, i===10?'luiz':''));
            a.forEach((p, i) => createP(p.t, p.l, 'blue', i+1));
            addLog("Gemini", "Elf gegen Elf. Wahre Taktik für wahre Kenner. David Luiz ist natürlich gesetzt.", true);
        }
        initDrag();
    }

    function drawGoal(t, l, c) {
        const g = document.createElement('div'); g.className = 'goal ' + c;
        g.style.top = t + "%"; g.style.left = l + "%";
        document.getElementById('pitch').appendChild(g);
    }

    function createP(t, l, c, n, id) {
        const p = document.createElement('div'); p.className = `player ${c}`;
        if(id) p.id = id; p.style.top = t + "%"; p.style.left = l + "%"; p.innerText = n;
        layer.appendChild(p);
    }

    function sendMsg() {
        const val = input.value; if(!val) return;
        addLog("Björn", val, false);
        let r = "Das ist so kreativ wie ein Querpass beim Stand von 0:5. Versuch es nochmal!";
        if(val.toLowerCase().includes("rechts")) { ball.style.left = "85%"; r = "Ball auf rechts. Breit stehen, groß denken."; }
        else if(val.toLowerCase().includes("umstellen")) { 
            document.querySelectorAll('.red').forEach(p => { p.style.left = (Math.random()*80+10)+"%"; p.style.top = (Math.random()*40+50)+"%"; });
            r = "Taktik-Update läuft. Ich habe das System revolutioniert, während du noch tippst.";
        }
        setTimeout(() => addLog("Gemini", r, true), 600);
        input.value = "";
    }

    function initDrag() {
        document.querySelectorAll('.player').forEach(p => {
            let drag = false;
            p.onmousedown = p.ontouchstart = (e) => { drag = true; p.style.transition = "none"; e.preventDefault(); };
            window.onmousemove = window.ontouchmove = (e) => {
                if(!drag) return;
                const r = document.getElementById('pitch').getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - r.left;
                const y = (e.clientY || e.touches[0].clientY) - r.top;
                p.style.left = (x/r.width*100)-3+"%"; p.style.top = (y/r.height*100)-3+"%";
            };
            window.onmouseup = window.ontouchend = () => { drag = false; p.style.transition = "all 1s ease"; };
        });
    }

    function startMic() {
        if('webkitSpeechRecognition' in window) {
            const rec = new webkitSpeechRecognition(); rec.lang = 'de-DE';
            rec.onresult = (e) => { input.value = e.results[0][0].transcript; sendMsg(); };
            rec.start();
        }
    }

    input.onkeypress = (e) => { if(e.key === 'Enter') sendMsg(); };
    window.onload = () => setBoard('11v11');
</script>
</body>
</html>
