<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni AI - V9 Scanner</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #app { background: white; width: 95%; max-width: 500px; height: 90vh; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #1a1a1a; color: white; padding: 15px; text-align: center; font-weight: bold; border-bottom: 4px solid #28a745; }
        #login-screen, #chat-screen { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        input { padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { background: #28a745; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        #chat-history { flex: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; line-height: 1.4; font-size: 0.9rem; }
        .toni { align-self: flex-start; background: #eee; color: #333; }
        .scanner-box { font-size: 0.7rem; background: #fff3cd; padding: 10px; border: 1px solid #ffeeba; border-radius: 5px; margin-top: 10px; overflow-y: auto; max-height: 150px; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">⚽ COACH TONI - V9 (SYSTEM-SCANNER)</div>
    
    <div id="login-screen">
        <h2 style="text-align:center">Trainer Login</h2>
        <input type="text" id="username" placeholder="Dein Name">
        <input type="password" id="password" placeholder="Passwort (Trainer2026)">
        <input type="text" id="user-key" placeholder="Google API-Key">
        <button onclick="startToni()">Toni aktivieren</button>
    </div>

    <div id="chat-screen" style="display:none">
        <div id="chat-history"></div>
        <button onclick="scanModels()" style="background: #17a2b8;">🔍 Welche Modelle habe ich?</button>
        <div id="model-list" class="scanner-box" style="display:none"></div>
        
        <div style="display:flex; gap:5px; margin-top:10px;">
            <input type="text" id="user-input" style="flex:1" placeholder="Frag Toni...">
            <button onclick="askToni()">Senden</button>
        </div>
    </div>
</div>

<script>
    let USER_KEY = "";

    function startToni() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const key = document.getElementById('user-key').value.trim();

        if (user && pass === "Trainer2026" && key.startsWith("AIza")) {
            USER_KEY = key;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            addMsg("toni", "Scanner bereit. Klicke auf den blauen Button, um zu sehen, welche Modelle dein Key erlaubt.");
        } else {
            alert("Passwort oder Key prüfen!");
        }
    }

    async function scanModels() {
        const listDiv = document.getElementById('model-list');
        listDiv.style.display = "block";
        listDiv.innerText = "Suche Modelle...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${USER_KEY}`);
            const data = await response.json();
            
            if (data.models) {
                const names = data.models.map(m => m.name.replace("models/", "")).join(", ");
                listDiv.innerText = "Verfügbare Modelle: " + names;
            } else {
                listDiv.innerText = "Keine Modelle gefunden. Fehler: " + JSON.stringify(data.error);
            }
        } catch (e) {
            listDiv.innerText = "Scanner-Fehler: Verbindung fehlgeschlagen.";
        }
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addMsg("user", text);
        input.value = "";

        // Wir probieren es direkt mit der Standard-URL
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${USER_KEY}`;
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });
            const data = await response.json();
            if (data.candidates) {
                addMsg("toni", data.candidates[0].content.parts[0].text);
            } else {
                addMsg("toni", "Fehler: " + (data.error ? data.error.message : "Unbekannt"));
            }
        } catch (e) {
            addMsg("toni", "Verbindung abgebrochen.");
        }
    }

    function addMsg(role, text) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
