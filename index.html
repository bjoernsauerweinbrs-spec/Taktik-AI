<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | ELITE COMMAND CENTER</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="role-admin">

    <nav class="top-nav">
        <div class="logo">TONI 2.0 <span class="elite-tag">ELITE</span></div>
        <div class="role-selector">
            <button onclick="setRole('trainer')" class="role-btn active">TRAINER-MODE</button>
            <button onclick="setRole('manager')" class="role-btn">MANAGER-LAB</button>
        </div>
        <div id="system-clock"></div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <div class="nav-group">
                <p>PERFORMANCE</p>
                <button onclick="showModule('tactic-board')">📋 Taktik-Board</button>
                <button onclick="showModule('vr-center')">🥽 VR-Training</button>
                <button onclick="showModule('locker-room')">👤 Kabine</button>
            </div>
            <div class="nav-group">
                <p>OPERATIONS</p>
                <button onclick="showModule('mgmt-lab')">💼 Finanz-Labor</button>
                <button onclick="showModule('press-center')">🗞️ Redaktion</button>
            </div>
            <button class="mic-btn" id="mic-btn" onclick="voiceEngine.toggle()">🎤 KI ANALYSE STARTEN</button>
        </aside>

        <main class="viewport">
            <section id="tactic-board" class="module active">
                <div class="module-header">
                    <h2>Taktik-Analyse & Drills</h2>
                    <div class="controls">
                        <button onclick="setFormation('4-4-2')">4-4-2 (Toni)</button>
                        <button onclick="setFormation('3-4-3')">3-4-3 (Gegner)</button>
                    </div>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="mainBoard"></canvas>
                </div>
            </section>

            <section id="vr-center" class="module">
                <div class="vr-overlay-ui">
                    <h2>VR Simulation <small>Meta Quest Mode</small></h2>
                    <p>Sensomotorisches Training für Reha & Offensive</p>
                </div>
                <a-scene embedded vr-mode-ui="enabled: true">
                    <a-sky color="#020617"></a-sky>
                    <a-plane position="0 0 0" rotation="-90 0 0" width="68" height="105" color="#14532d"></a-plane>
                    <a-entity id="vr-players"></a-entity>
                    <a-entity id="toni-coach" position="35 0 0">
                        <a-cylinder color="#22c55e" height="1.8" radius="0.4"></a-cylinder>
                        <a-text value="COACH TONI" position="0 2 0" align="center"></a-text>
                    </a-entity>
                    <a-camera position="0 15 30" rotation="-30 0 0"></a-camera>
                </a-scene>
            </section>

            <section id="mgmt-lab" class="module">
                <h2>Finanz-Matrix & ROI Analysis</h2>
                <div class="mgmt-grid" id="mgmt-content"></div>
            </section>

            <section id="locker-room" class="module">
                <h2>Kader-Register & Medical Check</h2>
                <div class="card-grid" id="player-container"></div>
            </section>
        </main>
    </div>

    <script src="modules/management.js"></script>
    <script src="script.js"></script>
</body>
</html>
