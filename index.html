<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | VR TEST MODE</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene renderer="antialias: true; colorManagement: true;" vr-mode-ui="enabled: true">
        
        <a-sky color="#020617"></a-sky>
        <a-entity light="type: ambient; intensity: 0.5"></a-entity>
        <a-entity light="type: directional; intensity: 1; position: -1 2 1"></a-entity>

        <a-plane position="0 0 0" rotation="-90 0 0" width="68" height="105" color="#14532d"></a-plane>
        <a-ring color="white" radius-inner="9.1" radius-outer="9.2" rotation="-90 0 0" position="0 0.01 0"></a-ring>

        <a-entity id="toni-avatar" position="36 0 0">
            <a-cylinder color="#22c55e" height="1.8" radius="0.4"></a-cylinder>
            <a-text value="COACH TONI" position="0 2.2 0" align="center" width="6" side="double"></a-text>
        </a-entity>

        <a-entity id="players-layer">
            <a-cylinder position="-10 0.9 15" radius="0.5" height="1.8" color="red"></a-cylinder>
            <a-cylinder position="10 0.9 15" radius="0.5" height="1.8" color="red"></a-cylinder>
            <a-cylinder position="0 0.9 -5" radius="0.5" height="1.8" color="blue"></a-cylinder>
        </a-entity>

        <a-entity id="rig" movement-controls="speed: 0.3" position="0 0 10">
            <a-camera position="0 1.7 0" look-controls>
                <a-cursor color="#22c55e"></a-cursor>
                <a-text id="vr-status" value="SYSTEM: READY" position="0 -0.5 -1" align="center" width="2" color="#22c55e"></a-text>
            </a-camera>
            <a-entity oculus-touch-controls="hand: left"></a-entity>
            <a-entity oculus-touch-controls="hand: right"></a-entity>
        </a-entity>

    </a-scene>

    <script src="script.js"></script>
</body>
</html>
