<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Björn Taktikboard</title>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #top-bar { background: #333; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 2px solid #555; }
        #pitch-container { flex: 1; position: relative; background: #111; display: flex; justify-content: center; align-items: center; }
        #pitch { 
            width: 90%; height: 85%; background: #2d5a27; border: 3px solid white; position: relative;
            background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 100% 10%;
        }
        .mid-line { position: absolute; width: 100%; height: 2px; background: white; top: 50%; left: 0; }
        .player { 
            width: 32px; height: 32px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;
            border: 2px solid white; cursor: pointer; z-index: 10; touch-action: none;
        }
        .red { background: #d32f2f; }
        .blue { background: #1976d2; }
        #ball { width: 18px; height: 18px; background: white; border-radius: 50%; border: 2px solid black; z-index: 20; top: 48%; left: 49%; }
        
        #chat-section { height: 250px; background: #fff; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 10px; color: black; font-size: 14px; background: #f0f0f0; }
        #input-row { padding: 10px; display: flex; gap: 5px; background: #ddd; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="top-bar">
    <button onclick="setupField('11v11')">11 vs 11</button>
    <button onclick="setupField('funino')">Funino</button>
    <button onclick="askKey()" style="background:#444">🔑 Key eingeben</button>
</div>

<div id="pitch-container">
    <div id="pitch">
        <div class="mid-line"></div>
        <div id="ball" class="player"></div>
        <div id="player-layer"></div>
    </div>
</div>

<div id="chat-section">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="user-in" placeholder="Schreibe hier deine Taktik...">
        <button onclick="send()">Senden</button>
    </div>
</div>

<script>
    const pLayer = document.getElementById('player-layer');
    const ball = document.getElementById('ball');
    const log = document.getElementById('log');
    const input = document.getElementById('user-in');
    let apiKey = localStorage.getItem('bjorn_key_v19') || "";

    function askKey() {
        const k = prompt("Bitte Google API-Key einfügen:");
        if(k) { localStorage.setItem('bjorn_key_v19', k.trim()); location.reload(); }
    }

    function addLog(who, msg) {
        log.innerHTML += `<div><strong>${who}:</strong> ${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    function createPlayer(t, l, color, num) {
        const p = document.createElement('div');
        p.className = 'player ' + color;
        p.style.top = t + "%"; p.style.left = l + "%";
        p.innerText = num;
        pLayer.appendChild(p);
        drag(p);
    }

    function setupField(mode) {
        pLayer.innerHTML = "";
        if(mode === '11v11') {
            for(let i=0; i<11; i++) {
                createPlayer(70 + (i%3)*5, 10 + i*7, 'red', i+1);
                createPlayer(20 + (i%3)*5, 10 + i*7, 'blue', i+1);
            }
        } else {
            for(let i=0; i<3; i++) {
                createPlayer(75, 20+i*30, 'red', i+1);
                createPlayer(20, 20+i*30, 'blue', i+1);
            }
        }
    }

    async function send() {
        const val = input.value; if(!val) return;
        addLog("Björn", val); input.value = "";

        if(!apiKey) { addLog("System", "Bitte oben den 🔑 Key eingeben!"); return; }

        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist Fußball-Coach. Antworte kurz. Befehl: [BALL:X:Y]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            const txt = d.candidates[0].content.parts[0].text;
            addLog("Co-Trainer", txt);
            const bM = txt.match(/\[BALL:(\d+):(\d+)\]/);
            if(bM) { ball.style.left = bM[1]+"%"; ball.style.top = bM[2]+"%"; }
        } catch(e) { addLog("System", "Verbindungsfehler. Ist der Key korrekt?"); }
    }

    function drag(el) {
        let active = false;
        el.onmousedown = el.ontouchstart = () => { active = true; };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!active) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - r.left;
            const y = (e.clientY || e.touches[0].clientY) - r.top;
            el.style.left = (x/r.width*100)-2 + "%"; el.style.top = (y/r.height*100)-2 + "%";
        };
        window.onmouseup = window.ontouchend = () => { active = false; };
    }

    drag(ball);
    input.onkeypress = (e) => { if(e.key === 'Enter') send(); };
    setupField('11v11');
</script>
</body>
</html>
