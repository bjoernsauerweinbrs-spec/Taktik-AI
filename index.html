<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — Pro Coaching OS</title>
    <link rel="stylesheet" href="css/toni-style.css">
</head>
<body>
    <aside class="sidebar-minimal">
        <div class="main-briefcase-btn" onclick="BriefcaseUI.toggle()">
            <div style="font-size:35px;">💼</div>
            <span style="font-size:10px; font-weight:bold;">ZENTRALE</span>
        </div>
    </aside>

    <main id="stage">
        <div class="tools-overlay">
            <button class="tool-btn" onclick="arena.setMode('standard')">Standard</button>
            <button class="tool-btn" onclick="arena.setMode('funinho')">Funinho</button>
        </div>
        <canvas id="main-canvas"></canvas>
        <div id="hologram-ui" onclick="ToniAI.speak('Björn, ich analysiere die aktuelle Feldposition.')"></div>
    </main>

    <aside class="analysis-panel">
        <h2 class="panel-title">ANALYSEZENTRUM</h2>
        <div id="setcard-content">
            <p class="empty-msg">Wähle einen Spieler...</p>
        </div>
    </aside>

    <div id="briefcase-overlay" class="briefcase-overlay" style="display: none;">
        <div class="briefcase-header">
            <h1 class="glow-text">ZENTRALE AKTENTASCHE</h1>
            <button onclick="BriefcaseUI.toggle()" class="close-btn">✕</button>
        </div>
        
        <div class="folder-grid" id="briefcase-main-nav">
            <div class="folder-item" onclick="BriefcaseUI.switchSektor('sporttasche')">👟 <h3>Sporttasche</h3><span>Kader, Training, Spieltag</span></div>
            <div class="folder-item" onclick="BriefcaseUI.switchSektor('medical')">⌚ <h3>Medical Hub</h3><span>Bio-Metriken</span></div>
            <div class="folder-item" onclick="BriefcaseUI.switchSektor('orga')">🏢 <h3>Geschäftszimmer</h3><span>Redaktion & Media</span></div>
        </div>

        <div id="briefcase-content" class="hidden">
            <button onclick="BriefcaseUI.backToMain()" class="back-btn">← ZURÜCK</button>
            <div id="active-sektor-content"></div>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/stadionzeitung-ui.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { 
            arena.init('main-canvas');
            BriefcaseUI.init();
        });
    </script>
</body>
</html>
