<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | Elite Management & Simulation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
</head>
<body class="elite-mode role-manager">

    <div id="auth-gate">
        <div class="status-dot"></div>
        <span id="current-role">CHIEF ANALYST</span>
        <span id="system-clock">2026-02-20 | 16:20</span>
    </div>

    <nav class="sidebar">
        <div class="logo">TONI 2.0</div>
        
        <div class="nav-group">
            <p class="nav-label">PERFORMANCE</p>
            <button class="nav-btn active" onclick="showModule('vr-center')">
                <i>🎯</i> VR Center
            </button>
            <button class="nav-btn" onclick="showModule('locker-room')">
                <i>👤</i> Locker Room
            </button>
        </div>

        <div class="nav-group">
            <p class="nav-label">OPERATIONS</p>
            <button class="nav-btn" onclick="showModule('mgmt-lab')">
                <i>💼</i> Management Lab
            </button>
            <button class="nav-btn" onclick="showModule('press-center')">
                <i>🗞️</i> Press Center
            </button>
        </div>

        <div class="nav-group settings">
            <button class="nav-btn" onclick="showModule('settings')">
                <i>⚙️</i> System Settings
            </button>
        </div>
    </nav>

    <main class="main-content">
        
        <section id="vr-center" class="module-section active">
            <div class="module-header">
                <h2>Tactical Simulation & Pitch Control</h2>
                <div class="engine-controls">
                    <button class="control-btn" onclick="vrEngine.start()">START SIM</button>
                    <button class="control-btn" onclick="vrEngine.toggleHeatmap()">HEATMAP</button>
                </div>
            </div>
            <div class="pitch-container" id="pitch-frame">
                <canvas id="tacticBoard"></canvas>
                <div id="toni-sideline-coach" class="coach-avatar"></div>
            </div>
            <div class="live-metrics-bar">
                <div class="metric">Control Index: <span id="m-control">0%</span></div>
                <div class="metric">Scanning Rate: <span id="m-scanning">0%</span></div>
                <div class="metric">Transition: <span id="m-transition">READY</span></div>
            </div>
        </section>

        <section id="locker-room" class="module-section">
            <div class="module-header">
                <h2>Squad Registry & Load Management</h2>
                <button class="action-btn" onclick="openPlayerModal()">+ Add Asset</button>
            </div>
            <div class="card-grid" id="locker-room-container"></div>
        </section>

        <section id="mgmt-lab" class="module-section">
            <div class="module-header">
                <h2>Strategic Management Lab</h2>
            </div>
            <div id="mgmt-content"></div>
        </section>

        <section id="press-center" class="module-section">
            <div class="module-header">
                <h2>Media & Press Operations</h2>
            </div>
            <div id="press-content"></div>
        </section>

    </main>

    <div id="toni-interface">
        <div class="chat-header" onclick="toggleToni()">
            <span>TONI AI ANALYST</span>
            <button id="mic-btn" onclick="toggleVoice()">🎤</button>
        </div>
        <div id="chat-history"></div>
        <div class="chat-input-area">
            <input type="text" id="user-msg" placeholder="Analyse anfordern...">
        </div>
    </div>

    <div id="player-modal" class="modal">
        <div class="modal-content">
            <h3>Asset Profile Editor</h3>
            <div id="modal-form"></div>
            <div class="modal-actions">
                <button class="save-btn" onclick="savePlayer()">Commit Changes</button>
                <button class="close-btn" onclick="closePlayerModal()">Abort</button>
            </div>
        </div>
    </div>

    <div id="newspaper-overlay" class="modal">
        <div id="printable-newspaper"></div>
        <button class="close-overlay" onclick="newspaper.close()">Close Preview</button>
    </div>

    <script src="modules/management.js"></script>
    <script src="modules/newspaper.js"></script>
    <script src="script.js"></script>
</body>
</html>
