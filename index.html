<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI AI - Elite Performance System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body class="toni-expanded">

    <div class="sidebar">
        <div class="logo">⚽ TONI AI</div>
        <button class="nav-btn active" onclick="showModule('dashboard')">🏠 Kabine</button>
        <button class="nav-btn" onclick="showModule('tactics')">📋 Taktik</button>
        <button class="nav-btn" onclick="showModule('management')">💼 Aktentasche</button>
        <button class="nav-btn" onclick="showModule('bio')">❤️ Bio-Labor</button>
        <button class="nav-btn" onclick="showModule('vr')">🥽 VR-Center</button>
    </div>

    <div class="main-content">
        
        <div id="dashboard" class="module-section active">
            <div class="section-header">
                <h2>Mannschaftskabine</h2>
                <button class="action-btn" onclick="openPlayerModal()">+ Spieler hinzufügen</button>
            </div>
            <div id="locker-room-container" class="card-grid"></div>
        </div>

        <div id="tactics" class="module-section">
            <div class="section-header">
                <h2>Elite Taktik-Zentrum</h2>
                <div class="tactic-controls">
                    <button onclick="setFormation('4-4-2')">4-4-2 (Toni)</button>
                    <button onclick="setFormation('3-4-3')">3-4-3 (Trainer)</button>
                    <button onclick="clearBoard()" class="btn-danger">Reset</button>
                </div>
            </div>
            <div class="pitch-container">
                <canvas id="tacticBoard"></canvas>
            </div>
        </div>

        <div id="management" class="module-section">
            <h2>Vereins-Management & Finanzen</h2>
            <div id="mgmt-content"></div>
        </div>

        <div id="bio" class="module-section">
            <h2>Performance Bio-Lab (Watch & Scale)</h2>
            <div id="bio-lab-container"></div>
        </div>

        <div id="vr" class="module-section">
            <div class="vr-grid-layout">
                <div class="vr-preview-card">
                    <h3>Cognitive Simulation</h3>
                    <div class="vr-actions">
                        <button class="action-btn" onclick="vrCenter.launchVR()">VR STARTEN</button>
                        <button class="action-btn" style="background:#3b82f6" onclick="vrCenter.triggerDrill()">ÜBUNG STARTEN</button>
                    </div>
                    <div id="vr-container"></div>
                </div>
                <div class="logbook-card">
                    <h3>Trainings-Historie (Logbuch)</h3>
                    <div id="vr-logbook"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="toni-toggle" onclick="toggleToni()" title="Toni ein/ausklappen">🤖</button>
    <div class="toni-interface">
        <div class="chat-header">
            <div class="chat-status"></div>
            <span>TONI AI ANALYST</span>
        </div>
        <div class="chat-messages" id="chat-history"></div>
        <div class="chat-input-area">
            <button id="voice-btn" onclick="toggleVoice()">🎤</button>
            <input type="text" id="text-input" placeholder="Anweisung an Toni...">
        </div>
    </div>

    <div id="player-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Spieler-Profil bearbeiten</h3>
            <div class="modal-grid">
                <input type="text" id="edit-name" placeholder="Name">
                <input type="text" id="edit-pos" placeholder="Pos (z.B. ST)">
                <input type="number" id="edit-rating" placeholder="Rating">
                <hr style="grid-column: span 2; width: 100%; border: 0.5px solid #334155;">
                <input type="number" id="edit-tem" placeholder="TEM">
                <input type="number" id="edit-sch" placeholder="SCH">
                <input type="number" id="edit-pas" placeholder="PAS">
                <input type="number" id="edit-dri" placeholder="DRI">
                <input type="number" id="edit-def" placeholder="DEF">
                <input type="number" id="edit-phy" placeholder="PHY">
            </div>
            <div class="modal-actions">
                <button class="btn-save" onclick="savePlayer()">Speichern</button>
                <button class="btn-danger" id="btn-delete" onclick="deletePlayer()">Löschen</button>
                <button class="btn-cancel" onclick="closePlayerModal()">Abbrechen</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="modules/management.js"></script>
    <script src="modules/bio-lab.js"></script>
    <script src="modules/vr-center.js"></script>
</body>
</html>
