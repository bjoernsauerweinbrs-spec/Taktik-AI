<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Club Management & Tactical HQ</title>
<style>
  :root {
    --bg: #010501;
    --neon: #39FF14;
    --neon-glow: rgba(57, 255, 20, 0.3);
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05);
  }
  
  * { box-sizing: border-box; }
  body, html { 
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }

  /* --- APP WRAPPER --- */
  .app-container {
    display: grid;
    grid-template-columns: 80px 1fr 380px;
    height: 100vh; padding: 12px; gap: 12px;
  }

  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
    .overlay { inset: 5px !important; width: 98% !important; }
  }

  /* --- NAV --- */
  .left-nav { background: var(--glass); border-radius: 15px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; backdrop-filter: blur(10px); }
  .nav-item { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; transition: 0.3s; }
  .nav-item:hover { background: var(--neon-glow); box-shadow: 0 0 15px var(--neon); }

  /* --- ARENA --- */
  .center-arena { background: #000; border-radius: 15px; border: 1px solid rgba(57,255,20,0.1); display: flex; flex-direction: column; padding: 10px; position: relative; }
  canvas { background: #010a01; border-radius: 8px; box-shadow: 0 0 40px #000; max-width: 100%; height: auto; }

  /* --- TONI BOX --- */
  .right-toni { background: var(--glass); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px; border-radius: 12px; font-size: 13px; max-width: 85%; line-height: 1.4; }
  .msg.ai { background: rgba(57, 255, 20, 0.08); align-self: flex-start; border-left: 3px solid var(--neon); }

  /* --- OVERLAYS --- */
  .overlay { position: fixed; inset: 20px 400px 20px 100px; background: rgba(3, 8, 3, 0.99); border: 1px solid var(--neon); border-radius: 20px; z-index: 1000; display: none; flex-direction: column; padding: 25px; backdrop-filter: blur(25px); overflow: hidden; }
  .scroll-box { flex: 1; overflow-y: auto; padding-top: 10px; }

  /* --- MANAGEMENT TABLES --- */
  .mgmt-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  .mgmt-table th { text-align: left; color: var(--neon); border-bottom: 1px solid #333; padding: 10px; }
  .mgmt-table td { padding: 10px; border-bottom: 1px solid #111; }

  /* --- FIFA & PANINI CARDS --- */
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  .fifa-card { width: 160px; height: 230px; background: var(--gold); border-radius: 10px; color: #000; position: relative; padding: 10px; cursor: pointer; font-family: 'Arial Black', sans-serif; }
  .card-rating { font-size: 38px; position: absolute; top: 10px; left: 10px; }
  .card-photo { width: 95px; height: 95px; background: rgba(0,0,0,0.1); margin: 5px auto 0 auto; border-bottom: 2px solid #000; overflow: hidden; display: flex; align-items: flex-end; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .card-name { text-align: center; font-size: 16px; margin: 2px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }

  /* --- MAGAZINE EDITOR --- */
  .mag-preview { background: #fff; color: #333; padding: 30px; border-radius: 5px; min-height: 500px; box-shadow: 0 0 20px rgba(57,255,20,0.2); }
  .mag-block { margin-bottom: 20px; border: 1px dashed transparent; padding: 5px; cursor: text; }
  .mag-block:hover { border-color: var(--neon); }

  /* --- LOGIN --- */
  .login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
  .login-input { background: #111; border: 1px solid var(--neon); color: #fff; padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; }

</style>
</head>
<body>

<div id="login" class="login-screen">
  <h1 style="color:var(--neon); letter-spacing: 5px;">TONI 2.0</h1>
  <input type="password" id="pw" class="login-input" placeholder="PASSWORT EINGEBEN">
  <div style="font-size: 10px; color: #666;">Admin: 1234 | Kids/Eltern: Junior2026</div>
  <button onclick="checkLogin()" style="background:var(--neon); border:none; padding:10px 30px; border-radius:5px; font-weight:bold; cursor:pointer;">STARTEN</button>
</div>

<div class="app-container" id="mainApp" style="display:none;">
  <div class="left-nav">
    <div class="nav-item" onclick="openSektor('kabine')" title="Kader">💼</div>
    <div class="nav-item" onclick="openSektor('business')" title="Management">🤝</div>
    <div class="nav-item" onclick="openSektor('kids')" title="Kids-Club">👶</div>
    <div class="nav-item" onclick="openSektor('analyse')" title="Analyse">🧪</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="openSektor('zeitung')">📰</div>
  </div>

  <div class="center-arena">
    <div style="display:flex; justify-content:space-between; padding:5px 15px; color:var(--neon); font-size:12px;">
        <strong id="clubNameDisplay">FC TONI 02 | ARENA</strong>
        <span>[ LIVE COACHING MODE ]</span>
    </div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <canvas id="mainBoard" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="font-weight:bold; color:var(--neon); display:flex; justify-content:space-between;">TONI AI <span>CONNECTED</span></div>
    <div class="chat-history" id="chat">
      <div class="msg ai" id="toniGreeting">Toni: System v3.0 online. Ich habe das Vorwort für die Stadionzeitung entworfen. Soll ich dein Vereinslogo für "FC TONI 02" suchen?</div>
    </div>
    <div style="display:flex; gap:10px;">
      <input type="text" id="cmd" placeholder="Befehl..." style="flex:1; background:#111; border:1px solid #333; color:#fff; padding:12px; border-radius:10px;">
      <button onclick="sendBefehl()" style="background:var(--neon); border:none; border-radius:10px; padding:0 15px; cursor:pointer;">➔</button>
    </div>
  </div>
</div>

<div id="ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h2 id="ov-title" style="margin:0; color:var(--neon); letter-spacing:2px;">HUB</h2>
    <span onclick="closeOverlay()" style="cursor:pointer; font-size:30px;">✕</span>
  </div>
  <div class="scroll-box" id="ov-content"></div>
</div>

<script>
  const canvas = document.getElementById('mainBoard');
  const ctx = canvas.getContext('2d');
  let currentMode = 'admin'; // 'admin' oder 'junior'

  // DATA
  let team = JSON.parse(localStorage.getItem('toni_v3_team')) || [
    {id:0, name:'Müller', rating:91, pos:'ST', x:200, y:350, bpm:62, sleep:82, fat:10.2, img:''},
    {id:1, name:'Silva', rating:89, pos:'ZM', x:450, y:350, bpm:68, sleep:65, fat:11.5, img:''}
  ];

  let sponsors = [
    {platz: 'Brust', partner: 'Toni AI', einnahme: '50.000 €', status: 'Aktiv'},
    {platz: 'Ärmel', partner: 'Digital Sports', einnahme: '15.000 €', status: 'Verhandlung'}
  ];

  // LOGIN SYSTEM
  function checkLogin() {
    const pw = document.getElementById('pw').value;
    if(pw === '1234') { 
        currentMode = 'admin'; 
        startApp();
    } else if(pw === 'Junior2026') {
        currentMode = 'junior';
        startApp();
    } else {
        alert("Falsches Passwort!");
    }
  }

  function startApp() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('mainApp').style.display = 'grid';
    renderArena();
    if(currentMode === 'junior') {
        addChat("Willkommen im Mini-Helden Bereich! Hier sind deine Sammelkarten.");
        openSektor('kids');
    }
  }

  // RENDER PITCH
  function drawPitch() {
    ctx.fillStyle = '#021202'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.4)'; ctx.lineWidth = 3;
    ctx.strokeRect(40, 40, canvas.width-80, canvas.height-80);
    ctx.beginPath(); ctx.moveTo(canvas.width/2, 40); ctx.lineTo(canvas.width/2, canvas.height-40); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 80, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.2)';
    ctx.strokeRect(40, canvas.height/2-70, 50, 140);
    ctx.strokeRect(canvas.width-90, canvas.height/2-70, 50, 140);
  }

  function renderArena() {
    drawPitch();
    team.forEach(p => {
      ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign='center';
      ctx.fillText(p.name[0], p.x, p.y+5);
    });
  }

  // SEKTOR ENGINE
  function openSektor(s) {
    document.getElementById('ov').style.display = 'flex';
    const c = document.getElementById('ov-content');
    const t = document.getElementById('ov-title');
    c.innerHTML = '';

    if(s === 'kabine' && currentMode === 'admin') {
      t.innerText = 'PRO SQUAD REPOSITORY';
      c.className = 'scroll-box fifa-grid';
      team.forEach(p => {
        c.innerHTML += `<div class="fifa-card"><div class="card-rating">${p.rating}</div><div class="card-photo">${p.img?`<img src="${p.img}">`:'👤'}</div><div class="card-name">${p.name}</div></div>`;
      });
    } else if(s === 'business') {
      t.innerText = 'MANAGEMENT & SPONSORING';
      c.className = 'scroll-box';
      c.innerHTML = `
        <table class="mgmt-table">
          <tr><th>FLÄCHE</th><th>PARTNER</th><th>EINNAHME</th><th>STATUS</th></tr>
          ${sponsors.map(s => `<tr><td>${s.platz}</td><td>${s.partner}</td><td>${s.einnahme}</td><td>${s.status}</td></tr>`).join('')}
        </table>
        <div style="margin-top:20px; padding:15px; background:var(--glass); border-left:4px solid var(--neon);">
          <strong>Toni Berater-Tipp:</strong> Basierend auf deiner Liga könntest du für die Stadion-Bande ca. 1.200 € pro Saison verlangen.
        </div>`;
    } else if(s === 'kids') {
      t.innerText = 'MINI-HELDEN SAMMELALBUM';
      c.className = 'scroll-box fifa-grid';
      team.forEach(p => {
        c.innerHTML += `<div class="fifa-card" style="background:linear-gradient(135deg, #00c6ff, #0072ff); color:#fff; border:2px solid #fff;"><div class="card-rating">⭐</div><div class="card-photo">👤</div><div class="card-name">${p.name}</div></div>`;
      });
      c.innerHTML += `<div style="grid-column: 1/-1; margin-top:20px; background:var(--neon-glow); padding:15px; border-radius:10px;">
        <h3>TRAININGS-NEWS</h3>
        <p>Nächstes Training: Samstag, 10:00 Uhr. Thema: Dribbling wie Zidane!</p>
        <textarea placeholder="Eltern-Kommentar..." style="width:100%; height:50px; background:rgba(0,0,0,0.3); border:1px solid var(--neon); color:#fff; padding:5px;"></textarea>
      </div>`;
    } else if(s === 'zeitung') {
      t.innerText = 'HOCHGLANZ-EDITOR';
      c.className = 'scroll-box';
      c.innerHTML = `
        <div class="mag-preview">
          <h1 style="text-align:center;">MATCHDAY MAGAZINE</h1>
          <div class="mag-block" contenteditable="true"><h3>Wort vom Vorstand</h3>Herzlich Willkommen beim FC TONI 02. Wir freuen uns auf ein spannendes Spiel...</div>
          <div class="mag-block" contenteditable="true"><h3>Der Trainer hat das Wort</h3>"Heute zählt nur der Sieg. Wir haben uns intensiv vorbereitet."</div>
          <div style="background:#f0f0f0; padding:20px; text-align:center; border:2px solid #333;">[SPIELFELD-TAKTIK HIER]</div>
        </div>
        <button onclick="window.print()" style="width:100%; margin-top:20px; padding:15px; background:var(--neon); color:#000; font-weight:bold; border:none; cursor:pointer;">PDF GENERIEREN & DRUCKEN</button>`;
    } else if(s === 'analyse') {
        t.innerText = 'VITAL LABORATORY';
        c.innerHTML = '<p>Nur im Admin-Modus verfügbar.</p>';
    }
  }

  function addChat(txt) {
    const chat = document.getElementById('chat');
    chat.innerHTML += `<div class="msg ai">Toni: ${txt}</div>`;
    chat.scrollTop = chat.scrollHeight;
  }

  function sendBefehl() {
    const val = document.getElementById('cmd').value;
    addChat("Verstanden. Ich analysiere die Anfrage zu: " + val);
    document.getElementById('cmd').value = '';
  }

  function closeOverlay() { document.getElementById('ov').style.display = 'none'; }
  renderArena();
</script>
</body>
</html>
