<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taktik-AI Login | Coach Björn</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6;
        }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .login-card {
            background: var(--card); padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 350px;
        }
        h2 { text-align: center; margin-bottom: 20px; color: var(--accent); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #94a3b8; }
        input, select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155;
            background: #0f172a; color: white; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background: var(--accent); border: none;
            border-radius: 6px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Taktik-AI <small style="display:block; font-size: 0.5em; color: white;">Coach Björn Edition</small></h2>
        
        <div class="input-group">
            <label>Dein Name</label>
            <input type="text" id="trainer-name" placeholder="z.B. Björn" value="Björn">
        </div>

        <div class="input-group">
            <label>KI-Anbieter wählen</label>
            <select id="provider-select">
                <option value="groq">Groq (Empfohlen: Schnell & Kostenlos)</option>
                <option value="openai">OpenAI (GPT-4)</option>
                <option value="gemini">Google Gemini</option>
            </select>
        </div>

        <div class="input-group">
            <label>API-Key eingeben</label>
            <input type="password" id="api-key" placeholder="Hier deinen Key einfügen...">
        </div>

        <button onclick="startSystem()">System starten & zum Feld</button>
    </div>

    <script>
        function startSystem() {
            const name = document.getElementById('trainer-name').value;
            const key = document.getElementById('api-key').value;
            const provider = document.getElementById('provider-select').value;

            if (!key || !name) {
                alert("Coach, ohne Namen und API-Key kommen wir nicht aus der Kabine!");
                return;
            }

            // Daten lokal im Browser sichern
            localStorage.setItem('trainer_name', name);
            localStorage.setItem('api_key', key);
            localStorage.setItem('selected_provider', provider);

            // Weiterleitung zur Haupt-App
            window.location.href = 'app.html';
        }
        
        // Automatisches Laden beim Start, falls schon mal eingeloggt
        window.onload = () => {
            const savedName = localStorage.getItem('trainer_name');
            const savedKey = localStorage.getItem('api_key');
            if(savedName) document.getElementById('trainer-name').value = savedName;
            if(savedKey) document.getElementById('api-key').value = savedKey;
        };
    </script>
</body>
</html>
