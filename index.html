<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni - Zentrale V31</title>
    <style>
        :root { --pitch-green: #28a745; --line-white: rgba(255,255,255,0.9); --home-team: #ff0000; --away-team: #007bff; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .container { display: grid; grid-template-columns: 350px 1fr 300px; width: 100%; gap: 10px; padding: 10px; box-sizing: border-box; }

        #chat-sidebar { background: #1e1e1e; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333; }
        .header { background: #000; padding: 15px; text-align: center; font-weight: bold; border-bottom: 3px solid var(--pitch-green); color: var(--pitch-green); }
        #chat-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; max-width: 90%; }
        .user { align-self: flex-end; background: #007bff; }
        .toni { align-self: flex-start; background: #333; border-left: 4px solid var(--pitch-green); }

        #pitch-area { background: #222; border-radius: 15px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
        #pitch { width: 95%; height: 85%; background: var(--pitch-green); border: 2px solid var(--line-white); position: relative; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .c-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--line-white); }
        .c-circle { position: absolute; left: 50%; top: 50%; width: 100px; height: 100px; border: 2px solid var(--line-white); border-radius: 50%; transform: translate(-50%, -50%); }
        .box-16 { position: absolute; width: 16%; height: 44%; border: 2px solid var(--line-white); top: 28%; }
        .box-5 { position: absolute; width: 6%; height: 20%; border: 2px solid var(--line-white); top: 40%; }
        .goal { position: absolute; width: 10px; height: 60px; background: white; top: 50%; transform: translateY(-50%); border: 1px solid #333; }

        .player, #ball { position: absolute; cursor: grab; z-index: 100; transition: all 1.2s ease-in-out; }
        .player { width: 34px; height: 34px; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: white; text-align: center; overflow: hidden; }
        .home { background: var(--home-team); }
        .away { background: var(--away-team); }
        #ball { width: 16px; height: 16px; background: white; border: 2px solid black; border-radius: 50%; z-index: 110; }

        #whiteboard { background: #fff; color: #333; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; border: 1px solid #ddd; }
        #player-list { flex: 1; border: none; font-size: 1rem; outline: none; line-height: 1.5; font-family: monospace; }

        #login-overlay { position: fixed; inset: 0; background: #111; z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .mic-active { background: #ff0000 !important; color: white !important; box-shadow: 0 0 10px red; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="background: #1e1e1e; padding: 40px; border-radius: 20px; border: 2px solid #28a745; text-align: center;">
        <h2 style="color: #28a745">⚽ COACH TONI V31</h2>
        <input type="password" id="password" placeholder="Passwort (Trainer2026)" style="display:block; width:250px; margin:15px auto; padding:12px;">
        <input type="text" id="user-key" placeholder="Google API-Key" style="display:block; width:250px; margin:15px auto; padding:12px;">
        <button onclick="startToni()" style="background:#28a745; color:white; width:100%; padding:12px; font-weight:bold; border:none; cursor:pointer;">EINLOGGEN</button>
    </div>
</div>

<div class="container">
    <div id="chat-sidebar">
        <div class="header">COACH DIALOG</div>
        <div id="chat-history"></div>
        <div style="padding:15px; background:#111; display:flex; gap:5px; align-items:center;">
            <button id="mic-btn" onclick="toggleMic()" style="background:#444; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; min-width: 45px;">🎤</button>
            <input type="text" id="user-input" style="flex:1; background:#222; color:white; border:1px solid #444; padding:10px; border-radius:5px;" placeholder="Toni fragen...">
            <button onclick="askToni()" style="background:#28a745; border:none; color:white; font-weight:bold; padding:10px; border-radius:5px; cursor:pointer;">OK</button>
        </div>
    </div>

    <div id="pitch-area">
        <div style="padding:10px; display:flex; gap:10px;">
            <button onclick="setFormation()">Feld Reset</button>
            <button onclick="loadVoice()">Stimme laden</button>
        </div>
        <div id="pitch">
            <div class="c-line"></div><div class="c-circle"></div>
            <div class="box-16 l"></div><div class="box-16 r"></div>
            <div class="box-5 l"></div><div class="box-5 r"></div>
            <div class="goal" style="left:-5px; top:50%; transform:translateY(-50%)"></div>
            <div class="goal" style="right:-5px; top:50%; transform:translateY(-50%)"></div>
            <div id="ball" style="left:50%; top:50%;"></div>
            <div id="players-layer"></div>
        </div>
    </div>

    <div id="whiteboard">
        <h3 style="margin:0">📋 Kaderliste</h3>
        <textarea id="player-list" oninput="saveAndSync()" placeholder="Beispiel:&#10;1 Mike&#10;2 ..."></textarea>
    </div>
</div>

<script>
    let USER_KEY = "";
    let coachVoice = null;
    let recognition = null;

    // --- MIKROFON (Verbessert für Mac) ---
    function setupMic() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return;
        recognition = new Speech();
        recognition.lang = 'de-DE';
        recognition.onstart = () => document.getElementById('mic-btn').classList.add('mic-active');
        recognition.onend = () => document.getElementById('mic-btn').classList.remove('mic-active');
        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            document.getElementById('user-input').value = text;
            askToni();
        };
    }

    function toggleMic() {
        if (!recognition) setupMic();
        if (!recognition) return alert("Mikrofon-Erkennung nicht unterstützt.");
        recognition.start();
    }

    // --- STIMME ---
    function loadVoice() {
        const voices = window.speechSynthesis.getVoices();
        coachVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Martin') || v.name.includes('Stefan') || v.name.includes('Yannick')));
        if (!coachVoice) coachVoice = voices.find(v => v.lang.startsWith('de'));
        if (coachVoice) speak("System bereit.");
    }
    window.speechSynthesis.onvoiceschanged = loadVoice;

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        if (coachVoice) msg.voice = coachVoice;
        msg.pitch = 0.6; msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }

    // --- SPEICHERN & NAMEN ---
    function saveAndSync() {
        const listText = document.getElementById('player-list').value;
        localStorage.setItem('coachToni_kader', listText); // Speichern im Browser
        updateNamesOnBoard(listText);
    }

    function updateNamesOnBoard(text) {
        const lines = text.split('\n');
        lines.forEach(l => {
            const m = l.match(/^(\d+)\s+(.+)$/);
            if (m) {
                const el = document.getElementById('home' + m[1]);
                if (el) el.innerText = m[2].split(' ')[0];
            }
        });
    }

    // --- DRAG ---
    let activeItem = null;
    document.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('player') || e.target.id === 'ball') {
            activeItem = e.target; activeItem.style.transition = "none";
        }
    });
    document.addEventListener('mousemove', (e) => {
        if (!activeItem) return;
        const r = document.getElementById('pitch').getBoundingClientRect();
        activeItem.style.left = Math.max(0, Math.min(96, ((e.clientX - r.left) / r.width) * 100)) + "%";
        activeItem.style.top = Math.max(0, Math.min(95, ((e.clientY - r.top) / r.height) * 100)) + "%";
    });
    document.addEventListener('mouseup', () => {
        if (activeItem) activeItem.style.transition = "all 1.2s ease-in-out";
        activeItem = null;
    });

    function startToni() {
        if (document.getElementById('password').value === "Trainer2026") {
            USER_KEY = document.getElementById('user-key').value.trim();
            document.getElementById('login-overlay').style.display = 'none';
            setFormation();
            
            // Lade gespeicherte Liste
            const saved = localStorage.getItem('coachToni_kader');
            if (saved) {
                document.getElementById('player-list').value = saved;
                updateNamesOnBoard(saved);
            }
            loadVoice();
        }
    }

    function setFormation() {
        const layer = document.getElementById('players-layer'); layer.innerHTML = "";
        const home = [[5,50], [22,20], [22,40], [22,60], [22,80], [45,20], [45,40], [45,60], [45,80], [70,40], [70,60]];
        const away = [[93,50], [78,25], [78,50], [78,75], [58,15], [58,38], [58,62], [58,85], [35,20], [35,50], [35,80]];
        home.forEach((p, i) => createP('home', i+1, p[0], p[1], layer));
        away.forEach((p, i) => createP('away', i+1, p[0], p[1], layer));
    }

    function createP(team, nr, x, y, layer) {
        const p = document.createElement('div');
        p.className = `player ${team}`; p.id = team + nr; p.innerText = nr;
        p.style.left = x + "%"; p.style.top = y + "%"; layer.appendChild(p);
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value.trim(); if (!text) return;
        addMsg("user", text); input.value = "";
        
        let state = "Kader: " + document.getElementById('player-list').value.replace(/\n/g, ', ') + ". Positionen: ";
        document.querySelectorAll('.player, #ball').forEach(el => {
            state += `${el.id}:[${Math.round(parseFloat(el.style.left))},${Math.round(parseFloat(el.style.top))}], `;
        });

        // Toni-Prompt für Freundlichkeit und Taktik
        let prompt = `Du bist Toni, der persönliche Co-Trainer von Björn. 
        WICHTIG: Wenn der User nur grüßt (Hallo, Hi, etc.), stelle dich kurz vor: 'Hallo, ich bin Toni der persönliche Co-Trainer von Björn, wir freuen uns, dass du hier bist. Wir hoffen, wir können dir einiges zeigen.'
        Ansonsten antworte fachlich fundiert. ROT=home, BLAU=away. Stand: ${state}. PFLICHT: Für Bewegungen MOVE[ID,X,Y] nutzen.`;

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${USER_KEY}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt + " Frage: " + text }] }] })
            });
            const data = await resp.json();
            if (data.candidates) {
                let answer = data.candidates[0].content.parts[0].text;
                let moves = [...answer.matchAll(/MOVE\[(\w+),(\d+),(\d+)\]/g)];
                let clean = answer.replace(/MOVE\[.*?\]/g, "");
                addMsg("toni", clean); speak(clean);
                moves.forEach(m => {
                    const el = document.getElementById(m[1].replace('H','home').replace('A','away'));
                    if (el) { el.style.left = m[2] + "%"; el.style.top = m[3] + "%"; }
                });
            }
        } catch (e) { addMsg("toni", "Fehler!"); }
    }

    function addMsg(role, text) {
        const h = document.getElementById('chat-history');
        const d = document.createElement('div');
        d.className = `msg ${role}`; d.innerText = text;
        h.appendChild(d); h.scrollTop = h.scrollHeight;
    }
</script>

</body>
</html>
