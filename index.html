<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Board - Björn & David Luiz</title>
    <style>
        :root { --pitch: #2d5a27; --stripe: #254d21; }
        * { box-sizing: border-box; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; color: #fff; }
        #header { background: #111; padding: 8px; text-align: center; border-bottom: 1px solid #333; }
        #nav { background: #1a1a1a; padding: 10px; display: flex; justify-content: center; gap: 8px; border-bottom: 2px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        #pitch-area { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; padding: 10px; }
        #pitch { width: 100%; height: 100%; max-width: 1000px; background: var(--pitch); border: 3px solid #fff; position: relative; background-image: repeating-linear-gradient(0deg, var(--pitch), var(--pitch) 10%, var(--stripe) 10%, var(--stripe) 20%); }
        .line-mid { position: absolute; width: 100%; height: 2px; background: rgba(255,255,255,0.7); top: 50%; left: 0; }
        .circle { width: 90px; height: 90px; border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .goal { position: absolute; width: 80px; height: 20px; border: 2px solid white; background: rgba(255,255,255,0.2); left: 50%; transform: translateX(-50%); }
        .player { width: 30px; height: 30px; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; border: 2px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 10; cursor: move; touch-action: none; transition: top 0.5s ease, left 0.5s ease; }
        .red { background: #b71c1c; } .blue { background: #0d47a1; }
        #ball { width: 16px; height: 16px; background: #fff; border: 2px solid #000; z-index: 20; transition: all 0.6s ease; }
        #chat { height: 30%; background: #fff; color: #000; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 12px; background: #f0f0f0; font-size: 14px; }
        #input-row { padding: 10px; background: #ddd; display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; color: #000; }
        button.send { background: #2e7d32; color: white; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">
    <span onclick="askKey()" style="color:#00ff88; cursor:pointer;">🔑 [ API-Key hier einfügen ]</span>
</div>

<div id="nav">
    <button class="btn" onclick="setMode('11v11')">11 vs 11</button>
    <button class="btn" onclick="setMode('funino')">Funino</button>
    <button class="btn" onclick="resetBall()">Ball Mitte</button>
</div>

<div id="pitch-area">
    <div id="pitch">
        <div class="line-mid"></div><div class="circle"></div>
        <div class="goal" style="top:0"></div><div class="goal" style="bottom:0"></div>
        <div id="ball" class="player" style="top:48.5%; left:49.2%;"></div>
        <div id="players"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="user-in" placeholder="Schreibe deinem Co-Trainer...">
        <button class="send" onclick="talk()">➤</button>
    </div>
</div>

<script>
    const layer = document.getElementById('players'), ball = document.getElementById('ball'), log = document.getElementById('log'), input = document.getElementById('user-in');
    let myKey = localStorage.getItem('bjorn_key_vfinal')?.trim() || "";

    function askKey() {
        const k = prompt("Bitte Google API-Key einfügen:");
        if(k) { localStorage.setItem('bjorn_key_vfinal', k.trim()); location.reload(); }
    }

    function addLog(who, msg) {
        const d = document.createElement('div');
        d.innerHTML = `<strong>${who}:</strong> ${msg}`;
        log.appendChild(d); log.scrollTop = log.scrollHeight;
    }

    function createP(t, l, c, n) {
        const p = document.createElement('div');
        p.className = 'player ' + c; p.style.top = t + "%"; p.style.left = l + "%";
        p.innerText = n; layer.appendChild(p);
        makeDraggable(p);
    }

    function setMode(m) {
        layer.innerHTML = "";
        if(m === '11v11') {
            const reds = [{t:88,l:48},{t:75,l:15},{t:75,l:35},{t:75,l:60},{t:75,l:82},{t:55,l:20},{t:55,l:40},{t:55,l:60},{t:55,l:75},{t:35,l:40},{t:35,l:55}];
            const blues = [{t:10,l:48},{t:20,l:20},{t:20,l:47},{t:20,l:75},{t:40,l:15},{t:40,l:40},{t:40,l:60},{t:40,l:80},{t:60,l:35},{t:60,l:60},{t:60,l:10}];
            reds.forEach((p,i)=>createP(p.t,p.l,'red',i+1));
            blues.forEach((p,i)=>createP(p.t,p.l,'blue',i+1));
        } else {
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
        }
    }

    async function talk() {
        const val = input.value; if(!val) return;
        addLog("Björn", val); input.value = "";
        if(!myKey) { addLog("System", "Bitte Key oben eingeben!"); return; }

        const urls = [
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${myKey}`,
            `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${myKey}`
        ];

        let success = false;
        for (let url of urls) {
            if (success) break;
            try {
                const r = await fetch(url, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ contents: [{ parts: [{ text: `Fußball-Trainer Björn fragt. Antworte kurz. Befehl: [BALL:X:Y]. Frage: ${val}` }] }] }) });
                const d = await r.json();
                if(!d.error) {
                    const txt = d.candidates[0].content.parts[0].text;
                    addLog("Co-Trainer", txt);
                    const bM = txt.match(/\[BALL:(\d+):(\d+)\]/);
                    if(bM) { ball.style.left = bM[1]+"%"; ball.style.top = bM[2]+"%"; }
                    success = true;
                }
            } catch(e) {}
        }
        if(!success) addLog("System", "Verbindung fehlgeschlagen. Ist der Key korrekt?");
    }

    function resetBall() { ball.style.top = "48.5%"; ball.style.left = "49.2%"; }

    function makeDraggable(el) {
        let dragging = false;
        el.onmousedown = el.ontouchstart = (e) => { dragging = true; el.style.transition = "none"; };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!dragging) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
            el.style.left = (x/r.width*100)-2 + "%"; el.style.top = (y/r.height*100)-2 + "%";
        };
        window.onmouseup = window.ontouchend = () => { dragging = false; el.style.transition = "all 0.5s ease"; };
    }

    makeDraggable(ball);
    input.onkeypress = (e) => { if(e.key === 'Enter') talk(); };
    window.onload = () => setMode('11v11');
</script>
</body>
</html>
