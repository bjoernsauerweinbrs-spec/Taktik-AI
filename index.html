<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Toni AI</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #app { background: white; width: 95%; max-width: 500px; height: 90vh; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #1a1a1a; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #login-screen, #chat-screen { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        input { padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { background: #28a745; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #chat-history { flex: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; line-height: 1.4; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .toni { align-self: flex-start; background: #eee; color: #333; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">⚽ COACH TONI</div>
    
    <div id="login-screen">
        <h2 style="text-align:center">Trainer Login</h2>
        <input type="text" id="username" placeholder="Dein Name">
        <input type="password" id="password" placeholder="Passwort (Trainer2026)">
        <input type="text" id="user-key" placeholder="Google API-Key (AIza...)">
        <button onclick="startToni()">Toni aktivieren</button>
    </div>

    <div id="chat-screen" style="display:none">
        <div id="chat-history"></div>
        <div style="display:flex; gap:5px">
            <input type="text" id="user-input" style="flex:1" placeholder="Frag Toni...">
            <button onclick="askToni()">Senden</button>
        </div>
    </div>
</div>

<script>
    // Diese Version nutzt KEINE Module, damit sie überall funktioniert
    let USER_KEY = "";
    let USER_NAME = "";

    async function startToni() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const key = document.getElementById('user-key').value.trim();

        if (user && pass === "Trainer2026" && key.startsWith("AIza")) {
            USER_KEY = key;
            USER_NAME = user;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            addMsg("toni", `Servus ${user}! Ich bin Toni. Was trainieren wir heute?`);
        } else {
            alert("Check mal Name, Passwort oder Key (muss mit AIza beginnen)!");
        }
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value;
        if (!text) return;

        addMsg("user", text);
        input.value = "";

        // Direkter Aufruf der Google API ohne Bibliothek
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${USER_KEY}`;
        
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Du bist Toni, ein Fußballtrainer für Kinder. Antworte kurz: ${text}` }] }]
                })
            });

            const data = await response.json();
            const answer = data.candidates[0].content.parts[0].text;
            addMsg("toni", answer);
        } catch (e) {
            addMsg("toni", "Fehler! Ist dein Key korrekt und für Gemini 1.5 Flash freigeschaltet?");
        }
    }

    function addMsg(role, text) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
