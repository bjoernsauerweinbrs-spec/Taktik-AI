<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TONI 2.0 — High-Tech Tactical Board</title>
<style>
  :root{
    --bg:#000000;
    --stadium-green:#051205;
    --neon:#39FF14;
    --gold:#FFD700;
    --muted:#666;
    --card-w:160px;
    --card-h:230px;
    --ui-gap:12px;
    --font-sans: "Segoe UI", Roboto, Arial, sans-serif;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#050505);color:#ddd;font-family:var(--font-sans);overflow:hidden;}
  .app{display:grid;grid-template-columns:72px 1fr 380px;gap:var(--ui-gap);height:100vh;padding:var(--ui-gap);box-sizing:border-box;}
  
  /* Navigation */
  .left-col{background:rgba(255,255,255,0.02);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:12px;border:1px solid rgba(255,255,255,0.05);}
  .icon-btn{width:48px;height:48px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,20,0.1);display:flex;align-items:center;justify-content:center;color:var(--neon);cursor:pointer;font-size:20px;transition:0.2s;}
  .icon-btn:hover{background:rgba(57,255,20,0.1);box-shadow:0 0 10px var(--neon);}

  /* Arena */
  .center-col{background:rgba(5,18,5,0.5);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px;position:relative;}
  .arena-toolbar{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,0.4);padding:8px;border-radius:6px;}
  .tool-btn{background:transparent;border:1px solid rgba(57,255,20,0.3);color:var(--neon);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;}
  .tool-btn:hover{background:var(--neon);color:#000;}
  .arena-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  canvas#arenaCanvas{background:#021202;border-radius:4px;box-shadow:0 0 20px rgba(0,0,0,0.8);max-width:100%;max-height:100%;cursor:crosshair;}

  /* Toni-Box (Video & Chat) */
  .right-col{background:rgba(255,255,255,0.02);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px;border-left:1px solid rgba(255,255,255,0.05);}
  .video-analysis{display:grid;grid-template-columns:1fr;gap:8px;height:220px;}
  .video-pane{background:#000;border:1px solid #222;border-radius:6px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:#444;}
  .chat{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:8px;border-top:1px solid #111;}
  .msg{padding:10px;border-radius:8px;font-size:14px;line-height:1.4;max-width:90%;}
  .msg.ai{background:rgba(57,255,20,0.08);color:var(--neon);align-self:flex-start;border-left:3px solid var(--neon);}
  .msg.user{background:rgba(255,255,255,0.05);align-self:flex-end;}
  .chat-input-wrap{display:flex;gap:8px;}
  input#chatInput{flex:1;background:#111;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;}

  /* Overlays */
  .overlay{position:fixed;left:92px;top:20px;bottom:20px;width:550px;background:#070f07;border:1px solid var(--neon);border-radius:12px;z-index:100;display:none;flex-direction:column;padding:20px;box-shadow:0 0 50px rgba(0,0,0,0.9);}
  .grid-3x3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px;}
  .kachel{background:rgba(57,255,20,0.05);border:1px solid rgba(57,255,20,0.2);border-radius:8px;padding:15px;text-align:center;cursor:pointer;transition:0.2s;}
  .kachel:hover{background:var(--neon);color:#000;}

  /* Manager Styles */
  .sponsor-card{border:1px dashed #444;padding:10px;border-radius:6px;text-align:center;background:#111;}

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="left-col">
    <div class="icon-btn" onclick="toggleOverlay('briefcaseOverlay')">💼</div>
    <div class="icon-btn" onclick="startVoice()">🎙️</div>
    <div class="icon-btn" onclick="location.reload()">🔁</div>
    <div style="flex:1"></div>
    <div class="icon-btn" onclick="generatePrint()">📄</div>
  </div>

  <div class="center-col">
    <div class="arena-toolbar">
      <button class="tool-btn" onclick="setMode('select')">Select</button>
      <button class="tool-btn" onclick="setMode('arrow')">Laufweg</button>
      <button class="tool-btn" onclick="clearBoard()">Clear Board</button>
      <div style="flex:1"></div>
      <span id="status" style="font-size:12px; color:var(--neon)">Live • Toni Active</span>
    </div>
    <div class="arena-wrap">
      <canvas id="arenaCanvas" width="1000" height="650"></canvas>
    </div>
  </div>

  <div class="right-col">
    <div style="font-weight:bold; color:var(--neon); display:flex; justify-content:space-between;">
      TONI 2.0 <span>v2.4</span>
    </div>
    <div class="video-analysis">
      <div class="video-pane" id="ytPane">YouTube Profi-Stream</div>
      <div class="video-pane" id="camPane" style="border-color:var(--neon)">Live Kamera (Tablet)</div>
    </div>
    <div class="chat" id="chat">
      <div class="msg ai">Hi Björn! Ich bin bereit. Sollen wir die 4-4-2 Formation prüfen oder ein Technik-Video analysieren?</div>
    </div>
    <div class="chat-input-wrap">
      <input type="text" id="chatInput" placeholder="Befehl an Toni..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button class="tool-btn" onclick="sendMsg()">Senden</button>
    </div>
  </div>
</div>

<div id="briefcaseOverlay" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="color:var(--neon); margin:0;">AKTENTASCHE</h2>
    <button class="tool-btn" onclick="toggleOverlay('briefcaseOverlay')">X</button>
  </div>
  <div class="grid-3x3">
    <div class="kachel" onclick="alert('Kader geladen')">KABINE</div>
    <div class="kachel" onclick="alert('Analyse gestartet')">ANALYSE</div>
    <div class="kachel">KIDS-CLUB</div>
    <div class="kachel">MATCH-DAY</div>
    <div class="kachel">TRAINING</div>
    <div class="kachel" onclick="showBusiness()">BUSINESS</div>
    <div class="kachel" onclick="generatePrint()">ZEITUNG</div>
    <div class="kachel">SCOUTING</div>
    <div class="kachel">SETTINGS</div>
  </div>
  <div id="subContent" style="margin-top:20px; border-top:1px solid #222; padding-top:10px;"></div>
</div>

<script>
  const canvas = document.getElementById('arenaCanvas');
  const ctx = canvas.getContext('2d');
  let mode = 'select';
  let shapes = [];
  let players = [
    {id:1, name:'Müller', x:200, y:300, team:'home', no:9},
    {id:2, name:'Silva', x:400, y:200, team:'away', no:10}
  ];

  // ARENA LOGIC
  function drawField() {
    ctx.fillStyle = '#052205'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(57,255,20,0.2)'; ctx.lineWidth = 2;
    ctx.strokeRect(20,20,canvas.width-40,canvas.height-40);
    ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 60, 0, Math.PI*2); ctx.stroke();
  }

  function render() {
    drawField();
    // Draw Players
    players.forEach(p => {
      ctx.fillStyle = p.team === 'home' ? '#ff3333' : '#3366ff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
      ctx.fillText(p.no, p.x, p.y+5);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText(p.name, p.x, p.y+35);
    });
    // Draw Shapes (Toni's arrows)
    shapes.forEach(s => {
      drawArrow(s.fx, s.fy, s.tx, s.ty, s.color);
    });
  }

  function drawArrow(fx, fy, tx, ty, color) {
    const headlen = 10;
    const angle = Math.atan2(ty-fy, tx-fx);
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.lineTo(tx-headlen*Math.cos(angle-Math.PI/6), ty-headlen*Math.sin(angle-Math.PI/6));
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx-headlen*Math.cos(angle+Math.PI/6), ty-headlen*Math.sin(angle+Math.PI/6));
    ctx.stroke();
  }

  // INTERACTION
  function setMode(m) { mode = m; }
  function clearBoard() { shapes = []; render(); }

  // TONI BRAIN
  function sendMsg() {
    const input = document.getElementById('chatInput');
    const val = input.value.toLowerCase();
    if(!val) return;
    
    appendChat(input.value, 'user');
    input.value = '';

    setTimeout(() => {
      if(val.includes('laufweg')) {
        shapes.push({fx: 200, fy: 300, tx: 500, ty: 100, color: '#39FF14'});
        appendChat("Toni: Ich habe den Laufweg für Müller eingezeichnet. Er sollte in den freien Raum stoßen.", "ai");
        render();
      } else if(val.includes('zeitung')) {
        appendChat("Toni: Alles klar, ich erstelle das Layout für die Stadionzeitung.", "ai");
        generatePrint();
      } else {
        appendChat("Toni: Verstanden. Soll ich eine Videoanalyse starten oder die Taktik anpassen?", "ai");
      }
    }, 800);
  }

  function appendChat(txt, side) {
    const chat = document.getElementById('chat');
    chat.innerHTML += `<div class="msg ${side}">${txt}</div>`;
    chat.scrollTop = chat.scrollHeight;
  }

  // MANAGER & PRINT
  function showBusiness() {
    const content = document.getElementById('subContent');
    content.innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="sponsor-card">⚡ Neon-Energy<br><small>Hauptsponsor</small></div>
        <div class="sponsor-card">⚽ Sport-Shop<br><small>Ausrüster</small></div>
      </div>
    `;
  }

  function generatePrint() {
    const canvasData = canvas.toDataURL();
    const win = window.open('', '_blank');
    win.document.write(`
      <html><body style="font-family:sans-serif; padding:50px;">
        <h1 style="color:#052205">TONI 2.0 - MATCHDAY REPORT</h1>
        <hr>
        <h2>Aktuelle Taktik</h2>
        <img src="${canvasData}" style="width:100%; border:2px solid #000;">
        <h3>Kader-Status</h3>
        <p>Alle Spieler einsatzbereit. Toni empfiehlt hohes Pressing.</p>
        <h4>Sponsoren</h4>
        <p>Neon-Energy | Sport-Shop | Lokal-Bank</p>
      </body></html>
    `);
    win.print();
  }

  function toggleOverlay(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
  }

  function startVoice() {
    appendChat("Toni: Mikrofon aktiviert. Ich höre zu...", "ai");
  }

  render();
</script>
</body>
</html>
