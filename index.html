<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktikboard Pro - Coach Björn</title>
    <style>
        :root { --pitch: #2d5a27; --line: rgba(255,255,255,0.8); }
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; }
        #top { background: #1a1a1a; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        #pitch-area { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; padding: 10px; }
        #pitch { width: 100%; height: 100%; max-width: 1000px; background: var(--pitch); border: 3px solid #fff; position: relative; }
        .mid-line { position: absolute; width: 100%; height: 2px; background: var(--line); top: 50%; left: 0; }
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.2); }
        .goal-std { width: 90px; height: 20px; left: 50%; transform: translateX(-50%); }
        .player { width: 30px; height: 30px; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; z-index: 50; cursor: move; touch-action: none; }
        .red { background: #b71c1c; color: #fff; } .blue { background: #0d47a1; color: #fff; }
        #ball { width: 18px; height: 18px; background: #fff; border: 2px solid #000; z-index: 100; transition: all 0.5s; }
        #chat { height: 250px; background: #fff; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; color: #000; background: #f4f4f4; }
        #input-row { padding: 10px; background: #ddd; display: flex; gap: 5px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        button.send { background: #2e7d32; color: #fff; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
<div id="top">
    <button class="btn" onclick="initF('11v11')">11 vs 11</button>
    <button class="btn" onclick="initF('funino')">Funino</button>
    <button class="btn" onclick="setK()" style="color:#0f8">🔑 Key</button>
</div>
<div id="pitch-area"><div id="pitch"><div class="mid-line"></div><div id="ball" class="player" style="top:48%; left:49%"></div><div id="players"></div><div id="goals"></div></div></div>
<div id="chat"><div id="log"></div><div id="input-row"><input type="text" id="msg" placeholder="Anweisung..."><button class="send" onclick="send()">OK</button></div></div>

<script>
    const pL = document.getElementById('players'), gL = document.getElementById('goals'), log = document.getElementById('log'), ball = document.getElementById('ball'), input = document.getElementById('msg');
    let key = localStorage.getItem('bjorn_key_final') || "";

    function setK() { const k = prompt("Key:"); if(k) { localStorage.setItem('bjorn_key_final', k.trim()); location.reload(); } }
    function addL(n, t) { log.innerHTML += `<div><b>${n}:</b> ${t}</div>`; log.scrollTop = log.scrollHeight; }

    function createP(t, l, c, n) {
        const p = document.createElement('div'); p.className = 'player ' + c;
        p.style.top = t + "%"; p.style.left = l + "%"; p.innerText = n;
        pL.appendChild(p); drag(p);
    }

    function initF(m) {
        pL.innerHTML = ""; gL.innerHTML = "";
        if(m === '11v11') {
            const r = [{t:85,l:48},{t:75,l:15},{t:75,l:35},{t:75,l:60},{t:75,l:80},{t:55,l:20},{t:55,l:40},{t:55,l:60},{t:55,l:75},{t:35,l:40},{t:35,l:55}];
            r.forEach((p,i)=>createP(p.t,p.l,'red',i+1));
        } else {
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
        }
    }

    async function send() {
        const val = input.value; if(!val || !key) return;
        addL("Björn", val); input.value = "";
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Kurze Antwort. Steuerung: [BALL:X:Y]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            if(d.error) { addL("System", "Google sagt: " + d.error.message); }
            else {
                const txt = d.candidates[0].content.parts[0].text; addL("KI", txt);
                const bM = txt.match(/\[BALL:(\d+):(\d+)\]/); if(bM) { ball.style.left = bM[1]+"%"; ball.style.top = bM[2]+"%"; }
            }
        } catch(e) { addL("System", "Netzwerk-Fehler. Bitte Verbindung prüfen."); }
    }

    function drag(el) {
        let active = false;
        el.onmousedown = el.ontouchstart = (e) => { active = true; el.style.transition = "none"; };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!active) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
            el.style.left = (x/r.width*100)-2 + "%"; el.style.top = (y/r.height*100)-2 + "%";
        };
        window.onmouseup = window.ontouchend = () => { active = false; el.style.transition = "all 0.5s"; };
    }

    drag(ball);
    initF('11v11');
</script>
</body>
</html>
