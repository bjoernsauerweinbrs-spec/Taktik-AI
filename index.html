<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 - High-Tech Taktik Board</title>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --accent-green: #2ecc71;
            --text-light: #e0e0e0;
            --border-color: #333;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
        }

        /* 3-Spalten-Layout */
        .cockpit {
            display: grid;
            grid-template-columns: 80px 1fr 350px;
            height: 100vh;
        }

        /* Linke Spalte: Navigation */
        .nav-sidebar {
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 30px;
        }

        .nav-icon {
            width: 50px; height: 50px;
            background: #2a2a2a;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 20px;
        }

        .nav-icon:hover { background: var(--accent-green); color: black; }

        /* Mittlere Spalte: Arena */
        .arena {
            position: relative;
            background-color: #1a3a1a;
            background-image: radial-gradient(#2d5a2d 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #pitch {
            width: 90%; height: 90%;
            border: 3px solid white;
            position: relative;
            background: #27ae60;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Rechte Spalte: Toni-Box */
        .toni-box {
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .video-stream {
            height: 200px;
            background: black;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #555;
        }

        .chat-history {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        /* Aktentasche Overlay */
        #briefcase-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            grid-gap: 20px;
        }

        .kachel {
            width: 150px; height: 150px;
            background: #333;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .kachel:hover { background: var(--accent-green); color: black; }

        /* Spieler-Marker */
        .player {
            width: 40px; height: 40px;
            background: red;
            color: white;
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: move;
            border: 2px solid white;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="cockpit">
    <nav class="nav-sidebar">
        <div class="nav-icon" onclick="toggleBriefcase()" title="Aktentasche">💼</div>
        <div class="nav-icon" title="Mikrofon">🎤</div>
        <div class="nav-icon" onclick="location.reload()" title="Reset">🔄</div>
    </nav>

    <main class="arena" id="arena">
        <div id="pitch">
            <div style="position: absolute; left: 50%; height: 100%; border-left: 2px solid white;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%);"></div>
            
            <div class="player" id="p1" style="top: 20%; left: 40%;" draggable="true">10</div>
            <div class="player" id="p2" style="top: 50%; left: 45%;" draggable="true">8</div>
        </div>
    </main>

    <aside class="toni-box">
        <div class="video-stream" id="video-placeholder">
            [VIDEO ANALYSE STREAM - MEDIAPIPE]
        </div>
        <div class="chat-history" id="chat">
            <div style="color: var(--accent-green);"><b>Toni:</b> Bereit, Coach. Was steht heute an?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Befehl an Toni...">
            <button onclick="sendMessage()" style="padding: 10px; background: var(--accent-green); border: none; border-radius: 5px; cursor: pointer;">Send</button>
        </div>
    </aside>
</div>

<div id="briefcase-overlay" onclick="toggleBriefcase()">
    <div class="grid-3x3">
        <div class="kachel"><span>🏟️</span><br>KABINE</div>
        <div class="kachel"><span>📊</span><br>ANALYSE</div>
        <div class="kachel"><span>👶</span><br>KIDS</div>
        <div class="kachel"><span>⚽</span><br>MATCH</div>
        <div class="kachel"><span>🚧</span><br>TRAINING</div>
        <div class="kachel"><span>💰</span><br>BUSINESS</div>
        <div class="kachel"><span>📰</span><br>ZEITUNG</div>
        <div class="kachel"><span>🔍</span><br>SCOUTING</div>
        <div class="kachel"><span>⚙️</span><br>SYSTEM</div>
    </div>
</div>

<script>
    // --- UI LOGIK ---
    function toggleBriefcase() {
        const overlay = document.getElementById('briefcase-overlay');
        overlay.style.display = (overlay.style.display === 'flex') ? 'none' : 'flex';
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const chat = document.getElementById('chat');
        if (input.value.trim() === "") return;

        chat.innerHTML += `<div><b>Coach:</b> ${input.value}</div>`;
        
        // Simulierter KI-Antwort-Hook
        setTimeout(() => {
            chat.innerHTML += `<div style="color: var(--accent-green);"><b>Toni:</b> Ich habe den Befehl "${input.value}" verstanden. (Anbindung an Ollama folgt)</div>`;
            chat.scrollTop = chat.scrollHeight;
        }, 1000);

        input.value = "";
    }

    // --- DRAG AND DROP LOGIK (Basic) ---
    const players = document.querySelectorAll('.player');
    const pitch = document.getElementById('pitch');

    players.forEach(player => {
        player.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', player.id);
        });
    });

    pitch.addEventListener('dragover', (e) => {
        e.preventDefault();
    });

    pitch.addEventListener('drop', (e) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text');
        const player = document.getElementById(id);
        
        const rect = pitch.getBoundingClientRect();
        const x = e.clientX - rect.left - 20; // 20 = halbe Breite Marker
        const y = e.clientY - rect.top - 20;

        player.style.left = `${(x / rect.width) * 100}%`;
        player.style.top = `${(y / rect.height) * 100}%`;
    });

    // --- LOKALE SPEICHERUNG ---
    function saveState() {
        const state = {
            chat: document.getElementById('chat').innerHTML,
            // Hier könnten Spielerpositionen etc. rein
        };
        localStorage.setItem('toni_state', JSON.stringify(state));
    }

    // Laden beim Start
    window.onload = () => {
        const saved = localStorage.getItem('toni_state');
        if (saved) {
            const state = JSON.parse(saved);
            // document.getElementById('chat').innerHTML = state.chat;
        }
    };
</script>

</body>
</html>
