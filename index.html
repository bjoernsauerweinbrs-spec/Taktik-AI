<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — Final Core</title>
    <link rel="stylesheet" href="css/toni-style.css">
</head>
<body>

    <aside class="sidebar-minimal">
        <div class="nav-btn" onclick="toggleBriefcase()">💼</div>
    </aside>

    <main id="stage">
        <div class="tools-overlay">
            <button onclick="arena.setMode('standard')">STANDARD</button>
            <button onclick="arena.setMode('funinho')">FUNINHO</button>
        </div>
        <canvas id="main-canvas"></canvas>
    </main>

    <aside class="side-panel">
        <h2>Analysezentrum</h2>
        <div id="active-setcard">
            <p class="empty">Spieler auf dem Feld anklicken...</p>
        </div>
    </aside>

    <div id="briefcase-overlay" style="display:none;" class="briefcase-modal">
        <button onclick="toggleBriefcase()" style="position:absolute; top:40px; right:40px;">SCHLIESSEN ✕</button>
        <h1 style="color:#FF6A00; letter-spacing:5px;">ZENTRALE AKTENTASCHE</h1>
        <div class="folder-grid">
            <div class="folder-card" onclick="alert('Sporttasche geöffnet')">
                <div style="font-size:50px;">👟</div>
                <h3>Sporttasche</h3>
                <p>Kader & Training</p>
            </div>
            <div class="folder-card">
                <div style="font-size:50px;">📊</div>
                <h3>Analyse</h3>
                <p>Leistungsdaten</p>
            </div>
            <div class="folder-card">
                <div style="font-size:50px;">🏢</div>
                <h3>Geschäftszimmer</h3>
                <p>Sponsoring</p>
            </div>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script>
        function toggleBriefcase() {
            const el = document.getElementById('briefcase-overlay');
            el.style.display = (el.style.display === 'none') ? 'flex' : 'none';
        }
        
        // Initialisierung des Feldes
        document.addEventListener('DOMContentLoaded', () => {
            arena.init('main-canvas');
        });
    </script>
</body>
</html>
