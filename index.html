<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Elite-Einsatz v4.2</title>
<style>
  :root {
    --bg: #010401; --neon: #39FF14; --neon-dim: rgba(57, 255, 20, 0.15);
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05); --red: #ff3333; --yellow: #ffcc00;
    --club-color: #39FF14; /* Standard, wird durch Onboarding ersetzt */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

  /* --- STRUCTURE --- */
  .app-container { display: grid; grid-template-columns: 80px 1fr 380px; height: 100vh; padding: 12px; gap: 12px; }
  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; overflow-y: auto; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
  }

  .left-nav { background: var(--glass); border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 20px; backdrop-filter: blur(15px); }
  .nav-item { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; }

  /* --- ARENA --- */
  .center-arena { background: #000; border-radius: 20px; border: 1px solid var(--neon-dim); display: flex; flex-direction: column; padding: 15px; position: relative; }
  .arena-header { display: flex; justify-content: space-between; color: var(--neon); font-size: 13px; border-bottom: 1px solid var(--glass); padding-bottom: 8px; margin-bottom: 10px; }
  #board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  canvas { background: #010a01; border-radius: 10px; max-width: 100%; height: auto; cursor: crosshair; }

  /* --- TONI LIVE --- */
  .right-toni { background: var(--glass); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; }
  .msg.ai { background: var(--neon-dim); align-self: flex-start; border-left: 4px solid var(--neon); }

  /* --- OVERLAYS --- */
  .overlay { position: fixed; inset: 20px 410px 20px 105px; background: rgba(2, 8, 2, 0.99); border: 1px solid var(--neon); border-radius: 25px; z-index: 1000; display: none; flex-direction: column; padding: 30px; backdrop-filter: blur(30px); }
  .scroll-content { flex: 1; overflow-y: auto; }

  /* FOLDER & CARDS */
  .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; margin-top: 30px; }
  .folder-item { cursor: pointer; padding: 20px; border-radius: 15px; background: var(--glass); border: 1px solid #333; text-align: center; }
  .folder-item:hover { border-color: var(--neon); }
  
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
  .fifa-card { width: 170px; height: 235px; background: var(--gold); border-radius: 10px; color: #000; position: relative; padding: 12px; cursor: pointer; font-family: 'Arial Black', sans-serif; }
  
  /* STATUS TRAFFIC LIGHT */
  .status-light { position: absolute; top: 10px; right: 10px; width: 15px; height: 15px; border-radius: 50%; border: 2px solid #000; }
  .status-green { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
  .status-yellow { background: #ffff00; box-shadow: 0 0 10px #ffff00; }
  .status-red { background: #ff0000; box-shadow: 0 0 10px #ff0000; }

  .card-rating { font-size: 38px; position: absolute; top: 10px; left: 10px; }
  .card-photo { width: 95px; height: 95px; background: rgba(0,0,0,0.1); margin: 8px auto 0 auto; border-bottom: 2px solid #000; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .card-name { text-align: center; font-size: 15px; text-transform: uppercase; border-bottom: 1px solid rgba(0,0,0,0.1); }

  /* LAB STYLE */
  .lab-card { background: rgba(255,255,255,0.02); border: 1px solid var(--neon-dim); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; }
  .lab-card::before { content:''; position:absolute; left:0; top:0; width:5px; height:100%; background:var(--neon); box-shadow:0 0 10px var(--neon); }

  /* GATES */
  .gate-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
  .gate-input { background: #000; border: 2px solid var(--neon); color: var(--neon); padding: 20px; border-radius: 12px; text-align: center; font-size: 24px; }
</style>
</head>
<body>

<div id="gate" class="gate-screen">
  <h1 style="color:var(--neon); letter-spacing: 10px;">TONI 2.0</h1>
  <input type="password" id="gate-pw" class="gate-input" placeholder="PASSWORT">
  <button onclick="unlock()" style="background:var(--neon); padding:15px 60px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">START</button>
</div>

<div id="onboarding" class="gate-screen" style="display:none">
  <div style="text-align:center; max-width:400px;">
    <h2 id="ob-title" style="color:var(--neon);">IDENTITY SYNC</h2>
    <p id="ob-desc">Wie heißt du, Coach?</p>
    <input type="text" id="ob-input" class="gate-input" style="font-size:18px; letter-spacing:normal;">
    <br><br>
    <div id="color-choice" style="display:none; gap:10px; justify-content:center; margin-bottom:20px;">
      <div onclick="setClubColor('#ff0000')" style="width:40px; height:40px; background:red; cursor:pointer;"></div>
      <div onclick="setClubColor('#0000ff')" style="width:40px; height:40px; background:blue; cursor:pointer;"></div>
      <div onclick="setClubColor('#ffffff')" style="width:40px; height:40px; background:white; cursor:pointer;"></div>
      <div onclick="setClubColor('#ffff00')" style="width:40px; height:40px; background:yellow; cursor:pointer;"></div>
    </div>
    <button onclick="handleOb()" style="background:var(--neon); padding:15px 80px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; width:100%;">WEITER</button>
  </div>
</div>

<div class="app-container" id="main-app" style="display:none">
  <div class="left-nav">
    <div class="nav-item" onclick="openBriefcase()">💼</div>
    <div class="nav-item" onclick="openSektor('analyse')">🧪</div>
    <div class="nav-item" onclick="toniSpeak('Stadionzeitung wird gedruckt!')">📰</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="systemReset()" style="color:var(--red); border-color:var(--red);">🔁</div>
  </div>

  <div class="center-arena">
    <div class="arena-header">
      <strong id="club-title">ARENA</strong>
      <span id="age-title">[ ELITE ]</span>
    </div>
    <div id="board-wrap">
      <canvas id="arena-canvas" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="color:var(--neon); font-weight:bold; display:flex; justify-content:space-between;">TONI AI <span>LIVE</span></div>
    <div class="chat-history" id="chat-box"></div>
    <input type="text" id="cmd" placeholder="Anweisung..." style="background:#111; border:1px solid #333; color:#fff; padding:12px; border-radius:10px;" onkeypress="if(event.key==='Enter') processCmd()">
  </div>
</div>

<div id="hub-ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 id="hub-title" style="margin:0; color:var(--neon);">HUB</h2>
    <span onclick="closeHub()" style="cursor:pointer; font-size:40px; line-height:0.5;">✕</span>
  </div>
  <div id="hub-content" class="scroll-content"></div>
</div>

<script>
  const canvas = document.getElementById('arena-canvas');
  const ctx = canvas.getContext('2d');
  
  let user = JSON.parse(localStorage.getItem('toni42_user')) || null;
  let squad = JSON.parse(localStorage.getItem('toni42_squad')) || [];

  // MUSTER-SPIELER GENERIEREN (16 Spieler)
  if(squad.length === 0) {
    const names = ['Müller', 'Schmidt', 'Schneider', 'Fischer', 'Weber', 'Meyer', 'Wagner', 'Becker', 'Schulz', 'Hoffmann', 'Schäfer', 'Koch', 'Bauer', 'Richter', 'Klein', 'Wolf'];
    const positions = ['TW', 'IV', 'IV', 'RV', 'LV', 'ZM', 'ZM', 'LM', 'RM', 'ST', 'ST', 'ZM', 'IV', 'RV', 'LM', 'ST'];
    for(let i=0; i<16; i++) {
      squad.push({
        id: i, name: names[i], pos: positions[i], rating: 75+Math.floor(Math.random()*15),
        status: i < 11 ? 'match' : (i < 14 ? 'training' : 'absent'),
        form: 60 + Math.floor(Math.random()*40),
        x: 100 + (i*50), y: 650, // Startposition auf der Bank
        weight: 75+i, fat: 10+Math.random()*5, muscle: 35+Math.random()*5, bpm: 60+Math.random()*10, hrv: 50+Math.random()*20, sleep: 70+Math.random()*20, img: ''
      });
    }
    localStorage.setItem('toni42_squad', JSON.stringify(squad));
  }

  let obStep = 0; let curClubColor = '#39FF14';

  function unlock() {
    if(document.getElementById('gate-pw').value === '1234') {
      document.getElementById('gate').style.display='none';
      if(!user) document.getElementById('onboarding').style.display='flex'; else startSystem();
    } else alert("Zutritt verweigert.");
  }

  function handleOb() {
    const i = document.getElementById('ob-input');
    if(obStep === 0) {
      user = { coach: i.value };
      document.getElementById('ob-desc').innerText = "Dein Verein?";
      i.value = ""; obStep++;
    } else if(obStep === 1) {
      user.club = i.value;
      document.getElementById('ob-desc').innerText = "Wähle deine Vereinsfarbe:";
      document.getElementById('color-choice').style.display = 'flex';
      i.style.display = 'none'; obStep++;
    } else {
      user.age = "Elite";
      localStorage.setItem('toni42_user', JSON.stringify(user));
      startSystem();
    }
  }

  function setClubColor(c) { curClubColor = c; user.color = c; handleOb(); }

  function startSystem() {
    document.getElementById('onboarding').style.display='none';
    document.getElementById('main-app').style.display='grid';
    document.getElementById('club-title').innerText = user.club.toUpperCase();
    document.documentElement.style.setProperty('--club-color', user.color);
    renderArena();
    toniSpeak(`Servus ${user.coach}! Dein 16-Mann-Kader für den ${user.club} ist bereit. Alle Systeme laufen auf Hochtouren.`);
  }

  // ARENA LOGIC
  function drawPitch() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#021a02'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 2;
    
    // Feldlinien
    ctx.strokeRect(50, 50, canvas.width-100, canvas.height-200);
    ctx.beginPath(); ctx.moveTo(canvas.width/2, 50); ctx.lineTo(canvas.width/2, canvas.height-150); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width/2, (canvas.height-100)/2, 80, 0, Math.PI*2); ctx.stroke();
    
    // Strafräume
    ctx.strokeRect(50, 200, 120, 300); ctx.strokeRect(canvas.width-170, 200, 120, 300);
    
    // ERSATZBANK BEREICH
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(0, canvas.height-140, canvas.width, 140);
    ctx.strokeStyle = varColor('--neon'); ctx.setLineDash([5, 5]);
    ctx.strokeRect(5, canvas.height-135, canvas.width-10, 130);
    ctx.setLineDash([]);
    ctx.fillStyle = varColor('--neon'); ctx.font = '10px Arial';
    ctx.fillText("ERSATZBANK / ABWESEND", 15, canvas.height-120);
  }

  function renderArena() {
    drawPitch();
    squad.forEach(p => {
      if(p.y < canvas.height - 150) {
        // Spieler auf dem Feld -> Punkt in Vereinsfarbe
        ctx.shadowBlur = 10; ctx.shadowColor = user.color;
        ctx.fillStyle = user.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = 'bold 12px Arial'; ctx.textAlign='center';
        ctx.fillText(p.name[0], p.x, p.y+4);
      } else {
        // Spieler auf Bank -> Mini-Karte
        ctx.fillStyle = '#bf953f'; ctx.fillRect(p.x-20, p.y-30, 40, 60);
        ctx.fillStyle = '#000'; ctx.font = '8px Arial'; ctx.fillText(p.name, p.x, p.y+20);
        ctx.fillText(p.pos, p.x, p.y-15);
      }
    });
  }

  // DRAG & DROP
  let dragging = null;
  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width/rect.width);
    const my = (e.clientY - rect.top) * (canvas.height/rect.height);
    dragging = squad.find(p => Math.hypot(p.x - mx, p.y - my) < 30);
  };
  canvas.onmousemove = (e) => {
    if(dragging) {
      const rect = canvas.getBoundingClientRect();
      dragging.x = (e.clientX - rect.left) * (canvas.width/rect.width);
      dragging.y = (e.clientY - rect.top) * (canvas.height/rect.height);
      renderArena();
    }
  };
  canvas.onmouseup = () => { dragging = null; localStorage.setItem('toni42_squad', JSON.stringify(squad)); };

  // HUB LOGIC
  function openBriefcase() {
    const ov = document.getElementById('hub-ov'); ov.style.display='flex';
    const c = document.getElementById('hub-content'); c.className = 'folder-grid';
    c.innerHTML = `
      <div class="folder-item" onclick="openSektor('kabine')"><span>👕</span><br>KABINE</div>
      <div class="folder-item" onclick="openSektor('business')"><span>🤝</span><br>MANAGEMENT</div>
    `;
  }

  function openSektor(s) {
    const c = document.getElementById('hub-content'); c.innerHTML = '';
    if(s === 'kabine') {
      c.className = 'fifa-grid';
      squad.forEach(p => {
        const sClass = p.status === 'match' ? 'status-green' : (p.status === 'training' ? 'status-yellow' : 'status-red');
        c.innerHTML += `
          <div class="fifa-card" onclick="toggleStatus(${p.id})">
            <div class="status-light ${sClass}"></div>
            <div class="card-rating">${p.rating}</div>
            <div class="card-photo">👤</div>
            <div class="card-name">${p.name}</div>
            <div style="font-size:10px; text-align:center; margin-top:5px;">FORM: ${p.form}% | POS: ${p.pos}</div>
          </div>`;
      });
    } else if(s === 'analyse') {
      document.getElementById('hub-ov').style.display='flex';
      squad.forEach(p => {
        c.innerHTML += `<div class="lab-card"><strong>${p.name}</strong><br><small>Fett: ${p.fat.toFixed(1)}% | HRV: ${p.hrv}ms | Puls: ${p.bpm}bpm</small></div>`;
      });
    }
  }

  function toggleStatus(id) {
    const p = squad.find(x => x.id === id);
    if(p.status === 'match') p.status = 'training';
    else if(p.status === 'training') p.status = 'absent';
    else p.status = 'match';
    localStorage.setItem('toni42_squad', JSON.stringify(squad));
    openSektor('kabine');
  }

  function toniSpeak(t) {
    const box = document.getElementById('chat-box'); box.innerHTML += `<div class="msg ai">Toni: ${t}</div>`;
    const ut = new SpeechSynthesisUtterance(t); ut.lang = 'de-DE'; ut.pitch = 0.8;
    const voices = window.speechSynthesis.getVoices();
    ut.voice = voices.find(v => v.name.includes('Google') && v.name.includes('Deutsch')) || voices[0];
    window.speechSynthesis.speak(ut);
  }

  function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function resetMemory() { localStorage.clear(); location.reload(); }
  function closeHub() { document.getElementById('hub-ov').style.display='none'; }
  if(user) startSystem();
</script>
</body>
</html>
