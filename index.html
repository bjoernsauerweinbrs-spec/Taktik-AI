<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="TITAN v10 ELITE - Das kostenlose All-in-One Betriebssystem für den modernen Fußball.">
    <title>TITAN v10 ELITE</title>

    <style>
        /* ======================================================================= */
        /* I. Design System & Root Variablen                                       */
        /* ======================================================================= */
        :root {
            --bg-dark: #0d1117;
            --bg-medium: #161b22;
            --bg-light: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #848d97;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #e3b341;
            --gold-gradient: linear-gradient(145deg, #d4af37, #b48c2c, #d4af37);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        /* FIX: Verhindert den schwarzen Bildschirm durch Overlay-Konflikte */
        [hidden] { display: none !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%; width: 100%;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 15px;
            overflow: hidden;
        }

        button { font-family: var(--font-sans); background: none; border: none; color: inherit; cursor: pointer; }
        h1, h2, h3 { font-weight: 600; margin-bottom: 0.8em; }

        /* ======================================================================= */
        /* II. App-Architektur (Pro-Grid)                                          */
        /* ======================================================================= */
        .app-container {
            display: grid;
            height: 100vh; width: 100vw;
            grid-template-areas:
                "header header header"
                "nav    main   aside"
                "nav    main   aside";
            grid-template-columns: 280px 1fr 350px;
            grid-template-rows: 60px 1fr;
            gap: 12px; padding: 12px;
        }

        .app-header { grid-area: header; }
        #left-panel { grid-area: nav; }
        #main-arena { grid-area: main; }
        #right-panel { grid-area: aside; }

        .app-header, #left-panel, #main-arena, #right-panel {
            background: var(--bg-medium);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex; flex-direction: column; overflow: hidden;
        }

        .app-header { flex-direction: row; justify-content: space-between; align-items: center; padding: 0 20px; }
        #left-panel, #right-panel { padding: 20px; }
        #main-arena { padding: 8px; position: relative; }

        /* ======================================================================= */
        /* III. Overlays & Spinner                                                 */
        /* ======================================================================= */
        .system-overlay {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(10px);
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .login-box { width: 90%; max-width: 380px; padding: 40px; background: var(--bg-medium); border-radius: var(--radius-lg); border: 1px solid var(--border-color); text-align: center; }
        .login-box select, .login-box button { width: 100%; padding: 12px; margin-top: 15px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-light); color: white; }
        .login-box button { background: var(--accent-green); font-weight: bold; border: none; cursor: pointer; }

        /* ======================================================================= */
        /* IV. Gold Card & Arena                                                   */
        /* ======================================================================= */
        .gold-card {
            background: var(--gold-gradient); color: #1a1a1a;
            border-radius: var(--radius-md); padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; gap: 12px;
        }

        #board-wrap { flex-grow: 1; position: relative; border-radius: var(--radius-md); background-color: #011a01; overflow: hidden; }
        #main-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

        .dialog-overlay { position: fixed; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
        .dialog-overlay.is-active { display: flex; }
        .dialog-box { width: 90vw; max-width: 1200px; height: 85vh; background: var(--bg-medium); border-radius: var(--radius-lg); border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .dialog-header { padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .dialog-content { padding: 24px; overflow-y: auto; flex-grow: 1; }

        @media (max-width: 1200px) {
            .app-container { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
            #left-panel, #right-panel { display: none; }
        }
    </style>
</head>
<body>

    <div id="system-loader" class="system-overlay"><div class="spinner"></div></div>

    <div id="login-screen" class="system-overlay" hidden>
        <div class="login-box">
            <h1>TITAN v10 ELITE</h1>
            <p style="color: var(--text-secondary); margin-bottom: 10px;">PRO-VERSION INITIALISIEREN</p>
            <form id="login-form">
                <select id="profile-selector"></select>
                <button type="submit">SYSTEM STARTEN</button>
            </form>
        </div>
    </div>

    <div id="main-app" class="app-container" hidden>
        <header class="app-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="user-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-light); display: flex; align-items: center; justify-content: center; font-weight: bold;"></div>
                <div>
                    <div id="user-name" style="font-weight: bold;"></div>
                    <div id="user-role" style="font-size: 11px; color: var(--text-secondary);"></div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="live-session-btn" style="padding: 5px 15px; border: 1px solid var(--accent-red); border-radius: 20px; color: var(--accent-red);">🎙️ LIVE</button>
            </div>
        </header>

        <aside id="left-panel">
            <h3>Mannschaft</h3>
            <div id="squad-list" style="margin-bottom: 20px; flex-grow: 1; overflow-y: auto;"></div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="login-box button" style="margin:0; text-align: left;" data-action="open-clipboard">📋 Tactical Clipboard</button>
                <button class="login-box button" style="margin:0; text-align: left;" data-action="open-manager-cockpit">💼 Manager Cockpit</button>
            </div>
        </aside>

        <main id="main-arena">
            <div id="board-wrap"><canvas id="main-canvas"></canvas></div>
        </main>

        <aside id="right-panel">
            <h3>TONI AI MONITOR</h3>
            <div id="chat-box" style="flex-grow: 1; overflow-y: auto; font-size: 13px; margin-bottom: 15px;"></div>
            <form id="chat-form" style="display: flex; gap: 10px;">
                <input id="chat-input" placeholder="Befehl..." style="flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 8px;">
                <button type="submit" style="background: var(--accent-blue); padding: 10px 15px; border-radius: 8px; color: white;">➤</button>
            </form>
        </aside>
    </div>

    <div id="manager-cockpit-dialog" class="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-header"><h2>💼 MANAGER COCKPIT</h2><button data-action="close-dialog">✕</button></div>
            <div id="manager-dialog-content" class="dialog-content"></div>
        </div>
    </div>

    <div id="player-dashboard-dialog" class="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-header"><h2 id="player-dialog-title"></h2><button data-action="close-dialog">✕</button></div>
            <div id="player-dialog-content" class="dialog-content"></div>
        </div>
    </div>
<script>
    'use strict';

    /* ======================================================================= */
    /* I. MOCK DATABASE & API SERVICE (Elite-Datensatz)                        */
    /* ======================================================================= */
    const MockData = {
        profiles: {
            "coach_meier": { id: "coach_meier", name: "Björn Meier", role: "Cheftrainer", club: "FC TITAN ELITE", avatar: "BM" },
            "manager_schmidt": { id: "manager_schmidt", name: "Jens Schmidt", role: "Manager", club: "FC TITAN ELITE", avatar: "JS" }
        },
        squad: {
            "p1": { id: "p1", name: "Müller", num: 13, pos: "ST", canvas: {x: 600, y: 200}, att: { pac: 90, sho: 88, pas: 80, dri: 85, def: 40, phy: 78 }, ovr: 88, bio: { hrv: 92, fatPct: 11.2, readiness: 95 }, mental: { sleep: 8, stress: 2, motiv: 9 }, stats: { minutes: 0, performance: 100 } },
            "p2": { id: "p2", name: "Kimmich", num: 6, pos: "ZDM", canvas: {x: 450, y: 250}, att: { pac: 75, sho: 78, pas: 91, dri: 84, def: 82, phy: 79 }, ovr: 89, bio: { hrv: 95, fatPct: 12.1, readiness: 98 }, mental: { sleep: 9, stress: 1, motiv: 10 }, stats: { minutes: 0, performance: 100 } },
            "p3": { id: "p3", name: "Hummels", num: 5, pos: "IV", canvas: {x: 250, y: 150}, att: { pac: 65, sho: 60, pas: 78, dri: 72, def: 90, phy: 84 }, ovr: 86, bio: { hrv: 85, fatPct: 13.5, readiness: 88 }, mental: { sleep: 6, stress: 4, motiv: 8 }, stats: { minutes: 0, performance: 100 } },
            "p4": { id: "p4", name: "Neuer", num: 1, pos: "TW", canvas: {x: 80, y: 250}, att: { pac: 60, sho: 30, pas: 65, dri: 40, def: 88, phy: 82 }, ovr: 85, bio: { hrv: 91, fatPct: 12.8, readiness: 94 }, mental: { sleep: 8, stress: 2, motiv: 9 }, stats: { minutes: 0, performance: 100 } }
        },
        finances: {
            budget: 50000000, salaries: 35000000, infrastructure: 8000000,
        },
        contracts: [
            { id: "p3", name: "Hummels", type: "player", endDate: new Date(Date.now() + 1000*60*60*24*120) }, // 120 Tage
            { id: "p1", name: "Müller", type: "player", endDate: new Date(Date.now() + 1000*60*60*24*400) }
        ]
    };

    const ApiService = {
        _delay(ms = 500) { return new Promise(res => setTimeout(res, ms)); },
        async getProfiles() { await this._delay(300); return Object.values(MockData.profiles); },
        async loadProfileData(id) {
            await this._delay(800);
            return {
                user: MockData.profiles[id],
                squad: JSON.parse(JSON.stringify(MockData.squad)),
                finances: JSON.parse(JSON.stringify(MockData.finances)),
                contracts: JSON.parse(JSON.stringify(MockData.contracts))
            };
        }
    };

    /* ======================================================================= */
    /* II. APPLICATION STATE & UI MANAGER (Elite Logic)                        */
    /* ======================================================================= */
    const AppState = { user: null, squad: null, finances: null, contracts: null };

    const UIManager = {
        init() {
            this.elements = {};
            const ids = [
                'system-loader', 'login-screen', 'profile-selector', 'login-form', 'main-app',
                'user-avatar', 'user-name', 'user-role', 'main-canvas', 'chat-box', 'chat-form', 'chat-input',
                'squad-list', 'player-dashboard-dialog', 'player-dialog-title', 'player-dialog-content',
                'manager-cockpit-dialog', 'manager-dialog-content'
            ];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) this.elements[id] = el;
            });
            this.bindEvents();
        },

        bindEvents() {
            // Login Trigger
            this.elements['login-form'].onsubmit = (e) => {
                e.preventDefault();
                App.login(this.elements['profile-selector'].value);
            };

            // Globale Dialog-Steuerung (Elite-Style)
            document.addEventListener('click', (e) => {
                const action = e.target.closest('[data-action]')?.dataset.action;
                if (!action) return;

                if (action === 'close-dialog') {
                    e.target.closest('.dialog-overlay').classList.remove('is-active');
                }
                if (action === 'open-manager-cockpit') {
                    this.renderManagerCockpit();
                    this.elements['manager-cockpit-dialog'].classList.add('is-active');
                }
                if (action === 'logout') App.logout();
            });
        },

        renderAppLayout() {
            const { user } = AppState;
            this.elements['user-name'].textContent = user.name;
            this.elements['user-role'].textContent = user.club;
            this.elements['user-avatar'].textContent = user.avatar;
            this.renderSquadList();
        },

        renderSquadList() {
            const list = this.elements['squad-list'];
            list.innerHTML = '';
            Object.values(AppState.squad).forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'login-box button';
                btn.style.cssText = "text-align:left; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;";
                btn.innerHTML = `<span>${p.num} ${p.name}</span> <strong style="color:var(--accent-green)">${p.ovr}</strong>`;
                btn.onclick = () => this.renderPlayerDashboard(p.id);
                list.appendChild(btn);
            });
        },

        renderPlayerDashboard(id) {
            const p = AppState.squad[id];
            this.elements['player-dialog-title'].textContent = `DIAGNOSTIK: ${p.name}`;
            this.elements['player-dialog-content'].innerHTML = `
                <div class="gold-card">
                    <div style="display:flex; justify-content:space-between; font-size:20px;">
                        <strong>${p.ovr} OVR</strong> <strong>${p.pos}</strong>
                    </div>
                    <div style="text-align:center; font-size:24px; margin:10px 0;">${p.name.toUpperCase()}</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-weight:bold;">
                        <div>PAC: ${p.att.pac}</div><div>DRI: ${p.att.dri}</div>
                        <div>SHO: ${p.att.sho}</div><div>DEF: ${p.att.def}</div>
                        <div>PAS: ${p.att.pas}</div><div>PHY: ${p.att.phy}</div>
                    </div>
                    <div style="margin-top:15px; font-size:12px; border-top:1px solid rgba(0,0,0,0.1); padding-top:10px;">
                        BIA: HRV ${p.bio.hrv}ms | Readiness ${p.bio.readiness}% | Fett ${p.bio.fatPct}%
                    </div>
                </div>
            `;
            this.elements['player-dashboard-dialog'].classList.add('is-active');
        },

        renderManagerCockpit() {
            const { finances: f, contracts: c } = AppState;
            const costs = f.salaries + f.infrastructure;
            const liquidity = f.budget - costs;
            
            this.elements['manager-dialog-content'].innerHTML = `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                    <div>
                        <h3>FINANZ-STATUS</h3>
                        <p>Budget: ${f.budget.toLocaleString()} €</p>
                        <p>Kosten: ${costs.toLocaleString()} €</p>
                        <p><strong>Liquidität: ${liquidity.toLocaleString()} €</strong></p>
                    </div>
                    <div>
                        <h3>CONTRACT RADAR</h3>
                        ${c.map(con => `
                            <div style="padding:10px; border-left:4px solid ${ (con.endDate - Date.now()) < 1000*60*60*24*180 ? 'var(--accent-red)' : 'var(--accent-green)' }; background:var(--bg-light); margin-bottom:10px;">
                                <strong>${con.name}</strong><br>
                                <small>Endet am: ${con.endDate.toLocaleDateString()}</small>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    };
    /* ======================================================================= */
    /* III. ARENA ENGINE (Pro-Board & Substitution AI)                         */
    /* ======================================================================= */
    const ArenaEngine = {
        init() {
            this.canvas = UIManager.elements['main-canvas'];
            this.ctx = this.canvas.getContext('2d');
            this.dpr = window.devicePixelRatio || 1;
            this.isDragging = false;
            this.dragTarget = null;
            
            this.setupCanvas();
            this.bindEvents();
            this.renderLoop();

            // Start der medizinischen Echtzeit-Analyse (Substitution AI)
            setInterval(() => this.SubstitutionAI.update(AppState.squad), 5000);
        },
        
        setupCanvas() {
            const rect = this.canvas.parentElement.getBoundingClientRect();
            this.canvas.width = rect.width * this.dpr;
            this.canvas.height = rect.height * this.dpr;
            this.ctx.scale(this.dpr, this.dpr);
        },

        bindEvents() {
            const getPos = (e) => {
                const r = this.canvas.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                return { x: t.clientX - r.left, y: t.clientY - r.top };
            };
            
            this.canvas.onpointerdown = (e) => {
                const pos = getPos(e);
                const p = Object.values(AppState.squad).find(s => Math.hypot(s.canvas.x - pos.x, s.canvas.y - pos.y) < 25);
                if (p) { this.isDragging = true; this.dragTarget = p; }
            };
            this.canvas.onpointermove = (e) => {
                if (this.isDragging && this.dragTarget) {
                    const pos = getPos(e);
                    this.dragTarget.canvas.x = pos.x;
                    this.dragTarget.canvas.y = pos.y;
                }
            };
            this.canvas.onpointerup = () => { this.isDragging = false; this.dragTarget = null; };
            window.addEventListener('resize', () => this.setupCanvas());
        },

        renderLoop() {
            const w = this.canvas.width / this.dpr, h = this.canvas.height / this.dpr;
            this.ctx.clearRect(0, 0, w, h);
            this.drawPitch(w, h);
            Object.values(AppState.squad).forEach(p => this.drawPlayer(p));
            requestAnimationFrame(() => this.renderLoop());
        },

        drawPitch(w, h) {
            this.ctx.fillStyle = '#011a01'; this.ctx.fillRect(0,0,w,h);
            this.ctx.strokeStyle = 'rgba(255,255,255,0.15)'; this.ctx.lineWidth = 2;
            this.ctx.strokeRect(20, 20, w-40, h-40);
            this.ctx.beginPath(); this.ctx.moveTo(w/2, 20); this.ctx.lineTo(w/2, h-20); this.ctx.stroke();
            this.ctx.beginPath(); this.ctx.arc(w/2, h/2, 60, 0, 2*Math.PI); this.ctx.stroke();
        },

        drawPlayer(p) {
            const { x, y } = p.canvas;
            this.ctx.save();
            
            // ELITE Fatigue Blinking: P(t) = P0 * e^(-kt)
            if (p.stats.performance < 75) {
                this.ctx.shadowBlur = 15;
                this.ctx.shadowColor = `rgba(248, 81, 73, ${Math.abs(Math.sin(Date.now() / 350))})`;
            }

            this.ctx.beginPath();
            this.ctx.arc(x, y, 22, 0, 2 * Math.PI);
            this.ctx.fillStyle = p.pos === 'TW' ? 'var(--accent-yellow)' : 'var(--accent-blue)';
            this.ctx.fill();
            this.ctx.restore();

            this.ctx.fillStyle = '#fff';
            this.ctx.font = 'bold 16px var(--font-sans)';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText(p.num, x, y);
            
            this.ctx.font = '10px var(--font-sans)';
            this.ctx.fillText(p.name.toUpperCase(), x, y + 35);
        },

        SubstitutionAI: {
            update(squad) {
                Object.values(squad).forEach(p => {
                    p.stats.minutes += 1;
                    const k = 0.0035; // Profi-Ermüdungsfaktor
                    p.stats.performance = p.bio.readiness * Math.exp(-k * p.stats.minutes);
                });
            }
        }
    };

    /* ======================================================================= */
    /* IV. TONI AI (Kognitive Engine)                                          */
    /* ======================================================================= */
    const ToniAI = {
        init() {
            this.elements = UIManager.elements;
            this.elements['chat-form'].onsubmit = (e) => { e.preventDefault(); this.handleInput(); };
            this.speak("Toni AI v10 Elite online. System-Check für Bad Hersfeld läuft...");
            this.morningReport();
        },
        speak(msg, isUser = false) {
            const div = document.createElement('div');
            div.style.marginBottom = '12px';
            div.innerHTML = isUser ? 
                `<div style="text-align:right;"><span style="background:var(--accent-blue); padding:8px 12px; border-radius:12px 12px 0 12px; font-size:13px;">${msg}</span></div>` :
                `<small style="color:var(--accent-green); font-weight:bold;">TONI:</small><div style="font-size:13px; margin-top:4px;">${msg}</div>`;
            this.elements['chat-box'].appendChild(div);
            this.elements['chat-box'].scrollTop = this.elements['chat-box'].scrollHeight;
        },
        morningReport() {
            const critical = Object.values(AppState.squad).filter(p => p.bio.readiness < 90);
            if (critical.length > 0) this.speak(`⚠️ **MORGENREPORT:** ${critical.length} Spieler (u.a. ${critical[0].name}) sind heute unter 90% Readiness. Belastung anpassen!`);
            else this.speak("✅ **MORGENREPORT:** Gesamter Kader ist bei 100% Einsatzbereitschaft.");
        },
        handleInput() {
            const cmd = this.elements['chat-input'].value.trim();
            if (!cmd) return;
            this.speak(cmd, true);
            this.elements['chat-input'].value = '';
            
            if (cmd.toLowerCase().includes('status')) this.morningReport();
            else this.speak("Ich analysiere die Scouting-Daten für das nächste Match... Fokus auf defensives Umschaltspiel empfohlen.");
        }
    };

    /* ======================================================================= */
    /* V. SYSTEM INITIALIZATION (Der Black-Screen-Fix)                         */
    /* ======================================================================= */
    const App = {
        async init() {
            UIManager.init();
            const profiles = await ApiService.getProfiles();
            UIManager.elements['profile-selector'].innerHTML = profiles.map(p => `<option value="${p.id}">${p.name} (${p.role})</option>`).join('');
            
            // Sicherstellen, dass der Loader verschwindet und Login kommt
            setTimeout(() => {
                UIManager.elements['system-loader'].style.display = 'none';
                UIManager.elements['login-screen'].style.display = 'flex';
                UIManager.elements['login-screen'].hidden = false;
            }, 1000);
        },
        async login(profileId) {
            UIManager.elements['login-screen'].style.display = 'none';
            UIManager.elements['system-loader'].style.display = 'flex';
            
            const data = await ApiService.loadProfileData(profileId);
            Object.assign(AppState, data);
            
            setTimeout(() => {
                UIManager.elements['system-loader'].style.display = 'none';
                UIManager.elements['main-app'].style.display = 'grid';
                UIManager.elements['main-app'].hidden = false;
                UIManager.renderAppLayout();
                ArenaEngine.init();
                ToniAI.init();
            }, 1200);
        },
        logout() { window.location.reload(); }
    };

    // Ultimativer Boot-Vorgang
    window.addEventListener('load', () => App.init());
</script>
