<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 — High-Performance Trainer OS</title>
    <link rel="stylesheet" href="css/toni-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="pro-layout">

    <div id="login-screen">
        <div class="login-box">
            <h1 class="glow-text">TONI 2.0</h1>
            <p class="cyber-subtitle">SYSTEM ACCESS REQUIRED</p>
            <div class="login-form">
                <input id="password-input" type="password" class="login-input" placeholder="PASSWORT">
                <button class="login-btn" onclick="window.ToniAuth.login()">INITIALISIEREN</button>
            </div>
        </div>
    </div>

    <div id="main-system" class="hidden" style="width: 100vw; height: 100vh;">
        <div class="pro-layout" style="display: grid; grid-template-columns: 100px 1fr 350px; width: 100%; height: 100%;">
            
            <aside class="sidebar-minimal">
                <div class="control-unit" onclick="window.BriefcaseUI.toggle()" style="margin-top: 40px;">
                    <div class="icon">💼</div><span>ZENTRALE</span>
                </div>
                <div class="control-unit" onclick="window.ToniAI.toggleListening()" style="margin-top: 40px;">
                    <div class="icon" id="mic-icon">🎤</div><span>LIVE AI</span>
                </div>
            </aside>

            <main id="stage-container">
                <div id="stage">
                    <canvas id="main-canvas"></canvas>
                </div>
            </main>

            <aside class="analysis-panel">
                <div id="panel-header" style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px;">
                    <h3 style="margin:0; color:var(--data-cyan);">LIVE-FEED</h3>
                </div>
                <div id="setcard-content">
                    <div class="toni-speech-bubble">System bereit, Björn. Alle Taktik-Sektoren sind geladen. Warte auf Eingabe.</div>
                </div>
            </aside>

            <div id="toni-live-chat" class="chat-container">
                <div class="chat-header">
                    <span>TONI VOICE ADVISOR</span>
                </div>
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-area" style="padding: 10px; display: flex; gap: 5px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <input type="text" id="chat-input" style="flex:1; background:#000; border:1px solid #333; color:white; padding:8px; border-radius:5px;" placeholder="Taktik fragen...">
                    <button id="send-btn" style="background:var(--accent-orange); border:none; color:white; padding:8px 12px; border-radius:5px; cursor:pointer;">➔</button>
                </div>
            </div>

        </div> </div> <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div class="briefcase-window">
            <div id="briefcase-nav" class="pro-player-list" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="p-card Anwesend" onclick="BriefcaseUI.switchSektor('sport')" style="padding: 40px;">
                    <div style="font-size: 40px;">👟</div><h3>SPORTTASCHE</h3>
                </div>
                <div class="p-card Anwesend" onclick="BriefcaseUI.switchSektor('marketing')" style="padding: 40px;">
                    <div style="font-size: 40px;">📢</div><h3>MARKETING</h3>
                </div>
                <div class="p-card Anwesend" onclick="BriefcaseUI.switchSektor('analyse')" style="padding: 40px;">
                    <div style="font-size: 40px;">📊</div><h3>ANALYSE</h3>
                </div>
            </div>
            <div id="briefcase-content" class="hidden">
                <div class="content-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <button onclick="BriefcaseUI.backToNav()" class="login-btn" style="width: auto; padding: 10px 20px;">← ZURÜCK</button>
                    <h2 id="sector-title" style="margin:0; color:var(--accent-orange);">SEKTOR</h2>
                    <button onclick="BriefcaseUI.toggle()" class="login-btn" style="width: auto; background: #444; padding: 10px 20px;">SCHLIESSEN</button>
                </div>
                <div id="active-content"></div>
            </div>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script src="engine/toni-ai.js"></script>
    <script>
        window.ToniAuth = {
            login() {
                const pw = document.getElementById('password-input').value;
                if(pw === "Toni2026") {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-system').classList.remove('hidden');
                    setTimeout(() => { 
                        if(window.arena) arena.init('main-canvas'); 
                        if(window.ToniAI) ToniAI.init();
                    }, 100);
                } else {
                    alert("Zugriff verweigert.");
                }
            }
        };
    </script>
</body>
</html>
