<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 VR ELITE CORE</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body style="background-color: #000;">

    <a-scene 
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;"
        fog="type: exponential; color: #050a14; density: 0.01"
        background="color: #050a14">

        <a-assets timeout="10000">
            <img id="grass-tex" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg" crossorigin="anonymous"> </a-assets>


        <a-entity light="type: ambient; color: #BBB; intensity: 0.3"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1.2; castShadow: true" position="-20 40 20"></a-entity>
        <a-sky color="#050a14"></a-sky>


        <a-plane 
            id="pitch" 
            position="0 0 0" 
            rotation="-90 0 0" 
            width="68" 
            height="105" 
            color="#14532d" 
            material="roughness: 1; metalness: 0;"
            shadow="receive: true">
        </a-plane>
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="68.2" height="105.2" color="white" material="side: back"></a-plane>


        <a-entity id="toni-coach" position="36 0 -5">
            <a-cylinder position="0 0.9 0" height="1.8" radius="0.4" color="#22c55e" material="roughness: 0.5; metalness: 0.5" shadow="cast: true"></a-cylinder>
            <a-text value="COACH TONI\n(AI ANALYST)" position="0 2.2 0" color="white" align="center" side="double" scale="1.5 1.5 1.5"></a-text>
            <a-circle rotation="-90 0 0" radius="2" color="#22c55e" opacity="0.3" position="0 0.01 0"></a-circle>
        </a-entity>


        <a-entity id="team-red">
            <a-entity position="-10 0 20" shadow="cast: true">
                <a-cylinder position="0 0.9 0" height="1.8" radius="0.5" color="#ef4444" material="roughness: 0.6; metalness: 0.2"></a-cylinder>
                <a-text value="IV (L)" position="0 2 0" align="center" color="white" side="double"></a-text>
            </a-entity>
            <a-entity position="10 0 20" shadow="cast: true">
                <a-cylinder position="0 0.9 0" height="1.8" radius="0.5" color="#ef4444" material="roughness: 0.6; metalness: 0.2"></a-cylinder>
                <a-text value="IV (R)" position="0 2 0" align="center" color="white" side="double"></a-text>
            </a-entity>
             <a-entity position="-25 0 15" shadow="cast: true">
                <a-cylinder position="0 0.9 0" height="1.8" radius="0.5" color="#ef4444" material="roughness: 0.6; metalness: 0.2"></a-cylinder>
                <a-text value="AV (L)" position="0 2 0" align="center" color="white" side="double"></a-text>
            </a-entity>
            <a-entity position="25 0 15" shadow="cast: true">
                <a-cylinder position="0 0.9 0" height="1.8" radius="0.5" color="#ef4444" material="roughness: 0.6; metalness: 0.2"></a-cylinder>
                <a-text value="AV (R)" position="0 2 0" align="center" color="white" side="double"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="team-blue">
            <a-entity position="-10 0 -10" shadow="cast: true">
                <a-cylinder position="0 0.9 0" height="1.8" radius="0.5" color="#3b82f6" material="roughness: 0.6; metalness: 0.2"></a-cylinder>
                <a-text value="OPP IV" position="0 2 0" align="center" color="white" side="double"></a-text>
            </a-entity>
            <a-entity position="10 0 -10" shadow="cast: true">
                <a-cylinder position="0 0.9 0" height="1.8" radius="0.5" color="#3b82f6" material="roughness: 0.6; metalness: 0.2"></a-cylinder>
                <a-text value="OPP IV" position="0 2 0" align="center" color="white" side="double"></a-text>
            </a-entity>
        </a-entity>


        <a-entity id="rig" movement-controls="speed: 0.3" position="0 0 40">
            <a-camera position="0 1.7 0" look-controls="pointerLockEnabled: false">
                <a-cursor color="white" opacity="0.5" scale="0.5 0.5 0.5"></a-cursor>
            </a-camera>
            <a-entity oculus-touch-controls="hand: left"></a-entity>
            <a-entity oculus-touch-controls="hand: right"></a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
