<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - ACCESS CONTROL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { 
            background: #050505; 
            color: #39FF14; 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        
        /* Dynamischer Hintergrund hinter der Box */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(57, 255, 20, 0.05) 0%, transparent 70%);
            z-index: 1;
        }

        .login-box { 
            border: 1px solid #39FF14; 
            padding: 50px; 
            background: rgba(0,0,0,0.95); 
            text-align: center; 
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.15); 
            border-radius: 5px; 
            transition: 0.5s;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
        }

        h2 { letter-spacing: 5px; margin-bottom: 30px; font-size: 1.5rem; text-shadow: 0 0 10px rgba(57, 255, 20, 0.5); }
        
        input { 
            background: #000; border: 1px solid #39FF14; color: #39FF14; 
            padding: 15px; margin-bottom: 20px; width: 100%; box-sizing: border-box;
            text-align: center; font-size: 1.1rem; outline: none; 
            font-family: 'Orbitron', sans-serif; border-radius: 3px;
            box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.1);
        }

        button { 
            background: #39FF14; color: #000; border: none; padding: 15px 30px; 
            font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 2px; 
            transition: 0.3s; font-family: 'Orbitron', sans-serif; border-radius: 3px;
            text-transform: uppercase;
        }

        button:hover { 
            background: #fff; 
            box-shadow: 0 0 30px #39FF14;
            transform: scale(1.02);
        }

        /* VIDEO INTRO OVERLAY */
        #video-intro-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999;
            justify-content: center; align-items: center;
        }
        
        #intro-video-element { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            background: #000; 
        }

        .fade-out { opacity: 0; transition: opacity 1.5s ease-in-out; pointer-events: none; }

        .system-status {
            margin-top: 25px; font-size: 0.6rem; color: rgba(57, 255, 20, 0.4);
            letter-spacing: 1px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="video-intro-overlay">
        <video id="intro-video-element" playsinline webkit-playsinline preload="auto">
            <source src="gemini_generated_video_73393587.mp4" type="video/mp4">
            INITIALISIERE TONI 2.0 INTERFACE...
        </video>
    </div>

    <div class="login-box" id="login-ui">
        <h2>IDENTIFICATION</h2>
        <input type="password" id="pass" placeholder="PASSWORD" autofocus>
        <br>
        <button onclick="check()">ENTRANCE</button>
        <div class="system-status">
            TONI 2.0 BIOMETRIC INTERFACE READY<br>
            <span style="font-size: 0.5rem; opacity: 0.5;">SENSORS ONLINE | VOICE ENGINE STANDBY</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('intro-video-element');
        
        /**
         * Master-Auth Logik 2026
         */
        function check() {
            const val = document.getElementById('pass').value;
            // Dein System-Passwort
            if(val === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                startIntro();
            } else {
                alert("ACCESS DENIED");
                document.getElementById('pass').value = '';
            }
        }

        /**
         * Startet die filmische Einleitung und schaltet das Interface frei
         */
        function startIntro() {
            const loginUI = document.getElementById('login-ui');
            const overlay = document.getElementById('video-intro-overlay');

            loginUI.style.display = 'none';
            overlay.style.display = 'flex';
            
            // Video-Konfiguration für maximale Immersion
            video.muted = false; 
            video.volume = 1.0;
            
            // Play-Befehl (Durch Button-Klick ist Audio erlaubt)
            video.play().then(() => {
                console.log("TONI Intro-Sequenz läuft...");
            }).catch(e => {
                console.warn("Audio-Autoplay verhindert, starte stumm.");
                video.muted = true;
                video.play();
            });

            // Dynamischer Übergang nach Video-Ende
            video.onended = function() {
                overlay.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 1000);
            };

            // Safety-Fallback (12 Sek), falls das Video-File fehlt oder hakt
            setTimeout(() => {
                if(overlay.style.display === 'flex') {
                    window.location.href = 'app.html';
                }
            }, 12000);
        }

        // Unterstützung für die Enter-Taste
        document.getElementById('pass').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') check(); 
        });

        // Prüfung beim Laden: Wenn bereits eingeloggt, direkt zur App (optional)
        window.onload = () => {
            if(sessionStorage.getItem('toni_auth') === 'true') {
                // Hier könntest du direkt weiterleiten, wenn gewünscht.
            }
        };
    </script>
</body>
</html>
