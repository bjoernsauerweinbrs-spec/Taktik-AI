<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 - High-Tech Taktik Board</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --panel-bg: #1a1a1a;
            --accent-green: #2ecc71;
            --accent-gold: #f1c40f;
            --text-light: #e0e0e0;
            --border-color: #333;
            --pitch-green: #27ae60;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
        }

        /* 3-Spalten-Layout */
        .cockpit {
            display: grid;
            grid-template-columns: 80px 1fr 350px;
            height: 100vh;
        }

        /* Sidebars */
        .nav-sidebar, .toni-box {
            background-color: var(--panel-bg);
            border-color: var(--border-color);
            border-style: solid;
        }

        .nav-sidebar {
            border-right-width: 1px;
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px;
        }

        .nav-icon {
            width: 55px; height: 55px; background: #252525; border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; font-size: 24px;
        }

        .nav-icon:hover { background: var(--accent-green); color: black; transform: scale(1.05); }

        /* Arena */
        .arena {
            position: relative; background: #111;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }

        #pitch {
            width: 100%; max-width: 900px; aspect-ratio: 2/3;
            background: var(--pitch-green); border: 4px solid white;
            position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border-radius: 5px;
        }

        /* Feld-Markierungen */
        .pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.8); }
        .center-circle { 
            position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; 
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); 
        }
        .center-line { width: 100%; top: 50%; left: 0; border-top-width: 2px; }

        /* Spieler / Karten */
        .player-card {
            width: 50px; height: 70px; background: var(--accent-gold);
            color: black; border-radius: 5px; position: absolute;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; cursor: grab; font-size: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10;
        }

        .player-card .number { font-size: 18px; }

        /* Toni Box */
        .toni-box {
            border-left-width: 1px; display: flex; flex-direction: column;
        }

        .video-container {
            height: 220px; background: #000; margin: 15px; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 1px solid #444; overflow: hidden;
        }

        #chat-window {
            flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
        }

        .msg { padding: 10px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .msg.toni { background: #252525; color: var(--accent-green); align-self: flex-start; border-left: 3px solid var(--accent-green); }
        .msg.coach { background: var(--accent-green); color: black; align-self: flex-end; font-weight: 500; }

        .input-bar { padding: 15px; display: flex; gap: 8px; background: #151515; }
        .input-bar input {
            flex-grow: 1; background: #222; border: 1px solid #444; color: white;
            padding: 12px; border-radius: 8px; outline: none;
        }

        /* Overlay & Modals */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(10px);
        }

        .briefcase-grid {
            display: grid; grid-template-columns: repeat(3, 160px); gap: 25px;
        }

        .tile {
            height: 160px; background: #222; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; border: 1px solid #333;
        }

        .tile:hover { background: var(--accent-green); color: black; transform: translateY(-5px); }
        .tile i { font-size: 40px; margin-bottom: 10px; }

        /* Kabine View */
        .kabine-view {
            width: 80%; max-width: 1000px; background: #1a1a1a; padding: 30px; border-radius: 20px;
            display: none; flex-direction: column;
        }

        .player-list {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="cockpit">
    <nav class="nav-sidebar">
        <div class="nav-icon" onclick="openOverlay('briefcase-overlay')" title="Aktentasche">💼</div>
        <div class="nav-icon" title="Mikrofon">🎤</div>
        <div class="nav-icon" onclick="location.reload()" title="Reset">🔄</div>
    </nav>

    <main class="arena">
        <div id="pitch">
            <div class="pitch-line center-line"></div>
            <div class="center-circle"></div>
            </div>
    </main>

    <aside class="toni-box">
        <div class="video-container">
            <span style="color: #666; font-size: 12px;">LIVE ANALYSE AKTIV</span>
            <div id="mini-video-view"></div>
        </div>
        <div id="chat-window">
            <div class="msg toni">Bereit, Björn. Das Taktik-Board ist geladen. Soll ich die 5m-Raum-Analyse starten?</div>
        </div>
        <div class="input-bar">
            <input type="text" id="user-in" placeholder="Sprich mit Toni...">
            <button onclick="sendToToni()" style="background: var(--accent-green); border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">➔</button>
        </div>
    </aside>
</div>

<div id="briefcase-overlay" class="overlay">
    <div class="briefcase-grid">
        <div class="tile" onclick="showSector('kabine')"><i>🏟️</i><span>KABINE</span></div>
        <div class="tile"><i>📊</i><span>ANALYSE</span></div>
        <div class="tile"><i>👶</i><span>KIDS</span></div>
        <div class="tile"><i>⚽</i><span>MATCH</span></div>
        <div class="tile"><i>🚧</i><span>TRAINING</span></div>
        <div class="tile"><i>💰</i><span>BUSINESS</span></div>
        <div class="tile" onclick="alert('PDF wird generiert...')"><i>📰</i><span>ZEITUNG</span></div>
        <div class="tile"><i>🔍</i><span>SCOUTING</span></div>
        <div class="tile"><i>⚙️</i><span>SYSTEM</span></div>
        <button onclick="closeAllOverlays()" style="grid-column: span 3; background: none; border: 1px solid #444; color: white; padding: 10px; border-radius: 10px; margin-top: 10px;">Schließen</button>
    </div>
</div>

<div id="kabine-sector" class="overlay">
    <div class="kabine-view">
        <h2>KABINE - SPIELERKADER</h2>
        <div class="player-list" id="squad-list">
            </div>
        <button onclick="closeAllOverlays()" style="margin-top: 20px; padding: 15px; border-radius: 10px; background: #333; color: white; border: none; cursor: pointer;">Zurück zur Arena</button>
    </div>
</div>

<script>
    // --- DATEN ---
    const squad = [
        { id: 's1', name: 'Müller', nr: 25, rating: 87, pos: 'OM' },
        { id: 's2', name: 'Sane', nr: 10, rating: 84, pos: 'LA' },
        { id: 's3', name: 'Kane', nr: 9, rating: 90, pos: 'ST' },
        { id: 's4', name: 'Kimmich', nr: 6, rating: 88, pos: 'ZM' }
    ];

    // --- NAVIGATION ---
    function openOverlay(id) {
        document.getElementById(id).style.display = 'flex';
    }

    function closeAllOverlays() {
        document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
        document.querySelector('.kabine-view').style.display = 'none';
    }

    function showSector(sector) {
        if(sector === 'kabine') {
            document.getElementById('briefcase-overlay').style.display = 'none';
            document.getElementById('kabine-sector').style.display = 'flex';
            document.querySelector('.kabine-view').style.display = 'flex';
            renderKabine();
        }
    }

    // --- KABINE LOGIK ---
    function renderKabine() {
        const list = document.getElementById('squad-list');
        list.innerHTML = '';
        squad.forEach(p => {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.style.position = 'relative';
            card.innerHTML = `<span class="number">${p.nr}</span><span style="font-size:10px">${p.name}</span>`;
            card.onclick = () => deployPlayer(p);
            list.appendChild(card);
        });
    }

    function deployPlayer(playerData) {
        const pitch = document.getElementById('pitch');
        const p = document.createElement('div');
        p.className = 'player-card';
        p.id = 'active-' + playerData.id;
        p.style.top = '50%';
        p.style.left = '50%';
        p.innerHTML = `<span class="number">${playerData.nr}</span><span style="font-size:10px">${playerData.name}</span>`;
        
        // Einfaches Drag & Drop für deployed Spieler
        makeDraggable(p);
        
        pitch.appendChild(p);
        closeAllOverlays();
        addChatMessage(`Toni: ${playerData.name} wurde auf das Feld beordert.`, 'toni');
    }

    function makeDraggable(el) {
        let isDragging = false;
        el.onmousedown = (e) => {
            isDragging = true;
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;

            document.onmousemove = (e) => {
                if(!isDragging) return;
                let pitch = document.getElementById('pitch').getBoundingClientRect();
                let x = e.clientX - pitch.left - shiftX;
                let y = e.clientY - pitch.top - shiftY;
                
                el.style.left = (x / pitch.width * 100) + '%';
                el.style.top = (y / pitch.height * 100) + '%';
            };

            document.onmouseup = () => {
                isDragging = false;
                document.onmousemove = null;
            };
        };
    }

    // --- CHAT LOGIK ---
    function sendToToni() {
        const input = document.getElementById('user-in');
        if(!input.value) return;
        
        addChatMessage(input.value, 'coach');
        const val = input.value.toLowerCase();
        input.value = '';

        setTimeout(() => {
            if(val.includes('kabine')) {
                addChatMessage("Toni: Öffne die Kabine für dich, Coach.", 'toni');
                showSector('kabine');
            } else {
                addChatMessage("Toni: Verstanden. Ich analysiere die Positionen...", 'toni');
            }
        }, 800);
    }

    function addChatMessage(text, sender) {
        const win = document.getElementById('chat-window');
        const d = document.createElement('div');
        d.className = `msg ${sender}`;
        d.innerText = text;
        win.appendChild(d);
        win.scrollTop = win.scrollHeight;
    }
</script>

</body>
</html>
