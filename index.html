<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | High-Tech Lab & Live-Intelligence</title>
<style>
  :root {
    --bg: #010401; --neon: #39FF14; --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05); --red: #ff3333; --cyan: #00f2ff;
  }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

  /* --- APP STRUCTURE --- */
  .app-container { display: grid; grid-template-columns: 80px 1fr 380px; height: 100vh; padding: 12px; gap: 12px; }
  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; overflow-y: auto; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
  }

  .left-nav { background: var(--glass); border-radius: 15px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; backdrop-filter: blur(10px); }
  .nav-item { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; transition: 0.3s; }

  /* --- ARENA --- */
  .center-arena { background: #000; border-radius: 15px; border: 1px solid rgba(57,255,20,0.1); display: flex; flex-direction: column; padding: 10px; position: relative; }
  canvas { background: #010a01; border-radius: 8px; box-shadow: 0 0 40px #000; max-width: 100%; height: auto; }

  /* --- TONI BOX --- */
  .right-toni { background: var(--glass); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px 14px; border-radius: 12px; font-size: 13px; max-width: 85%; }
  .msg.ai { background: rgba(57, 255, 20, 0.1); border-left: 3px solid var(--neon); align-self: flex-start; }

  /* --- OVERLAYS --- */
  .overlay { position: fixed; inset: 20px 400px 20px 100px; background: rgba(0,0,0,0.99); border: 1px solid var(--neon); border-radius: 20px; z-index: 1000; display: none; flex-direction: column; padding: 25px; backdrop-filter: blur(25px); overflow: hidden; }
  .scroll-box { flex: 1; overflow-y: auto; padding-top: 10px; }
  
  /* LABORATORY UI */
  .lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
  .lab-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(57,255,20,0.1); border-radius: 15px; padding: 20px; position: relative; overflow: hidden; }
  .lab-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--neon); box-shadow:0 0 15px var(--neon); }
  .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin: 6px 0; }
  .stat-val { color: var(--neon); font-weight: bold; }
  .gauge-bg { width: 100%; height: 6px; background: #111; border-radius: 3px; margin: 8px 0; overflow: hidden; }
  .gauge-fill { height: 100%; transition: 0.8s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

  /* EDITOR TABS */
  .editor-pane { display: none; background: #000; border: 1px solid var(--neon); padding: 25px; border-radius: 20px; position: absolute; inset: 15px; z-index: 1100; overflow-y: auto; }
  .tab-header { display: flex; gap: 10px; margin-bottom: 15px; }
  .tab-btn { flex: 1; background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; }
  .tab-btn.active { background: var(--neon); color: #000; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .input-group label { display: block; font-size: 9px; color: var(--neon); text-transform: uppercase; margin-bottom: 4px; }
  .input-group input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; }

  /* GATES */
  .screen-gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
</style>
</head>
<body>

<div id="gate" class="screen-gate">
  <h1 style="color:var(--neon); letter-spacing: 10px; text-shadow: 0 0 20px var(--neon);">TONI 2.0</h1>
  <button onclick="unlock()" style="background:var(--neon); padding:15px 60px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:18px;">SYSTEM INITIALISIEREN</button>
  <p style="font-size: 10px; color: #444;">Live-Voice Engine Ready (Passwort: 1234)</p>
</div>

<div class="app-container" id="mainApp" style="display:none">
  <div class="left-nav">
    <div class="nav-item" onclick="openSektor('kabine')">💼</div>
    <div class="nav-item" onclick="openSektor('analyse')">🧪</div>
    <div class="nav-item" onclick="toniSpeak('Mentalitätsmonster-Modus aktiviert! Wir gehen voll drauf!')">🎙️</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="resetMemory()">🔁</div>
  </div>

  <div class="center-arena">
    <div style="display:flex; justify-content:space-between; padding:5px 15px; color:var(--neon); font-size:12px;">
        <strong id="displayClub">ARENA</strong>
        <span id="displayAge">[ LADE... ]</span>
    </div>
    <div id="board-wrap" style="flex:1; display:flex; align-items:center; justify-content:center;">
      <canvas id="mainBoard" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="font-weight:bold; color:var(--neon); display:flex; justify-content:space-between;">TONI AI <span id="status">LIVE</span></div>
    <div class="chat-history" id="chat"></div>
    <div style="display:flex; gap:10px;">
      <input type="text" id="cmd" placeholder="Befehl..." style="flex:1; background:#111; border:1px solid #333; color:#fff; padding:12px; border-radius:10px;">
      <button onclick="sendBefehl()" style="background:var(--neon); border:none; border-radius:10px; padding:0 15px; cursor:pointer;">➔</button>
    </div>
  </div>
</div>

<div id="ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <h2 id="ov-title" style="margin:0; color:var(--neon); letter-spacing:2px;">LAB</h2>
    <div style="display:flex; gap:10px;">
      <button id="addBtn" onclick="addNewPlayer()" style="background:var(--neon); color:#000; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; display:none;">+ ADD PLAYER</button>
      <span onclick="closeOverlay()" style="cursor:pointer; font-size:30px;">✕</span>
    </div>
  </div>
  <div class="scroll-box" id="ov-content"></div>

  <div id="editor" class="editor-pane">
    <div class="tab-header">
      <button class="tab-btn active" id="btn-squad" onclick="switchTab('squad')">IDENTITY</button>
      <button class="tab-btn" id="btn-lab" onclick="switchTab('lab')">BODY (BIA)</button>
      <button class="tab-btn" id="btn-tracker" onclick="switchTab('tracker')">WATCH (LIVE)</button>
    </div>
    <div class="input-grid" id="edit-fields"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button onclick="saveData()" style="flex:1; background:var(--neon); color:#000; border:none; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;">UPDATE & ANALYZE</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('mainBoard');
  const ctx = canvas.getContext('2d');
  
  let userData = JSON.parse(localStorage.getItem('toni_user_v39')) || null;
  let team = JSON.parse(localStorage.getItem('toni_team_v39')) || [
    {id:Date.now(), name:'Müller', rating:91, x:200, y:350, img:'', bpm:62, hrv:55, weight:82, fat:10.2, muscle:38, water:62, spo2:98, sleep:82, vo2:52}
  ];

  let curId = null; let curTab = 'squad';

  function unlock() {
    document.getElementById('gate').style.display = 'none';
    if(!userData) startOnboarding(); else initApp();
  }

  function startOnboarding() {
    const coach = prompt("Wie heißt du, Coach?");
    const club = prompt("Dein Verein?");
    const age = prompt("Altersklasse (z.B. G-Jugend oder 1. Mannschaft)?");
    userData = { coach, club, age };
    localStorage.setItem('toni_user_v39', JSON.stringify(userData));
    initApp();
  }

  function initApp() {
    document.getElementById('mainApp').style.display = 'grid';
    document.getElementById('displayClub').innerText = userData.club.toUpperCase();
    document.getElementById('displayAge').innerText = `[ ${userData.age.toUpperCase()} ]`;
    renderArena();
    toniSpeak(`Servus ${userData.coach}! Alle Diagnostik-Systeme für den ${userData.club} sind hochgefahren. Lass uns die Daten jagen!`);
  }

  // --- LIVE PITCH ---
  function drawPitch() {
    ctx.fillStyle = '#021a02'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.4)'; ctx.lineWidth = 3;
    const isG = userData.age.toLowerCase().includes('g-');
    if(isG) {
      ctx.strokeRect(100, 100, canvas.width-200, canvas.height-200);
      ctx.strokeRect(100, 200, 15, 60); ctx.strokeRect(canvas.width-115, 200, 15, 60);
    } else {
      ctx.strokeRect(40, 40, canvas.width-80, canvas.height-80);
      ctx.beginPath(); ctx.moveTo(canvas.width/2, 40); ctx.lineTo(canvas.width/2, canvas.height-40); ctx.stroke();
      ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 80, 0, Math.PI*2); ctx.stroke();
      ctx.strokeRect(40, canvas.height/2-150, 120, 300); ctx.strokeRect(canvas.width-160, canvas.height/2-150, 120, 300);
    }
  }

  function renderArena() { drawPitch(); team.forEach(p => { ctx.fillStyle = '#ff4444'; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill(); }); }

  // --- TONI LIVE VOICE ---
  function toniSpeak(t) {
    const chat = document.getElementById('chat'); chat.innerHTML += `<div class="msg ai">Toni: ${t}</div>`; chat.scrollTop = chat.scrollHeight;
    const ut = new SpeechSynthesisUtterance(t);
    ut.lang = 'de-DE'; ut.pitch = 0.85; ut.rate = 1.0;
    const voices = window.speechSynthesis.getVoices();
    // Suche gezielt nach männlichen Stimmen (Google Deutsch, Microsoft Stefan, etc.)
    const male = voices.find(v => v.name.includes('Google') && v.name.includes('Deutsch')) || 
                 voices.find(v => v.name.includes('Stefan')) || voices[0];
    ut.voice = male;
    window.speechSynthesis.speak(ut);
  }

  // --- HIGH-TECH LABORATORY ---
  function openSektor(s) {
    document.getElementById('ov').style.display = 'flex'; const c = document.getElementById('ov-content'); const t = document.getElementById('ov-title');
    c.innerHTML = ''; document.getElementById('addBtn').style.display = (s==='kabine'?'block':'none');
    
    if(s === 'kabine') {
      t.innerText = 'SQUAD REPOSITORY'; c.className = 'scroll-box fifa-grid';
      team.forEach(p => {
        c.innerHTML += `<div class="fifa-card" onclick="openEdit(${p.id})"><div class="card-rating">${p.rating}</div><div class="card-photo">${p.img?`<img src="${p.img}">`:'👤'}</div><div class="card-name">${p.name}</div></div>`;
      });
    } else if(s === 'analyse') {
      t.innerText = 'DIAGNOSTIC CENTER'; c.className = 'scroll-box lab-grid';
      team.forEach(p => {
        let readiness = Math.round((p.sleep + p.hrv + (100 - (p.bpm-40))) / 3);
        let color = readiness > 75 ? 'var(--neon)' : (readiness > 55 ? 'yellow' : 'var(--red)');
        c.innerHTML += `
          <div class="lab-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <strong>${p.name.toUpperCase()}</strong>
                <span style="color:${color}; font-weight:bold;">READINESS: ${readiness}%</span>
            </div>
            <div class="gauge-bg"><div class="gauge-fill" style="width:${readiness}%; background:${color}; box-shadow:0 0 10px ${color}"></div></div>
            <div class="stat-row"><span>HEART RATE</span><span class="stat-val">${p.bpm} BPM</span></div>
            <div class="stat-row"><span>HRV (RECOVERY)</span><span class="stat-val">${p.hrv} ms</span></div>
            <div class="stat-row"><span>BODY FAT</span><span class="stat-val">${p.fat}%</span></div>
            <div class="stat-row"><span>OXYGEN (SpO2)</span><span class="stat-val">${p.spo2}%</span></div>
            <div style="background:rgba(255,255,255,0.05); padding:8px; border-radius:8px; margin-top:10px; font-size:10px;">
                <strong style="color:var(--neon)">TONI AI:</strong> ${readiness > 70 ? 'Optimaler Zustand.' : 'Regeneration empfohlen!'}
            </div>
          </div>`;
      });
    }
  }

  // --- MODULAR EDITOR ---
  function openEdit(id) { curId = id; document.getElementById('editor').style.display='block'; switchTab('squad'); }
  function switchTab(t) {
    curTab = t; const f = document.getElementById('edit-fields'); const p = team.find(x => x.id === curId);
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+t).classList.add('active');
    f.innerHTML = '';
    if(t === 'squad') {
      f.innerHTML = `<div class="input-group" style="grid-column:span 2"><label>Photo</label><input type="file" onchange="procImg(this)"></div><div class="input-group"><label>Name</label><input type="text" id="e-name" value="${p.name}"></div><div class="input-group"><label>Rating</label><input type="number" id="e-rating" value="${p.rating}"></div>`;
    } else if(t === 'lab') {
      f.innerHTML = `<div class="input-group"><label>Gewicht</label><input type="number" step="0.1" id="e-weight" value="${p.weight}"></div><div class="input-group"><label>Fett %</label><input type="number" step="0.1" id="e-fat" value="${p.fat}"></div><div class="input-group"><label>Muskel kg</label><input type="number" step="0.1" id="e-muscle" value="${p.muscle}"></div>`;
    } else if(t === 'tracker') {
      f.innerHTML = `<div class="input-group"><label>Puls</label><input type="number" id="e-bpm" value="${p.bpm}"></div><div class="input-group"><label>HRV ms</label><input type="number" id="e-hrv" value="${p.hrv}"></div><div class="input-group"><label>SpO2 %</label><input type="number" id="e-spo2" value="${p.spo2}"></div>`;
    }
  }

  function procImg(i) { if(i.files && i.files[0]) { const r = new FileReader(); r.onload = (e) => { team.find(x => x.id === curId).img = e.target.result; }; r.readAsDataURL(i.files[0]); } }
  
  function saveData() {
    const p = team.find(x => x.id === curId);
    if(document.getElementById('e-name')) p.name = document.getElementById('e-name').value;
    if(document.getElementById('e-bpm')) p.bpm = parseInt(document.getElementById('e-bpm').value);
    if(document.getElementById('e-fat')) p.fat = parseFloat(document.getElementById('e-fat').value);
    
    // LIVE REACTION
    if(p.bpm > 140) toniSpeak(`Warnung! Der Puls von ${p.name} ist im Stand viel zu hoch. Wir müssen das Belastungsprofil prüfen!`);
    else if(p.fat > 15) toniSpeak(`Björn, der Körperfettanteil von ${p.name} ist gestiegen. Toni empfiehlt eine Anpassung des Ernährungsplans.`);
    else toniSpeak(`Daten für ${p.name} synchronisiert. Ich berechne den neuen Readiness-Score.`);

    localStorage.setItem('toni_team_v39', JSON.stringify(team));
    document.getElementById('editor').style.display='none'; openSektor('analyse'); renderArena();
  }

  function resetMemory() { if(confirm("System-Reset?")) { localStorage.clear(); location.reload(); } }
  function closeOverlay() { document.getElementById('ov').style.display='none'; document.getElementById('editor').style.display='none'; }
  function sendBefehl() { const i = document.getElementById('cmd'); if(i.value) { toniSpeak("Analysiere: " + i.value); i.value=''; } }
</script>
</body>
</html>
