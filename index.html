<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — High-Class Edition</title>
    <link rel="stylesheet" href="css/toni-style.css">
</head>
<body>

    <aside class="sidebar-minimal">
        <div class="main-briefcase-btn" onclick="toggleBriefcase()">
            <div style="font-size:32px;">💼</div>
            <span style="font-size:10px; font-weight:bold;">ZENTRALE</span>
        </div>
    </aside>

    <main id="stage">
        <div class="tools-overlay">
            <button onclick="arena.setMode('standard')" style="padding:5px 10px; cursor:pointer;">STANDARD</button>
            <button onclick="arena.setMode('funinho')" style="padding:5px 10px; cursor:pointer;">FUNINHO</button>
        </div>
        <canvas id="main-canvas"></canvas>
    </main>

    <aside class="analysis-panel">
        <h2 style="color: var(--data-cyan); font-size: 16px;">ANALYSEZENTRUM</h2>
        <div id="setcard-content" style="margin-top: 30px;">
            <p style="color: #667085; font-style: italic;">Spieler auf dem Feld anklicken...</p>
        </div>
    </aside>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <button onclick="toggleBriefcase()" style="position:absolute; top:40px; right:40px; background:none; border:none; color:white; font-size:30px; cursor:pointer;">✕</button>
        <h1 style="color: var(--accent-orange); letter-spacing: 5px;">ZENTRALE AKTENTASCHE</h1>
        
        <div id="folder-main" class="folder-grid">
            <div class="folder-item" onclick="openSub('sport')">👟 <h3>Sporttasche</h3></div>
            <div class="folder-item" onclick="openSub('analyse')">📊 <h3>Analyse</h3></div>
            <div class="folder-item" onclick="openSub('orga')">🏢 <h3>Geschäft</h3></div>
        </div>

        <div id="sub-view" class="hidden" style="width:100%; max-width:700px; margin-top:40px;">
            <button onclick="closeSub()" style="color:var(--data-cyan); background:none; border:none; cursor:pointer; margin-bottom:20px;">← ZURÜCK</button>
            <div id="sub-content"></div>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/aktentasche-ui.js"></script>
    <script>
        function toggleBriefcase() { document.getElementById('briefcase-overlay').classList.toggle('hidden'); }
        
        function openSub(type) {
            document.getElementById('folder-main').classList.add('hidden');
            document.getElementById('sub-view').classList.remove('hidden');
            if(type === 'sport') window.Aktentasche.renderSporttasche();
            if(type === 'orga') window.Aktentasche.renderOrga();
        }

        function closeSub() {
            document.getElementById('folder-main').classList.remove('hidden');
            document.getElementById('sub-view').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => { 
            arena.init('main-canvas');
            // Automatischer Demo-Kader für Björn
            arena.players = [
                { id: 1, name: "David Luiz", number: 4, rating: 8, pos: "IV", x: 250, y: 350, team: 'home' },
                { id: 2, name: "Max Miller", number: 10, rating: 6, pos: "OM", x: 450, y: 300, team: 'home' }
            ];
        });
    </script>
</body>
</html>
