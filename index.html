<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 | ACCESS PORTAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">

    <div id="portal-background"></div>

    <main id="auth-layer" class="portal-panel">
        <header class="portal-header">
            <div class="status-led green"></div>
            <div class="header-text">
                <h1>TONI 2.0</h1>
                <small>NEURAL MANAGEMENT ENGINE</small>
            </div>
        </header>

        <section class="login-core">
            <p class="ai-greeting">IDENTITÄT BESTÄTIGEN, TRAINER.</p>
            <div class="input-wrapper">
                <input type="password" id="passkey" placeholder="PASSKEY EINGEBEN" autocomplete="off">
                <div class="input-glow"></div>
            </div>
            <button id="login-btn" onclick="systemBootSequence()">SYSTEM STARTEN</button>
        </section>

        <footer class="portal-footer">
            <div class="version-tag">V15.8 PRO</div>
            <div class="system-downloads">
                <span class="badge">APK</span>
                <span class="badge">MOBILE</span>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
