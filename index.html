<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Titan Build v4.1</title>
<style>
  :root {
    --bg: #010401; --neon: #39FF14; --neon-dim: rgba(57, 255, 20, 0.15);
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05); --red: #ff3333; --cyan: #00f2ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

  /* --- APP WRAPPER --- */
  .app-container { display: grid; grid-template-columns: 80px 1fr 380px; height: 100vh; padding: 12px; gap: 12px; }
  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; overflow-y: auto; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
  }

  /* --- NAVIGATION --- */
  .left-nav { background: var(--glass); border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 20px; backdrop-filter: blur(15px); }
  .nav-item { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; transition: 0.3s; }
  .nav-item:hover { background: var(--neon-dim); box-shadow: 0 0 20px var(--neon); transform: scale(1.05); }

  /* --- ARENA --- */
  .center-arena { background: #000; border-radius: 20px; border: 1px solid var(--neon-dim); display: flex; flex-direction: column; padding: 15px; position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
  .arena-header { display: flex; justify-content: space-between; color: var(--neon); font-size: 13px; border-bottom: 1px solid var(--glass); padding-bottom: 8px; margin-bottom: 10px; }
  #board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { background: #010a01; border-radius: 10px; box-shadow: 0 0 40px #000; max-width: 100%; height: auto; }

  /* --- TONI LIVE CONSOLE --- */
  .right-toni { background: var(--glass); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; max-width: 90%; }
  .msg.ai { background: var(--neon-dim); align-self: flex-start; border-left: 4px solid var(--neon); }
  .cmd-input { display: flex; gap: 10px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 12px; border: 1px solid #333; }
  .cmd-input input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; outline: none; }

  /* --- THE HUB (OVERLAY) --- */
  .overlay { position: fixed; inset: 20px 410px 20px 105px; background: rgba(2, 8, 2, 0.99); border: 1px solid var(--neon); border-radius: 25px; z-index: 1000; display: none; flex-direction: column; padding: 30px; backdrop-filter: blur(30px); }
  .scroll-content { flex: 1; overflow-y: auto; }
  .close-btn { cursor: pointer; font-size: 40px; color: var(--neon); line-height: 0.5; }

  /* BRIEFCASE MENU (AKTTENTASCHE) */
  .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; text-align: center; margin-top: 30px; }
  .folder-item { cursor: pointer; padding: 20px; border-radius: 15px; background: var(--glass); border: 1px solid #333; transition: 0.3s; }
  .folder-item:hover { border-color: var(--neon); background: var(--neon-dim); }
  .folder-icon { font-size: 50px; margin-bottom: 10px; display: block; }

  /* FIFA CARDS */
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
  .fifa-card { width: 170px; height: 240px; background: var(--gold); border-radius: 10px; color: #000; position: relative; padding: 12px; cursor: pointer; font-family: 'Arial Black', sans-serif; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: 0.3s; }
  .fifa-card:hover { transform: translateY(-8px); }
  .card-rating { font-size: 40px; position: absolute; top: 10px; left: 12px; }
  .card-photo { width: 105px; height: 105px; background: rgba(0,0,0,0.1); margin: 8px auto 0 auto; border-bottom: 2px solid #000; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .card-name { text-align: center; font-size: 16px; text-transform: uppercase; margin: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
  .card-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; font-size: 11px; padding: 5px 10px; }

  /* BIO-DATA HUB (HIGH-TECH LAB) */
  .lab-card { background: rgba(255,255,255,0.02); border: 1px solid var(--neon-dim); border-radius: 20px; padding: 25px; margin-bottom: 20px; position: relative; }
  .lab-card::before { content: ''; position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: var(--neon); box-shadow: 0 0 15px var(--neon); }
  .readiness-display { font-size: 30px; font-weight: bold; color: var(--neon); }
  .lab-section-title { font-size: 10px; color: #888; text-transform: uppercase; margin: 15px 0 8px 0; border-bottom: 1px solid #333; }
  .lab-stat-row { display: flex; justify-content: space-between; font-size: 13px; margin: 6px 0; }
  .stat-highlight { color: var(--neon); font-weight: bold; }
  .progress-bar { width: 100%; height: 8px; background: #111; border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .progress-fill { height: 100%; transition: 1s ease-out; }

  /* MAGAZINE / ZEITUNG */
  .magazine-page { background: #fff; color: #333; padding: 50px; border-radius: 5px; min-height: 800px; box-shadow: 0 0 50px #000; }
  .mag-header { border-bottom: 4px solid #000; padding-bottom: 20px; text-align: center; }
  .mag-content { margin-top: 30px; font-family: 'Times New Roman', serif; line-height: 1.6; }
  .mag-editable { border: 1px dashed transparent; padding: 10px; transition: 0.2s; outline: none; }
  .mag-editable:hover { border-color: #000; background: #f9f9f9; }

  /* MODULAR EDITOR */
  .editor-pane { display: none; background: #000; border: 2px solid var(--neon); padding: 30px; border-radius: 25px; position: absolute; inset: 15px; z-index: 1100; overflow-y: auto; }
  .tab-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .tab-item { flex: 1; padding: 12px; border: 1px solid var(--neon); color: var(--neon); border-radius: 10px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; }
  .tab-item.active { background: var(--neon); color: #000; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  .field-box { display: flex; flex-direction: column; gap: 5px; }
  .field-box label { font-size: 9px; color: var(--neon); text-transform: uppercase; }
  .field-box input { background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; }

  /* GATES */
  .gate-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
  .gate-input { background: #000; border: 2px solid var(--neon); color: var(--neon); padding: 20px; border-radius: 12px; text-align: center; font-size: 28px; width: 320px; letter-spacing: 5px; }
</style>
</head>
<body>

<div id="login-gate" class="gate-screen">
  <h1 style="color:var(--neon); letter-spacing: 12px; text-shadow: 0 0 20px var(--neon);">TONI 2.0</h1>
  <input type="password" id="gate-pw" class="gate-input" placeholder="••••">
  <button onclick="checkAccess()" style="background:var(--neon); color:#000; padding:15px 60px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:18px;">INITIATE</button>
  <p style="font-size: 10px; color: #444; margin-top: 40px;">Admin-Code: 1234</p>
</div>

<div id="onboarding" class="gate-screen" style="display:none">
  <div style="text-align:center; max-width:400px;">
    <h2 id="ob-title" style="color:var(--neon); margin-bottom:20px;">SYSTEM PERSONALISIERUNG</h2>
    <p id="ob-desc" style="margin-bottom:20px;">Hallo Coach! Ich bin Toni. Wie heißt du?</p>
    <input type="text" id="ob-input" class="gate-input" style="letter-spacing:normal; font-size:18px;">
    <br><br>
    <button onclick="handleObStep()" style="background:var(--neon); color:#000; padding:15px 80px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; width:100%;">BESTÄTIGEN</button>
  </div>
</div>

<div class="app-container" id="main-app" style="display:none">
  <div class="left-nav">
    <div class="nav-item" onclick="openBriefcase()" title="Aktentasche (Management)">💼</div>
    <div class="nav-item" onclick="openSektor('analyse')" title="Bio-Data Hub (Labor)">🧪</div>
    <div class="nav-item" onclick="toniSpeak('Mentalitätsmonster aktiviert! Wir jagen den Ball!')" title="Toni Voice Control">🎙️</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="openSektor('settings')" title="AI Setup">⚙️</div>
    <div class="nav-item" onclick="systemReset()" style="color:var(--red); border-color:var(--red);">🔁</div>
  </div>

  <div class="center-arena">
    <div class="arena-header">
      <strong id="header-club">VFL MUSTERSTADT</strong>
      <span id="header-age">[ PRO PERFORMANCE ]</span>
    </div>
    <div id="board-wrap">
      <canvas id="main-canvas" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong style="color:var(--neon); letter-spacing:1px;">TONI AI LIVE</strong>
      <span id="ai-status" style="font-size:10px; color:var(--neon);">● CONNECTED</span>
    </div>
    <div class="chat-history" id="chat-box"></div>
    <div class="cmd-input">
      <input type="text" id="user-cmd" placeholder="Anweisung..." onkeypress="if(event.key==='Enter') sendCmd()">
      <button onclick="sendCmd()" style="background:none; border:none; color:var(--neon); cursor:pointer;">➔</button>
    </div>
  </div>
</div>

<div id="hub-ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; border-bottom:1px solid var(--neon-dim); padding-bottom:15px;">
    <h2 id="hub-title" style="margin:0; color:var(--neon); letter-spacing:3px;">SYSTEM HUB</h2>
    <div style="display:flex; gap:15px; align-items:center;">
      <button id="add-p-btn" onclick="addNewPlayer()" style="background:var(--neon); color:#000; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; display:none; cursor:pointer;">+ SPIELER HINZUFÜGEN</button>
      <span class="close-btn" onclick="closeHub()">✕</span>
    </div>
  </div>
  
  <div class="scroll-content" id="hub-content"></div>

  <div id="p-editor" class="editor-pane">
    <div class="tab-row">
      <div class="tab-item active" id="tab-btn-squad" onclick="setEditorTab('squad')">SQUAD & FIFA</div>
      <div class="tab-item" id="tab-btn-lab" onclick="setEditorTab('lab')">BODY (WAAGE)</div>
      <div class="tab-item" id="tab-btn-watch" onclick="setEditorTab('watch')">TRACKER (UHR)</div>
    </div>
    <div id="editor-fields" class="input-grid"></div>
    <div style="display:flex; gap:15px; margin-top:30px;">
      <button onclick="savePlayerData()" style="flex:2; background:var(--neon); color:#000; font-weight:bold; padding:18px; border:none; border-radius:12px; cursor:pointer;">DATEN SYNCHRONISIEREN</button>
      <button onclick="deletePlayer()" style="flex:1; background:var(--red); color:#fff; font-weight:bold; padding:18px; border:none; border-radius:12px; cursor:pointer;">ENTLASSEN</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d');
  
  // DATEN-PERSISTENZ
  let user = JSON.parse(localStorage.getItem('toni_titan_user')) || null;
  let squad = JSON.parse(localStorage.getItem('toni_titan_squad')) || [
    {id:Date.now(), name:'Müller', rating:91, pos:'ST', x:180, y:350, img:'', pac:88, sho:92, pas:80, dri:86, def:44, phy:84, weight:82.4, fat:10.2, muscle:38.5, water:62.1, bone:3.8, visceral:4, bpm:62, hrv:55, vo2:52, sleep:82, stress:22, recovery:12, spo2:98}
  ];

  let obStep = 0; let curPId = null; let curTab = 'squad';

  // 1. ACCESS CONTROL
  function checkAccess() {
    if(document.getElementById('gate-pw').value === '1234') {
      document.getElementById('login-gate').style.display='none';
      if(!user) document.getElementById('onboarding').style.display='flex'; else initSystem();
    } else alert("ZUGRIFF VERWEIGERT.");
  }

  // 2. ONBOARDING
  function handleObStep() {
    const i = document.getElementById('ob-input'); const val = i.value; if(!val) return;
    if(obStep === 0) { user = { coach: val }; document.getElementById('ob-desc').innerText=`Servus ${val}! Welcher Verein ist deiner?`; }
    else if(obStep === 1) { user.club = val; document.getElementById('ob-desc').innerText=`In welcher Altersklasse coacht du? (z.B. G-Jugend, Erste Mannschaft)`; }
    else { user.age = val; localStorage.setItem('toni_titan_user', JSON.stringify(user)); initSystem(); return; }
    i.value = ""; obStep++;
  }

  function initSystem() {
    document.getElementById('onboarding').style.display='none';
    document.getElementById('main-app').style.display='grid';
    document.getElementById('header-club').innerText = user.club.toUpperCase();
    document.getElementById('header-age').innerText = `[ ${user.age.toUpperCase()} ]`;
    renderArena();
    toniSpeak(`Servus ${user.coach}! Titan Build v4.1 aktiv. Die Aktentasche ist bereit für dein Management.`);
  }

  // 3. PIXEL-PERFECT PITCH ENGINE
  function drawPitch() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#021a02'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.5)'; ctx.lineWidth = 3;
    const isJunior = user.age.toLowerCase().includes('g-') || user.age.toLowerCase().includes('junior');

    if(isJunior) { // FUNINO / G-JUGEND
      ctx.strokeRect(100, 100, canvas.width-200, canvas.height-200);
      ctx.strokeRect(100, 180, 15, 80); ctx.strokeRect(100, 440, 15, 80);
      ctx.strokeRect(canvas.width-115, 180, 15, 80); ctx.strokeRect(canvas.width-115, 440, 15, 80);
      ctx.beginPath(); ctx.moveTo(canvas.width/2, 100); ctx.lineTo(canvas.width/2, canvas.height-100); ctx.stroke();
    } else { // PRO-PITCH
      ctx.strokeRect(40, 40, canvas.width-80, canvas.height-80);
      ctx.beginPath(); ctx.moveTo(canvas.width/2, 40); ctx.lineTo(canvas.width/2, canvas.height-40); ctx.stroke();
      ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 80, 0, Math.PI*2); ctx.stroke();
      ctx.strokeRect(40, canvas.height/2-150, 120, 300); ctx.strokeRect(canvas.width-160, canvas.height/2-150, 120, 300); // 16er
      ctx.strokeRect(40, canvas.height/2-70, 50, 140); ctx.strokeRect(canvas.width-90, canvas.height/2-70, 50, 140); // 5er
      ctx.fillStyle = 'rgba(57, 255, 20, 0.6)';
      ctx.beginPath(); ctx.arc(130, canvas.height/2, 4, 0, Math.PI*2); ctx.fill(); // Elfmeterpunkt Links
      ctx.beginPath(); ctx.arc(canvas.width-130, canvas.height/2, 4, 0, Math.PI*2); ctx.fill(); // Rechts
    }
  }

  function renderArena() { drawPitch(); squad.forEach(p => { ctx.fillStyle=p.bpm>140?'red':'#39FF14'; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill(); }); }

  // 4. TONI LIVE VOICE
  function toniSpeak(text) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div class="msg ai">Toni: ${text}</div>`; box.scrollTop = box.scrollHeight;
    const ut = new SpeechSynthesisUtterance(text); ut.lang = 'de-DE'; ut.pitch = 0.8;
    const voices = window.speechSynthesis.getVoices();
    ut.voice = voices.find(v => v.name.includes('Google') && v.name.includes('Deutsch')) || voices[0];
    window.speechSynthesis.speak(ut);
  }

  // 5. BRIEFCASE & SEKTOR ENGINE
  function openBriefcase() {
    document.getElementById('hub-ov').style.display = 'flex';
    document.getElementById('hub-title').innerText = 'AKTTENTASCHE: MANAGEMENT';
    const c = document.getElementById('hub-content'); c.className = 'scroll-content';
    c.innerHTML = `
      <div class="folder-grid">
        <div class="folder-item" onclick="openSektor('kabine')"><span class="folder-icon">👕</span><strong>MANNSCHAFT</strong></div>
        <div class="folder-item" onclick="openSektor('business')"><span class="folder-icon">🤝</span><strong>SPONSORING</strong></div>
        <div class="folder-item" onclick="openSektor('zeitung')"><span class="folder-icon">📰</span><strong>STADIONZEITUNG</strong></div>
      </div>
    `;
  }

  function openSektor(s) {
    const ov = document.getElementById('hub-ov'); const c = document.getElementById('hub-content'); const t = document.getElementById('hub-title');
    ov.style.display = 'flex'; c.innerHTML = ''; document.getElementById('add-p-btn').style.display = (s==='kabine'?'block':'none');
    
    if(s === 'kabine') {
      t.innerText = 'SQUAD REPOSITORY'; c.className = 'scroll-content fifa-grid';
      squad.forEach(p => {
        c.innerHTML += `<div class="fifa-card" onclick="openPlayerEditor(${p.id})"><div class="card-rating">${p.rating}</div><div class="card-photo">${p.img?`<img src="${p.img}">`:'👤'}</div><div class="card-name">${p.name}</div><div class="card-stats-grid"><span>PAC ${p.pac}</span><span>DRI ${p.dri}</span><span>SHO ${p.sho}</span><span>DEF ${p.def}</span></div></div>`;
      });
    } else if(s === 'analyse') {
      t.innerText = 'BIO-DATA HUB (LEISTUNGSLABOR)'; c.className = 'scroll-content lab-grid';
      squad.forEach(p => {
        let readiness = Math.round((p.sleep + (p.hrv/1.5) + (100 - (p.bpm-40))) / 3);
        let color = readiness > 75 ? 'var(--neon)' : (readiness > 55 ? 'yellow' : 'var(--red)');
        c.innerHTML += `
          <div class="lab-card">
            <div style="display:flex; justify-content:space-between; align-items:center;"><strong>${p.name.toUpperCase()}</strong><span class="readiness-display" style="color:${color}">${readiness}%</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${readiness}%; background:${color}; box-shadow:0 0 10px ${color}"></div></div>
            <div class="lab-section-title">BODY COMPOSITION (BIA)</div>
            <div class="lab-stat-row"><span>Gewicht / Fettanteil</span><span class="stat-highlight">${p.weight}kg / ${p.fat}%</span></div>
            <div class="lab-stat-row"><span>Muskel / Knochenmasse</span><span class="stat-highlight">${p.muscle}kg / ${p.bone}kg</span></div>
            <div class="lab-stat-row"><span>Körperwasser / Viszeralfett</span><span class="stat-highlight">${p.water}% / Level ${p.visceral}</span></div>
            <div class="lab-section-title">PERFORMANCE & RECOVERY (WEARABLE)</div>
            <div class="lab-stat-row"><span>HRV / Puls</span><span class="stat-highlight">${p.hrv}ms / ${p.bpm}bpm</span></div>
            <div class="lab-stat-row"><span>VO2 Max / SpO2</span><span class="stat-highlight">${p.vo2} / ${p.spo2}%</span></div>
            <div class="lab-stat-row"><span>Stresslevel / Regeneration</span><span class="stat-highlight">${p.stress}% / ${p.recovery}h</span></div>
            <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; font-size:11px; margin-top:10px; border-left:2px solid var(--neon);">
              <strong style="color:var(--neon)">TONI AI:</strong> ${readiness > 70 ? 'Optimaler Zustand für Startelf.' : 'Vorsicht: Übermüdung erkannt.'}
            </div>
          </div>`;
      });
    } else if(s === 'business') {
      t.innerText = 'MANAGEMENT: SPONSORING';
      c.innerHTML = `
        <div style="background:var(--glass); padding:20px; border-radius:15px; border-left:4px solid var(--neon); margin-bottom:25px;">
          <h3>Toni Sponsoren-Radar</h3><p>Ich analysiere lokale Unternehmen in ${user.club} Umgebung...</p>
        </div>
        <div style="display:grid; gap:15px;">
          <div style="background:#111; padding:20px; border-radius:12px; display:flex; justify-content:space-between; align-items:center;">
            <span>Bauzentrum Süd (Premium Partner)</span>
            <button onclick="toniSpeak('Professionelle E-Mail an Bauzentrum wurde erstellt.')" style="background:var(--neon); color:#000; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer;">MAIL GENERIEREN</button>
          </div>
        </div>`;
    } else if(s === 'zeitung') {
      t.innerText = 'STADIONZEITUNG: MUSTER-HERAUSGABE';
      c.innerHTML = `
        <div class="magazine-page">
          <div class="mag-header"><h1>MATCHDAY MAGAZINE: ${user.club}</h1><p>Ausgabe 02/2026 | Powered by TONI AI</p></div>
          <div class="mag-content">
            <div class="mag-editable" contenteditable="true"><h3>Wort vom Vorstand</h3>Herzlich Willkommen zum heutigen Heimspiel. Wir blicken stolz auf unsere Entwicklung...</div>
            <div class="mag-editable" contenteditable="true"><h3>Analyse vom Coach</h3>"Der Gegner ist stark, aber unsere Bio-Werte im Training waren überragend. Heute zählt nur der Sieg!"</div>
            <div style="background:#eee; height:200px; display:flex; align-items:center; justify-content:center; border:2px dashed #999; margin-top:20px;">[SPIELFELD-GRAFIK HIER EXPORTIEREN]</div>
          </div>
        </div>
        <button onclick="window.print()" style="width:100%; padding:18px; margin-top:20px; background:var(--neon); color:#000; font-weight:bold; border:none; border-radius:12px; cursor:pointer;">DRUCKEN / ALS PDF SPEICHERN</button>`;
    } else if(s === 'settings') {
      t.innerText = 'OLLAMA AI CONFIGURATION';
      c.innerHTML = `
        <div class="input-grid">
          <div class="field-box" style="grid-column: span 2"><label>API URL</label><input type="text" value="http://localhost:11434/api/generate"></div>
          <div class="field-box"><label>Modell</label><input type="text" value="Llama 3"></div>
        </div>
        <p style="font-size:11px; opacity:0.6; margin-top:20px;">Hiermit verbindest du Toni mit deiner lokalen KI für Echtzeit-Recherche.</p>`;
    }
  }

  // 6. CRUD & MODULAR EDITOR
  function openPlayerEditor(id) { curPId = id; document.getElementById('p-editor').style.display='block'; setEditorTab('squad'); }
  function setEditorTab(tab) {
    curTab = tab; const f = document.getElementById('editor-fields'); const p = squad.find(x => x.id === curPId);
    document.querySelectorAll('.tab-item').forEach(e => e.classList.remove('active')); document.getElementById('tab-btn-'+tab).classList.add('active');
    f.innerHTML = '';
    if(tab === 'squad') {
      f.innerHTML = `<div class="field-box" style="grid-column:span 3"><label>Foto</label><input type="file" onchange="procImg(this)"></div><div class="field-box"><label>Name</label><input type="text" id="e-name" value="${p.name}"></div><div class="field-box"><label>Rating</label><input type="number" id="e-rating" value="${p.rating}"></div><div class="field-box"><label>PAC</label><input type="number" id="e-pac" value="${p.pac}"></div>`;
    } else if(tab === 'lab') {
      f.innerHTML = `<div class="field-box"><label>Gewicht (kg)</label><input type="number" step="0.1" id="e-weight" value="${p.weight}"></div><div class="field-box"><label>Fett (%)</label><input type="number" step="0.1" id="e-fat" value="${p.fat}"></div><div class="field-box"><label>Knochen (kg)</label><input type="number" step="0.1" id="e-bone" value="${p.bone}"></div><div class="field-box"><label>Viszeralfett</label><input type="number" id="e-visceral" value="${p.visceral}"></div>`;
    } else if(tab === 'watch') {
      f.innerHTML = `<div class="field-box"><label>Puls (BPM)</label><input type="number" id="e-bpm" value="${p.bpm}"></div><div class="field-box"><label>HRV (ms)</label><input type="number" id="e-hrv" value="${p.hrv}"></div><div class="field-box"><label>VO2 Max</label><input type="number" id="e-vo2" value="${p.vo2}"></div><div class="field-box"><label>SpO2 (%)</label><input type="number" id="e-spo2" value="${p.spo2}"></div>`;
    }
  }

  function procImg(i) { if(i.files && i.files[0]) { const r = new FileReader(); r.onload = (e) => { squad.find(x => x.id === curPId).img = e.target.result; }; r.readAsDataURL(i.files[0]); } }
  function savePlayerData() {
    const p = squad.find(x => x.id === curPId);
    if(document.getElementById('e-name')) p.name = document.getElementById('e-name').value;
    if(document.getElementById('e-bpm') && parseInt(document.getElementById('e-bpm').value) > 140) toniSpeak(`Björn, der Puls von ${p.name} ist kritisch!`);
    localStorage.setItem('toni_titan_squad', JSON.stringify(squad)); document.getElementById('p-editor').style.display='none'; openSektor('kabine'); renderArena();
  }

  function addNewPlayer() { squad.push({id:Date.now(), name:'Neu', rating:50, x:500, y:350, pac:50, fat:15, weight:75, hrv:50, bpm:60, spo2:98, visceral:4, bone:3.5, muscle:35, water:60, vo2:45, sleep:80}); openSektor('kabine'); }
  function deletePlayer() { if(confirm("Löschen?")) { squad = squad.filter(x => x.id !== curPId); localStorage.setItem('toni_titan_squad', JSON.stringify(squad)); document.getElementById('p-editor').style.display='none'; openSektor('kabine'); renderArena(); } }
  function closeHub() { document.getElementById('hub-ov').style.display='none'; document.getElementById('p-editor').style.display='none'; }
  function systemReset() { if(confirm("RESET?")) { localStorage.clear(); location.reload(); } }
  function sendCmd() { const i = document.getElementById('user-cmd'); if(i.value) { toniSpeak("Analysiere: " + i.value); i.value=''; } }
  if(user) initSystem();
</script>
</body>
</html>
