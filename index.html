<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — Pro Coaching OS</title>
    <link rel="stylesheet" href="css/toni-style.css">
    <link rel="stylesheet" href="css/voice.css">
</head>
<body class="pro-layout">

    <div id="login-screen">
        <div class="login-box">
            <h1>TONI 2.0</h1>
            <input id="password-input" type="password" class="login-input" placeholder="Passwort (Toni2026)">
            <input id="api-key-input" type="password" class="login-input" placeholder="API-Key">
            <button class="login-btn" onclick="ToniAuth.login()">SYSTEM STARTEN</button>
        </div>
    </div>

    <aside class="sidebar-minimal">
        <div class="sidebar-content">
            <div class="control-unit" onclick="BriefcaseUI.toggle()">
                <div style="font-size:32px;">💼</div>
                <span>ZENTRALE</span>
            </div>
            <div id="voice-trigger-btn" class="control-unit" onclick="ToniAI.toggleListening()">
                <div style="font-size:32px;">🎤</div>
                <span id="mic-status-label">BEREIT</span>
            </div>
        </div>
    </aside>

    <main id="stage"><canvas id="main-canvas"></canvas></main>
    <aside class="analysis-panel"><div id="setcard-content"></div></aside>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div class="briefcase-window">
            <h2>ZENTRALE AKTENTASCHE</h2>
            <div class="folder-grid" id="briefcase-nav">
                <div class="nav-card" onclick="BriefcaseUI.switchSektor('sport')">👟 Sporttasche</div>
                <div class="nav-card" onclick="BriefcaseUI.switchSektor('orga')">🏢 Geschäftszimmer</div>
            </div>
            <div id="briefcase-content" class="hidden">
                <div id="active-content"></div>
                <button onclick="BriefcaseUI.backToNav()">← ZURÜCK</button>
            </div>
            <button onclick="BriefcaseUI.toggle()" style="margin-top:20px;">X</button>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script src="engine/toni-ai.js"></script>
    
    <script>
        window.ToniAuth = {
            init() {
                const k = localStorage.getItem('toni_key');
                if(k) document.getElementById('api-key-input').value = k;
            },
            login() {
                if(document.getElementById('password-input').value === "Toni2026") {
                    localStorage.setItem('toni_key', document.getElementById('api-key-input').value);
                    document.getElementById('login-screen').classList.add('hidden');
                    if(window.ToniAI) ToniAI.init();
                    if(window.arena) arena.init('main-canvas');
                } else { alert("Passwort falsch!"); }
            }
        };
        document.addEventListener('DOMContentLoaded', () => ToniAuth.init());
    </script>
</body>
</html>
