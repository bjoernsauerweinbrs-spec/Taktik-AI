<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - Tactical Intelligence</title>
    <link rel="stylesheet" href="css/neon-orange.css">
</head>
<body>
    <div id="app-shell">
        <aside class="sidebar">
            <nav id="main-nav">
                <div class="nav-item active" onclick="switchMode('tactic')">📊 Analyse</div>
                <div class="nav-item" onclick="switchMode('kader')">👤 Kader</div>
                <div class="nav-item" onclick="switchMode('briefcase')">💼 Aktentasche</div>
            </nav>
        </aside>
        
        <main id="stage">
            <canvas id="main-canvas"></canvas>
        </main>

        <div id="voice-overlay" class="hidden">
            <div class="listening-ring"></div>
            <span id="voice-text">Toni hört zu...</span>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="engine/arena.js"></script>
    <script src="engine/players.js"></script>
    <script src="engine/dragdrop.js"></script>
    <script src="ui/taktikboard-ui.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialisierung ohne Konflikte
            arena.init('main-canvas');
            
            // Beispieldaten laden
            arena.players = [
                { id: 1, name: "Schuster", number: 9, x: 200, y: 300, team: 'home' },
                { id: 2, name: "Weber", number: 10, x: 400, y: 350, team: 'away' }
            ];
            
            initDragDrop();
            arena.render();
        });
    </script>
</body>
</html>
