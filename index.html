<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Intelligence Board - Björn Edition</title>
    <style>
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #000; color: #fff; overflow: hidden; }
        
        /* Dashboard */
        #nav { background: #111; padding: 12px; display: flex; justify-content: center; gap: 10px; border-bottom: 3px solid #2e7d32; flex-wrap: wrap; }
        .btn { background: #222; color: #fff; border: 1px solid #444; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 11px; transition: 0.3s; }
        .btn:hover { border-color: #00ff88; color: #00ff88; }

        /* Spielfeld */
        #pitch-area { flex: 2; position: relative; padding: 10px; display: flex; justify-content: center; background: #000; }
        #pitch { 
            width: 100%; height: 100%; background: #2e7d32; border: 3px solid #fff; position: relative;
            background-image: repeating-linear-gradient(0deg, #2e7d32, #2e7d32 10%, #29722d 10%, #29722d 20%);
        }
        .line { position: absolute; background: rgba(255,255,255,0.6); pointer-events: none; }
        .center-circle { width: 100px; height: 100px; border: 2px solid #fff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.4; }
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.1); z-index: 5; }
        .goal-std { width: 90px; height: 30px; left: 50%; transform: translateX(-50%); }
        .goal-fun { width: 50px; height: 20px; }

        /* Spieler & Ball */
        .player { 
            width: 32px; height: 32px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 12px; cursor: grab; z-index: 50;
            border: 2px solid #fff; transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); touch-action: none;
        }
        .red { background: #b71c1c; color: white; }
        .blue { background: #0d47a1; color: white; }
        .ball { width: 20px; height: 20px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; transition: all 0.8s ease-in-out; box-shadow: 0 0 10px white; }

        /* Chat */
        #chat { height: 35%; background: #ffffff; color: #000; display: flex; flex-direction: column; border-top: 5px solid #1a1a1a; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 15px; background: #fdfdfd; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 5px; line-height: 1.5; border-left: 5px solid transparent; }
        .ai { background: #f8f8f8; border-left-color: #2e7d32; font-style: italic; }
        .user { background: #e3f2fd; border-right: 5px solid #1565c0; text-align: right; border-left: none; }

        #input-row { padding: 15px; background: #f0f0f0; display: flex; gap: 15px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        button.action { background: none; border: none; font-size: 28px; cursor: pointer; color: #333; }
    </style>
</head>
<body onclick="initVoice()">

<div id="nav">
    <button class="btn" onclick="setMode('funino')">Funino (3v3)</button>
    <button class="btn" onclick="setMode('11v11')">Match (11v11)</button>
    <button class="btn" style="color: #ff9800;" onclick="runDrill('pass')">DFB: G-Jugend Übung</button>
</div>

<div id="pitch-area">
    <div id="pitch">
        <div class="line" style="width: 100%; height: 2px; top: 50%;"></div>
        <div class="center-circle"></div>
        <div id="ball" class="player ball" style="top: 48%; left: 49%;"></div>
        <div id="team-layer"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="chat-input" placeholder="Taktikbefehl eingeben...">
        <button class="action" onclick="startMic()">🎤</button>
        <button class="action" onclick="execute()">➤</button>
    </div>
</div>

<script>
    const layer = document.getElementById('team-layer');
    const log = document.getElementById('log');
    const input = document.getElementById('chat-input');
    const ball = document.getElementById('ball');

    let coachVoice = null;

    // --- INITIALISIERUNG ---
    function initVoice() {
        if (coachVoice) return;
        const voices = window.speechSynthesis.getVoices();
        // Gezielte Suche nach männlichen Mac-Stimmen (Stefan, Markus, Yannick)
        coachVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Stefan') || v.name.includes('Markus') || v.name.includes('Male'))) || voices.find(v => v.lang.startsWith('de'));
    }
    window.speechSynthesis.onvoiceschanged = initVoice;

    function speak(txt) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(txt);
            if (coachVoice) msg.voice = coachVoice;
            msg.pitch = 0.8; 
            msg.rate = 0.92; 
            window.speechSynthesis.speak(msg);
        }
    }

    function addLog(who, txt, isAi) {
        const d = document.createElement('div');
        d.className = 'msg ' + (isAi ? 'ai' : 'user');
        d.innerHTML = `<b>${who}:</b> ${txt}`;
        log.appendChild(d); log.scrollTop = log.scrollHeight;
        if(isAi) speak(txt);
    }

    // --- TAKTIK-LOGIK ---
    function shiftFormation(ballX) {
        document.querySelectorAll('.red').forEach(p => {
            let baseL = parseFloat(p.getAttribute('data-base-l'));
            let newL = baseL + (ballX - 50) * 0.35;
            p.style.left = newL + "%";
        });
    }

    function createP(t, l, c, n) {
        const p = document.createElement('div');
        p.className = `player ${c}`;
        p.style.top = t + "%"; p.style.left = l + "%";
        p.setAttribute('data-base-l', l);
        p.innerText = n;
        layer.appendChild(p);
    }

    function setMode(mode) {
        layer.innerHTML = "";
        document.querySelectorAll('.goal').forEach(g => g.remove());
        
        if (mode === 'funino') {
            [[0,18],[0,72],[96,18],[96,72]].forEach(p => {
                const g = document.createElement('div'); g.className = 'goal goal-fun';
                g.style.top = p[0] + "%"; g.style.left = p[1] + "%";
                document.getElementById('pitch').appendChild(g);
            });
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
            addLog("Co-Trainer", "Funino-Modus. Wir legen den Fokus auf die Raumwahrnehmung und das schnelle Umschalten über die vier Tore.", true);
        } else {
            const g1 = document.createElement('div'); g1.className = 'goal goal-std'; g1.style.top = "0%"; g1.style.left = "43%";
            const g2 = document.createElement('div'); g2.className = 'goal goal-std'; g2.style.top = "96%"; g2.style.left = "43%";
            document.getElementById('pitch').appendChild(g1); document.getElementById('pitch').appendChild(g2);
