<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Taktik-AI – Toni Co-Trainer</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px;
    }
    #tacticBoard {
      border: 1px solid #555;
      background: #0b5f1a;
    }
    #chat {
      width: 800px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #question {
      width: 100%;
      padding: 8px;
      font-size: 14px;
    }
    #askBtn {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    #answer {
      min-height: 60px;
      padding: 8px;
      background: #222;
      border: 1px solid #444;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Taktik-AI – Toni, der KI-Co-Trainer</h1>

  <canvas id="tacticBoard" width="800" height="500"></canvas>

  <div id="chat">
    <div>
      <input id="question" type="text" placeholder="Frag Toni etwas, z.B.: Wie verschiebt sich die Viererkette, wenn der Gegner links angreift?" />
      <button id="askBtn">Fragen</button>
    </div>
    <div id="answer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
