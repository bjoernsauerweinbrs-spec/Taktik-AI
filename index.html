<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interaktiver Co-Trainer</title>
    <style>
        body { font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; background: #1a1a1a; overflow: hidden; }
        #board { flex: 2; background: #2e7d32; position: relative; border-bottom: 4px solid #fff; touch-action: none; }
        .pitch-line { position: absolute; background: rgba(255,255,255,0.5); }
        
        .player { 
            width: 40px; height: 40px; background: red; border: 2px solid white; border-radius: 50%;
            position: absolute; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; cursor: grab; z-index: 100; touch-action: none;
            transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #chat-area { flex: 1; background: #fff; display: flex; flex-direction: column; z-index: 200; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; color: #333; font-size: 14px; }
        #controls { padding: 10px; display: flex; gap: 10px; border-top: 1px solid #ddd; background: #eee; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 16px; }
        button { font-size: 24px; border: none; background: none; cursor: pointer; padding: 0 10px; }
    </style>
</head>
<body>

<div id="board">
    <div class="pitch-line" style="width: 100%; height: 2px; top: 50%;"></div>
    <div id="p1" class="player" style="top: 20%; left: 40%;">10</div>
    <div id="p2" class="player" style="top: 60%; left: 20%;">7</div>
    <div id="p3" class="player" style="top: 60%; left: 60%;">11</div>
</div>

<div id="chat-area">
    <div id="messages"><div><b>Co-Trainer:</b> Hallo Björn! Versuch mal, die Spieler zu ziehen oder mir etwas zu schreiben.</div></div>
    <div id="controls">
        <input type="text" id="input" placeholder="Nachricht...">
        <button id="mic">🎤</button>
        <button id="send">➤</button>
    </div>
</div>

<script>
    const board = document.getElementById('board');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    // 1. ZIEHEN DER SPIELER (Maus & Touch)
    document.querySelectorAll('.player').forEach(player => {
        let isDragging = false;

        const start = (e) => { isDragging = true; player.style.cursor = 'grabbing'; };
        const end = () => { isDragging = false; player.style.cursor = 'grab'; };
        const move = (e) => {
            if (!isDragging) return;
            const rect = board.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            
            // In Prozent umrechnen für Responsivität
            player.style.left = (x / rect.width * 100) - 5 + "%";
            player.style.top = (y / rect.height * 100) - 5 + "%";
        };

        player.addEventListener('mousedown', start);
        player.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    });

    // 2. CHAT FUNKTION
    function addMsg(who, text) {
        const div = document.createElement('div');
        div.innerHTML = `<b>${who}:</b> ${text}`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById('send').onclick = () => {
        if (!input.value) return;
        addMsg("Du", input.value);
        if(input.value.toLowerCase().includes("angriff")) {
            setTimeout(() => {
                document.getElementById('p1').style.top = "10%";
                addMsg("Co-Trainer", "Ich rücke den Stürmer vor!");
            }, 500);
        }
        input.value = "";
    };

    // 3. MIKROFON (Nur wenn unterstützt)
    const micBtn = document.getElementById('mic');
    if ('webkitSpeechRecognition' in window) {
        const recognition = new webkitSpeechRecognition();
        recognition.lang = 'de-DE';
        micBtn.onclick = () => { 
            recognition.start(); 
            micBtn.innerText = "🔴"; 
        };
        recognition.onresult = (e) => {
            input.value = e.results[0][0].transcript;
            micBtn.innerText = "🎤";
        };
        recognition.onerror = () => { micBtn.innerText = "🎤"; };
    } else {
        micBtn.style.opacity = "0.3";
    }
</script>

</body>
</html>
