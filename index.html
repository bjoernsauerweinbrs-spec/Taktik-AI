<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 — Tactical OS</title>
    <link rel="stylesheet" href="css/toni-style.css">
</head>
<body class="pro-layout">

    <div id="login-screen">
        <div class="login-box">
            <h1>TONI 2.0</h1>
            <input id="password-input" type="password" class="login-input" placeholder="Passwort (Toni2026)">
            <input id="api-key-input" type="password" class="login-input" placeholder="API-Key">
            <button class="login-btn" onclick="ToniAuth.login()">SYSTEM STARTEN</button>
        </div>
    </div>

    <aside class="sidebar-minimal">
        <div class="sidebar-content">
            <div class="control-unit" onclick="BriefcaseUI.toggle()">
                <div>💼</div><span>ZENTRALE</span>
            </div>
            <div id="voice-trigger-btn" class="control-unit" onclick="ToniAI.toggleListening()">
                <div>🎤</div><span id="mic-status-label">AUS</span>
            </div>
        </div>
    </aside>

    <main id="stage"><canvas id="main-canvas"></canvas></main>
    
    <aside class="analysis-panel">
        <div id="setcard-content">
            <div class="toni-speech-bubble">Willkommen zurück, Björn. Öffne die Aktentasche, um den Kader zu laden.</div>
        </div>
    </aside>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div class="briefcase-window">
            <div id="briefcase-nav" class="folder-grid">
                <div class="nav-card" onclick="BriefcaseUI.switchSektor('sport')">
                    <span>👟</span><b>SPORTTASCHE</b><p>Kader & Export/Import</p>
                </div>
                <div class="nav-card" onclick="BriefcaseUI.switchSektor('orga')">
                    <span>🏢</span><b>GESCHÄFTSZIMMER</b><p>Stadionzeitung & Notizen</p>
                </div>
            </div>
            <div id="briefcase-content" class="hidden">
                <button onclick="BriefcaseUI.backToNav()" class="back-btn">← ZURÜCK</button>
                <div id="active-content"></div>
            </div>
            <button onclick="BriefcaseUI.toggle()" style="margin-top:20px; background:none; border:none; color:white; cursor:pointer;">SCHLIESSEN [X]</button>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script src="engine/toni-ai.js"></script>
    <script>
        window.ToniAuth = {
            login() {
                if(document.getElementById('password-input').value === "Toni2026") {
                    document.getElementById('login-screen').classList.add('hidden');
                    if(window.ToniAI) ToniAI.init();
                    if(window.arena) arena.init('main-canvas');
                } else { alert("Falsches Passwort!"); }
            }
        };
    </script>
</body>
</html>
