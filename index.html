<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni - Taktik Zentrale V14</title>
    <style>
        :root { --pitch-green: #28a745; --line-white: rgba(255,255,255,0.8); }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout Container */
        .container { display: grid; grid-template-columns: 350px 1fr 300px; width: 100%; gap: 10px; padding: 10px; box-sizing: border-box; }

        /* Links: Chat */
        #chat-sidebar { background: #1e1e1e; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333; }
        .header { background: #000; padding: 15px; text-align: center; font-weight: bold; border-bottom: 3px solid var(--pitch-green); }
        #chat-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; max-width: 90%; line-height: 1.4; }
        .user { align-self: flex-end; background: #007bff; }
        .toni { align-self: flex-start; background: #333; }

        /* Mitte: Taktikboard */
        #pitch-area { background: #222; border-radius: 15px; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid #333; overflow: hidden; }
        #pitch { width: 90%; height: 90%; background: var(--pitch-green); border: 2px solid var(--line-white); position: relative; border-radius: 5px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--line-white); }
        .center-circle { position: absolute; left: 50%; top: 50%; width: 100px; height: 100px; border: 2px solid var(--line-white); border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-area { position: absolute; width: 15%; height: 40%; border: 2px solid var(--line-white); top: 30%; }
        .left-box { left: 0; border-left: none; }
        .right-box { right: 0; border-right: none; }

        /* Spieler/Männchen */
        .player { width: 25px; height: 25px; background: red; border: 2px solid white; border-radius: 50%; position: absolute; cursor: move; transition: all 0.5s ease; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* Rechts: Weiße Tafel */
        #whiteboard { background: #f8f9fa; color: #333; border-radius: 15px; padding: 20px; border: 1px solid #ddd; display: flex; flex-direction: column; }
        #whiteboard h3 { margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 5px; }
        #player-list { border: none; width: 100%; height: 100%; font-family: 'Permanent Marker', cursive, sans-serif; font-size: 1.1rem; background: transparent; resize: none; outline: none; line-height: 1.8; }

        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #1e1e1e; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid var(--pitch-green); }
        input { display: block; width: 250px; padding: 12px; margin: 10px auto; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
        button { background: var(--pitch-green); color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .input-area { padding: 15px; background: #111; display: flex; gap: 5px; }
        .input-area input { flex: 1; margin: 0; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>Coach Toni Zentrale</h2>
        <input type="text" id="username" placeholder="Dein Name">
        <input type="password" id="password" placeholder="Passwort">
        <input type="text" id="user-key" placeholder="Google API-Key">
        <button onclick="startToni()">Zentrale aktivieren</button>
    </div>
</div>

<div class="container">
    <div id="chat-sidebar">
        <div class="header">⚽ TONI ANALYSE</div>
        <div id="chat-history"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Taktik-Frage...">
            <button onclick="askToni()">OK</button>
        </div>
    </div>

    <div id="pitch-area">
        <div id="pitch">
            <div class="center-line"></div>
            <div class="center-circle"></div>
            <div class="penalty-area left-box"></div>
            <div class="penalty-area right-box"></div>
            <div id="players-layer"></div>
        </div>
    </div>

    <div id="whiteboard">
        <h3>📋 Kader / Notizen</h3>
        <textarea id="player-list" placeholder="1. Name&#10;2. Name&#10;..."></textarea>
    </div>
</div>

<script>
    let USER_KEY = "";
    
    // Initialisiere 11 Spieler auf dem Feld
    function setupPitch() {
        const layer = document.getElementById('players-layer');
        for(let i=1; i<=11; i++) {
            const p = document.createElement('div');
            p.className = 'player';
            p.id = 'p' + i;
            p.innerText = i;
            // Start-Position (4-4-2 mäßig verteilt)
            p.style.left = (20 + (i%3)*20) + "%";
            p.style.top = (10 + (i%4)*20) + "%";
            layer.appendChild(p);
        }
    }

    function startToni() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const key = document.getElementById('user-key').value.trim();

        if (user && pass === "Trainer2026" && key.startsWith("AIza")) {
            USER_KEY = key;
            document.getElementById('login-overlay').style.display = 'none';
            setupPitch();
            addMsg("toni", `Moin ${user}! Das Stadion ist bereit. Das Board steht in der Mitte und rechts kannst du deinen Kader für das Spiel notieren. Was analysieren wir zuerst?`);
        } else {
            alert("Daten prüfen!");
        }
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addMsg("user", text);
        input.value = "";

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${USER_KEY}`;
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist Fußballtrainer Toni. Antworte kurz und fachlich. Frage: ${text}` }] }] })
            });
            const data = await response.json();
            if (data.candidates) {
                addMsg("toni", data.candidates[0].content.parts[0].text);
            }
        } catch (e) { addMsg("toni", "Fehler!"); }
    }

    function addMsg(role, text) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
