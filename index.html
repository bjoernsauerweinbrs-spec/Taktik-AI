<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toni 2.0 - Ginga Board</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="toni-status-bar">
        <div id="status-led"></div>
        <span id="status-text">Toni ist im Standby</span>
      </div>

      <div id="chat-controls" class="controls">
        <input id="toni-input" type="text" placeholder="Hallo" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line)" />
        <button id="ok-btn">OK</button>
      </div>

      <div id="toni-output"></div>

      <div class="controls">
        <button id="btn-roster">Kader</button>
        <button id="btn-preview">Vorschau Moves</button>
        <button id="export-json" class="ghost">Export JSON</button>
      </div>
    </aside>

    <main id="pitch-wrapper">
      <div id="pitch"></div>
    </main>
  </div>

  <!-- Skripte am Ende laden -->
  <script src="js/storage.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/board.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
