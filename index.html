<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktikboard Pro - Coach Björn</title>
    <style>
        :root { --pitch: #2d5a27; --stripe: #254d21; }
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; color: #fff; }
        #nav { background: #1a1a1a; padding: 10px; display: flex; justify-content: center; gap: 10px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        #pitch-area { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; padding: 10px; background: #000; }
        #pitch { width: 100%; height: 100%; max-width: 1000px; background: var(--pitch); border: 3px solid #fff; position: relative; background-image: repeating-linear-gradient(0deg, var(--pitch), var(--pitch) 10%, var(--stripe) 10%, var(--stripe) 20%); }
        .line { position: absolute; width: 100%; height: 2px; background: rgba(255,255,255,0.6); top: 50%; }
        .player { width: 30px; height: 30px; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; z-index: 50; cursor: move; touch-action: none; }
        .red { background: #b71c1c; } .blue { background: #0d47a1; }
        #ball { width: 16px; height: 16px; background: #fff; border: 2px solid #000; z-index: 100; transition: all 0.5s ease; }
        #chat { height: 30%; background: #fff; color: #000; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 12px; font-size: 14px; background: #f4f4f4; }
        #input-row { padding: 10px; background: #ddd; display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        button.send { background: #2e7d32; color: #fff; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div id="nav">
    <button class="btn" onclick="initF('11v11')">11 gegen 11</button>
    <button class="btn" onclick="initF('funino')">Funino</button>
    <button class="btn" onclick="setK()" style="color:#0f8">🔑 Key eingeben</button>
</div>
<div id="pitch-area"><div id="pitch"><div class="line"></div><div id="ball" class="player" style="top:48%; left:49%"></div><div id="players"></div></div></div>
<div id="chat"><div id="log"></div><div id="input-row"><input type="text" id="msg" placeholder="Anweisung..."><button class="send" onclick="send()">OK</button></div></div>

<script>
    const pL = document.getElementById('players'), log = document.getElementById('log'), ball = document.getElementById('ball'), input = document.getElementById('msg');
    let key = localStorage.getItem('bjorn_v25_key') || "";

    function setK() { const k = prompt("Bitte API-Key einfügen:"); if(k) { localStorage.setItem('bjorn_v25_key', k.trim()); location.reload(); } }
    function addL(n, t) { log.innerHTML += `<div><strong>${n}:</strong> ${t}</div>`; log.scrollTop = log.scrollHeight; }

    function createP(t, l, c, n) {
        const p = document.createElement('div'); p.className = 'player ' + c;
        p.style.top = t + "%"; p.style.left = l + "%"; p.innerText = n;
        pL.appendChild(p); drag(p);
    }

    function initF(m) {
        pL.innerHTML = "";
        if(m === '11v11') {
            const r = [{t:88,l:48},{t:75,l:20},{t:75,l:40},{t:75,l:60},{t:75,l:80},{t:55,l:30},{t:55,l:50},{t:55,l:70},{t:40,l:40},{t:40,l:60},{t:25,l:50}];
            r.forEach((p,i)=>createP(p.t,p.l,'red',i+1));
        } else {
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
        }
    }

    async function send() {
        const val = input.value; if(!val || !key) return;
        addL("Björn", val); input.value = "";
        try {
            // Geänderte URL auf v1 statt v1beta
            const r = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist Co-Trainer. Antworte kurz. Befehl: [BALL:X:Y]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            if(d.error) { addL("System", "Fehler: " + d.error.message); }
            else {
                const txt = d.candidates[0].content.parts[0].text; addL("KI", txt);
                const bM = txt.match(/\[BALL:(\d+):(\d+)\]/); if(bM) { ball.style.left = bM[1]+"%"; ball.style.top = bM[2]+"%"; }
            }
        } catch(e) { addL("System", "Netzwerkfehler."); }
    }

    function drag(el) {
        let active = false;
        el.onmousedown = el.ontouchstart = (e) => { active = true; el.style.transition="none"; };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!active) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
            el.style.left = (x/r.width*100)-2 + "%"; el.style.top = (y/r.height*100)-2 + "%";
        };
        window.onmouseup = window.ontouchend = () => active = false;
    }
    drag(ball);
    input.onkeypress = (e) => { if(e.key === 'Enter') send(); };
    initF('11v11');
</script>
</body>
</html>
