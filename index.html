<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TONI 2.0 | Uncut Elite Build v4.3</title>
<style>
  :root {
    --bg: #010401; --neon: #39FF14; --neon-dim: rgba(57, 255, 20, 0.15);
    --gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --glass: rgba(255, 255, 255, 0.05); --red: #ff3333; --yellow: #ffcc00;
    --club-color: #39FF14; /* Wird dynamisch durch Onboarding gesetzt */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }

  /* --- ARCHITEKTUR --- */
  .app-container { display: grid; grid-template-columns: 80px 1fr 380px; height: 100vh; padding: 12px; gap: 12px; }
  @media (max-width: 900px) {
    .app-container { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 350px; overflow-y: auto; height: auto; }
    .left-nav { flex-direction: row !important; height: 60px; width: 100%; justify-content: space-around; padding: 0 !important; }
  }

  /* --- NAVIGATION --- */
  .left-nav { background: var(--glass); border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 20px; backdrop-filter: blur(15px); }
  .nav-item { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--neon); color: var(--neon); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; transition: 0.3s; }
  .nav-item:hover { background: var(--neon-dim); box-shadow: 0 0 20px var(--neon); }

  /* --- ARENA --- */
  .center-arena { background: #000; border-radius: 20px; border: 1px solid var(--neon-dim); display: flex; flex-direction: column; padding: 15px; position: relative; }
  .arena-header { display: flex; justify-content: space-between; color: var(--neon); font-size: 13px; border-bottom: 1px solid var(--glass); padding-bottom: 8px; margin-bottom: 10px; }
  #board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  canvas { background: #010a01; border-radius: 10px; max-width: 100%; height: auto; box-shadow: 0 0 40px #000; }

  /* --- TONI BOX --- */
  .right-toni { background: var(--glass); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255,255,255,0.05); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; max-width: 90%; }
  .msg.ai { background: var(--neon-dim); align-self: flex-start; border-left: 4px solid var(--neon); }

  /* --- HUB OVERLAY --- */
  .overlay { position: fixed; inset: 20px 410px 20px 105px; background: rgba(2, 6, 2, 0.98); border: 1px solid var(--neon); border-radius: 25px; z-index: 1000; display: none; flex-direction: column; padding: 30px; backdrop-filter: blur(30px); }
  .scroll-content { flex: 1; overflow-y: auto; }
  
  /* AKTENTASCHE OPTIK */
  .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin-top: 20px; }
  .folder-item { background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 25px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
  .folder-item:hover { border-color: var(--neon); background: var(--neon-dim); }
  .folder-icon { font-size: 50px; display: block; margin-bottom: 10px; }

  /* FIFA CARDS */
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; }
  .fifa-card { width: 170px; height: 235px; background: var(--gold); border-radius: 10px; color: #000; position: relative; padding: 12px; cursor: pointer; font-family: 'Arial Black', sans-serif; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
  .status-light { position: absolute; top: 12px; right: 12px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #000; }
  .status-match { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
  .status-training { background: #ffff00; box-shadow: 0 0 10px #ffff00; }
  .status-absent { background: #ff0000; box-shadow: 0 0 10px #ff0000; }
  .card-rating { font-size: 38px; position: absolute; top: 10px; left: 10px; }
  .card-photo { width: 95px; height: 95px; background: rgba(0,0,0,0.1); margin: 10px auto 0 auto; border-bottom: 2px solid #000; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .card-name { text-align: center; font-size: 16px; text-transform: uppercase; margin: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }

  /* LABOR & ZEITUNG */
  .lab-card { background: rgba(255,255,255,0.02); border: 1px solid var(--neon-dim); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; }
  .lab-card::before { content:''; position:absolute; left:0; top:0; width:5px; height:100%; background:var(--neon); box-shadow:0 0 10px var(--neon); }
  .mag-page { background: #fff; color: #000; padding: 40px; border-radius: 5px; min-height: 700px; box-shadow: 0 0 40px #000; }
  .mag-edit { border: 1px dashed transparent; padding: 10px; outline: none; transition: 0.2s; }
  .mag-edit:hover { border-color: #ccc; background: #f9f9f9; }

  /* EDITOR */
  .editor-pane { display: none; background: #000; border: 2px solid var(--neon); padding: 25px; border-radius: 20px; position: absolute; inset: 15px; z-index: 1100; overflow-y: auto; }
  .input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .input-group label { display: block; font-size: 9px; color: var(--neon); text-transform: uppercase; margin-bottom: 4px; }
  .input-group input { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; }

  /* GATES */
  .gate-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
  .gate-input { background: #000; border: 2px solid var(--neon); color: var(--neon); padding: 20px; border-radius: 12px; text-align: center; font-size: 24px; width: 320px; }
</style>
</head>
<body>

<div id="login-gate" class="gate-screen">
  <h1 style="color:var(--neon); letter-spacing: 10px;">TONI 2.0</h1>
  <input type="password" id="pw" class="gate-input" placeholder="PASSWORT">
  <button onclick="unlock()" style="background:var(--neon); padding:15px 60px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">SYSTEM INITIALISIEREN</button>
  <p style="font-size: 10px; color: #444; margin-top: 20px;">Code: 1234</p>
</div>

<div id="ob-screen" class="gate-screen" style="display:none">
  <div style="text-align:center; max-width:400px; width: 100%;">
    <h2 style="color:var(--neon);">IDENTITY SYNC</h2>
    <p id="ob-text">Wie heißt du, Coach?</p>
    <input type="text" id="ob-input" class="gate-input" style="font-size:18px; letter-spacing:normal;">
    <br><br>
    <div id="ob-colors" style="display:none; gap:10px; justify-content:center; margin-bottom:20px;">
        <div onclick="pickColor('#ff0000')" style="width:45px; height:45px; background:red; border-radius:50%; cursor:pointer;"></div>
        <div onclick="pickColor('#0000ff')" style="width:45px; height:45px; background:blue; border-radius:50%; cursor:pointer;"></div>
        <div onclick="pickColor('#ffffff')" style="width:45px; height:45px; background:white; border-radius:50%; cursor:pointer;"></div>
        <div onclick="pickColor('#00ff00')" style="width:45px; height:45px; background:green; border-radius:50%; cursor:pointer;"></div>
    </div>
    <button onclick="nextOb()" style="background:var(--neon); padding:15px 80px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; width:100%;">BESTÄTIGEN</button>
  </div>
</div>

<div class="app-container" id="main-app" style="display:none">
  <div class="left-nav">
    <div class="nav-item" onclick="openBriefcase()">💼</div>
    <div class="nav-item" onclick="openSektor('analyse')">🧪</div>
    <div class="nav-item" onclick="toniSpeak('Mentalitätsmonster aktiviert! Wir jagen den Sieg!')">🎙️</div>
    <div style="flex:1"></div>
    <div class="nav-item" onclick="resetMemory()" style="color:var(--red); border-color:var(--red);">🔁</div>
  </div>

  <div class="center-arena">
    <div class="arena-header">
      <strong id="club-display">ARENA</strong>
      <span id="age-display">[ ELITE ]</span>
    </div>
    <div id="board-wrap">
      <canvas id="main-canvas" width="1000" height="700"></canvas>
    </div>
  </div>

  <div class="right-toni">
    <div style="font-weight:bold; color:var(--neon); display:flex; justify-content:space-between;">TONI AI <span>LIVE</span></div>
    <div class="chat-history" id="chat-box"></div>
    <input type="text" id="cmd" placeholder="Befehl..." style="background:#111; border:1px solid #333; color:#fff; padding:12px; border-radius:10px;" onkeypress="if(event.key==='Enter') sendCmd()">
  </div>
</div>

<div id="hub-ov" class="overlay">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--neon-dim); padding-bottom:15px;">
    <h2 id="hub-title" style="margin:0; color:var(--neon); letter-spacing:3px;">SYSTEM HUB</h2>
    <span onclick="closeHub()" style="cursor:pointer; font-size:40px; line-height:0.5;">✕</span>
  </div>
  <div class="scroll-content" id="hub-content"></div>
</div>

<script>
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d');
  
  // PERSISTENZ
  let user = JSON.parse(localStorage.getItem('toni43_user')) || null;
  let squad = JSON.parse(localStorage.getItem('toni43_squad')) || [];

  // 16 MUSTER-SPIELER GENERIEREN
  if(squad.length === 0) {
    const n = ['Müller','Schmidt','Schneider','Fischer','Weber','Meyer','Wagner','Becker','Schulz','Hoffmann','Schäfer','Koch','Bauer','Richter','Klein','Wolf'];
    const p = ['TW','IV','IV','RV','LV','ZM','ZM','LM','RM','ST','ST','ZM','IV','RV','LM','ST'];
    for(let i=0; i<16; i++) {
      squad.push({
        id: i, name: n[i], pos: p[i], rating: 78 + Math.floor(Math.random()*12),
        status: i<11 ? 'match' : (i<14 ? 'training' : 'absent'),
        x: 100 + (i*50), y: 650, // Start auf der Bank
        weight: 78+i, fat: 10.5+Math.random()*4, muscle: 38+Math.random()*4, bpm: 62, hrv: 55, sleep: 80, spo2: 98, img: ''
      });
    }
    localStorage.setItem('toni43_squad', JSON.stringify(squad));
  }

  let obStep = 0; let curColor = '#39FF14';

  function unlock() {
    if(document.getElementById('pw').value === '1234') {
      document.getElementById('login-gate').style.display = 'none';
      if(!user) document.getElementById('ob-screen').style.display='flex'; else startApp();
    } else alert("CODE FALSCH");
  }

  function nextOb() {
    const val = document.getElementById('ob-input').value; if(!val && obStep < 2) return;
    if(obStep === 0) {
      user = { coach: val }; document.getElementById('ob-text').innerText = "Dein Verein?";
      document.getElementById('ob-input').value = ""; obStep++;
    } else if(obStep === 1) {
      user.club = val; document.getElementById('ob-text').innerText = "Wähle deine Vereinsfarbe:";
      document.getElementById('ob-input').style.display = 'none';
      document.getElementById('ob-colors').style.display = 'flex'; obStep++;
    } else if(obStep === 2) {
      user.age = "Erste Mannschaft";
      localStorage.setItem('toni43_user', JSON.stringify(user)); startApp();
    }
  }

  function pickColor(c) { curColor = c; user.color = c; nextOb(); }

  function startApp() {
    document.getElementById('ob-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'grid';
    document.getElementById('club-display').innerText = user.club.toUpperCase();
    document.documentElement.style.setProperty('--club-color', user.color);
    renderArena();
    toniSpeak(`Servus ${user.coach}! Elite Build v4.3 geladen. Die Aktentasche ist bereit.`);
  }

  // --- ARENA ENGINE ---
  function drawPitch() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#021a02'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 2;

    // PROFIFELD LINIERUNG
    ctx.strokeRect(40, 40, canvas.width-80, canvas.height-180);
    ctx.beginPath(); ctx.moveTo(canvas.width/2, 40); ctx.lineTo(canvas.width/2, canvas.height-140); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width/2, (canvas.height-100)/2, 80, 0, Math.PI*2); ctx.stroke();
    ctx.strokeRect(40, canvas.height/2-150, 120, 300); ctx.strokeRect(canvas.width-160, canvas.height/2-150, 120, 300); // 16er
    ctx.strokeRect(40, canvas.height/2-70, 50, 140); ctx.strokeRect(canvas.width-90, canvas.height/2-70, 50, 140); // 5er
    
    // ERSATZBANK BEREICH
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, canvas.height-130, canvas.width, 130);
    ctx.strokeStyle = '#39FF14'; ctx.setLineDash([5,5]); ctx.strokeRect(5, canvas.height-125, canvas.width-10, 120);
    ctx.setLineDash([]); ctx.fillStyle = '#39FF14'; ctx.font = '10px Arial'; ctx.fillText("ERSATZBANK / AUSWAHL", 15, canvas.height-110);
  }

  function renderArena() {
    drawPitch();
    squad.forEach(p => {
      if(p.y < canvas.height - 130) {
        // Spieler auf Feld -> Punkt
        ctx.shadowBlur = 15; ctx.shadowColor = user.color;
        ctx.fillStyle = user.color; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = 'bold 12px Arial'; ctx.textAlign='center';
        ctx.fillText(p.name[0], p.x, p.y+5);
      } else {
        // Spieler auf Bank -> Mini Karte
        ctx.fillStyle = '#bf953f'; ctx.fillRect(p.x-18, p.y-25, 36, 50);
        ctx.fillStyle = '#000'; ctx.font = 'bold 8px Arial'; ctx.fillText(p.name, p.x, p.y+15);
        ctx.fillText(p.pos, p.x, p.y-10);
      }
    });
  }

  // --- DRAG & DROP ---
  let drag = null;
  canvas.onmousedown = (e) => {
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (canvas.width/r.width);
    const my = (e.clientY - r.top) * (canvas.height/r.height);
    drag = squad.find(p => Math.hypot(p.x - mx, p.y - my) < 30);
  };
  canvas.onmousemove = (e) => {
    if(drag) {
      const r = canvas.getBoundingClientRect();
      drag.x = (e.clientX - r.left) * (canvas.width/r.width);
      drag.y = (e.clientY - r.top) * (canvas.height/r.height);
      renderArena();
    }
  };
  canvas.onmouseup = () => { drag = null; localStorage.setItem('toni43_squad', JSON.stringify(squad)); };

  // --- BRIEFCASE LOGIC ---
  function openBriefcase() {
    document.getElementById('hub-ov').style.display = 'flex';
    document.getElementById('hub-title').innerText = 'AKTTENTASCHE: MANAGEMENT';
    const c = document.getElementById('hub-content'); c.className = 'folder-grid';
    c.innerHTML = `
      <div class="folder-item" onclick="openSektor('kabine')"><span class="folder-icon">👕</span><strong>KABINE</strong></div>
      <div class="folder-item" onclick="openSektor('business')"><span class="folder-icon">🤝</span><strong>SPONSORING</strong></div>
      <div class="folder-item" onclick="openSektor('zeitung')"><span class="folder-icon">📰</span><strong>ZEITUNG</strong></div>
    `;
  }

  function openSektor(s) {
    const c = document.getElementById('hub-content'); const t = document.getElementById('hub-title');
    c.innerHTML = '';
    if(s === 'kabine') {
      t.innerText = 'MANNSCHAFTS-KABINE'; c.className = 'fifa-grid';
      squad.forEach(p => {
        const sClass = p.status==='match'?'status-match':(p.status==='training'?'status-training':'status-absent');
        c.innerHTML += `
          <div class="fifa-card" onclick="toggleStatus(${p.id})">
            <div class="status-light ${sClass}"></div>
            <div class="card-rating">${p.rating}</div>
            <div class="card-photo">👤</div>
            <div class="card-name">${p.name}</div>
            <div class="card-stats-grid"><span>POS: ${p.pos}</span><span>FAT: ${p.fat.toFixed(1)}%</span></div>
          </div>`;
      });
    } else if(s === 'analyse') {
      document.getElementById('hub-ov').style.display='flex';
      t.innerText = 'VITAL-LABORATORIUM'; c.className = 'scroll-content';
      squad.forEach(p => {
        c.innerHTML += `<div class="lab-card"><strong>${p.name.toUpperCase()}</strong><br><small>Puls: ${p.bpm} | HRV: ${p.hrv} | Muskel: ${p.muscle}kg</small></div>`;
      });
    } else if(s === 'zeitung') {
      t.innerText = 'STADIONZEITUNG EDITOR';
      c.innerHTML = `
        <div class="mag-page">
          <h1 style="text-align:center;">${user.club.toUpperCase()} MATCHDAY</h1>
          <div class="mag-edit" contenteditable="true"><h3>Wort vom Vorstand</h3>Herzlich Willkommen zum Spiel...</div>
          <div class="mag-edit" contenteditable="true"><h3>Trainer Analyse</h3>Wir jagen heute drei Punkte...</div>
        </div>
        <button onclick="window.print()" style="width:100%; margin-top:20px; padding:15px; background:var(--neon); border:none; font-weight:bold; border-radius:10px; cursor:pointer;">DRUCKEN</button>`;
    }
  }

  function toggleStatus(id) {
    const p = squad.find(x => x.id === id);
    if(p.status === 'match') p.status = 'training';
    else if(p.status === 'training') p.status = 'absent';
    else p.status = 'match';
    localStorage.setItem('toni43_squad', JSON.stringify(squad)); openSektor('kabine');
  }

  function toniSpeak(t) {
    const box = document.getElementById('chat-box'); box.innerHTML += `<div class="msg ai">Toni: ${t}</div>`;
    const ut = new SpeechSynthesisUtterance(t); ut.lang = 'de-DE'; ut.pitch = 0.8;
    const voices = window.speechSynthesis.getVoices();
    ut.voice = voices.find(v => v.name.includes('Deutsch') && v.name.includes('Google')) || voices[0];
    window.speechSynthesis.speak(ut);
  }

  function resetMemory() { localStorage.clear(); location.reload(); }
  function closeHub() { document.getElementById('hub-ov').style.display='none'; }
  function sendCmd() { const i = document.getElementById('cmd'); if(i.value) { toniSpeak("Analysiere: " + i.value); i.value=''; } }
  if(user) startApp();
</script>
</body>
</html>
