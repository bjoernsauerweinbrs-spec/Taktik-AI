<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — Tactical Intelligence</title>
    <link rel="stylesheet" href="css/toni-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="color:var(--accent-orange); font-size:3rem;">TONI 2.0</h1>
            <p style="color:var(--data-cyan); letter-spacing:2px; margin-bottom:30px;">SYSTEM ACCESS REQUIRED</p>
            <input id="password-input" type="password" class="login-input" placeholder="Passwort">
            <button class="login-btn" onclick="ToniAuth.login()">LOGIN</button>
        </div>
    </div>

    <aside class="sidebar-minimal">
        <div class="sidebar-content">
            <div class="control-unit" id="briefcase-trigger" onclick="window.BriefcaseUI.toggle()">
                <div class="icon">💼</div>
                <span>ZENTRALE</span>
            </div>
            <div class="control-unit" onclick="window.ToniAI.toggleListening()">
                <div class="icon">🎤</div>
                <span id="mic-status-label">AI</span>
            </div>
        </div>
    </aside>

    <main id="stage"><canvas id="main-canvas"></canvas></main>

    <aside class="analysis-panel">
        <div id="setcard-content">
            <div class="toni-speech-bubble">Willkommen Björn. Öffne die Zentrale, um den Kader oder das Geschäftszimmer zu verwalten.</div>
        </div>
    </aside>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div class="briefcase-window">
            <div id="briefcase-nav" class="folder-grid">
                <div class="nav-card" onclick="BriefcaseUI.switchSektor('sport')">
                    <span style="font-size:40px;">👟</span>
                    <b>SPORTTASCHE</b>
                    <p>Analysezentrum & Setcards</p>
                </div>
                <div class="nav-card" onclick="BriefcaseUI.switchSektor('orga')">
                    <span style="font-size:40px;">🏢</span>
                    <b>GESCHÄFTSZIMMER</b>
                    <p>Stadionzeitung & Orga</p>
                </div>
            </div>
            <div id="briefcase-content" class="hidden">
                <button onclick="BriefcaseUI.backToNav()" class="back-btn">← ZURÜCK</button>
                <div id="active-content"></div>
            </div>
            <button onclick="BriefcaseUI.toggle()" class="close-overlay-btn">SCHLIESSEN [X]</button>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script src="engine/toni-ai.js"></script>
    <script>
        window.ToniAuth = {
            login() {
                if(document.getElementById('password-input').value === "Toni2026") {
                    document.getElementById('login-screen').classList.add('hidden');
                    if(window.arena) window.arena.init('main-canvas');
                } else { alert("Passwort inkorrekt!"); }
            }
        };
    </script>
</body>
</html>
