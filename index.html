<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Tactical Elite</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #050505; color: white; overflow: hidden; }
        
        /* Navigation */
        #top-nav { background: #111; padding: 10px; display: flex; justify-content: center; gap: 15px; border-bottom: 2px solid #333; }
        .btn-mode { background: #222; color: #00ff88; border: 1px solid #00ff88; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-mode:hover { background: #00ff88; color: #000; }

        /* Spielfeld */
        #pitch { 
            flex: 2; background: #235e31; position: relative; border: 4px solid white; margin: 10px; border-radius: 4px;
            background-image: linear-gradient(rgba(255,255,255,0.1) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.1) 2px, transparent 2px);
            background-size: 10% 10%; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .pitch-line { position: absolute; border: 2px solid rgba(255,255,255,0.5); pointer-events: none; }
        
        /* Tore */
        .goal { position: absolute; border: 3px solid white; background: rgba(255,255,255,0.1); transition: 0.5s; }
        .standard-goal-top { width: 80px; height: 25px; top: 0; left: 50%; transform: translateX(-50%); border-top: none; }
        .standard-goal-bottom { width: 80px; height: 25px; bottom: 0; left: 50%; transform: translateX(-50%); border-bottom: none; }
        .funino-goal { width: 50px; height: 20px; }

        /* Spieler & Ball */
        .player { 
            width: 34px; height: 34px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 12px; cursor: grab; z-index: 10;
            border: 2px solid #fff; transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1); touch-action: none;
        }
        .red { background: radial-gradient(circle, #ff416c, #ff4b2b); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .blue { background: radial-gradient(circle, #4b6cb7, #182848); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .ball { width: 20px; height: 20px; background: #fff; border: 2px solid #000; z-index: 20; border-radius: 50%; box-shadow: 0 0 15px white; transition: all 1s ease-in-out; }

        /* Chat */
        #chat { flex: 1; background: #fff; color: #000; display: flex; flex-direction: column; border-top: 4px solid #00ff88; }
        #msg-log { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; }
        .bubble { margin-bottom: 10px; padding: 10px; border-radius: 10px; line-height: 1.4; }
        .ai { background: #e8f5e9; border-left: 5px solid #2e7d32; }
        .user { background: #e3f2fd; border-right: 5px solid #1565c0; text-align: right; }

        #input-area { padding: 10px; background: #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        button { background: none; border: none; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>

<div id="top-nav">
    <button class="btn-mode" onclick="setMode('funino')">Funino (3v3)</button>
    <button class="btn-mode" onclick="setMode('11v11')">Pro (11v11)</button>
</div>

<div id="pitch">
    <div id="ball" class="player ball" style="top: 48%; left: 48%;"></div>
    <div id="team-layer"></div>
</div>

<div id="chat">
    <div id="msg-log">
        <div class="bubble ai"><b>Gemini:</b> Björn, die Arena steht. Wähle die Spielform oder gib mir einen Befehl. Versuch mitzuhalten.</div>
