<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni 2.0 - Login</title>
    <style>
        body { 
            background: #121212; color: white; display: flex; align-items: center; 
            justify-content: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; 
        }
        .login-card { 
            background: #1e1e1e; padding: 40px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); text-align: center; 
            width: 100%; max-width: 400px; border: 1px solid #333; 
        }
        .flags { font-size: 45px; margin-bottom: 25px; display: block; letter-spacing: 15px; }
        h2 { margin-bottom: 25px; font-weight: 600; color: #fff; }
        input { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px; 
            border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; 
        }
        button { 
            width: 100%; padding: 14px; background: #2e7d32; color: white; border: none; 
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; 
        }
        button:hover { background: #388e3c; }
        .error { color: #ff5252; display: none; margin-top: 15px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="flags">🇧🇷 🇩🇪 🇮🇹</span>
        <h2>Toni 2.0 Login</h2>
        <input type="text" id="username" placeholder="Benutzername (Björn)">
        <input type="password" id="password" placeholder="Passwort (1234)">
        <input type="password" id="api-key" placeholder="Groq API-Key (gsk_...)">
        <button onclick="checkLogin()">Spielfeld betreten</button>
        <p id="error-msg" class="error">Zugriff verweigert. Prüfe deine Daten.</p>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();

            if((user === 'björn' || user === 'admin' || user === 'bjoern') && pass === '1234' && apiKey.startsWith('gsk_')) {
                sessionStorage.setItem('toni_auth', 'true');
                sessionStorage.setItem('groq_api_key', apiKey);
                window.location.href = 'app.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
