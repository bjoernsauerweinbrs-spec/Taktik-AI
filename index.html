<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="TITAN v10.1 ELITE - Stable Build">
    <title>TITAN v10.1 ELITE</title>
</head>
<body>

    <div id="system-loader" class="system-overlay">
        <div class="spinner"></div>
    </div>

    <div id="login-screen" class="system-overlay" style="display: none;">
        <div class="login-box">
            <h1>TITAN v10 ELITE</h1>
            <p>Wähle dein Vereinsprofil zum Laden.</p>
            <form id="login-form">
                <select id="profile-selector" name="profile"></select>
                <button type="submit" class="btn-start">System Starten</button>
            </form>
        </div>
    </div>

    <div id="mobile-backdrop" class="system-overlay" style="display: none; background: rgba(0,0,0,0.5); z-index: 7500;"></div>

    <div id="main-app" class="app-container" style="display: none;">

        <header class="app-header">
            <div class="header-left">
                <button id="toggle-left-panel-btn" class="mobile-nav-btn">☰</button>
                <div id="user-profile">
                    <div id="user-avatar"></div>
                    <div class="user-details">
                        <span id="user-name"></span>
                        <span id="user-role"></span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div id="desktop-controls">
                    <button id="live-session-btn" title="Live-Session mit Toni AI">🎙️</button>
                </div>
                <button id="toggle-right-panel-btn" class="mobile-nav-btn">💬</button>
            </div>
        </header>

        <aside id="left-panel">
            <div class="panel-content">
                <div id="squad-list-container">
                    <h2>Mannschaft</h2>
                    <div id="squad-list"></div>
                </div>
                <nav class="main-navigation">
                    <h2>Module</h2>
                    <button class="nav-btn" data-action="open-clipboard">📋 Tactical Clipboard</button>
                    <button class="nav-btn" data-action="open-manager-cockpit">💼 Manager Cockpit</button>
                </nav>
            </div>
            <footer class="panel-footer">
                <button class="nav-btn logout" data-action="logout">Logout</button>
            </footer>
        </aside>

        <main id="main-arena">
            <div id="board-wrap">
                <canvas id="main-canvas"></canvas>
            </div>
        </main>

        <aside id="right-panel">
            <header class="panel-header">
                <h3>Toni AI <span id="ai-status-indicator">●</span></h3>
                <button id="close-right-panel-btn" class="mobile-nav-btn">✕</button>
            </header>
            <div id="chat-box" class="chat-content"></div>
            <form id="chat-form" class="chat-footer">
                <input id="chat-input" type="text" placeholder="Befehl für Toni...">
                <button type="submit">➤</button>
            </form>
        </aside>

    </div>

    <div id="player-dashboard-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-box">
            <header class="dialog-header">
                <h2 id="player-dialog-title"></h2>
                <button data-action="close-dialog">✕</button>
            </header>
            <div id="player-dialog-content" class="dialog-content"></div>
        </div>
    </div>

    <div id="manager-cockpit-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-box large">
            <header class="dialog-header">
                <h2>💼 Manager Cockpit</h2>
                <button data-action="close-dialog">✕</button>
            </header>
            <div id="manager-dialog-content" class="dialog-content"></div>
        </div>
    </div>

    <div id="clipboard-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-box large">
            <header class="dialog-header">
                <h2>📋 Tactical Clipboard</h2>
                <button data-action="print-clipboard">🖨️</button>
                <button data-action="close-dialog">✕</button>
            </header>
            <div id="clipboard-dialog-content" class="dialog-content"></div>
        </div>
    </div>

</body>
<style>
    /* ======================================================================= */
    /* I. Design System & Variablen                                            */
    /* ======================================================================= */
    :root {
        --bg-dark: #0d1117;
        --bg-medium: #161b22;
        --bg-light: #21262d;
        --border-color: #30363d;
        --text-primary: #e6edf3;
        --text-secondary: #848d97;
        --accent-blue: #58a6ff;
        --accent-green: #3fb950;
        --accent-red: #f85149;
        --accent-yellow: #e3b341;
        --gold-gradient: linear-gradient(145deg, #d4af37, #b48c2c, #d4af37);
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --radius-md: 10px;
        --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100%; width: 100%;
        background-color: var(--bg-dark);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 15px;
        overflow: hidden;
    }

    /* ======================================================================= */
    /* II. System Overlays (FIX: Sichtbarkeits-Priorität)                      */
    /* ======================================================================= */
    .system-overlay {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; /* Standardmäßig flex, wird aber durch inline-styles gesteuert */
        align-items: center; justify-content: center;
        background: rgba(13, 17, 23, 0.95);
        backdrop-filter: blur(10px);
    }

    /* Der Spinner, der im Original fehlte */
    .spinner {
        width: 60px; height: 60px;
        border: 6px solid var(--border-color);
        border-top-color: var(--accent-blue);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ======================================================================= */
    /* III. App-Layout & Grid                                                  */
    /* ======================================================================= */
    .app-container {
        display: grid; height: 100vh; width: 100vw;
        grid-template-areas: "header header header" "nav main aside";
        grid-template-columns: 280px 1fr 350px;
        grid-template-rows: 65px 1fr;
        gap: 12px; padding: 12px;
    }

    .app-header { grid-area: header; background: var(--bg-medium); border: 1px solid var(--border-color); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    #left-panel { grid-area: nav; background: var(--bg-medium); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; overflow: hidden; }
    #main-arena { grid-area: main; background: var(--bg-medium); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 8px; position: relative; }
    #right-panel { grid-area: aside; background: var(--bg-medium); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; overflow: hidden; }

    /* ======================================================================= */
    /* IV. Arena & Taktikboard                                                 */
    /* ======================================================================= */
    #board-wrap { width: 100%; height: 100%; background: #011a01; border-radius: var(--radius-md); position: relative; overflow: hidden; }
    #main-canvas { width: 100%; height: 100%; touch-action: none; cursor: grab; }

    /* Tool-Buttons auf dem Feld */
    #arena-controls { position: absolute; top: 15px; left: 15px; display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: var(--radius-md); z-index: 100; }

    /* ======================================================================= */
    /* V. Pro-Features: Gold Card & Fatigue                                    */
    /* ======================================================================= */
    .gold-card { background: var(--gold-gradient); color: #1a1a1a; padding: 20px; border-radius: var(--radius-md); font-weight: bold; }
    
    .fatigue-warning { animation: fatigue-pulse 1.5s infinite ease-in-out; }
    @keyframes fatigue-pulse {
        0%, 100% { filter: drop-shadow(0 0 2px var(--accent-red)); }
        50% { filter: drop-shadow(0 0 12px var(--accent-red)); }
    }

    /* ======================================================================= */
    /* VI. Dialoge & Modals                                                    */
    /* ======================================================================= */
    .dialog-overlay {
        position: fixed; inset: 0; z-index: 9000;
        background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        display: none; align-items: center; justify-content: center;
    }
    .dialog-overlay.is-active { display: flex; }
    .dialog-box { background: var(--bg-medium); width: 90%; max-width: 1200px; max-height: 90%; border-radius: var(--radius-lg); border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; }
    .dialog-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .dialog-content { padding: 20px; overflow-y: auto; flex-grow: 1; }

    /* Responsive Fixes */
    @media (max-width: 1000px) {
        .app-container { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
        #left-panel, #right-panel { display: none; } /* Werden via JS eingeblendet */
    }
</style>
<script>
    'use strict';

    /* ======================================================================= */
    /* I. MOCK DATABASE & API SERVICE                                          */
    /* ======================================================================= */
    const MockData = {
        profiles: {
            "coach_meier": { id: "coach_meier", name: "Björn Meier", role: "Cheftrainer", club: "FC TITAN ELITE", avatar: "BM" },
            "manager_schmidt": { id: "manager_schmidt", name: "Jens Schmidt", role: "Manager", club: "FC TITAN ELITE", avatar: "JS" }
        },
        squad: {
            "p1": { id: "p1", name: "Müller", num: 13, pos: "ST", canvas: {x: 650, y: 250}, att: { pac: 90, sho: 88, pas: 80, dri: 85, def: 40, phy: 78 }, ovr: 88, bio: { hrv: 92, fatPct: 11.2, readiness: 95 }, mental: { sleep: 8, stress: 2, motiv: 9 }, stats: { minutes: 0, performance: 100 } },
            "p2": { id: "p2", name: "Kimmich", num: 6, pos: "ZDM", canvas: {x: 450, y: 250}, att: { pac: 75, sho: 78, pas: 91, dri: 84, def: 82, phy: 79 }, ovr: 89, bio: { hrv: 95, fatPct: 12.1, readiness: 98 }, mental: { sleep: 9, stress: 1, motiv: 10 }, stats: { minutes: 0, performance: 100 } },
            "p3": { id: "p3", name: "Hummels", num: 5, pos: "IV", canvas: {x: 250, y: 180}, att: { pac: 65, sho: 60, pas: 78, dri: 72, def: 90, phy: 84 }, ovr: 86, bio: { hrv: 85, fatPct: 13.5, readiness: 88 }, mental: { sleep: 6, stress: 4, motiv: 8 }, stats: { minutes: 0, performance: 100 } },
            "p4": { id: "p4", name: "Rüdiger", num: 2, pos: "IV", canvas: {x: 250, y: 320}, att: { pac: 85, sho: 55, pas: 70, dri: 70, def: 87, phy: 88 }, ovr: 87, bio: { hrv: 94, fatPct: 11.8, readiness: 96 }, mental: { sleep: 8, stress: 2, motiv: 9 }, stats: { minutes: 0, performance: 100 } },
            "p5": { id: "p5", name: "Neuer", num: 1, pos: "TW", canvas: {x: 100, y: 250}, att: { pac: 60, sho: 30, pas: 65, dri: 40, def: 88, phy: 82 }, ovr: 85, bio: { hrv: 91, fatPct: 12.8, readiness: 94 }, mental: { sleep: 8, stress: 2, motiv: 9 }, stats: { minutes: 0, performance: 100 } }
        },
        finances: { budget: 2500000, salaries: 1200000, infra: 300000 },
        contracts: [
            { id: "p3", name: "Hummels", type: "player", endDate: new Date(Date.now() + 1000 * 60 * 60 * 24 * 150) },
            { id: "p1", name: "Müller", type: "player", endDate: new Date(Date.now() + 1000 * 60 * 60 * 24 * 450) }
        ]
    };

    const ApiService = {
        async getProfiles() { return Object.values(MockData.profiles); },
        async loadData(profileId) { 
            return { user: MockData.profiles[profileId], squad: MockData.squad, finances: MockData.finances, contracts: MockData.contracts };
        }
    };

    /* ======================================================================= */
    /* II. UI MANAGER (FIX: Hier wurde der schwarze Bildschirm gelöst)         */
    /* ======================================================================= */
    const AppState = { user: null, squad: null, finances: null, contracts: null };

    const UIManager = {
        init() {
            this.elements = {
                loader: document.getElementById('system-loader'),
                login: document.getElementById('login-screen'),
                app: document.getElementById('main-app'),
                canvas: document.getElementById('main-canvas'),
                selector: document.getElementById('profile-selector'),
                chat: document.getElementById('chat-box')
            };
            this.bindEvents();
        },
        bindEvents() {
            document.getElementById('login-form').onsubmit = (e) => {
                e.preventDefault();
                App.login(this.elements.selector.value);
            };
            document.getElementById('toggle-left-panel-btn').onclick = () => this.togglePanel('left-panel');
            document.getElementById('toggle-right-panel-btn').onclick = () => this.togglePanel('right-panel');
            
            // Delegiertes Event-Handling für Dialoge
            document.addEventListener('click', (e) => {
                const action = e.target.closest('[data-action]')?.dataset.action;
                if (!action) return;
                if (action === 'close-dialog') e.target.closest('.dialog-overlay').style.display = 'none';
                if (action === 'open-clipboard') this.renderDialog('clipboard-dialog');
                if (action === 'open-manager-cockpit') this.renderDialog('manager-cockpit-dialog');
                if (action === 'logout') App.logout();
            });
        },
        togglePanel(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        },
        renderDialog(id) {
            document.getElementById(id).style.display = 'flex';
            if(id === 'manager-cockpit-dialog') this.renderManagerContent();
            if(id === 'clipboard-dialog') this.renderClipboardContent();
        },
        renderSquad() {
            const list = document.getElementById('squad-list');
            list.innerHTML = Object.values(AppState.squad).map(p => `
                <button class="btn" onclick="UIManager.renderPlayerDashboard('${p.id}')" style="width:100%; display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span>${p.num} ${p.name}</span>
                    <strong style="color:var(--accent-green);">${p.ovr}</strong>
                </button>
            `).join('');
        },
        renderPlayerDashboard(id) {
            const p = AppState.squad[id];
            const diag = document.getElementById('player-dashboard-dialog');
            document.getElementById('player-dialog-title').innerText = `Akte: ${p.name}`;
            document.getElementById('player-dialog-content').innerHTML = `
                <div class="gold-card">
                    <div style="display:flex; justify-content:space-between;"><span>${p.ovr} OVR</span><span>${p.pos}</span></div>
                    <h2 style="text-align:center;">${p.name.toUpperCase()}</h2>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>PAC: ${p.att.pac}</div><div>DRI: ${p.att.dri}</div>
                        <div>SHO: ${p.att.sho}</div><div>DEF: ${p.att.def}</div>
                    </div>
                    <hr style="margin:10px 0;">
                    <small>READINESS: ${p.bio.readiness}% | HRV: ${p.bio.hrv}ms</small>
                </div>
            `;
            diag.style.display = 'flex';
        },
        renderManagerContent() {
            const f = AppState.finances;
            const liquidity = f.budget - f.salaries - f.infra;
            document.getElementById('manager-dialog-content').innerHTML = `
                <h3>Finanz-Cockpit</h3>
                <p>Budget: ${f.budget.toLocaleString()} €</p>
                <p>Kosten: ${(f.salaries + f.infra).toLocaleString()} €</p>
                <p><strong>Liquidität: ${liquidity.toLocaleString()} €</strong></p>
            `;
        },
        renderClipboardContent() {
            document.getElementById('clipboard-dialog-content').innerHTML = `
                <h3>Spieltag-Countdown</h3>
                <ul><li>14:30 Ankunft</li><li>15:15 Warm-up</li></ul>
                <button class="btn" onclick="window.print()" style="margin-top:20px; background:var(--accent-blue);">🖨️ PLAN DRUCKEN</button>
            `;
        }
    };

    /* ======================================================================= */
    /* III. ARENA ENGINE (Taktikboard & Substitution AI)                       */
    /* ======================================================================= */
    const Arena = {
        ctx: null, dpr: window.devicePixelRatio || 1,
        init() {
            const canvas = document.getElementById('main-canvas');
            this.ctx = canvas.getContext('2d');
            this.resize();
            window.onresize = () => this.resize();
            this.loop();
            this.startSubstitutionAI();
        },
        resize() {
            const canvas = document.getElementById('main-canvas');
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * this.dpr;
            canvas.height = rect.height * this.dpr;
            this.ctx.scale(this.dpr, this.dpr);
        },
        startSubstitutionAI() {
            setInterval(() => {
                Object.values(AppState.squad).forEach(p => {
                    p.stats.minutes += 1;
                    // Formel: P(t) = P0 * e^(-kt)
                    p.stats.performance = p.bio.readiness * Math.exp(-0.0035 * p.stats.minutes);
                });
            }, 5000); // 5 Sekunden Echtzeit = 5 Minuten Spielzeit Simulation
        },
        loop() {
            this.draw();
            requestAnimationFrame(() => this.loop());
        },
        draw() {
            const canvas = document.getElementById('main-canvas');
            const w = canvas.width / this.dpr;
            const h = canvas.height / this.dpr;
            this.ctx.clearRect(0, 0, w, h);

            // Spielfeld
            this.ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            this.ctx.strokeRect(20, 20, w-40, h-40);
            this.ctx.beginPath(); this.ctx.moveTo(w/2, 20); this.ctx.lineTo(w/2, h-20); this.ctx.stroke();

            // Spieler zeichnen
            Object.values(AppState.squad).forEach(p => {
                const {x, y} = p.canvas;
                
                // Fatigue-Blinking (Substitution AI)
                if (p.stats.performance < 75) {
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = `rgba(248, 81, 73, ${Math.abs(Math.sin(Date.now()/300))})`;
                }

                this.ctx.fillStyle = p.pos === 'TW' ? 'var(--accent-yellow)' : 'var(--accent-blue)';
                this.ctx.beginPath();
                this.ctx.arc(x, y, 20, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;

                this.ctx.fillStyle = 'white';
                this.ctx.font = 'bold 14px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(p.num, x, y + 5);
                this.ctx.font = '10px sans-serif';
                this.ctx.fillText(p.name, x, y + 35);
            });
        }
    };

    /* ======================================================================= */
    /* IV. TONI AI (Kognitive Intelligenz)                                     */
    /* ======================================================================= */
    const Toni = {
        init() {
            document.getElementById('chat-form').onsubmit = (e) => {
                e.preventDefault();
                this.process();
            };
            this.speak("Toni AI v10.1 online. Morgenreport wird erstellt...");
            this.morningCheck();
        },
        speak(msg) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div style="margin-bottom:10px;"><small style="color:var(--accent-green);">TONI:</small><br>${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        },
        morningCheck() {
            const red = Object.values(AppState.squad).filter(p => p.bio.readiness < 90);
            if(red.length > 0) this.speak(`⚠️ Achtung Coach: ${red.length} Spieler (u.a. ${red[0].name}) sind heute im roten Bereich.`);
            else this.speak("✅ Alle Spieler sind bei 100% Einsatzbereitschaft.");
        },
        process() {
            const input = document.getElementById('chat-input');
            const val = input.value.toLowerCase();
            if(!val) return;
            if(val.includes("status")) this.morningCheck();
            else this.speak("Ich habe das Web nach Taktiken gescannt. Fokus heute: Flügelspiel.");
            input.value = '';
        }
    };

    /* ======================================================================= */
    /* V. APPLICATION ENTRY POINT (Stable Boot)                                */
    /* ======================================================================= */
    const App = {
        async init() {
            UIManager.init();
            const profiles = await ApiService.getProfiles();
            // Zugriff über UIManager.elements verhindert Crash
            UIManager.elements.selector.innerHTML = profiles.map(p => `<option value="${p.id}">${p.name} (${p.role})</option>`).join('');
            
            // Simulierter Start
            setTimeout(() => {
                UIManager.elements.loader.style.display = 'none';
                UIManager.elements.login.style.display = 'flex';
            }, 1000);
        },
        async login(profileId) {
            UIManager.elements.login.style.display = 'none';
            UIManager.elements.loader.style.display = 'flex';
            
            const data = await ApiService.loadData(profileId);
            Object.assign(AppState, data);
            
            setTimeout(() => {
                UIManager.elements.loader.style.display = 'none';
                UIManager.elements.app.style.display = 'grid';
                document.getElementById('user-name').innerText = AppState.user.name;
                document.getElementById('user-role').innerText = AppState.user.club;
                document.getElementById('user-avatar').innerText = AppState.user.avatar;
                
                UIManager.renderSquad();
                Arena.init();
                Toni.init();
            }, 1000);
        },
        logout() { window.location.reload(); }
    };

    document.addEventListener('DOMContentLoaded', () => App.init());
</script>
