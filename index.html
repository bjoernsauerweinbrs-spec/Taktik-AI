<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI AI - Pro VR Training</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body>

    <div class="sidebar">
        <div class="logo">⚽ TONI AI</div>
        <button class="nav-btn active" onclick="showModule('dashboard')">🏠 Kabine</button>
        <button class="nav-btn" onclick="showModule('tactics')">📋 Taktik</button>
        <button class="nav-btn" onclick="showModule('management')">💼 Aktentasche</button>
        <button class="nav-btn" onclick="showModule('bio')">❤️ Bio-Labor</button>
        <button class="nav-btn" onclick="showModule('vr')">🥽 VR-Center</button>
    </div>

    <div class="main-content">
        <div id="dashboard" class="module-section active">
            <h2>Mannschaftskabine</h2>
            <div id="locker-room-container"></div>
        </div>

        <div id="tactics" class="module-section">
            <h2>Taktik-Board</h2>
            <div class="tactic-controls">
                <button onclick="setFormation('4-4-2')">Toni (4-4-2)</button>
                <button onclick="setFormation('3-4-3')">Trainer (3-4-3)</button>
                <button onclick="clearBoard()" class="btn-danger">Reset</button>
            </div>
            <div class="pitch-container"><canvas id="tacticBoard"></canvas></div>
        </div>

        <div id="management" class="module-section">
            <h2>Die Aktentasche</h2>
            <div class="management-container" id="mgmt-content"></div>
        </div>

        <div id="bio" class="module-section">
            <div class="lab-header">
                <h2>Performance Lab</h2>
                <div class="team-battery">Energie: <span id="team-energy">92%</span></div>
            </div>
            <div class="lab-grid" id="bio-lab-container"></div>
        </div>

        <div id="vr" class="module-section">
            <div class="lab-header"><h2>Pro Training</h2></div>
            <div class="vr-preview-card">
                <div class="vr-info">
                    <h3>Meta Quest 3 Modus</h3>
                    <p>Ego-Perspektive: Du stehst auf dem Platz. Nutze den Trigger zum Passen.</p>
                    <button class="action-btn" onclick="vrCenter.launchVR()">VR-MODUS STARTEN</button>
                </div>
                <div id="vr-container" style="height: 400px; background: #000; border-radius: 10px; overflow: hidden;"></div>
            </div>
        </div>
    </div>

    <div class="toni-interface">
        <div class="chat-header"><div class="chat-status"></div><span>TONI (Live)</span></div>
        <div class="chat-messages" id="chat-history"></div>
        <div class="chat-input-area">
            <button id="voice-btn" onclick="toggleMic()">🎤</button>
            <input type="text" id="text-input" placeholder="Anweisung...">
        </div>
    </div>

    <script src="script.js"></script>
    <script src="modules/management.js"></script>
    <script src="modules/bio-lab.js"></script>
    <script src="modules/vr-center.js"></script>
</body>
</html>
