<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni 2.0 - Tactical Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --border: #334155;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
        }

        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-weight: 600; font-size: 1.8rem; margin: 0; letter-spacing: -1px; }
        .header span { color: var(--accent); font-weight: 600; }
        .header p { color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem; }

        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        input, select {
            width: 100%;
            padding: 0.85rem;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); outline: none; }

        .api-panel {
            background: rgba(15, 23, 42, 0.5);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            border: 1px solid var(--border);
        }

        .btn-start {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-start:active { transform: scale(0.98); }
        .btn-start:hover { opacity: 0.9; }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="header">
        <h1>TONI <span>2.0</span></h1>
        <p>Global Elite Taktik-Management</p>
    </div>

    <div class="form-group">
        <label for="trainerName">Trainer Name</label>
        <input type="text" id="trainerName" placeholder="z.B. Coach Björn">
    </div>

    <div class="form-group">
        <label for="teamPassword">Team-Passwort</label>
        <input type="password" id="teamPassword" placeholder="••••••••">
    </div>

    <div class="api-panel">
        <label for="activeModel">Primäres KI-Gehirn</label>
        <select id="activeModel">
            <option value="gemini">Gemini 1.5 Flash (Kostenlos)</option>
            <option value="groq">Groq / Llama 3 (High-Speed)</option>
            <option value="openai">OpenAI GPT-4o (Elite)</option>
        </select>

        <div style="margin-top: 1rem;">
            <label>API Key hinterlegen</label>
            <input type="password" id="currentApiKey" placeholder="Key für ausgewähltes Modell eingeben...">
        </div>
    </div>

    <button class="btn-start" onclick="initSystem()">System starten</button>

    <div class="footer-note">
        Architektur & Management: <strong>Björn</strong> | Co-Trainer: Toni
    </div>
</div>

<script>
    // Initialisierung & Speicherung
    window.onload = () => {
        document.getElementById('trainerName').value = localStorage.getItem('toni_trainer_name') || '';
        document.getElementById('activeModel').value = localStorage.getItem('toni_active_model') || 'gemini';
        loadKey();
    };

    document.getElementById('activeModel').onchange = loadKey;

    function loadKey() {
        const model = document.getElementById('activeModel').value;
        const key = localStorage.getItem('toni_key_' + model) || '';
        document.getElementById('currentApiKey').value = key;
    }

    function initSystem() {
        const name = document.getElementById('trainerName').value;
        const pass = document.getElementById('teamPassword').value;
        const model = document.getElementById('activeModel').value;
        const key = document.getElementById('currentApiKey').value;

        if (!name || !pass || !key) {
            alert("Manager, wir brauchen Namen, Passwort und API-Key für den Start!");
            return;
        }

        // Lokale Speicherung (BYOK Prinzip)
        localStorage.setItem('toni_trainer_name', name);
        localStorage.setItem('toni_team_pw', pass);
        localStorage.setItem('toni_active_model', model);
        localStorage.setItem('toni_key_' + model, key);

        // Weiterleitung zum Board
        window.location.href = 'app.html';
    }
</script>

</body>
</html>
