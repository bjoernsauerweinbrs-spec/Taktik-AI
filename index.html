<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Taktik‑AI — Interaktives Taktik‑Board</title>

  <meta name="description" content="Interaktives Taktik‑Board mit KI‑Unterstützung" />
  <meta name="theme-color" content="#0b1220" />

  <link rel="icon" type="image/svg+xml" href="data/favicon.svg" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/hologram.css" />
  <link rel="stylesheet" href="css/neon-orange.css" />
  <link rel="stylesheet" href="css/voice.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">Taktik‑AI</h1>
      <nav class="main-nav">
        <a href="#board">Board</a>
        <a href="#analysis">Analyse</a>
        <a href="#library">Bibliothek</a>
        <a href="#voice">Sprache</a>
      </nav>
    </div>
  </header>

  <main id="app" class="app-container">
    <section id="board" class="board-section">
      <div id="pitch" class="pitch"></div>
      <aside id="tools" class="tools-panel">
        <h2>Werkzeuge</h2>
        <div id="tool-list"></div>
      </aside>
    </section>

    <section id="analysis" class="analysis-section">
      <h2>Analyse</h2>
      <div id="analysis-center"></div>
    </section>

    <section id="library" class="library-section">
      <h2>Aktentasche</h2>
      <div id="aktentasche"></div>
    </section>

    <section id="voice" class="voice-section">
      <h2>Spracheingabe</h2>
      <div id="voice-status">Mikrofon: inaktiv</div>
      <button id="voice-toggle">Sprache aktivieren</button>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Taktik‑AI — Alle Rechte vorbehalten</small>
    </div>
  </footer>

  <noscript>
    <div class="no-js-warning">JavaScript ist deaktiviert. Die Anwendung benötigt JavaScript.</div>
  </noscript>

  <!-- Core scripts (jetzt in js/) -->
  <script defer src="js/app.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/main.js"></script>

  <!-- Engine modules (in js/engine/) -->
  <script defer src="js/engine/arena.js"></script>
  <script defer src="js/engine/dragdrop.js"></script>
  <script defer src="js/engine/players.js"></script>
  <script defer src="js/engine/sequencer.js"></script>
  <script defer src="js/engine/tools.js"></script>

  <!-- UI modules (in js/ui/) -->
  <script defer src="js/ui/aktentasche-ui.js"></script>
  <script defer src="js/ui/beratung-ui.js"></script>
  <script defer src="js/ui/analysis-center-ui.js"></script>

  <!-- Voice modules (in js/voice/) -->
  <script defer src="js/voice/voice-input.js"></script>
  <script defer src="js/voice/voice-commands.js"></script>

  <script>
    // Kleines Init
    document.getElementById('year').textContent = new Date().getFullYear();

    const voiceToggle = document.getElementById('voice-toggle');
    if (voiceToggle) {
      voiceToggle.addEventListener('click', () => {
        const status = document.getElementById('voice-status');
        const active = status.textContent.includes('aktiv');
        status.textContent = active ? 'Mikrofon: inaktiv' : 'Mikrofon: aktiv';
      });
    }
  </script>
</body>
</html>
