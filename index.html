<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - LOGIN</title>
    <style>
        body { background: #000; color: #39FF14; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { border: 2px solid #39FF14; padding: 40px; text-align: center; background: #050505; box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        input { background: #111; border: 1px solid #333; color: #39FF14; padding: 12px; margin: 10px 0; width: 200px; text-align: center; font-size: 1.2rem; }
        button { background: #39FF14; color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>TONI 2.0</h2>
        <input type="password" id="pass" placeholder="PASSWORT" autofocus>
        <br>
        <button onclick="login()">ENTER</button>
    </div>
    <script>
        function login() {
            if(document.getElementById('pass').value === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                window.location.href = 'app.html';
            } else { alert('Falsches Passwort!'); }
        }
        document.getElementById('pass').addEventListener('keypress', (e) => { if(e.key === 'Enter') login(); });
    </script>
</body>
</html>
