<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
<title>TITAN v8.6 | Gold Edition</title>
<style>
  :root {
    --bg: #010409; --panel: #0d1117; --neon: #39FF14; --neon-dim: rgba(57,255,20,0.15);
    --gold: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%);
    --accent-red: #f85149; --accent-blue: #58a6ff; --text: #e6edf3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }

  /* MOBILE-FIRST LAYOUT */
  .app-container { display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 10px; }
  
  /* RESPONSIVE GRID (Desktop fix) */
  @media (min-width: 1000px) {
    .app-container { display: grid; grid-template-columns: 280px 1fr 380px; grid-template-rows: 65px 1fr; }
    .header { grid-column: 1 / -1; }
  }

  .panel { background: var(--panel); border: 1px solid #30363d; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; overflow: hidden; }
  
  /* ARENA BOX - Fix für Screenshot 3 */
  #board-wrap { flex: 1; min-height: 300px; position: relative; background: #011a01; border-radius: 12px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }

  /* TYPOGRAFIE - Fix für Screenshot 2 */
  h1 { font-size: 20px; letter-spacing: 4px; color: var(--neon); text-align: center; }
  h3 { font-size: 14px; margin: 0; color: var(--neon); }
  .btn { background: #21262d; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .btn-primary { background: var(--neon); color: #000; border: none; }

  /* OVERLAYS */
  .overlay { position: fixed; inset: 0; background: rgba(1,4,9,0.95); z-index: 9999; display: flex; flex-direction: column; padding: 20px; backdrop-filter: blur(10px); }
  .scroll-content { flex: 1; overflow-y: auto; padding-top: 10px; }
  
  /* FIFA & LAB CARDS */
  .fifa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
  .fifa-card { height: 200px; background: var(--gold); border-radius: 10px 10px 40px 10px; padding: 10px; color: #2c2401; }
  .lab-card { background: var(--panel); border-left: 4px solid var(--neon); padding: 12px; margin-bottom: 10px; }
  .pulse { animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
</style>
</head>
<body>

<div id="login-screen" class="overlay">
  <h1>TITAN v8.6</h1>
  <div class="scroll-content" style="display:flex; flex-direction:column; justify-content:center; gap:20px;">
    <select id="user-select" class="btn" style="height:50px; font-size:16px;"></select>
    <button onclick="App.login()" class="btn btn-primary" style="height:50px;">SYSTEM INITIALISIEREN</button>
  </div>
</div>

<div id="main-app" class="app-container" style="display:none;">
  <header class="panel" style="flex-direction:row; justify-content:space-between; align-items:center;">
    <div id="coach-info" style="font-size:12px; font-weight:bold;">COACH BJÖRN</div>
    <div id="ai-status" style="font-size:10px; color:var(--neon);">● OLLAMA ONLINE</div>
  </header>

  <aside id="sidebar" class="panel">
    <button class="btn btn-primary" onclick="UIManager.openHub()">🏢 MANAGEMENT HUB</button>
    <div id="player-list" class="scroll-content"></div>
  </aside>

  <main id="arena" class="panel">
    <div id="board-wrap"><canvas id="main-canvas"></canvas></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
      <button class="btn" onclick="Arena.setFormation('match')">MATCH (3-4-3)</button>
      <button class="btn" onclick="Arena.setFormation('bank')">TRAINING</button>
    </div>
  </main>

  <aside id="chat-panel" class="panel">
    <div id="chat-box" class="scroll-content" style="font-size:12px;"></div>
    <div style="display:flex; gap:5px; margin-top:10px;">
      <input id="user-cmd" type="text" class="btn" style="flex:1; text-align:left;" placeholder="Befehl...">
      <button onclick="Toni.process()" class="btn btn-primary">➤</button>
    </div>
  </aside>
</div>

<div id="hub-overlay" class="overlay" style="display:none;">
  <div style="display:flex; justify-content:space-between;">
    <h3 id="hub-title">HUB</h3>
    <button onclick="UIManager.closeHub()" class="btn">✕</button>
  </div>
  <div id="hub-content" class="scroll-content"></div>
</div>

<script>
const App = {
  db: {
    squad: [],
    users: [{id:'admin', name:'Björn', role:'Coach'}],
    finances: { budget: 2500000 }
  },
  
  init() {
    const names = ['Müller','Silva','Schmidt','Schneider','Fischer','Weber','Meyer','Wagner'];
    names.forEach((n, i) => {
      this.db.squad.push({
        id: i, name: n, num: i+1, pos: 'FP',
        attr: { pac: 80+i, sho: 75+i, pas: 70+i, dri: 80, def: 50, phy: 70 },
        med: { readiness: 90-i, hr: 62+i, muscle: 38, fat: 11 },
        x: 50 + (i*40), y: 550
      });
    });
    const sel = document.getElementById('user-select');
    sel.innerHTML = this.db.users.map(u => `<option value="${u.id}">${u.name}</option>`);
  },

  login() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    Arena.init();
    Toni.speak("Titan v8.6 online. Taktikbereit.");
    UIManager.renderPlayerList();
  }
};

const Arena = {
  canvas: null, ctx: null, dpr: window.devicePixelRatio || 1,
  init() {
    this.canvas = document.getElementById('main-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.setup();
    window.addEventListener('resize', () => this.setup());
    this.render();
  },
  setup() {
    const container = this.canvas.parentElement;
    this.canvas.width = container.clientWidth * this.dpr;
    this.canvas.height = container.clientHeight * this.dpr;
    this.ctx.scale(this.dpr, this.dpr);
    this.render();
  },
  render() {
    const w = this.canvas.width / this.dpr, h = this.canvas.height / this.dpr;
    this.ctx.clearRect(0,0,w,h);
    this.ctx.strokeStyle = 'rgba(57,255,20,0.3)';
    this.ctx.strokeRect(10, 10, w-20, h-20);
    App.db.squad.forEach(p => {
      this.ctx.fillStyle = 'var(--neon)';
      this.ctx.beginPath(); this.ctx.arc(p.x, p.y, 15, 0, Math.PI*2); this.ctx.fill();
      this.ctx.fillStyle = '#fff'; this.ctx.font = '10px Arial';
      this.ctx.fillText(p.name, p.x - 15, p.y + 25);
    });
  },
  setFormation(mode) {
    if(mode === 'match') {
      App.db.squad.forEach((p,i) => { p.x = 50 + (i*30); p.y = 100 + (i*40); });
    } else {
      App.db.squad.forEach((p,i) => { p.x = 50 + (i*40); p.y = 250; });
    }
    this.render();
  }
};

const Toni = {
  speak(msg) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div style="margin-bottom:8px;"><b style="color:var(--neon);">TONI:</b> ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
  },
  async process() {
    const cmd = document.getElementById('user-cmd').value;
    if(!cmd) return;
    this.speak(`Suche im Web nach: ${cmd}...`);
    setTimeout(() => this.speak("Ergebnis: SV Asbach spielt oft über die Flügel."), 1000);
    document.getElementById('user-cmd').value = '';
  }
};

const UIManager = {
  openHub() {
    const hub = document.getElementById('hub-overlay');
    hub.style.display = 'flex';
    document.getElementById('hub-content').innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button class="btn" onclick="UIManager.renderKabine()">👕 KABINE</button>
        <button class="btn" onclick="UIManager.renderLabor()">🧪 LABOR</button>
      </div>
    `;
  },
  renderPlayerList() {
    const list = document.getElementById('player-list');
    list.innerHTML = App.db.squad.map(p => `
      <div class="lab-card" style="font-size:12px;">
        <b>${p.name}</b> - Readiness: ${p.med.readiness}%
      </div>
    `).join('');
  },
  renderLabor() {
    document.getElementById('hub-content').innerHTML = `
      <h3>BIO-MONITORING</h3>
      ${App.db.squad.map(p => `
        <div class="lab-card">
          <b>${p.name}</b> <span class="pulse">❤️</span> ${p.med.hr} BPM<br>
          <small>Muskel: ${p.med.muscle}kg | Fett: ${p.med.fat}%</small>
        </div>
      `).join('')}
    `;
  },
  renderKabine() {
    document.getElementById('hub-content').innerHTML = `
      <h3>TEAM-LOCKER</h3>
      <div class="fifa-grid">
        ${App.db.squad.map(p => `
          <div class="fifa-card">
            <div style="font-weight:900;">85</div>
            <div style="text-align:center; font-size:30px;">👤</div>
            <div style="text-align:center; font-weight:bold; font-size:12px;">${p.name.toUpperCase()}</div>
          </div>
        `).join('')}
      </div>
    `;
  },
  closeHub() { document.getElementById('hub-overlay').style.display = 'none'; }
};

App.init();
</script>
</body>
</html>
