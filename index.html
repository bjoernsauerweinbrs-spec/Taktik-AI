<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taktikboard - Team Björn</title>
    <style>
        body { margin: 0; font-family: Arial; background: #111; color: white; display: flex; flex-direction: column; height: 100vh; }
        #top { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid green; }
        #pitch-area { flex: 1; position: relative; background: #2d5a27; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #pitch { width: 95%; height: 90%; border: 2px solid white; position: relative; }
        .line { position: absolute; width: 100%; height: 2px; background: white; top: 50%; }
        .goal { position: absolute; width: 60px; height: 15px; border: 2px solid white; left: 50%; transform: translateX(-50%); }
        .player { width: 28px; height: 28px; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 2px solid white; cursor: pointer; z-index: 10; touch-action: none; }
        .red { background: red; } .blue { background: blue; }
        #ball { width: 14px; height: 14px; background: white; border-radius: 50%; border: 2px solid black; z-index: 20; top: 48%; left: 49%; transition: all 0.5s; }
        #chat { height: 200px; background: white; color: black; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        #input-box { display: flex; padding: 10px; background: #eee; gap: 5px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px; cursor: pointer; background: green; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="top">
    <button onclick="setField('11v11')">11v11</button>
    <button onclick="setField('funino')">Funino</button>
    <button onclick="setKey()" style="background:#444">🔑 Key</button>
</div>

<div id="pitch-area">
    <div id="pitch">
        <div class="line"></div>
        <div class="goal" style="top:0"></div><div class="goal" style="bottom:0"></div>
        <div id="ball" class="player"></div>
        <div id="players"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-box">
        <input type="text" id="msg" placeholder="Anweisung eingeben...">
        <button onclick="send()">Senden</button>
    </div>
</div>

<script>
    let myKey = localStorage.getItem('trainer_key') || "";
    const log = document.getElementById('log'), ball = document.getElementById('ball'), pLayer = document.getElementById('players');

    function setKey() { const k = prompt("API Key einfügen:"); if(k) { localStorage.setItem('trainer_key', k.trim()); location.reload(); } }
    function addLog(n, t) { log.innerHTML += `<div><b>${n}:</b> ${t}</div>`; log.scrollTop = log.scrollHeight; }

    function createP(t, l, c, n) {
        const p = document.createElement('div'); p.className = 'player ' + c;
        p.style.top = t + "%"; p.style.left = l + "%"; p.innerText = n;
        pLayer.appendChild(p); drag(p);
    }

    function setField(m) {
        pLayer.innerHTML = "";
        if(m === '11v11') { for(let i=0; i<11; i++) { createP(80, 10+i*8, 'red', i+1); createP(15, 10+i*8, 'blue', i+1); } }
        else { for(let i=0; i<3; i++) { createP(75, 20+i*30, 'red', i+1); createP(20, 20+i*30, 'blue', i+1); } }
    }

    async function send() {
        const val = document.getElementById('msg').value; if(!val || !myKey) return;
        addLog("Trainer", val); document.getElementById('msg').value = "";
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${myKey}`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ contents: [{ parts: [{ text: `Kurze Antwort. Befehl: [BALL:X:Y]. Frage: ${val}` }] }] })
            });
            const d = await r.json();
            const txt = d.candidates[0].content.parts[0].text; addLog("KI", txt);
            const bM = txt.match(/\[BALL:(\d+):(\d+)\]/); if(bM) { ball.style.left = bM[1]+"%"; ball.style.top = bM[2]+"%"; }
        } catch(e) { addLog("System", "Fehler: Key prüfen oder Google blockiert."); }
    }

    function drag(el) {
        let active = false;
        el.onmousedown = el.ontouchstart = (e) => { active = true; e.preventDefault(); };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!active) return;
            const r = document.getElementById('pitch').getBoundingClientRect();
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
            el.style.left = (x/r.width*100)-3 + "%"; el.style.top = (y/r.height*100)-3 + "%";
        };
        window.onmouseup = window.ontouchend = () => active = false;
    }

    drag(ball);
    setField('11v11');
</script>
</body>
</html>
