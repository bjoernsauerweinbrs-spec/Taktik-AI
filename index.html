<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - ACCESS CONTROL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { 
            background: #050505; 
            color: #39FF14; 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        .login-box { 
            border: 1px solid #39FF14; 
            padding: 50px; 
            background: rgba(0,0,0,0.9); 
            text-align: center; 
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); 
            border-radius: 5px; 
            transition: 0.5s;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }
        .login-box:hover {
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.4);
        }
        h2 { letter-spacing: 5px; margin-bottom: 30px; font-size: 1.5rem; }
        input { 
            background: #000; 
            border: 1px solid #39FF14; 
            color: #39FF14; 
            padding: 15px; 
            margin-bottom: 20px; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center; 
            font-size: 1.1rem; 
            outline: none; 
            font-family: 'Orbitron', sans-serif;
            border-radius: 3px;
        }
        button { 
            background: #39FF14; 
            color: #000; 
            border: none; 
            padding: 15px 30px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            letter-spacing: 2px; 
            transition: 0.3s; 
            font-family: 'Orbitron', sans-serif;
            border-radius: 3px;
        }
        button:hover { 
            background: #fff; 
            box-shadow: 0 0 20px #39FF14; 
        }

        /* VIDEO OVERLAY STYLES */
        #video-intro-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #intro-video-element {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Video füllt den ganzen Schirm */
        }
        .fade-out {
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        .system-status {
            margin-top: 25px;
            font-size: 0.6rem;
            color: rgba(57, 255, 20, 0.4);
            letter-spacing: 1px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="video-intro-overlay">
        <video id="intro-video-element" playsinline>
            <source src="intro.mp4" type="video/mp4">
            Ihr Browser unterstützt keine Videos.
        </video>
    </div>

    <div class="login-box" id="login-ui">
        <h2>IDENTIFICATION</h2>
        <input type="password" id="pass" placeholder="PASSWORD" autofocus>
        <br>
        <button onclick="check()">ENTRANCE</button>
        <div class="system-status">
            TONI 2.0 BIOMETRIC INTERFACE READY<br>
            <span style="font-size: 0.5rem; opacity: 0.5;">SENSORS ONLINE | VISION ENGINE ARMED</span>
        </div>
    </div>

    <script>
        function check() {
            const passInput = document.getElementById('pass').value;
            
            if(passInput === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                startIntro();
            } else {
                alert("ACCESS DENIED - AUTHORIZED PERSONNEL ONLY");
                document.getElementById('pass').value = '';
            }
        }

        function startIntro() {
            const loginUI = document.getElementById('login-ui');
            const overlay = document.getElementById('video-intro-overlay');
            const video = document.getElementById('intro-video-element');

            // 1. Login Box ausblenden
            loginUI.style.display = 'none';
            
            // 2. Video-Vorhang anzeigen und abspielen
            overlay.style.display = 'flex';
            
            // Kleiner Trick: Video stumm starten falls Browser meckert, 
            // oder Coach hat Sound direkt an.
            video.play().catch(e => {
                console.log("Autoplay blockiert, starte stumm...");
                video.muted = true;
                video.play();
            });

            // 3. Wenn Video endet -> Weiterleitung zur App
            video.onended = function() {
                overlay.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 1000); // 1 Sekunde Fade-Dauer vor dem URL-Wechsel
            };
        }

        document.getElementById('pass').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') check();
        });
    </script>
</body>
</html>
