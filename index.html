<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — High Professional AI</title>
    <link rel="stylesheet" href="css/toni-style.css">
    <link rel="stylesheet" href="css/hologram.css">
</head>
<body>

    <aside class="sidebar">
        <div class="nav-icon active" id="nav-board" onclick="switchMainView('board')">📊</div>
        <div class="nav-icon" id="nav-training" onclick="switchMainView('training')">📅</div>
        <div class="nav-icon" id="nav-global" onclick="switchMainView('global')">🌐</div>
        <div class="nav-icon" id="nav-briefcase" onclick="switchMainView('briefcase')">💼</div>
    </aside>

    <main id="stage">
        <div class="tools-overlay" id="board-tools">
            <button class="tool-btn" onclick="arena.setMode('standard')">Standard</button>
            <button class="tool-btn" onclick="arena.setMode('funinho')">Funinho</button>
            <button class="tool-btn" onclick="triggerToniAnalysis()" style="color:var(--data-cyan);">KI-Trend-Scan</button>
            <button class="tool-btn" onclick="AnalysisAI.fixDefenseLine()" style="color:#28C76F;">Korrektur</button>
        </div>

        <div id="module-board" class="module-container active">
            <canvas id="main-canvas"></canvas>
        </div>
        <div id="module-training" class="module-container"></div>
        <div id="module-briefcase" class="module-container"></div>
        <div id="module-global" class="module-container"></div>
    </main>

    <aside class="analysis-panel">
        <h2>Analysezentrum</h2>
        <div id="setcard-content">
            <p class="empty-state">Wähle ein Modul für tiefergehende Daten.</p>
        </div>
    </aside>

    <script src="engine/arena.js"></script>
    <script src="engine/analysis-ai.js"></script>
    <script src="ui/aktentasche-ui.js"></script>
    <script src="voice/voice-output.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            arena.init('main-canvas');
            if(window.Aktentasche) window.Aktentasche.init();
        });

        function switchMainView(module) {
            document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + module).classList.add('active');

            document.querySelectorAll('.module-container').forEach(el => el.classList.remove('active'));
            document.getElementById('module-' + module).classList.add('active');

            // Spezifischer Modul-Inhalt Trigger
            if (module === 'briefcase') window.Aktentasche.show();
            
            const tools = document.getElementById('board-tools');
            tools.style.display = (module === 'board') ? 'flex' : 'none';
        }

        function triggerToniAnalysis() {
            const report = AnalysisAI.scanBoard();
            if (window.toniSpeak) toniSpeak(report);
        }
    </script>
</body>
</html>
