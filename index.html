<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni - Trainer Zentrale V15</title>
    <style>
        :root { --pitch-green: #28a745; --line-white: rgba(255,255,255,0.8); --home-team: #ff0000; --away-team: #007bff; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .container { display: grid; grid-template-columns: 350px 1fr 300px; width: 100%; gap: 10px; padding: 10px; box-sizing: border-box; }

        /* Links: Chat */
        #chat-sidebar { background: #1e1e1e; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #333; }
        .header { background: #000; padding: 15px; text-align: center; font-weight: bold; border-bottom: 3px solid var(--pitch-green); }
        #chat-history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; max-width: 90%; line-height: 1.4; }
        .user { align-self: flex-end; background: #007bff; }
        .toni { align-self: flex-start; background: #333; }

        /* Mitte: Taktikboard */
        #pitch-area { background: #222; border-radius: 15px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #333; }
        .controls { padding: 10px; display: flex; gap: 10px; }
        #pitch { width: 95%; height: 80%; background: var(--pitch-green); border: 2px solid var(--line-white); position: relative; border-radius: 5px; }
        
        /* Linien & Tore */
        .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--line-white); }
        .center-circle { position: absolute; left: 50%; top: 50%; width: 100px; height: 100px; border: 2px solid var(--line-white); border-radius: 50%; transform: translate(-50%, -50%); }
        .goal { position: absolute; width: 10px; height: 60px; background: white; top: 50%; transform: translateY(-50%); border: 1px solid #333; }
        .goal-left { left: -5px; } .goal-right { right: -5px; }
        .funino-goal { width: 10px; height: 30px; background: yellow; position: absolute; }

        /* Spieler */
        .player { width: 22px; height: 22px; border: 2px solid white; border-radius: 50%; position: absolute; transition: all 1s ease-in-out; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; cursor: move; }
        .home { background: var(--home-team); }
        .away { background: var(--away-team); }

        /* Rechts: Weiße Tafel */
        #whiteboard { background: #fff; color: #333; border-radius: 15px; padding: 15px; border: 1px solid #ddd; display: flex; flex-direction: column; }
        #player-list { flex: 1; border: none; font-size: 1.1rem; background: transparent; resize: none; outline: none; line-height: 1.6; }

        /* Login */
        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid var(--pitch-green); }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>⚽ Trainer Zentrale</h2>
        <input type="text" id="username" placeholder="Name">
        <input type="password" id="password" placeholder="Passwort">
        <input type="text" id="user-key" placeholder="API-Key">
        <button onclick="startToni()">Zentrale starten</button>
    </div>
</div>

<div class="container">
    <div id="chat-sidebar">
        <div class="header">COACH TONI AI</div>
        <div id="chat-history"></div>
        <div style="padding:15px; background:#111; display:flex; gap:5px">
            <input type="text" id="user-input" style="flex:1; background:#222; color:white; border:1px solid #444; padding:8px; border-radius:5px;" placeholder="Frag Toni...">
            <button onclick="askToni()">FRAGEN</button>
        </div>
    </div>

    <div id="pitch-area">
        <div class="controls">
            <button onclick="setMode('11v11')">11 gegen 11</button>
            <button onclick="setMode('funino')" style="background:orange">FUNINO (3v3)</button>
        </div>
        <div id="pitch">
            <div id="field-markings">
                <div class="center-line"></div>
                <div class="center-circle"></div>
                <div id="goals-container"></div>
            </div>
            <div id="players-layer"></div>
        </div>
    </div>

    <div id="whiteboard">
        <h3 style="margin:0">📋 Kader & Spielernotizen</h3>
        <textarea id="player-list" placeholder="Nr. Name / Position..."></textarea>
    </div>
</div>

<script>
    let USER_KEY = "";
    let currentMode = "11v11";

    function startToni() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const key = document.getElementById('user-key').value.trim();

        if (user && pass === "Trainer2026" && key.startsWith("AIza")) {
            USER_KEY = key;
            document.getElementById('login-overlay').style.display = 'none';
            setMode('11v11');
            addMsg("toni", `Servus Björn! Ich bin bereit. Das Spielfeld ist aufgebaut. Frag mich nach einer Taktik, und ich zeige dir, wie wir verschieben!`);
            speak(`Servus Björn! Ich bin bereit.`);
        } else { alert("Daten prüfen!"); }
    }

    function setMode(mode) {
        currentMode = mode;
        const layer = document.getElementById('players-layer');
        const goals = document.getElementById('goals-container');
        layer.innerHTML = "";
        goals.innerHTML = "";

        if (mode === '11v11') {
            goals.innerHTML = '<div class="goal goal-left"></div><div class="goal goal-right"></div>';
            createPlayers(11, 'home');
            createPlayers(11, 'away');
        } else {
            // Funino: 4 Tore (gelb)
            goals.innerHTML = `
                <div class="funino-goal" style="top:20%; left:-5px"></div>
                <div class="funino-goal" style="top:70%; left:-5px"></div>
                <div class="funino-goal" style="top:20%; right:-5px"></div>
                <div class="funino-goal" style="top:70%; right:-5px"></div>`;
            createPlayers(3, 'home');
            createPlayers(3, 'away');
        }
    }

    function createPlayers(count, team) {
        const layer = document.getElementById('players-layer');
        for (let i = 1; i <= count; i++) {
            const p = document.createElement('div');
            p.className = `player ${team}`;
            p.id = team + i;
            p.innerText = i;
            // Startpositionen
            p.style.left = (team === 'home' ? 10 : 80) + "%";
            p.style.top = (10 + (i * 7)) + "%";
            layer.appendChild(p);
        }
    }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'de-DE';
        msg.pitch = 1;
        msg.rate = 1;
        window.speechSynthesis.speak(msg);
    }

    async function askToni() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addMsg("user", text);
        input.value = "";

        // Toni erhält die Anweisung, Koordinaten zu senden
        const prompt = `Du bist Toni. Erkläre kurz die Taktik. WICHTIG: Wenn du Spieler verschieben willst, schreibe am Ende deiner Antwort exakt dieses Format: MOVE[ID,X,Y] wobei ID z.B. home1 oder away2 ist, und X/Y Werte von 0-95 sind. Frage: ${text}`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${USER_KEY}`;
        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            if (data.candidates) {
                let answer = data.candidates[0].content.parts[0].text;
                
                // Befehle filtern und ausführen
                const moveRegex = /MOVE\[(\w+),(\d+),(\d+)\]/g;
                let cleanAnswer = answer.replace(moveRegex, "");
                
                addMsg("toni", cleanAnswer);
                speak(cleanAnswer);

                let match;
                while ((match = moveRegex.exec(answer)) !== null) {
                    const id = match[1];
                    const x = match[2];
                    const y = match[3];
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.left = x + "%";
                        el.style.top = y + "%";
                    }
                }
            }
        } catch (e) { addMsg("toni", "Verbindungsfehler!"); }
    }

    function addMsg(role, text) {
        const history = document.getElementById('chat-history');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }
</script>

</body>
</html>
