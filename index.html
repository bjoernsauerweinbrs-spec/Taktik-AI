<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Intelligence Board - Björn Edition</title>
    <style>
        :root { --pitch: #2d5a27; --stripe: #254d21; --line: rgba(255,255,255,0.7); }
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; color: #fff; }
        
        #api-bar { background: #111; padding: 6px; text-align: center; font-size: 11px; border-bottom: 1px solid #333; cursor: pointer; }
        #nav { background: #1a1a1a; padding: 10px; display: flex; justify-content: center; gap: 8px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        .btn:hover { background: #00ff88; color: #000; }

        #pitch-wrapper { flex: 2; position: relative; display: flex; justify-content: center; align-items: center; padding: 10px; background: #000; }
        #pitch { 
            width: 100%; height: 100%; max-width: 1100px; background: var(--pitch); border: 3px solid #fff; position: relative;
            background-image: repeating-linear-gradient(0deg, var(--pitch), var(--pitch) 10%, var(--stripe) 10%, var(--stripe) 20%);
        }
        
        /* Feld-Markierungen */
        .mid-line { position: absolute; width: 100%; height: 2px; background: var(--line); top: 50%; left: 0; pointer-events: none; }
        .center-circle { width: 100px; height: 100px; border: 2px solid var(--line); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.2); z-index: 5; }
        .goal-std { width: 90px; height: 25px; left: 50%; transform: translateX(-50%); }
        .goal-fun { width: 50px; height: 18px; }

        .player { 
            width: 32px; height: 32px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 12px; cursor: grab; z-index: 50;
            border: 2px solid #fff; transition: all 1s cubic-bezier(0.19, 1, 0.22, 1); touch-action: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .red { background: linear-gradient(135deg, #b71c1c, #7f0000); color: white; }
        .blue { background: linear-gradient(135deg, #0d47a1, #002171); color: white; }
        .ball { width: 18px; height: 18px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; transition: all 0.7s ease-in-out; box-shadow: 0 0 10px #fff; }

        #chat { height: 35%; background: #fff; color: #000; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; background: #f9f9f9; }
        .msg { margin-bottom: 8px; padding: 10px; border-radius: 6px; border-left: 5px solid transparent; }
        .ai { background: #f0f0f0; border-left-color: #2e7d32; font-style: italic; }
        .user { background: #e3f2fd; border-right: 5px solid #1565c0; text-align: right; border-left: none; }

        #input-row { padding: 10px; background: #eee; display: flex; gap: 10px; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        .send-btn { background: #2e7d32; color: white; border: none; padding: 0 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body onclick="initAudio()">

<div id="api-bar" onclick="askKey()">
    <span id="api-status" style="color: #ff5252;">KI Inaktiv (Key prüfen)</span> | 
    <span style="color: #00ff88;">[ Hier klicken zum Key-Eingeben ]</span>
</div>

<div id="nav">
    <button class="btn" onclick="setMode('funino')">Funino</button>
    <button class="btn" onclick="setMode('11v11')">11v11 Match</button>
    <button class="btn" onclick="resetBall()">Ball Mitte</button>
</div>

<div id="pitch-wrapper">
    <div id="pitch">
        <div class="mid-line"></div>
        <div class="center-circle"></div>
        <div id="ball" class="player ball" style="top: 48.5%; left: 49.2%;"></div>
        <div id="p-layer"></div>
    </div>
</div>

<div id="chat">
    <div id="log"></div>
    <div id="input-row">
        <input type="text" id="user-in" placeholder="Frage oder Übung an den Co-Trainer...">
        <button class="send-btn" onclick="talk()">➤</button>
    </div>
</div>

<script>
    const layer = document.getElementById('p-layer');
    const log = document.getElementById('log');
    const input = document.getElementById('user-in');
    const ball = document.getElementById('ball');

    let voice = null;
    let myKey = localStorage.getItem('bjorn_key') ? localStorage.getItem('bjorn_key').trim() : "";

    function askKey() {
        const k = prompt("Bitte den Google API-Key einfügen:");
        if(k && k.trim().length > 10) {
            localStorage.setItem('bjorn_key', k.trim());
            location.reload();
        }
    }

    if(myKey) {
        document.getElementById('api-status').innerText = "KI-Power: Aktiviert";
        document.getElementById('api-status').style.color = "#00ff88";
    }

    function initAudio() {
        if(voice) return;
        const vs = window.speechSynthesis.getVoices();
        voice = vs.find(v => v.lang.startsWith('de') && (v.name.includes('Stefan') || v.name.includes('Markus'))) || vs[0];
    }

    function addLog(who, t, isAi) {
        const d = document.createElement('div');
        d.className = 'msg ' + (isAi ? 'ai' : 'user');
        d.innerHTML = `<b>${who}:</b> ${t}`;
        log.appendChild(d); log.scrollTop = log.scrollHeight;
        if(isAi && window.speechSynthesis) {
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(t.replace(/\[.*?\]/g, ''));
            if(voice) m.voice = voice;
            m.pitch = 0.8; m.rate = 0.95;
            window.speechSynthesis.speak(m);
        }
    }

    function createP(t, l, c, n) {
        const p = document.createElement('div');
        p.className = `player ${c}`;
        p.style.top = t + "%"; p.style.left = l + "%";
        p.innerText = n;
        layer.appendChild(p);
    }

    function addGoal(t, l, type) {
        const g = document.createElement('div');
        g.className = 'goal ' + type;
        g.style.top = t + "%"; g.style.left = l + "%";
        document.getElementById('pitch').appendChild(g);
    }

    function setMode(m) {
        layer.innerHTML = "";
        document.querySelectorAll('.goal').forEach(g => g.remove());
        if(m === 'funino') {
            addGoal(0, 20, 'goal-fun'); addGoal(0, 75, 'goal-fun');
            addGoal(97, 20, 'goal-fun'); addGoal(97, 75, 'goal-fun');
            for(let i=0; i<3; i++) { createP(75, 25+i*25, 'red', i+1); createP(20, 25+i*25, 'blue', i+1); }
            addLog("Co-Trainer", "Funino-Modus: 3 gegen 3 auf 4 Minitore.", true);
        } else {
            // Tore zentriert
            addGoal(0, 50, 'goal-std'); 
            addGoal(97, 50, 'goal-std');
            const redTeam = [{t:88,l:48},{t:75,l:15},{t:78,l:35},{t:78,l:62},{t:75,l:82},{t:58,l:20},{t:62,l:40},{t:62,l:58},{t:58
