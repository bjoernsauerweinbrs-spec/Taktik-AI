<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — High-Class Edition</title>
    <link rel="stylesheet" href="css/toni-style.css">
</head>
<body>

    <aside class="sidebar-minimal">
        <div class="main-briefcase-btn" onclick="toggleBriefcase()">
            <div style="font-size:35px;">💼</div>
            <span style="font-size:10px; font-weight:bold; letter-spacing:1px; margin-top:5px;">ZENTRALE</span>
        </div>
    </aside>

    <main id="stage">
        <div class="tools-overlay">
            <button class="tool-btn" onclick="arena.setMode('standard')">STANDARD-MODE</button>
            <button class="tool-btn" onclick="arena.setMode('funinho')">FUNINHO-MODE</button>
        </div>
        
        <canvas id="main-canvas"></canvas>
        
        <div id="hologram-ui" title="Toni Voice-System"></div>
    </main>

    <aside class="analysis-panel" id="side-analysis">
        <h2 style="color: var(--data-cyan); font-size: 14px; letter-spacing: 2px; border-bottom: 1px solid rgba(0,209,255,0.1); padding-bottom:15px;">ANALYSEZENTRUM</h2>
        <div id="setcard-content" style="margin-top: 25px;">
            <p style="color: #667085; font-style: italic; font-size: 13px; text-align:center;">Spieler auf dem Feld berühren...</p>
        </div>
    </aside>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <button onclick="toggleBriefcase()" style="position:absolute; top:40px; right:40px; background:none; border:none; color:white; font-size:35px; cursor:pointer;">✕</button>
        <h1 style="color: var(--accent-orange); letter-spacing: 8px;">ZENTRALE AKTENTASCHE</h1>
        <p style="color: #667085; margin-top: 10px;">TACTICAL OS V2.0 // BJÖRN</p>

        <div class="folder-grid" id="main-folders">
            <div class="folder-item" onclick="openSub('sport')">
                <div style="font-size:55px;">👟</div>
                <h3 style="margin-top:15px;">Sporttasche</h3>
                <span style="font-size:11px; color:var(--data-cyan);">KADER & DRILLS</span>
            </div>
            <div class="folder-item" onclick="openSub('medical')">
                <div style="font-size:55px;">⌚</div>
                <h3 style="margin-top:15px;">Medical Hub</h3>
                <span style="font-size:11px; color:var(--data-cyan);">BIO & ERNÄHRUNG</span>
            </div>
            <div class="folder-item" onclick="openSub('orga')">
                <div style="font-size:55px;">🏢</div>
                <h3 style="margin-top:15px;">Geschäftszimmer</h3>
                <span style="font-size:11px; color:var(--data-cyan);">SPONSOR & MEDIA</span>
            </div>
            <div class="folder-item">
                <div style="font-size:55px;">📊</div>
                <h3 style="margin-top:15px;">Analyse</h3>
                <span style="font-size:11px; color:var(--data-cyan);">KI-REPORTS</span>
            </div>
        </div>

        <div id="sub-view" class="hidden" style="width:100%; max-width:850px; margin-top:50px;">
            <button onclick="closeSub()" style="color: var(--data-cyan); cursor:pointer; background:none; border:none; margin-bottom:30px; font-weight:bold;">← ZURÜCK</button>
            <div id="sub-content"></div>
        </div>
    </div>

    <script src="engine/arena.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script>
        function toggleBriefcase() { document.getElementById('briefcase-overlay').classList.toggle('hidden'); }
        function openSub(type) {
            document.getElementById('main-folders').classList.add('hidden');
            document.getElementById('sub-view').classList.remove('hidden');
            if(type === 'sport') window.BriefcaseUI.renderSport();
            if(type === 'medical') window.BriefcaseUI.renderMedical();
            if(type === 'orga') window.BriefcaseUI.renderOrga();
        }
        function closeSub() {
            document.getElementById('main-folders').classList.remove('hidden');
            document.getElementById('sub-view').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => { 
            arena.init('main-canvas'); 
            // Demo-Kader Init
            arena.players = [
                { id: 1, name: "David Luiz", number: 4, rating: 8, hr: 65, sleep: "7.5h", status: "Bereit", pos: "IV", x: 250, y: 350, team: 'home' },
                { id: 2, name: "Max Miller", number: 10, rating: 6, hr: 72, sleep: "5.0h", status: "Müde", pos: "OM", x: 450, y: 300, team: 'home' }
            ];
        });
    </script>
</body>
</html>
