<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - High Professional</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>

    <aside class="sidebar">
        <div class="nav-icon active" title="Analyse">📊</div>
        <div class="nav-icon" title="Kader">👥</div>
        <div class="nav-icon" title="Aktentasche">💼</div>
    </aside>

    <main id="stage">
        <canvas id="main-canvas"></canvas>
    </main>

    <aside class="analysis-panel" id="analysis-sidebar">
        <h2>Analysezentrum</h2>
        <hr style="border: 0; border-top: 1px solid rgba(0,209,255,0.2); margin: 15px 0;">
        <div id="setcard-placeholder">
            <p style="color: #666;">Wähle einen Spieler für die Setcard-Details...</p>
        </div>
    </aside>

    <script src="js/storage.js"></script>
    <script src="engine/arena.js"></script>
    <script src="engine/players.js"></script>
    <script src="engine/dragdrop.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialisierung mit Fehlerprüfung
            const isOk = arena.init('main-canvas');
            
            if (isOk) {
                // Testdaten
                arena.players = [
                    { name: "Max", number: 10, x: 200, y: 150 },
                    { name: "Tim", number: 9, x: 300, y: 250 }
                ];
                
                if (typeof initDragDrop === 'function') initDragDrop();
                arena.render();
            }
        });
    </script>
</body>
</html>
