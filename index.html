<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - ACCESS CONTROL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { 
            background: #050505; 
            color: #39FF14; 
            font-family: 'Orbitron', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        .login-box { 
            border: 1px solid #39FF14; 
            padding: 50px; 
            background: rgba(0,0,0,0.9); 
            text-align: center; 
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2); 
            border-radius: 5px; 
            transition: 0.5s;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }
        h2 { letter-spacing: 5px; margin-bottom: 30px; font-size: 1.5rem; }
        input { 
            background: #000; border: 1px solid #39FF14; color: #39FF14; 
            padding: 15px; margin-bottom: 20px; width: 100%; box-sizing: border-box;
            text-align: center; font-size: 1.1rem; outline: none; 
            font-family: 'Orbitron', sans-serif; border-radius: 3px;
        }
        button { 
            background: #39FF14; color: #000; border: none; padding: 15px 30px; 
            font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 2px; 
            transition: 0.3s; font-family: 'Orbitron', sans-serif; border-radius: 3px;
        }
        button:hover { background: #fff; box-shadow: 0 0 20px #39FF14; }

        /* VIDEO OVERLAY */
        #video-intro-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999;
            justify-content: center; align-items: center;
        }
        #intro-video-element { width: 100%; height: 100%; object-fit: cover; }
        .fade-out { opacity: 0; transition: opacity 1.5s ease-in-out; pointer-events: none; }

        .system-status {
            margin-top: 25px; font-size: 0.6rem; color: rgba(57, 255, 20, 0.4);
            letter-spacing: 1px; line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="video-intro-overlay">
        <video id="intro-video-element" playsinline webkit-playsinline preload="auto">
            <source src="Gemini_generated_video_DF1C8BC8.mp4" type="video/mp4">
            TONI 2.0 INITIALISIERUNG...
        </video>
    </div>

    <div class="login-box" id="login-ui">
        <h2>IDENTIFICATION</h2>
        <input type="password" id="pass" placeholder="PASSWORD" autofocus>
        <br>
        <button onclick="check()">ENTRANCE</button>
        <div class="system-status">
            TONI 2.0 BIOMETRIC INTERFACE READY<br>
            <span style="font-size: 0.5rem; opacity: 0.5;">SENSORS ONLINE | VISION ENGINE ARMED</span>
        </div>
    </div>

    <script>
        function check() {
            const val = document.getElementById('pass').value;
            if(val === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                startIntro();
            } else {
                alert("ACCESS DENIED");
                document.getElementById('pass').value = '';
            }
        }

        function startIntro() {
            const loginUI = document.getElementById('login-ui');
            const overlay = document.getElementById('video-intro-overlay');
            const video = document.getElementById('intro-video-element');

            loginUI.style.display = 'none';
            overlay.style.display = 'flex';
            
            // Video-Setup für Ton (aktiviert durch Klick)
            video.muted = false; 
            video.volume = 1.0;
            video.load(); 

            // Safety-Timer auf 12 Sek erhöht für besseres Buffering
            const safetyLeash = setTimeout(() => {
                window.location.href = 'app.html';
            }, 12000);

            // Play-Versuch
            video.play().then(() => {
                console.log("Video gestartet.");
            }).catch(e => {
                console.warn("Audio-Autoplay blockiert, versuche Muted-Start...");
                video.muted = true;
                video.play().catch(() => {
                    clearTimeout(safetyLeash);
                    window.location.href = 'app.html';
                });
            });

            video.onended = function() {
                clearTimeout(safetyLeash);
                overlay.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = 'app.html';
                }, 1000);
            };
        }

        document.getElementById('pass').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') check(); 
        });
    </script>
</body>
</html>
