<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni 2.0 - Elite Login</title>
    <style>
        body { 
            background: #0d1117; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: #161b22; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 350px;
        }
        h2 { color: #2ecc71; margin-bottom: 20px; font-weight: 900; letter-spacing: 1px; }
        input { 
            background: #0d1117; 
            border: 1px solid #30363d; 
            color: white; 
            padding: 15px; 
            border-radius: 6px; 
            width: 100%; 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 18px; 
            outline: none;
        }
        input:focus { border-color: #2ecc71; }
        button { 
            background: #238636; 
            border: none; 
            color: white; 
            padding: 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ELITE CONTROL</h2>
        <p style="color: #8b949e; margin-bottom: 20px;">Systemzugriff erforderlich</p>
        <input type="password" id="pw" placeholder="Passwort eingeben" onkeypress="handleKey(event)">
        <button onclick="login()">ZUGRIFF BESTÄTIGEN</button>
    </div>

    <script>
        // Verhindert das Umgehen durch direkten URL-Aufruf (wird in app.html geprüft)
        function login() {
            const pass = document.getElementById('pw').value;
            if(pass === 'Toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                window.location.href = 'app.html';
            } else {
                alert('Zugriff verweigert. Falsches Passwort.');
            }
        }

        function handleKey(e) {
            if(e.key === 'Enter') login();
        }
    </script>
</body>
</html>
