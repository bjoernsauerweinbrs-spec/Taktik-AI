<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - LOGIN</title>
    <style>
        body { background: #000; color: #39FF14; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { border: 2px solid #39FF14; padding: 40px; background: #050505; text-align: center; }
        input { background: #111; border: 1px solid #333; color: #39FF14; padding: 12px; margin: 10px 0; width: 220px; text-align: center; font-size: 1.2rem; }
        button { background: #39FF14; color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>TONI 2.0 ACCESS</h2>
        <input type="password" id="pass" placeholder="PASSWORT" autofocus>
        <button onclick="check()">ENTRANCE</button>
    </div>
    <script>
        function check() {
            if(document.getElementById('pass').value === 'toni2026') {
                sessionStorage.setItem('toni_auth', 'true');
                window.location.href = 'app.html';
            }
        }
    </script>
</body>
</html>
