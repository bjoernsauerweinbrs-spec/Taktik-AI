<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | VR ELITE STADIUM</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden; background: #000;">

    <a-scene renderer="antialias: true; colorManagement: true;" vr-mode-ui="enabled: true">
         
        <a-assets>
            <img id="grass" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/terrain/grasslight-big.jpg">
        </a-assets>

        <a-sky color="#050a14"></a-sky>
        <a-entity light="type: ambient; intensity: 0.4"></a-entity>
        <a-entity light="type: directional; intensity: 0.8; position: -10 20 10; castShadow: true"></a-entity>

        <a-entity id="pitch-complex">
            <a-plane position="0 0 0" rotation="-90 0 0" width="68" height="105" src="#grass" repeat="10 15"></a-plane>
            
            <a-plane position="0 0.01 0" rotation="-90 0 0" width="68.2" height="105.2" color="white" material="side: back"></a-plane>
            
            <a-plane position="0 0.02 0" rotation="-90 0 0" width="68" height="0.2" color="white"></a-plane>
            <a-ring color="white" radius-inner="9.1" radius-outer="9.3" rotation="-90 0 0" position="0 0.03 0"></a-ring>
            
            <a-entity position="0 0.02 -52.5">
                <a-plane position="0 0 11" rotation="-90 0 0" width="40" height="0.2" color="white"></a-plane>
                <a-plane position="-20 0 5.5" rotation="-90 0 0" width="0.2" height="11" color="white"></a-plane>
                <a-plane position="20 0 5.5" rotation="-90 0 0" width="0.2" height="11" color="white"></a-plane>
            </a-entity>

            <a-entity position="0 0 -52.5">
                <a-box position="-3.66 1.22 0" width="0.2" height="2.44" depth="0.2" color="white"></a-box>
                <a-box position="3.66 1.22 0" width="0.2" height="2.44" depth="0.2" color="white"></a-box>
                <a-box position="0 2.44 0" width="7.52" height="0.2" depth="0.2" color="white"></a-box>
                <a-box position="0 1.22 -2" width="7.32" height="2.44" depth="0.1" color="white" opacity="0.2"></a-box> </a-entity>
            <a-entity position="0 0 52.5">
                <a-box position="-3.66 1.22 0" width="0.2" height="2.44" depth="0.2" color="white"></a-box>
                <a-box position="3.66 1.22 0" width="0.2" height="2.44" depth="0.2" color="white"></a-box>
                <a-box position="0 2.44 0" width="7.52" height="0.2" depth="0.2" color="white"></a-box>
            </a-entity>
        </a-entity>

        <a-entity id="player-assets">
            <a-entity id="player-red-1" position="-10 0 15" rotation="0 0 0">
                <a-box position="0 0.9 0" width="0.6" height="1.2" depth="0.3" color="#ef4444"></a-box> <a-sphere position="0 1.7 0" radius="0.25" color="#ffccaa"></a-sphere> <a-box position="0 1.7 0.2" width="0.1" height="0.1" depth="0.2" color="black"></a-box> <a-text value="4" position="0 1.2 0.16" align="center" width="3" color="white"></a-text>
            </a-entity>

            <a-entity id="player-blue-1" position="5 0 -10" rotation="0 180 0">
                <a-box position="0 0.9 0" width="0.6" height="1.2" depth="0.3" color="#3b82f6"></a-box>
                <a-sphere position="0 1.7 0" radius="0.25" color="#ffccaa"></a-sphere>
                <a-box position="0 1.7 0.2" width="0.1" height="0.1" depth="0.2" color="black"></a-box>
                <a-text value="9" position="0 1.2 0.16" align="center" width="3" color="white"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="toni-coach" position="36 0 0">
            <a-box position="0 0.9 0" width="0.7" height="1.8" depth="0.4" color="#22c55e"></a-box>
            <a-sphere position="0 2 0" radius="0.3" color="#ffccaa"></a-sphere>
            <a-text value="COACH TONI" position="0 2.6 0" align="center" width="6" side="double"></a-text>
        </a-entity>

        <a-entity id="rig" movement-controls="speed: 0.3" position="0 0 30">
            <a-camera position="0 1.7 0" look-controls>
                <a-cursor color="#22c55e"></a-cursor>
            </a-camera>
            <a-entity oculus-touch-controls="hand: left"></a-entity>
            <a-entity oculus-touch-controls="hand: right"></a-entity>
        </a-entity>

    </a-scene>

    <script src="script.js"></script>
</body>
</html>
