<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | ELITE VR & MANAGEMENT</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">TONI 2.0</div>
        
        <nav class="nav-section">
            <p class="nav-label">TRAINER BEREICH</p>
            <button class="nav-btn active" onclick="showModule('vr-center')"><i>🥽</i> VR Training</button>
            <button class="nav-btn" onclick="showModule('locker-room')"><i>👤</i> Kabine (Medical)</button>
        </nav>

        <nav class="nav-section">
            <p class="nav-label">MANAGER BEREICH</p>
            <button class="nav-btn" onclick="showModule('mgmt-lab')"><i>💼</i> Finanz-Labor</button>
            <button class="nav-btn" onclick="showModule('press-center')"><i>🗞️</i> Redaktion</button>
        </nav>

        <div class="sidebar-footer">
            <div class="vr-status">META QUEST: CONNECTED</div>
            <button class="mic-btn" onclick="voiceEngine.toggle()">🎤 KI ANALYSE</button>
        </div>
    </aside>

    <main class="main-content">
        
        <section id="vr-center" class="module active">
            <div class="module-header">
                <h2>VR Analysezentrum</h2>
                <div class="training-selector">
                    <button onclick="trainingEngine.startLevel(1)">Lvl 1: Scanning</button>
                    <button onclick="trainingEngine.startLevel(2)">Lvl 2: Gap Finder</button>
                    <button onclick="trainingEngine.startLevel(3)">Lvl 3: Pressure</button>
                </div>
            </div>

            <div class="vr-container">
                <a-scene embedded vr-mode-ui="enabled: true">
                    <a-sky color="#020617"></a-sky>
                    <a-plane position="0 0 0" rotation="-90 0 0" width="68" height="105" color="#14532d"></a-plane>
                    
                    <a-entity id="training-assets"></a-entity>
                    <a-entity id="analysis-grid"></a-entity>

                    <a-entity id="toni-avatar" position="36 0 0">
                        <a-cylinder color="#22c55e" height="1.8" radius="0.4"></a-cylinder>
                        <a-text id="toni-msg" value="BEREIT, COACH?" position="0 2.2 0" align="center" width="5"></a-text>
                    </a-entity>

                    <a-entity id="rig" movement-controls="speed: 0.3" position="0 0 10">
                        <a-camera position="0 1.7 0" look-controls>
                            <a-cursor color="#22c55e"></a-cursor>
                            <a-text id="vr-timer" value="" position="0 0.6 -1" align="center" width="2" color="red"></a-text>
                        </a-camera>
                    </a-entity>
                </a-scene>
            </div>
        </section>

        <section id="locker-room" class="module">
            <h2>Mannschaftskabine // ACWR Check</h2>
            <div class="card-grid" id="player-container"></div>
        </section>

        <section id="mgmt-lab" class="module">
            <h2>Executive Management Labor</h2>
            <div id="mgmt-dashboard"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
