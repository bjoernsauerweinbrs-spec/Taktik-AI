<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - Authentifizierung</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .login-box { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid var(--neon-green); 
            padding: 40px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.1);
            width: 350px;
        }
        .login-logo { font-size: 3rem; color: var(--neon-green); margin-bottom: 20px; }
        h2 { color: #fff; letter-spacing: 3px; font-size: 1.2rem; margin-bottom: 30px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: var(--neon-green);
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--neon-green);
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .login-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--neon-green); }
        .error-msg { color: #ff3030; font-size: 0.8rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo"><i class="fas fa-shield-halved"></i></div>
        <h2>TONI 2.0 ACCESS</h2>
        <input type="password" id="pass-input" placeholder="PASSWORT EINGEBEN">
        <button class="login-btn" onclick="checkAuth()">LOGIN</button>
        <div id="error" class="error-msg">ZUGRIFF VERWEIGERT: UNGÜLTIGER CODE</div>
    </div>

    <script>
        function checkAuth() {
            const pass = document.getElementById('pass-input').value;
            // Hier dein gewünschtes Passwort setzen (z.B. 'brasil')
            if (pass === 'toni20') {
                sessionStorage.setItem('toni_auth', 'true');
                window.location.href = 'app.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
        // Enter-Taste unterstützen
        document.getElementById('pass-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAuth();
        });
    </script>
</body>
</html>
