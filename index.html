<!DOCTYPE html>
<html lang="de">
<head>
    <!-- I. Metadaten & Konfiguration -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="TITAN v10 ELITE - Das kostenlose All-in-One Betriebssystem für den modernen Fußball.">
    <title>TITAN v10 ELITE</title>

    <!-- HINWEIS: CSS (Teil 2) und JavaScript (Teil 3) werden später hier eingebunden -->

</head>
<body>

    <!-- ======================================================================= -->
    <!-- II. System-Overlays (Initialisierung, Login, Ladebildschirme)          -->
    <!-- ======================================================================= -->

    <!-- Lade-Spinner für den App-Start -->
    <div id="system-loader" class="system-overlay">
        <!-- Spinner-Grafik wird via CSS hinzugefügt -->
    </div>

    <!-- Login-Maske zur Profilauswahl -->
    <div id="login-screen" class="system-overlay">
        <div class="login-box">
            <h1>TITAN v10 ELITE</h1>
            <p>Wähle dein Vereinsprofil zum Laden.</p>
            <form id="login-form">
                <select id="profile-selector" name="profile"></select>
                <button type="submit">System Starten</button>
            </form>
        </div>
    </div>

    <!-- Ein universeller Backdrop für mobile Overlays -->
    <div id="mobile-backdrop" class="system-overlay" hidden></div>

    <!-- ======================================================================= -->
    <!-- III. Die Hauptanwendung (Nach erfolgreichem Login)                     -->
    <!-- ======================================================================= -->

    <div id="main-app" class="app-container" hidden>

        <!-- ------------------------------------------------------------------- -->
        <!-- A. Der App-Header: Globale Steuerung & Nutzerprofil                 -->
        <!-- ------------------------------------------------------------------- -->
        <header class="app-header">
            <div class="header-left">
                <button id="toggle-left-panel-btn" class="mobile-nav-btn">☰</button>
                <div id="user-profile">
                    <div id="user-avatar"></div>
                    <div class="user-details">
                        <span id="user-name"></span>
                        <span id="user-role"></span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div id="desktop-controls">
                    <button id="live-session-btn" title="Live-Session mit Toni AI starten">🎙️</button>
                </div>
                <button id="toggle-right-panel-btn" class="mobile-nav-btn">💬</button>
            </div>
        </header>

        <!-- ------------------------------------------------------------------- -->
        <!-- B. Linke Seitenleiste: Hauptnavigation für den Trainer             -->
        <!-- ------------------------------------------------------------------- -->
        <aside id="left-panel">
            <div class="panel-content">
                <!-- Squad List (wird dynamisch geladen) -->
                <div id="squad-list-container">
                    <h2>Mannschaft</h2>
                    <div id="squad-list"></div>
                </div>
                <!-- Haupt-Module -->
                <nav class="main-navigation">
                    <h2>Module</h2>
                    <button data-action="open-clipboard">📋 Tactical Clipboard</button>
                    <button data-action="open-manager-cockpit">💼 Manager Cockpit</button>
                    <button data-action="open-player-portal">👤 Player Portal</button>
                </nav>
            </div>
            <footer class="panel-footer">
                <button data-action="logout">Logout</button>
            </footer>
        </aside>

        <!-- ------------------------------------------------------------------- -->
        <!-- C. Der Hauptbereich: Das Taktikboard & die Arena                   -->
        <!-- ------------------------------------------------------------------- -->
        <main id="main-arena">
            <div id="board-wrap">
                <canvas id="main-canvas"></canvas>
            </div>
            <div id="arena-controls">
                <button data-tool="select" class="tool-btn active">🖐️</button>
                <button data-tool="arrow" class="tool-btn">➔</button>
                <button data-tool="line" class="tool-btn">―</button>
                <button data-tool="zone" class="tool-btn">▭</button>
                <button data-tool="clear" class="tool-btn">🗑️</button>
            </div>
        </main>

        <!-- ------------------------------------------------------------------- -->
        <!-- D. Rechte Seitenleiste: Die Toni AI Chat-Konsole                   -->
        <!-- ------------------------------------------------------------------- -->
        <aside id="right-panel">
            <header class="panel-header">
                <h3>Toni AI <span id="ai-status-indicator">●</span></h3>
                <button id="close-right-panel-btn" class="mobile-nav-btn">✕</button>
            </header>
            <div id="chat-box" class="panel-content">
                <!-- Chat-Nachrichten werden dynamisch eingefügt -->
            </div>
            <form id="chat-form" class="panel-footer">
                <input id="chat-input" type="text" placeholder="Befehl für Toni...">
                <button type="submit">➤</button>
            </form>
        </aside>

    </div> <!-- Ende #main-app -->

    <!-- ======================================================================= -->
    <!-- IV. Modale Dialoge (Pop-ups für Detailansichten)                        -->
    <!-- ======================================================================= -->

    <!-- 1. Spieler-Akte ("Digitale DNA") -->
    <div id="player-dashboard-dialog" class="dialog-overlay">
        <div class="dialog-box">
            <header class="dialog-header">
                <h2 id="player-dialog-title"></h2>
                <button data-action="close-dialog">✕</button>
            </header>
            <div id="player-dialog-content" class="dialog-content">
                <!-- Hier wird die "Gold Card" und weitere Spieler-Daten eingefügt -->
            </div>
        </div>
    </div>

    <!-- 2. Manager Cockpit -->
    <div id="manager-cockpit-dialog" class="dialog-overlay">
        <div class="dialog-box large">
            <header class="dialog-header">
                <h2>💼 Manager Cockpit</h2>
                <button data-action="close-dialog">✕</button>
            </header>
            <div id="manager-dialog-content" class="dialog-content">
                <!-- Hier kommen die Module: Contract-Radar, Scouting-Feed, Asset-Value -->
            </div>
        </div>
    </div>

    <!-- 3. Tactical Clipboard -->
    <div id="clipboard-dialog" class="dialog-overlay">
        <div class="dialog-box large">
            <header class="dialog-header">
                <h2>📋 Tactical Clipboard</h2>
                <button data-action="print-clipboard">🖨️</button>
                <button data-action="close-dialog">✕</button>
            </header>
            <div id="clipboard-dialog-content" class="dialog-content">
                <!-- Hier kommen die Module: Countdown, Checkliste, War-Room -->
            </div>
        </div>
    </div>

    <!-- Weitere Dialoge für Player-Portal, Video-Telestrator etc. würden hier folgen -->

</body>
</html>
<style>
    /* ======================================================================= */
    /* I. Design System & Root Variablen                                       */
    /* ======================================================================= */
    :root {
        /* Farbpalette */
        --bg-dark: #0d1117;
        --bg-medium: #161b22;
        --bg-light: #21262d;
        --border-color: #30363d;
        --text-primary: #e6edf3;
        --text-secondary: #848d97;
        --accent-blue: #58a6ff;
        --accent-green: #3fb950;
        --accent-red: #f85149;
        --accent-yellow: #e3b341;

        /* Spezielle Verläufe */
        --gold-gradient: linear-gradient(145deg, #d4af37, #b48c2c, #d4af37);

        /* Typografie & Abstände */
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
    }

    /* ======================================================================= */
    /* II. Globale Stile & Resets                                              */
    /* ======================================================================= */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        height: 100%;
        width: 100%;
        background-color: var(--bg-dark);
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 15px;
        overflow: hidden;
    }

    button {
        font-family: var(--font-sans);
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
    }

    h1, h2, h3 {
        font-weight: 600;
        margin-bottom: 0.8em;
    }

    h1 { font-size: 2em; letter-spacing: 1px; }
    h2 { font-size: 1.4em; }
    h3 { font-size: 1.1em; color: var(--text-secondary); }

    /* ======================================================================= */
    /* III. App-Architektur & Layout                                           */
    /* ======================================================================= */
    .app-container {
        display: grid;
        height: 100vh;
        width: 100vw;
        grid-template-areas:
            "header header header"
            "nav    main   aside"
            "nav    main   aside";
        grid-template-columns: 280px 1fr 350px;
        grid-template-rows: 60px 1fr;
        gap: 12px;
        padding: 12px;
    }

    .app-header       { grid-area: header; }
    #left-panel       { grid-area: nav; }
    #main-arena       { grid-area: main; }
    #right-panel      { grid-area: aside; }

    /* Grund-Styling für alle Haupt-Panels */
    .app-header, #left-panel, #main-arena, #right-panel {
        background: var(--bg-medium);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .app-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
    }

    #left-panel, #right-panel {
        padding: 20px;
    }

    #main-arena {
        padding: 8px; /* Weniger Padding für das Canvas */
    }

    .panel-content { flex-grow: 1; overflow-y: auto; }
    .panel-header, .panel-footer { flex-shrink: 0; }

    /* ======================================================================= */
    /* IV. Komponenten-Styling (Buttons, Inputs, Overlays)                     */
    /* ======================================================================= */

    /* ----- Buttons ----- */
    .btn {
        padding: 10px 16px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        background-color: var(--bg-light);
        color: var(--text-primary);
        font-weight: 600;
        transition: background-color 0.2s;
    }
    .btn:hover { background-color: #30363d; }
    
    .mobile-nav-btn { display: none; font-size: 24px; padding: 5px 10px; }

    /* ----- Header & Profil ----- */
    .header-left, .header-right { display: flex; align-items: center; gap: 16px; }
    #user-profile { display: flex; align-items: center; gap: 12px; }
    #user-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: var(--bg-dark); }
    .user-details { display: flex; flex-direction: column; }
    #user-name { font-weight: 600; }
    #user-role { font-size: 0.8em; color: var(--text-secondary); }

    /* ----- Chat-Konsole (Rechte Leiste) ----- */
    #chat-form { display: flex; gap: 8px; margin-top: 12px; }
    #chat-input {
        width: 100%;
        background: var(--bg-dark);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 12px;
        border-radius: var(--radius-md);
        font-size: 1em;
    }
    #chat-input:focus { outline: none; border-color: var(--accent-blue); }

    /* ----- Taktikboard ----- */
    #board-wrap { flex-grow: 1; position: relative; border-radius: var(--radius-md); background-color: #011a01; }
    #main-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    /* ----- System-Overlays & Dialoge ----- */
    .system-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(13, 17, 23, 0.8);
        backdrop-filter: blur(10px);
    }
    .dialog-overlay { display: none; }
    .dialog-overlay.is-active { display: flex; }

    .dialog-box {
        width: 90vw;
        max-width: 600px; /* Standard-Breite für Dialoge */
        max-height: 90vh;
        background: var(--bg-medium);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .dialog-box.large { max-width: 1200px; }
    .dialog-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
    }
    .dialog-content { padding: 20px; overflow-y: auto; }

    /* ======================================================================= */
    /* V. Feature-spezifisches Styling (Gold Card etc.)                        */
    /* ======================================================================= */

    /* ----- Die FIFA Gold Card 2.0 ----- */
    .gold-card {
        background: var(--gold-gradient);
        color: #1a1a1a;
        border-radius: var(--radius-md);
        padding: 20px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .card-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 24px; }
    .card-player-name { text-align: center; font-size: 22px; font-weight: bold; }
    .card-attributes {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px 16px;
        font-weight: 600;
        font-size: 16px;
    }
    .card-bio-data {
        border-top: 1px solid rgba(0,0,0,0.2);
        padding-top: 16px;
        font-size: 14px;
    }

    /* ----- Live Session & Warnungen ----- */
    .live-session-btn.active {
        color: var(--accent-red);
        animation: pulse 1.5s infinite;
    }
    .fatigue-warning {
        animation: fatigue-pulse 2s infinite;
    }
    

    /* ======================================================================= */
    /* VI. Animationen                                                         */
    /* ======================================================================= */
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(248, 81, 73, 0); }
        100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
    }
    @keyframes fatigue-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.7); }
        50% { box-shadow: 0 0 10px 4px rgba(248, 81, 73, 0.7); }
    }

    /* ======================================================================= */
    /* VII. Responsive Design (Media Queries)                                  */
    /* ======================================================================= */

    /* Tablet & kleinere Desktops */
    @media (max-width: 1200px) {
        .app-container {
            grid-template-areas:
                "header header"
                "nav    main";
            grid-template-columns: 280px 1fr;
        }
        #right-panel {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: 350px;
            z-index: 8000;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            border-radius: 0;
        }
        #right-panel.is-visible { transform: translateX(0); }
        .mobile-nav-btn { display: block; }
        #desktop-controls { display: none; }
    }

    /* Mobile Geräte */
    @media (max-width: 768px) {
        .app-container {
            grid-template-areas:
                "header"
                "main";
            grid-template-columns: 1fr;
            padding: 8px;
            gap: 8px;
        }
        #left-panel, #right-panel {
            width: 85%;
            max-width: 320px;
        }
        #left-panel {
            left: 0;
            transform: translateX(-100%);
        }
        #left-panel.is-visible { transform: translateX(0); }
    }

</style>
<script>
    'use strict';

    /* ======================================================================= */
    /* I. MOCK DATABASE & API SERVICE */
    /* (Simuliert das Backend und die Daten des Vereins) */
    /* ======================================================================= */

    const MockData = {
        profiles: {
            "coach_meier": {
                id: "coach_meier",
                name: "Björn Meier",
                role: "Cheftrainer",
                club: "FC Visionary 2024",
                avatar: "BM"
            },
            "manager_schmidt": {
                id: "manager_schmidt",
                name: "Jens Schmidt",
                role: "Manager",
                club: "FC Visionary 2024",
                avatar: "JS"
            }
        },
        squad: {
            "p1": { id: "p1", name: "Müller", num: 13, pos: "ST", canvas: {x: 450, y: 200}, att: { pac: 90, sho: 88, pas: 80, dri: 85, def: 40, phy: 78 }, ovr: 88, bio: { hrv: 92, fatPct: 11.2, readiness: 95 }, mental: { sleep: 8, stress: 2, motiv: 9 }, stats: { minutes: 0, performance: 100 } },
            "p2": { id: "p2", name: "Kimmich", num: 6, pos: "ZDM", canvas: {x: 300, y: 250}, att: { pac: 75, sho: 78, pas: 91, dri: 84, def: 82, phy: 79 }, ovr: 89, bio: { hrv: 95, fatPct: 12.1, readiness: 98 }, mental: { sleep: 9, stress: 1, motiv: 10 }, stats: { minutes: 0, performance: 100 } },
            "p3": { id: "p3", name: "Hummels", num: 5, pos: "IV", canvas: {x: 150, y: 250}, att: { pac: 65, sho: 60, pas: 78, dri: 72, def: 90, phy: 84 }, ovr: 86, bio: { hrv: 85, fatPct: 13.5, readiness: 88 }, mental: { sleep: 6, stress: 4, motiv: 8 }, stats: { minutes: 0, performance: 100 } },
            "p4": { id: "p4", name: "Neuer", num: 1, pos: "TW", canvas: {x: 50, y: 250}, att: { pac: 60, sho: 30, pas: 65, dri: 40, def: 88, phy: 82 }, ovr: 85, bio: { hrv: 91, fatPct: 12.8, readiness: 94 }, mental: { sleep: 8, stress: 2, motiv: 9 }, stats: { minutes: 0, performance: 100 } }
        },
        finances: {
            budget: 50000000,
            salaries: 35000000,
            infrastructure: 8000000,
        },
        contracts: [
            { id: "p3", type: "player", name: "Hummels", endDate: new Date(new Date().setMonth(new Date().getMonth() + 5)) },
            { id: "p1", type: "player", name: "Müller", endDate: new Date(new Date().setMonth(new Date().getMonth() + 14)) },
            { id: "sponsor1", type: "sponsor", name: "ToniTech Labs", endDate: new Date(new Date().setMonth(new Date().getMonth() + 8)) },
        ]
    };

    const ApiService = {
        _simulateDelay(ms = 300) {
            return new Promise(res => setTimeout(res, ms));
        },
        async getProfiles() {
            await this._simulateDelay();
            return Object.values(MockData.profiles);
        },
        async loadProfileData(profileId) {
            await this._simulateDelay(800);
            return {
                user: MockData.profiles[profileId],
                squad: JSON.parse(JSON.stringify(MockData.squad)),
                finances: JSON.parse(JSON.stringify(MockData.finances)),
                contracts: JSON.parse(JSON.stringify(MockData.contracts)),
            };
        }
    };

    /* ======================================================================= */
    /* II. APPLICATION STATE & UI MANAGER */
    /* (Zentrales Management von Daten und DOM-Elementen) */
    /* ======================================================================= */

    const AppState = {
        user: null,
        squad: null,
        finances: null,
        contracts: null
    };

    const UIManager = {
        init() {
            this.elements = {};
            const elementIds = [
                'system-loader', 'login-screen', 'profile-selector', 'login-form', 'main-app',
                'user-avatar', 'user-name', 'user-role', 'toggle-left-panel-btn', 'toggle-right-panel-btn',
                'left-panel', 'right-panel', 'close-right-panel-btn', 'main-arena', 'board-wrap', 'main-canvas',
                'ai-status-indicator', 'chat-box', 'chat-form', 'chat-input', 'squad-list', 'mobile-backdrop',
                'player-dashboard-dialog', 'player-dialog-title', 'player-dialog-content',
                'manager-cockpit-dialog', 'manager-dialog-content',
                'clipboard-dialog', 'clipboard-dialog-content'
            ];
            elementIds.forEach(id => this.elements[id] = document.getElementById(id));
            this.bindEvents();
        },

        bindEvents() {
            // Login
            this.elements['login-form'].addEventListener('submit', (e) => {
                e.preventDefault();
                App.login(this.elements['profile-selector'].value);
            });

            // Panel Toggles
            this.elements['toggle-left-panel-btn'].addEventListener('click', () => this.togglePanel('left-panel'));
            this.elements['toggle-right-panel-btn'].addEventListener('click', () => this.togglePanel('right-panel'));
            this.elements['close-right-panel-btn'].addEventListener('click', () => this.togglePanel('right-panel', false));
            this.elements['mobile-backdrop'].addEventListener('click', () => {
                this.togglePanel('left-panel', false);
                this.togglePanel('right-panel', false);
            });
            
            // Dialog Closers & Openers
            document.addEventListener('click', (e) => {
                if (e.target.dataset.action === 'close-dialog') {
                    e.target.closest('.dialog-overlay').classList.remove('is-active');
                }
                if (e.target.dataset.action === 'open-manager-cockpit'){
                    this.renderManagerCockpit();
                    this.openDialog('manager-cockpit-dialog');
                }
                 if (e.target.dataset.action === 'open-clipboard'){
                    this.renderClipboard();
                    this.openDialog('clipboard-dialog');
                }
            });
        },

        togglePanel(panelId, forceState) {
            const panel = this.elements[panelId];
            const isVisible = forceState!== undefined? forceState :!panel.classList.contains('is-visible');
            panel.classList.toggle('is-visible', isVisible);
            
            const anyVisible = document.querySelector('#left-panel.is-visible, #right-panel.is-visible');
            this.elements['mobile-backdrop'].hidden =!anyVisible;
        },
        
        openDialog(dialogId) {
            this.elements[dialogId].classList.add('is-active');
        },

        renderAppLayout() {
            // User-Profil im Header
            this.elements['user-name'].textContent = AppState.user.name;
            this.elements['user-role'].textContent = AppState.user.club;
            this.elements['user-avatar'].textContent = AppState.user.avatar;
            // Kaderliste
            this.renderSquadList();
        },
        
        renderSquadList() {
            const listEl = this.elements['squad-list'];
            listEl.innerHTML = '';
            Object.values(AppState.squad).forEach(p => {
                const playerEl = document.createElement('button');
                playerEl.className = 'btn';
                playerEl.style.cssText = 'width:100%; display:flex; align-items:center; gap:12px; margin-bottom:8px; text-align:left;';
                playerEl.innerHTML = `
                    <span style="background:var(--bg-dark); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-weight:bold;">${p.num}</span>
                    <div>${p.name} <small style="color:var(--text-secondary);">${p.pos}</small></div>
                    <strong style="margin-left:auto; font-size:16px;">${p.ovr}</strong>
                `;
                playerEl.onclick = () => this.renderPlayerDashboard(p.id);
                listEl.appendChild(playerEl);
            });
        },
        
        renderPlayerDashboard(playerId) {
            const p = AppState.squad[playerId];
            if (!p) return;
            
            this.elements['player-dialog-title'].textContent = `Digitale Akte: ${p.name}`;
            this.elements['player-dialog-content'].innerHTML = `
                <div class="gold-card">
                    <div class="card-header">
                        <span>${p.ovr}</span>
                        <span>${p.pos}</span>
                    </div>
                    <div class="card-player-name">${p.name} #${p.num}</div>
                    <div class="card-attributes">
                        ${Object.entries(p.att).map(([key, val]) => `<div>${val} ${key.toUpperCase()}</div>`).join('')}
                    </div>
                    <div class="card-bio-data">
                        <strong>BIA:</strong> HRV: ${p.bio.hrv}ms | Fett: ${p.bio.fatPct}% | Readiness: ${p.bio.readiness}%<br>
                        <strong>Mental:</strong> Schlaf: ${p.mental.sleep}/10 | Stress: ${p.mental.stress}/10 | Motivation: ${p.mental.motiv}/10
                    </div>
                </div>
                <!-- Weitere Graphen und Analysen hier -->
            `;
            this.openDialog('player-dashboard-dialog');
        },

        renderManagerCockpit() {
            const f = AppState.finances;
            const c = AppState.contracts;
            const costs = f.salaries + f.infrastructure;
            const liquidity = f.budget - costs;

            const expiringContracts = c.filter(con => con.type === 'player' && (con.endDate - new Date()) / (1000 * 60 * 60 * 24) < 180);

            this.elements['manager-dialog-content'].innerHTML = `
                <h3>Finanz-Cockpit</h3>
                <p>Budget: ${f.budget.toLocaleString()} € | Kosten: ${costs.toLocaleString()} € | <strong>Liquidität: ${liquidity.toLocaleString()} €</strong></p>
                <h3>Contract-Lifecycle-Radar (Auslaufende Verträge < 6 Monate)</h3>
                ${expiringContracts.length > 0? expiringContracts.map(con => `<p style="color:var(--accent-red);">⚠️ ${con.name} - läuft aus in ${Math.round((con.endDate - new Date()) / (1000 * 60 * 60 * 24))} Tagen</p>`).join('') : '<p>Keine kritischen Verträge.</p>'}
                <!-- Hier würden weitere Manager-Module folgen -->
            `;
        },

        renderClipboard() {
             this.elements['clipboard-dialog-content'].innerHTML = `
                <h3>Matchday Countdown (vs. FC Musterstadt)</h3>
                <p>14:30: Ankunft Stadion</p>
                <p>15:15: Aufwärmen</p>
                <p>15:50: Letzte Ansprache</p>
                <h3>Logistik-Checkliste</h3>
                <p><input type="checkbox" checked> Trikots (Heim)</p>
                <p><input type="checkbox" checked> Spielerpässe</p>
                <p><input type="checkbox"> Sanitätskoffer</p>
             `;
        }
    };

    /* ======================================================================= */
    /* III. TONI AI - DAS KOGNITIVE GEHIRN */
    /* ======================================================================= */

    const ToniAI = {
        init() {
            this.elements = UIManager.elements;
            this.elements['chat-form'].addEventListener('submit', (e) => {
                e.preventDefault();
                this.processCommand();
            });
            this.elements['ai-status-indicator'].style.color = 'var(--accent-green)';
            this.speak(`TITAN v10 für ${AppState.user.name} online. System bereit.`);
            this.performMorningCheck();
        },

        speak(message, isUser = false) {
            const msgContainer = document.createElement('div');
            msgContainer.style.marginBottom = '12px';

            if (isUser) {
                msgContainer.innerHTML = `<div style="display:flex; justify-content:flex-end;"><div style="padding:8px 12px; background:var(--accent-blue); color:#fff; border-radius:12px 12px 0 12px; max-width:80%;">${message}</div></div>`;
            } else {
                msgContainer.innerHTML = `<div style="font-weight:bold; color:var(--text-secondary); font-size:0.9em; margin-bottom:4px;">Toni AI</div><div>${message.replace(/\n/g, "<br>")}</div>`;
            }
            this.elements['chat-box'].appendChild(msgContainer);
            this.elements['chat-box'].scrollTop = this.elements['chat-box'].scrollHeight;
        },

        processCommand() {
            const input = this.elements['chat-input'].value.trim();
            if (!input) return;

            this.speak(input, true);
            this.elements['chat-input'].value = '';

            // Einfache Befehlserkennung
            if (input.toLowerCase().includes('status')) {
                this.performMorningCheck();
            } else if (input.toLowerCase().match(/wer ist müde|zeig erschöpfung/)) {
                const tiredPlayers = Object.values(AppState.squad).filter(p => p.stats.performance < 85);
                if(tiredPlayers.length > 0) {
                    this.speak(`Folgende Spieler zeigen erhöhte Ermüdung:\n${tiredPlayers.map(p => `- ${p.name} (Leistung: ${p.stats.performance.toFixed(0)}%)`).join('\n')}`);
                } else {
                    this.speak('Aktuell sind alle Spieler im grünen Bereich.');
                }
            }
            else {
                this.speak("Befehl nicht erkannt. Versuche 'status' oder 'wer ist müde'.");
            }
        },

        performMorningCheck() {
            const warnings = [];
            Object.values(AppState.squad).forEach(p => {
                if (p.bio.readiness < 90) warnings.push(`${p.name} (Readiness: ${p.bio.readiness}%)`);
            });
            if (warnings.length > 0) {
                this.speak(`⚠️ **Morgenreport:** ${warnings.length} Spieler im roten Bereich.\n- ${warnings.join('\n- ')}`);
            } else {
                this.speak(`✅ **Morgenreport:** Alle Spieler sind fit und einsatzbereit.`);
            }
        }
    };

    /* ======================================================================= */
    /* IV. ARENA ENGINE - DAS TAKTIKBOARD */
    /* ======================================================================= */

    const ArenaEngine = {
        init() {
            this.canvas = UIManager.elements['main-canvas'];
            this.ctx = this.canvas.getContext('2d');
            this.dpr = window.devicePixelRatio || 1;
            
            this.isDragging = false;
            this.dragTarget = null;
            
            this.setupCanvas();
            this.bindEvents();
            this.renderLoop();

            // Starte die Substitutions-KI
            setInterval(() => this.SubstitutionAI.updateAllPlayers(), 5000); // Alle 5 Sekunden
        },
        
        setupCanvas() {
            const rect = this.canvas.parentElement.getBoundingClientRect();
            this.canvas.width = rect.width * this.dpr;
            this.canvas.height = rect.height * this.dpr;
            this.canvas.style.width = `${rect.width}px`;
            this.canvas.style.height = `${rect.height}px`;
            this.ctx.scale(this.dpr, this.dpr);
        },

        bindEvents() {
            const getPos = (e) => {
                const rect = this.canvas.getBoundingClientRect();
                const t = e.touches? e.touches[0] : e;
                return { x: t.clientX - rect.left, y: t.clientY - rect.top };
            };
            
            this.canvas.onpointerdown = (e) => {
                const pos = getPos(e);
                const player = this.getPlayerAt(pos);
                if (player) {
                    this.isDragging = true;
                    this.dragTarget = player;
                }
            };
            this.canvas.onpointermove = (e) => {
                if (this.isDragging && this.dragTarget) {
                    const pos = getPos(e);
                    this.dragTarget.canvas.x = pos.x;
                    this.dragTarget.canvas.y = pos.y;
                }
            };
            this.canvas.onpointerup = () => {
                this.isDragging = false;
                this.dragTarget = null;
            };
             window.onresize = () => this.setupCanvas();
        },

        getPlayerAt(pos) {
            return Object.values(AppState.squad).find(p => 
                Math.hypot(p.canvas.x - pos.x, p.canvas.y - pos.y) < 20 // 20px Radius
            );
        },
        
        renderLoop() {
            this.draw();
            requestAnimationFrame(() => this.renderLoop());
        },

        draw() {
            const w = this.canvas.clientWidth;
            const h = this.canvas.clientHeight;
            this.ctx.clearRect(0, 0, w, h);
            this.drawPitch(w, h);
            Object.values(AppState.squad).forEach(p => this.drawPlayer(p));
        },

        drawPitch(w, h) {
            this.ctx.fillStyle = '#011a01';
            this.ctx.fillRect(0,0,w,h);
            this.ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            this.ctx.lineWidth = 2;
            // Linien
            this.ctx.strokeRect(25, 25, w - 50, h - 50); // Außen
            this.ctx.beginPath(); this.ctx.moveTo(w/2, 25); this.ctx.lineTo(w/2, h - 50); this.ctx.stroke(); // Mitte
            this.ctx.beginPath(); this.ctx.arc(w/2, h/2, 60, 0, 2 * Math.PI); this.ctx.stroke(); // Mittelkreis
        },

        drawPlayer(p) {
            const { x, y } = p.canvas;
            
            // Ermüdungs-Warnung
            this.ctx.save();
            if (p.stats.performance < 70) {
                this.ctx.shadowBlur = 15;
                this.ctx.shadowColor = 'rgba(248, 81, 73, 0.9)'; // HIGH BLINK
            } else if (p.stats.performance < 85) {
                this.ctx.shadowBlur = 10;
                this.ctx.shadowColor = 'rgba(227, 179, 65, 0.7)'; // LOW BLINK
            }
            
            // Spieler-Kreis
            this.ctx.beginPath();
            this.ctx.arc(x, y, 20, 0, 2 * Math.PI);
            this.ctx.fillStyle = p.pos === 'TW'? 'var(--accent-yellow)' : 'var(--accent-blue)';
            this.ctx.fill();
            this.ctx.restore();

            // Nummer
            this.ctx.fillStyle = '#fff';
            this.ctx.font = 'bold 18px var(--font-sans)';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText(p.num, x, y);
        },

        SubstitutionAI: {
            updateAllPlayers() {
                Object.values(AppState.squad).forEach(p => {
                    // Simuliere 5 Minuten Spielzeit pro Update
                    if(p.stats.minutes < 90) p.stats.minutes += 5;
                    p.stats.performance = this.calculatePerformance(p);
                });
            },
            calculatePerformance(player) {
                // P(t) = P0 * e^(-kt)
                const P0 = player.bio.readiness; // Startfitness
                const t = player.stats.minutes; // Zeit
                const k = 0.0035; // Zerfallsrate (k-Faktor), angepasst für stärkere Wirkung
                
                const performance = P0 * Math.exp(-k * t);
                return Math.max(0, performance); // Performance kann nicht unter 0 fallen
            }
        }
    };

    /* ======================================================================= */
    /* V. APPLICATION ENTRY POINT */
    /* ======================================================================= */

    const App = {
        async init() {
            UIManager.init();
            
            const storedProfileId = sessionStorage.getItem('titan_profile_id');
            if (storedProfileId) {
                await this.login(storedProfileId);
            } else {
                UIManager.elements['system-loader'].hidden = true;
                const profiles = await ApiService.getProfiles();
                this.elements['profile-selector'].innerHTML = profiles.map(p => `<option value="${p.id}">${p.name} (${p.role})</option>`).join('');
                UIManager.elements['login-screen'].style.display = 'flex';
            }
        },

        async login(profileId) {
            UIManager.elements['login-screen'].style.display = 'none';
            UIManager.elements['system-loader'].hidden = false;

            const data = await ApiService.loadProfileData(profileId);
            Object.assign(AppState, data);
            
            sessionStorage.setItem('titan_profile_id', profileId);
            
            UIManager.elements['system-loader'].hidden = true;
            UIManager.elements['main-app'].hidden = false;

            UIManager.renderAppLayout();
            ToniAI.init();
            ArenaEngine.init();
        },

        logout() {
            sessionStorage.removeItem('titan_profile_id');
            window.location.reload();
        }
    };
    
    // Start the application
    App.init();

</script>
