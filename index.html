<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI AI - Elite Performance System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body class="toni-expanded">

    <div class="sidebar">
        <div class="logo">⚽ TONI AI</div>
        <button class="nav-btn active" onclick="showModule('dashboard')">🏠 Kabine</button>
        <button class="nav-btn" onclick="showModule('tactics')">📋 Taktik</button>
        <button class="nav-btn" onclick="showModule('management')">💼 Aktentasche</button>
        <button class="nav-btn" onclick="showModule('bio')">❤️ Bio-Labor</button>
        <button class="nav-btn" onclick="showModule('vr')">🥽 VR-Center</button>
    </div>

    <div class="main-content">
        
        <div id="dashboard" class="module-section active">
            <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>Mannschaftskabine</h2>
                <button class="action-btn" onclick="openPlayerModal()">+ Spieler hinzufügen</button>
            </div>
            <div id="locker-room-container" class="card-grid"></div>
        </div>

        <div id="tactics" class="module-section">
            <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>Elite Taktik-Zentrum</h2>
                <div class="tactic-controls">
                    <button class="action-btn" style="padding: 8px 15px;" onclick="setFormation('4-4-2')">4-4-2</button>
                    <button class="action-btn" style="padding: 8px 15px;" onclick="setFormation('3-4-3')">3-4-3</button>
                    <button class="action-btn btn-danger" onclick="clearBoard()">Reset</button>
                </div>
            </div>
            <div class="pitch-container">
                <canvas id="tacticBoard"></canvas>
            </div>
        </div>

        <div id="management" class="module-section">
            <h2>Vereins-Management & Finanzen</h2>
            <div id="mgmt-content"></div>
        </div>

        <div id="bio" class="module-section">
            <h2>Performance Bio-Lab</h2>
            <div id="bio-lab-container"></div>
        </div>

        <div id="vr" class="module-section">
            <div class="vr-grid-layout" style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
                <div class="vr-preview-card">
                    <h3>Cognitive Simulation</h3>
                    <div class="vr-actions" style="margin-bottom:15px;">
                        <button class="action-btn" onclick="vrCenter.launchVR()">VR STARTEN</button>
                        <button class="action-btn" style="background:#3b82f6" onclick="vrCenter.triggerDrill()">DRILL STARTEN</button>
                    </div>
                    <div id="vr-container" style="height: 400px; background: black; border-radius: 15px;"></div>
                </div>
                <div class="logbook-card" style="background:var(--card); padding:20px; border-radius:15px;">
                    <h3>VR-Logbuch</h3>
                    <div id="vr-logbook"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="toni-toggle" onclick="toggleToni()">🤖</button>
    <div class="toni-interface">
        <div class="chat-header"><span>TONI AI ANALYST</span></div>
        <div class="chat-messages" id="chat-history"></div>
        <div class="chat-input-area">
            <button id="voice-btn" onclick="toggleVoice()">🎤</button>
            <input type="text" id="text-input" placeholder="Anweisung an Toni...">
        </div>
    </div>

    <div id="player-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0;">Spieler-Profil</h3>
            <div class="modal-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="edit-name" placeholder="Name">
                <input type="text" id="edit-pos" placeholder="Pos (z.B. ST)">
                
                <div style="grid-column: span 2;">
                    <label style="font-size:10px; color:#94a3b8;">Bild-URL (z.B. von Imgur)</label>
                    <input type="text" id="edit-img-url" placeholder="https://beispiel.de/foto.jpg">
                </div>

                <div style="grid-column: span 2;">
                    <label style="font-size:10px; color:#94a3b8;">Gesamt-Rating (wird automatisch berechnet)</label>
                    <input type="number" id="edit-rating" placeholder="Rating" readonly style="background: #0f172a; opacity: 0.8;">
                </div>

                <hr style="grid-column: span 2; width: 100%; border: 0.5px solid #334155; margin: 5px 0;">
                
                <input type="number" id="edit-tem" placeholder="TEM">
                <input type="number" id="edit-sch" placeholder="SCH">
                <input type="number" id="edit-pas" placeholder="PAS">
                <input type="number" id="edit-dri" placeholder="DRI">
                <input type="number" id="edit-def" placeholder="DEF">
                <input type="number" id="edit-phy" placeholder="PHY">
            </div>
            <div class="modal-actions" style="margin-top:20px; display:flex; gap:10px;">
                <button class="action-btn" style="flex:2" onclick="savePlayer()">Speichern</button>
                <button class="action-btn btn-danger" id="btn-delete" style="flex:1" onclick="deletePlayer()">Löschen</button>
                <button class="action-btn" style="flex:1; background:#64748b" onclick="closePlayerModal()">Abbrechen</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="modules/management.js"></script>
    <script src="modules/bio-lab.js"></script>
    <script src="modules/vr-center.js"></script>
</body>
</html>
