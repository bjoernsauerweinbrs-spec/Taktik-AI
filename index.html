<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Intelligence Board - Björn Edition</title>
    <style>
        :root { --pitch: #2d5a27; --stripe: #254d21; --line: rgba(255,255,255,0.7); }
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; background: #000; overflow: hidden; color: #fff; }
        #api-bar { background: #111; padding: 6px; text-align: center; font-size: 11px; border-bottom: 1px solid #333; cursor: pointer; }
        #nav { background: #1a1a1a; padding: 10px; display: flex; justify-content: center; gap: 8px; border-bottom: 3px solid #2e7d32; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        #pitch-wrapper { flex: 2; position: relative; display: flex; justify-content: center; align-items: center; padding: 10px; background: #000; }
        #pitch { width: 100%; height: 100%; max-width: 1100px; background: var(--pitch); border: 3px solid #fff; position: relative; background-image: repeating-linear-gradient(0deg, var(--pitch), var(--pitch) 10%, var(--stripe) 10%, var(--stripe) 20%); }
        .mid-line { position: absolute; width: 100%; height: 2px; background: var(--line); top: 50%; left: 0; pointer-events: none; }
        .center-circle { width: 100px; height: 100px; border: 2px solid var(--line); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .goal { position: absolute; border: 2px solid white; background: rgba(255,255,255,0.2); z-index: 5; }
        .goal-std { width: 90px; height: 25px; left: 50%; transform: translateX(-50%); }
        .player { width: 32px; height: 32px; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; cursor: grab; z-index: 50; border: 2px solid #fff; transition: all 1s ease-in-out; }
        .red { background: #b71c1c; color: white; }
        .blue { background: #0d47a1; color: white; }
        .ball { width: 18px; height: 18px; background: #fff; border: 2px solid #000; z-index: 60; border-radius: 50%; transition: all 0.7s ease; }
        #chat { height: 35%; background: #fff; color: #000; display: flex; flex-direction: column; }
        #log { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; background: #f9f9f9; }
        .msg { margin-bottom: 8px; padding: 10px; border-radius: 6px; border-left: 5px solid transparent; }
        .ai { background: #f0f0f0; border-left-color: #2e7d32; }
        #input-row { padding: 10px; background: #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        .send-btn { background: #2e7d32; color: white; border: none; padding: 0 20px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body onclick="initAudio()">
<div id="api-bar" onclick="askKey()">
    <span id="api-status" style="color: #ff5252;">KI Inaktiv</span> | <span style="color: #00ff88;">[ Key hier eingeben ]</span>
</div>
<div id="nav"><button class="btn" onclick="setMode('11v11')">11v11 Match</button><button class="btn" onclick="resetBall()">Ball Mitte</button></div>
<div id="pitch-wrapper"><div id="pitch"><div class="mid-line"></div><div class="center-circle"></div><div id="ball" class="player ball" style="top: 48.5%; left: 49.2%;"></div><div id="p-layer"></div></div></div>
<div id="chat"><div id="log"></div><div id="input-row"><input type="text" id="user-in" placeholder="Frage..."><button class="send-btn" onclick="talk()">➤</button></div></div>

<script>
    const layer = document.getElementById('p-layer'), log = document.getElementById('log'), input = document.getElementById('user-in'), ball = document.getElementById('ball');
    let voice = null, myKey = localStorage.getItem('bjorn_key')?.trim() || "";

    function askKey() {
        const k = prompt("Bitte den Google API-Key einfügen:");
        if(k) { localStorage.setItem('bjorn_key', k.trim()); location.reload(); }
    }
    if(myKey) { document.getElementById('api-status').innerText = "KI-Power: Bereit"; document.getElementById('api-status').style.color = "#00ff88"; }

    function initAudio() { if(!voice) voice = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('de')) || null; }
    function addLog(who, t, isAi) {
        const d = document.createElement('div'); d.className = 'msg ' + (isAi ? 'ai' : 'user');
        d.innerHTML = `<b>${who}:</b> ${t}`; log.appendChild(d); log.scrollTop = log.scrollHeight;
        if(isAi && window.speechSynthesis) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t.replace(/\[.*?\]/g, '')); if(voice) m.voice = voice; window.speechSynthesis.speak(m); }
    }

    function createP(t, l, c, n) { const p = document.createElement('div'); p.className = `player ${c}`; p.style.top = t + "%"; p.style.left = l + "%"; p.innerText = n; layer.appendChild(p); }
    function setMode(m) {
        layer.innerHTML = ""; document.querySelectorAll('.goal').forEach(g => g.remove());
        const g1 = document.createElement('div'); g1.className = 'goal goal-std'; g1.style.top = "0%"; g1.style.left = "50%"; document.getElementById('pitch').appendChild(g1);
        const g2 = document.createElement('div'); g2.className = 'goal goal-std'; g2.style.top = "97%"; g2.style.left = "50%"; document.getElementById('pitch').appendChild(g2);
        const red = [{t:88,l:48},{t:75,l:15},{t:78,l:35},{t:78,l:62},{t:75,l:82},{t:58,l:20},{t:62,l:40},{t:62,l:58},{t:58,l:78},{t:42,l:42},{t:42,l:54}];
        const blue = [{t:10,l:48},{t:22,l:20},{t:18,l:48},{t:22,l:78},{t:38,l:15},{t:42,l:38},{t:42,l:58},{t:38,l:82},{t:55,l:30},{t:55,l:68}];
        red.forEach((p, i) => createP(p.t, p.l, 'red', i+1)); blue.forEach((p, i) => createP(p.t, p.l, 'blue', i+1));
        initDrag();
    }

    async function talk() {
        initAudio(); const val = input.value; if(!val || !myKey) return;
        addLog("Trainer", val, false); input.value = "";
        
        // AUTO-PILOT: Probiert verschiedene Modell-Namen aus
        const models = ["gemini-1.5-flash", "gemini-1.5-flash-8b", "gemini-pro"];
        let success = false;

        for (let mName of models) {
            if (success) break;
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mName}:generateContent?key=${myKey}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Du bist Co-Trainer für Björn. Antworte kurz. Bewege Ball mit [BALL:X:Y]. Frage: ${val}` }] }] })
                });
                const d = await r.json();
                if (!d.error) {
                    let resp = d.candidates[0].content.parts[0].text;
                    const bM = resp.match(/\[BALL:(\d+):(\d+)\]/);
                    if(bM) { ball.style.left = bM[1] + "%"; ball.style.top = bM[2] + "%"; }
                    addLog("Co-Trainer", resp, true);
                    success = true;
                }
            } catch(e) {}
        }
        if (!success) addLog("Co-Trainer", "Fehler: Die KI-Zentrale reagiert nicht auf deinen Key. Prüfe den Key bei Google.", true);
    }

    function resetBall() { ball.style.left = "49.2%"; ball.style.top = "48.5%"; }
    function initDrag() {
        document.querySelectorAll('.player').forEach(p => {
            let d = false;
            p.onmousedown = p.ontouchstart = (e) => { d = true; p.style.transition = "none"; e.preventDefault(); };
            window.onmousemove = window.ontouchmove = (e) => {
                if(!d) return; const r = document.getElementById('pitch').getBoundingClientRect();
                const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - r.left;
                const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - r.top;
                p.style.left = (x/r.width*100)-3 + "%"; p.style.top = (y/r.height*100)-3 + "%";
            };
            window.onmouseup = window.ontouchend = () => { d = false; p.style.transition = "all 1s ease"; };
        });
    }
    input.onkeypress = (e) => { if(e.key === 'Enter') talk(); };
    window.onload = () => setMode('11v11');
</script>
</body>
</html>
