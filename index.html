<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Taktik-Masterclass</title>
    <style>
        * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #0a0a0a; color: #fff; overflow: hidden; }
        
        /* Premium Spielfeld */
        #pitch { 
            flex: 2; background: #1b4d2e; position: relative; border: 5px solid rgba(255,255,255,0.8); margin: 10px; border-radius: 4px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
            background-image: linear-gradient(90deg, transparent 49.5%, rgba(255,255,255,0.2) 49.5%, rgba(255,255,255,0.2) 50.5%, transparent 50.5%);
        }
        .center-circle { width: 100px; height: 100px; border: 2px solid white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.6; }
        .goal { width: 80px; height: 30px; border: 2px solid white; position: absolute; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); }

        /* Spieler & Ball */
        .player { 
            width: 34px; height: 34px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 13px; cursor: grab; z-index: 10;
            border: 2px solid #fff; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); touch-action: none;
        }
        .red { background: linear-gradient(135deg, #ff416c, #ff4b2b); box-shadow: 0 4px 15px rgba(255,75,43,0.4); }
        .blue { background: linear-gradient(135deg, #4b6cb7, #182848); box-shadow: 0 4px 15px rgba(24,40,72,0.4); }
        .ball { width: 20px; height: 20px; background: #fff; border: 2px solid #000; z-index: 20; border-radius: 50%; box-shadow: 0 0 10px white; }

        /* Chat-Interface */
        #chat { flex: 1; background: #111; display: flex; flex-direction: column; border-top: 2px solid #333; }
        #log { flex: 1; overflow-y: auto; padding: 20px; font-size: 15px; }
        .msg { margin-bottom: 12px; max-width: 85%; padding: 10px 15px; border-radius: 15px; line-height: 1.5; }
        .ai { background: #1e1e1e; border-left: 5px solid #00ff88; align-self: flex-start; color: #00ff88; }
        .user { background: #333; align-self: flex-end; color: #eee; margin-left: auto; border-right: 5px solid #007bff; }

        #input-row { padding: 15px; display: flex; gap: 12px; background: #1a1a1a; }
        input { flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #444; background: #222; color: white; outline: none; font-size: 16px; }
        button { background: none; border: none; font-size: 28px; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<div id="pitch">
    <div class="goal" style="top: 0;"></div>
    <div class="center-circle"></div>
    <div class="goal" style="bottom: 0;"></div>
    <div id="ball" class="player ball" style="top: 48%; left: 48%;"></div>
