<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 — High Professional AI</title>
    <link rel="stylesheet" href="css/toni-style.css">
    <link rel="stylesheet" href="css/hologram.css">
</head>
<body>

    <aside class="sidebar">
        <div class="nav-icon active" id="nav-board" onclick="switchMainView('board')" title="Taktik-Board">📊</div>
        <div class="nav-icon" id="nav-training" onclick="switchMainView('training')" title="Trainingsbuch">📅</div>
        <div class="nav-icon" id="nav-briefcase" onclick="switchMainView('briefcase')" title="Aktentasche">💼</div>
        <div class="nav-icon" id="nav-sponsoring" onclick="switchMainView('sponsoring')" title="Sponsoring">💰</div>
    </aside>

    <main id="stage">
        <div class="tools-overlay" id="board-tools">
            <button class="tool-btn" onclick="arena.setMode('standard')">STANDARD</button>
            <button class="tool-btn" onclick="arena.setMode('funinho')">FUNINHO</button>
            <button class="tool-btn" onclick="triggerToniAnalysis()" style="color:var(--data-cyan);">KI-SCAN</button>
            <button class="tool-btn" onclick="AnalysisAI.fixDefenseLine()" style="color:#28C76F;">KORREKTUR</button>
        </div>

        <div id="module-board" class="module-container active" style="height:100%;">
            <canvas id="main-canvas"></canvas>
        </div>
        <div id="module-briefcase" class="module-container" style="display:none;"></div>
        <div id="module-training" class="module-container" style="display:none;"></div>
        <div id="module-sponsoring" class="module-container" style="display:none;"></div>
    </main>

    <aside class="analysis-panel" id="analysis-sidebar">
        <h2 id="sidebar-title">Analysezentrum</h2>
        <div id="setcard-content">
            <p class="empty-state">Wähle ein Modul für Daten.</p>
        </div>
    </aside>

    <script src="engine/arena.js"></script>
    <script src="engine/analysis-ai.js"></script>
    <script src="ui/aktentasche-ui.js"></script>
    <script src="ui/sponsoring-ui.js"></script>
    <script src="voice/voice-output.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            arena.init('main-canvas');
            arena.players = [{ id: 1, name: "David Luiz", number: 4, x: 400, y: 300, team: 'home' }];
        });

        function switchMainView(module) {
            // UI Update Icons
            document.querySelectorAll('.nav-icon').forEach(el => el.classList.remove('active'));
            if(document.getElementById('nav-' + module)) document.getElementById('nav-' + module).classList.add('active');

            // Alle Module verstecken
            document.querySelectorAll('.module-container').forEach(el => el.style.display = 'none');
            
            // Aktives Modul zeigen
            const activeModule = document.getElementById('module-' + module);
            if(activeModule) activeModule.style.display = 'block';

            // Cockpit Sichtbarkeit
            document.getElementById('board-tools').style.display = (module === 'board') ? 'flex' : 'none';

            // Modul-Inhalte triggern
            if (module === 'briefcase' && window.Aktentasche) window.Aktentasche.show();
            if (module === 'sponsoring' && window.Sponsoring) window.Sponsoring.show();
            
            if (module === 'board') arena.resize();
        }

        function triggerToniAnalysis() {
            const report = AnalysisAI.scanBoard();
            if (window.toniSpeak) toniSpeak(report);
        }
    </script>
</body>
</html>
