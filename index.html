<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | Elite Tactic & VR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">TONI 2.0</div>
        <nav>
            <button class="nav-btn active" onclick="showModule('tactic-board')"><i>📋</i> Taktikboard</button>
            <button class="nav-btn" onclick="showModule('locker-room')"><i>👤</i> Kabine</button>
            <button class="nav-btn" onclick="showModule('mgmt-lab')"><i>💼</i> Labor</button>
            <button class="nav-btn" onclick="showModule('press-center')"><i>🗞️</i> Presse</button>
        </nav>
        <div class="sidebar-footer">
            <button class="vr-master-btn" onclick="startVRMode()">START VR (META QUEST)</button>
        </div>
    </aside>

    <main class="content">
        <header class="top-bar">
            <div class="status-indicator"><span class="dot"></span> SYSTEM ONLINE</div>
            <div id="system-clock">16:32:42</div>
        </header>

        <section id="tactic-board" class="module-section active">
            <div class="board-header">
                <h2>Taktische Analyse & Training</h2>
                <div class="board-controls">
                    <button onclick="setFormation('4-4-2')">4-4-2 (Toni)</button>
                    <button onclick="setFormation('3-4-3')">3-4-3 (Gegner)</button>
                    <button class="clear-btn" onclick="initBoard()">Reset</button>
                </div>
            </div>
            <div class="pitch-area">
                <canvas id="mainTacticBoard"></canvas>
            </div>
        </section>

        <section id="locker-room" class="module-section">
            <h2>Elite Mannschaftskabine</h2>
            <div class="card-grid" id="locker-room-container"></div>
        </section>

        <section id="mgmt-lab" class="module-section">
            <h2>Strategisches Management Labor</h2>
            <div id="mgmt-content"></div>
        </section>

        <section id="press-center" class="module-section">
            <h2>Redaktions-Büro</h2>
            <div id="press-content"></div>
        </section>
    </main>

    <div id="vr-overlay">
        <a-scene embedded vr-mode-ui="enabled: true">
            <a-sky color="#020617"></a-sky>
            <a-plane position="0 0 0" rotation="-90 0 0" width="68" height="105" color="#14532d"></a-plane>
            <a-entity id="vr-players-container"></a-entity>
            <a-camera position="0 10 20"></a-camera>
        </a-scene>
        <button class="exit-vr" onclick="stopVRMode()">Beenden</button>
    </div>

    <script src="modules/management.js"></script>
    <script src="modules/newspaper.js"></script>
    <script src="script.js"></script>
</body>
</html>
