<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Coach - FIXED</title>
    <style>
        :root {
            --bg-black: #000000;
            --neon-green: #39FF14;
            --panel-gray: #0a0a0a;
            --text-white: #ffffff;
        }

        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background-color: var(--bg-black); color: var(--text-white); 
            font-family: sans-serif; overflow: hidden; 
        }

        .wrapper { display: flex; flex-direction: column; height: 100vh; }
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* SIDEBARS: Feste Breiten für Stabilität */
        .column-left { width: 100px; background: var(--panel-gray); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 20px; flex-shrink: 0; }
        .column-right { width: 220px; background: var(--panel-gray); border-left: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 20px; flex-shrink: 0; }
        .column-middle { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; background: #000; position: relative; }

        /* SPIELFELD: Hardcoded Markierungen */
        #soccer-field {
            width: 95%; max-width: 800px; aspect-ratio: 1.5;
            border: 2px solid var(--neon-green); position: relative;
            background: #000; transition: transform 0.3s;
        }

        .field-line { position: absolute; background-color: var(--neon-green); z-index: 5; }
        .center-line { left: 50%; top: 0; bottom: 0; width: 2px; }
        
        /* Diese Klassen bleiben IMMER sichtbar (außer bei Funino) */
        .standard-mark { border: 2px solid var(--neon-green); position: absolute; z-index: 5; display: block !important; opacity: 1 !important; }
        .center-circle { left: 50%; top: 50%; width: 15%; height: 22%; border-radius: 50%; transform: translate(-50%, -50%); }
        .box-16 { width: 16%; height: 44%; top: 28%; }
        .left-16 { left: 0; border-left: none; }
        .right-16 { right: 0; border-right: none; }
        .box-5 { width: 6%; height: 20%; top: 40%; }
        .left-5 { left: 0; border-left: none; }
        .right-5 { right: 0; border-right: none; }

        /* Tore */
        .goal { position: absolute; width: 6px; height: 16%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); z-index: 10; }
        .g-senior-l { left: -7px; top: 42%; }
        .g-senior-r { right: -7px; top: 42%; }

        /* UI */
        .briefcase-icon { font-size: 40px; cursor: pointer; filter: drop-shadow(0 0 5px var(--neon-green)); }
        .toni-circle { width: 80px; height: 80px; border: 2px solid var(--neon-green); border-radius: 50%; box-shadow: 0 0 10px var(--neon-green); margin-bottom: 10px; }
        .bench-area { height: 80px; background: #050505; border-top: 1px solid #1a1a1a; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }

        /* MOBILE FIX: Damit nichts mehr verschwindet */
        @media (max-width: 800px) {
            .main-content { flex-direction: column; overflow-y: auto; }
            .column-left, .column-right { width: 100%; height: auto; flex-direction: row; padding: 10px; border: none; border-bottom: 1px solid #1a1a1a; }
            .column-middle { min-height: 300px; padding: 20px 5px; }
            #soccer-field { width: 98%; }
            .column-right { border-top: 1px solid #1a1a1a; border-bottom: none; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="main-content">
            <div class="column-left">
                <div class="briefcase-icon">💼</div>
                <small style="color: #444; font-weight: bold; margin-top: 5px;">STRATEGIE</small>
            </div>

            <div class="column-middle">
                <div id="soccer-field">
                    <div class="field-line center-line"></div>
                    <div class="standard-mark center-circle"></div>
                    <div class="standard-mark box-16 left-16"></div>
                    <div class="standard-mark box-16 right-16"></div>
                    <div class="standard-mark box-5 left-5"></div>
                    <div class="standard-mark box-5 right-5"></div>
                    <div class="goal g-senior-l"></div>
                    <div class="goal g-senior-r"></div>
                </div>
            </div>

            <div class="column-right">
                <div class="toni-circle"></div>
                <strong style="color: var(--neon-green); font-size: 14px;">TONI</strong>
                <p style="font-size: 10px; color: #555; text-align: center;">System stabil.</p>
            </div>
        </div>
        <div class="bench-area">
            <span style="color: #222; font-size: 11px; font-weight: bold;">KADER</span>
        </div>
    </div>
</body>
</html>
