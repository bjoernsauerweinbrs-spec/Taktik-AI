<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | CLUB COMMAND</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="auth-layer">
        <div class="login-box">
            <i class="fa-solid fa-shield-halved" style="font-size: 50px; color: #00f3ff; margin-bottom: 20px;"></i>
            <h1>TONI 2.0</h1>
            <input type="password" id="passkey" placeholder="PASSKEY (Egal)">
            <button onclick="bootSystem()">SYSTEM STARTEN</button>
        </div>
    </main>

    <div id="main-interface" class="hidden">
        
        <header>
            <div class="logo">TONI 2.0 // <span id="active-module">DASHBOARD</span></div>
            <div class="status-bar">
                <span id="clock">00:00</span> | BUDGET: <span id="budget-display">0 €</span>
                <button onclick="toggleSettings()"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <div class="grid-container">
            <nav>
                <button onclick="loadModule('kader')"><i class="fa-solid fa-users"></i> KADER</button>
                <button onclick="loadModule('tactics')"><i class="fa-solid fa-chess-board"></i> TAKTIK</button>
                <button onclick="loadModule('office')"><i class="fa-solid fa-briefcase"></i> OFFICE</button>
                <button onclick="loadModule('youth')"><i class="fa-solid fa-child"></i> JUGEND</button>
                <button onclick="loadModule('media')"><i class="fa-solid fa-video"></i> VIDEO & PRESSE</button>
            </nav>

            <main id="content-stage"></main>

            <aside>
                <div class="ai-box">
                    <h4><i class="fa-solid fa-robot"></i> TONI AI</h4>
                    <p id="ai-message">System bereit. Warte auf Eingabe.</p>
                </div>
            </aside>
        </div>
    </div>

    <div id="modal-player" class="modal hidden">
        <div class="modal-content" id="modal-player-content">
            </div>
    </div>

    <div id="modal-video" class="modal hidden">
        <div class="modal-content video-content">
            <div class="modal-header">
                <h3>VIDEO ANALYSE</h3>
                <button onclick="closeModals()">X</button>
            </div>
            <div class="video-wrapper">
                <video id="video-player" controls></video>
                <canvas id="drawing-canvas"></canvas>
            </div>
            <div class="controls">
                <input type="file" accept="video/*" onchange="loadVideo(this)">
                <small>Video laden & Malen möglich</small>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="modal hidden">
        <div class="modal-content small-box">
            <h3>EINSTELLUNGEN</h3>
            <input type="text" placeholder="API KEY (Ollama/OpenAI)">
            <button onclick="closeModals()">SPEICHERN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
