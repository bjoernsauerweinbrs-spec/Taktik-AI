<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toni 2.0 — AI Taktik-Zentrale</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/hologram.css" />
  <link rel="stylesheet" href="css/neon-orange.css" />
  <link rel="stylesheet" href="css/analysis.css" />
  <link rel="stylesheet" href="css/aktentasche.css" />
  <link rel="stylesheet" href="css/voice.css" />
</head>
<body>

  <div id="auth-section">
    <div class="login-box">
      <h1>Toni 2.0 Login</h1>
      <input type="text" id="username" placeholder="Benutzername" />
      <input type="password" id="password" placeholder="Passwort" />
      <div class="btn-group">
        <button id="login-btn">Anmelden</button>
        <button id="register-btn">Registrieren</button>
      </div>
      <p id="status"></p>
    </div>
  </div>

  <div id="app-section" style="display:none;">
    <header class="site-header">
      <h1 class="logo">TONI 2.0</h1>
      <nav class="main-nav">
        <button id="open-board">Taktikboard</button>
        <button id="open-aktentasche">Aktentasche</button>
        <button id="logout-btn">Abmelden</button>
      </nav>
    </header>

    <main class="app-container">
      <section id="board-container">
        <canvas id="arena-canvas"></canvas>
        <div id="taktik-tools" class="tools-panel"></div>
      </section>

      <section id="aktentasche-container" style="display:none;">
        <nav id="aktentasche-nav"></nav>
        <div id="aktentasche-content"></div>
      </section>
    </main>

    <div id="voice-overlay" class="hidden">
      <div id="voice-status">Toni hört zu...</div>
      <div id="voice-transcript"></div>
    </div>
    <div id="toni-hologram"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

  <script src="engine/arena.js"></script>
  <script src="engine/players.js"></script>
  <script src="engine/tools.js"></script>
  <script src="engine/sequencer.js"></script>
  <script src="engine/dragdrop.js"></script>

  <script src="ui/aktentasche-ui.js"></script>
  <script src="ui/analysis-center-ui.js"></script>
  <script src="ui/beratung-ui.js"></script>
  <script src="ui/kader-ui.js"></script>
  <script src="ui/sponsoring-ui.js"></script>
  <script src="ui/sportwatch-ui.js"></script>
  <script src="ui/stadionzeitung-ui.js"></script>
  <script src="ui/taktikboard-ui.js"></script>
  <script src="ui/voice-ui.js"></script>

  <script src="voice/hologram-effects.js"></script>
  <script src="voice/voice-input.js"></script>
  <script src="voice/voice-output.js"></script>
  <script src="voice/voice-commands.js"></script>

  <script src="js/main.js"></script>

</body>
</html>
