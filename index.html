<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | NEURAL ELITE ENGINE</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-layer">
        <div class="auth-terminal">
            <div class="auth-inner">
                <div class="auth-brand">TONI 2.0</div>
                <div class="auth-msg">NEURAL CORE V6.0 // INITIALIZING...</div>
                <div class="input-wrapper">
                    <input type="password" id="sys-pass" placeholder="BIOMETRIC KEY" autocomplete="off">
                    <button onclick="systemBootSequence()">BOOT SYSTEM</button>
                </div>
                <div class="terminal-footer"><span>V 6.0.0 (NEURAL ENGINE)</span><span>2026 // OPS READY</span></div>
            </div>
        </div>
    </div>

    <div id="main-interface" class="hidden">
        <header class="global-header">
            <div class="header-left">
                <div class="logo">RB LEIPZIG <span style="font-size:10px; color:var(--neon-main);">// NEURAL LAB</span></div>
                <div class="breadcrumb" id="active-module-display">DASHBOARD // NEURAL ANALYTICS</div>
            </div>
            <div class="header-right">
                <div class="stat-item"><span class="label">BUDGET</span><span class="value val-pos" id="kpi-budget">--</span></div>
                <div class="stat-item"><span class="label">EPI SCORE</span><span class="value" id="kpi-epi" style="color:var(--neon-main);">--</span></div>
                <div class="sys-clock" id="clock-display">00:00</div>
                <button class="live-btn" id="live-match-btn" onclick="toggleLiveMode()"><div class="record-dot"></div> LIVE</button>
            </div>
        </header>

        <div class="workspace-grid">
            <aside class="sidebar-left">
                <div class="sidebar-header">ELITE MODULES</div>
                <div class="nav-accordion">
                    <details open>
                        <summary><i class="fa-solid fa-brain"></i> NEURAL TRAINING</summary>
                        <div class="nav-content">
                            <button class="active" onclick="loadModule('vr-hub')">OCTAGON VR 6.0</button>
                            <button onclick="loadModule('leaderboard')">LEADERBOARD</button>
                        </div>
                    </details>
                    <details open>
                        <summary><i class="fa-solid fa-clipboard-list"></i> MANAGEMENT</summary>
                        <div class="nav-content">
                            <button onclick="loadModule('kader')">KADER / STATUS</button>
                            <button onclick="loadModule('finance')">FINANZ LABOR</button>
                            <button onclick="loadModule('scouting')">MATCH PREP</button>
                        </div>
                    </details>
                    <details>
                        <summary><i class="fa-solid fa-microchip"></i> TOOLS</summary>
                        <div class="nav-content">
                            <button onclick="loadModule('tactics')">TAKTIK BOARD</button>
                            <button onclick="loadModule('drills')">PLANNER</button>
                            <button onclick="loadModule('stadionzeitung')">NEWS CMS</button>
                        </div>
                    </details>
                </div>
            </aside>

            <main class="center-stage">
                <div id="content-viewport"></div>
                
                <div id="vr-viewport" class="hidden">
                    <a-scene embedded loading-screen="dotsColor: #00ff41; backgroundColor: black">
                        <a-assets>
                            <audio id="snd-pass" src="https://actions.google.com/sounds/v1/sports/kickball.ogg" preload="auto"></audio>
                            <audio id="snd-fail" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
                        </a-assets>

                        <a-entity id="player-rig" position="0 0 0">
                            <a-camera id="vr-cam" look-controls wasd-controls position="0 1.6 0">
                                <a-entity position="0 0 -1">
                                    <a-plane width="1.2" height="0.4" material="color: black; opacity: 0.9" position="0 -0.6 0"></a-plane>
                                    <a-text id="vr-hud-text" value="NEURAL SYNCING..." position="0 -0.55 0.01" align="center" width="2" color="#00ff41"></a-text>
                                    <a-box id="hud-timing-bar" position="0 -0.75 0.01" width="1" height="0.03" color="#333"></a-box>
                                    <a-ring id="scan-indicator" position="0 0 0" radius-inner="0.02" radius-outer="0.03" color="#ff2a2a" opacity="0.5"></a-ring>
                                </a-entity>
                            </a-camera>
                        </a-entity>

                        <a-sky color="#020202"></a-sky>
                        <a-plane rotation="-90 0 0" width="100" height="100" material="src: url(https://cdn.aframe.io/a-painter/images/floor.jpg); repeat: 40 40; color: #111; roughness: 0.8;"></a-plane>
                        <a-grid position="0 0.01 0" width="100" height="100" color="#00ff41" opacity="0.2"></a-grid>

                        <a-entity id="target-L" position="-10 0 -2"><a-cylinder radius="0.5" height="2.5" color="#111" material="opacity: 0.8; wireframe: true"></a-cylinder><a-text id="icon-L" value="X" color="red" align="center" position="0 1.5 0.5" width="12"></a-text></a-entity>
                        <a-entity id="target-R" position="10 0 -2"><a-cylinder radius="0.5" height="2.5" color="#111" material="opacity: 0.8; wireframe: true"></a-cylinder><a-text id="icon-R" value="X" color="red" align="center" position="0 1.5 0.5" width="12"></a-text></a-entity>
                        <a-entity id="target-DL" position="-6 0 -12"><a-cylinder radius="0.5" height="2.5" color="#111" material="opacity: 0.8; wireframe: true"></a-cylinder><a-text id="icon-DL" value="X" color="red" align="center" position="0 1.5 0.5" width="12"></a-text></a-entity>
                        <a-entity id="target-DR" position="6 0 -12"><a-cylinder radius="0.5" height="2.5" color="#111" material="opacity: 0.8; wireframe: true"></a-cylinder><a-text id="icon-DR" value="X" color="red" align="center" position="0 1.5 0.5" width="12"></a-text></a-entity>

                        <a-entity id="shadow-defender" position="0 1.25 -8">
                            <a-box width="0.8" height="2.5" depth="0.2" color="#ff2a2a" material="opacity: 0.3; transparent: true">
                                <a-text value="AI DEFENDER" align="center" position="0 1.5 0" width="4"></a-text>
                            </a-box>
                        </a-entity>

                        <a-sphere id="vr-ball" position="0 0.22 -20" radius="0.25" color="white" material="roughness: 0.4; metalness: 0.1"></a-sphere>

                        <a-light type="ambient" color="#333"></a-light>
                        <a-light type="point" position="0 10 0" intensity="1" color="#00ff41"></a-light>
                    </a-scene>
                    <button class="vr-exit-btn" onclick="exitVRMode()"><i class="fa-solid fa-power-off"></i> ABBRUCH</button>
                </div>
            </main>

            <aside class="sidebar-right">
                <div class="toni-visualizer">
                    <div class="brain-mesh"><i class="fa-solid fa-brain"></i></div>
                    <div style="font-size:10px; letter-spacing:2px; color:var(--neon-main);">NEURAL LINK ACTIVE</div>
                </div>
                <div class="chat-container" id="chat-stream"></div>
                <div class="telemetry-widget">
                    <h4>LIVE AI FEEDBACK</h4>
                    <div class="metric-row"><span>EPI INDEX</span><div class="bar-bg"><div class="bar-fill" id="bar-epi" style="width:0%"></div></div><span id="val-epi">0%</span></div>
                    <div class="metric-row"><span>COG LOAD</span><div class="bar-bg"><div class="bar-fill" id="bar-load" style="width:0%; background:var(--neon-warn);"></div></div><span id="val-load">0ms</span></div>
                </div>
                <div class="chat-input-wrapper">
                    <textarea id="toni-input" placeholder="Frag TONI nach deiner Performance..."></textarea>
                    <button class="send-btn" onclick="askToni()">ANALYSE</button>
                </div>
            </aside>
        </div>
    </div>

    <div id="modal-player-editor" class="hidden modal-overlay">
        <div class="modal-window">
            <div class="modal-header"><h3>SPIELER-PROFIL</h3><button onclick="closeModal('modal-player-editor')"><i class="fa-solid fa-times"></i></button></div>
            <div class="modal-body">
                <input type="hidden" id="edit-p-id">
                <div class="form-group"><label>Name</label><input type="text" id="edit-p-name"></div>
                <div class="form-row"><div class="form-group"><label>Position</label><input type="text" id="edit-p-pos"></div><div class="form-group"><label>Rating</label><input type="number" id="edit-p-rating"></div></div>
                <div class="form-group"><label>Status</label><select id="edit-p-med"><option value="Fit">Fit</option><option value="Reha">Reha</option><option value="Verletzt">Verletzt</option></select></div>
            </div>
            <div class="modal-footer"><button class="btn-save" onclick="savePlayerChanges()">UPDATE</button></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
