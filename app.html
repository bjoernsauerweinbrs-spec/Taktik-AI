<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni 2.0 - Taktik-Zentrale</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="app">
        <div id="main">
            <div class="top-controls" style="position: absolute; top: 20px; z-index: 100; display: flex; gap: 10px;">
                <button class="btn primary" onclick="resetBoard()">⚽ GRUNDORDNUNG</button>
                <div style="background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 8px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.1);">
                    <button class="btn" onclick="prevPhase()" style="background: none; color: white; padding: 0;">◀</button>
                    <span id="playlist-title" style="font-weight: 600; min-width: 100px; text-align: center;">Übung 1</span>
                    <button class="btn" onclick="nextPhase()" style="background: none; color: white; padding: 0;">▶</button>
                </div>
            </div>

            <div id="board-container"></div>
        </div>

        <div class="sidebar">
            <div class="header">
                <span style="color: #2ecc71;">●</span> TONI ANALYSE-BOT
            </div>
            
            <div id="chat-history">
                </div>

            <div class="input-row">
                <button class="btn" onclick="startMic()" style="background: #1e293b; color: white;">🎙️</button>
                <input type="text" id="user-input" placeholder="Anweisung an Toni..." onkeypress="if(event.key==='Enter') askToni()">
                <button class="btn primary" onclick="askToni()">OK</button>
            </div>

            <div class="action-buttons" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;">
                <button class="btn" onclick="welcomeFlow()">👋 Gruß</button>
                <button class="btn" onclick="toggleKader()">📋 Kader</button>
                <button class="btn primary" onclick="askToniTaktik()" title="Nagelsmann-Analyse">📊 Taktik-Check</button>
                <button class="btn" onclick="askToniPressing()" title="Klopp-Analyse">⚡ Pressing-Check</button>
                <button class="btn primary" style="grid-column: span 2; background: #3498db; color: white;" onclick="exportPlanPDF()">📄 Trainingsplan PDF</button>
            </div>
        </div>
    </div>

    <div id="login-overlay" style="position: fixed; inset: 0; background: #050608; display: flex; align-items: center; justify-content: center; z-index: 10000;">
        <div style="background: #0f172a; padding: 40px; border-radius: 20px; border: 1px solid #2ecc71; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 50px rgba(46, 204, 113, 0.2);">
            <h1 style="color: white; margin-bottom: 10px; font-weight: 800;">COACH LOGIN</h1>
            <p style="color: #94a3b8; margin-bottom: 25px;">Bitte Identität bestätigen</p>
            
            <input type="password" id="password" placeholder="Trainer-Passwort" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none;">
            
            <input type="password" id="user-groq-key" placeholder="Groq API-Key (gsk_...)" style="width: 100%; padding: 12px; margin-bottom: 25px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none;">
            
            <button onclick="startToni()" style="width: 100%; padding: 15px; background: #2ecc71; color: #050608; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">System initialisieren</button>
            
            <p style="color: #475569; font-size: 0.75rem; margin-top: 20px;">Der API-Key wird nur für diese Sitzung verwendet.</p>
        </div>
    </div>

    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/logic.js"></script>

</body>
</html>
