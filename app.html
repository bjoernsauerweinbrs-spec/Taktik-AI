<script>
    // ZENTRALE STEUERUNG FÜR CHAT-VERSAND
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(text !== "" && window.ToniCore) {
            ToniCore.processMessage(text);
            input.value = "";
        }
    }

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    window.addEventListener('load', function() {
        // Initialisierung der Arena
        if(window.arena) arena.init('main-canvas');
        
        // Initialisierung der Zentrale
        if(window.BriefcaseUI) BriefcaseUI.init();
        
        // Internationaler System-Check
        setTimeout(() => {
            if(window.ToniCore) {
                console.log("TONI 2.0: International Core Online.");
                document.getElementById('toni-status-text').innerText = "SYSTEM BEREIT [PRO]";
            }
        }, 500);
    });
</script>
