<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - High-Performance Ginga Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="pro-layout-container">
    <aside class="sidebar-minimal">
        <div class="control-unit" onclick="BriefcaseUI.toggle()">
            <i class="fas fa-briefcase"></i>
            <span style="font-size: 0.5rem; font-weight: 900; color: var(--neon-green);">ZENTRALE</span>
        </div>
        <div class="control-unit" onclick="ToniTTS.test()">
            <i class="fas fa-microphone-alt"></i>
            <span style="font-size: 0.5rem; font-weight: 900;">TONI LIVE</span>
        </div>
        <hr style="width: 40%; border: 0.5px solid rgba(57, 255, 20, 0.2); margin-bottom: 25px;">
        <button class="control-unit" style="background:none; border:none;" onclick="arena.applyTacticalPattern('pressing')">
            <i class="fas fa-fire" style="color: var(--accent-orange);"></i>
        </button>
        <button class="control-unit" style="background:none; border:none;" onclick="arena.resetBoard()">
            <i class="fas fa-undo" style="color: var(--text-dim);"></i>
        </button>
    </aside>

    <main id="stage-container">
        <canvas id="main-canvas"></canvas>
    </main>

    <section class="analysis-panel">
        <div style="padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <h2 style="font-size: 0.7rem; letter-spacing: 3px; color: var(--neon-green); margin: 0;">PERFORMANCE FEED</h2>
        </div>
        <div id="setcard-content" style="padding: 20px;">
            <div style="background: rgba(57, 255, 20, 0.05); padding: 15px; border-radius: 10px; border-left: 3px solid var(--neon-green);">
                <div style="font-size:0.8rem; font-weight:bold; color:#fff;">GINGA DEEP ANALYSIS</div>
            </div>
        </div>
        <div class="chat-container">
            <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 15px;"></div>
            <div style="padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.3);">
                <input type="text" id="chat-input" placeholder="Taktik fragen...">
                <button onclick="ToniCore.processMessage(document.getElementById('chat-input').value)" style="background: var(--neon-green); border: none; padding: 10px;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </section>
</div>

<div id="briefcase-overlay" class="briefcase-overlay">
    <div class="briefcase-window">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 id="sector-title" style="color:var(--neon-green);">ZENTRALE</h2>
            <button onclick="BriefcaseUI.toggle()" style="background:none; border:none; color:#fff; font-size:2rem;">&times;</button>
        </div>
        <div id="briefcase-nav"></div>
        <div id="briefcase-content" class="hidden"><div id="active-content"></div></div>
    </div>
</div>

<script src="logic/toni-tts.js"></script>
<script src="logic/toni-core.js"></script>
<script src="ui/sektoren/sektor-sporttasche.js"></script>
<script src="ui/sektoren/sektor-system.js"></script>
<script src="ui/sektoren/sektor-analyse.js"></script>
<script src="ui/sektoren/sektor-templates.js"></script>
<script src="ui/briefcase-main.js"></script>
<script src="engine/arena.js"></script>
<script>
    window.addEventListener('load', () => {
        arena.init('main-canvas');
        BriefcaseUI.init();
    });
</script>
</body>
</html>
