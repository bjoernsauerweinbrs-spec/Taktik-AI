<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni 2.0 - Elite Interface</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        :root { --ginga-green: #2ecc71; --bg-dark: #0d1117; --panel-dark: #161b22; --border: #30363d; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; overflow: hidden; }

        body:not(.authorized) { display: none; }
        .main-layout { display: flex; height: 100vh; width: 100vw; }

        /* Sidebar Links: Koffer */
        aside#left-sidebar { width: 80px; background: var(--panel-dark); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        .icon-btn { font-size: 32px; cursor: pointer; margin-bottom: 30px; transition: transform 0.2s; filter: drop-shadow(0 0 5px rgba(46, 204, 113, 0.3)); }

        /* Spielfeld-Zentrum */
        main { flex-grow: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #setup-overlay { 
            position: absolute; inset: 0; background: radial-gradient(circle, #161b22 0%, #0d1117 100%); 
            z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }

        #pitch { 
            display: none; width: 950px; height: 600px; background: #1a3a1a; 
            position: relative; border-radius: 8px; box-shadow: 0 0 80px rgba(0,0,0,1);
        }
        canvas { border-radius: 8px; }

        /* Rechter Chat & Voice */
        aside#right-sidebar { width: 380px; background: var(--panel-dark); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        #chat-history { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .chat-input-area { padding: 20px; border-top: 1px solid var(--border); background: var(--panel-dark); }
        .input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        textarea { flex-grow: 1; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 12px; padding: 12px; resize: none; outline: none; font-size: 14px; }
        
        .mic-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #30363d; color: white; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .mic-btn.active { background: #f85149; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { transform: scale(1); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .btn-send { background: var(--ginga-green); color: black; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }

        /* Aktentasche Modal */
        #briefcase-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; }
        .modal-content { background: var(--panel-dark); height: 90vh; width: 95vw; max-width: 1200px; margin: 5vh auto; border-radius: 20px; border: 1px solid var(--ginga-green); display: flex; flex-direction: column; overflow: hidden; }
        .modal-tabs { display: flex; background: #21262d; border-bottom: 1px solid var(--border); }
        .tab-btn { padding: 20px 30px; cursor: pointer; font-weight: bold; color: #8b949e; border-right: 1px solid var(--border); transition: 0.2s; }
        .tab-btn.active { background: var(--ginga-green); color: black; }
        .tab-content { flex-grow: 1; padding: 30px; overflow-y: auto; }
    </style>
</head>
<body class="authorized">

    <div class="main-layout">
        <aside id="left-sidebar">
            <div class="icon-btn" onclick="toggleBriefcase()" title="Aktentasche">💼</div>
            <div style="margin-top: auto; padding-bottom: 20px; color: var(--ginga-green); font-size: 10px; font-weight: 900; transform: rotate(-90deg);">ELITE TACTICS</div>
        </aside>

        <main>
            <div id="setup-overlay">
                <div style="font-size: 60px; margin-bottom: 20px;">⚽</div>
                <h1 style="color:var(--ginga-green); font-size: 32px; letter-spacing: 2px;">SYSTEM BEREIT</h1>
                <p id="setup-status" style="color: #8b949e;">Initialisiere Toni AI Coaching...</p>
            </div>
            <div id="pitch">
                </div>
        </main>

        <aside id="right-sidebar">
            <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 900; color: var(--ginga-green);">TONI AI COACH</span>
                <span id="connection-status" style="font-size: 10px; color: #2ecc71;">● ONLINE</span>
            </div>
            <div id="chat-history"></div>
            <div class="chat-input-area">
                <div class="input-row">
                    <textarea id="user-msg" rows="2" placeholder="Sprechen oder tippen..."></textarea>
                    <button id="start-mic" class="mic-btn" onclick="toggleVoice()">🎤</button>
                </div>
                <button class="btn-send" onclick="handleToniAction()">ANALYSE STARTEN</button>
            </div>
        </aside>
    </div>

    <div id="briefcase-modal">
        <div class="modal-content">
            <div class="modal-tabs">
                <div id="tab-kader" class="tab-btn active" onclick="switchTab('kader')">KADER</div>
                <div id="tab-analyse" class="tab-btn" onclick="switchTab('analyse')">KI-VIDEO</div>
                <div id="tab-match" class="tab-btn" onclick="switchTab('match')">MATCH</div>
                <div id="tab-training" class="tab-btn" onclick="switchTab('training')">ORDNER</div>
                <div style="margin-left: auto; padding: 20px; cursor: pointer; color: #f85149;" onclick="toggleBriefcase()">✖</div>
            </div>
            <div id="tab-content-area" class="tab-content"></div>
        </div>
    </div>

    <script src="js/logic.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    
    <script>
        // Check Login
        if(sessionStorage.getItem('toni_auth') !== 'true') { 
            window.location.href = 'index.html'; 
        } else { 
            document.body.classList.add('authorized'); 
        }

        function toggleBriefcase() {
            const m = document.getElementById('briefcase-modal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
            if(m.style.display === 'block') switchTab('kader');
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
            if(window.loadTabContent) window.loadTabContent(t);
        }
    </script>
</body>
</html>
