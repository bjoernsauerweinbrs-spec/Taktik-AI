<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - PRO MATCHDAY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body>
    <div class="pro-layout-container">
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="window.BriefcaseUI.toggle('sporttasche')"><i class="fas fa-briefcase"></i></div>
            <div class="control-unit" onclick="window.BriefcaseUI.toggle('analyse')"><i class="fas fa-chart-line"></i></div>
            <div class="control-unit" onclick="window.BriefcaseUI.toggle('system')"><i class="fas fa-cog"></i></div>
        </nav>
        <main id="stage-container">
            <canvas id="main-canvas"></canvas>
            <div id="toni-status-bar">SYSTEM: <span id="status-text">READY</span></div>
        </main>
        <aside class="analysis-panel">
            <div id="chat-messages"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Befehl...">
                <button id="send-btn">Senden</button>
            </div>
        </aside>
    </div>
    <div id="briefcase-overlay" class="briefcase-overlay" style="display:none;">
        <div class="briefcase-window"><div id="active-content"></div></div>
    </div>

    <!-- Logic -->
    <script src="logic/event-bus.js"></script>
    <script src="logic/database.js"></script>
    <script src="logic/llm-gateway.js"></script>
    <script src="logic/toni-core.js"></script>

    <!-- Engine -->
    <script src="engine/arena.js"></script>

    <!-- UI -->
    <script src="ui/briefcase-ui.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-system.js"></script>

    <script>
    /* Deterministic bootstrap sequence to avoid race conditions */
    async function bootstrap() {
        try {
            // 1) Init DB (seed + emit)
            if (window.ToniDB && typeof window.ToniDB.init === 'function') {
                window.ToniDB.init();
                console.log('[BOOT] ToniDB initialized');
            } else {
                console.error('[BOOT] ToniDB missing');
            }

            // 2) Init Arena (subscribes to players:updated)
            if (window.arena && typeof window.arena.init === 'function') {
                window.arena.init('main-canvas');
                console.log('[BOOT] Arena initialized');
            } else {
                console.error('[BOOT] Arena missing');
            }

            // 3) Init UI sectors (they subscribe to events)
            if (window.SektorSporttasche && typeof window.SektorSporttasche.init === 'function') {
                window.SektorSporttasche.init('active-content');
                console.log('[BOOT] SektorSporttasche initialized');
            } else if (window.SektorSporttasche && typeof window.SektorSporttasche.render === 'function') {
                window.SektorSporttasche.render();
            }

            if (window.SektorAnalyse && typeof window.SektorAnalyse.init === 'function') {
                window.SektorAnalyse.init('active-content');
            } else if (window.SektorAnalyse && typeof window.SektorAnalyse.render === 'function') {
                window.SektorAnalyse.render();
            }

            // 4) Wire up chat input
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            function sendMessage() {
                const text = input.value && input.value.trim();
                if (!text) return;
                if (window.ToniCore && typeof window.ToniCore.processMessage === 'function') {
                    window.ToniCore.processMessage(text);
                } else {
                    console.warn('[BOOT] ToniCore not available');
                }
                input.value = '';
            }
            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

            // 5) Update status bar with gateway state if available
            const statusText = document.getElementById('status-text');
            if (window.ToniGateway && window.ToniGateway.status) {
                statusText.textContent = 'GATEWAY: ' + window.ToniGateway.status.toUpperCase();
            } else {
                statusText.textContent = 'READY';
            }

            console.log('[BOOT] bootstrap completed');
        } catch (e) {
            console.error('[BOOT] bootstrap failed', e);
            const statusText = document.getElementById('status-text');
            if (statusText) { statusText.textContent = 'BOOT ERROR'; statusText.style.color = 'var(--status-error)'; }
        }
    }

    window.addEventListener('DOMContentLoaded', bootstrap);
    </script>
</body>
</html>
