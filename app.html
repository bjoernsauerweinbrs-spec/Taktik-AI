<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni 2.0 - Taktikboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: #0f1720;
            --pitch-green: #166534;
            --ginga-green: #2ecc71;
            --accent-blue: #0a74da;
            --text-light: #e6eef0;
            --line-white: rgba(255,255,255,0.6);
        }

        body { 
            margin: 0; padding: 0; height: 100vh; display: grid; 
            grid-template-columns: 320px 1fr 350px; background: #050608; 
            color: var(--text-light); font-family: 'Inter', sans-serif; overflow: hidden;
        }

        /* Sidebars */
        aside { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 800; color: var(--ginga-green); font-size: 0.9em; letter-spacing: 1px; }

        /* Main Area */
        main { display: flex; flex-direction: column; padding: 15px; gap: 15px; position: relative; }
        
        /* Top Navigation & Status */
        .top-nav { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .mode-switch { display: flex; gap: 8px; }
        .btn { padding: 8px 16px; border-radius: 20px; border: none; background: #1a232e; color: white; cursor: pointer; font-weight: 600; font-size: 0.85em; transition: 0.3s; }
        .btn.active { background: var(--accent-blue); }
        .status-light { display: flex; align-items: center; gap: 8px; font-size: 0.75em; font-weight: bold; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; }
        .dot.online { background: var(--ginga-green); box-shadow: 0 0 10px var(--ginga-green); }

        /* Spielfeld */
        #pitch-container { flex-grow: 1; background: #07101a; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        #pitch { 
            width: 900px; height: 550px; background: var(--pitch-green); border: 3px solid white; 
            position: relative; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .center-line { position: absolute; left: 50%; height: 100%; width: 2px; background: white; }
        .center-circle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; border: 2px solid white; border-radius: 50%; }
        
        /* Tore */
        .goal { position: absolute; width: 4px; height: 100px; background: white; top: 50%; transform: translateY(-50%); }
        .goal.left { left: -4px; } .goal.right { right: -4px; }
        .funino-goal { position: absolute; width: 4px; height: 40px; background: rgba(255,255,255,0.5); display: none; }

        /* Material Box */
        .material-box { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        .tool { width: 40px; height: 40px; background: #1a232e; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: grab; font-size: 1.2em; border: 1px solid rgba(255,255,255,0.1); }

        /* Chat Area */
        #chat-history { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 15px; font-size: 0.9em; line-height: 1.4; max-width: 85%; }
        .msg.toni { background: #1f2937; border-left: 4px solid var(--ginga-green); align-self: flex-start; }
        .msg.user { background: var(--accent-blue); align-self: flex-end; }
        
        .chat-input-area { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .chat-input-area input { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #07101a; color: white; outline: none; }

        /* Player Dots */
        .player { position: absolute; width: 38px; height: 38px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; cursor: move; z-index: 100; transition: transform 0.2s; }
        .player:hover { transform: scale(1.1); }
        .player.red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #b91c1c); }
        .player.blue { background: radial-gradient(circle at 30% 30%, #4d94ff, #1d4ed8); }
        .player-label { position: absolute; top: 42px; font-size: 10px; white-space: nowrap; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <aside id="squad-sidebar">
        <div class="sidebar-header">📋 KADER-MATRIX</div>
        <div id="player-list" style="flex-grow: 1; overflow-y: auto; padding: 10px;">
            </div>
        <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <button class="btn" style="width: 100%;" onclick="addNewPlayerPrompt()">+ Spieler hinzufügen</button>
        </div>
    </aside>

    <main>
        <nav class="top-nav">
            <div class="mode-switch">
                <div id="briefcase-btn" style="font-size: 1.5em; cursor: pointer; margin-right: 15px;" onclick="exportToKlemmbrett()">💼</div>
                <button id="btn-11v11" class="btn active" onclick="switchMode('11v11')">11 gegen 11</button>
                <button id="btn-training" class="btn" onclick="switchMode('training')">Training</button>
                <button id="btn-funino" class="btn" onclick="switchMode('funino')">Funino</button>
            </div>
            <div class="status-light">
                <span id="toni-status-text">TONI OFFLINE</span>
                <div id="toni-status-dot" class="dot"></div>
            </div>
        </nav>

        <div id="pitch-container">
            <div id="pitch">
                <div class="center-line"></div>
                <div class="center-circle"></div>
                <div class="goal left"></div>
                <div class="goal right"></div>
                
                <div class="funino-goal" style="left: 0; top: 20%;"></div>
                <div class="funino-goal" style="left: 0; top: 75%;"></div>
                <div class="funino-goal" style="right: 0; top: 20%;"></div>
                <div class="funino-goal" style="right: 0; top: 75%;"></div>
            </div>

            <div class="material-box">
                <div class="tool" title="Hütchen">📐</div>
                <div class="tool" title="Ball">⚽</div>
            </div>
        </div>
    </main>

    <aside id="toni-sidebar">
        <div class="sidebar-header">🧠 TONI ANALYSE</div>
        <div id="chat-history">
            <div class="msg toni">Hallo Björn! Ich habe das Board initialisiert. Welches Training planen wir heute?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Frag Toni (z.B. 'Laufweg einzeichnen')..." onkeypress="if(event.key==='Enter') handleChat()">
        </div>
    </aside>

    <script src="js/logic.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/storage.js"></script>

    <script>
        // Kleiner Wächter für den Login
        if(sessionStorage.getItem('toni_auth') !== 'true') { window.location.href = 'index.html'; }
    </script>
</body>
</html>
