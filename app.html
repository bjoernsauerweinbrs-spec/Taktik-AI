<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni 2.0 - Ginga Taktik-Plattform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar" id="aktentasche">
            <div class="sidebar-header">
                <h2><i class="fas fa-briefcase"></i> Aktentasche</h2>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li onclick="showSection('kader')"><i class="fas fa-users"></i> Kader-Management</li>
                    <li onclick="showSection('training')"><i class="fas fa-clipboard-list"></i> Matchplan</li>
                    <li onclick="showSection('video')"><i class="fas fa-video"></i> Video-Analyse</li>
                    <li onclick="showSection('export')"><i class="fas fa-save"></i> Backup & Export</li>
                </ul>
            </nav>

            <div id="sidebar-content" class="sidebar-body">
                <div class="placeholder-text">Wähle eine Sektion aus der Aktentasche.</div>
            </div>
        </aside>

        <main class="main-board">
            <header class="board-header">
                <div class="status-info">
                    <span id="pitch-label"><i class="fas fa-sync-alt fa-spin"></i> Initialisiere Arena...</span>
                </div>
                <div class="board-actions">
                    <button id="btn-save-snapshot" title="Snapshot speichern"><i class="fas fa-camera"></i></button>
                    <button id="btn-reset-board" title="Board zurücksetzen"><i class="fas fa-trash-alt"></i></button>
                    <button id="btn-skip-intro" class="btn-secondary" title="Intro überspringen">Skip</button>
                </div>
            </header>

            <div id="pitch-container" class="pitch-container">
                <svg id="pitch-lines" class="pitch-svg-layer"></svg>
                
                <div id="pitch" class="pitch-surface">
                    </div>
            </div>
        </main>

        <section class="chat-sidebar">
            <div class="chat-header">
                <div class="toni-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <h3>Toni - KI Co-Trainer</h3>
            </div>
            
            <div id="chat-messages" class="chat-body">
                </div>

            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Schreib Toni etwas..." autocomplete="off">
                <div class="input-buttons">
                    <button id="mic-btn" title="Sprachsteuerung"><i class="fas fa-microphone"></i></button>
                    <button id="send-btn" title="Senden"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

    </div>

    <script>
        if (localStorage.getItem('isAuthorized') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <script src="js/modules/database.js"></script>
    <script src="js/modules/calc.js"></script>
    <script src="js/modules/voice.js"></script>
    <script src="js/modules/commander.js"></script>
    
    <script src="js/app.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            console.log("🚀 Toni 2.0 Systemstart...");
            
            try {
                // 1. Datenbank (IndexedDB) starten
                await window.initToniDB();
                console.log("✅ Datenbank bereit.");

                // 2. Erster Gruß von Toni (Identität & Intro-Start)
                // Hinweis: Viele Browser brauchen erst eine Interaktion, 
                // bevor sie Sound abspielen. Daher triggern wir das beim ersten Klick.
                document.body.addEventListener('click', () => {
                    if (!window.introStarted) {
                        window.introStarted = true;
                        // Toni stellt sich vor
                        window.toniVoice.speak("Hallo Björn, ich bin Toni, dein KI Co-Trainer. Ich fahre die Systeme hoch.");
                    }
                }, { once: true });

            } catch (error) {
                console.error("❌ Kritischer Systemfehler:", error);
            }
        });

        // Einfache Sektions-Wechsel Logik für die Aktentasche
        function showSection(section) {
            const content = document.getElementById('sidebar-content');
            content.innerHTML = `<div class='loading-spinner'><i class='fas fa-spinner fa-spin'></i> Lade ${section}...</div>`;
            
            // Hier wird später die Logik aus der app.js aufgerufen
            if (typeof window.loadSidebarSection === "function") {
                window.loadSidebarSection(section);
            }
        }
    </script>
</body>
</html>
