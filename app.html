<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni 2.0 - Professionelles Taktik-Board</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        if(sessionStorage.getItem('toni_auth') !== 'true') { window.location.href = 'index.html'; }
    </script>

    <aside id="squad-sidebar">
        <div class="sidebar-header">
            <h2>Kader-Matrix</h2>
            <p>Anwesenheit & Ginga-Faktor</p>
        </div>
        <div id="player-list"></div>
        <div class="sidebar-footer">
            <button class="nav-btn" onclick="addNewPlayerPrompt()">+ Spieler hinzufügen</button>
        </div>
    </aside>

    <main id="main-stage">
        <nav class="top-nav">
            <div id="briefcase-btn" onclick="exportToKlemmbrett()" title="Aktentasche">💼</div>
            <div class="nav-divider"></div>
            
            <button id="btn-11v11" class="nav-btn active" onclick="switchMode('11v11')">11 gegen 11</button>
            <button id="btn-training" class="nav-btn" onclick="switchMode('training')">Training</button>
            <button id="btn-funino" class="nav-btn" onclick="switchMode('funino')">Funino</button>
            
            <div class="nav-divider"></div>
            
            <button id="btn-material" class="nav-btn" style="background:#ffeb3b; color:#333;" onclick="toggleMaterialMenu()">Material 📦</button>
            
            <div class="nav-divider"></div>
            
            <div class="color-picker-group">
                <input type="color" id="color-team-a" value="#d32f2f" title="Team Rot" onchange="updateTeamColors()">
                <input type="color" id="color-team-b" value="#ffeb3b" title="Team Gelb" onchange="updateTeamColors()">
                <input type="color" id="color-team-c" value="#1976d2" title="Team Blau" onchange="updateTeamColors()">
            </div>
        </nav>

        <div id="material-menu" style="display:none; position:absolute; top:80px; left:50%; transform:translateX(-50%); background:white; padding:15px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2); z-index:200; gap:10px;">
            <button class="nav-btn orange" onclick="placeCones(12); toggleMaterialMenu();">12 Hütchen</button>
            <button class="nav-btn blue" onclick="distributeBalls(16); toggleMaterialMenu();">16 Bälle</button>
        </div>

        <div id="pitch-container">
            <div id="pitch">
                <div class="center-line"></div>
                <div class="center-circle"></div>
            </div>
        </div>

        <div class="bottom-controls">
            <button class="nav-btn" onclick="resetBoardPositions()">Positionen Reset</button>
        </div>
    </main>

    <aside id="chat-sidebar">
        <div class="toni-profile">
            <div class="avatar">T</div>
            <div>
                <strong>Toni (Fachmann)</strong>
                <span class="status-online">● KI AKTIV</span>
            </div>
        </div>
        <div id="toni-output"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Frag Toni nach Taktik oder Übungen..." 
                   onkeypress="if(event.key === 'Enter') { handleChatInput(this.value); this.value=''; }">
        </div>
    </aside>

    <script src="js/logic.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/storage.js"></script>
</body>
</html>
