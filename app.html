<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - High-Performance Taktik</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Sidebar Fix: Vertikale Anordnung */
        .sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-top: 25px;
            background: #0a0a0a;
            border-right: 1px solid #222;
            width: 90px;
            min-width: 90px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: #888;
            margin-bottom: 5px;
        }

        /* Taktik-Steuerung KOMPAKT in der Sidebar */
        #sidebar-tactic-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 80%;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #222;
        }

        .tactic-btn {
            width: 100%;
            background: rgba(255, 149, 0, 0.05);
            border: 1px solid #ff9500;
            color: #fff;
            padding: 6px 2px;
            font-size: 0.5rem;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 900;
            transition: 0.2s;
            white-space: nowrap;
        }

        .tactic-btn:hover {
            background: #ff9500;
            color: #000;
        }

        .tactic-btn.reset {
            border-color: #555;
            color: #777;
        }

        /* Absolut freies Spielfeld */
        .arena-column {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-grow: 1;
        }

        #tactic-board {
            max-width: 98%;
            max-height: 98%;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="nav-item" onclick="BriefcaseUI.toggle()">
            <i class="fas fa-briefcase" style="font-size:20px; color:#ff9500;"></i>
            <span style="font-size: 0.5rem; margin-top: 4px;">ZENTRALE</span>
        </div>

        <div class="nav-item">
            <i class="fas fa-microphone-alt" style="font-size:20px;"></i>
            <span style="font-size: 0.5rem; margin-top: 4px;">LIVE AI</span>
        </div>

        <div id="sidebar-tactic-controls">
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('pressing')">🔥 PRESSING</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('overload')">🚀 ÜBERZAHL</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('compact')">🛡️ KOMPAKT</button>
            <button class="tactic-btn reset" onclick="arena.resetBoard()">🔄 RESET</button>
        </div>
    </aside>

    <main class="arena-column">
        <canvas id="tactic-board"></canvas>
    </main>

    <section class="chat-column">
        <div class="feed-header">LIVE-FEED</div>
        <div id="chat-messages" class="chat-area"></div>
        <div class="voice-advisor-label">TONI VOICE ADVISOR</div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Taktik fragen...">
            <button id="send-btn"><i class="fas fa-arrow-right"></i></button>
        </div>
    </section>
</div>

<div id="briefcase-overlay" class="hidden">
    <div class="briefcase-window">
        <div class="briefcase-header" style="display:flex; justify-content:space-between; align-items:center;">
            <h2 id="sector-title" style="margin:0; color:#ff9500;">ZENTRALE</h2>
            <button onclick="BriefcaseUI.toggle()" style="background:none; border:none; color:#fff; font-size:1.5rem;">&times;</button>
        </div>
        <div id="briefcase-nav"></div>
        <div id="briefcase-content" class="hidden">
            <div id="active-content"></div>
        </div>
    </div>
</div>

<script src="ui/briefcase-ui.js"></script>
<script src="engine/arena.js"></script>
<script src="engine/toni-ai.js"></script>

<script>
    window.addEventListener('load', function() {
        if(window.BriefcaseUI) BriefcaseUI.init();
        if(window.arena) arena.init('tactic-board');
        if(window.ToniAI) ToniAI.init();
    });
</script>

</body>
</html>
