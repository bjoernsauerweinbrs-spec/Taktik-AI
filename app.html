<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni - Globaler Taktik-Experte & Trainer-Tool</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <aside id="squad-sidebar">
        <div style="padding: 20px; border-bottom: 1px solid #ddd;">
            <h2 style="margin: 0; font-size: 1.2em;">Kader-Matrix</h2>
            <p style="font-size: 0.8em; color: #666;">Status & Performance</p>
        </div>
        <div id="player-list">
            </div>
    </aside>

    <main id="main-stage">
        
        <nav class="top-nav">
            <div id="briefcase-btn" title="Aktentasche öffnen" onclick="toniSpeak('Ich öffne deine Aktentasche mit allen gespeicherten Plänen...')">💼</div>
            <button class="nav-btn active" onclick="switchMode('11v11')">11 gegen 11</button>
            <button class="nav-btn" onclick="switchMode('training')">Training</button>
            <button class="nav-btn" onclick="switchMode('funino')">Funino</button>
        </nav>

        <div id="pitch">
            <div class="center-line"></div>
            <div class="center-circle"></div>
            </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="nav-btn" style="background: #555; color: white;" onclick="searchTrainingNet()">Übung suchen</button>
            <button class="nav-btn" style="background: #ff9800; color: white;" onclick="toniSpeak('Ich stelle 12 gelbe Hütchen auf!', false); placeCones(12);">Hütchen aufstellen</button>
        </div>
    </main>

    <aside id="chat-sidebar">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
            <div style="width: 50px; height: 50px; background: #2e7d32; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.2em;">T</div>
            <div>
                <strong style="display: block;">Toni</strong>
                <span style="font-size: 0.75em; color: #2e7d32; font-weight: bold;">● EXPERTE ONLINE</span>
            </div>
        </div>
        
        <div id="toni-output" style="flex-grow: 1; overflow-y: auto; padding-right: 5px;">
            </div>

        <div style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px;">
            <input type="text" placeholder="Frag Toni etwas..." onkeypress="if(event.key === 'Enter') { handleChatInput(this.value); this.value=''; }" 
                   style="width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none;">
        </div>
    </aside>

    <script src="js/logic.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>

</body>
</html>
