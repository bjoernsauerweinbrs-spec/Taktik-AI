<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 | ELITE COCKPIT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <script>
        if(sessionStorage.getItem('toni_auth') !== 'true') window.location.href = 'index.html';
    </script>

    <div class="pro-layout-container">
        
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="window.BriefcaseUI.toggle()">
                <i class="fas fa-briefcase"></i>
                <span>TASCHE</span>
            </div>

            <div class="control-unit" id="ai-status-unit" title="KI-Verbindungsstatus">
                <div id="ai-status-light" style="width: 10px; height: 10px; background: #555; border-radius: 50%; margin: 0 auto 5px; transition: all 0.3s ease;"></div>
                <span id="ai-status-label" style="font-size: 0.5rem; color: #555; letter-spacing: 1px;">OFFLINE</span>
            </div>

            <div class="control-unit" id="mic-trigger">
                <i class="fas fa-microphone"></i>
                <span>TONI</span>
            </div>

            <div class="control-unit" onclick="openSection('settings')">
                <i class="fas fa-cog"></i>
                <span>SETUP</span>
            </div>

            <div class="control-unit" onclick="location.reload()">
                <i class="fas fa-sync-alt"></i>
                <span>RESET</span>
            </div>
        </nav>

        <main id="stage-container">
            <div id="equipment-palette">
                <div class="tool-btn" title="Verschieben / Auswählen" onclick="window.arena.setTool('drag')">
                    <i class="fas fa-mouse-pointer"></i>
                </div>
                <div class="tool-btn" title="Hütchen setzen" onclick="window.arena.setTool('cone')">
                    <i class="fas fa-triangle-exclamation" style="color: var(--accent-orange);"></i>
                </div>
                <div class="tool-btn" title="Ball platzieren" onclick="window.arena.setTool('ball')">
                    <i class="fas fa-futbol"></i>
                </div>
                <div class="tool-btn" title="Minitor setzen" onclick="window.arena.setTool('goal')">
                    <i class="fas fa-door-open" style="color: #fff;"></i>
                </div>
                <div class="tool-btn" title="Laufweg zeichnen" onclick="window.arena.setTool('arrow')">
                    <i class="fas fa-running" style="color: var(--neon-green);"></i>
                </div>
                <div class="tool-btn" title="Passweg zeichnen" onclick="window.arena.setTool('pass')">
                    <i class="fas fa-long-arrow-alt-right" style="color: var(--data-cyan);"></i>
                </div>
                <div class="tool-btn" title="Torschuss einzeichnen" onclick="window.arena.setTool('shot')">
                    <i class="fas fa-bolt" style="color: #ff3b30;"></i>
                </div>
                <div class="tool-btn" title="Element löschen" onclick="window.arena.setTool('delete')">
                    <i class="fas fa-eraser" style="color: var(--status-error);"></i>
                </div>
            </div>

            <canvas id="main-canvas"></canvas>
        </main>

        <aside class="analysis-panel">
            <div class="video-preview">
                <div class="scan-line"></div>
                <span>LIVE ANALYSE ACTIVE</span>
            </div>
            
            <div class="chat-container">
                <div id="chat-box">
                    <p style="color: var(--neon-green);">Toni: System bereit. Arena wird gescannt...</p>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="command-input" class="pro-textarea" style="height: 50px;" placeholder="Befehl an Toni...">
                </div>
            </div>
        </aside>
    </div>

    <div id="briefcase-modal" class="briefcase-overlay">
        <div class="briefcase-window">
            </div>
    </div>

    <script src="logic/database.js"></script>
    <script src="engine/arena.js"></script>
    <script src="ui/aktentasche-ui.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-stadion.js"></script>
    <script src="ui/sektoren/sektor-settings.js"></script>
    <script src="script.js"></script>
</body>
</html>
