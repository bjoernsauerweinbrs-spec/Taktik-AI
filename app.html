<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Toni 2.0 - Taktikboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --ginga-green: #2ecc71; --bg-dark: #0d1117; --panel-dark: #161b22; --text-gray: #8b949e; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; 
            background: var(--bg-dark); color: white; overflow: hidden;
        }

        .main-layout { display: flex; height: 100vh; width: 100vw; }

        /* Sidebar allgemein */
        aside { background: var(--panel-dark); border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        
        /* Linke Sidebar: Kader */
        #squad-sidebar { width: 280px; }
        #toni-sidebar { width: 320px; border-right: none; border-left: 1px solid #30363d; }

        .sidebar-header { 
            padding: 20px; border-bottom: 1px solid #30363d; display: flex; 
            justify-content: space-between; align-items: center; font-weight: 900; color: var(--ginga-green);
        }

        /* Spielfeld Bereich */
        main { flex-grow: 1; position: relative; background: #000; display: flex; flex-direction: column; }
        #pitch-container { flex-grow: 1; position: relative; padding: 20px; display: flex; justify-content: center; align-items: center; }
        
        #pitch { 
            width: 1000px; height: 600px; background: #1a1c1e; border: 4px solid #30363d; 
            border-radius: 10px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5);
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Spieler auf dem Feld */
        .player {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; cursor: move; transition: transform 0.2s; z-index: 10;
        }
        .player.red { background: radial-gradient(circle, #ff4d4d, #b30000); border: 2px solid white; color: white; }
        .player.blue { background: radial-gradient(circle, #3498db, #2980b9); border: 2px solid white; color: white; }
        
        .player-label {
            position: absolute; top: 45px; white-space: nowrap; font-size: 10px;
            background: rgba(0,0,0,0.7); padding: 2px 5px; border-radius: 4px;
        }

        /* Kader Liste links */
        #player-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .player-card {
            background: #0d1117; border: 1px solid #30363d; padding: 12px;
            border-radius: 8px; margin-bottom: 10px; position: relative;
        }
        .delete-btn { position: absolute; right: 8px; top: 8px; color: #f85149; cursor: pointer; font-weight: bold; }

        /* Chat Bereich rechts (FEST) */
        #chat-history { flex-grow: 1; overflow-y: auto; padding: 20px; font-size: 14px; }
        .chat-input-area { 
            padding: 20px; border-top: 1px solid #30363d; background: var(--panel-dark);
            position: sticky; bottom: 0;
        }
        #user-msg { 
            width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
            padding: 12px; color: white; resize: none; margin-bottom: 10px;
        }

        /* Die Aktentasche (Modal) */
        #briefcase-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--panel-dark); width: 80%; height: 80%; border-radius: 20px;
            border: 1px solid var(--ginga-green); padding: 30px; position: relative;
            display: flex; flex-direction: column;
        }
        .close-modal { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; }

        .btn { 
            background: #21262d; border: 1px solid #30363d; color: white; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn:hover { background: #30363d; }
        .btn-green { background: #238636; border: none; }
        .btn-green:hover { background: #2ea043; }

        .top-nav { height: 60px; border-bottom: 1px solid #30363d; display: flex; align-items: center; padding: 0 20px; gap: 20px; }
    </style>
</head>
<body>

    <div class="main-layout">
        <aside id="squad-sidebar">
            <div class="sidebar-header">
                <span id="trainer-display">TRAINER</span>
                <div id="briefcase-btn" style="cursor:pointer; font-size: 24px;" onclick="toggleBriefcase()">💼</div>
            </div>
            <div id="player-list">
                </div>
            <div style="padding: 15px;">
                <button class="btn btn-green" style="width: 100%;" onclick="addNewPlayerPrompt()">+ SPIELER HINZUFÜGEN</button>
            </div>
        </aside>

        <main>
            <div class="top-nav">
                <button class="btn" onclick="setMode('11v11')">11 vs 11</button>
                <button class="btn" onclick="setMode('training')">Training</button>
                <button class="btn" onclick="setMode('funino')">Funino</button>
                <div style="margin-left: auto; color: var(--ginga-green); font-weight: 900; letter-spacing: 2px;">GINGA SYSTEM 2.0</div>
            </div>
            <div id="pitch-container">
                <div id="pitch">
                    <svg id="drawing-layer" style="position:absolute; width:100%; height:100%; pointer-events:none;"></svg>
                </div>
            </div>
        </main>

        <aside id="toni-sidebar">
            <div class="sidebar-header">CO-TRAINER TONI</div>
            <div id="chat-history"></div>
            <div class="chat-input-area">
                <textarea id="user-msg" rows="3" placeholder="Frag Toni nach einer Taktik..."></textarea>
                <button class="btn btn-green" style="width: 100%;" onclick="handleToniAction()">TONI ANALYSIEREN LASSEN</button>
            </div>
        </aside>
    </div>

    <div id="briefcase-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleBriefcase()">×</span>
            <h2 style="color: var(--ginga-green);">💼 AKTENTASCHE - TRAINER BÜRO</h2>
            <div style="display: flex; gap: 20px; flex-grow: 1;">
                <div style="flex: 1; border: 1px solid #30363d; padding: 15px; border-radius: 10px;">
                    <h3>📋 Letztes Clipboard</h3>
                    <div id="clipboard-preview" style="background: white; color: black; height: 200px; padding: 10px; font-size: 12px;">
                        Noch kein Dokument erstellt.
                    </div>
                    <button class="btn" style="margin-top: 10px;">Drucken / PDF</button>
                </div>
                <div style="flex: 1; border: 1px solid #30363d; padding: 15px; border-radius: 10px;">
                    <h3>🍎 Ernährungsplan</h3>
                    <p style="color: #8b949e;">Stand: Januar 2026<br>Fokus: Schnellkraft & Regeneration</p>
                    <button class="btn">Ansehen</button>
                </div>
                <div style="flex: 1; border: 1px solid #30363d; padding: 15px; border-radius: 10px;">
                    <h3>⏳ Historie</h3>
                    <ul style="font-size: 13px; color: #8b949e;">
                        <li>25.01. - Taktik-Analyse 3-4-3</li>
                        <li>24.01. - Trainingseinheit "Ginga-Technik"</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="js/logic.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script>
        // Init Name
        document.getElementById('trainer-display').innerText = sessionStorage.getItem('toni_name') || 'COACH';
        
        function toggleBriefcase() {
            const modal = document.getElementById('briefcase-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }
    </script>
</body>
</html>
