<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - ELITE COCKPIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pro-cockpit">
        <aside class="sidebar-nav">
            <div id="status-dot" class="ai-status-dot status-online"></div>
            <div class="nav-item" onclick="openModule('Kabine')"><i class="fas fa-users"></i><span>KABINE</span></div>
            <div class="nav-item" onclick="openModule('Labor')"><i class="fas fa-heartbeat"></i><span>LABOR</span></div>
            <div class="nav-item" onclick="openModule('Junioren')"><i class="fas fa-award"></i><span>JUGEND</span></div>
            <div class="nav-item" style="margin-top:auto;"><i class="fas fa-cog"></i><span>SETUP</span></div>
        </aside>

        <main class="arena-main" id="arena-container">
            <canvas id="tactic-board"></canvas>
        </main>

        <aside class="comm-panel">
            <div class="chat-window" id="chat-box"></div>
            <div class="mic-section" style="height:150px; display:flex; align-items:center; justify-content:center;">
                <i class="fas fa-microphone" style="font-size:2rem; color:#333;"></i>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" onclick="if(event.target === this) toggleBriefcase()">
        <div class="briefcase-content" id="briefcase-grid">
            </div>
    </div>

    <script src="engine/database.js"></script>
    <script src="engine/toni-brain.js"></script>
    <script src="engine/pitch-engine.js"></script>
    <script src="modules/kabine.js"></script>
    <script src="modules/labor.js"></script>
    <script src="modules/junioren.js"></script>

    <script>
        function calibrate() {
            const c = document.getElementById('tactic-board');
            const container = document.getElementById('arena-container');
            // FIX: Nutzt die volle verfügbare Größe des MacBook Bildschirms
            c.width = container.clientWidth;
            c.height = container.clientHeight;
            if(window.PitchEngine) window.PitchEngine.draw();
        }

        function toggleBriefcase(show = false) {
            const ov = document.getElementById('briefcase-overlay');
            ov.style.display = show ? 'flex' : 'none';
        }

        function openModule(name) {
            const grid = document.getElementById('briefcase-grid');
            grid.innerHTML = ""; // Alten Müll löschen
            toggleBriefcase(true);
            window['Sektor' + name].render();
        }

        window.addEventListener('load', () => {
            window.PitchEngine.init();
            calibrate();
            window.ToniBrain.firstGreeting();
        });
        window.addEventListener('resize', calibrate);
    </script>
</body>
</html>
