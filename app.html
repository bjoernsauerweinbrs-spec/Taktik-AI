<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toni 2.0 — Elite Taktik Board</title>

  <!-- Styles: Hauptdatei + Animationen (werden separat angelegt) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Minimal meta info for accessibility / theme -->
  <meta name="theme-color" content="#0B0F12">
</head>
<body>
  <!-- Blackout / Ginga Start Overlay -->
  <div id="blackout" aria-hidden="false" class="blackout">
    <div class="blackout-inner">
      <div class="brand">Toni</div>
      <div id="blackout-hint" class="hint">Lade...</div>
      <!-- Dev: Skip-Button (sichtbar nur in dev-mode) -->
      <button id="skip-sequence" class="visually-hidden">Skip</button>
    </div>
  </div>

  <!-- App Shell: Header + Grid -->
  <div id="app" class="app" role="application" aria-label="Toni Taktik Board">
    <!-- Header -->
    <header class="header" role="banner">
      <div class="header-left">
        <button id="toggle-sidebar" class="icon-btn" aria-label="Aktentasche öffnen">☰</button>
        <div class="brand-small">Toni 2.0</div>
      </div>
      <div class="header-center">
        <div id="status-live" class="status">● Live‑Analyse: Aus</div>
      </div>
      <div class="header-right">
        <div class="coach">Coach Björn</div>
      </div>
    </header>

    <!-- Left: Aktentasche (single DOM element, lazy mount panels) -->
    <aside id="sidebar" class="sidebar" aria-hidden="true" role="complementary">
      <nav class="sidebar-tabs" role="tablist" aria-label="Aktentasche Tabs">
        <button data-view="chat" class="tab active" role="tab" aria-selected="true">Toni</button>
        <button data-view="roster" class="tab" role="tab">Kader</button>
        <button data-view="matchplan" class="tab" role="tab">Matchplan</button>
        <button data-view="video" class="tab" role="tab">Video</button>
      </nav>

      <div id="sidebar-content" class="sidebar-content" role="region" aria-live="polite">
        <!-- Panels werden per JS lazy gemountet -->
        <div id="panel-placeholder" class="panel-placeholder">Wähle einen Tab</div>
      </div>
    </aside>

    <!-- Main: Canvas / Pitch -->
    <main class="canvas-wrap" role="main">
      <!-- SVG container for animated construction + fallback canvas -->
      <div id="pitch-container" class="pitch-container" aria-label="Spielfeld">
        <!-- SVG for lines and animated construction -->
        <svg id="pitch-svg" width="950" height="600" viewBox="0 0 950 600" preserveAspectRatio="xMidYMid meet" class="pitch-svg" aria-hidden="false"></svg>

        <!-- Canvas fallback / rendering surface (native resolution 950x600) -->
        <canvas id="pitch-canvas" width="950" height="600" class="pitch-canvas" aria-hidden="true"></canvas>
      </div>
    </main>

    <!-- Right: Compact quick panel (optional) -->
    <aside id="quick-panel" class="quick-panel" role="complementary" aria-label="Schnellzugriff">
      <div class="qp-section">
        <h4>Analyse‑Bericht</h4>
        <div id="analysis-summary" class="analysis-summary">Toni wartet auf Daten...</div>
      </div>
      <div class="qp-section">
        <h4>Events</h4>
        <ul id="event-list" class="event-list" aria-live="polite"></ul>
      </div>
    </aside>
  </div>

  <!-- Footer / small helpers -->
  <div id="toast" class="toast" aria-live="assertive" aria-atomic="true"></div>

  <!-- App bootstrap: module loader will import js/app.js which wires EventBus, Sequencer, Sidebar API -->
  <script type="module">
    // Minimal bootstrap to attach app root and load main module.
    // The real logic lives in js/app.js and modules/* — these files will be created/filled next.
    (async function bootstrap() {
      // Feature: expose a small global for dev inspection
      window.TONI_APP = { ready: false };

      try {
        // dynamic import of main app module (must exist in repo)
        const app = await import('./js/app.js');
        if (app && typeof app.start === 'function') {
          await app.start({
            root: document.getElementById('app'),
            blackout: document.getElementById('blackout'),
            sidebar: document.getElementById('sidebar'),
            pitchSvg: document.getElementById('pitch-svg'),
            pitchCanvas: document.getElementById('pitch-canvas'),
            quickPanel: document.getElementById('quick-panel')
          });
          window.TONI_APP.ready = true;
        } else {
          console.warn('app.start not found — ensure js/app.js exports start()');
          document.getElementById('blackout-hint').textContent = 'Fehler beim Start';
        }
      } catch (err) {
        console.error('Bootstrap error', err);
        document.getElementById('blackout-hint').textContent = 'Startfehler';
      }

      // Toggle sidebar button (mobile)
      document.getElementById('toggle-sidebar').addEventListener('click', () => {
        const ev = new CustomEvent('ui:toggleSidebar', { bubbles: true });
        document.dispatchEvent(ev);
      });

      // Skip sequence (dev)
      const skipBtn = document.getElementById('skip-sequence');
      if (skipBtn) {
        skipBtn.addEventListener('click', () => {
          const ev = new CustomEvent('sequence:skip', { bubbles: true });
          document.dispatchEvent(ev);
        });
      }
    })();
  </script>
</body>
</html>
