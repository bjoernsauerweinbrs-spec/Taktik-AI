<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - Arena</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body class="pro-app">
    <div class="main-grid">
        <aside class="sidebar">
            <div class="briefcase-trigger" onclick="window.BriefcaseUI.toggle()">
                <i class="fas fa-briefcase"></i>
                <span>AKTEN-TASCHE</span>
            </div>
        </aside>

        <section class="arena-zone">
            <canvas id="main-canvas"></canvas>
            <div id="field-overlay">
                <span id="status-tag">STATUS: ONLINE</span>
            </div>
        </section>

        <aside class="toni-panel">
            <div class="video-preview">VIDEO-ANALYSE BEREIT</div>
            <div id="chat-box">
                <div class="msg"><b>Toni:</b> Hallo Björn! System bereit.</div>
            </div>
            <div class="input-row">
                <input type="text" placeholder="Taktischen Befehl geben...">
                <button><i class="fas fa-microphone"></i></button>
            </div>
        </aside>
    </div>

    <div id="briefcase-modal" class="modal-hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>MANAGEMENT ZENTRALE</h3>
                <button onclick="window.BriefcaseUI.toggle()">X</button>
            </div>
            <div id="active-content"></div> </div>
    </div>

    <script src="logic/event-bus.js"></script>
    <script src="logic/database.js"></script>
    <script src="logic/toni-core.js"></script>
    <script src="engine/arena.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-management.js"></script>

    <script>
        window.onload = () => {
            window.ToniDB.init();
            window.arena.init('main-canvas');
        };
    </script>
</body>
</html>
