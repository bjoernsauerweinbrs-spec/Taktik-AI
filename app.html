<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - High-Performance Taktik-Zentrale</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="pro-layout-container">
    <aside class="sidebar-minimal">
        <div class="control-unit" onclick="BriefcaseUI.toggle()" title="Zentrale">
            <i class="fas fa-briefcase icon"></i>
            <span style="font-size: 0.5rem; font-weight: 900;">ZENTRALE</span>
        </div>

        <div class="control-unit" onclick="ToniTTS.test()" title="Toni Voice">
            <i class="fas fa-microphone-alt icon"></i>
            <span style="font-size: 0.5rem; font-weight: 900;">LIVE AI</span>
        </div>

        <div id="sidebar-tactic-controls">
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('pressing')">🔥 PRESSING</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('overload')">🚀 ÜBERZAHL</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('compact')">🛡️ KOMPAKT</button>
            <button class="tactic-btn reset" onclick="arena.resetBoard()">🔄 RESET</button>
        </div>
    </aside>

    <main id="stage-container">
        <div id="stage">
            <canvas id="main-canvas"></canvas>
        </div>
    </main>

    <section class="analysis-panel">
        <div id="panel-header">
            <h2 style="font-size: 0.8rem; letter-spacing: 2px; color: var(--accent-orange); margin: 0;">PERFORMANCE FEED</h2>
        </div>
        
        <div id="setcard-content">
            <div class="kpi-card">
                <span style="font-size:0.6rem; color:var(--text-dim);">SYSTEM-STATUS</span>
                <div style="font-size:0.8rem; font-weight:bold; color:var(--status-fit);">ANALYSIS ONLINE</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">TONI VOICE ADVISOR</div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="login-input" style="width:100%; margin:0; padding:10px; font-size:0.8rem; text-align:left;" placeholder="Taktik fragen...">
                <button id="send-btn" class="login-btn" style="width:50px; padding:0; margin:0;"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </section>
</div>

<div id="briefcase-overlay" class="briefcase-overlay hidden">
    <div class="briefcase-window">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:15px; margin-bottom:20px;">
            <h2 id="sector-title" style="margin:0; color:var(--accent-orange); letter-spacing:3px; font-size:1.2rem;">ZENTRALE</h2>
            <button onclick="BriefcaseUI.toggle()" style="background:none; border:none; color:#fff; font-size:2rem; cursor:pointer;">&times;</button>
        </div>
        
        <div id="briefcase-nav"></div>
        
        <div id="briefcase-content" class="hidden">
            <div id="active-content"></div>
        </div>
    </div>
</div>

<script src="logic/toni-tts.js"></script>
<script src="logic/toni-core.js"></script>

<script src="ui/sektoren/sektor-sporttasche.js"></script>
<script src="ui/sektoren/sektor-system.js"></script>
<script src="ui/sektoren/sektor-analyse.js"></script>
<script src="ui/sektoren/sektor-templates.js"></script>

<script src="ui/briefcase-main.js"></script>
<script src="engine/arena.js"></script>

<script>
    window.addEventListener('load', function() {
        console.log("Toni 2.0 Engine: Booting...");
        
        // 1. Arena & Grid-System
        if(window.arena) arena.init('main-canvas');

        // 2. Datenbank-Hygiene (Musterprofi-Check gegen undefined)
        if (!localStorage.getItem('toni_players')) {
            const initialKader = [{
                id: Date.now(),
                name: "Musterprofi",
                number: "10",
                pos: "ZM",
                status: "FIT",
                weight: 78,
                height: 182
            }];
            localStorage.setItem('toni_players', JSON.stringify(initialKader));
            console.log("Database: Musterprofi initialisiert.");
        }
        
        // 3. Chat-Funktionalität
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function sendMessage() {
            const val = input.value;
            if(val && window.ToniCore) {
                const msgArea = document.getElementById('chat-messages');
                msgArea.innerHTML += `<div class="user-msg">${val}</div>`;
                ToniCore.processCommand(val);
                input.value = '';
                msgArea.scrollTop = msgArea.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

        // 4. Toni Begrüßung (verzögert für UI-Aufbau)
        setTimeout(() => {
            const coach = BriefcaseUI.clubData?.coach || "Björn";
            if(window.ToniTTS) {
                ToniTTS.speak(`System bereit. Willkommen im Analysezentrum, Coach ${coach}.`, "warm");
            }
        }, 1500);
    });
</script>

</body>
</html>
