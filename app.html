<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 - ELITE COCKPIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        #briefcase-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.96); z-index: 1000;
            display: none; backdrop-filter: blur(20px);
        }
        .hidden { display: none !important; }
        #stage-container { position: relative; overflow: hidden; flex: 1; background: #000; }
        .board-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #tactic-board { display: block; border: 1px solid rgba(57, 255, 20, 0.1); }
    </style>
</head>
<body>

    <div class="pro-layout-container">
        <aside class="sidebar-minimal">
            <div class="control-unit" id="main-mic-btn" onclick="window.ToniVoice.toggle()">
                <i class="fas fa-microphone"></i>
                <span>VOICE</span>
            </div>
            <div class="control-unit" onclick="window.BriefcaseUI.toggle()">
                <i class="fas fa-briefcase" style="color: var(--neon-green);"></i>
                <span>COCKPIT</span>
            </div>
        </aside>

        <main id="stage-container">
            <div class="board-wrapper">
                <canvas id="tactic-board"></canvas>
            </div>
        </main>

        <aside class="analysis-panel">
            <div id="live-biometrics" style="padding: 20px; border-bottom: 1px solid rgba(57, 255, 20, 0.1);">
                <h3 style="font-family:'Orbitron'; font-size: 0.6rem; color: var(--data-cyan); letter-spacing: 2px;">LIVE ANALYST</h3>
            </div>
            <div id="chat-box" style="flex:1; overflow-y:auto; padding:15px; font-size:0.8rem;">
                <div class="chat-msg system"><b>TONI:</b> System stabilisiert. Warte auf Befehl.</div>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay">
        <button id="back-to-hub" class="hidden" onclick="window.BriefcaseUI.renderMainGrid()" 
                style="position:fixed; top:40px; left:40px; z-index:1100; background:none; border:1px solid var(--neon-green); color:var(--neon-green); padding:10px 25px; font-family:'Orbitron'; cursor:pointer; font-size: 0.7rem;">
            <i class="fas fa-th"></i> ZENTRALE
        </button>
        <div id="briefcase-nav"></div>
        <div id="briefcase-content" class="hidden">
            <div id="active-content" style="padding: 60px;"></div>
        </div>
    </div>

    <script src="engine/database-core.js"></script>
    <script src="engine/voice-core.js"></script>
    <script src="engine/bridge.js"></script>
    <script src="engine/arena-core.js"></script>
    <script src="engine/mobile-tactics.js"></script>

    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-junioren.js"></script>
    <script src="ui/sektoren/sektor-stadionzeitung.js"></script>
    <script src="ui/sektoren/sektor-sponsoring.js"></script>
    <script src="ui/sektoren/sektor-videoanalyse.js"></script>
    <script src="ui/sektoren/sektor-settings.js"></script>

    <script src="ui/briefcase-ui.js"></script>

    <script>
        function calibrate() {
            const board = document.getElementById('tactic-board');
            const wrapper = board.parentElement;
            if (board && wrapper) {
                board.width = wrapper.clientWidth;
                board.height = wrapper.clientHeight;
                if(window.Arena && window.Arena.draw) window.Arena.draw();
            }
        }

        window.addEventListener('load', () => {
            calibrate();
            
            // SYSTEM-DIAGNOSE STARTEN
            console.log("--- 🔎 TONI 2.0 DIAGNOSE ---");
            const components = {
                "Datenbank": window.Database,
                "Arena-Kern": window.Arena,
                "UI-Zentrale": window.BriefcaseUI,
                "Kabine": window.SektorSporttasche,
                "Analyse": window.SektorAnalyse
            };

            for (let name in components) {
                if (components[name]) {
                    console.log(`✅ ${name}: Bereit`);
                } else {
                    console.error(`🚨 ${name}: FEHLT ODER ABGESTÜRZT! Prüfe die Datei auf 'export'-Wörter.`);
                }
            }

            if(window.Arena) window.Arena.init();
            if(window.BriefcaseUI) window.BriefcaseUI.init();
        });

        window.addEventListener('resize', calibrate);
    </script>
</body>
</html>
