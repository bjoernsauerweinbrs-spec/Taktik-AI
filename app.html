<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Coach Toni 2.0 - Taktik & Training</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* Ergänzende Styles für die neuen Funktionen direkt im Grid */
        :root {
            --bg-dark: #070c14;
            --panel-dark: #0f172a;
            --green-active: #2ecc71;
            --yellow-training: #f1c40f;
            --red-absent: #e74c3c;
            --blue-ki: #3498db;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: grid;
            grid-template-columns: 300px 1fr 350px; /* Kader | Board | Chat */
            grid-template-rows: 60px 1fr 120px;    /* Header | Main | Bank */
            height: 100vh;
        }

        /* HEADER */
        header {
            grid-column: 1 / span 3;
            background: #111b2d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid var(--green-active);
        }

        /* LINKER BEREICH: KADER & AMPELSYSTEM */
        #sidebar-left {
            grid-column: 1;
            grid-row: 2 / span 2;
            background: var(--panel-dark);
            border-right: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }

        .player-list-item {
            display: flex;
            align-items: center;
            background: #1e293b;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 6px;
            cursor: grab;
        }

        .ampel-status {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            margin-right: 10px;
            cursor: pointer;
        }

        /* MITTE: SPIELFELD */
        main {
            grid-column: 2;
            grid-row: 2;
            position: relative;
            background: #0a0f18;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #pitch {
            width: 95%;
            height: 90%;
            background-color: #1a4d2e;
            border: 4px solid #fff;
            position: relative;
            border-radius: 5px;
        }

        /* UNTEN: AUSWECHSELBÄNKE */
        #bench-area {
            grid-column: 2;
            grid-row: 3;
            background: #0d1421;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px;
        }

        .bench-box {
            width: 45%;
            border: 1px dashed #334155;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            position: relative;
        }

        .bench-label {
            position: absolute;
            top: -10px;
            left: 10px;
            background: #0d1421;
            padding: 0 5px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* RECHTS: CHAT & TONI */
        #sidebar-right {
            grid-column: 3;
            grid-row: 2 / span 2;
            background: var(--panel-dark);
            border-left: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
        }

        /* AKTENTASCHE OVERLAY */
        #aktentasche-overlay {
            display: none;
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background: #0f172a;
            z-index: 1000;
            border: 2px solid var(--green-active);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            flex-direction: column;
        }

        .aktentasche-header {
            padding: 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .aktentasche-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center;">
        <img src="assets/logo.png" alt="Logo" style="height: 40px; margin-right: 15px;">
        <h1 style="font-size: 1.2rem;">Coach Toni 2.0 <span id="display-trainer-name" style="color: var(--green-active); font-size: 0.9rem; margin-left: 15px;"></span></h1>
    </div>
    <div class="header-controls">
        <button onclick="toggleModus('11v11')" title="11 gegen 11"><i class="fas fa-users"></i></button>
        <button onclick="toggleModus('funino')" title="Funino Modus"><i class="fas fa-th-large"></i></button>
        <button onclick="openAktentasche()" title="Aktentasche öffnen"><i class="fas fa-briefcase"></i></button>
        <button onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
</header>

<aside id="sidebar-left">
    <h3 style="color: var(--green-active); border-bottom: 1px solid #334155; padding-bottom: 10px;">Kaderverwaltung</h3>
    <div id="player-pool">
        </div>
    <button onclick="addPlayerPrompt()" style="margin-top: 15px; background: #263238; border: none; color: white; padding: 10px; border-radius: 4px; cursor: pointer;">
        <i class="fas fa-plus"></i> Spieler hinzufügen
    </button>
</aside>

<main>
    <div id="pitch">
        </div>
</main>

<div id="bench-area">
    <div class="bench-box" id="bench-red">
        <div class="bench-label">Auswechselbank (Heim)</div>
    </div>
    <div class="bench-box" id="bench-blue">
        <div class="bench-label">Auswechselbank (Blau / KI)</div>
    </div>
</div>

<aside id="sidebar-right">
    <div id="chat-container" style="flex: 1; overflow-y: auto; padding: 15px;">
        </div>
    <div id="chat-input-area" style="padding: 15px; background: #111b2d;">
        <textarea id="user-input" placeholder="Toni eine Frage stellen oder Übung anfordern..." style="width: 100%; height: 60px; background: #070c14; color: #fff; border: 1px solid #334155; border-radius: 8px; padding: 8px;"></textarea>
        <button id="send-btn" style="width: 100%; margin-top: 10px; padding: 10px; background: var(--green-active); color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">
            ABSENDEN
        </button>
    </div>
</aside>

<div id="aktentasche-overlay">
    <div class="aktentasche-header">
        <h2><i class="fas fa-briefcase"></i> Aktentasche von Coach <span id="koffer-trainer-name"></span></h2>
        <button onclick="closeAktentasche()" style="background: var(--red-absent); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">X Schließen</button>
    </div>
    <div class="aktentasche-content">
        <div id="saved-trainings">
            <h3><i class="fas fa-file-pdf"></i> Trainingspläne & Archiv</h3>
            <div id="archive-list">
                </div>
        </div>
        <div id="player-stats-center">
            <h3><i class="fas fa-chart-line"></i> Spieler-Bewertungssystem</h3>
            <div id="stats-display">
                </div>
            <hr style="border: 0.5px solid #334155; margin: 20px 0;">
            <h3><i class="fas fa-apple-alt"></i> KI-Ernährungsberatung</h3>
            <div id="nutrition-advice" style="background: #1e293b; padding: 15px; border-radius: 8px; font-size: 0.9rem;">
                Wähle einen Spieler oder eine Altersgruppe, um live beraten zu werden.
            </div>
        </div>
    </div>
</div>

<script src="js/storage.js"></script>
<script src="js/logic.js"></script>
<script src="js/board.js"></script>
<script src="js/chat.js"></script>

<script>
    // Initialisierung beim Laden
    window.onload = function() {
        const config = ToniStorage.getAuthConfig();
        if (!config.apiKey) {
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('display-trainer-name').innerText = "| Coach " + config.name;
        document.getElementById('koffer-trainer-name').innerText = config.name;
        
        // Initialisiere Board und Kader
        ToniBoard.init();
    };

    function openAktentasche() {
        document.getElementById('aktentasche-overlay').style.display = 'flex';
        renderArchive();
        renderPlayerStats();
    }

    function closeAktentasche() {
        document.getElementById('aktentasche-overlay').style.display = 'none';
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
