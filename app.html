<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 | ELITE COCKPIT</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>

    <script>
        // Sicherheits-Check: Nur mit gültigem Login Zugriff gewähren
        if(sessionStorage.getItem('toni_auth') !== 'true') window.location.href = 'index.html';
    </script>

    <div class="pro-layout-container">
        
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="window.BriefcaseUI.toggle()" title="Aktentasche öffnen">
                <i class="fas fa-briefcase"></i>
                <span>TASCHE</span>
            </div>

            <div class="control-unit" id="ai-status-unit" title="KI-Verbindungsstatus">
                <div id="ai-status-light"></div>
                <span id="ai-status-label">OFFLINE</span>
            </div>

            <div class="control-unit" id="mic-trigger" onclick="window.ToniVoice.toggle()" title="Mit Toni sprechen">
                <i class="fas fa-microphone"></i>
                <span>TONI</span>
            </div>

            <div class="control-unit" onclick="openSection('settings')" title="System-Einstellungen">
                <i class="fas fa-sliders-h"></i>
                <span>SETUP</span>
            </div>

            <div class="control-unit" onclick="location.reload()" title="System Neustart">
                <i class="fas fa-sync-alt"></i>
                <span>RESET</span>
            </div>
        </nav>

        <main id="stage-container">
            <div id="equipment-palette">
                <div class="tool-btn" title="Verschieben" onclick="window.arena.setTool('drag')">
                    <i class="fas fa-mouse-pointer"></i>
                </div>
                <div class="tool-btn" title="Hütchen" onclick="window.arena.setTool('cone')">
                    <i class="fas fa-triangle-exclamation" style="color: var(--accent-orange);"></i>
                </div>
                <div class="tool-btn" title="Ball" onclick="window.arena.setTool('ball')">
                    <i class="fas fa-futbol"></i>
                </div>
                <div class="tool-btn" title="Minitor" onclick="window.arena.setTool('goal')">
                    <i class="fas fa-door-open"></i>
                </div>
                <div class="tool-btn" title="Laufweg" onclick="window.arena.setTool('arrow')">
                    <i class="fas fa-running" style="color: var(--neon-green);"></i>
                </div>
                <div class="tool-btn" title="Passweg" onclick="window.arena.setTool('pass')">
                    <i class="fas fa-long-arrow-alt-right" style="color: var(--data-cyan);"></i>
                </div>
                <div class="tool-btn" title="Torschuss" onclick="window.arena.setTool('shot')">
                    <i class="fas fa-bolt" style="color: var(--status-error);"></i>
                </div>
                <div class="tool-btn" title="Löschen" onclick="window.arena.setTool('delete')">
                    <i class="fas fa-eraser"></i>
                </div>
            </div>

            <canvas id="main-canvas"></canvas>
        </main>

        <aside class="analysis-panel">
            <div class="video-preview">
                <div class="scan-line"></div>
                <i class="fas fa-satellite-dish" style="margin-right: 10px; font-size: 0.8rem;"></i>
                <span>LIVE ANALYSE ACTIVE</span>
            </div>
            
            <div class="chat-container">
                <div id="chat-box">
                    <p style="color: var(--neon-green); font-family: monospace;">[SYSTEM]: Initialisiere Toni 2.0 Core...</p>
                    <p style="color: var(--text-dim);">Toni: System bereit, Coach. Wie gehen wir es an?</p>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="command-input" class="pro-textarea" placeholder="Befehl an Toni senden...">
                </div>
            </div>
        </aside>
    </div>

    <div id="briefcase-modal" class="briefcase-overlay">
        <div class="briefcase-window">
            </div>
    </div>

    <script src="logic/database.js"></script>
    <script src="engine/arena.js"></script>
    <script src="libs/toni-vision.js"></script> <script src="ui/aktentasche-ui.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-stadion.js"></script>
    <script src="ui/sektoren/sektor-settings.js"></script>
    <script src="ui/sektoren/sektor-management.js"></script> <script src="ui/sektoren/sektor-video.js"></script> <script src="script.js"></script>
</body>
</html>
