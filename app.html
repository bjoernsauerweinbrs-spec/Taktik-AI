<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toni 2.0 - Ginga Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>

<body class="blackout">

    <div class="dashboard">
        
        <aside class="aktentasche" id="sidebar">
            <header class="sidebar-header">
                <div class="brand">TONI 2.0</div>
                <button class="close-btn" onclick="toggleSidebar(false)">
                    <i class="fas fa-times"></i>
                </button>
            </header>
            
            <nav class="sidebar-tabs">
                <button onclick="switchTab('chat')" id="tab-chat" class="tab-link active">
                    <i class="fas fa-comment-dots"></i>
                    <span>Toni</span>
                </button>
                <button onclick="switchTab('kader')" id="tab-kader" class="tab-link">
                    <i class="fas fa-users-gear"></i>
                    <span>Kader</span>
                </button>
                <button onclick="switchTab('matchplan')" id="tab-matchplan" class="tab-link">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Plan</span>
                </button>
                <button onclick="switchTab('video')" id="tab-video" class="tab-link">
                    <i class="fas fa-video"></i>
                    <span>Video</span>
                </button>
            </nav>

            <div id="tab-content" class="sidebar-content">
                <div class="placeholder-text" style="padding: 20px; color: #666;">Warte auf System-Start...</div>
            </div>
        </aside>

        <main class="pitch-area">
            
            <header class="top-bar">
                <button class="menu-btn" onclick="toggleSidebar()">
                    <i class="fas fa-briefcase"></i>
                </button>
                <div id="status-display">Ginga-System bereit...</div>
                <div class="top-actions">
                    <span id="user-name-display">Trainer</span>
                </div>
            </header>

            <div id="canvas-wrapper" class="canvas-wrapper">
                
                <div id="start-overlay" onclick="window.ToniEvents.emit('SYSTEM:START')" style="position: absolute; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;">
                    <div style="width: 80px; height: 80px; border-radius: 50%; background: #ffd700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(255,215,0,0.4); margin-bottom: 20px;">
                        <i class="fas fa-play" style="font-size: 2rem; color: black; margin-left: 5px;"></i>
                    </div>
                    <p style="color: white; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;">Tippe zum Starten</p>
                    <small style="color: #666; margin-top: 10px;">Toni 2.0 Kalibrierung</small>
                </div>

                <div id="pitch-surface" class="pitch-surface">
                    <svg id="pitch-svg" class="pitch-svg"></svg>
                </div>
            </div>
            
        </main>
    </div>

    <script src="js/modules/eventbus.js"></script>
    <script src="js/modules/database.js"></script>
    <script src="js/modules/voice.js"></script>
    <script src="js/modules/arena.js"></script>
    <script src="js/modules/engine.js"></script>
    <script src="js/modules/roster.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
