<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | ELITE COCKPIT 2026</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        .hidden { display: none !important; }
        #main-canvas { cursor: crosshair; touch-action: none; background: #1b3d2f; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }
        
        /* Z-INDEX RECOVERY */
        .briefcase-overlay { z-index: 1000000 !important; }
        .sidebar-minimal { z-index: 100001 !important; position: relative; }
        #stage-container { z-index: 1; position: relative; background: #000; }
        
        /* FIFA MINI CARDS (BENCH) STYLES */
        #arena-bench-list { 
            display: flex; gap: 10px; padding: 15px; overflow-x: auto; 
            background: rgba(0,0,0,0.5); border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <script>
        // Sicherheits-Check: Nur mit Auth-Key betreten
        if(sessionStorage.getItem('toni_auth') !== 'true') window.location.href = 'index.html';
        
        // Globale Coach-Daten
        window.coachInfo = JSON.parse(localStorage.getItem('toni_coach_data')) || { verein: "Mein Verein", name: "Coach" };
    </script>

    <div class="pro-layout-container">
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="if(window.BriefcaseUI) window.BriefcaseUI.toggle()" title="Aktentasche">
                <i class="fas fa-briefcase"></i>
                <span>TASCHE</span>
            </div>
            
            <div class="control-unit" id="mic-trigger" onclick="if(window.BriefcaseUI) window.BriefcaseUI.toggleVoice()" title="AI Voice Control">
                <i class="fas fa-microphone" id="main-mic-btn" style="color: var(--neon-green);"></i>
                <span>TONI AI</span>
            </div>

            <div class="control-unit" onclick="window.SektorMagazin.open()" title="Stadionzeitung">
                <i class="fas fa-newspaper"></i>
                <span>MEDIA</span>
            </div>

            <div class="control-unit" onclick="window.SektorBusiness.open()" title="Sponsoring & Finanzen">
                <i class="fas fa-chart-line"></i>
                <span>BUSINESS</span>
            </div>
            
            <div class="control-unit" onclick="location.reload()" title="System Reboot">
                <i class="fas fa-sync-alt"></i>
                <span>REBOOT</span>
            </div>
        </nav>

        <main id="stage-container">
            <canvas id="tactic-board" width="1200" height="800" style="width:100%; height:calc(100% - 150px);"></canvas>
            
            <div id="arena-bench-list">
                </div>
        </main>

        <aside class="analysis-panel">
            <div class="video-preview" style="padding:20px; border-bottom:1px solid rgba(255,255,255,0.05); display: flex; align-items: center; background: rgba(0,0,0,0.3);">
                <i class="fas fa-satellite-dish" style="margin-right: 12px; font-size: 0.9rem; color: var(--neon-green); animation: pulse 2s infinite;"></i>
                <span style="font-size: 0.75rem; letter-spacing: 2px; color: #fff; font-family: 'Orbitron'; uppercase">Live-Sync: 2026 Active</span>
            </div>
            <div class="chat-container">
                <div id="chat-box"></div>
                <div class="chat-input-area">
                    <input type="text" id="command-input" placeholder="Befehl an Toni senden...">
                </div>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div class="briefcase-window">
            <div id="briefcase-nav"></div> 
            <div id="briefcase-content" class="hidden">
                <div id="active-content"></div> 
            </div>
        </div>
    </div>

    <script src="engine/database-core.js"></script>
    <script src="engine/arena-core.js"></script>
    <script src="engine/mobile-tactics.js"></script>

    <script src="ui/aktentasche-ui.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-magazin.js"></script>
    <script src="ui/sektoren/sektor-business.js"></script>
    <script src="ui/sektoren/sektor-settings.js"></script>

    <script>
        window.currentTeamContext = "Senioren"; 

        window.onload = () => {
            // 1. Datenbank & Speicher laden
            if(window.Database) window.Database.init();

            // 2. Arena initialisieren
            if(window.Arena) window.Arena.init();

            // 3. UI-Komponenten starten
            if(window.BriefcaseUI) window.BriefcaseUI.init();
            if(window.MobileTactics) window.MobileTactics.init();

            // 4. System-Ready Meldung
            setTimeout(() => {
                const chat = document.getElementById('chat-box');
                if(chat) chat.innerHTML += `<div class="chat-msg system"><b>TONI:</b> Alle Sektoren (Media, Business, Arena) synchronisiert. System 2026 bereit.</div>`;
                runToniSystemCheck();
            }, 1000);
        };

        function runToniSystemCheck() {
            const sectors = ["SektorSporttasche", "SektorAnalyse", "SektorMagazin", "SektorBusiness", "Arena", "Database"];
            sectors.forEach(s => {
                if (!window[s]) console.error(`❌ KRITISCHER FEHLER: ${s} fehlt!`);
                else console.log(`✅ MODUL AKTIV: ${s}`);
            });
        }
    </script>
</body>
</html>
