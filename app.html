<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coach Toni 2.0 – Management Plattform</title>
  
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div id="login-overlay">
    <div class="login-card">
      <h2 style="color:var(--green); margin:0">⚽ COACH TONI 2.0</h2>
      <p style="color:#9aa3ad; margin:10px 0 25px 0">System Initialisierung erforderlich</p>
      <input id="password" type="password" placeholder="Trainer2026" />
      <button onclick="startToni()">SYSTEM STARTEN</button>
    </div>
  </div>

  <div id="app">
    <div id="sidebar">
      <div class="header">TONI – STRATEGIE & TRAINING</div>
      <div id="chat-history"></div>

      <div class="sidebar-controls">
        <select id="voice-select" onchange="selectVoice(this.value)"></select>
        <select id="mode-select" onchange="setMode(this.value)">
          <option value="training">Trainingsmodus</option>
          <option value="match">Spielvorbereitung</option>
        </select>
      </div>

      <div class="input-row">
        <button onclick="startMic()">🎤</button>
        <input id="user-input" placeholder="Anweisung..." onkeypress="if(event.key==='Enter') askToni()" />
        <button onclick="askToni()">OK</button>
      </div>

      <div class="action-buttons" style="display:flex; gap:5px; margin-top:10px;">
        <button class="btn" onclick="welcomeFlow()">👋 Gruß</button>
        <button class="btn" onclick="toggleKader()">📋 Kader</button>
        <button class="btn primary" onclick="exportPlanPDF()">📄 PDF</button>
      </div>
    </div>

    <div id="main">
      <div class="top-controls">
        <button class="btn primary" onclick="resetBoard()">♻ GRUNDORDNUNG</button>
        <div id="playlist-bar">
          <button class="btn" onclick="prevPhase()">◀</button>
          <span id="playlist-title">Übung 1 von 1</span>
          <button class="btn" onclick="nextPhase()">▶</button>
          <button class="btn" onclick="addPhase()">＋ Phase</button>
        </div>
        <div class="timer-box">
          <span id="timer-display">00:00</span>
          <button class="btn" onclick="startTimer()">Start</button>
          <button class="btn" onclick="stopTimer()">Stop</button>
        </div>
      </div>

      <div id="pitch-area">
        <div id="pitch">
          <div class="goal l-goal"></div><div class="goal r-goal"></div>
          <div class="m-line"></div><div class="m-circle"></div>
          <svg id="exercise-svg" viewBox="0 0 1000 600" preserveAspectRatio="none"></svg>
          
          <div id="bank">
            <h5>Bank / Reserve</h5>
            <div id="bank-list"></div>
          </div>
          
          <div id="ball"></div>
          <div id="players-layer"></div>
        </div>

        <div id="coaching-panel">
          <h4>Strategische Coaching-Points</h4>
          <ol id="coaching-list"></ol>
        </div>
      </div>
    </div>
  </div>

  <div id="whiteboard">
    <h3>📋 Kader-Management</h3>
    <textarea id="player-list-raw" placeholder="1 Neuer red..."></textarea>
    <button class="btn primary" onclick="syncNames()" style="width:100%">Kader Synchronisieren</button>
    <div id="attendance-list" style="margin-top:15px; max-height:200px; overflow-y:auto;"></div>
    <button class="btn" onclick="toggleKader()" style="width:100%; margin-top:10px;">Schließen</button>
  </div>

  <script src="js/chat.js"></script>
  <script src="js/board.js"></script>
  <script src="js/logic.js"></script>

</body>
</body>
</html>
