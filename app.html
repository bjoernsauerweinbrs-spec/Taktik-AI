<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - High-Performance Taktik</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="nav-item" onclick="BriefcaseUI.toggle()">
            <img src="assets/briefcase-icon.png" alt="Zentrale" style="width:40px;">
            <span>ZENTRALE</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-microphone-alt" style="font-size:24px;"></i>
            <span>LIVE AI</span>
        </div>
    </aside>

    <main class="arena-column">
        <div id="tactic-controls">
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('pressing')">🔥 PRESSING</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('overload')">🚀 ÜBERZAHL</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('compact')">🛡️ KOMPAKT</button>
            <button class="tactic-btn reset" onclick="arena.resetBoard()">🔄 RESET</button>
        </div>
        <canvas id="tactic-board"></canvas>
    </main>

    <section class="chat-column">
        <div class="feed-header">LIVE-FEED</div>
        <div id="chat-messages" class="chat-area">
            </div>

        <div class="voice-advisor-label">TONI VOICE ADVISOR</div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Taktik fragen...">
            <button id="send-btn"><i class="fas fa-arrow-right"></i></button>
        </div>
    </section>
</div>

<div id="briefcase-overlay" class="hidden">
    <div class="briefcase-window">
        <div class="briefcase-header">
            <h2 id="sector-title">ZENTRALE</h2>
            <button class="close-btn" onclick="BriefcaseUI.toggle()">BEENDEN</button>
        </div>
        <div id="briefcase-nav" class="folder-grid">
            <div class="folder" onclick="BriefcaseUI.switchSektor('sport')">👟 SPORTTASCHE</div>
            <div class="folder" onclick="BriefcaseUI.switchSektor('marketing')">📢 MARKETING</div>
            <div class="folder" onclick="BriefcaseUI.switchSektor('system')">📁 SYSTEM-ORDNER</div>
        </div>
        <div id="briefcase-content" class="hidden">
            <button class="back-btn" onclick="BriefcaseUI.backToNav()">← ZURÜCK</button>
            <div id="active-content"></div>
        </div>
    </div>
</div>

<script src="ui/briefcase-ui.js"></script>
<script src="engine/arena.js"></script>
<script src="engine/toni-ai.js"></script>

<script>
    window.onload = () => {
        arena.init('tactic-board');
        ToniAI.init();
    };
</script>

</body>
</html>
