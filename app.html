<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Toni 2.0 - Tactical Simulation</title>
    <style>
        :root {
            --pitch-green: #1a3a1a; /* Dunkleres, fokussiertes Grün */
            --line-color: rgba(255,255,255,0.8);
            --zone-line: rgba(255,255,255,0.15);
            --sidebar-bg: #0d1117;
            --accent-ginga: #2ecc71;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; display: grid; grid-template-columns: 300px 1fr 350px; height: 100vh; background: #050505; color: white; overflow: hidden; }

        /* Sidebars */
        #squad-sidebar, #toni-sidebar { background: var(--sidebar-bg); border: 1px solid #222; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: 800; color: var(--accent-ginga); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }

        /* Main Stage */
        #main-stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; padding: 20px; }
        
        /* Controls */
        .top-controls { position: absolute; top: 20px; width: 95%; display: flex; justify-content: space-between; z-index: 100; }
        .mode-group { display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 12px; backdrop-filter: blur(5px); }
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid #333; background: #111; color: white; cursor: pointer; font-weight: bold; }
        .btn.active { background: var(--accent-ginga); color: black; border-color: var(--accent-ginga); }

        /* Spielfeld & Raster */
        #pitch { 
            width: 950px; height: 600px; background: var(--pitch-green); 
            border: 4px solid var(--line-color); position: relative; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* 16-Meter-Räume & Linien */
        .penalty-area { position: absolute; border: 3px solid var(--line-color); width: 160px; height: 320px; top: 50%; transform: translateY(-50%); }
        .penalty-area.left { left: 0; border-left: none; }
        .penalty-area.right { right: 0; border-right: none; }
        .center-circle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; border: 3px solid var(--line-color); border-radius: 50%; }
        .mid-line { position: absolute; left: 50%; height: 100%; width: 3px; background: var(--line-color); }

        /* Positionsspiel-Raster (Unsichtbare Zonen) */
        .zone-layer { position: absolute; inset: 0; display: grid; grid-template-columns: 15% 20% 30% 20% 15%; pointer-events: none; }
        .zone-col { border-right: 1px dashed var(--zone-line); height: 100%; }
        
        /* Tore */
        .goal { position: absolute; width: 10px; height: 80px; background: #fff; box-shadow: 0 0 15px white; }
        .goal.l { left: -12px; top: 260px; }
        .goal.r { right: -12px; top: 260px; }

        /* Chat & Input */
        #chat-history { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 10px; font-size: 14px; max-width: 85%; line-height: 1.5; }
        .msg.toni { background: #1c2128; border-left: 4px solid var(--accent-ginga); align-self: flex-start; }
        .msg.user { background: #238636; align-self: flex-end; }
        .chat-input-row { padding: 15px; border-top: 1px solid #222; display: flex; gap: 10px; }
        .chat-input-row input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0d1117; color: white; }

        /* Spieler & Pfeile */
        .player { position: absolute; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; cursor: move; z-index: 100; border: 2px solid white; transition: transform 0.1s; }
        .player.red { background: radial-gradient(circle at 30% 30%, #ff4d4d, #b91c1c); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .player.blue { background: radial-gradient(circle at 30% 30%, #4d94ff, #1d4ed8); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* SVG für Passwege/Laufwege */
        #drawing-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>

    <aside id="squad-sidebar">
        <div class="sidebar-header">
            <span id="display-trainer-name">TRAINER</span>
            <div id="briefcase-icon" onclick="exportToKlemmbrett()" style="cursor:pointer; font-size: 20px;">💼</div>
        </div>
        <div id="player-list" style="flex-grow:1; padding:15px; overflow-y:auto;"></div>
    </aside>

    <main id="main-stage">
        <div class="top-controls">
            <div class="mode-group">
                <button class="btn active" onclick="setMode('11v11')">11 vs 11</button>
                <button class="btn" onclick="setMode('training')">Training</button>
                <button class="btn" onclick="setMode('funino')">Funino</button>
            </div>
            <div id="material-btn-container" class="mode-group" style="display:none;">
                <button class="btn" onclick="addCone()">📐 Hütchen</button>
                <button class="btn" onclick="addBall()">⚽ Ball</button>
            </div>
        </div>

        <div id="pitch">
            <div class="mid-line"></div>
            <div class="center-circle"></div>
            <div class="penalty-area left"></div>
            <div class="penalty-area right"></div>
            <div class="goal l"></div>
            <div class="goal r"></div>

            <div class="zone-layer">
                <div class="zone-col"></div><div class="zone-col"></div><div class="zone-col"></div><div class="zone-col"></div><div class="zone-col"></div>
            </div>

            <svg id="drawing-layer"></svg>

            </div>
    </main>

    <aside id="toni-sidebar">
        <div class="sidebar-header">TONI ANALYSE</div>
        <div id="chat-history">
            <div class="msg toni">Bereit für die Taktik-Simulation, Coach. Ziehe den Ball oder einen Spieler, um zu starten.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="user-msg" placeholder="Befehl an Toni..." onkeypress="if(event.key==='Enter') handleToniAction()">
            <button class="btn" onclick="handleToniAction()">OK</button>
        </div>
    </aside>

    <script src="js/logic.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script>
        // Name aus Session setzen
        document.getElementById('display-trainer-name').innerText = (sessionStorage.getItem('toni_name') || 'COACH').toUpperCase();
    </script>
</body>
</html>
