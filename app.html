<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taktik-AI Pro | Coach Björn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <h1>Taktik-AI <span class="coach-tag">Coach Björn</span></h1>
        </div>
        <div class="header-center">
            <select id="field-mode" onchange="updateFieldMode()">
                <option value="mode-match">Match (2 Tore)</option>
                <option value="mode-funino">Funino (4 Tore)</option>
            </select>
        </div>
        <div class="header-right">
            <button class="briefcase-toggle" onclick="toggleBriefcase()">📁 Aktentasche</button>
        </div>
    </header>

    <main class="dashboard-grid">
        <section class="board-container">
            <div id="taktik-board" class="soccer-pitch mode-match">
                <div class="goal goal-left goal-match"></div>
                <div class="goal goal-right goal-match"></div>
                <div class="goal goal-funino-tl"></div>
                <div class="goal goal-funino-bl"></div>
                <div class="goal goal-funino-tr"></div>
                <div class="goal goal-funino-br"></div>
            </div>
        </section>

        <section class="sidebar-right chat-section">
            <div class="chat-header">Toni (KI-Analyst)</div>
            <div id="chat-output" class="scrollable-content"></div>
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Taktik-Befehl an Toni...">
                <button onclick="sendMessage()">Senden</button>
            </div>
        </section>
    </main>

    <div id="briefcase-overlay" class="overlay-hidden">
        <div class="briefcase-content">
            <div class="briefcase-header">
                <h2>📁 Kader & Management</h2>
                <button class="close-btn" onclick="toggleBriefcase()">✖</button>
            </div>
            
            <div class="add-player-section">
                <h3>Neuen Spieler hinzufügen</h3>
                <div class="player-form">
                    <input type="number" id="p-nr" placeholder="Nr.">
                    <input type="text" id="p-name" placeholder="Name">
                    <select id="p-pos">
                        <option value="IV">Innenverteidiger</option>
                        <option value="ZM">Zentrales Mittelfeld</option>
                        <option value="ST">Stürmer</option>
                        <option value="TW">Torwart</option>
                    </select>
                    <button onclick="addPlayerToBriefcase()">Hinzufügen</button>
                </div>
            </div>

            <div id="smart-squad-list" class="scrollable-content">
                <p class="empty-hint">Noch keine Spieler im Kader. Nutze das Formular oben!</p>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/logic.js"></script>
</body>
</html>
