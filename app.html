<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - PRO PERFORMANCE CENTER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body>

    <div class="pro-layout-container">
        
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="SektorSporttasche.render()">
                <i class="fas fa-tshirt"></i><span>KABINE</span>
            </div>
            <div class="control-unit" onclick="SektorTraining.render()">
                <i class="fas fa-clipboard-list"></i><span>TRAINING</span>
            </div>
            <div class="control-unit" onclick="SektorAnalyse.render()">
                <i class="fas fa-microchip"></i><span>ANALYSE</span>
            </div>
            <div class="control-unit" onclick="SektorTemplates.render()">
                <i class="fas fa-file-invoice"></i><span>HEFT</span>
            </div>
            <div style="margin-top: auto;" class="control-unit" onclick="SektorSystem.render()">
                <i class="fas fa-cog"></i><span>SETUP</span>
            </div>
        </nav>

        <main id="stage-container">
            <canvas id="main-canvas"></canvas>
            
            <div id="toni-status-bar" style="position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.8); padding:10px 20px; border-radius:30px; border:1px solid var(--neon-green); display:flex; align-items:center; gap:10px;">
                <div id="status-indicator" style="width:10px; height:10px; border-radius:50%; background:var(--neon-green); box-shadow:0 0 10px var(--neon-green);"></div>
                <span id="toni-status-text" style="font-size:0.7rem; font-weight:900; letter-spacing:1px; color:#fff;">SYSTEM BEREIT</span>
            </div>
        </main>

        <aside class="analysis-panel">
            <div id="chat-messages" style="flex:1; padding:20px; overflow-y:auto; font-family:'Inter', sans-serif;">
                </div>
            <div class="chat-input-area" style="padding:20px; background:rgba(0,0,0,0.5); border-top:1px solid #222;">
                <input type="text" id="user-input" placeholder="Befehl an Toni..." style="width:100%; background:#000; border:1px solid #444; color:#fff; padding:12px; border-radius:8px;">
            </div>
        </aside>

    </div>

    <div id="briefcase-overlay" class="briefcase-overlay">
        <div class="briefcase-window">
            <button onclick="window.BriefcaseUI.toggle()" style="position:absolute; top:20px; right:20px; background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
            <div id="active-content">
                </div>
        </div>
    </div>

    <script src="logic/event-bus.js"></script>
    <script src="logic/database.js"></script>
    <script src="logic/llm-gateway.js"></script>
    <script src="logic/toni-core.js"></script>
    <script src="engine/arena.js"></script>
    
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-training.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-templates.js"></script>
    <script src="ui/sektoren/sektor-system.js"></script>
    <script src="ui/briefcase-ui.js"></script>

    <script>
        // BOOTSTRAP PROZESS
        window.addEventListener('load', () => {
            console.log("TONI 2.0: Bootstrapping gestartet...");
            
            // 1. Datenbank & Daten prüfen (Seed)
            window.ToniDB.init();
            
            // 2. Arena wecken
            window.Arena.init('main-canvas');
            
            // 3. UI-Komponenten vorbereiten
            window.BriefcaseUI = {
                toggle: function() {
                    const el = document.getElementById('briefcase-overlay');
                    el.classList.toggle('active');
                    el.style.display = el.classList.contains('active') ? 'flex' : 'none';
                }
            };

            // 4. Input-Handler für Toni
            document.getElementById('user-input').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    window.ToniCore.processMessage(e.target.value);
                    e.target.value = '';
                }
            });

            console.log("TONI 2.0: System Online.");
        });
    </script>
</body>
</html>
