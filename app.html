<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni - Globaler Taktik-Experte</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        if(sessionStorage.getItem('toni_auth') !== 'true') { window.location.href = 'index.html'; }
    </script>

    <aside id="squad-sidebar">
        <div class="sidebar-header">
            <h2>Kader-Matrix</h2>
            <p>Anwesenheit & Ginga-Faktor</p>
        </div>
        <div id="player-list">
            </div>
        <div class="sidebar-footer">
            <button class="nav-btn" onclick="addNewPlayerPrompt()">+ Spieler hinzufügen</button>
        </div>
    </aside>

    <main id="main-stage">
        <nav class="top-nav">
            <div id="briefcase-btn" onclick="exportToKlemmbrett()" title="Aktentasche">💼</div>
            <div class="nav-divider"></div>
            
            <button id="btn-11v11" class="nav-btn active" onclick="switchMode('11v11')">11 gegen 11</button>
            <button id="btn-training" class="nav-btn" onclick="switchMode('training')">Training</button>
            <button id="btn-funino" class="nav-btn" onclick="switchMode('funino')">Funino</button>
            
            <div class="nav-divider"></div>
            
            <div class="color-picker-group">
                <input type="color" id="color-team-a" value="#d32f2f" title="Team Farbe Rot" onchange="updateTeamColors()">
                <input type="color" id="color-team-b" value="#ffeb3b" title="Team Farbe Gelb" onchange="updateTeamColors()">
            </div>
        </nav>

        <div id="pitch-container">
            <div id="pitch">
                <div class="center-line"></div>
                <div class="center-circle"></div>
                </div>
        </div>

        <div class="bottom-controls">
            <button class="nav-btn dark" onclick="searchTrainingNet()">Toni: Übung suchen</button>
            <button class="nav-btn orange" onclick="placeCones(12)">12 Hütchen</button>
            <button class="nav-btn blue" onclick="distributeBalls(16)">16 Bälle (Jedem einen)</button>
            <button class="nav-btn" onclick="resetBoardPositions()">Positionen Reset</button>
        </div>
    </main>

    <aside id="chat-sidebar">
        <div class="toni-profile">
            <div class="avatar">T</div>
            <div>
                <strong>Toni (Fachmann)</strong>
                <span class="status-online">● GLOBAL EXPERT ACTIVE</span>
            </div>
        </div>
        
        <div id="toni-output">
            </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Frag Toni (z.B. 'Tor drehen')..." 
                   onkeypress="if(event.key === 'Enter') { handleChatInput(this.value); this.value=''; }">
        </div>
    </aside>

    <script src="js/logic.js"></script>
    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/storage.js"></script>
</body>
</html>
