<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 | ELITE COCKPIT</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        /* Kurzer Fix für das Aktentaschen-Modal, damit es sauber über der Arena liegt */
        .briefcase-overlay {
            display: none; /* Wird via JS gesteuert */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .briefcase-window {
            width: 90%;
            max-width: 1200px;
            height: 85vh;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.1);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <script>
        // Sicherheits-Check: Nur mit gültigem Login
        if(sessionStorage.getItem('toni_auth') !== 'true') window.location.href = 'index.html';
    </script>

    <div class="pro-layout-container">
        
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="window.BriefcaseUI.toggle()" title="Zentrale öffnen">
                <i class="fas fa-briefcase"></i>
                <span>TASCHE</span>
            </div>

            <div class="control-unit" id="ai-status-unit">
                <div id="ai-status-light" style="width:8px; height:8px; border-radius:50%; background:var(--neon-green); margin:0 auto 5px; box-shadow: 0 0 10px var(--neon-green);"></div>
                <span style="font-size:10px;">ONLINE</span>
            </div>

            <div class="control-unit" id="mic-trigger" onclick="window.BriefcaseUI.toggleVoice()" title="Mit Toni sprechen">
                <i class="fas fa-microphone" id="main-mic-btn"></i>
                <span>TONI</span>
            </div>

            <div class="control-unit" onclick="window.BriefcaseUI.switchSektor('system')" title="Setup">
                <i class="fas fa-sliders-h"></i>
                <span>SETUP</span>
            </div>

            <div class="control-unit" onclick="location.reload()" title="Neustart">
                <i class="fas fa-sync-alt"></i>
                <span>RESET</span>
            </div>
        </nav>

        <main id="stage-container" style="position: relative; flex: 1; background: #000;">
            <div id="equipment-palette">
                <div class="tool-btn" onclick="window.arena.setTool('drag')"><i class="fas fa-mouse-pointer"></i></div>
                <div class="tool-btn" onclick="window.arena.setTool('cone')"><i class="fas fa-triangle-exclamation" style="color: var(--accent-orange);"></i></div>
                <div class="tool-btn" onclick="window.arena.setTool('ball')"><i class="fas fa-futbol"></i></div>
                <div class="tool-btn" onclick="window.arena.setTool('goal')"><i class="fas fa-door-open"></i></div>
                <div class="tool-btn" onclick="window.arena.setTool('arrow')"><i class="fas fa-running" style="color: var(--neon-green);"></i></div>
                <div class="tool-btn" onclick="window.arena.setTool('pass')"><i class="fas fa-long-arrow-alt-right" style="color: var(--data-cyan);"></i></div>
                <div class="tool-btn" onclick="window.arena.setTool('shot')"><i class="fas fa-bolt" style="color: var(--status-error);"></i></div>
                <div class="tool-btn" onclick="window.arena.setTool('delete')"><i class="fas fa-eraser"></i></div>
            </div>

            <canvas id="main-canvas"></canvas>
        </main>

        <aside class="analysis-panel">
            <div class="video-preview" style="padding:15px; border-bottom:1px solid rgba(255,255,255,0.05); display: flex; align-items: center;">
                <i class="fas fa-satellite-dish" style="margin-right: 10px; font-size: 0.8rem; color: var(--neon-green); animation: pulse 2s infinite;"></i>
                <span style="font-size: 0.7rem; letter-spacing: 1px; color: #fff;">LIVE ANALYSE ACTIVE</span>
            </div>
            
            <div class="chat-container" style="display: flex; flex-direction: column; height: calc(100% - 50px);">
                <div id="chat-box" style="flex:1; overflow-y:auto; padding:15px; font-size: 0.85rem; color: #ccc;">
                    </div>
                <div class="chat-input-area" style="padding:15px; background: rgba(13,20,33,0.98); border-top: 1px solid rgba(57, 255, 20, 0.2);">
                    <input type="text" id="command-input" class="pro-textarea" placeholder="Befehl an Toni senden..." style="width:100%; background:transparent; border:none; color:var(--neon-green); outline:none;">
                </div>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div class="briefcase-window">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="sector-title" style="color: #fff; font-size: 1rem; margin: 0;">ZENTRALE AKTENTASCHE</h2>
                <i class="fas fa-times" onclick="window.BriefcaseUI.toggle()" style="cursor: pointer; color: #666;"></i>
            </div>
            <div id="briefcase-nav"></div> <div id="briefcase-content" class="hidden">
                <div id="active-content"></div> </div>
        </div>
    </div>

    <script src="logic/database.js"></script>
    <script src="engine/arena.js"></script>
    
    <script src="ui/aktentasche-ui.js"></script>
    
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="script.js"></script>

    <script>
        // Initialisierung nach dem Laden
        window.onload = () => {
            if(window.arena) window.arena.init('main-canvas');
            if(window.BriefcaseUI) window.BriefcaseUI.init();
            
            // Toni Begrüßung nach dem Video-Intro
            setTimeout(() => {
                const chat = document.getElementById('chat-box');
                chat.innerHTML += `<p style="color:var(--neon-green)"><b>TONI:</b> System bereit. Willkommen zurück, Coach.</p>`;
            }, 2000);
        };
    </script>
</body>
</html>
