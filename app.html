<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toni 2.0 - Ginga Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>

<body class="blackout">

    <div class="dashboard">
        
        <aside class="aktentasche" id="sidebar">
            <header class="sidebar-header">
                <div class="brand">TONI 2.0</div>
                <button class="close-btn" onclick="toggleSidebar(false)">
                    <i class="fas fa-times"></i>
                </button>
            </header>
            
            <nav class="sidebar-tabs">
                <button onclick="switchTab('chat')" id="tab-chat" class="tab-link active">
                    <i class="fas fa-comment-dots"></i>
                    <span>Toni</span>
                </button>
                <button onclick="switchTab('kader')" id="tab-kader" class="tab-link">
                    <i class="fas fa-users-gear"></i>
                    <span>Kader</span>
                </button>
                <button onclick="switchTab('matchplan')" id="tab-matchplan" class="tab-link">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Plan</span>
                </button>
            </nav>

            <div id="tab-content" class="sidebar-content">
                <div id="initial-loader" style="padding: 20px; color: #555; text-align: center;">
                    <i class="fas fa-circle-notch fa-spin"></i><br><br>
                    Warte auf System-Start...
                </div>
            </div>
        </aside>

        <main class="pitch-area">
            
            <header class="top-bar">
                <button class="menu-btn" onclick="toggleSidebar(true)">
                    <i class="fas fa-briefcase"></i>
                </button>
                <div id="status-display" style="font-size: 0.8rem; color: #666;">Bereit für Ginga...</div>
                <div style="font-size: 0.8rem; font-weight: bold; color: var(--gold);" id="user-name-display">Trainer</div>
            </header>

            <div id="canvas-wrapper" class="canvas-wrapper">
                
                <div id="start-overlay" onclick="window.ToniEvents.emit('SYSTEM:START')" style="position: absolute; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;">
                    <div style="width: 90px; height: 90px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(255,215,0,0.3); margin-bottom: 25px;">
                        <div class="play-icon"></div> </div>
                    <p style="color: white; font-weight: bold; letter-spacing: 2px;">STARTEN</p>
                </div>

                <div id="pitch-surface" class="pitch-surface">
                    <svg id="pitch-svg" class="pitch-svg"></svg>
                </div>
            </div>
            
        </main>
    </div>

    <script src="js/modules/eventbus.js"></script>
    <script src="js/modules/database.js"></script>
    <script src="js/modules/voice.js"></script>
    <script src="js/modules/arena.js"></script>
    <script src="js/modules/engine.js"></script>
    <script src="js/modules/roster.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
