<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - PRO PERFORMANCE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pro-layout-container">
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="SektorSporttasche.render()"><i class="fas fa-tshirt"></i></div>
            <div class="control-unit" onclick="SektorAnalyse.render()"><i class="fas fa-microchip"></i></div>
            <div class="control-unit" onclick="SektorSystem.render()"><i class="fas fa-cog"></i></div>
        </nav>

        <main id="stage-container" style="background:#000; position:relative;">
            <canvas id="main-canvas"></canvas>
            <div id="toni-status-bar" style="position:absolute; top:20px; left:20px; color:#fff; font-size:0.7rem; font-weight:900;">
                STATUS: <span id="toni-status-text" style="color:var(--neon-green);">INITIALISIERE...</span>
            </div>
        </main>

        <aside class="analysis-panel">
            <div id="chat-messages" style="flex:1; padding:20px; overflow-y:auto;"></div>
            <div style="padding:20px;"><input type="text" id="user-input" placeholder="Befehl an Toni..."></div>
        </aside>
    </div>

    <div id="briefcase-overlay" class="briefcase-overlay"><div class="briefcase-window"><div id="active-content"></div></div></div>

    <script src="logic/event-bus.js"></script>
    <script src="logic/database.js"></script>
    <script src="logic/llm-gateway.js"></script>
    <script src="logic/toni-core.js"></script>
    <script src="engine/arena.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-system.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            console.log("BOOT: Starte System...");
            
            // 1. Datenbank laden
            window.ToniDB.init(); 
            
            // 2. Arena initialisieren (ERST JETZT, damit Canvas-Größe stimmt)
            const canvas = document.getElementById('main-canvas');
            if(canvas) {
                const container = document.getElementById('stage-container');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                window.Arena.init('main-canvas');
            }

            // 3. Status setzen
            document.getElementById('toni-status-text').innerText = "BEREIT (PRO)";
            
            // 4. Chat Handler
            document.getElementById('user-input').onkeypress = (e) => {
                if(e.key === 'Enter') { window.ToniCore.processMessage(e.target.value); e.target.value = ''; }
            };
        });
    </script>
</body>
</html>
