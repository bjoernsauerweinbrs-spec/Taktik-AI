<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - TACTICAL INTELLIGENCE</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body>
    <div class="pro-layout-container">
        
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="window.BriefcaseUI.toggle()">
                <i class="fas fa-briefcase"></i>
                <span class="label" style="font-size: 10px; font-weight: bold;">AKTENTASCHE</span>
            </div>
            <div class="control-unit" onclick="window.location.reload()">
                <i class="fas fa-sync-alt"></i>
                <span class="label" style="font-size: 10px; font-weight: bold;">RESET</span>
            </div>
        </nav>

        <main id="stage-container">
            <canvas id="main-canvas"></canvas>
        </main>

        <aside class="analysis-panel">
            <div class="video-preview" style="height: 200px; background: #000; border-bottom: 2px solid var(--neon-green); display: flex; align-items: center; justify-content: center;">
                <span style="color: #444;">VIDEOANALYSE BEREIT</span>
            </div>
            <div class="chat-container" id="chat-messages">
                </div>
            <div class="input-area" style="padding: 15px; background: #080C14;">
                <input type="text" id="user-input" class="login-input" style="width: 100%;" placeholder="Toni Befehl geben...">
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" class="briefcase-overlay">
        <div class="briefcase-window">
            <div style="display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px;">
                <button class="tactic-btn" onclick="window.SektorSporttasche.render()">KABINE</button>
                <button class="tactic-btn" onclick="window.SektorAnalyse.render()">ANALYSE</button>
                <button class="tactic-btn" onclick="window.SektorManagement.render()">BUSINESS</button>
                <button class="tactic-btn" style="margin-left: auto; color: var(--status-error);" onclick="window.BriefcaseUI.toggle()">BEENDEN X</button>
            </div>
            <div id="active-content">
                <h2 style="color: var(--neon-green);">Willkommen, Trainer Björn.</h2>
                <p>Wähle einen Sektor aus der obigen Leiste.</p>
            </div>
        </div>
    </div>

    <script src="logic/event-bus.js"></script>
    <script src="logic/database.js"></script>
    <script src="logic/toni-core.js"></script>
    <script src="engine/arena.js"></script>
    <script src="ui/briefcase-ui.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-management.js"></script>

    <script>
        window.onload = () => {
            window.ToniDB.init();
            window.arena.init('main-canvas');
        };
    </script>
</body>
</html>
