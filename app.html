<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - ELITE COCKPIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pro-cockpit">
        <aside class="sidebar-nav">
            <div id="status-dot" class="ai-status-dot status-online"></div>
            <div class="nav-item" onclick="closeBriefcase()"><i class="fas fa-chalkboard"></i><span>TAKTIK</span></div>
            <div class="nav-item" onclick="toggleBriefcase()"><i class="fas fa-briefcase"></i><span>ZENTRALE</span></div>
        </aside>

        <main class="arena-main" id="arena-container">
            <canvas id="tactic-board"></canvas>
        </main>

        <aside class="comm-panel">
            <div class="chat-window" id="chat-box"></div>
            <div class="mic-section" style="height:150px; display:flex; align-items:center; justify-content:center;">
                <div class="mic-container" onclick="window.ToniBrain.toggleMic()"><i class="fas fa-microphone"></i></div>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay">
        <div class="briefcase-window">
            <nav class="briefcase-nav">
                <div class="bc-nav-item" onclick="loadTab('Kabine')">KABINE</div>
                <div class="bc-nav-item" onclick="loadTab('Labor')">LABOR</div>
                <div class="bc-nav-item" onclick="loadTab('Junioren')">JUGEND</div>
                <div class="bc-nav-item" onclick="loadTab('Zeitung')">KURIER</div>
                <div class="bc-nav-item" onclick="loadTab('Manager')">MANAGER</div>
                <div class="bc-close" onclick="toggleBriefcase()"><i class="fas fa-times"></i></div>
            </nav>
            <div id="briefcase-content"></div>
        </div>
    </div>

    <script src="engine/database.js"></script>
    <script src="engine/toni-brain.js"></script>
    <script src="engine/pitch-engine.js"></script>
    <script src="modules/kabine.js"></script>
    <script src="modules/labor.js"></script>
    <script src="modules/junioren.js"></script>
    <script src="modules/zeitung.js"></script>
    <script src="modules/manager.js"></script>

    <script>
        function calibrate() {
            const c = document.getElementById('tactic-board'), container = document.getElementById('arena-container');
            c.width = container.clientWidth; c.height = container.clientHeight;
            if(window.PitchEngine) window.PitchEngine.draw();
        }
        function toggleBriefcase() {
            const ov = document.getElementById('briefcase-overlay');
            const isOff = ov.style.display === 'none' || ov.style.display === '';
            ov.style.display = isOff ? 'flex' : 'none';
            if(isOff) loadTab('Kabine');
        }
        function closeBriefcase() { document.getElementById('briefcase-overlay').style.display = 'none'; }
        function loadTab(name) {
            document.querySelectorAll('.bc-nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('briefcase-content').innerHTML = "";
            window['Sektor' + name].render();
        }
        window.addEventListener('load', () => { calibrate(); window.PitchEngine.init(); window.ToniBrain.firstGreeting(); });
        window.addEventListener('resize', calibrate);
    </script>
</body>
</html>
