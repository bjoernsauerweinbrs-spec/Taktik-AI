<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 - ELITE COCKPIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <style>
        /* Kurzer Safety-Style, damit das Layout nicht springt */
        :root {
            --neon-green: #39FF14;
            --data-cyan: #00D1FF;
            --accent-gold: #D4AF37;
        }
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
        .main-interface { display: grid; grid-template-columns: 80px 1fr 350px; height: 100vh; }
        
        /* Briefcase Overlay */
        #briefcase-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000;
            display: none; backdrop-filter: blur(15px);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="main-interface">
        <aside style="border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px 0;">
            <div id="main-mic-btn" onclick="window.ToniVoice.toggle()" style="cursor:pointer; font-size: 1.5rem; margin-bottom: 40px;">
                <i class="fas fa-microphone"></i>
            </div>
            <div onclick="window.BriefcaseUI.toggle()" style="cursor:pointer; font-size: 1.5rem; color: var(--neon-green);">
                <i class="fas fa-briefcase"></i>
            </div>
        </aside>

        <main style="position: relative; background: #05080F;">
            <canvas id="tactic-board" style="width: 100%; height: 100%;"></canvas>
        </main>

        <aside style="border-left: 1px solid #222; background: #05080F; display: flex; flex-direction: column;">
            <div id="live-biometrics" style="flex: 1; padding: 20px; border-bottom: 1px solid #222;">
                <h3 style="font-family:'Orbitron'; font-size: 0.7rem; color: var(--data-cyan);">LIVE ANALYSIS</h3>
            </div>
            <div id="chat-box" style="height: 250px; overflow-y: auto; padding: 15px; font-size: 0.8rem; background: rgba(0,0,0,0.3);">
                <div class="chat-msg system"><b>TONI:</b> System bereit, Coach.</div>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay">
        <button id="back-to-hub" class="hidden" onclick="window.BriefcaseUI.renderMainGrid()" 
                style="position:fixed; top:30px; left:30px; z-index:1100; background:none; border:1px solid #fff; color:#fff; padding:10px 20px; font-family:'Orbitron'; cursor:pointer;">
            <i class="fas fa-th"></i> ZENTRALE
        </button>

        <div id="briefcase-nav" style="padding: 100px 50px;">
            </div>

        <div id="briefcase-content" class="hidden" style="padding: 100px 50px; height: 100vh; overflow-y: auto;">
            <div id="active-content">
                </div>
        </div>
    </div>

    <script src="engine/database-core.js"></script>
    <script src="engine/voice-core.js"></script>

    <script src="engine/bridge.js"></script>

    <script src="engine/arena-core.js"></script>
    <script src="engine/mobile-tactics.js"></script>

    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-junioren.js"></script>
    <script src="ui/sektoren/sektor-stadionzeitung.js"></script>
    <script src="ui/sektoren/sektor-sponsoring.js"></script>
    <script src="ui/sektoren/sektor-videoanalyse.js"></script>
    <script src="ui/sektoren/sektor-settings.js"></script>

    <script src="ui/briefcase-ui.js"></script>

    <script>
        // Start-Check
        window.addEventListener('load', () => {
            console.log("⚽ TONI 2.0 Interface versiegelt.");
            // Initialisiert die Arena, falls noch nicht geschehen
            if(window.Arena) window.Arena.init();
            if(window.BriefcaseUI) window.BriefcaseUI.init();
        });
    </script>
</body>
</html>
