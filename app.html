<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - ELITE COCKPIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pro-cockpit">
        <aside class="sidebar-nav">
            <div class="nav-item" onclick="toggleBriefcase()"><i class="fas fa-briefcase"></i><span>ZENTRALE</span></div>
            <div class="nav-item" onclick="openKabine()"><i class="fas fa-users"></i><span>KABINE</span></div>
            <div class="nav-item" onclick="openLabor()"><i class="fas fa-heartbeat"></i><span>LABOR</span></div>
        </aside>

        <main class="arena-main" id="arena-container">
            <canvas id="tactic-board"></canvas>
        </main>

        <aside class="comm-panel">
            <div class="chat-window" id="chat-box"></div>
            <div class="mic-section">
                <i class="fas fa-microphone" style="font-size:2rem; cursor:pointer;" onclick="window.ToniBrain.toggleMic()"></i>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" onclick="if(event.target === this) toggleBriefcase()">
        <div class="briefcase-content" id="briefcase-grid"></div>
    </div>

    <script src="engine/database.js"></script>
    <script src="engine/toni-brain.js"></script>
    <script src="engine/pitch-engine.js"></script>
    <script src="modules/kabine.js"></script>

    <script>
        function calibrate() {
            const c = document.getElementById('tactic-board'), container = document.getElementById('arena-container');
            c.width = container.clientWidth; c.height = container.clientHeight;
            if(window.PitchEngine) window.PitchEngine.draw();
        }
        function toggleBriefcase() { 
            const ov = document.getElementById('briefcase-overlay');
            ov.style.display = (ov.style.display === 'flex') ? 'none' : 'flex';
        }
        function openKabine() { toggleBriefcase(); window.SektorKabine.render(); }
        
        window.addEventListener('load', () => { calibrate(); window.PitchEngine.init(); });
        window.addEventListener('resize', calibrate);
    </script>
</body>
</html>
