<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toni 2.0 - Taktik-Zentrale</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="main">
            <div class="top-controls">
                <button class="btn primary" onclick="resetBoard()">⚽ NEUER ANSTOSS</button>
                <div class="phase-display">
                    <button onclick="prevPhase()">◀</button>
                    <span id="playlist-title">Spielzug 1</span>
                    <button onclick="nextPhase()">▶</button>
                </div>
            </div>

            <div id="board-container">
                <div class="field-line middle-line"></div>
                <div class="field-line center-circle"></div>
                <div class="box-16-left"></div><div class="box-5-left"></div><div class="goal-left"></div>
                <div class="box-16-right"></div><div class="box-5-right"></div><div class="goal-right"></div>
            </div>

            <div id="bench-area">
                <div class="bench-side">
                    <div class="bench-label">BANK ROT (Björn)</div>
                    <div id="bench-red" class="bench-slot"></div>
                </div>
                <div class="bench-side">
                    <div class="bench-label">BANK BLAU (Gegner)</div>
                    <div id="bench-blue" class="bench-slot"></div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="header">📋 TONI STRATEGIE-BOARD</div>
            <div id="chat-history"></div>
            <div class="input-row">
                <button class="btn-icon" onclick="startMic()">🎙️</button>
                <input type="text" id="user-input" placeholder="Anweisung an Toni..." onkeypress="if(event.key==='Enter') askToni()">
                <button class="btn primary" onclick="askToni()">OK</button>
            </div>
            <div class="action-buttons">
                <button class="btn" onclick="welcomeFlow()">👋 Gruß</button>
                <button class="btn" onclick="openKaderManager()">📋 Kader Editor</button>
                <button class="btn primary" onclick="askToniTaktik()">📊 Taktik</button>
                <button class="btn" onclick="askToniPressing()">⚡ Pressing</button>
                <button class="btn primary full-width" onclick="exportPlanPDF()">📄 PDF EXPORT</button>
            </div>
        </div>
    </div>

    <div id="kader-modal" class="modal">
        <div class="modal-content">
            <h3>Kader-Management</h3>
            <div id="kader-list"></div>
            <button class="btn primary" onclick="closeKaderManager()">Speichern & Schließen</button>
        </div>
    </div>

    <div id="login-overlay">
        <div class="login-card">
            <h1>COACH LOGIN</h1>
            <input type="password" id="password" placeholder="Passwort">
            <input type="password" id="user-groq-key" placeholder="Groq API-Key">
            <button class="btn primary" onclick="startToni()">INITIALISIEREN</button>
        </div>
    </div>

    <script src="js/board.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/logic.js"></script>
</body>
</html>
