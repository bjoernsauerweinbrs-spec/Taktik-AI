<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - EMERGENCY RECOVERY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body style="background: #000; margin: 0; overflow: hidden;">

    <div class="pro-layout-container">
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="SektorSporttasche.render()"><i class="fas fa-tshirt"></i></div>
            <div class="control-unit" onclick="SektorAnalyse.render()"><i class="fas fa-microchip"></i></div>
            <div class="control-unit" onclick="location.reload()"><i class="fas fa-sync"></i></div>
        </nav>

        <main id="stage-container" style="background:#051205; position:relative;">
            <canvas id="main-canvas"></canvas>
            <div style="position:absolute; top:20px; left:20px; color:#39FF14; font-family:monospace; font-size:12px;">
                STATUS: <span id="toni-status-text">RECOVERY MODE</span>
            </div>
        </main>

        <aside class="analysis-panel">
            <div id="chat-messages" style="flex:1; padding:20px; overflow-y:auto; color:#fff;"></div>
            <div style="padding:20px;"><input type="text" id="user-input" placeholder="Befehl an Toni..."></div>
        </aside>
    </div>

    <div id="briefcase-overlay" class="briefcase-overlay"><div class="briefcase-window"><div id="active-content"></div></div></div>

    <script>
        // 1. EVENT BUS
        window.ToniEvents = {
            listeners: {},
            on(e, f) { (this.listeners[e] = this.listeners[e] || []).push(f); },
            emit(e, d) { (this.listeners[e] || []).forEach(f => f(d)); }
        };

        // 2. DATENBANK (Mit Sofort-Seed)
        window.ToniDB = {
            init() {
                if (!localStorage.getItem('toni_players')) {
                    const seed = [
                        { id: 'p1', name: 'Neuer', nr: 1, team: 'home', isStarter: true, isPresent: true },
                        { id: 'p2', name: 'Mbappé', nr: 7, team: 'home', isStarter: true, isPresent: true },
                        { id: 'opp1', name: 'Gegner', nr: 1, team: 'away', isStarter: true, isPresent: true }
                    ];
                    localStorage.setItem('toni_players', JSON.stringify(seed));
                }
            },
            getPlayers() { return JSON.parse(localStorage.getItem('toni_players')) || []; },
            updatePlayer(id, patch) {
                let p = this.getPlayers();
                let i = p.findIndex(x => x.id === id);
                if(i !== -1) { p[i] = {...p[i], ...patch}; localStorage.setItem('toni_players', JSON.stringify(p)); window.ToniEvents.emit('players:updated', p); }
            }
        };
    </script>

    <script src="engine/arena.js"></script>
    <script src="logic/llm-gateway.js"></script>
    <script src="logic/toni-core.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>

    <script>
        window.onload = () => {
            window.ToniDB.init();
            const canvas = document.getElementById('main-canvas');
            const stage = document.getElementById('stage-container');
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;

            if(window.arena) {
                window.arena.init('main-canvas');
                document.getElementById('toni-status-text').innerText = "ONLINE";
            } else {
                document.getElementById('toni-status-text').innerText = "ERROR: engine/arena.js NOT FOUND";
            }

            document.getElementById('user-input').onkeypress = (e) => {
                if(e.key === 'Enter') { window.ToniCore.processMessage(e.target.value); e.target.value = ''; }
            };
        };
    </script>
</body>
</html>
