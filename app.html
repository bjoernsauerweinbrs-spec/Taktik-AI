<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 - ELITE COCKPIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pro-cockpit">
        <aside class="sidebar-nav">
            <div id="status-dot" class="ai-status-dot"></div>
            <div class="nav-item" onclick="toggleBriefcase()"><i class="fas fa-briefcase"></i><span>ZENTRALE</span></div>
            <div class="nav-item" onclick="openKabine()"><i class="fas fa-users"></i><span>KABINE</span></div>
            <div class="nav-item" onclick="openLabor()"><i class="fas fa-heartbeat"></i><span>LABOR</span></div>
            <div class="nav-item" onclick="openZeitung()"><i class="fas fa-newspaper"></i><span>KURIER</span></div>
            <div class="nav-item" onclick="openJunioren()"><i class="fas fa-award"></i><span>JUGEND</span></div>
            <div class="nav-item" onclick="openManager()"><i class="fas fa-city"></i><span>MANAGER</span></div>
            <div class="nav-item" onclick="openSetup()" style="margin-top:auto; margin-bottom:20px;"><i class="fas fa-cog"></i><span>SETUP</span></div>
        </aside>

        <main class="arena-main" id="arena-container">
            <div class="pitch-label" id="pitch-info">GROSSFELD SENIOREN</div>
            <canvas id="tactic-board"></canvas>
        </main>

        <aside class="comm-panel">
            <div class="comm-header"><h3 style="font-family:'Orbitron'; font-size: 0.7rem; color: var(--data-cyan);">TONI 2.0 INTELLIGENCE</h3></div>
            <div id="chat-box" class="chat-window"></div>
            <div class="mic-section">
                <div class="mic-container" id="mic-trigger" onclick="window.ToniBrain.toggleMic()">
                    <i class="fas fa-microphone"></i><div class="pulse-ring"></div>
                </div>
                <p id="mic-status">VOICE OFF</p>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" onclick="if(event.target === this) toggleBriefcase()">
        <div class="briefcase-content"><div id="briefcase-grid"></div></div>
    </div>

    <script src="engine/database.js"></script>
    <script src="engine/toni-brain.js"></script>
    <script src="engine/pitch-engine.js"></script>
    <script src="modules/kabine.js"></script>
    <script src="modules/labor.js"></script>
    <script src="modules/zeitung.js"></script>
    <script src="modules/junioren.js"></script>
    <script src="modules/manager.js"></script>
    <script src="modules/setup.js"></script>

    <script>
        if(!sessionStorage.getItem('toni_auth')) window.location.href = 'index.html';

        function calibrate() {
            const board = document.getElementById('tactic-board');
            const container = document.getElementById('arena-container');
            if(board && container) {
                board.width = container.clientWidth; board.height = container.clientHeight;
                if(window.PitchEngine && window.PitchEngine.draw) window.PitchEngine.draw();
            }
        }

        window.addEventListener('load', () => { calibrate(); window.PitchEngine.init(); window.ToniBrain.firstGreeting(); });
        window.addEventListener('resize', calibrate);

        function toggleBriefcase() {
            const ov = document.getElementById('briefcase-overlay');
            ov.style.display = (ov.style.display === 'flex') ? 'none' : 'flex';
        }

        function openKabine() { document.getElementById('briefcase-grid').className = 'mgmt-grid'; toggleBriefcase(); window.SektorKabine.render(); }
        function openLabor() { document.getElementById('briefcase-grid').className = ''; toggleBriefcase(); window.SektorLabor.render(); }
        function openZeitung() { document.getElementById('briefcase-grid').className = ''; toggleBriefcase(); window.SektorZeitung.render(); }
        function openJunioren() { document.getElementById('briefcase-grid').className = ''; toggleBriefcase(); window.SektorJunioren.render(); }
        function openManager() { document.getElementById('briefcase-grid').className = ''; toggleBriefcase(); window.SektorManager.render(); }
        
        function openSetup() {
            document.getElementById('briefcase-grid').className = '';
            toggleBriefcase();
            window.SektorSetup.render();
            window.ToniBrain.speak("Setup-Zentrum aktiviert. Scanne den QR-Code, um dein Handy zu koppeln.");
        }
    </script>
</body>
</html>
