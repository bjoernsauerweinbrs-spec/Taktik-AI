<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONI 2.0 - Taktik & Ginga</title>
    <link rel="stylesheet" href="style.css"> <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="app-container">
    
    <aside class="sidebar">
        <div class="logo-area">
            <h2>TONI 2.0</h2>
            <small>Co-Trainer Pro</small>
        </div>
        
        <nav class="main-nav">
            <button class="nav-btn active"><i class="fas fa-chalkboard"></i> Taktik-Board</button>
            <button class="nav-btn" onclick="BriefcaseUI.toggle()">
                <i class="fas fa-briefcase"></i> AKTTENTASCHE
            </button>
        </nav>
        
        <div class="trainer-info">
            <i class="fas fa-user-tie"></i> <span id="trainer-display-name">Coach</span>
        </div>
    </aside>

    <main class="main-column arena-column" style="position: relative;">
        <div class="column-header">
            <i class="fas fa-futbol"></i> TAKTIK-ARENA
        </div>
        
        <div id="tactic-controls">
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('pressing')">🔥 PRESSING</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('overload')">🚀 ÜBERZAHL</button>
            <button class="tactic-btn" onclick="arena.applyTacticalPattern('compact')">🛡️ KOMPAKT</button>
            <button class="tactic-btn reset" onclick="arena.resetBoard()">🔄 RESET</button>
        </div>

        <canvas id="tactic-board"></canvas>
    </main>

    <section class="main-column chat-column">
        <div class="column-header">
            <i class="fas fa-comment-dots"></i> TONI (CO-TRAINER)
        </div>
        
        <div id="chat-messages" class="chat-area">
            </div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Anweisung an Toni...">
            <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </section>

</div>

<div id="briefcase-overlay" class="hidden">
    <div class="briefcase-window">
        <div class="briefcase-header">
            <h2 id="sector-title">ZENTRALE AKTTENTASCHE</h2>
            <button onclick="BriefcaseUI.toggle()">X</button>
        </div>
        
        <div id="briefcase-nav" class="folder-grid">
            <div class="folder" onclick="BriefcaseUI.switchSektor('sport')">
                <i class="fas fa-vest"></i><span>SPORTTASCHE</span>
            </div>
            <div class="folder" onclick="BriefcaseUI.switchSektor('marketing')">
                <i class="fas fa-ad"></i><span>MARKETING</span>
            </div>
            <div class="folder" onclick="BriefcaseUI.switchSektor('system')">
                <i class="fas fa-cogs"></i><span>SYSTEM</span>
            </div>
        </div>

        <div id="briefcase-content" class="hidden">
            <button class="back-btn" onclick="BriefcaseUI.backToNav()">← Zurück</button>
            <div id="active-content"></div>
        </div>
    </div>
</div>

<script src="ui/briefcase-ui.js"></script>
<script src="engine/arena.js"></script>
<script src="engine/toni-ai.js"></script>

<script>
    // Initialisierung beim Laden
    window.onload = () => {
        arena.init('tactic-board');
        ToniAI.init();
        
        const name = localStorage.getItem('trainer_name');
        if(name) document.getElementById('trainer-display-name').innerText = name;
    };
</script>

</body>
</html>
