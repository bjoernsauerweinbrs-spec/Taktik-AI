<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - PRO PERFORMANCE</title>
    <link rel="stylesheet" href="css/toni-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
</head>
<body>
    <div class="main-layout">
        <aside class="sidebar-pro">
            <div id="briefcase-btn" onclick="window.BriefcaseUI.toggle()">
                <i class="fas fa-briefcase"></i>
                <span class="label">AKTEN-TASCHE</span>
            </div>
        </aside>

        <main id="arena-container">
            <canvas id="main-canvas"></canvas>
            <div class="arena-info">STATUS: ONLINE | 5M-ZONE AKTIV</div>
        </main>

        <aside class="analysis-box">
            <div class="video-container">
                <div class="video-placeholder">VIDEO-ANALYSE BEREIT</div>
            </div>
            <div id="chat-window"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Taktischen Befehl geben...">
                <button id="mic-btn"><i class="fas fa-microphone"></i></button>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" class="hidden">
        <div class="briefcase-window">
            <div class="briefcase-nav">
                <button onclick="window.SektorSporttasche.render()">SPORTTASCHE</button>
                <button onclick="window.SektorAnalyse.render()">ANALYSE</button>
                <button onclick="window.SektorManagement.render()">MANAGEMENT</button>
                <button class="close-btn" onclick="window.BriefcaseUI.toggle()">X</button>
            </div>
            <div id="active-content"></div>
        </div>
    </div>

    <script src="logic/event-bus.js"></script> <script src="logic/database.js"></script>
    <script src="js/toni-core.js"></script>
    <script src="engine/arena.js"></script>
    <script src="ui/aktentasche-ui.js"></script> <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-management.js"></script>

    <script>
        window.onload = () => {
            window.ToniDB.init();
            window.arena.init('main-canvas');
        };
    </script>
</body>
</html>
