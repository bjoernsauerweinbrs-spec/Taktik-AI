<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TONI 2.0 | ELITE COCKPIT 2026</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        .hidden { display: none !important; }
        /* Spielfeld-Hintergrund für den High-Tech Look */
        #main-canvas { cursor: crosshair; touch-action: none; background: #050505; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }
        
        /* Z-INDEX RECOVERY */
        .briefcase-overlay { z-index: 1000000 !important; }
        .sidebar-minimal { z-index: 100001 !important; position: relative; }
        #stage-container { z-index: 1; position: relative; background: #000; }
        
        /* PULSIERENDER KI-STATUS */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px #39FF14; opacity: 0.6; }
            50% { box-shadow: 0 0 20px #39FF14; opacity: 1; }
            100% { box-shadow: 0 0 5px #39FF14; opacity: 0.6; }
        }
        .ai-online { animation: pulse-glow 2s infinite; }

        #arena-bench-list { 
            display: flex; gap: 10px; padding: 15px; overflow-x: auto; 
            background: rgba(0,0,0,0.5); border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <script>
        if(sessionStorage.getItem('toni_auth') !== 'true') window.location.href = 'index.html';
        window.coachInfo = JSON.parse(localStorage.getItem('toni_coach_data')) || { verein: "Mein Verein", name: "Coach" };
    </script>

    <div class="pro-layout-container">
        <nav class="sidebar-minimal">
            <div class="control-unit" onclick="if(window.BriefcaseUI) window.BriefcaseUI.toggle()" title="Aktentasche">
                <i class="fas fa-briefcase"></i>
                <span>TASCHE</span>
            </div>
            
            <div class="control-unit" id="ai-status-unit">
                <div id="ai-status-light" class="ai-online" style="width:10px; height:10px; border-radius:50%; background: #39FF14; margin:0 auto 5px; transition: 0.3s;"></div>
                <span id="ai-status-label" style="font-size:9px; color:#39FF14;">ONLINE</span>
            </div>
            
            <div class="control-unit" id="mic-trigger" onclick="if(window.BriefcaseUI) window.BriefcaseUI.toggleVoice()" title="Mit Toni sprechen">
                <i class="fas fa-microphone" id="main-mic-btn" style="color: #fff;"></i>
                <span>MIC</span>
            </div>
            
            <div class="control-unit" onclick="if(window.BriefcaseUI) window.BriefcaseUI.switchSektor('settings')" title="Setup">
                <i class="fas fa-sliders-h"></i>
                <span>SETUP</span>
            </div>
            
            <div class="control-unit" onclick="location.reload()" title="System Reboot">
                <i class="fas fa-sync-alt"></i>
                <span>RESET</span>
            </div>
        </nav>

        <main id="stage-container">
            <canvas id="tactic-board" width="1200" height="800" style="width:100%; height:calc(100% - 150px);"></canvas>
            <div id="arena-bench-list"></div>
        </main>

        <aside class="analysis-panel">
            <div class="video-preview" style="padding:20px; border-bottom:1px solid rgba(255,255,255,0.05); display: flex; align-items: center; background: rgba(0,0,0,0.3);">
                <i class="fas fa-satellite-dish" style="margin-right: 12px; font-size: 0.9rem; color: var(--neon-green); animation: pulse 2s infinite;"></i>
                <span style="font-size: 0.75rem; letter-spacing: 2px; color: #fff; font-family: 'Orbitron';">LIVE ANALYSE ACTIVE</span>
            </div>
            <div class="chat-container">
                <div id="chat-box"></div>
                <div class="chat-input-area">
                    <input type="text" id="command-input" placeholder="Befehl an Toni senden...">
                </div>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay" class="briefcase-overlay hidden">
        <div class="briefcase-window">
            <div id="briefcase-nav"></div> 
            <div id="briefcase-content" class="hidden">
                <div id="active-content"></div> 
            </div>
        </div>
    </div>

    <script src="engine/database-core.js"></script>
    <script src="engine/arena-core.js"></script>
    <script src="engine/mobile-tactics.js"></script>

    <script src="ui/aktentasche-ui.js"></script>
    <script src="ui/sektoren/sektor-sporttasche.js"></script>
    <script src="ui/sektoren/sektor-analyse.js"></script>
    <script src="ui/sektoren/sektor-magazin.js"></script>
    <script src="ui/sektoren/sektor-business.js"></script>
    <script src="ui/sektoren/sektor-settings.js"></script>

    <script>
        window.currentTeamContext = "Senioren"; 

        window.onload = () => {
            if(window.Database) window.Database.init();
            if(window.Arena) window.Arena.init();
            if(window.BriefcaseUI) window.BriefcaseUI.init();
            if(window.MobileTactics) window.MobileTactics.init();

            setTimeout(() => {
                const chat = document.getElementById('chat-box');
                if(chat) chat.innerHTML += `<div class="chat-msg system"><b>TONI:</b> Interface synchronisiert. Status: Online.</div>`;
            }, 1000);
        };
    </script>
</body>
</html>
