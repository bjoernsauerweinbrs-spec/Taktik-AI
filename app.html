<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 - ELITE COCKPIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pro-cockpit">
        <aside class="sidebar-nav">
            <div id="status-dot" class="ai-status-dot status-online"></div>
            <div class="nav-item active" onclick="closeBriefcase()"><i class="fas fa-dt-board"></i><span>TAKTIK</span></div>
            <div class="nav-item" onclick="toggleBriefcase()"><i class="fas fa-briefcase"></i><span>AKTENTASCHE</span></div>
            <div class="nav-item" style="margin-top:auto;" onclick="openBriefcaseSection('Setup')"><i class="fas fa-cog"></i><span>SETUP</span></div>
        </aside>

        <main class="arena-main" id="arena-container">
            <canvas id="tactic-board"></canvas>
        </main>

        <aside class="comm-panel">
            <div class="chat-window" id="chat-box"></div>
            <div class="mic-section">
                <div class="mic-container" onclick="window.ToniBrain.toggleMic()">
                    <i class="fas fa-microphone"></i><div class="pulse-ring"></div>
                </div>
            </div>
        </aside>
    </div>

    <div id="briefcase-overlay">
        <div class="briefcase-window">
            <nav class="briefcase-nav">
                <div class="bc-nav-item" onclick="renderModule('Kabine')"><i class="fas fa-users"></i> KABINE</div>
                <div class="bc-nav-item" onclick="renderModule('Labor')"><i class="fas fa-heartbeat"></i> LABOR</div>
                <div class="bc-nav-item" onclick="renderModule('Jugend')"><i class="fas fa-award"></i> JUGEND</div>
                <div class="bc-nav-item" onclick="renderModule('Management')"><i class="fas fa-city"></i> MANAGEMENT</div>
                <div class="bc-nav-item" onclick="renderModule('Video')"><i class="fas fa-video"></i> VIDEO</div>
                <div class="bc-close" onclick="toggleBriefcase()"><i class="fas fa-times"></i></div>
            </nav>
            
            <div id="briefcase-content">
                </div>
        </div>
    </div>

    <script src="engine/database.js"></script>
    <script src="engine/toni-brain.js"></script>
    <script src="engine/pitch-engine.js"></script>
    <script src="modules/kabine.js"></script>
    <script src="modules/labor.js"></script>
    <script src="modules/junioren.js"></script>
    <script src="modules/manager.js"></script>

    <script>
        function calibrate() {
            const c = document.getElementById('tactic-board'), container = document.getElementById('arena-container');
            c.width = container.clientWidth; c.height = container.clientHeight;
            if(window.PitchEngine) window.PitchEngine.draw();
        }

        function toggleBriefcase() {
            const ov = document.getElementById('briefcase-overlay');
            const isVisible = ov.style.display === 'flex';
            ov.style.display = isVisible ? 'none' : 'flex';
            if(!isVisible) renderModule('Kabine'); // Startet immer mit der Kabine
        }

        function closeBriefcase() { document.getElementById('briefcase-overlay').style.display = 'none'; }

        function renderModule(name) {
            const content = document.getElementById('briefcase-content');
            content.innerHTML = "";
            if(window['Sektor' + name]) window['Sektor' + name].render();
        }

        window.addEventListener('load', () => { calibrate(); window.PitchEngine.init(); window.ToniBrain.firstGreeting(); });
        window.addEventListener('resize', calibrate);
    </script>
</body>
</html>
