<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="top-bar">
        <div class="luxury-logo" style="font-size:20px;">TONI 2.0</div>
        
        <div class="status-hub">
            <div class="status-item"><div id="lamp-api" class="lamp"></div> DATA API</div>
            <div class="status-item"><div id="lamp-ollama" class="lamp"></div> NEURAL CORE</div>
        </div>

        <div id="clock-display" style="font-family:'Orbitron'; color:#444; font-size:11px;">00:00:00</div>
        <div style="font-family:'Orbitron'; color:var(--neon-gold); font-size:12px;">4.500.000 €</div>
    </header>

    <div class="main-layout">
        <nav class="nav-sidebar">
            <button class="nav-item" onclick="loadModule('tactics')">TACTICAL CO-PILOT</button>
            <button class="nav-item" onclick="loadModule('kader')">KABINE</button>
            <button class="nav-item active" onclick="loadModule('press')">PRESS BUREAU</button>
            <button class="nav-item" onclick="loadModule('nlz')">ACADEMY HUB</button>
        </nav>

        <main id="stage-content"></main>

        <aside id="tools-sidebar">
            <div id="ai-log"></div>
            <div style="padding:20px; border-top:1px solid #111;">
                <button id="voice-btn" class="live-btn" onclick="toggleVoiceAI()" style="background:#ff003c; color:#fff; width:100%; padding:12px; margin-bottom:10px; border:none; font-family:'Orbitron'; font-size:10px; cursor:pointer;">VOICE MODE</button>
                <div id="interview-ui" class="hidden">
                    <input type="text" id="ai-input" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#fff; margin-bottom:10px;" placeholder="Antwort...">
                    <button onclick="processInterview()" style="width:100%; padding:10px; border:1px solid var(--neon-cyan); color:var(--neon-cyan); background:transparent; font-family:'Orbitron'; font-size:10px; cursor:pointer;">SENDEN</button>
                </div>
                <button id="start-btn" onclick="startInterview()" style="width:100%; padding:12px; border:1px solid var(--neon-gold); color:var(--neon-gold); background:transparent; font-family:'Orbitron'; font-size:10px; cursor:pointer;">INTERVIEW STARTEN</button>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
