<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TONI 2.0 | DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="top-bar">
        <div class="luxury-logo" style="font-size:20px;">TONI 2.0</div>
        <div id="clock-display">00:00:00</div>
        <div id="budget-display" style="color:var(--neon-gold); font-family:'Orbitron'; font-size:12px;">4.500.000 €</div>
    </header>

    <div class="main-layout">
        <nav class="nav-sidebar">
            <div class="nav-group-title">COMMAND</div>
            <button class="nav-item" onclick="loadModule('tactics')"><i class="fa-solid fa-compass-drafting"></i> TACTICS</button>
            <button class="nav-item" onclick="loadModule('kader')"><i class="fa-solid fa-shirt"></i> KABINE</button>
            <button class="nav-item" onclick="loadModule('office')"><i class="fa-solid fa-chart-line"></i> OFFICE</button>
            <div class="nav-group-title">INFRASTRUCTURE</div>
            <button class="nav-item active" onclick="loadModule('press')"><i class="fa-solid fa-newspaper"></i> PRESS BUREAU</button>
            <button class="nav-item" onclick="loadModule('nlz')"><i class="fa-solid fa-address-card"></i> NLZ</button>
            <button class="nav-item" onclick="loadModule('video')"><i class="fa-solid fa-clapperboard"></i> VIDEO</button>
        </nav>

        <main id="stage-content"></main>

        <aside id="tools-sidebar">
            <div id="ai-log"></div>
            <div class="ai-controls">
                <button id="voice-btn" class="live-btn" onclick="toggleVoiceAI()">VOICE MODE</button>
                <div id="interview-ui" class="hidden">
                    <input type="text" id="ai-input" class="auth-input" placeholder="Antwort..." onkeypress="if(event.key==='Enter') processInterview()">
                    <button class="btn-main" onclick="processInterview()">SENDEN</button>
                </div>
                <button id="start-btn" class="btn-main" onclick="startInterview()">INTERVIEW STARTEN</button>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
